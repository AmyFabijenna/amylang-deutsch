<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Hausübungen - Amy Lang Deutsch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #FFB6C1 0%, #FFA07A 50%, #FFD1DC 100%);
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-top: 100px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .login-box h1 {
            color: #8B4513;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8B4513;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 1em;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 1em;
            width: 100%;
        }

        .btn-primary {
            background: #FF69B4;
            color: white;
            border: 2px solid rgba(255, 105, 180, 0.5);
        }

        .btn-primary:hover {
            background: #FF1493;
            transform: translateY(-2px);
        }

        header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: #8B4513;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .section {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #8B4513;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .hw-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #FF69B4;
        }

        .hw-card.completed {
            border-left-color: #90EE90;
            opacity: 0.7;
        }

        .hw-title {
            color: #8B4513;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .hw-description {
            color: #8B4513;
            margin-bottom: 15px;
        }

        .hw-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }

        .hw-response textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        .btn-success {
            background: #90EE90;
            color: #2d5016;
        }

        .btn-success:hover {
            background: #7CCD7C;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8B4513;
        }

        .response-display {
            background: rgba(144, 238, 144, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .logout-btn {
            background: rgba(139, 69, 19, 0.2);
            color: #8B4513;
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            float: right;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginScreen" class="login-box">
            <h1>Login - Amy Lang Deutsch</h1>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail">
            </div>
            <div class="form-group">
                <label>Passwort</label>
                <input type="password" id="loginPassword">
            </div>
            <button class="btn btn-primary" onclick="login()">Einloggen</button>
        </div>

        <div id="mainContent" class="hidden">
            <header>
                <button class="logout-btn" onclick="logout()">Abmelden</button>
                <h1 id="welcomeText">Meine Hausübungen</h1>
                <p>Hier findest du alle deine aktuellen und erledigten Aufgaben</p>
            </header>

            <div class="section">
                <h2>📝 Offene Hausübungen</h2>
                <div id="pendingHw">
                    <div class="empty-state">
                        <h3>Lade Hausübungen...</h3>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>✅ Erledigte Hausübungen</h2>
                <div id="completedHw">
                    <div class="empty-state">
                        <p>Noch keine erledigten Hausübungen</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, query, where, onSnapshot, updateDoc, doc, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBU3231QacwG-xey5KMyM9roQ3ZkpQ6bCE",
            authDomain: "amy-lang---huepp.firebaseapp.com",
            projectId: "amy-lang---huepp",
            storageBucket: "amy-lang---huepp.firebasestorage.app",
            messagingSenderId: "54316876573",
            appId: "1:54316876573:web:3e3788a6db18cdab5ed7f4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentStudent = null;

        window.login = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                alert('Bitte Email und Passwort eingeben.');
                return;
            }

            const studentsQuery = query(
                collection(db, 'students'), 
                where('email', '==', email),
                where('password', '==', password)
            );
            
            const snapshot = await getDocs(studentsQuery);
            
            if (snapshot.empty) {
                alert('Falsche Email oder Passwort.');
                return;
            }

            currentStudent = { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
            document.getElementById('welcomeText').textContent = `Hallo ${currentStudent.name}!`;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');

            loadHomework();
        }

        window.logout = function() {
            currentStudent = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function loadHomework() {
            const hwQuery = query(collection(db, 'homework'), where('studentId', '==', currentStudent.id));
            onSnapshot(hwQuery, (snapshot) => {
                const homework = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderHomework(homework);
            });
        }

        function renderHomework(homework) {
            const pending = homework.filter(hw => !hw.completed);
            const completed = homework.filter(hw => hw.completed);

            const pendingEl = document.getElementById('pendingHw');
            if (pending.length === 0) {
                pendingEl.innerHTML = '<div class="empty-state"><h3>🎉 Keine offenen Hausübungen!</h3></div>';
            } else {
                pendingEl.innerHTML = pending.map(hw => createHwCard(hw, false)).join('');
            }

            const completedEl = document.getElementById('completedHw');
            if (completed.length === 0) {
                completedEl.innerHTML = '<div class="empty-state"><p>Noch keine erledigten Hausübungen</p></div>';
            } else {
                completedEl.innerHTML = completed.map(hw => createHwCard(hw, true)).join('');
            }
        }

        function createHwCard(hw, isCompleted) {
            const typeText = hw.type === 'text' ? 'Text-Antwort' : hw.type === 'checkbox' ? 'Abhaken' : 'Foto-Upload';
            
            return `
                <div class="hw-card ${isCompleted ? 'completed' : ''}">
                    <div class="hw-title">${hw.title}</div>
                    ${hw.description ? `<div class="hw-description">${hw.description}</div>` : ''}
                    <div class="hw-meta">
                        <span>📅 ${new Date(hw.dueDate).toLocaleDateString('de-DE')}</span>
                        <span>📝 ${typeText}</span>
                        <span>${isCompleted ? '✅ Erledigt' : '⭕ Offen'}</span>
                    </div>
                    ${isCompleted ? 
                        (hw.response ? `<div class="response-display"><strong>Deine Antwort:</strong> ${hw.response}</div>` : '') :
                        createResponseSection(hw)
                    }
                </div>
            `;
        }

        function createResponseSection(hw) {
            if (hw.type === 'text') {
                return `
                    <div class="hw-response">
                        <textarea id="response-${hw.id}" placeholder="Schreibe deine Antwort hier..."></textarea>
                        <button class="btn btn-primary" style="margin-top: 10px;" onclick="window.submitResponse('${hw.id}', 'text')">Absenden</button>
                    </div>
                `;
            } else if (hw.type === 'checkbox') {
                return `
                    <div class="hw-response">
                        <button class="btn btn-success" onclick="window.submitResponse('${hw.id}', 'checkbox')">Als erledigt markieren</button>
                    </div>
                `;
            } else if (hw.type === 'photo') {
                return `
                    <div class="hw-response">
                        <input type="file" id="photo-${hw.id}" accept="image/*">
                        <button class="btn btn-primary" style="margin-top: 10px;" onclick="window.submitResponse('${hw.id}', 'photo')">Foto hochladen</button>
                    </div>
                `;
            }
        }

        window.submitResponse = async function(hwId, type) {
            let response = '';
            
            if (type === 'text') {
                response = document.getElementById(`response-${hwId}`).value.trim();
                if (!response) {
                    alert('Bitte schreibe eine Antwort.');
                    return;
                }
            } else if (type === 'checkbox') {
                response = 'Erledigt ✓';
            } else if (type === 'photo') {
                const fileInput = document.getElementById(`photo-${hwId}`);
                if (!fileInput.files[0]) {
                    alert('Bitte wähle ein Foto aus.');
                    return;
                }
                response = `Foto hochgeladen: ${fileInput.files[0].name}`;
            }

            try {
                await updateDoc(doc(db, 'homework', hwId), {
                    completed: true,
                    response: response,
                    completedAt: new Date().toISOString()
                });
            } catch (error) {
                alert('Fehler beim Absenden: ' + error.message);
            }
        }
    </script>
</body>
</html>
