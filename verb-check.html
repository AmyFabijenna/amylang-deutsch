<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verben nachschlagen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece7df;
  --card:#f9f7f3;
  --line:#ddd6cb;
  --ink:#1c1b19;
  --soft:#5e5a54;
  --nom:#596274;  --nom-t:#e6e8ed;
  --akk:#34557a;  --akk-t:#e1e8f1;
  --dat:#22666d;  --dat-t:#dceced;
  --gen:#65507e;  --gen-t:#ebe5f1;
  --prep:#86643a; --prep-t:#f1e8da;
  --blue:#2f4f78; --blue-soft:#c9d4e4; --blue-wash:#dbe3ee;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Lexend",system-ui,sans-serif;
  font-size:19px;
  line-height:1.6;
  font-weight:300;
  min-height:100vh;
  background-image:linear-gradient(180deg,#d6dfeb 0px,#e3e4e6 320px,var(--bg) 620px);
  background-repeat:no-repeat;
}
main{max-width:760px;margin:0 auto;padding:9vh 16px 60px}
h1{
  font-weight:500;font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--blue);text-align:center;margin:0 0 24px;
}
h1::after{content:"";display:block;width:46px;height:3px;border-radius:3px;background:var(--blue);opacity:.55;margin:12px auto 0}
.searchwrap{position:relative}
#q{
  width:100%;
  font:inherit;font-size:1.65rem;font-weight:400;
  padding:22px 28px;
  border:1.5px solid var(--blue-soft);
  border-radius:22px;
  background:var(--card);
  color:var(--ink);
  outline:none;
  box-shadow:0 6px 24px rgba(60,50,35,.07);
  transition:border-color .2s, box-shadow .2s;
}
#q:focus{border-color:var(--blue);box-shadow:0 8px 34px rgba(47,79,120,.20)}
#q::placeholder{color:#a39d94;font-weight:300}
#sugg{
  list-style:none;margin:10px 0 0;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 10px 30px rgba(60,50,35,.09);
  display:none;
}
#sugg.open{display:block}
#sugg li{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:10px 18px;border-radius:12px;cursor:pointer;
}
#sugg li.act,#sugg li:hover{background:var(--blue-wash)}
#sugg .v{font-weight:400}
#sugg .s{font-size:.82rem;color:var(--soft);text-align:right}
.hint{text-align:center;color:var(--soft);font-size:.92rem;margin-top:18px}
.hint a{color:var(--akk);text-decoration:none;cursor:pointer;border-bottom:1px solid #c5cfdc}
.empty{text-align:center;color:var(--soft);margin-top:30px}

#card{
  margin-top:30px;background:var(--card);border:1px solid var(--line);
  border-radius:24px;padding:34px 36px;box-shadow:0 10px 34px rgba(47,79,120,.10);
  border-top:5px solid var(--blue);
  display:none;
}
#card.show{display:block}
.verb{font-size:2.3rem;font-weight:500;line-height:1.2;margin:0 0 20px}
.pattern{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.or{color:var(--soft);font-size:.85rem;margin:10px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.plus{color:var(--soft);font-weight:400}
.chip{
  display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;
  padding:8px 16px;border-radius:14px;font-weight:500;font-size:1rem;
}
.chip small{font-weight:300;font-size:.75rem;opacity:.85}
.chip.nom{background:var(--nom-t);color:var(--nom)}
.chip.akk{background:var(--akk-t);color:var(--akk)}
.chip.dat{background:var(--dat-t);color:var(--dat)}
.chip.gen{background:var(--gen-t);color:var(--gen)}
.desc{font-size:.88rem;color:var(--soft);margin:4px 0 0}
h2{
  font-size:.82rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:var(--blue);margin:30px 0 10px;
}
.sec{margin-top:34px;padding-top:6px;border-top:1px solid var(--line)}
.sec>h2{margin-top:22px}
.kl{display:inline-block;margin-left:10px;padding:2px 12px;border-radius:999px;font-size:.78rem;letter-spacing:.02em;text-transform:none;font-weight:400;vertical-align:1px}
.kl.r{background:var(--dat-t);color:var(--dat)}
.kl.u{background:var(--gen-t);color:var(--gen)}
.kl.g,.kl.m{background:var(--akk-t);color:var(--akk)}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ft{min-width:0;overflow-wrap:anywhere;hyphens:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ft small{display:block;font-size:.72rem;color:var(--soft);letter-spacing:.04em}
.ft b{display:block;font-weight:500;font-size:1.08rem;line-height:1.35;margin-top:3px}
.ft b em{font-style:normal;color:var(--blue)}
.fcap{margin:-4px 0 10px;font-size:.82rem;color:var(--soft)}
.fnote{margin:10px 0 0;font-size:.9rem;color:var(--soft)}
.part{display:grid;grid-template-columns:150px 1fr;gap:4px 18px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.part:first-of-type{border-top:none}
.part .lab{font-size:.8rem;color:var(--soft);line-height:1.35}
.part .lab b{display:block;color:var(--blue);font-weight:500;font-size:1rem}
.part .ph{font-size:1.05rem}
.part .no{color:#8d877e;text-decoration:line-through;text-decoration-color:#b1776f;text-decoration-thickness:2px}
.nobadge{display:inline-block;margin-left:10px;padding:1px 10px;border-radius:999px;background:#f2e3e0;color:#8a4a42;font-size:.75rem;text-decoration:none}
.okbadge{display:inline-block;margin-left:10px;padding:1px 10px;border-radius:999px;background:var(--dat-t);color:var(--dat);font-size:.75rem}
.phint{font-size:.85rem;color:var(--soft);margin:8px 0 0}
.ex{margin:0;padding:0;list-style:none}
.ex li{padding:10px 0 10px 18px;border-left:3px solid var(--line);margin-bottom:8px}
mark{background:none;padding:1px 5px;border-radius:7px;font-weight:400}
mark.m-N{color:var(--nom);background:var(--nom-t)}
mark.m-A{color:var(--akk);background:var(--akk-t)}
mark.m-D{color:var(--dat);background:var(--dat-t)}
mark.m-G{color:var(--gen);background:var(--gen-t)}
.prep{padding:14px 0;border-top:1px solid var(--line)}
.prep:first-of-type{border-top:none}
.pl{font-weight:500}
.pl .pc{padding:1px 8px;border-radius:7px;margin-left:2px}
.pc.Akk{color:var(--akk);background:var(--akk-t)}
.pc.Dat{color:var(--dat);background:var(--dat-t)}
.pc.Gen{color:var(--gen);background:var(--gen-t)}
.pc.Nom{color:var(--nom);background:var(--nom-t)}
.pe{color:var(--ink);margin-top:2px}
.note{
  margin-top:26px;padding:14px 18px;border-radius:14px;
  background:var(--prep-t);color:#5a4426;font-size:.95rem;
}
footer{text-align:center;color:#8f887e;font-size:.8rem;margin-top:40px}
@media (max-width:640px){
  .forms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .part{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{font-size:17px}
  #q{font-size:1.3rem;padding:18px 20px}
  #card{padding:24px 20px}
  .verb{font-size:1.9rem}
  #sugg .s{display:none}
}
</style>
</head>
<body>
<main>
  <h1>Verben nachschlagen</h1>
  <div class="searchwrap">
    <input id="q" type="text" placeholder="Verb eintippen …" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Verb suchen">
    <ul id="sugg" role="listbox"></ul>
  </div>
  <p class="hint" id="hint">z. B. <a data-v="helfen">helfen</a> · <a data-v="schenken">schenken</a> · <a data-v="warten">warten</a> · <a data-v="fragen">fragen</a> · <a data-v="gedenken">gedenken</a></p>
  <p class="empty" id="empty" hidden></p>
  <section id="card" aria-live="polite"></section>
  <footer id="count"></footer>
</main>

<script>
/* Format: [Verb, Muster (mehrere mit |), Beispiel 1, Beispiel 2, [[Präposition, Beispiel], …], Hinweis]
   Markierungen im Satz: {A …} Akkusativ, {D …} Dativ, {G …} Genitiv, {N …} Nominativ */
const V = [
["abfahren","N","Der Zug fährt um acht Uhr ab.","Wann fahrt ihr morgen ab?",[["nach + Dat","Wir fahren morgen nach {D Salzburg} ab."],["von + Dat","Der Bus fährt von {D dem Bahnhof} ab."]]],
["abfragen","AA","Die Lehrerin fragt {A mich} {A die Vokabeln} ab.","Kannst du {A mich} {A das Gedicht} abfragen?"],
["abgeben","DA|A","Ich gebe {D dem Lehrer} {A das Heft} ab.","Bitte gib {A deine Jacke} an der Garderobe ab.",[["an + Akk","Er gibt {A einen Teil} an {A seine Schwester} ab."]]],
["abhängen","N","Alles hängt vom Wetter ab.","Ob wir fahren, hängt noch ab.",[["von + Dat","Das hängt von {D dir} ab."]]],
["abholen","A","Ich hole {A dich} um sechs ab.","Sie holt {A die Kinder} ab.",[["von + Dat","Ich hole {A dich} von {D der Arbeit} ab."]]],
["ablehnen","A","Er lehnt {A das Angebot} ab.","Die Firma hat {A meine Bewerbung} abgelehnt."],
["abnehmen","N|DA","Ich habe zwei Kilo abgenommen.","Darf ich {D Ihnen} {A den Mantel} abnehmen?"],
["abraten","D","Ich rate {D dir} davon ab.","Der Arzt hat {D ihr} abgeraten.",[["von + Dat","Ich rate {D dir} von {D dieser Reise} ab."]]],
["absagen","DA|A","Ich muss {D dir} {A den Termin} leider absagen.","Sie hat {A die Party} abgesagt."],
["abschließen","A","Schließ bitte {A die Tür} ab.","Er hat {A sein Studium} abgeschlossen.",[["mit + Dat","Ich habe mit {D diesem Thema} abgeschlossen."]]],
["abwaschen","A|N","Ich wasche {A das Geschirr} ab.","Wer wäscht heute ab?"],
["achten","N","Er achtet sehr auf seine Gesundheit.","Achte beim Schreiben auf die Groß- und Kleinschreibung!",[["auf + Akk","Bitte achte auf {A den Verkehr}!"]]],
["ähneln","D","Sie ähnelt {D ihrer Mutter}.","Die beiden Bilder ähneln {D sich} sehr."],
["ändern","A|rA","Ich ändere {A meinen Plan}.","Das Wetter ändert {A sich} schnell.",[["an + Dat","Daran kann man nichts ändern."]]],
["anbieten","DA","Darf ich {D Ihnen} {A einen Kaffee} anbieten?","Die Firma bietet {D ihm} {A eine Stelle} an."],
["anfangen","A|N","Der Kurs fängt um neun an.","Ich fange {A eine neue Arbeit} an.",[["mit + Dat","Wir fangen mit {D der ersten Übung} an."]]],
["angehören","D","Er gehört {D dem Verein} seit Jahren an.","Sie gehört {D der Gruppe} nicht mehr an."],
["angreifen","A","Der Hund greift {A den Briefträger} an.","Die Mannschaft greift {A das Tor} an."],
["ankommen","N","Wir kommen um zehn an.","Ist das Paket schon angekommen?",[["in + Dat","Der Zug kommt in {D Linz} an."],["auf + Akk","Es kommt auf {A das Wetter} an."],["bei + Dat","Die Idee kommt bei {D den Kunden} gut an."]]],
["anklagen","AG|A","Man klagt {A den Mann} {G des Diebstahls} an.","Der Staatsanwalt hat {A ihn} angeklagt.",[["wegen + Gen","Sie wurde wegen {G Betrugs} angeklagt."]],"Genitivverb: jemanden (Akk) einer Sache (Gen) anklagen."],
["anmelden","A|rA","Ich melde {A mein Kind} in der Schule an.","Hast du {A dich} schon angemeldet?",[["sich bei + Dat","Ich melde mich bei {D der Gemeinde} an."],["sich für + Akk","Sie meldet sich für {A den Kurs} an."],["sich zu + Dat","Er meldet sich zu {D der Prüfung} an."]]],
["annehmen","A|rG","Ich nehme {A das Angebot} gern an.","Sie nimmt {A sich} {G des Problems} an.",[],"„etwas annehmen“ = akzeptieren oder vermuten (Akk); gehoben „sich einer Sache annehmen“ = sich darum kümmern (Gen)."],
["anrufen","A","Ich rufe {A dich} morgen an.","Hast du {A deine Mutter} schon angerufen?",[["bei + Dat","Ich rufe bei {D der Firma} an."]],"Achtung: jemanden (Akkusativ!) anrufen – nicht „ihm anrufen“."],
["anschauen","A|rD","Wir schauen {A das Foto} an.","Ich schaue {D mir} {A den Film} an."],
["sich anschließen","rAD","Ich schließe {A mich} {D dir} an.","Darf ich {A mich} {D euch} anschließen?"],
["ansehen","A|rD","Sie sieht {A mich} lange an.","Wir sehen {D uns} {A die Wohnung} an."],
["antworten","D","Bitte antworte {D mir} bald.","Er hat {D dem Lehrer} nicht geantwortet.",[["auf + Akk","Sie antwortet auf {A die Frage}."]],"Vergleiche: antworten + Dativ / auf + Akk, aber beantworten + Akkusativ."],
["anziehen","A|rA|rD","Ich ziehe {A den Mantel} an.","Ich ziehe {D mir} {A die Jacke} an.",[],"Ich ziehe {A mich} an (sich = Akk). Mit Kleidungsstück: Ich ziehe {D mir} {A den Pullover} an (sich = Dat)."],
["applaudieren","D","Das Publikum applaudiert {D den Musikern}.","Alle applaudierten {D ihr}."],
["arbeiten","N","Sie arbeitet in einer Bank.","Er arbeitet zu viel.",[["an + Dat","Ich arbeite an {D einem Projekt}."],["bei + Dat","Er arbeitet bei {D einer großen Firma}."],["als + Nom","Sie arbeitet als {N Lehrerin}."]]],
["ärgern","A|rA","Mein Bruder ärgert {A mich} ständig.","Ärgere {A dich} nicht!",[["sich über + Akk","Sie ärgert sich über {A den Lärm}."]]],
["assistieren","D","Die Schwester assistiert {D dem Arzt}.","Er assistiert {D dem Professor}."],
["auffallen","D","Ist {D dir} etwas aufgefallen?","Der Fehler fiel {D niemandem} auf."],
["aufhören","N","Hör endlich auf!","Der Regen hört bald auf.",[["mit + Dat","Er hört mit {D dem Rauchen} auf."]]],
["aufmachen","A|DA","Mach bitte {A das Fenster} auf.","Kannst du {D mir} {A die Tür} aufmachen?"],
["aufpassen","N","Pass gut auf!","Im Unterricht muss man aufpassen.",[["auf + Akk","Ich passe auf {A die Kinder} auf."]]],
["aufräumen","A|N","Ich räume {A mein Zimmer} auf.","Wir müssen noch aufräumen."],
["aufstehen","N","Ich stehe um sechs auf.","Wann bist du heute aufgestanden?"],
["aufwachen","N","Ich wache früh auf.","Das Baby ist aufgewacht."],
["ausfüllen","A","Bitte füllen Sie {A das Formular} aus.","Ich habe {A den Antrag} ausgefüllt."],
["ausgeben","A","Sie gibt {A viel Geld} aus.","Wie viel hast du ausgegeben?",[["für + Akk","Er gibt alles für {A Bücher} aus."],["sich als + Nom","Er gibt sich als {N Arzt} aus."]]],
["ausleihen","DA|rD","Ich leihe {D dir} {A mein Fahrrad} aus.","Ich leihe {D mir} {A ein Buch} aus.",[["von + Dat","Ich leihe mir das Auto von {D meinem Bruder} aus."]]],
["ausmachen","A|D","Mach bitte {A das Licht} aus.","Macht es {D dir} etwas aus, wenn ich das Fenster öffne?",[],"„Das macht mir nichts aus“ = Das stört mich nicht (Dativ)."],
["ausruhen","rA","Ich ruhe {A mich} kurz aus.","Ruh {A dich} gut aus!",[["sich von + Dat","Sie ruht sich von {D der Reise} aus."]]],
["aussehen","N","Du siehst müde aus.","Das Kleid sieht toll aus.",[["nach + Dat","Es sieht nach {D Regen} aus."],["wie + Nom","Er sieht aus wie {N sein Vater}."]]],
["aussteigen","N","Wir steigen hier aus.","An der nächsten Haltestelle müssen Sie aussteigen.",[["aus + Dat","Sie steigt aus {D dem Bus} aus."]]],
["aussuchen","A|rD","Such {A ein Geschenk} aus!","Ich suche {D mir} {A ein Kleid} aus."],
["ausweichen","D","Der Fahrer weicht {D dem Reh} aus.","Sie weicht {D meiner Frage} aus."],
["backen","A|DA","Ich backe {A einen Kuchen}.","Oma hat {D uns} {A Kekse} gebacken."],
["baden","N|A","Ich bade gern.","Sie badet {A das Baby}."],
["bauen","A","Wir bauen {A ein Haus}.","Die Kinder bauen {A eine Sandburg}.",[["auf + Akk","Ich baue auf {A dich}."]]],
["beantworten","A","Bitte beantworten Sie {A die Frage}.","Er hat {A meinen Brief} nie beantwortet.",[],"beantworten + Akkusativ, aber antworten + Dativ (jemandem) bzw. auf + Akk."],
["sich bedanken","rA","Ich bedanke {A mich} herzlich.","Hast du {A dich} schon bedankt?",[["bei + Dat","Ich bedanke mich bei {D Ihnen}."],["für + Akk","Sie bedankt sich für {A das Geschenk}."]]],
["bedeuten","A|DA","Diese Farbe bedeutet {A Gefahr}.","Du bedeutest {D mir} {A sehr viel}."],
["bedienen","A|rG","Die Kellnerin bedient {A die Gäste}.","Er bedient {A sich} {G eines Tricks}.",[],"Gehoben mit Genitiv: sich einer Sache bedienen = etwas benutzen."],
["bedürfen","G","Das bedarf {G einer Erklärung}.","Der Kranke bedarf {G der Ruhe}.",[],"Genitivverb (gehoben): einer Sache bedürfen = etwas brauchen."],
["beeilen","rA","Ich muss {A mich} beeilen.","Beeil {A dich}, der Bus kommt!"],
["beeinflussen","A","Die Werbung beeinflusst {A die Menschen}.","Das Wetter beeinflusst {A meine Laune}."],
["beenden","A","Wir beenden {A die Stunde}.","Sie hat {A ihr Studium} beendet."],
["befehlen","DA|D","Der Offizier befiehlt {D den Soldaten} {A den Rückzug}.","Du hast {D mir} nichts zu befehlen!"],
["befinden","rA","Das Hotel befindet {A sich} im Zentrum.","Wo befindet {A sich} der Ausgang?"],
["befreien","A","Die Feuerwehr befreit {A den Fahrer}.","Sie befreit {A die Katze}.",[["von + Dat","Er befreit {A sich} von {D seinen Sorgen}."],["aus + Dat","Man befreite {A ihn} aus {D dem Auto}."]]],
["begegnen","D","Ich bin {D meinem Lehrer} im Supermarkt begegnet.","Wir begegnen {D uns} oft im Park.",[],"Perfekt mit „sein“: Ich bin ihm begegnet."],
["beginnen","A|N","Der Film beginnt um acht.","Sie beginnt {A ein neues Leben}.",[["mit + Dat","Wir beginnen mit {D der ersten Übung}."]]],
["begleiten","A","Ich begleite {A dich} nach Hause.","Er begleitet {A die Sängerin} am Klavier."],
["begreifen","A","Ich begreife {A das} nicht.","Er hat {A die Regel} schnell begriffen."],
["begrüßen","A","Der Lehrer begrüßt {A die Schüler}.","Wir begrüßen {A Sie} herzlich."],
["behalten","A","Darf ich {A das Buch} behalten?","Sie behält {A die Ruhe}.",[["für + Akk","Behalte das bitte für {A dich}."]]],
["behandeln","A","Der Arzt behandelt {A den Patienten}.","Er behandelt {A seine Kollegen} fair."],
["behaupten","A|rA","Er behauptet {A das Gegenteil}.","Sie konnte {A sich} gut behaupten."],
["beibringen","DA","Ich bringe {D dir} {A das Schwimmen} bei.","Wer hat {D dir} {A das} beigebracht?"],
["beißen","A|N","Der Hund hat {A den Jungen} gebissen.","Beißt der Hund?",[["in + Akk","Er beißt in {A den Apfel}."]]],
["beistehen","D","Ich stehe {D dir} bei.","Freunde stehen {D einander} bei."],
["beitragen","A|N","Er trägt {A einen Teil} bei.","Jeder kann etwas beitragen.",[["zu + Dat","Jeder trägt zu {D dem Erfolg} bei."]]],
["bekämpfen","A","Wir bekämpfen {A die Armut}.","Man muss {A das Problem} bekämpfen."],
["bekommen","A","Ich bekomme {A einen Brief}.","Hast du {A meine Nachricht} bekommen?",[],"Achtung: „bekommen“ heißt nicht „werden“ (englisch „become“)."],
["beleidigen","A","Er hat {A mich} beleidigt.","Du darfst {A niemanden} beleidigen."],
["bemerken","A","Ich habe {A den Fehler} nicht bemerkt.","Hast du {A das} bemerkt?"],
["bemühen","rA","Ich bemühe {A mich} sehr.","Bitte bemühen Sie {A sich} nicht!",[["sich um + Akk","Er bemüht sich um {A eine Stelle}."]]],
["beneiden","A","Ich beneide {A dich}.","Alle beneiden {A sie}.",[["um + Akk","Ich beneide {A dich} um {A deinen Garten}."]]],
["benötigen","A","Wir benötigen {A Ihre Unterschrift}.","Ich benötige {A mehr Zeit}."],
["benutzen","A","Darf ich {A dein Handy} benutzen?","Benutz bitte {A den Aufzug}!"],
["beobachten","A","Die Katze beobachtet {A den Vogel}.","Ich beobachte {A die Sterne}."],
["beraten","A|N","Die Verkäuferin berät {A die Kundin}.","Wir beraten noch.",[["über + Akk","Wir beraten über {A das Problem}."],["bei + Dat","Sie berät {A mich} bei {D der Wahl}."],["sich mit + Dat","Ich berate mich mit {D meiner Familie}."]]],
["berauben","AG","Man hat {A ihn} {G seines Geldes} beraubt.","Der Krieg beraubte {A sie} {G ihrer Heimat}.",[],"Genitivverb: jemanden (Akk) einer Sache (Gen) berauben."],
["berichten","D|DA|N","Er berichtet {D uns} {A alles}.","Die Zeitung berichtet täglich.",[["über + Akk","Die Zeitung berichtet über {A den Unfall}."],["von + Dat","Sie berichtet von {D ihrer Reise}."]]],
["bereuen","A","Ich bereue {A nichts}.","Er bereut {A seine Entscheidung}."],
["beruhigen","A|rA","Die Mutter beruhigt {A das Baby}.","Beruhige {A dich}!"],

oll","hat vollgeschrieben","u","vollschreibend","vollgeschrieben","?","?+",""],"volltanken":["tankt voll","tankte voll","hat vollgetankt","r","volltankend","vollgetankt","?","?+",""],"wahrhaben":["hat wahr","hatte wahr","hat wahrgehabt","u","wahrhabend","wahrgehabt","?","?+",""],"wahrmachen":["macht wahr","machte wahr","hat wahrgemacht","r","wahrmachend","wahrgemacht","?","?+",""],"wahrsagen":["sagt wahr","sagte wahr","hat wahrgesagt","r","wahrsagend","wahrgesagt","?","?+",""],"weismachen":["macht weis","machte weis","hat weisgemacht","r","weismachend","weisgemacht","?","?+",""],"wettmachen":["macht wett","machte wett","hat wettgemacht","r","wettmachend","wettgemacht","?","?+",""],"zugrunde richten":["richtet zugrunde","richtete zugrunde","hat zugrunde gerichtet","r","zugrunde richtend","zugrunde gerichtet","?","?+",""],"zunichtemachen":["macht zunichte","machte zunichte","hat zunichtegemacht","r","zunichtemachend","zunichtegemacht","?","?+",""],"zustande bringen":["bringt zustande","brachte zustande","hat zustande gebracht","g","zustande bringend","zustande gebracht","?","?+",""],"zustande kommen":["kommt zustande","kam zustande","ist zustande gekommen","u","zustande kommend","zustande gekommen","?","?",""],"zuteilwerden":["wird zuteil","wurde zuteil","ist zuteilgeworden","u","zuteilwerdend","zuteilgeworden","?","?",""]};

const CASES = {
  Nom:{n:"Nominativ",q:"wer? was?",c:"nom"},
  Akk:{n:"Akkusativ",q:"wen? was?",c:"akk"},
  Dat:{n:"Dativ",q:"wem?",c:"dat"},
  Gen:{n:"Genitiv",q:"wessen?",c:"gen"}
};
const PAT = {
  N:  {p:[["Nom"]], d:"Kein Akkusativ- oder Dativobjekt.", s:"ohne Objekt"},
  A:  {p:[["Nom"],["Akk"]], s:"+ Akk"},
  D:  {p:[["Nom"],["Dat"]], s:"+ Dat"},
  DA: {p:[["Nom"],["Dat"],["Akk"]], d:"Person meist im Dativ, Sache im Akkusativ.", s:"+ Dat + Akk"},
  G:  {p:[["Nom"],["Gen"]], d:"Genitivverb – eher gehobene Sprache.", s:"+ Gen"},
  AG: {p:[["Nom"],["Akk"],["Gen"]], d:"Genitivverb: jemanden (Akk) einer Sache (Gen) …", s:"+ Akk + Gen"},
  AA: {p:[["Nom"],["Akk"],["Akk"]], d:"Zwei Akkusative: jemanden etwas …", s:"+ Akk + Akk"},
  NN: {p:[["Nom"],["Nom"]], d:"Gleichsetzung: beide Teile stehen im Nominativ.", s:"+ Nom"},
  rA: {p:[["Nom"],["Akk","sich"]], d:"Reflexiv: ich – mich, du – dich, er/sie – sich.", s:"sich (Akk)"},
  rD: {p:[["Nom"],["Dat","sich"],["Akk"]], d:"Reflexiv mit Dativ: ich – mir, du – dir, er/sie – sich.", s:"sich (Dat) + Akk"},
  rG: {p:[["Nom"],["Akk","sich"],["Gen"]], d:"Reflexiv mit Genitiv – gehobene Sprache.", s:"sich + Gen"},
  rAD:{p:[["Nom"],["Akk","sich"],["Dat"]], d:"Reflexiv (mich, dich, sich) plus Dativobjekt.", s:"sich + Dat"}
};

const norm = s => s.toLowerCase().replace(/^sich\s+/,"").replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").trim();
V.forEach(e => e.k = norm(e[0]));
V.sort((a,b)=>a[0].replace(/^sich /,"").localeCompare(b[0].replace(/^sich /,""),"de"));

const $ = id => document.getElementById(id);
const q=$("q"), sugg=$("sugg"), card=$("card"), empty=$("empty"), hint=$("hint");
$("count").textContent = V.length + " Verben";
let list=[], act=0;

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const mark = s => esc(s).replace(/\{([NADG]) ([^}]+)\}/g,'<mark class="m-$1">$2</mark>');

function chip(part){
  const c=CASES[part[0]];
  const label = part[1] ? "sich · "+c.n : c.n;
  return `<span class="chip ${c.c}"><b>${label}</b><small>${c.q}</small></span>`;
}
function patternHTML(code){
  const P=PAT[code];
  const chips=P.p.map(chip).join('<span class="plus">+</span>');
  return `<div class="pattern">${chips}</div>${P.d?`<p class="desc">${P.d}</p>`:""}`;
}
function prepHTML(verb,[label,ex]){
  const base=verb.replace(/^sich /,"");
  const refl=/^sich /.test(verb);
  let l=label, pre="";
  if(/^sich /.test(l)){ l=l.replace(/^sich /,""); pre="sich "; }
  else if(refl){ pre="sich "; }
  l=esc(l).replace(/\b(Akk|Dat|Gen|Nom)\b/,'<span class="pc $1">$1</span>');
  return `<div class="prep"><div class="pl">${pre}${esc(base)} ${l}</div><div class="pe">${mark(ex)}</div></div>`;
}

const KL={r:"regelmäßig",u:"unregelmäßig",g:"gemischt (regelmäßige und unregelmäßige Merkmale)",m:"Modalverb – unregelmäßig"};
function formsHTML(name){
  const f=F[name]; if(!f) return "";
  const [pr,pt,pf,k,p1,p2,x1,x2,note]=f;
  const per = name==="es gibt" ? "" : "er / sie / es";
  let h=`<div class="sec"><h2>Grundformen<span class="kl ${k}">${KL[k]}</span></h2>${per?`<p class="fcap">Formen für er / sie / es</p>`:""}<div class="forms">
    <div class="ft"><small>Infinitiv</small><b>${esc(name)}</b></div>
    <div class="ft"><small>Präsens</small><b>${esc(pr)}</b></div>
    <div class="ft"><small>Präteritum</small><b>${esc(pt)}</b></div>
    <div class="ft"><small>Perfekt</small><b>${esc(pf)}</b></div></div>`;
  if(note) h+=`<p class="fnote">${esc(note)}</p>`;
  h+=`</div><div class="sec"><h2>Partizipien als Adjektiv</h2>`;
  const row=(lab,form,ex)=>{
    if(ex==="?"||ex==="") return `<div class="part"><div class="lab"><b>${lab}</b></div><div class="ph">${esc(form||"–")}</div></div>`;
    if(ex==="?+") return `<div class="part"><div class="lab"><b>${lab}</b></div><div class="ph">${esc(form)}<span class="okbadge">als Adjektiv möglich</span></div></div>`;
    if(ex==="?-") return `<div class="part"><div class="lab"><b>${lab}</b></div><div class="ph"><span class="no">${esc(form)}</span><span class="nobadge">als Adjektiv nicht üblich</span></div></div>`;
    const no=ex.startsWith("!"); const t=ex.replace(/^!/,"");
    let ph;
    if(no && !t) ph=`<span class="no">${esc(form||"–")}</span><span class="nobadge">als Adjektiv nicht üblich</span>`;
    else if(no) ph=`<span class="no">${esc(t)}</span><span class="nobadge">gibt es nicht</span>`;
    else ph=esc(t);
    return `<div class="part"><div class="lab"><b>${lab}</b>${esc(form||"–")}</div><div class="ph">${ph}</div></div>`;
  };
  h+=row("Partizip I",p1,x1)+row("Partizip II",p2,x2);
  if((x2.startsWith("!") && x2.length>1)||x2==="?-") h+=`<p class="phint">Partizip II als Adjektiv geht nur bei Verben mit Akkusativobjekt (das gebackene Brot) oder bei Verben mit „sein“, die eine Veränderung ausdrücken (der angekommene Zug).</p>`;
  h+=`</div>`;
  return h;
}

function show(e){
  const codes=e[1].split("|");
  let h=`<div class="verb">${esc(e[0])}</div>`;
  codes.forEach((c,i)=>{ if(i) h+=`<div class="or">oder</div>`; h+=patternHTML(c); });
  if(e[2]||e[3]) h+=`<h2>Beispiele</h2><ul class="ex">${e[2]?`<li>${mark(e[2])}</li>`:""}${e[3]?`<li>${mark(e[3])}</li>`:""}</ul>`;
  if(e[4] && e[4].length){
    h+=`<h2>Mit Präposition</h2>`+e[4].map(p=>prepHTML(e[0],p)).join("");
  }
  if(e[5]) h+=`<div class="note">${mark(e[5])}</div>`;
  h+=formsHTML(e[0]);
  card.innerHTML=h; card.classList.add("show");
  empty.hidden=true; hint.hidden=true;
}

function search(val){
  const n=norm(val);
  if(!n){ return []; }
  const raw=val.toLowerCase().replace(/^sich\s+/,"").trim();
  const a=[],b=[],b2=[],c=[];
  V.forEach(e=>{
    const r=e[0].toLowerCase().replace(/^sich\s+/,"");
    if(e.k===n) a.push(e);
    else if(r.startsWith(raw)) b.push(e);
    else if(e.k.startsWith(n)) b2.push(e);
    else if(e.k.includes(n)) c.push(e);
  });
  const byLen=(x,y)=>x[0].length-y[0].length||x[0].localeCompare(y[0],"de");
  b.sort(byLen); b2.sort(byLen);
  return a.concat(b,b2,c).slice(0,8);
}
function renderSugg(){
  if(!list.length){ sugg.classList.remove("open"); sugg.innerHTML=""; return; }
  sugg.innerHTML=list.map((e,i)=>`<li role="option" data-i="${i}" class="${i===act?"act":""}"><span class="v">${esc(e[0])}</span><span class="s">${e[1].split("|").map(c=>PAT[c].s).join(" / ")}</span></li>`).join("");
  sugg.classList.add("open");
}
function choose(e){
  q.value=e[0]; list=[]; renderSugg(); show(e);
  try{ history.replaceState(null,"","#"+encodeURIComponent(e[0])); }catch(_){}
}

q.addEventListener("input",()=>{
  const val=q.value;
  list=search(val); act=0; renderSugg();
  const exact=V.find(e=>e.k===norm(val));
  if(exact){ show(exact); }
  else if(!val.trim()){ card.classList.remove("show"); empty.hidden=true; hint.hidden=false; }
  else if(!list.length){ card.classList.remove("show"); empty.hidden=false; hint.hidden=true;
    empty.textContent="Dieses Verb ist noch nicht in der Liste."; }
});
q.addEventListener("keydown",ev=>{
  if(ev.key==="ArrowDown"&&list.length){ act=(act+1)%list.length; renderSugg(); ev.preventDefault(); }
  else if(ev.key==="ArrowUp"&&list.length){ act=(act-1+list.length)%list.length; renderSugg(); ev.preventDefault(); }
  else if(ev.key==="Enter"&&list.length){ choose(list[act]); }
  else if(ev.key==="Escape"){ list=[]; renderSugg(); }
});
sugg.addEventListener("mousedown",ev=>{
  const li=ev.target.closest("li"); if(li){ ev.preventDefault(); choose(list[+li.dataset.i]); }
});
q.addEventListener("blur",()=>setTimeout(()=>{list=[];renderSugg();},120));
hint.addEventListener("click",ev=>{
  const a=ev.target.closest("a"); if(!a) return;
  const e=V.find(x=>x[0]===a.dataset.v); if(e) choose(e);
});
(function init(){
  const h=decodeURIComponent(location.hash.slice(1));
  const e=h&&V.find(x=>x.k===norm(h));
  if(e) choose(e); else q.focus();
})();
</script>
