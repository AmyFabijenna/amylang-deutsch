<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AmyLang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #FFA07A 0%, #FF7F50 50%, #FFB6C1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1 {
            color: #8B4513;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #8B4513;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139,69,19,0.3);
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #FF7F50;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #FF7F50, #FFA07A);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }

        .error-message {
            background: #f44336;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: rgba(139,69,19,0.1);
            color: #8B4513;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        .tab.active {
            background: #8B4513;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>AmyLang Login</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="switchLoginType('trainer')">Trainer</button>
            <button class="tab" onclick="switchLoginType('student')">Schüler</button>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Passwort</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-login">Anmelden</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = window.supabase;
        const supabaseUrl = 'https://hfdjnttxavlghjfnjkms.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZGpudHR4YXZsZ2hqZm5qa21zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2OTQwNTIsImV4cCI6MjA3NTI3MDA1Mn0.LBLAkKzkquHvAmvFix4jIrudCVMGGjs5kfvK4l0RfIM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let loginType = 'trainer';

        function switchLoginType(type) {
            loginType = type;
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('errorMessage').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Erfolgreicher Login - weiterleiten
                if (loginType === 'trainer') {
                    window.location.href = 'huepp.html';
                } else {
                    window.location.href = 'schueler.html';
                }

            } catch (error) {
                errorDiv.textContent = 'Login fehlgeschlagen: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });

        // Prüfe ob bereits eingeloggt
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                // Bereits eingeloggt - weiterleiten
                window.location.href = 'huepp.html';
            }
        });
    </script>
</body>
</html>
