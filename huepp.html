<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÜpp - Hausaufgaben Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #FFA07A 0%, #FF7F50 50%, #FFB6C1 100%);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Navigation */
        nav {
            background: rgba(139, 69, 19, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #FF7F50;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 127, 80, 0.5);
        }

        .back-btn:hover {
            background: #FF6347;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 99, 71, 0.3);
        }

        nav h1 {
            color: white;
            font-size: 2em;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h2 {
            color: #8B4513;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .header p {
            color: #8B4513;
        }

        /* Search & Actions */
        .action-bar {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 1em;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8B4513;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 1em;
        }

        .btn-primary {
            background: #FF7F50;
            color: white;
            border: 2px solid rgba(255, 127, 80, 0.5);
        }

        .btn-primary:hover {
            background: #FF6347;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 99, 71, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.3);
            color: #8B4513;
            border: 2px solid rgba(139, 69, 19, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(139, 69, 19, 0.2);
            transform: translateY(-2px);
        }

        /* Student Cards */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .student-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(139, 69, 19, 0.2);
            transition: all 0.3s ease;
        }

        .student-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 127, 80, 0.3);
            border-color: #FF7F50;
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .student-name {
            color: #8B4513;
            font-size: 1.3em;
            font-weight: bold;
        }

        .badge {
            background: rgba(255, 127, 80, 0.2);
            color: #8B4513;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .student-link {
            color: #FF6347;
            font-size: 0.9em;
            margin-bottom: 15px;
            display: block;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h3 {
            color: #8B4513;
            font-size: 1.5em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            color: #8B4513;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8B4513;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            background: white;
            font-family: inherit;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FF7F50;
        }

        /* Homework List */
        .hw-list {
            margin-top: 20px;
        }

        .hw-item {
            background: rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #FF7F50;
        }

        .hw-item.completed {
            border-left-color: #90EE90;
            opacity: 0.8;
        }

        .hw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .hw-title {
            color: #8B4513;
            font-weight: bold;
            font-size: 1.1em;
        }

        .hw-status {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hw-body {
            color: #8B4513;
            margin-bottom: 10px;
        }

        .hw-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
            color: #666;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .action-bar {
                flex-direction: column;
            }

            .students-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav>
            <a href="index.html" class="back-btn">← Zurück zur Hauptseite</a>
            <h1>HÜpp!</h1>
        </nav>

        <!-- Header -->
        <div class="header">
            <h2>Hausaufgaben-Manager</h2>
            <p>Verwalte deine Schüler und deren Hausübungen</p>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Suchen...">
            </div>
            <button class="btn btn-primary" onclick="openAddStudentModal()">+ Schüler</button>
        </div>

        <!-- Students Grid -->
        <div class="students-grid" id="studentsGrid">
            <div class="student-card" style="text-align: center; padding: 60px 20px;">
                <p style="color: #8B4513; font-size: 1.2em;">Noch keine Schüler vorhanden.</p>
                <p style="color: #8B4513; margin-top: 10px;">Füge deinen ersten Schüler hinzu!</p>
            </div>
        </div>

        <!-- Add Student Modal -->
        <div class="modal" id="addStudentModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Neuer Schüler</h3>
                    <button class="close-btn" onclick="closeModal('addStudentModal')">×</button>
                </div>
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="newStudentName">
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="addStudent()">Schüler hinzufügen</button>
            </div>
        </div>

        <!-- Add Homework Modal -->
        <div class="modal" id="addHomeworkModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Neue Hausübung</h3>
                    <button class="close-btn" onclick="closeModal('addHomeworkModal')">×</button>
                </div>
                <div class="form-group">
                    <label>Titel *</label>
                    <input type="text" id="hwTitle">
                </div>
                <div class="form-group">
                    <label>Beschreibung</label>
                    <textarea id="hwDescription" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Fälligkeitsdatum *</label>
                    <input type="date" id="hwDueDate">
                </div>
                <div class="form-group">
                    <label>Aufgabentyp *</label>
                    <select id="hwType">
                        <option value="text">Text-Antwort</option>
                        <option value="checkbox">Checkbox</option>
                        <option value="photo">Foto-Upload</option>
                    </select>
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="addHomework()">Hausübung hinzufügen</button>
            </div>
        </div>

        <!-- View Student Modal -->
        <div class="modal" id="viewStudentModal">
            <div class="modal-content" style="max-width: 800px;">
                <div class="modal-header">
                    <h3 id="viewStudentName">Schüler Details</h3>
                    <button class="close-btn" onclick="closeModal('viewStudentModal')">×</button>
                </div>
                <div class="hw-list" id="hwList"></div>
            </div>
        </div>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem('huapp_students') || '[]');
        let homework = JSON.parse(localStorage.getItem('huapp_homework') || '[]');
        let selectedStudent = null;

        function saveData() {
            localStorage.setItem('huapp_students', JSON.stringify(students));
            localStorage.setItem('huapp_homework', JSON.stringify(homework));
        }

        function renderStudents() {
            const grid = document.getElementById('studentsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = students.filter(s => 
                s.name.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="student-card" style="text-align: center; padding: 60px 20px;">
                        <p style="color: #8B4513; font-size: 1.2em;">Keine Schüler gefunden.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(student => {
                const pending = homework.filter(hw => hw.studentId === student.id && !hw.completed).length;
                return `
                    <div class="student-card">
                        <div class="student-header">
                            <div class="student-name">👤 ${student.name}</div>
                            ${pending > 0 ? `<span class="badge">${pending} offen</span>` : ''}
                        </div>
                        <div class="student-link">🔗 ${student.link || 'huepp.html?s=' + student.id.slice(-6)}</div>
                        <div class="card-actions">
                            <button class="btn btn-secondary" style="flex: 1;" onclick="viewStudent('${student.id}')">Ansehen</button>
                            <button class="btn btn-primary" style="flex: 1;" onclick="openAddHomeworkModal('${student.id}')">+ HÜ</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAddStudentModal() {
            document.getElementById('addStudentModal').classList.add('active');
        }

        function openAddHomeworkModal(studentId) {
            selectedStudent = studentId;
            document.getElementById('addHomeworkModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function addStudent() {
            const name = document.getElementById('newStudentName').value.trim();
            if (!name) {
                alert('Bitte Namen eingeben.');
                return;
            }

            const student = {
                id: Date.now().toString(),
                name: name,
                link: `huepp.html?s=${Date.now().toString().slice(-6)}`
            };

            students.push(student);
            saveData();
            renderStudents();
            closeModal('addStudentModal');
            document.getElementById('newStudentName').value = '';
        }

        function addHomework() {
            const title = document.getElementById('hwTitle').value.trim();
            const description = document.getElementById('hwDescription').value.trim();
            const dueDate = document.getElementById('hwDueDate').value;
            const type = document.getElementById('hwType').value;

            if (!title || !dueDate) {
                alert('Bitte Titel und Fälligkeitsdatum eingeben.');
                return;
            }

            const hw = {
                id: Date.now().toString(),
                studentId: selectedStudent,
                title: title,
                description: description,
                dueDate: dueDate,
                type: type,
                completed: false,
                response: null,
                createdAt: new Date().toISOString()
            };

            homework.push(hw);
            saveData();
            renderStudents();
            closeModal('addHomeworkModal');
            
            document.getElementById('hwTitle').value = '';
            document.getElementById('hwDescription').value = '';
            document.getElementById('hwDueDate').value = '';
        }

        function viewStudent(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            document.getElementById('viewStudentName').textContent = `Hausübungen - ${student.name}`;
            
            const studentHw = homework.filter(hw => hw.studentId === studentId);
            const hwListEl = document.getElementById('hwList');

            if (studentHw.length === 0) {
                hwListEl.innerHTML = `<p style="color: #8B4513; text-align: center;">Noch keine Hausübungen vorhanden.</p>`;
            } else {
                hwListEl.innerHTML = studentHw.map(hw => `
                    <div class="hw-item ${hw.completed ? 'completed' : ''}">
                        <div class="hw-header">
                            <div class="hw-title">${hw.title}</div>
                            <div class="hw-status">
                                ${hw.completed ? '✅' : '⭕'}
                            </div>
                        </div>
                        <div class="hw-body">${hw.description || 'Keine Beschreibung'}</div>
                        <div class="hw-meta">
                            <span>📅 ${new Date(hw.dueDate).toLocaleDateString('de-DE')}</span>
                            <span>📝 ${hw.type === 'text' ? 'Text' : hw.type === 'checkbox' ? 'Checkbox' : 'Foto'}</span>
                        </div>
                        ${hw.response ? `<div style="margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.5); border-radius: 8px; color: #8B4513;"><strong>Antwort:</strong> ${hw.response}</div>` : ''}
                    </div>
                `).join('');
            }

            document.getElementById('viewStudentModal').classList.add('active');
        }

        document.getElementById('searchInput').addEventListener('input', renderStudents);

        renderStudents();
    </script>
</body>
</html>
