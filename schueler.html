<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schüler Login - Amy Lang Deutsch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #FFB6C1 0%, #FFA07A 50%, #FFD1DC 100%);
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .login-box h1 {
            color: #8B4513;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8B4513;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 1em;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #FF69B4;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #FF1493;
            transform: translateY(-2px);
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #8B4513;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .hw-view {
            display: none;
        }

        .hw-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #FF69B4;
        }

        .hw-card.completed {
            border-left-color: #90EE90;
            opacity: 0.7;
        }

        .hw-title {
            color: #8B4513;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            margin-top: 10px;
        }

        .back-btn {
            display: inline-block;
            background: rgba(139, 69, 19, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login View -->
        <div id="loginView">
            <div class="login-box">
                <h1>🎓 Schüler Login</h1>
                <div id="errorMsg" class="error"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Passwort</label>
                        <input type="text" id="loginPassword" placeholder="z.B. katze, tiger, banane..." required>
                    </div>
                    <button type="submit" class="btn">Einloggen</button>
                </form>
            </div>
        </div>

        <!-- Homework View -->
        <div id="hwView" class="hw-view">
            <a href="index.html" class="back-btn">← Zurück zur Hauptseite</a>
            <div class="login-box">
                <h1 id="welcomeText">Meine Hausübungen</h1>
                <button class="btn" onclick="logout()" style="margin-bottom: 20px;">Ausloggen</button>
                
                <h2 style="color: #8B4513; margin: 20px 0;">📝 Offene Hausübungen</h2>
                <div id="pendingHw">
                    <p style="text-align: center; color: #8B4513;">Lade...</p>
                </div>

                <h2 style="color: #8B4513; margin: 20px 0;">✅ Erledigt</h2>
                <div id="completedHw">
                    <p style="text-align: center; color: #8B4513;">Keine erledigten Hausübungen</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, query, where, getDocs, onSnapshot, updateDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBU3231QacwG-xey5KMyM9roQ3ZkpQ6bCE",
            authDomain: "amy-lang---huepp.firebaseapp.com",
            projectId: "amy-lang---huepp",
            storageBucket: "amy-lang---huepp.firebasestorage.app",
            messagingSenderId: "54316876573",
            appId: "1:54316876573:web:3e3788a6db18cdab5ed7f4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentStudentId = null;
        let currentStudentName = '';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            try {
                const q = query(collection(db, 'students'), 
                    where('email', '==', email), 
                    where('password', '==', password));
                
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    document.getElementById('errorMsg').textContent = 'Email oder Passwort falsch!';
                    document.getElementById('errorMsg').style.display = 'block';
                    return;
                }
                
                const studentDoc = snapshot.docs[0];
                currentStudentId = studentDoc.id;
                currentStudentName = studentDoc.data().name;
                
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('hwView').style.display = 'block';
                document.getElementById('welcomeText').textContent = `Hallo ${currentStudentName}!`;
                
                loadHomework();
                
            } catch (error) {
                document.getElementById('errorMsg').textContent = 'Fehler: ' + error.message;
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        function loadHomework() {
            const hwQuery = query(collection(db, 'homework'), where('studentId', '==', currentStudentId));
            
            onSnapshot(hwQuery, (snapshot) => {
                const homework = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderHomework(homework);
            });
        }

        function renderHomework(homework) {
            const pending = homework.filter(hw => !hw.completed);
            const completed = homework.filter(hw => hw.completed);

            const pendingEl = document.getElementById('pendingHw');
            if (pending.length === 0) {
                pendingEl.innerHTML = '<p style="text-align: center; color: #8B4513;">🎉 Keine offenen Hausübungen!</p>';
            } else {
                pendingEl.innerHTML = pending.map(hw => createHwCard(hw, false)).join('');
            }

            const completedEl = document.getElementById('completedHw');
            if (completed.length === 0) {
                completedEl.innerHTML = '<p style="text-align: center; color: #8B4513;">Noch keine erledigten Hausübungen</p>';
            } else {
                completedEl.innerHTML = completed.map(hw => createHwCard(hw, true)).join('');
            }
        }

        function createHwCard(hw, isCompleted) {
            const typeText = hw.type === 'text' ? 'Text-Antwort' : hw.type === 'checkbox' ? 'Abhaken' : 'Foto-Upload';
            
            return `
                <div class="hw-card ${isCompleted ? 'completed' : ''}">
                    <div style="display: flex; justify-content: space-between;">
                        <div class="hw-title">${hw.title}</div>
                        <div style="font-size: 1.5em;">${isCompleted ? '✅' : '⭕'}</div>
                    </div>
                    ${hw.description ? `<p style="color: #8B4513; margin: 10px 0;">${hw.description}</p>` : ''}
                    <div style="font-size: 0.9em; color: #666; margin: 10px 0;">
                        📅 Bis: ${new Date(hw.dueDate).toLocaleDateString('de-DE')} | 📝 ${typeText}
                    </div>
                    ${isCompleted ? 
                        (hw.response ? `<div style="background: rgba(144,238,144,0.3); padding: 12px; border-radius: 8px; margin-top: 10px;"><strong>Deine Antwort:</strong> ${hw.response}</div>` : '') :
                        createResponseSection(hw)
                    }
                </div>
            `;
        }

        function createResponseSection(hw) {
            if (hw.type === 'text') {
                return `
                    <textarea id="response-${hw.id}" placeholder="Schreibe deine Antwort..."></textarea>
                    <button class="btn" style="margin-top: 10px;" onclick="window.submitResponse('${hw.id}', 'text')">Absenden</button>
                `;
            } else if (hw.type === 'checkbox') {
                return `<button class="btn" style="margin-top: 10px;" onclick="window.submitResponse('${hw.id}', 'checkbox')">Als erledigt markieren</button>`;
            } else if (hw.type === 'photo') {
                return `
                    <input type="file" id="photo-${hw.id}" accept="image/*" style="margin-top: 10px;">
                    <button class="btn" style="margin-top: 10px;" onclick="window.submitResponse('${hw.id}', 'photo')">Foto hochladen</button>
                `;
            }
        }

        window.submitResponse = async function(hwId, type) {
            let response = '';
            
            if (type === 'text') {
                response = document.getElementById(`response-${hwId}`).value.trim();
                if (!response) {
                    alert('Bitte schreibe eine Antwort.');
                    return;
                }
            } else if (type === 'checkbox') {
                response = 'Erledigt ✓';
            } else if (type === 'photo') {
                const fileInput = document.getElementById(`photo-${hwId}`);
                if (!fileInput.files[0]) {
                    alert('Bitte wähle ein Foto aus.');
                    return;
                }
                response = `Foto hochgeladen: ${fileInput.files[0].name}`;
            }

            try {
                await updateDoc(doc(db, 'homework', hwId), {
                    completed: true,
                    response: response,
                    completedAt: new Date().toISOString()
                });
            } catch (error) {
                alert('Fehler beim Absenden: ' + error.message);
            }
        }

        window.logout = function() {
            currentStudentId = null;
            currentStudentName = '';
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('hwView').style.display = 'none';
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
        }
    </script>
</body>
</html>
