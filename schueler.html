<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schüler Login - Amy Lang Deutsch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #FFB6C1 0%, #FFA07A 50%, #FFD1DC 100%);
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .login-box h1 {
            color: #8B4513;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8B4513;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 1em;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #FF69B4;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #FF1493;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #8B4513;
        }

        .btn-secondary:hover {
            background: #A0522D;
        }

        .btn-warning {
            background: #FFA500;
        }

        .btn-warning:hover {
            background: #FF8C00;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #8B4513;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .student-view {
            display: none;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #FF69B4;
        }

        .info-title {
            color: #8B4513;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .next-lesson {
            background: rgba(255, 105, 180, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .lesson-time {
            font-size: 1.2em;
            font-weight: bold;
            color: #8B4513;
            margin-bottom: 5px;
        }

        .reschedule-info {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
            font-style: italic;
        }

        .hw-view {
            display: none;
        }

        .hw-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #FF69B4;
            position: relative;
        }

        .hw-card.completed {
            border-left-color: #90EE90;
            opacity: 0.7;
        }

        .hw-card::before {
            content: '';
            position: absolute;
            top: 15px;
            right: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f44336;
        }

        .hw-card.read::before {
            background: #90EE90;
        }

        .hw-title {
            color: #8B4513;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            margin-top: 10px;
        }

        .back-btn {
            display: inline-block;
            background: rgba(139, 69, 19, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(139, 69, 19, 1);
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 {
            color: #8B4513;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-group .btn {
            flex: 1;
        }

        .success-message {
            background: rgba(144, 238, 144, 0.3);
            color: #8B4513;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }

        .filter-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #FF69B4;
            background: rgba(255, 255, 255, 0.5);
            color: #8B4513;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #FF69B4;
            color: white;
        }

        .submission-type-badge {
            display: inline-block;
            background: rgba(139, 69, 19, 0.1);
            color: #8B4513;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .phone-hint {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginView">
            <div class="login-box">
                <h1>🎓 Schüler Login</h1>
                <div id="errorMsg" class="error"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>WhatsApp-Telefonnummer</label>
                        <input type="tel" id="loginPhone" placeholder="+49 123 456789" required>
                        <div class="phone-hint">📱 Dieselbe Nummer wie bei der Anmeldung</div>
                    </div>
                    <div class="form-group">
                        <label>Passwort</label>
                        <input type="text" id="loginPassword" placeholder="z.B. katze, tiger, banane..." required>
                    </div>
                    <button type="submit" class="btn">Einloggen</button>
                </form>
            </div>
        </div>

        <div id="studentView" class="student-view">
            <a href="index.html" class="back-btn">← Zurück zur Hauptseite</a>
            <div class="login-box">
                <h1 id="welcomeText">Mein Schülerbereich</h1>
                <button class="btn btn-secondary" onclick="logout()" style="margin-bottom: 20px;">Ausloggen</button>
                
                <div class="info-card">
                    <div class="info-title">📅 Meine Termine</div>
                    <div id="myLessons">Lade Termine...</div>
                    <button class="btn btn-warning" onclick="openRescheduleModal()" id="rescheduleBtn" style="margin-top: 10px;">
                        Stunde verschieben
                    </button>
                    <div class="reschedule-info" id="rescheduleInfo"></div>
                </div>

                <div class="info-card">
                    <div class="info-title">📝 Meine Hausaufgaben</div>
                    <div id="myHomework">Lade Hausaufgaben...</div>
                    <button class="btn" onclick="switchToHomeworkView()" style="margin-top: 10px;">
                        Alle Hausaufgaben anzeigen
                    </button>
                </div>

                <div id="successMessage" class="success-message"></div>
            </div>
        </div>

        <div id="hwView" class="hw-view">
            <a href="#" class="back-btn" onclick="switchToDashboard(); return false;">← Zurück zum Dashboard</a>
            <div class="login-box">
                <h1 id="hwWelcomeText">Meine Hausübungen</h1>
                
                <div class="filter-toggle">
                    <button class="filter-btn active" onclick="filterHomework('all')">Alle</button>
                    <button class="filter-btn" onclick="filterHomework('pending')">Offen</button>
                    <button class="filter-btn" onclick="filterHomework('completed')">Erledigt</button>
                </div>
                
                <div id="homeworkContainer"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="rescheduleModal">
        <div class="modal-content">
            <h3>🔄 Stunde verschieben</h3>
            <div class="form-group">
                <label>Welche Stunde möchtest du verschieben?</label>
                <select id="lessonToReschedule" style="width: 100%; padding: 10px; border-radius: 10px;">
                    <option value="">Lade Termine...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Neues Datum *</label>
                <input type="date" id="newDate" required style="width: 100%; padding: 10px; border-radius: 10px;">
            </div>
            <div class="form-group">
                <label>Neue Uhrzeit *</label>
                <input type="time" id="newTime" required style="width: 100%; padding: 10px; border-radius: 10px;">
            </div>
            <div class="form-group">
                <label>Grund für die Verschiebung</label>
                <textarea id="rescheduleReason" rows="3" placeholder="Warum möchtest du die Stunde verschieben? (optional)"></textarea>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="submitRescheduleRequest()">Anfrage senden</button>
                <button class="btn btn-secondary" onclick="closeModal('rescheduleModal')">Abbrechen</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = window.supabase;
        const supabaseUrl = 'https://hfdjnttxavlghjfnjkms.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZGpudHR4YXZsZ2hqZm5qa21zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2OTQwNTIsImV4cCI6MjA3NTI3MDA1Mn0.LBLAkKzkquHvAmvFix4jIrudCVMGGjs5kfvK4l0RfIM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let currentStudent = null;
        let studentLessons = [];
        let currentHomework = [];
        let currentFilter = 'all';

        const dayNames = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phoneInput').value.trim().replace(/\s+/g, '');
            const password = document.getElementById('loginPassword').value.trim();
            
            try {
                // Login mit Telefonnummer statt Email
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .eq('phone', phone)
                    .eq('password', password)
                    .single();
                
                if (error || !data) {
                    showError('Telefonnummer oder Passwort falsch!');
                    return;
                }
                
                currentStudent = data;
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('studentView').style.display = 'block';
                document.getElementById('welcomeText').textContent = `Hallo ${currentStudent.name}!`;
                
                await loadStudentData();
                
            } catch (error) {
                showError('Fehler beim Login: ' + error.message);
            }
        });

        async function loadStudentData() {
            await loadMyLessons();
            await loadMyHomeworkOverview();
            updateRescheduleButton();
        }

        async function loadMyLessons() {
            if (!currentStudent?.standard_times) {
                document.getElementById('myLessons').innerHTML = '<p>Keine festen Termine vereinbart</p>';
                studentLessons = [];
                return;
            }
            
            const upcomingLessons = [];
            const today = new Date();
            
            currentStudent.standard_times.forEach(timeSlot => {
                const stdDay = timeSlot.day;
                const [hours, minutes] = timeSlot.time.split(':');
                
                let nextDate = new Date();
                nextDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                
                while (nextDate.getDay() !== stdDay || nextDate < today) {
                    nextDate.setDate(nextDate.getDate() + 1);
                }
                
                upcomingLessons.push({
                    date: nextDate,
                    time: timeSlot.time,
                    duration: timeSlot.duration,
                    day: timeSlot.day,
                    dayName: dayNames[timeSlot.day]
                });
            });
            
            upcomingLessons.sort((a, b) => a.date - b.date);
            studentLessons = upcomingLessons;
            
            let html = '';
            
            if (upcomingLessons.length > 0) {
                const nextLesson = upcomingLessons[0];
                html = `
                    <div class="next-lesson">
                        <div class="lesson-time">⏰ Nächste Stunde: ${nextLesson.date.toLocaleDateString('de-DE')} um ${nextLesson.time} Uhr</div>
                        <div>📅 ${nextLesson.dayName} | ⏱️ ${nextLesson.duration} Minuten</div>
                    </div>
                `;
                
                html += `<p><strong>Alle wöchentlichen Termine:</strong></p>`;
                currentStudent.standard_times.forEach(time => {
                    html += `<p>• ${dayNames[time.day]} ${time.time} Uhr (${time.duration} Min)</p>`;
                });
            } else {
                html = '<p>Keine anstehenden Termine</p>';
            }
            
            document.getElementById('myLessons').innerHTML = html;
        }

        async function loadMyHomeworkOverview() {
            const { data, error } = await supabase
                .from('homework')
                .select('*')
                .eq('student_id', currentStudent.id)
                .order('deadline', { ascending: true });
            
            if (error || !data || data.length === 0) {
                document.getElementById('myHomework').innerHTML = '<p>🎉 Aktuell keine Hausaufgaben!</p>';
                currentHomework = [];
                return;
            }
            
            currentHomework = data;
            const pending = data.filter(hw => !hw.completed);
            const completed = data.filter(hw => hw.completed);
            const unread = data.filter(hw => !hw.is_read);
            
            let html = '';
            
            if (unread.length > 0) {
                html += `<p style="color: #f44336; font-weight: bold;">🔴 ${unread.length} neue/geänderte Hausaufgabe(n)</p>`;
            }
            
            if (pending.length > 0) {
                html += `<p><strong>${pending.length} offene Hausaufgabe(n):</strong></p>`;
                pending.slice(0, 3).forEach(hw => {
                    const deadline = new Date(hw.deadline);
                    const today = new Date();
                    const isOverdue = deadline < today;
                    
                    html += `<div style="margin: 5px 0; padding: 8px; background: ${isOverdue ? 'rgba(255,0,0,0.1)' : 'rgba(255,165,0,0.1)'}; border-radius: 8px;">
                        <strong>${hw.title}</strong> ${!hw.is_read ? '🔴' : ''}<br>
                        📅 Bis: ${deadline.toLocaleDateString('de-DE')} ${isOverdue ? '⚠️ Überfällig!' : ''}
                    </div>`;
                });
                
                if (pending.length > 3) {
                    html += `<p style="color: #666; font-size: 0.9em;">... und ${pending.length - 3} weitere</p>`;
                }
            }
            
            if (completed.length > 0) {
                html += `<p style="margin-top: 15px;"><strong>${completed.length} erledigt</strong> ✅</p>`;
            }
            
            document.getElementById('myHomework').innerHTML = html;
        }

        function updateRescheduleButton() {
            const btn = document.getElementById('rescheduleBtn');
            const info = document.getElementById('rescheduleInfo');
            
            if (studentLessons.length === 0) {
                btn.disabled = true;
                btn.textContent = 'Keine Termine verfügbar';
                info.innerHTML = '';
                return;
            }
            
            const nextLesson = studentLessons[0];
            const now = new Date();
            const lessonTime = new Date(nextLesson.date);
            const timeDiff = lessonTime - now;
            const hoursDiff = timeDiff / (1000 * 60 * 60);
            
            if (hoursDiff <= 24) {
                btn.disabled = true;
                btn.textContent = 'Verschiebung nicht möglich';
                info.innerHTML = `✖ Verschiebung nur möglich, wenn mehr als 24 Stunden vor Stunde (noch ${Math.round(hoursDiff)}h)`;
            } else {
                btn.disabled = false;
                btn.textContent = 'Stunde verschieben';
                info.innerHTML = `✅ Verschiebung möglich (noch ${Math.round(hoursDiff)}h vor Stunde)`;
            }
        }

        window.openRescheduleModal = async function() {
            const select = document.getElementById('lessonToReschedule');
            select.innerHTML = '<option value="">Lade Termine...</option>';
            
            studentLessons.forEach((lesson, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${lesson.date.toLocaleDateString('de-DE')} ${lesson.time} Uhr (${lesson.dayName})`;
                select.appendChild(option);
            });
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('newDate').min = today;
            
            document.getElementById('rescheduleModal').style.display = 'flex';
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).style.display = 'none';
        };

        window.submitRescheduleRequest = async function() {
            const lessonIndex = document.getElementById('lessonToReschedule').value;
            const newDate = document.getElementById('newDate').value;
            const newTime = document.getElementById('newTime').value;
            const reason = document.getElementById('rescheduleReason').value.trim();
            
            if (!lessonIndex || !newDate || !newTime) {
                alert('Bitte wähle einen Termin aus und gib neues Datum/Uhrzeit an!');
                return;
            }
            
            const selectedLesson = studentLessons[lessonIndex];
            
            try {
                const { error } = await supabase
                    .from('reschedule_requests')
                    .insert({
                        student_id: currentStudent.id,
                        student_name: currentStudent.name,
                        original_date: selectedLesson.date.toISOString(),
                        original_time: selectedLesson.time,
                        requested_date: newDate,
                        requested_time: newTime,
                        reason: reason || 'Kein Grund angegeben',
                        status: 'pending'
                    });
                
                if (error) throw error;
                
                showSuccess('Verschiebungsanfrage wurde erfolgreich gesendet! Amy wird sich bald bei dir melden.');
                closeModal('rescheduleModal');
                
                document.getElementById('newDate').value = '';
                document.getElementById('newTime').value = '';
                document.getElementById('rescheduleReason').value = '';
                
            } catch (error) {
                alert('Fehler beim Senden der Anfrage: ' + error.message);
            }
        };

        window.switchToHomeworkView = function() {
            document.getElementById('studentView').style.display = 'none';
            document.getElementById('hwView').style.display = 'block';
            document.getElementById('hwWelcomeText').textContent = `Hausaufgaben von ${currentStudent.name}`;
            renderDetailedHomework();
        };

        window.switchToDashboard = function() {
            document.getElementById('hwView').style.display = 'none';
            document.getElementById('studentView').style.display = 'block';
            loadStudentData();
        };

        window.filterHomework = function(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderDetailedHomework();
        };

        async function renderDetailedHomework() {
            let filteredHomework = currentHomework;
            
            if (currentFilter === 'pending') {
                filteredHomework = currentHomework.filter(hw => !hw.completed);
            } else if (currentFilter === 'completed') {
                filteredHomework = currentHomework.filter(hw => hw.completed);
            }

            const container = document.getElementById('homeworkContainer');
            
            if (filteredHomework.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #8B4513; padding: 40px;">Keine Hausaufgaben in dieser Kategorie</p>';
                return;
            }
            
            container.innerHTML = filteredHomework.map(hw => createHwCard(hw)).join('');
        }

        function createHwCard(hw) {
            const deadline = new Date(hw.deadline);
            const today = new Date();
            const isOverdue = !hw.completed && deadline < today;
            const isCompleted = hw.completed;
            
            const submissionTypeText = {
                'text': '📝 Text-Antwort',
                'photo': '📸 Foto hochladen',
                'whatsapp': '💬 Per WhatsApp',
                'custom': `✏️ ${hw.custom_submission_text || 'Benutzerdefiniert'}`
            };
            
            return `
                <div class="hw-card ${isCompleted ? 'completed' : ''} ${hw.is_read ? 'read' : ''}" onclick="markAsRead('${hw.id}')">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div class="hw-title">${hw.title} ${isOverdue ? '⚠️' : ''}</div>
                        <div style="font-size: 1.5em;">${isCompleted ? '✅' : '⭕'}</div>
                    </div>
                    ${hw.description ? `<p style="color: #8B4513; margin: 10px 0;">${hw.description}</p>` : ''}
                    <div style="font-size: 0.9em; color: #666; margin: 10px 0;">
                        📅 Bis: ${deadline.toLocaleDateString('de-DE')} ${deadline.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}
                        ${isOverdue ? '<br><span style="color: red;">⚠️ Überfällig!</span>' : ''}
                    </div>
                    <div class="submission-type-badge">
                        ${submissionTypeText[hw.submission_type] || submissionTypeText[hw.type] || '📝 Text-Antwort'}
                    </div>
                    ${isCompleted ? 
                        (hw.response ? `<div style="background: rgba(144,238,144,0.3); padding: 12px; border-radius: 8px; margin-top: 10px;"><strong>Deine Antwort:</strong> ${hw.response}</div>` : '') :
                        createResponseSection(hw)
                    }
                </div>
            `;
        }

        function createResponseSection(hw) {
            const submissionType = hw.submission_type || hw.type;
            
            if (submissionType === 'text') {
                return `
                    <textarea id="response-${hw.id}" placeholder="Schreibe deine Antwort hier..."></textarea>
                    <button class="btn" style="margin-top: 10px;" onclick="submitHomeworkResponse('${hw.id}', 'text'); event.stopPropagation();">
                        Antwort absenden
                    </button>
                `;
            } else if (submissionType === 'photo') {
                return `
                    <p style="margin-top: 10px; color: #8B4513;">Bitte mache ein Foto deiner Hausaufgabe und markiere sie als erledigt.</p>
                    <button class="btn" style="margin-top: 10px;" onclick="submitHomeworkResponse('${hw.id}', 'photo'); event.stopPropagation();">
                        Foto gemacht - als erledigt markieren
                    </button>
                `;
            } else if (submissionType === 'whatsapp') {
                return `
                    <p style="margin-top: 10px; color: #8B4513;">Bitte sende deine Antwort per WhatsApp an Amy und markiere die Aufgabe als erledigt.</p>
                    <button class="btn" style="margin-top: 10px;" onclick="submitHomeworkResponse('${hw.id}', 'whatsapp'); event.stopPropagation();">
                        Per WhatsApp gesendet - als erledigt markieren
                    </button>
                `;
            } else if (submissionType === 'custom') {
                return `
                    <p style="margin-top: 10px; color: #8B4513;"><strong>Anweisung:</strong> ${hw.custom_submission_text || 'Siehe Beschreibung'}</p>
                    <button class="btn" style="margin-top: 10px;" onclick="submitHomeworkResponse('${hw.id}', 'custom'); event.stopPropagation();">
                        Als erledigt markieren
                    </button>
                `;
            }
            return '';
        }

        window.markAsRead = async function(hwId) {
            const hw = currentHomework.find(h => h.id === hwId);
            if (!hw || hw.is_read) return;
            
            try {
                await supabase
                    .from('homework')
                    .update({ is_read: true })
                    .eq('id', hwId);
                
                const hwIndex = currentHomework.findIndex(h => h.id === hwId);
                if (hwIndex !== -1) {
                    currentHomework[hwIndex].is_read = true;
                }
                
                renderDetailedHomework();
                loadMyHomeworkOverview();
            } catch (error) {
                console.error('Fehler beim Markieren als gelesen:', error);
            }
        };

        window.submitHomeworkResponse = async function(hwId, type) {
            let response = '';
            
            if (type === 'text') {
                response = document.getElementById(`response-${hwId}`).value.trim();
                if (!response) {
                    alert('Bitte schreibe eine Antwort.');
                    return;
                }
            } else if (type === 'photo') {
                response = 'Foto gemacht ✔';
            } else if (type === 'whatsapp') {
                response = 'Per WhatsApp gesendet ✔';
            } else if (type === 'custom') {
                response = 'Erledigt ✔';
            }

            try {
                const { error } = await supabase
                    .from('homework')
                    .update({
                        completed: true,
                        response: response,
                        completed_at: new Date().toISOString()
                    })
                    .eq('id', hwId);
                
                if (error) throw error;
                
                showSuccess('Hausaufgabe wurde als erledigt markiert!');
                
                const hwIndex = currentHomework.findIndex(h => h.id === hwId);
                if (hwIndex !== -1) {
                    currentHomework[hwIndex].completed = true;
                    currentHomework[hwIndex].response = response;
                }
                
                renderDetailedHomework();
                loadMyHomeworkOverview();
                
            } catch (error) {
                alert('Fehler beim Absenden: ' + error.message);
            }
        };

        function showError(message) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.style.display = 'block';
            setTimeout(() => {
                successEl.style.display = 'none';
            }, 5000);
        }

        window.logout = function() {
            currentStudent = null;
            studentLessons = [];
            currentHomework = [];
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('studentView').style.display = 'none';
            document.getElementById('hwView').style.display = 'none';
            document.getElementById('loginPhone').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('errorMsg').style.display = 'none';
        };

        setInterval(() => {
            if (currentStudent) {
                updateRescheduleButton();
            }
        }, 120000);

        setTimeout(updateRescheduleButton, 1000);
    </script>
</body>
</html>
