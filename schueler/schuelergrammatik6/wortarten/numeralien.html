<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inhalte auf Anfrage - Deutsch Übungen</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .header-line {
            height: 3px;
            background: linear-gradient(90deg, #3498db, #2c3e50);
            margin: 20px 0 30px 0;
            border-radius: 3px;
        }
        
        .navigation {
            background: #2c3e50;
            padding: 15px;
            margin: -30px -30px 30px -30px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        
        .home-link {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background: #34495e;
            border-radius: 5px;
            transition: background 0.3s;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        
        .home-link:hover {
            background: #3498db;
        }
        
        .message-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            text-align: center;
        }
        
        .request-message {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 40px;
            border-radius: 15px;
            font-size: 2.2em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 80%;
            line-height: 1.4;
            margin-bottom: 30px;
        }
        
        .whatsapp-button {
            background: linear-gradient(135deg, #ff7b00 0%, #ff4500 25%, #dc143c 50%, #8b0000 75%, #2f1b14 100%);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 123, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .whatsapp-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 123, 0, 0.4);
            background: linear-gradient(135deg, #ff8c1a 0%, #ff5722 25%, #e91e63 50%, #9c0e0e 75%, #3d241a 100%);
        }
        
        .whatsapp-button::before {
            content: "💬";
            font-size: 1.3em;
        }
        
        /* Abschluss-Styling */
        .closing-section {
            margin-top: 50px;
            padding: 20px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            border-radius: 10px;
            text-align: center;
        }
        
        .closing-section h2 {
            color: white;
            margin-top: 0;
            background: none;
            padding: 0;
            font-size: 1.8em;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 15px;
            }
            
            .navigation {
                flex-direction: column;
                gap: 15px;
            }
            
            .request-message {
                font-size: 1.6em;
                padding: 25px;
            }
            
            .whatsapp-button {
                font-size: 1.1em;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <a href="https://amyfabijenna.github.io/amylang-deutsch/" class="home-link">← Zur Hauptseite</a>
        </div>
        
        <div class="header-line"></div>
        
        <div class="message-container">
            <div class="request-message">
                Diese Inhalte gibt es gerne auf Anfrage
            </div>
            <a href="https://wa.me/36301818503" class="whatsapp-button" target="_blank">
                Senden Sie mir gleich eine Nachricht!
            </a>
        </div>
        
        <!-- Abschluss -->
        <div class="closing-section">
            <h2>Viel Erfolg beim Lernen!</h2>
            <p style="margin-bottom: 0;">Wir unterstützen Sie gerne bei Ihrem Lernprozess!</p>
        </div>
    </div>
</body>
</html>
