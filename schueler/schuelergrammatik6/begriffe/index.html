            padding: 0;
            box-sizing: border-box;
        }

            background: linear-gradient(135deg, #4A90E2 0%, #2E5C8A 50%, #1E3A5F 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {

            padding: 30px;

        h1 {

            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(47, 107, 125, 0.1);
        }

        .stats-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            padding: 20px;
            border-radius: 15px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #4A90E2;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #1E3A5F;
        }

        .stat-label {
            color: #2E5C8A;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 5px;
        }

        .skip-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFA726 0%, #FF7043 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .skip-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 112, 67, 0.4);
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .theme-card {
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #4A90E2;
        }

        .theme-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            border-color: #2E5C8A;
        }

        .theme-card h3 {
            color: #1E3A5F;
            margin-bottom: 10px;
            font-size: 1.4em;
        }

        .theme-card .word-count {
            color: #2E5C8A;
            font-weight: bold;
            font-size: 1.1em;
        }

        .vocab-section, .quiz-section, .flashcard-section, .game-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .vocab-section.active, .quiz-section.active, .flashcard-section.active, .game-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vocab-list {
            background: linear-gradient(135deg, #F5F9FA 0%, #D6E9F8 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 18px;
            background: white;
            margin-bottom: 12px;
            border-radius: 10px;
            border-left: 5px solid #2E5C8A;
            transition: all 0.3s;
        }

        .vocab-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .vocab-word {
            font-weight: bold;
            color: #1E3A5F;
            font-size: 1.2em;
        }

        .vocab-example {
            color: #2E5C8A;
            font-style: italic;
            font-size: 1.05em;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 24px;
            border: 3px solid #2E5C8A;
            background: white;
            color: #1E3A5F;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            background: #2E5C8A;
            color: white;
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #2E5C8A 0%, #1E3A5F 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(47, 107, 125, 0.3);
        }

        .back-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%);
            color: #333;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .quiz-question {
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 3px solid #4A90E2;
        }

        .quiz-question h3 {
            color: #1E3A5F;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .quiz-options {
            display: grid;
            gap: 15px;
        }

        .quiz-option {
            padding: 18px;
            background: white;
            border: 3px solid #4A90E2;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }

        .quiz-option:hover {
            background: #D6E9F8;
            border-color: #2E5C8A;
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: linear-gradient(135deg, #81C784 0%, #66BB6A 100%);
            color: white;
            border-color: #66BB6A;
        }

        .quiz-option.incorrect {
            background: linear-gradient(135deg, #E57373 0%, #E53935 100%);
            color: white;
            border-color: #E53935;
        }

        .flashcard-container {
            perspective: 1000px;
            margin: 30px auto;
            max-width: 600px;
        }

        .flashcard {
            width: 100%;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 40px;
            font-size: 1.5em;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .flashcard-front {
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            color: #1E3A5F;
            border: 4px solid #4A90E2;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #81C784 0%, #66BB6A 100%);
            color: white;
            transform: rotateY(180deg);
            border: 4px solid #66BB6A;
        }

        .flashcard-word {
            font-size: 1.8em;
            font-weight: bold;
        }

        .flashcard-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .practice-btn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #2E5C8A 0%, #1E3A5F 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .practice-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(47, 107, 125, 0.4);
        }

            font-size: 2.5em;
            letter-spacing: 15px;
            margin: 30px 0;
            color: #1E3A5F;
            font-weight: bold;
        }

        .letter-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 10px;
            max-width: 700px;
            margin: 30px auto;
        }

        .letter-btn {
            padding: 15px;
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            border: 2px solid #4A90E2;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            color: #1E3A5F;
            transition: all 0.3s;
        }

        .letter-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #2E5C8A 0%, #1E3A5F 100%);
            color: white;
            transform: scale(1.1);
        }

        .letter-btn:disabled {
            background: #E0E0E0;
            color: #9E9E9E;
            cursor: not-allowed;
            border-color: #BDBDBD;
        }

        .progress-bar {
            background: #E0E0E0;
            border-radius: 20px;
            height: 30px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            background: linear-gradient(135deg, #81C784 0%, #66BB6A 100%);
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;

        .game-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #4A90E2;
            text-align: center;
        }

            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border-color: #2E5C8A;
        }

        .game-card h4 {
            color: #1E3A5F;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .game-card p {
            color: #2E5C8A;
            font-size: 0.9em;
        }
    </style>
</head>

                    { word: "behufs", question: "Was bedeutet behufs?", hint: "Zum Zweck von" },
                    { word: "mangels", question: "Was bedeutet mangels?", hint: "Wegen des Mangels" },
                    { word: "trotz", question: "Was bedeutet trotz?", hint: "Ungeachtet" },
                    { word: "ungeachtet", question: "Was bedeutet ungeachtet?", hint: "Trotz" },
                    { word: "abgesehen von", question: "Was bedeutet abgesehen von?", hint: "Außer" },
                    { word: "außer", question: "Was bedeutet außer?", hint: "Mit Ausnahme von" },
                    { word: "sofern", question: "Was bedeutet sofern?", hint: "Falls" },
                    { word: "insofern als", question: "Was bedeutet insofern als?", hint: "In dem Maße wie" },
                    { word: "vorausgesetzt", question: "Was bedeutet vorausgesetzt?", hint: "Unter der Bedingung" },
                    { word: "angenommen", question: "Was bedeutet angenommen?", hint: "Gesetzt den Fall" },
                    { word: "gesetzt den Fall", question: "Was bedeutet gesetzt den Fall?", hint: "Angenommen dass" },
                    { word: "für den Fall dass", question: "Was bedeutet für den Fall dass?", hint: "Falls" },
                    { word: "im Falle", question: "Was bedeutet im Falle?", hint: "Falls" },
                    { word: "je nachdem", question: "Was bedeutet je nachdem?", hint: "Abhängig davon" },
                    { word: "unabhängig davon", question: "Was bedeutet unabhängig davon?", hint: "Egal ob" },
                    { word: "nichtsdestoweniger", question: "Was bedeutet nichtsdestoweniger?", hint: "Trotzdem" },
                    { word: "um genau zu sein", question: "Was bedeutet um genau zu sein?", hint: "Präzise ausgedrückt" },
                    { word: "genau genommen", question: "Was bedeutet genau genommen?", hint: "Streng genommen" }
                ]
            }
        };

        let currentTheme = 'gefuehle';
        let currentMode = 'vocab';
        let currentQuestion = 0;
        let quizScore = 0;
        let currentCard = 0;
        let isFlipped = false;
        let gameData = {};

        let stats = {
            learned: 0,
            quizzes: 0,
            games: 0,
            skipped: 0
        };

        function loadStats() {
            const saved = localStorage.getItem('vocabStats6');
            if (saved) {
                stats = JSON.parse(saved);
            }
        }

        function saveStats() {
            localStorage.setItem('vocabStats6', JSON.stringify(stats));
            updateStats();
        }

        function updateStats() {
            document.getElementById('statsWords').textContent = stats.learned;
            document.getElementById('statsQuizzes').textContent = stats.quizzes;
            document.getElementById('statsGames').textContent = stats.games;
            const skippedElement = document.getElementById('statsSkipped');
            if (skippedElement) {
                skippedElement.textContent = stats.skipped || 0;
            }
        }

        function showThemes() {
            // Hide all learning sections but keep mainContent visible
            document.getElementById('vocabContent').classList.remove('active');
            document.getElementById('quizContent').classList.remove('active');
            document.getElementById('flashcardContent').classList.remove('active');
            document.getElementById('gameContent').classList.remove('active');
            
            // Show main content with theme cards
            document.getElementById('mainContent').style.display = 'block';
            
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';
            
            for (let key in vocabData) {
                const theme = vocabData[key];
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.onclick = () => selectTheme(key);
                card.innerHTML = `
                    <h3>${theme.name}</h3>
                    <div class="word-count">${theme.words.length} Wörter</div>
                `;
                grid.appendChild(card);
            }
        }

        function selectTheme(theme) {
            currentTheme = theme;
            hideAllSections();
            document.getElementById('vocabContent').classList.add('active');
            currentMode = 'vocab';
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.mode-btn').classList.add('active');
            displayVocabList();
        }

        function showMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'vocab') displayVocabList();
            else if (mode === 'quiz') startQuiz();
            else if (mode === 'flashcard') startFlashcards();
            else if (mode === 'game') showGames();
        }

        function displayVocabList() {
            const words = vocabData[currentTheme].words;
            let html = '<div class="vocab-list">';
            
            words.forEach(item => {
                html += `
                    <div class="vocab-item">
                        <div class="vocab-word">${item.word}</div>
                        <div class="vocab-example">${item.question} → <strong>${item.hint}</strong></div>
                    </div>
                `;
            });
            
            html += '</div>';
            document.getElementById('contentArea').innerHTML = html;
            
            stats.learned += words.length;
            saveStats();
        }

        function startQuiz() {
            hideAllSections();
            document.getElementById('quizContent').classList.add('active');
            
            currentQuestion = 0;
            quizScore = 0;
            showQuizQuestion();
        }

        function showQuizQuestion() {
            const words = vocabData[currentTheme].words;
            if (currentQuestion >= words.length) {
                showQuizResults();
                return;
            }
            
            const current = words[currentQuestion];
            const otherWords = words.filter(w => w.word !== current.word);
            
            // Create options using hints (pedagogically meaningful)
            const options = [current.hint];
            
            // Get 3 other hints as wrong answers
            while (options.length < 4 && otherWords.length > 0) {
                const random = otherWords[Math.floor(Math.random() * otherWords.length)];
                if (!options.includes(random.hint)) {
                    options.push(random.hint);
                }
                otherWords.splice(otherWords.indexOf(random), 1);
            }
            
            options.sort(() => Math.random() - 0.5);
            
            // Store correct answer in a variable, NOT in the HTML
            window.currentQuizAnswer = current.hint;
            
            let html = `
                <div class="quiz-question">
                    <h3>Frage ${currentQuestion + 1} von ${words.length}</h3>
                    <p style="font-size: 1.3em; margin: 20px 0; color: #1E3A5F; font-weight: bold;">${current.question}</p>
                    <p style="font-size: 0.9em; margin: 10px 0 30px 0; color: #666; font-style: italic;">Wähle die passende Bedeutung:</p>
                    <div class="quiz-options">
            `;
            
            options.forEach((option, index) => {
                html += `
                    <div class="quiz-option" onclick="checkAnswer(${index})">
                        ${option}
                    </div>
                `;
            });
            
            html += '</div><button class="skip-btn" onclick="skipQuizQuestion()">Nächste Frage</button></div>';
            document.getElementById('quizArea').innerHTML = html;
            
            // Store options in a global variable
            window.currentQuizOptions = options;
        }

        function checkAnswer(selectedIndex) {
            const selected = window.currentQuizOptions[selectedIndex];
            const correct = window.currentQuizAnswer;
            
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(option => {
                option.style.pointerEvents = 'none';
                if (option.textContent.trim() === correct) {
                    option.classList.add('correct');
                } else if (option.textContent.trim() === selected && selected !== correct) {
                    option.classList.add('incorrect');
                }
            });
            
            if (selected === correct) quizScore++;
            
            setTimeout(() => {
                currentQuestion++;
                showQuizQuestion();
            }, 1500);
        }
        
        function skipQuizQuestion() {
            stats.skipped++;
            saveStats();
            // Add current question back to the end of the array
            const words = vocabData[currentTheme].words;
            const skippedWord = words[currentQuestion];
            words.push(skippedWord);
            currentQuestion++;
            showQuizQuestion();
        }

        function showQuizResults() {
            const total = vocabData[currentTheme].words.length;
            const percentage = Math.round((quizScore / total) * 100);
            
            stats.quizzes++;
            saveStats();
            
            document.getElementById('quizArea').innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h2 style="color: #1E3A5F; margin-bottom: 30px;">Quiz Ergebnis</h2>
                    <p style="font-size: 3em; color: ${percentage >= 70 ? '#66BB6A' : '#E53935'}; font-weight: bold; margin-bottom: 20px;">
                        ${quizScore} / ${total}
                    </p>
                    <p style="font-size: 1.5em; margin-bottom: 30px; color: #1E3A5F;">Das sind ${percentage}%!</p>
                    <button class="practice-btn" onclick="startQuiz()">🔄 Nochmal üben</button>
                </div>
            `;
        }

        function startFlashcards() {
            hideAllSections();
            document.getElementById('flashcardContent').classList.add('active');
            currentCard = 0;
            isFlipped = false;
            showCard();
        }

        function showCard() {
            const words = vocabData[currentTheme].words;
            document.getElementById('totalCards').textContent = words.length;
            document.getElementById('cardNumber').textContent = currentCard + 1;
            
            const progress = ((currentCard + 1) / words.length) * 100;
            document.getElementById('cardProgress').style.width = progress + '%';
            document.getElementById('cardProgress').textContent = Math.round(progress) + '%';

            const current = words[currentCard];
            const flashcard = document.getElementById('flashcard');
            
            // First remove the flipped state
            flashcard.classList.remove('flipped');
            isFlipped = false;
            
            // Wait for the flip animation to complete before updating content
            // This prevents the answer from being visible during the flip
            setTimeout(() => {
                document.getElementById('flashcardFront').innerHTML = `
                    <div class="flashcard-word">${current.question}</div>
                `;
                
                document.getElementById('flashcardBack').innerHTML = `
                    <div class="flashcard-word">${current.word}</div>
                `;
            }, 300);
        }

        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            
            if (!isFlipped) {
                flashcard.classList.add('flipped');
                isFlipped = true;
            } else {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextCard() {
            const words = vocabData[currentTheme].words;
            currentCard = (currentCard + 1) % words.length;
            showCard();
            
            if (currentCard === 0) {
                stats.learned += words.length;
                saveStats();
            }
        }
        
        function skipFlashcard() {
            stats.skipped++;
            saveStats();
            const words = vocabData[currentTheme].words;
            const skippedCard = words[currentCard];
            words.push(skippedCard);
            currentCard = (currentCard + 1) % words.length;
            showCard();
        }

        function showGames() {
            document.getElementById('contentArea').innerHTML = `
                <h2 style="color: #1E3A5F; text-align: center; margin-bottom: 20px;">Wähle ein Spiel</h2>
                <div class="game-selector">
                    <div class="game-card" onclick="startHangman()">
                        <h4>🎮 Hangman</h4>
                        <p>Errate das Wort Buchstabe für Buchstabe</p>
                    </div>
                    <div class="game-card" onclick="startFillBlank()">
                        <h4>✍️ Lückentext</h4>
                        <p>Fülle die fehlenden Wörter ein</p>
                    </div>
                    <div class="game-card" onclick="startScramble()">
                        <h4>🔤 Wort-Scramble</h4>
                        <p>Ordne die Buchstaben richtig</p>
                    </div>
                </div>
            `;
        }

        function startFillBlank() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const wordToBlank = current.word;
            
            // Create a fill-in-the-blank from the question
            // Replace the word with blanks if it appears in the question
            let blanked = current.question.replace(new RegExp(wordToBlank, 'gi'), '___________');
            
            // If the word doesn't appear in the question, create a meaningful sentence
            if (blanked === current.question) {
                blanked = `Die richtige Antwort auf "${current.question}" ist: ___________`;
            }
            
            gameData = { current, blanked, wordToBlank };
            
            document.getElementById('gameArea').innerHTML = `
                <h2 style="color: #1E3A5F;">✍️ Fülle die Lücke aus</h2>
                <p style="font-size: 1.5em; margin: 30px 0; color: #2E5C8A;">${blanked}</p>
                <p style="color: #666; font-style: italic; font-size: 0.9em; margin-bottom: 20px;">Hinweis: ${current.hint}</p>
                <input type="text" id="fillInput" placeholder="Deine Antwort..." 
                    style="font-size: 1.3em; padding: 15px; border: 3px solid #2E5C8A; border-radius: 10px; width: 80%; max-width: 400px;">
                <br><br>
                <button class="practice-btn" onclick="checkFillBlank()">Überprüfen</button>
                <button class="skip-btn" onclick="skipFillBlank()">Nächstes Wort</button>
                <div id="fillResult" style="margin-top: 20px; font-size: 1.2em;"></div>
            `;
        }

        function checkFillBlank() {
            const input = document.getElementById('fillInput').value.trim();
            const result = document.getElementById('fillResult');
            
            if (input.toLowerCase() === gameData.wordToBlank.toLowerCase()) {
                result.innerHTML = `<p style="color: #66BB6A; font-weight: bold;">✅ Richtig! ${gameData.wordToBlank}</p>`;
                stats.games++;
                saveStats();
                setTimeout(() => startFillBlank(), 2000);
            } else {
                result.innerHTML = `<p style="color: #E53935; font-weight: bold;">❌ Nicht ganz. Versuche es nochmal!</p>`;
            }
        }
        
        function skipFillBlank() {
            stats.skipped++;
            saveStats();
            const words = vocabData[currentTheme].words;
            words.push(gameData.current);
            startFillBlank();
        }

        function startHangman() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const word = current.word.toUpperCase();
            const guessed = [];
            let mistakes = 0;
            
            gameData = { word, guessed, mistakes, current };
            displayHangman();
        }

        function displayHangman() {
            const display = gameData.word.split('').map(letter => 
                gameData.guessed.includes(letter) || letter === ' ' ? letter : '_'
            ).join(' ');
            
            let html = `
                <h2 style="color: #1E3A5F;">🎮 Hangman</h2>
                <p style="color: #2E5C8A; margin: 20px 0;">Fehler: ${gameData.mistakes} / 6</p>
                <div class="hangman-word">${display}</div>
                <p style="color: #2E5C8A; font-style: italic; margin: 20px 0;">${gameData.current.hint}</p>
                <div class="letter-buttons">
            `;
            
            const alphabet = ['A', 'Ä', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'Ö', 'P', 'Q', 'R', 'S', 'T', 'U', 'Ü', 'V', 'W', 'X', 'Y', 'Z', 'ß'];
            
            for (const letter of alphabet) {
                const disabled = gameData.guessed.includes(letter) ? 'disabled' : '';
                html += `<button class="letter-btn" ${disabled} onclick="guessLetter('${letter}')">${letter}</button>`;
            }
            
            html += '</div>';
            
            if (display.replace(/ /g, '') === gameData.word.replace(/ /g, '')) {
                html += `<p style="color: #66BB6A; font-size: 1.5em; margin-top: 20px; font-weight: bold;">🎉 Gewonnen!</p>`;
                html += `<button class="practice-btn" style="margin-top: 20px;" onclick="startHangman()">Nächstes Wort</button>`;
                stats.games++;
                saveStats();
            } else if (gameData.mistakes >= 6) {
                html += `<p style="color: #E53935; font-size: 1.5em; margin-top: 20px; font-weight: bold;">😢 Verloren! Das Wort war: ${gameData.word}</p>`;
                html += `<button class="practice-btn" style="margin-top: 20px;" onclick="startHangman()">Nächstes Wort</button>`;
            } else {
                html += `<button class="skip-btn" style="margin-top: 20px;" onclick="skipHangman()">Nächstes Wort</button>`;
            }
            
            document.getElementById('gameArea').innerHTML = html;
        }
        
        function skipHangman() {
            stats.skipped++;
            saveStats();
            // Save current word to be repeated later
            const words = vocabData[currentTheme].words;
            const skippedWord = gameData.current;
            words.push(skippedWord);
            startHangman();
        }

        function guessLetter(letter) {
            if (!gameData.guessed.includes(letter)) {
                gameData.guessed.push(letter);
                if (!gameData.word.includes(letter)) {
                    gameData.mistakes++;
                }
            }
            displayHangman();
        }

        function startScramble() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const word = current.word;
            const scrambled = word.split('').sort(() => Math.random() - 0.5).join('');
            
            gameData = { word, scrambled, current };
            
            document.getElementById('gameArea').innerHTML = `
                <h2 style="color: #1E3A5F;">🔤 Wort-Scramble</h2>
                <p style="font-size: 1.2em; color: #2E5C8A; margin: 20px 0;">Ordne die Buchstaben:</p>
                <p style="font-size: 2.5em; color: #1E3A5F; font-weight: bold; letter-spacing: 5px; margin: 20px 0;">${scrambled}</p>
                <p style="color: #2E5C8A; font-style: italic; margin: 20px 0;">${current.hint}</p>
                <input type="text" id="scrambleInput" placeholder="Deine Antwort..." 
                    style="font-size: 1.3em; padding: 15px; border: 3px solid #2E5C8A; border-radius: 10px; width: 80%; max-width: 400px;">
                <br><br>
                <button class="practice-btn" onclick="checkScramble()">Überprüfen</button>
                <button class="skip-btn" onclick="skipScramble()">Nächstes Wort</button>
                <div id="scrambleResult" style="margin-top: 20px; font-size: 1.2em;"></div>
            `;
        }

        function checkScramble() {
            const input = document.getElementById('scrambleInput').value.trim();
            const result = document.getElementById('scrambleResult');
            
            if (input.toLowerCase() === gameData.word.toLowerCase()) {
                result.innerHTML = `<p style="color: #66BB6A; font-weight: bold;">✅ Richtig! ${gameData.word}</p>`;
                stats.games++;
                saveStats();
                setTimeout(() => startScramble(), 2000);
            } else {
                result.innerHTML = `<p style="color: #E53935; font-weight: bold;">❌ Nicht ganz. Versuche es nochmal!</p>`;
            }
        }
        
        function skipScramble() {
            stats.skipped++;
            saveStats();
            const words = vocabData[currentTheme].words;
            words.push(gameData.current);
            startScramble();
        }

        function hideAllSections() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('vocabContent').classList.remove('active');
            document.getElementById('quizContent').classList.remove('active');
            document.getElementById('flashcardContent').classList.remove('active');
            document.getElementById('gameContent').classList.remove('active');
        }

        function backToThemes() {
            showThemes();
        }

        function backToVocab() {
            hideAllSections();
            document.getElementById('vocabContent').classList.add('active');
            currentMode = 'vocab';
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.mode-btn').classList.add('active');
            displayVocabList();
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', function() {
            loadStats();
            updateStats();
            showThemes();
        });
    </script>
