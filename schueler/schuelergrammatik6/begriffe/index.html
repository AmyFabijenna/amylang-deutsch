<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wortschatz 6. Schulstufe Gymnasium - Interaktive Lernplattform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4A90E2 0%, #2E5C8A 50%, #1E3A5F 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #1E3A5F;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(47, 107, 125, 0.1);
        }

        .stats-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            padding: 20px;
            border-radius: 15px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #4A90E2;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #1E3A5F;
        }

        .stat-label {
            color: #2E5C8A;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 5px;
        }

        .skip-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFA726 0%, #FF7043 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .skip-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 112, 67, 0.4);
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .theme-card {
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #4A90E2;
        }

        .theme-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            border-color: #2E5C8A;
        }

        .theme-card h3 {
            color: #1E3A5F;
            margin-bottom: 10px;
            font-size: 1.4em;
        }

        .theme-card .word-count {
            color: #2E5C8A;
            font-weight: bold;
            font-size: 1.1em;
        }

        .vocab-section, .quiz-section, .flashcard-section, .game-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .vocab-section.active, .quiz-section.active, .flashcard-section.active, .game-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vocab-list {
            background: linear-gradient(135deg, #F5F9FA 0%, #D6E9F8 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 18px;
            background: white;
            margin-bottom: 12px;
            border-radius: 10px;
            border-left: 5px solid #2E5C8A;
            transition: all 0.3s;
        }

        .vocab-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .vocab-word {
            font-weight: bold;
            color: #1E3A5F;
            font-size: 1.2em;
        }

        .vocab-example {
            color: #2E5C8A;
            font-style: italic;
            font-size: 1.05em;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 24px;
            border: 3px solid #2E5C8A;
            background: white;
            color: #1E3A5F;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            background: #2E5C8A;
            color: white;
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #2E5C8A 0%, #1E3A5F 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(47, 107, 125, 0.3);
        }

        .back-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%);
            color: #333;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #BDBDBD 0%, #9E9E9E 100%);
            transform: translateY(-2px);
        }

        .quiz-question {
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .quiz-question h3 {
            color: #1E3A5F;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .quiz-hint {
            color: #2E5C8A;
            font-style: italic;
            margin-top: 10px;
        }

        .quiz-options {
            display: grid;
            gap: 12px;
        }

        .quiz-option {
            padding: 15px 25px;
            background: white;
            border: 3px solid #4A90E2;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
            text-align: left;
        }

        .quiz-option:hover {
            background: #D6E9F8;
            transform: translateX(10px);
        }

        .quiz-option.correct {
            background: linear-gradient(135deg, #81C784 0%, #66BB6A 100%);
            border-color: #66BB6A;
            color: white;
        }

        .quiz-option.wrong {
            background: linear-gradient(135deg, #E57373 0%, #EF5350 100%);
            border-color: #EF5350;
            color: white;
        }

        .quiz-result {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            border-radius: 15px;
            margin-top: 20px;
        }

        .quiz-result h2 {
            color: #1E3A5F;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .quiz-result p {
            font-size: 1.3em;
            color: #2E5C8A;
        }

        .flashcard-container {
            perspective: 1000px;
            margin: 30px auto;
            max-width: 500px;
        }

        .flashcard {
            width: 100%;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-radius: 20px;
            font-size: 1.5em;
            text-align: center;
        }

        .flashcard-front {
            background: linear-gradient(135deg, #4A90E2 0%, #2E5C8A 100%);
            color: white;
            border: 4px solid #1E3A5F;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #81C784 0%, #66BB6A 100%);
            color: white;
            transform: rotateY(180deg);
            border: 4px solid #4CAF50;
        }

        .flashcard-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .practice-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #4A90E2 0%, #2E5C8A 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .practice-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(47, 107, 125, 0.4);
        }

        .hangman-word {
            font-size: 2.5em;
            letter-spacing: 15px;
            margin: 30px 0;
            font-family: monospace;
            color: #1E3A5F;
        }

        .letter-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }

        .letter-btn {
            width: 45px;
            height: 45px;
            border: 2px solid #2E5C8A;
            background: white;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #1E3A5F;
        }

        .letter-btn:hover:not(:disabled) {
            background: #2E5C8A;
            color: white;
        }

        .letter-btn:disabled {
            background: #E0E0E0;
            border-color: #BDBDBD;
            color: #9E9E9E;
            cursor: not-allowed;
        }

        .progress-bar {
            height: 30px;
            background: #E0E0E0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            background: linear-gradient(135deg, #81C784 0%, #66BB6A 100%);
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .game-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .game-card {
            background: linear-gradient(135deg, #D6E9F8 0%, #B3D9F2 100%);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #4A90E2;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border-color: #2E5C8A;
        }

        .game-card h4 {
            color: #1E3A5F;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .game-card p {
            color: #2E5C8A;
            font-size: 0.9em;
        }
    </style>
</head>

        <div id="quizContent" class="quiz-section">

        <div id="flashcardContent" class="flashcard-section">

            <div class="progress-bar">

                    <div class="flashcard-back">
                        <div id="flashcardBack"></div>

            </div>
            <div class="flashcard-controls">
                <button class="practice-btn" onclick="nextCard()">Nächste Karte →</button>
                <button class="skip-btn" onclick="skipFlashcard()">Überspringen</button>
            </div>
        </div>

        <div id="gameContent" class="game-section">
            <button class="back-btn" onclick="backToVocab()">← Zurück</button>
            <div id="gameArea"></div>

                    { word: "ferner", question: "Welches gehobene Adverb fügt einen weiteren Punkt hinzu?", hint: "Zusätzlich" },
                    { word: "überdies", question: "Welches gehobene Adverb bedeutet 'darüber hinaus'?", hint: "Obendrein" },
                    { word: "zudem", question: "Welches kurze Adverb bedeutet 'außerdem'?", hint: "Zusätzlich" },
                    { word: "demnach", question: "Welches Adverb leitet eine logische Folgerung ein?", hint: "Folglich" },
                    { word: "demzufolge", question: "Welches Adverb zeigt eine Konsequenz an?", hint: "Infolgedessen" },
                    { word: "infolgedessen", question: "Welches Adverb verbindet Ursache und Wirkung?", hint: "Deshalb" },
                    { word: "insofern", question: "Welches Adverb schränkt eine Aussage auf einen bestimmten Aspekt ein?", hint: "In dieser Hinsicht" },
                    { word: "hingegen", question: "Welches Adverb stellt einen Gegensatz her?", hint: "Im Gegensatz dazu" },
                    { word: "demgegenüber", question: "Welches Adverb kontrastiert zwei Aussagen?", hint: "Andererseits" },
                    { word: "andererseits", question: "Welches Adverb zeigt die andere Seite einer Sache?", hint: "Auf der anderen Seite" },
                    { word: "einerseits", question: "Welches Adverb leitet die erste von zwei Seiten ein?", hint: "Auf der einen Seite" },
                    { word: "zwar", question: "Welches Adverb leitet eine eingeschränkte Bestätigung ein (oft mit 'aber')?", hint: "Wohl, aber..." },
                    { word: "allerdings", question: "Welches Adverb schränkt eine vorherige Aussage ein?", hint: "Jedoch" },
                    { word: "dennoch", question: "Welches Adverb zeigt an, dass etwas trotz eines Hindernisses geschieht?", hint: "Trotzdem" },
                    { word: "nichtsdestotrotz", question: "Welches lange Adverb ist eine gehobene Form von 'trotzdem'?", hint: "Gleichwohl" },
                    { word: "nichtsdestoweniger", question: "Welche sehr förmliche Variante bedeutet 'trotz allem'?", hint: "Dennoch" },
                    { word: "obgleich", question: "Welche Konjunktion leitet einen Nebensatz ein, der einen Gegensatz ausdrückt?", hint: "Obwohl" },
                    { word: "wenngleich", question: "Welche gehobene Konjunktion bedeutet 'auch wenn'?", hint: "Obschon" },
                    { word: "gleichwohl", question: "Welches gehobene Adverb bedeutet 'trotzdem'?", hint: "Dennoch" },
                    { word: "indessen", question: "Welches gehobene Adverb bedeutet 'in der Zwischenzeit' oder 'jedoch'?", hint: "Unterdessen" },
                    { word: "somit", question: "Welches Adverb zieht eine Schlussfolgerung?", hint: "Also" },
                    { word: "mithin", question: "Welches gehobene Adverb bedeutet 'folglich' oder 'demnach'?", hint: "Somit" },
                    { word: "indes", question: "Welches kurze, gehobene Adverb bedeutet 'jedoch' oder 'unterdessen'?", hint: "Aber" },
                    { word: "keineswegs", question: "Welches Adverb verneint etwas nachdrücklich?", hint: "Auf keinen Fall" },
                    { word: "mitnichten", question: "Welches veraltete Adverb bedeutet 'keinesfalls'?", hint: "Ganz und gar nicht" },
                    { word: "freilich", question: "Welches Adverb räumt etwas ein und bedeutet 'natürlich' oder 'allerdings'?", hint: "Sicherlich" },
                    { word: "zugegebenermaßen", question: "Welches Adverb leitet ein Eingeständnis ein?", hint: "Man muss zugeben" },
                    { word: "ungeachtet", question: "Welche Präposition bedeutet 'ohne Rücksicht auf'?", hint: "Trotz" },
                    { word: "angesichts", question: "Welche Präposition bedeutet 'in Anbetracht von'?", hint: "Im Hinblick auf" },
                    { word: "hinsichtlich", question: "Welche Präposition bedeutet 'was ... betrifft'?", hint: "Bezüglich" },
                    { word: "zwecks", question: "Welche gehobene Präposition bedeutet 'zum Zweck von'?", hint: "Um ... zu" }
                ]
            }
        };

        let currentTheme = '';
        let currentMode = 'vocab';
        let quizIndex = 0;
        let quizScore = 0;
        let shuffledQuiz = [];
        let flashcardIndex = 0;
        let shuffledFlashcards = [];
        let gameData = {};
        let stats = {
            words: 0,
            quizzes: 0,
            games: 0,
            skipped: 0
        };

        function loadStats() {
            const saved = localStorage.getItem('vocabStats6');
            if (saved) {
                stats = JSON.parse(saved);
            }
        }

        function saveStats() {
            localStorage.setItem('vocabStats6', JSON.stringify(stats));
            updateStats();
        }

        function updateStats() {
            document.getElementById('statsWords').textContent = stats.words;
            document.getElementById('statsQuizzes').textContent = stats.quizzes;
            document.getElementById('statsGames').textContent = stats.games;
            document.getElementById('statsSkipped').textContent = stats.skipped;
        }

        function showThemes() {
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('vocabContent').classList.remove('active');
            document.getElementById('quizContent').classList.remove('active');
            document.getElementById('flashcardContent').classList.remove('active');
            document.getElementById('gameContent').classList.remove('active');
            
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';
            
            for (const [key, theme] of Object.entries(vocabData)) {
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.onclick = () => selectTheme(key);
                card.innerHTML = `
                    <h3>${theme.name}</h3>
                    <p class="word-count">${theme.words.length} Wörter</p>
                `;
                grid.appendChild(card);
            }
        }

        function selectTheme(theme) {
            currentTheme = theme;
            currentMode = 'vocab';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('vocabContent').classList.add('active');
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.mode-btn').classList.add('active');
            displayVocabList();
        }

        function showMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'vocab') {
                displayVocabList();
            } else if (mode === 'quiz') {
                startQuiz();
            } else if (mode === 'flashcard') {
                startFlashcards();
            } else if (mode === 'game') {
                showGameOptions();
            }
        }

        function displayVocabList() {
            hideAllSections();
            document.getElementById('vocabContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            let html = `<div class="vocab-list"><h2 style="color: #1E3A5F; margin-bottom: 20px;">📚 ${vocabData[currentTheme].name}</h2>`;
            
            for (const word of words) {
                html += `
                    <div class="vocab-item">
                        <div class="vocab-word">${word.word}</div>
                        <div class="vocab-example">${word.question}</div>
                    </div>
                `;
            }
            
            html += '</div>';
            document.getElementById('contentArea').innerHTML = html;
        }

        function startQuiz() {
            hideAllSections();
            document.getElementById('quizContent').classList.add('active');
            
            shuffledQuiz = [...vocabData[currentTheme].words].sort(() => Math.random() - 0.5);
            quizIndex = 0;
            quizScore = 0;
            displayQuizQuestion();
        }

        function displayQuizQuestion() {
            if (quizIndex >= shuffledQuiz.length) {
                showQuizResult();
                return;
            }
            
            const current = shuffledQuiz[quizIndex];
            const allWords = vocabData[currentTheme].words;
            
            // Generate wrong answers
            let options = [current.word];
            while (options.length < 4) {
                const random = allWords[Math.floor(Math.random() * allWords.length)].word;
                if (!options.includes(random)) {
                    options.push(random);
                }
            }
            options = options.sort(() => Math.random() - 0.5);
            
            let html = `
                <div class="quiz-question">
                    <h3>Frage ${quizIndex + 1} von ${shuffledQuiz.length}</h3>
                    <p style="font-size: 1.3em; color: #2E5C8A; margin: 20px 0;">${current.question}</p>
                    <p class="quiz-hint">💡 Hinweis: ${current.hint}</p>
                </div>
                <div class="quiz-options">
            `;
            
            for (const option of options) {
                html += `<div class="quiz-option" onclick="checkAnswer(this, '${option}', '${current.word}')">${option}</div>`;
            }
            
            html += '</div>';
            html += `<button class="skip-btn" style="margin-top: 15px;" onclick="skipQuizQuestion()">Überspringen</button>`;
            document.getElementById('quizArea').innerHTML = html;
        }

        function checkAnswer(element, selected, correct) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
                if (opt.textContent === correct) {
                    opt.classList.add('correct');
                }
            });
            
            if (selected === correct) {
                element.classList.add('correct');
                quizScore++;
                stats.words++;
            } else {
                element.classList.add('wrong');
            }
            
            saveStats();
            setTimeout(() => {
                quizIndex++;
                displayQuizQuestion();
            }, 1500);
        }
        
        function skipQuizQuestion() {
            stats.skipped++;
            saveStats();
            // Add current question to end of quiz
            shuffledQuiz.push(shuffledQuiz[quizIndex]);
            quizIndex++;
            displayQuizQuestion();
        }

        function showQuizResult() {
            const percentage = Math.round((quizScore / shuffledQuiz.length) * 100);
            stats.quizzes++;
            saveStats();
            
            document.getElementById('quizArea').innerHTML = `
                <div class="quiz-result">
                    <h2>🎉 Quiz beendet!</h2>
                    <p>Du hast ${quizScore} von ${shuffledQuiz.length} Fragen richtig beantwortet (${percentage}%)</p>
                    <button class="practice-btn" style="margin-top: 20px;" onclick="startQuiz()">Nochmal spielen</button>
                </div>
            `;
        }

        function startFlashcards() {
            hideAllSections();
            document.getElementById('flashcardContent').classList.add('active');
            
            shuffledFlashcards = [...vocabData[currentTheme].words].sort(() => Math.random() - 0.5);
            flashcardIndex = 0;
            document.getElementById('totalCards').textContent = shuffledFlashcards.length;
            displayFlashcard();
        }

        function displayFlashcard() {
            if (flashcardIndex >= shuffledFlashcards.length) {
                flashcardIndex = 0;
            }
            
            const current = shuffledFlashcards[flashcardIndex];
            document.getElementById('flashcardFront').innerHTML = `
                <div>
                    <p style="font-size: 0.9em; margin-bottom: 10px;">Frage:</p>
                    <p>${current.question}</p>
                    <p style="font-size: 0.8em; margin-top: 15px; opacity: 0.8;">💡 ${current.hint}</p>
                </div>
            `;
            document.getElementById('flashcardBack').innerHTML = `<strong>${current.word}</strong>`;
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('cardNumber').textContent = flashcardIndex + 1;
            
            const progress = ((flashcardIndex + 1) / shuffledFlashcards.length) * 100;
            document.getElementById('cardProgress').style.width = progress + '%';
            document.getElementById('cardProgress').textContent = Math.round(progress) + '%';
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            stats.words++;
            saveStats();
            flashcardIndex++;
            if (flashcardIndex >= shuffledFlashcards.length) {
                flashcardIndex = 0;
            }
            displayFlashcard();
        }
        
        function skipFlashcard() {
            stats.skipped++;
            saveStats();
            // Move current card to end
            shuffledFlashcards.push(shuffledFlashcards[flashcardIndex]);
            flashcardIndex++;
            displayFlashcard();
        }

        function showGameOptions() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            document.getElementById('gameArea').innerHTML = `
                <h2 style="color: #1E3A5F; text-align: center; margin-bottom: 30px;">🎮 Wähle ein Spiel</h2>
                <div class="game-selector">
                    <div class="game-card" onclick="startHangman()">
                        <h4>🎮 Hangman</h4>
                        <p>Errate das Wort Buchstabe für Buchstabe</p>
                    </div>
                    <div class="game-card" onclick="startFillBlank()">
                        <h4>✍️ Lückentext</h4>
                        <p>Fülle die fehlenden Wörter ein</p>
                    </div>
                    <div class="game-card" onclick="startScramble()">
                        <h4>🔤 Wort-Scramble</h4>
                        <p>Ordne die Buchstaben richtig</p>
                    </div>
                </div>
            `;
        }

        function startFillBlank() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const wordToBlank = current.word;
            
            gameData = { current, wordToBlank };
            
            document.getElementById('gameArea').innerHTML = `
                <h2 style="color: #1E3A5F;">✍️ Fülle die Lücke aus</h2>
                <p style="font-size: 1.5em; margin: 30px 0; color: #2E5C8A;">${current.question}</p>
                <p style="color: #666; font-style: italic; font-size: 0.9em; margin-bottom: 20px;">Hinweis: ${current.hint}</p>
                <input type="text" id="fillInput" placeholder="Deine Antwort..." 
                    style="font-size: 1.3em; padding: 15px; border: 3px solid #2E5C8A; border-radius: 10px; width: 80%; max-width: 400px;">
                <br><br>
                <button class="practice-btn" onclick="checkFillBlank()">Überprüfen</button>
                <button class="skip-btn" onclick="skipFillBlank()">Nächstes Wort</button>
                <div id="fillResult" style="margin-top: 20px; font-size: 1.2em;"></div>
            `;
        }

        function checkFillBlank() {
            const input = document.getElementById('fillInput').value.trim();
            const result = document.getElementById('fillResult');
            
            if (input.toLowerCase() === gameData.wordToBlank.toLowerCase()) {
                result.innerHTML = `<p style="color: #66BB6A; font-weight: bold;">✅ Richtig! ${gameData.wordToBlank}</p>`;
                stats.games++;
                saveStats();
                setTimeout(() => startFillBlank(), 2000);
            } else {
                result.innerHTML = `<p style="color: #E53935; font-weight: bold;">❌ Nicht ganz. Versuche es nochmal!</p>`;
            }
        }
        
        function skipFillBlank() {
            stats.skipped++;
            saveStats();
            const words = vocabData[currentTheme].words;
            words.push(gameData.current);
            startFillBlank();
        }

        function startHangman() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const word = current.word.toUpperCase();
            const guessed = [];
            let mistakes = 0;
            
            gameData = { word, guessed, mistakes, current };
            displayHangman();
        }

        function displayHangman() {
            const display = gameData.word.split('').map(letter => 
                gameData.guessed.includes(letter) || letter === ' ' ? letter : '_'
            ).join(' ');
            
            let html = `
                <h2 style="color: #1E3A5F;">🎮 Hangman</h2>
                <p style="color: #2E5C8A; margin: 20px 0;">Fehler: ${gameData.mistakes} / 6</p>
                <div class="hangman-word">${display}</div>
                <p style="color: #2E5C8A; font-style: italic; margin: 20px 0;">${gameData.current.hint}</p>
                <div class="letter-buttons">
            `;
            
            const alphabet = ['A', 'Ä', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'Ö', 'P', 'Q', 'R', 'S', 'T', 'U', 'Ü', 'V', 'W', 'X', 'Y', 'Z', 'ß'];
            
            for (const letter of alphabet) {
                const disabled = gameData.guessed.includes(letter) ? 'disabled' : '';
                html += `<button class="letter-btn" ${disabled} onclick="guessLetter('${letter}')">${letter}</button>`;
            }
            
            html += '</div>';
            
            if (display.replace(/ /g, '') === gameData.word.replace(/ /g, '')) {
                html += `<p style="color: #66BB6A; font-size: 1.5em; margin-top: 20px; font-weight: bold;">🎉 Gewonnen!</p>`;
                html += `<button class="practice-btn" style="margin-top: 20px;" onclick="startHangman()">Nächstes Wort</button>`;
                stats.games++;
                saveStats();
            } else if (gameData.mistakes >= 6) {
                html += `<p style="color: #E53935; font-size: 1.5em; margin-top: 20px; font-weight: bold;">😢 Verloren! Das Wort war: ${gameData.word}</p>`;
                html += `<button class="practice-btn" style="margin-top: 20px;" onclick="startHangman()">Nächstes Wort</button>`;
            } else {
                html += `<button class="skip-btn" style="margin-top: 20px;" onclick="skipHangman()">Nächstes Wort</button>`;
            }
            
            document.getElementById('gameArea').innerHTML = html;
        }
        
        function skipHangman() {
            stats.skipped++;
            saveStats();
            // Save current word to be repeated later
            const words = vocabData[currentTheme].words;
            const skippedWord = gameData.current;
            words.push(skippedWord);
            startHangman();
        }

        function guessLetter(letter) {
            if (!gameData.guessed.includes(letter)) {
                gameData.guessed.push(letter);
                if (!gameData.word.includes(letter)) {
                    gameData.mistakes++;
                }
            }
            displayHangman();
        }

        function startScramble() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const word = current.word;
            const scrambled = word.split('').sort(() => Math.random() - 0.5).join('');
            
            gameData = { word, scrambled, current };
            
            document.getElementById('gameArea').innerHTML = `
                <h2 style="color: #1E3A5F;">🔤 Wort-Scramble</h2>
                <p style="font-size: 1.2em; color: #2E5C8A; margin: 20px 0;">Ordne die Buchstaben:</p>
                <p style="font-size: 2.5em; color: #1E3A5F; font-weight: bold; letter-spacing: 5px; margin: 20px 0;">${scrambled}</p>
                <p style="color: #2E5C8A; font-style: italic; margin: 20px 0;">${current.hint}</p>
                <input type="text" id="scrambleInput" placeholder="Deine Antwort..." 
                    style="font-size: 1.3em; padding: 15px; border: 3px solid #2E5C8A; border-radius: 10px; width: 80%; max-width: 400px;">
                <br><br>
                <button class="practice-btn" onclick="checkScramble()">Überprüfen</button>
                <button class="skip-btn" onclick="skipScramble()">Nächstes Wort</button>
                <div id="scrambleResult" style="margin-top: 20px; font-size: 1.2em;"></div>
            `;
        }

        function checkScramble() {
            const input = document.getElementById('scrambleInput').value.trim();
            const result = document.getElementById('scrambleResult');
            
            if (input.toLowerCase() === gameData.word.toLowerCase()) {
                result.innerHTML = `<p style="color: #66BB6A; font-weight: bold;">✅ Richtig! ${gameData.word}</p>`;
                stats.games++;
                saveStats();
                setTimeout(() => startScramble(), 2000);
            } else {
                result.innerHTML = `<p style="color: #E53935; font-weight: bold;">❌ Nicht ganz. Versuche es nochmal!</p>`;
            }
        }
        
        function skipScramble() {
            stats.skipped++;
            saveStats();
            const words = vocabData[currentTheme].words;
            words.push(gameData.current);
            startScramble();
        }

        function hideAllSections() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('vocabContent').classList.remove('active');
            document.getElementById('quizContent').classList.remove('active');
            document.getElementById('flashcardContent').classList.remove('active');
            document.getElementById('gameContent').classList.remove('active');
        }

        function backToThemes() {
            showThemes();
        }

        function backToVocab() {
            hideAllSections();
            document.getElementById('vocabContent').classList.add('active');
            currentMode = 'vocab';
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.mode-btn').classList.add('active');
            displayVocabList();
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', function() {
            loadStats();
            updateStats();
            showThemes();
        });
    </script>
</body>
</html>
