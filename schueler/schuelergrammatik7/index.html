<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die drei Funktionen von "werden" - Deutsche Grammatik</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #303f9f 25%, #3f51b5 50%, #ff6f00 75%, #ffb300 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
            color: #212121;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .top-navigation {
            background: linear-gradient(135deg, #1a237e, #303f9f);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .home-link {
            background: #ffb300;
            color: #212121 !important;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .home-link:hover {
            background: #ff8f00;
            transform: translateY(-2px);
        }

        .tutoring-link {
            background: #00695c;
            color: white !important;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .tutoring-link:hover {
            background: #004d40;
            transform: translateY(-2px);
        }

        .header {
            background: linear-gradient(135deg, #ff6f00, #ffb300, #ffc107);
            color: #212121;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: float 30s infinite linear;
        }

        @keyframes float {
            0% { transform: translateX(-50px) translateY(-50px); }
            100% { transform: translateX(50px) translateY(50px); }
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
            font-weight: 700;
        }

        .header p {
            font-size: 1.2em;
            position: relative;
            z-index: 2;
            font-weight: 500;
        }

        .content {
            padding: 30px;
        }

        .section-card {
            background: linear-gradient(135deg, #fff3e0, #ffcc80);
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 8px 25px rgba(255, 111, 0, 0.2);
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .section-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 111, 0, 0.3);
            border-color: #ff6f00;
        }

        .section-header {
            background: linear-gradient(135deg, #ff6f00, #ff8f00);
            color: #212121;
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.3em;
        }

        .section-header:hover {
            background: linear-gradient(135deg, #ff8f00, #ffb300);
        }

        .toggle-arrow {
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }

        .section-header.active .toggle-arrow {
            transform: rotate(180deg);
        }

        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 25px;
        }

        .section-content.active {
            max-height: 4000px;
            padding: 25px;
        }

        .subsection {
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #ff6f00;
        }

        .function-box {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border: 2px solid #1976d2;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
        }

        .function-box h3 {
            color: #1565c0;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .example-box {
            background: rgba(76, 175, 80, 0.1);
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .zeitformen-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .zeitformen-table th {
            background: linear-gradient(135deg, #1a237e, #303f9f);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .zeitformen-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .zeitformen-table tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .exercise-area {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            border: 2px solid #ff6f00;
        }

        .exercise-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #1565c0;
        }

        .exercise-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .option-button {
            background: #f5f5f5;
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: 500;
        }

        .option-button:hover {
            background: #e3f2fd;
            border-color: #1976d2;
        }

        .option-button.correct {
            background: #c8e6c9;
            border-color: #4caf50;
            color: #2e7d32;
        }

        .option-button.incorrect {
            background: #ffcdd2;
            border-color: #f44336;
            color: #c62828;
        }

        .button {
            background: linear-gradient(135deg, #ff6f00, #ff8f00);
            color: #212121;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
            text-decoration: none;
            display: inline-block;
        }

        .button:hover {
            background: linear-gradient(135deg, #ff8f00, #ffb300);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 143, 0, 0.4);
        }

        .text-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ff6f00;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            margin: 10px 0;
        }

        .text-input:focus {
            outline: none;
            border-color: #ff8f00;
            box-shadow: 0 0 10px rgba(255, 111, 0, 0.3);
        }

        .tip-box {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-left: 4px solid #ff9800;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .warning-box {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            transition: width 0.3s ease;
        }

        .center-link {
            text-align: center;
            margin: 40px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            border: 2px solid #ff6f00;
        }

        .center-link a {
            background: linear-gradient(135deg, #1a237e, #303f9f);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 1.1em;
        }

        .center-link a:hover {
            background: linear-gradient(135deg, #303f9f, #3f51b5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.4);
        }

        @media (max-width: 768px) {
            .content {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .nav-buttons {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="top-navigation">
            <div class="nav-buttons">
                <a href="#" class="home-link">Zurück zur Hauptseite</a>
                <a href="#" class="tutoring-link">Unterricht buchen</a>
            </div>
        </nav>

        <header class="header">
            <h1>Die drei Funktionen von "werden"</h1>
            <p>Deutsche Grammatik leicht erklärt</p>
        </header>

        <main class="content">
            <div class="center-link">
                <a href="werden-funktionen7.html">Werden-Funktionen erweitert</a>
            </div>
            
            <div class="section-card">
                <div class="section-header">
                    <span>Grundlagen der deutschen Zeitformen</span>
                    <span class="toggle-arrow">▼</span>
                </div>
                <div class="section-content">
                    <p>Hier können Sie später weitere Inhalte zu den deutschen Zeitformen hinzufügen.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
