<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wortschatz 4. Schulstufe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .level-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .level-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .level-btn.a2 {
            background: #ffd93d;
            color: #333;
        }

        .level-btn.b1 {
            background: #6bcf7f;
            color: white;
        }

        .level-btn.b2 {
            background: #667eea;
            color: white;
        }

        .level-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .level-btn.active {
            transform: scale(1.1);
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .theme-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .theme-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .theme-card .word-count {
            color: #667eea;
            font-weight: bold;
        }

        .vocab-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .vocab-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vocab-list {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            padding: 15px;
            background: white;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .vocab-word {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .vocab-example {
            color: #666;
            font-style: italic;
        }

        .practice-btn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            transition: all 0.3s;
        }

        .practice-btn:hover {
            background: #667eea;
            transform: scale(1.05);
        }

        .quiz-container {
            display: none;
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .quiz-container.active {
            display: block;
        }

        .quiz-question {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #333;
        }

        .quiz-options {
            display: grid;
            gap: 10px;
        }

        .quiz-option {
            padding: 15px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quiz-option:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: #6bcf7f;
            color: white;
            border-color: #6bcf7f;
        }

        .quiz-option.wrong {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }

        .back-btn {
            background: #ddd;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #ccc;
        }

        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }
    </style>
</head>
<body>

                        { word: 'enttäuscht', example: 'Sie war enttäuscht über das Ergebnis.' },

                    ]

                'Freizeit': {
                    words: [
                        { word: 'das Hobby', example: 'Mein Hobby ist Fußballspielen.' },
                        { word: 'der Verein', example: 'Ich bin im Sportverein.' },
                        { word: 'das Instrument', example: 'Ich lerne ein Instrument spielen.' },
                        { word: 'die Mannschaft', example: 'Unsere Mannschaft hat gewonnen.' },
                        { word: 'trainieren', example: 'Wir trainieren zweimal pro Woche.' },

                        { word: 'die Ausrüstung', example: 'Ich brauche neue Ausrüstung.' },

                        { word: 'hingegen', example: 'Er mag Sport, sie hingegen liest lieber.' },
                        { word: 'somit', example: 'Wir haben gewonnen, somit sind wir im Finale.' },

        function selectLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            showThemes();
        }

        function showThemes() {
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';
            document.getElementById('vocabContent').classList.remove('active');
            document.getElementById('quizContent').classList.remove('active');
            document.getElementById('mainContent').style.display = 'block';

            const themes = vocabData[currentLevel];
            for (let theme in themes) {
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.innerHTML = `
                    <h3>${theme}</h3>
                    <p class="word-count">${themes[theme].words.length} Wörter</p>
                `;
                card.onclick = () => showVocab(theme);
                grid.appendChild(card);
            }
        }

        function showVocab(theme) {
            currentTheme = theme;
            const content = document.getElementById('vocabContent');
            const words = vocabData[currentLevel][theme].words;
            
            let html = `
                <button class="back-btn" onclick="showThemes()">← Zurück zu Themen</button>
                <h2>${theme} - ${currentLevel.toUpperCase()}</h2>
                <div class="vocab-list">
            `;

            words.forEach(item => {
                html += `
                    <div class="vocab-item">
                        <div class="vocab-word">${item.word}</div>
                        <div class="vocab-example">${item.example}</div>
                    </div>
                `;
            });

            html += `
                </div>
                <button class="practice-btn" onclick="startQuiz()">🎯 Quiz starten</button>
            `;

            content.innerHTML = html;
            content.classList.add('active');
            document.getElementById('mainContent').style.display = 'none';
        }

        function startQuiz() {
            const words = vocabData[currentLevel][currentTheme].words;
            quizScore = 0;
            currentQuestion = 0;
            
            const quizContainer = document.getElementById('quizContent');
            document.getElementById('vocabContent').classList.remove('active');
            quizContainer.classList.add('active');
            
            showQuestion();
        }

        function showQuestion() {
            const words = vocabData[currentLevel][currentTheme].words;
            if (currentQuestion >= words.length) {
                showResults();
                return;
            }

            const current = words[currentQuestion];
            const allWords = [...words];
            const wrongOptions = allWords.filter(w => w.word !== current.word)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3);
            
            const options = [...wrongOptions, current].sort(() => Math.random() - 0.5);

            let html = `
                <button class="back-btn" onclick="backToVocab()">← Zurück</button>
                <div class="quiz-question">
                    Frage ${currentQuestion + 1}/${words.length}<br><br>
                    Welches Wort passt zu diesem Satz?<br>
                    <strong>"${current.example}"</strong>
                </div>
                <div class="quiz-options">
            `;

            options.forEach(opt => {
                html += `<div class="quiz-option" onclick="checkAnswer('${opt.word}', '${current.word}')">${opt.word}</div>`;
            });

            html += '</div>';
            document.getElementById('quizContent').innerHTML = html;
        }

        function checkAnswer(selected, correct) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
                if (opt.textContent === correct) {
                    opt.classList.add('correct');
                } else if (opt.textContent === selected && selected !== correct) {
                    opt.classList.add('wrong');
                }
            });

            if (selected === correct) {
                quizScore++;
            }

            setTimeout(() => {
                currentQuestion++;
                showQuestion();
            }, 1500);
        }

        function showResults() {
            const words = vocabData[currentLevel][currentTheme].words;
            const percentage = Math.round((quizScore / words.length) * 100);
            let emoji = percentage >= 80 ? '🌟' : percentage >= 60 ? '👍' : '💪';
            
            document.getElementById('quizContent').innerHTML = `
                <h2>${emoji} Quiz beendet!</h2>
                <p style="font-size: 2em; margin: 20px 0;">${quizScore} / ${words.length}</p>
                <p style="font-size: 1.2em; margin-bottom: 30px;">Das sind ${percentage}%!</p>
                <button class="practice-btn" onclick="startQuiz()">🔄 Nochmal üben</button>
                <button class="back-btn" onclick="backToVocab()">← Zurück zur Wortliste</button>
            `;
        }

        function backToVocab() {
            document.getElementById('quizContent').classList.remove('active');
            document.getElementById('vocabContent').classList.add('active');
        }

        // Initial load
        showThemes();
    </script>
</body>
</html>
