            padding: 20px;

            padding: 20px;
            border-radius: 15px;
        }

        .stat-card {

            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #87CEEB;

        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #2F6B7D;
        }

        .stat-label {
            color: #4A90A4;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 5px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .theme-card {
            background: linear-gradient(135deg, #E0F7FA 0%, #B0E0E6 100%);
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #87CEEB;
        }

        .theme-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            border-color: #4A90A4;
        }

        .theme-card h3 {
            color: #2F6B7D;
            margin-bottom: 10px;
            font-size: 1.4em;
        }

        .theme-card .word-count {
            color: #4A90A4;
            font-weight: bold;
            font-size: 1.1em;
        }

            display: none;
            animation: fadeIn 0.5s;
        }

            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vocab-list {
            background: linear-gradient(135deg, #F5F9FA 0%, #E0F7FA 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 18px;
            background: white;
            margin-bottom: 12px;
            border-radius: 10px;
            border-left: 5px solid #4A90A4;
            transition: all 0.3s;
        }

        .vocab-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .vocab-word {
            font-weight: bold;
            color: #2F6B7D;
            font-size: 1.2em;
        }

        .vocab-example {
            color: #4A90A4;
            font-style: italic;
            font-size: 1.05em;
        }

        .mode-selector {

            gap: 10px;
            margin: 20px 0;

            justify-content: center;
        }

            padding: 12px 24px;
            border: 3px solid #4A90A4;
            background: white;
            color: #2F6B7D;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            background: #4A90A4;
            color: white;
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #4A90A4 0%, #2F6B7D 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(47, 107, 125, 0.3);
        }

        .back-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%);
            color: #333;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .quiz-question {
            background: linear-gradient(135deg, #E0F7FA 0%, #B0E0E6 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 3px solid #87CEEB;
        }

        .quiz-question h3 {
            color: #2F6B7D;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .quiz-options {
            display: grid;
            gap: 15px;
        }

        .quiz-option {
            padding: 18px;
            background: white;
            border: 3px solid #87CEEB;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }

        .quiz-option:hover {
            background: #E0F7FA;
            border-color: #4A90A4;
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: linear-gradient(135deg, #81C784 0%, #66BB6A 100%);
            color: white;
            border-color: #66BB6A;
        }

        .quiz-option.incorrect {
            background: linear-gradient(135deg, #E57373 0%, #E53935 100%);
            color: white;
            border-color: #E53935;
        }

        .flashcard-container {
            perspective: 1000px;
            margin: 30px auto;
            max-width: 600px;
        }

        .flashcard {
            width: 100%;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 40px;
            font-size: 1.5em;
            text-align: center;

        .flashcard-back {

            transform: rotateY(180deg);
            border: 4px solid #66BB6A;

            justify-content: center;

            font-size: 18px;
            font-weight: bold;

            font-weight: bold;

            max-width: 700px;

            border-radius: 10px;

            font-size: 1.2em;
            font-weight: bold;

            color: #9E9E9E;

            border-color: #BDBDBD;

            height: 30px;
            margin: 20px 0;

</head>

        let currentTheme = 'gefuehle';

            learned: 0,
            quizzes: 0,
            games: 0

        function loadStats() {
            const saved = localStorage.getItem('vocabStats');
            if (saved) {
                stats = JSON.parse(saved);
            }
        }

        function saveStats() {
            localStorage.setItem('vocabStats', JSON.stringify(stats));
            updateStats();
        }

        function updateStats() {
            document.getElementById('statsWords').textContent = stats.learned;
            document.getElementById('statsQuizzes').textContent = stats.quizzes;
            document.getElementById('statsGames').textContent = stats.games;
        }

        function showThemes() {
            // Hide all learning sections but keep mainContent visible
            document.getElementById('vocabContent').classList.remove('active');
            document.getElementById('quizContent').classList.remove('active');
            document.getElementById('flashcardContent').classList.remove('active');
            document.getElementById('gameContent').classList.remove('active');
            
            // Show main content with theme cards
            document.getElementById('mainContent').style.display = 'block';
            
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';
            
            for (let key in vocabData) {
                const theme = vocabData[key];
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.onclick = () => selectTheme(key);
                card.innerHTML = `
                    <h3>${theme.name}</h3>
                    <div class="word-count">${theme.words.length} Wörter</div>
                `;
                grid.appendChild(card);
            }
        }

        function selectTheme(theme) {
            currentTheme = theme;
            hideAllSections();
            document.getElementById('vocabContent').classList.add('active');
            currentMode = 'vocab';
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.mode-btn').classList.add('active');
            displayVocabList();
        }

        function showMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'vocab') displayVocabList();
            else if (mode === 'quiz') startQuiz();
            else if (mode === 'flashcard') startFlashcards();
            else if (mode === 'game') showGames();
        }

        function displayVocabList() {
            const words = vocabData[currentTheme].words;
            let html = '<div class="vocab-list">';
            
            words.forEach(item => {
                html += `
                    <div class="vocab-item">
                        <div class="vocab-word">${item.word}</div>
                        <div class="vocab-example">${item.example}</div>
                    </div>
                `;
            });
            
            html += '</div>';
            document.getElementById('contentArea').innerHTML = html;
            
            stats.learned += words.length;
            saveStats();
        }

        function startQuiz() {
            hideAllSections();
            document.getElementById('quizContent').classList.add('active');
            
            currentQuestion = 0;
            quizScore = 0;
            showQuizQuestion();
        }

        function showQuizQuestion() {
            const words = vocabData[currentTheme].words;
            if (currentQuestion >= words.length) {
                showQuizResults();
                return;
            }
            
            const current = words[currentQuestion];
            const otherWords = words.filter(w => w.word !== current.word);
            const options = [current.word];
            
            while (options.length < 4 && otherWords.length > 0) {
                const random = otherWords[Math.floor(Math.random() * otherWords.length)];
                if (!options.includes(random.word)) {
                    options.push(random.word);
                }
                otherWords.splice(otherWords.indexOf(random), 1);
            }
            
            options.sort(() => Math.random() - 0.5);
            
            let html = `
                <div class="quiz-question">
                    <h3>Frage ${currentQuestion + 1} von ${words.length}</h3>
                    <p style="font-size: 1.2em; margin: 20px 0; color: #4A90A4;">${current.example}</p>
                    <div class="quiz-options">
            `;
            
            options.forEach(option => {
                html += `
                    <div class="quiz-option" onclick="checkAnswer('${option}', '${current.word}')">
                        ${option}
                    </div>
                `;
            });
            
            html += '</div></div>';
            document.getElementById('quizArea').innerHTML = html;
        }

        function checkAnswer(selected, correct) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(option => {
                option.style.pointerEvents = 'none';
                if (option.textContent.trim() === correct) {
                    option.classList.add('correct');
                } else if (option.textContent.trim() === selected && selected !== correct) {
                    option.classList.add('incorrect');
                }
            });
            
            if (selected === correct) quizScore++;
            
            setTimeout(() => {
                currentQuestion++;
                showQuizQuestion();
            }, 1500);
        }

        function showQuizResults() {
            const total = vocabData[currentTheme].words.length;
            const percentage = Math.round((quizScore / total) * 100);
            
            stats.quizzes++;
            saveStats();
            
            document.getElementById('quizArea').innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h2 style="color: #2F6B7D; margin-bottom: 30px;">Quiz Ergebnis</h2>
                    <p style="font-size: 3em; color: ${percentage >= 70 ? '#66BB6A' : '#E53935'}; font-weight: bold; margin-bottom: 20px;">
                        ${quizScore} / ${total}
                    </p>
                    <p style="font-size: 1.5em; margin-bottom: 30px; color: #2F6B7D;">Das sind ${percentage}%!</p>
                    <button class="practice-btn" onclick="startQuiz()">🔄 Nochmal üben</button>
                </div>
            `;
        }

        function startFlashcards() {
            hideAllSections();
            document.getElementById('flashcardContent').classList.add('active');
            currentCard = 0;
            isFlipped = false;
            showCard();
        }

        function showCard() {
            const words = vocabData[currentTheme].words;
            document.getElementById('totalCards').textContent = words.length;
            document.getElementById('cardNumber').textContent = currentCard + 1;
            
            const progress = ((currentCard + 1) / words.length) * 100;
            document.getElementById('cardProgress').style.width = progress + '%';
            document.getElementById('cardProgress').textContent = Math.round(progress) + '%';

            const current = words[currentCard];
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.remove('flipped');
            isFlipped = false;
            
            document.getElementById('flashcardFront').innerHTML = `
                <div class="flashcard-word">${current.question}</div>
            `;
            
            document.getElementById('flashcardBack').innerHTML = `
                <div class="flashcard-word">${current.word}</div>
            `;
        }

        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            
            if (!isFlipped) {
                flashcard.classList.add('flipped');
                isFlipped = true;
            } else {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextCard() {
            const words = vocabData[currentTheme].words;
            currentCard = (currentCard + 1) % words.length;
            showCard();
            
            if (currentCard === 0) {
                stats.learned += words.length;
                saveStats();
            }
        }

            document.getElementById('contentArea').innerHTML = `

                    <div class="game-card" onclick="startHangman()">

                    <div class="game-card" onclick="startScramble()">

        function startFillBlank() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const wordToBlank = current.word;
            const blanked = current.example.replace(wordToBlank, '___________');
            
            gameData = { current, blanked, wordToBlank };
            
            document.getElementById('gameArea').innerHTML = `
                <h2 style="color: #2F6B7D;">✍️ Fülle die Lücke aus</h2>
                <p style="font-size: 1.5em; margin: 30px 0; color: #4A90A4;">${blanked}</p>
                <input type="text" id="fillInput" placeholder="Deine Antwort..." 
                    style="font-size: 1.3em; padding: 15px; border: 3px solid #4A90A4; border-radius: 10px; width: 80%; max-width: 400px;">
                <br><br>
                <button class="practice-btn" onclick="checkFillBlank()">Überprüfen</button>
                <div id="fillResult" style="margin-top: 20px; font-size: 1.2em;"></div>
            `;
        }

        function checkFillBlank() {
            const input = document.getElementById('fillInput').value.trim();
            const result = document.getElementById('fillResult');
            
            if (input.toLowerCase() === gameData.wordToBlank.toLowerCase()) {
                result.innerHTML = `<p style="color: #66BB6A; font-weight: bold;">✅ Richtig! ${gameData.wordToBlank}</p>`;
                stats.games++;
                saveStats();
                setTimeout(() => startFillBlank(), 2000);
            } else {
                result.innerHTML = `<p style="color: #E53935; font-weight: bold;">❌ Nicht ganz. Versuche es nochmal!</p>`;
            }
        }

        function startHangman() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const word = current.word.toUpperCase();
            const guessed = [];
            let mistakes = 0;
            
            gameData = { word, guessed, mistakes, current };
            displayHangman();
        }

        function displayHangman() {
            const display = gameData.word.split('').map(letter => 
                gameData.guessed.includes(letter) || letter === ' ' ? letter : '_'
            ).join(' ');
            
            let html = `
                <h2 style="color: #2F6B7D;">🎮 Hangman</h2>
                <p style="color: #4A90A4; margin: 20px 0;">Fehler: ${gameData.mistakes} / 6</p>
                <div class="hangman-word">${display}</div>
                <p style="color: #4A90A4; font-style: italic; margin: 20px 0;">${gameData.current.hint}</p>
                <div class="letter-buttons">
            `;
            
            const alphabet = ['A', 'Ä', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'Ö', 'P', 'Q', 'R', 'S', 'T', 'U', 'Ü', 'V', 'W', 'X', 'Y', 'Z', 'ß'];
            
            for (const letter of alphabet) {
                const disabled = gameData.guessed.includes(letter) ? 'disabled' : '';
                html += `<button class="letter-btn" ${disabled} onclick="guessLetter('${letter}')">${letter}</button>`;
            }
            
            html += '</div>';
            
            if (display.replace(/ /g, '') === gameData.word.replace(/ /g, '')) {
                html += `<p style="color: #66BB6A; font-size: 1.5em; margin-top: 20px; font-weight: bold;">🎉 Gewonnen!</p>`;
                html += `<button class="practice-btn" style="margin-top: 20px;" onclick="startHangman()">Nächstes Wort</button>`;
                stats.games++;
                saveStats();
            } else if (gameData.mistakes >= 6) {
                html += `<p style="color: #E53935; font-size: 1.5em; margin-top: 20px; font-weight: bold;">😢 Verloren! Das Wort war: ${gameData.word}</p>`;
                html += `<button class="practice-btn" style="margin-top: 20px;" onclick="startHangman()">Nächstes Wort</button>`;
            } else {
                html += `<button class="practice-btn" style="margin-top: 20px;" onclick="startHangman()">Nächstes Wort</button>`;
            }
            
            document.getElementById('gameArea').innerHTML = html;
        }

        function guessLetter(letter) {
            if (!gameData.guessed.includes(letter)) {
                gameData.guessed.push(letter);
                if (!gameData.word.includes(letter)) {
                    gameData.mistakes++;
                }
            }
            displayHangman();
        }

        function startScramble() {
            hideAllSections();
            document.getElementById('gameContent').classList.add('active');
            
            const words = vocabData[currentTheme].words;
            const current = words[Math.floor(Math.random() * words.length)];
            const word = current.word;
            const scrambled = word.split('').sort(() => Math.random() - 0.5).join('');
            
            gameData = { word, scrambled, current };
            
            document.getElementById('gameArea').innerHTML = `
                <h2 style="color: #2F6B7D;">🔤 Wort-Scramble</h2>
                <p style="font-size: 1.2em; color: #4A90A4; margin: 20px 0;">Ordne die Buchstaben:</p>
                <p style="font-size: 2.5em; color: #2F6B7D; font-weight: bold; letter-spacing: 5px; margin: 20px 0;">${scrambled}</p>
                <p style="color: #4A90A4; font-style: italic; margin: 20px 0;">${current.hint}</p>
                <input type="text" id="scrambleInput" placeholder="Deine Antwort..." 
                    style="font-size: 1.3em; padding: 15px; border: 3px solid #4A90A4; border-radius: 10px; width: 80%; max-width: 400px;">
                <br><br>
                <button class="practice-btn" onclick="checkScramble()">Überprüfen</button>
                <div id="scrambleResult" style="margin-top: 20px; font-size: 1.2em;"></div>
            `;
        }

        function checkScramble() {
            const input = document.getElementById('scrambleInput').value.trim();
            const result = document.getElementById('scrambleResult');
            
            if (input.toLowerCase() === gameData.word.toLowerCase()) {
                result.innerHTML = `<p style="color: #66BB6A; font-weight: bold;">✅ Richtig! ${gameData.word}</p>`;
                stats.games++;
                saveStats();
                setTimeout(() => startScramble(), 2000);
            } else {
                result.innerHTML = `<p style="color: #E53935; font-weight: bold;">❌ Nicht ganz. Versuche es nochmal!</p>`;
            }
        }

        function hideAllSections() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('vocabContent').classList.remove('active');
            document.getElementById('quizContent').classList.remove('active');
            document.getElementById('flashcardContent').classList.remove('active');
            document.getElementById('gameContent').classList.remove('active');
        }

        function backToThemes() {
            showThemes();
        }

        function backToVocab() {
            hideAllSections();
            document.getElementById('vocabContent').classList.add('active');
            currentMode = 'vocab';
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.mode-btn').classList.add('active');
            displayVocabList();
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', function() {
            loadStats();
            updateStats();
            showThemes();
        });
    </script>
</body>
</html>
