<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeichensetzung üben - 4. Klasse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #f5576c;
            font-size: 32px;
        }
        .instructions {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #ffc107;
        }
        .exercise {
            background: #f8f9fa;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 2px solid #dee2e6;
        }
        .sentence {
            font-size: 20px;
            line-height: 2;
            margin: 15px 0;
            color: #333;
        }
        .blank {
            display: inline-block;
            min-width: 40px;
            height: 40px;
            border: 2px solid #6c757d;
            border-radius: 5px;
            margin: 0 5px;
            text-align: center;
            font-size: 24px;
            vertical-align: middle;
            background: white;
            cursor: pointer;
            padding: 0 5px;
        }
        .blank:hover {
            background: #e9ecef;
        }
        .blank.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        .blank.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .buttons {
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            background: #f5576c;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #e04456;
            transform: scale(1.05);
        }
        .punctuation-buttons {
            text-align: center;
            margin: 20px 0;
        }
        .punct-btn {
            font-size: 28px;
            min-width: 60px;
            height: 60px;
            margin: 5px;
            border: 3px solid #6c757d;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0 10px;
        }
        .punct-btn:hover {
            background: #e9ecef;
            transform: scale(1.1);
        }
        .punct-btn.selected {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .score {
            text-align: center;
            font-size: 24px;
            margin: 20px 0;
            padding: 15px;
            background: #d1ecf1;
            border-radius: 10px;
            color: #0c5460;
        }
        .hidden {
            display: none;
        }
        .hint {
            font-size: 14px;
            color: #6c757d;
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Zeichensetzung üben 📝</h1>
        
        <div class="instructions">
            <strong>📚 So geht's:</strong><br>
            1. Wähle das richtige Satzzeichen aus (. , ! ? " ")<br>
            2. Klicke auf die leere Box im Satz<br>
            3. Drücke auf "Überprüfen" um deine Antworten zu kontrollieren<br>
            <em>Tipp: Manche Sätze brauchen mehrere Satzzeichen!</em>
        </div>

        <div class="punctuation-buttons">
            <button class="punct-btn" onclick="selectPunct('.')">.</button>
            <button class="punct-btn" onclick="selectPunct(',')">,</button>
            <button class="punct-btn" onclick="selectPunct('!')">!</button>
            <button class="punct-btn" onclick="selectPunct('?')">?</button>
            <button class="punct-btn" onclick="selectPunct('„')" style="font-size: 24px;">„</button>
            <button class="punct-btn" onclick="selectPunct('"')" style="font-size: 24px;">"</button>
        </div>

        <div id="exercises"></div>

        <div class="buttons">
            <button class="btn" onclick="checkAnswers()">✓ Überprüfen</button>
            <button class="btn" onclick="resetExercise()">↻ Neu starten</button>
            <button class="btn" onclick="showSolutions()">💡 Lösungen anzeigen</button>
        </div>

        <div id="score" class="score hidden"></div>
    </div>

    <script>
        const sentences = [
            { text: "Wie heißt du", answer: ["?"], hint: "Eine Frage" },
            { text: "Anna[] Lisa und Tom spielen Fußball", answer: [","], hint: "Aufzählung" },
            { text: "Pass auf", answer: ["!"], hint: "Warnung/Ausruf" },
            { text: "Ich mag Pizza[] Pasta und Eis", answer: [","], hint: "Aufzählung" },
            { text: "Kommst du mit ins Kino", answer: ["?"], hint: "Frage" },
            { text: "Meine Lieblingsfächer sind Turnen[] Deutsch und Mathe", answer: [","], hint: "Aufzählung" },
            { text: "[]Komm schnell[][] rief Mama", answer: ["„", "!", """], hint: "Wörtliche Rede mit Ausruf" },
            { text: "[]Hast du Hunger[][][] fragte Papa", answer: ["„", "?", """, ","], hint: "Wörtliche Rede als Frage mit Komma" },
            { text: "Im Sommer schwimmen wir[] im Winter rodeln wir", answer: [","], hint: "Zwei Hauptsätze" },
            { text: "Hilfe", answer: ["!"], hint: "Notruf" },
            { text: "Lisa sagte[] []Ich komme morgen[][]", answer: [":", "„", ".", """], hint: "Ankündigung der wörtlichen Rede" },
            { text: "Wir brauchen Mehl[] Eier[] Zucker und Butter", answer: [",", ","], hint: "Längere Aufzählung" },
            { text: "[]Wo warst du[][][] wollte er wissen", answer: ["„", "?", """, ","], hint: "Frage in wörtlicher Rede" },
            { text: "Toll gemacht", answer: ["!"], hint: "Lob/Begeisterung" },
            { text: "Gehst du heute schwimmen[] oder bleibst du zu Hause", answer: [","], hint: "Zwei Möglichkeiten mit 'oder'" },
            { text: "[]Das ist super[][] jubelte Tim", answer: ["„", "!", """], hint: "Begeisterung in wörtlicher Rede" },
            { text: "Meine Freundin[] die neben mir sitzt[] heißt Emma", answer: [",", ","], hint: "Einschub/Relativsatz" },
            { text: "Was möchtest du werden", answer: ["?"], hint: "Frage" },
            { text: "Der Hund[] der dort liegt[] gehört meinem Nachbarn", answer: [",", ","], hint: "Relativsatz" },
            { text: "[]Guten Morgen[][][] sagte die Lehrerin freundlich", answer: ["„", "!", """, ","], hint: "Begrüßung in wörtlicher Rede" },
            { text: "Wir gehen schwimmen[] wenn das Wetter schön ist", answer: [","], hint: "Nebensatz mit 'wenn'" },
            { text: "[]Wann kommst du[][][] fragte Lisa ungeduldig", answer: ["„", "?", """, ","], hint: "Frage mit Begleitsatz" },
            { text: "Obwohl es regnete[] spielten die Kinder draußen", answer: [","], hint: "Nebensatz mit 'obwohl'" },
            { text: "Mein Bruder[] der acht Jahre alt ist[] spielt gerne Fußball", answer: [",", ","], hint: "Einschub mit Zusatzinfo" },
            { text: "Fantastisch", answer: ["!"], hint: "Begeisterung" },
        ];

        let selectedPunctuation = null;
        let userAnswers = [];

        function init() {
            const container = document.getElementById('exercises');
            container.innerHTML = '';
            userAnswers = [];

            sentences.forEach((item, index) => {
                let sentenceHTML = item.text;
                let blankCount = (item.text.match(/\[\]/g) || []).length;
                
                if (blankCount === 0) {
                    blankCount = 1;
                    sentenceHTML = item.text;
                } else {
                    sentenceHTML = item.text.replace(/\[\]/g, () => {
                        const idx = userAnswers.length;
                        userAnswers.push(null);
                        return `<span class="blank" id="blank-${idx}" onclick="fillBlank(${idx})"></span>`;
                    });
                }
                
                if (blankCount === 1 && !item.text.includes('[]')) {
                    userAnswers.push(null);
                    sentenceHTML = item.text + `<span class="blank" id="blank-${userAnswers.length - 1}" onclick="fillBlank(${userAnswers.length - 1})"></span>`;
                }

                const div = document.createElement('div');
                div.className = 'exercise';
                div.innerHTML = `
                    <div class="sentence">
                        ${index + 1}. ${sentenceHTML}
                    </div>
                    <div class="hint">${item.hint}</div>
                `;
                container.appendChild(div);
            });
        }

        function selectPunct(punct) {
            selectedPunctuation = punct;
            document.querySelectorAll('.punct-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function fillBlank(index) {
            if (selectedPunctuation) {
                const blank = document.getElementById(`blank-${index}`);
                blank.textContent = selectedPunctuation;
                blank.classList.remove('correct', 'wrong');
                userAnswers[index] = selectedPunctuation;
            }
        }

        function checkAnswers() {
            let correct = 0;
            let totalBlanks = 0;
            let currentBlank = 0;

            sentences.forEach((item, index) => {
                item.answer.forEach((correctAnswer) => {
                    const blank = document.getElementById(`blank-${currentBlank}`);
                    if (userAnswers[currentBlank] === correctAnswer) {
                        blank.classList.add('correct');
                        blank.classList.remove('wrong');
                        correct++;
                    } else if (userAnswers[currentBlank]) {
                        blank.classList.add('wrong');
                        blank.classList.remove('correct');
                    }
                    totalBlanks++;
                    currentBlank++;
                });
            });

            const score = document.getElementById('score');
            score.classList.remove('hidden');
            
            if (correct === totalBlanks) {
                score.innerHTML = `🎉 Perfekt! ${correct} von ${totalBlanks} richtig! 🌟`;
                score.style.background = '#d4edda';
                score.style.color = '#155724';
            } else if (correct >= totalBlanks * 0.8) {
                score.innerHTML = `👍 Sehr gut! ${correct} von ${totalBlanks} richtig! Fast geschafft!`;
                score.style.background = '#d1ecf1';
                score.style.color = '#0c5460';
            } else {
                score.innerHTML = `Du hast ${correct} von ${totalBlanks} richtig! 💪 Versuch es nochmal!`;
                score.style.background = '#fff3cd';
                score.style.color = '#856404';
            }
        }

        function showSolutions() {
            let currentBlank = 0;
            sentences.forEach((item) => {
                item.answer.forEach((correctAnswer) => {
                    const blank = document.getElementById(`blank-${currentBlank}`);
                    blank.textContent = correctAnswer;
                    blank.classList.add('correct');
                    blank.classList.remove('wrong');
                    userAnswers[currentBlank] = correctAnswer;
                    currentBlank++;
                });
            });

            const score = document.getElementById('score');
            score.classList.remove('hidden');
            score.innerHTML = `💡 Hier sind alle Lösungen!`;
            score.style.background = '#d1ecf1';
            score.style.color = '#0c5460';
        }

        function resetExercise() {
            selectedPunctuation = null;
            document.querySelectorAll('.punct-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            document.getElementById('score').classList.add('hidden');
            init();
        }

        init();
    </script>
</body>
</html>
