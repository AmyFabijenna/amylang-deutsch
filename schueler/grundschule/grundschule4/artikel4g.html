<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel-Schnelligkeitsspiel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2744 0%, #2d4263 50%, #1a2744 100%);
            min-height: 100vh;
            padding: 20px;
            color: #FFD700;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #FFD700;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .game-area {
            background: rgba(42, 60, 92, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 3px solid #FFD700;
        }

        .article-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .article-btn {
            width: 120px;
            height: 120px;
            font-size: 2em;
            font-weight: bold;
            border: 4px solid #FFD700;
            border-radius: 15px;
            background: linear-gradient(135deg, #2d4263 0%, #1a2744 100%);
            color: #FFD700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .article-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #3d5273 0%, #2a3754 100%);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.3);
        }

        .article-btn:active {
            transform: scale(0.95);
        }

        .article-btn.correct {
            animation: correctPulse 0.5s;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .article-btn.wrong {
            animation: wrongShake 0.5s;
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .word-display {
            text-align: center;
            margin: 40px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .current-word {
            font-size: 3em;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(255, 215, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #FFD700;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #FFD700;
        }

        .stat-label {
            font-size: 0.9em;
            color: #c9a400;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: 3px solid #FFD700;
            border-radius: 25px;
            background: linear-gradient(135deg, #2d4263 0%, #1a2744 100%);
            color: #FFD700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #3d5273 0%, #2a3754 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }

        .btn-start {
            background: linear-gradient(135deg, #FFD700 0%, #c9a400 100%);
            color: #1a2744;
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #ffe033 0%, #d9b400 100%);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2d4263 0%, #1a2744 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            border: 4px solid #FFD700;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            color: #FFD700;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .modal-content p {
            font-size: 1.3em;
            margin: 15px 0;
            color: #FFD700;
        }

        .modal-content input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 3px solid #FFD700;
            border-radius: 10px;
            background: rgba(255, 215, 0, 0.1);
            color: #FFD700;
            margin: 20px 0;
            text-align: center;
        }

        .modal-content input::placeholder {
            color: rgba(255, 215, 0, 0.5);
        }

        .highscore-section {
            background: rgba(42, 60, 92, 0.8);
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
            border: 3px solid #FFD700;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .highscore-section h3 {
            color: #FFD700;
            margin-bottom: 20px;
            font-size: 2em;
            text-align: center;
        }

        .highscore-list {
            display: grid;
            gap: 10px;
        }

        .highscore-item {
            background: rgba(255, 215, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 50px 1fr 120px 120px;
            gap: 15px;
            align-items: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .highscore-rank {
            font-weight: bold;
            font-size: 1.5em;
            color: #FFD700;
            text-align: center;
        }

        .highscore-rank.gold { color: #FFD700; }
        .highscore-rank.silver { color: #C0C0C0; }
        .highscore-rank.bronze { color: #CD7F32; }

        .highscore-name {
            font-weight: bold;
            color: #FFD700;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 2px solid #FFD700;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .streak-indicator {
            text-align: center;
            font-size: 1.5em;
            color: #FFD700;
            margin-bottom: 20px;
            font-weight: bold;
            min-height: 35px;
        }

        .streak-fire {
            animation: fireFlicker 0.5s infinite;
        }

        @keyframes fireFlicker {
            0%, 100% { text-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500; }
            50% { text-shadow: 0 0 20px #FFD700, 0 0 30px #FFA500; }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Artikel-Schnelligkeitsspiel ⚡</h1>
        
        <div class="game-area">
            <div class="controls">
                <button class="btn btn-start" id="startBtn" onclick="startGame()">🎮 Spiel starten</button>
                <button class="btn" id="stopBtn" onclick="stopGame()" style="display: none;">⏹️ Beenden</button>
            </div>

            <div class="streak-indicator" id="streakDisplay"></div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <div class="stats-bar">
                <div class="stat-box">
                    <div class="stat-value" id="correct">0</div>
                    <div class="stat-label">Richtig</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="wrong">0</div>
                    <div class="stat-label">Falsch</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="timer">0:00</div>
                    <div class="stat-label">Zeit</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="points">0</div>
                    <div class="stat-label">Punkte</div>
                </div>
            </div>

            <div class="article-buttons">
                <button class="article-btn" onclick="checkAnswer('der')">DER</button>
                <button class="article-btn" onclick="checkAnswer('die')">DIE</button>
                <button class="article-btn" onclick="checkAnswer('das')">DAS</button>
            </div>

            <div class="word-display">
                <div class="current-word" id="currentWord">Klicke auf "Spiel starten"</div>
            </div>
        </div>

        <div class="highscore-section">
            <h3>🏆 Top 10 Rekorde</h3>
            <div class="highscore-list" id="highscoreList">
                <p style="text-align: center; color: #FFD700;">Noch keine Rekorde. Sei der Erste!</p>
            </div>
        </div>
    </div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>🎉 Spiel beendet!</h2>
            <p><strong>Richtige Antworten:</strong> <span id="finalCorrect"></span></p>
            <p><strong>Falsche Antworten:</strong> <span id="finalWrong"></span></p>
            <p><strong>Zeit:</strong> <span id="finalTime"></span></p>
            <p><strong>Punkte:</strong> <span id="finalPoints"></span></p>
            <p id="recordMessage" style="font-size: 1.1em; color: #4CAF50; font-weight: bold;"></p>
            <input type="text" id="playerName" placeholder="Dein Name für die Rekordliste" maxlength="20">
            <button class="btn btn-start" onclick="saveScore()">💾 Speichern</button>
            <button class="btn" onclick="closeModal()">❌ Schließen</button>
        </div>
    </div>

            { word: 'Freizeit', article: 'die' },
            { word: 'Hobby', article: 'das' },
            { word: 'Interesse', article: 'das' }
        ];

        let gameActive = false;
        let currentNounIndex = 0;
        let shuffledNouns = [];
        let correctCount = 0;
        let wrongCount = 0;
        let timerInterval = null;
        let seconds = 0;
        let currentStreak = 0;
        let bestStreak = 0;

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function startGame() {
            gameActive = true;
            currentNounIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            seconds = 0;
            currentStreak = 0;
            bestStreak = 0;
            
            document.getElementById('correct').textContent = '0';
            document.getElementById('wrong').textContent = '0';
            document.getElementById('timer').textContent = '0:00';
            document.getElementById('points').textContent = '0';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('streakDisplay').textContent = '';
            
            shuffledNouns = shuffleArray(nouns);
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            
            showNextWord();
            startTimer();
        }

        function stopGame() {
            if (!gameActive) return;
            
            gameActive = false;
            clearInterval(timerInterval);
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            
            showGameOverModal();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                updatePoints();
            }, 1000);
        }

        function showNextWord() {
            if (!gameActive) return;
            
            if (currentNounIndex >= shuffledNouns.length) {
                // Alle Wörter durch, Spiel beenden
                stopGame();
                return;
            }
            
            const currentNoun = shuffledNouns[currentNounIndex];
            document.getElementById('currentWord').textContent = currentNoun.word;
            
            // Progress bar aktualisieren
            const progress = ((currentNounIndex + 1) / shuffledNouns.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function checkAnswer(selectedArticle) {
            if (!gameActive) return;
            
            const currentNoun = shuffledNouns[currentNounIndex];
            const buttons = document.querySelectorAll('.article-btn');
            
            if (selectedArticle === currentNoun.article) {
                correctCount++;
                currentStreak++;
                if (currentStreak > bestStreak) {
                    bestStreak = currentStreak;
                }
                document.getElementById('correct').textContent = correctCount;
                
                // Visual feedback
                buttons.forEach(btn => {
                    if (btn.textContent === selectedArticle.toUpperCase()) {
                        btn.classList.add('correct');
                        setTimeout(() => btn.classList.remove('correct'), 500);
                    }
                });
                
                updateStreakDisplay();
            } else {
                wrongCount++;
                currentStreak = 0;
                document.getElementById('wrong').textContent = wrongCount;
                
                // Visual feedback
                buttons.forEach(btn => {
                    if (btn.textContent === selectedArticle.toUpperCase()) {
                        btn.classList.add('wrong');
                        setTimeout(() => btn.classList.remove('wrong'), 500);
                    }
                });
                
                updateStreakDisplay();
            }
            
            updatePoints();
            currentNounIndex++;
            
            setTimeout(() => {
                showNextWord();
            }, 500);
        }

        function updateStreakDisplay() {
            const display = document.getElementById('streakDisplay');
            if (currentStreak >= 3) {
                display.innerHTML = `🔥 ${currentStreak} in Folge richtig! 🔥`;
                display.classList.add('streak-fire');
            } else {
                display.textContent = '';
                display.classList.remove('streak-fire');
            }
        }

        function calculatePoints() {
            // Punkteberechnung: (Richtige × 100) - Zeit + (Beste Serie × 50)
            const basePoints = correctCount * 100;
            const timePenalty = seconds;
            const streakBonus = bestStreak * 50;
            const totalPoints = Math.max(0, basePoints - timePenalty + streakBonus);
            return Math.round(totalPoints);
        }

        function updatePoints() {
            const points = calculatePoints();
            document.getElementById('points').textContent = points;
        }

        function showGameOverModal() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const timeString = `${mins}:${secs.toString().padStart(2, '0')}`;
            const finalPoints = calculatePoints();
            
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalWrong').textContent = wrongCount;
            document.getElementById('finalTime').textContent = timeString;
            document.getElementById('finalPoints').textContent = finalPoints;
            
            // Prüfe ob es ein Top-10-Ergebnis ist
            const highscores = getHighscores();
            const isTopTen = highscores.length < 10 || finalPoints > highscores[highscores.length - 1].points;
            
            if (isTopTen) {
                document.getElementById('recordMessage').textContent = '🎉 Du hast es in die Top 10 geschafft!';
            } else {
                document.getElementById('recordMessage').textContent = '';
            }
            
            document.getElementById('playerName').value = '';
            document.getElementById('gameOverModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('gameOverModal').classList.remove('active');
            document.getElementById('currentWord').textContent = 'Klicke auf "Spiel starten"';
        }

        function saveScore() {
            const playerName = document.getElementById('playerName').value.trim() || 'Anonym';
            const finalPoints = calculatePoints();
            
            const score = {
                name: playerName,
                correct: correctCount,
                wrong: wrongCount,
                time: seconds,
                points: finalPoints,
                streak: bestStreak,
                date: new Date().toISOString()
            };
            
            let highscores = getHighscores();
            highscores.push(score);
            
            // Sortiere nach Punkten (höchste zuerst)
            highscores.sort((a, b) => b.points - a.points);
            
            // Behalte nur Top 10
            highscores = highscores.slice(0, 10);
            
            localStorage.setItem('articleHighscores', JSON.stringify(highscores));
            
            displayHighscores();
            closeModal();
        }

        function getHighscores() {
            return JSON.parse(localStorage.getItem('articleHighscores') || '[]');
        }

        function displayHighscores() {
            const highscores = getHighscores();
            const container = document.getElementById('highscoreList');
            
            if (highscores.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #FFD700;">Noch keine Rekorde. Sei der Erste!</p>';
                return;
            }
            
            container.innerHTML = highscores.map((score, index) => {
                const mins = Math.floor(score.time / 60);
                const secs = score.time % 60;
                const timeString = `${mins}:${secs.toString().padStart(2, '0')}`;
                
                const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : '';
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';
                
                return `
                    <div class="highscore-item">
                        <div class="highscore-rank ${rankClass}">${medal} #${index + 1}</div>
                        <div class="highscore-name">${score.name}</div>
                        <div style="color: #FFD700;">${score.correct}✓ / ${score.wrong}✗</div>
                        <div style="color: #FFD700; text-align: right;"><strong>${score.points} Pkt</strong><br><small>${timeString}</small></div>
                    </div>
                `;
            }).join('');
        }

        // Initialize
        displayHighscores();
        
        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            
            if (e.key === '1') checkAnswer('der');
            else if (e.key === '2') checkAnswer('die');
            else if (e.key === '3') checkAnswer('das');
        });
