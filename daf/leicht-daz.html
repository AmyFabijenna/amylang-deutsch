            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border-radius: 15px;
            color: white;
            font-size: 1.5em;
        }
        
        .progress-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-radius: 10px;
            border-left: 5px solid #ff8c00;
        }
        
        .progress-bar {
            flex: 1;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 0 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff8e53);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nav-btn {
            background: linear-gradient(145deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        .nav-btn:hover, .nav-btn.active {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            background: linear-gradient(145deg, #ff5252, #ff7043);
        }
        
        .section {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .section.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .category {
            margin-bottom: 40px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .category-title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #d32f2f;
            text-align: center;
            padding: 10px;
            background: linear-gradient(135deg, #ffebee, #fce4ec);
            border-radius: 10px;
        }
        
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .word-card {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .word-card:hover {
            transform: translateY(-5px);
            border-color: #ff6b6b;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
        }
        
        .word-card.learned {
            background: linear-gradient(145deg, #e8f5e8, #c8e6c9);
            border-color: #4caf50;
        }
        
        .word-card.learned::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 10px;
            color: #4caf50;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .word-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .word-german {
            font-size: 1.2em;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 8px;
        }
        
        .word-hungarian {
            font-size: 1.1em;
            color: #7b1fa2;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
        }
        
        .word-card.flipped .word-hungarian {
            opacity: 1;
            transform: translateY(0);
        }
        
        .speak-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 1.2em;
            margin: 5px;
            transition: all 0.2s ease;
        }
        
        .speak-btn:hover {
            background: #ff5252;
            transform: scale(1.1);
        }
        
        /* Memory Game Styles */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #ff6b6b, #ff8e53);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2em;
            color: white;
            font-weight: bold;
        }
        
        .memory-card.flipped {
            background: linear-gradient(145deg, #ffffff, #f5f5f5);
            color: #333;
            transform: rotateY(180deg);
        }
        
        .memory-card.matched {
            background: linear-gradient(145deg, #4caf50, #66bb6a);
            color: white;
        }
        
        /* Exercise Styles */
        .exercise {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

        .exercise-question {

            margin-bottom: 20px;
            text-align: center;
            color: #d32f2f;
            font-weight: bold;
        }
        
        .options {

            gap: 15px;
            margin: 20px 0;
        }
        
        .option {

            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .option:hover {
            border-color: #ff6b6b;
            background: linear-gradient(145deg, #fff3e0, #ffe0b2);
        }
        
        .option.correct {
            background: linear-gradient(145deg, #e8f5e8, #c8e6c9);
            border-color: #4caf50;
        }
        
        .option.wrong {
            background: linear-gradient(145deg, #ffebee, #ffcdd2);
            border-color: #f44336;
        }
        
        .gap-text {
            display: inline-block;
            min-width: 100px;
            border-bottom: 2px solid #ff6b6b;
            margin: 0 5px;
            text-align: center;
            font-weight: bold;
        }

            font-size: 1.1em;

        }

        }

        }

        }

            font-size: 1.1em;
            margin: 20px 0;
            color: #d32f2f;
        }
    </style>
</head>

        // Text-to-Speech function with specific voice selection
        function speak(text, lang = 'de-DE') {
            if ('speechSynthesis' in window) {
                const voices = speechSynthesis.getVoices();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.8;
                utterance.volume = 1;
                
                if (lang === 'hu-HU') {
                    // Specifically look for Mariska (Hungarian voice)
                    const hungarianVoice = voices.find(voice => 
                        voice.name === 'Mariska' || 
                        voice.lang === 'hu-HU' ||
                        voice.name.toLowerCase().includes('mariska')
                    );
                    if (hungarianVoice) {
                        utterance.voice = hungarianVoice;
                        utterance.lang = 'hu-HU';
                        console.log('Using Hungarian voice:', hungarianVoice.name);
                    } else {
                        console.log('Mariska voice not found, available voices:', voices.map(v => v.name));
                    }
                } else if (lang === 'de-DE') {
                    // Use Anna for German
                    const germanVoice = voices.find(voice => 
                        voice.name === 'Anna' || 
                        voice.lang === 'de-DE'
                    );
                    if (germanVoice) {
                        utterance.voice = germanVoice;
                        utterance.lang = 'de-DE';
                    }
                } else {
                    utterance.lang = lang;
                }
                
                speechSynthesis.speak(utterance);
            } else {
                alert('Sprachausgabe wird von diesem Browser nicht unterstützt - A beszédszintézis nem támogatott ebben a böngészőben');
            }
        }
        
        // Ensure voices are loaded before first use
        let voicesLoaded = false;
        function ensureVoicesLoaded() {
            return new Promise((resolve) => {
                if (voicesLoaded) {
                    resolve();
                    return;
                }
                
                const voices = speechSynthesis.getVoices();
                if (voices.length > 0) {
                    voicesLoaded = true;
                    console.log('Voices loaded:', voices.length);
                    resolve();
                } else {
                    speechSynthesis.onvoiceschanged = () => {
                        voicesLoaded = true;
                        console.log('Voices loaded after event:', speechSynthesis.getVoices().length);
                        resolve();
                    };
                }
            });
        }
        
        // Enhanced speak function that waits for voices to load
        async function speakWord(text, lang = 'de-DE') {
            await ensureVoicesLoaded();
            speak(text, lang);
        }

                adjectives: 'adjectives',
                weather: 'weather',
                verbs: 'verbs'
            };
            return mapping[category];
        }
        
        function createWordCard(word, category) {
            const isLearned = learnedWords.has(word.german);
            return `
                <div class="word-card ${isLearned ? 'learned' : ''}" 
                     onclick="flipCard(this, '${word.german}')" 
                     data-word="${word.german}" 
                     data-category="${category}">
                    <div class="word-icon">${word.icon}</div>
                    <div class="word-german">
                        ${word.german}
                        <button class="speak-btn" onclick="event.stopPropagation(); speakWord('${word.german}', 'de-DE')">🔊</button>
                    </div>
                    <div class="word-hungarian">
                        ${word.hungarian}
                        <button class="speak-btn" onclick="event.stopPropagation(); speakWord('${word.hungarian}', 'hu-HU')">🔊</button>
                    </div>
                </div>
            `;
        }
        
        function flipCard(card, german) {
            card.classList.toggle('flipped');
            if (card.classList.contains('flipped')) {
                learnedWords.add(german);
                card.classList.add('learned');
                updateProgress();
                // Auto-speak German word when flipped
                speakWord(german, 'de-DE');
            }
        }
        
        function showSection(sectionName) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(sectionName).classList.add('active');
            event.target.classList.add('active');
        }
        
        function updateProgress() {
            const totalWords = Object.values(vocabulary).flat().length;
            const learnedCount = learnedWords.size;
            const percentage = Math.round((learnedCount / totalWords) * 100);
            
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${learnedCount}/${totalWords} (${percentage}%)`;
        }
        
        function resetProgress() {
            if (confirm('Fortschritt zurücksetzen? - Reset haladást?')) {
                learnedWords.clear();
                document.querySelectorAll('.word-card').forEach(card => {
                    card.classList.remove('learned', 'flipped');
                });
                updateProgress();
            }
        }
        
        // Memory Game Functions
        function startMemoryGame() {
            const category = document.getElementById('memoryCategory').value;
            let words = [];
            
            if (category === 'all') {
                words = Object.values(vocabulary).flat().slice(0, 8);
            } else {
                words = vocabulary[category].slice(0, 8);
            }
            
            // Create card pairs (German and Hungarian)
            memoryCards = [];
            words.forEach(word => {
                memoryCards.push({type: 'german', word: word.german, pair: word.hungarian, icon: word.icon});
                memoryCards.push({type: 'hungarian', word: word.hungarian, pair: word.german, icon: word.icon});
            });
            
            // Shuffle cards
            memoryCards = shuffleArray(memoryCards);
            
            // Reset game state
            flippedCards = [];
            attempts = 0;
            startTime = Date.now();
            
            // Update UI
            document.getElementById('attempts').textContent = '0';
            document.getElementById('memoryResult').style.display = 'none';
            
            // Start timer
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            
            // Create game grid
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = memoryCards.map((card, index) => `
                <div class="memory-card" onclick="flipMemoryCard(${index})" data-index="${index}">
                    <div class="card-back">❓</div>
                    <div class="card-front" style="display: none;">
                        ${card.icon}<br>
                        <small>${card.word}</small>
                    </div>
                </div>
            `).join('');
            
            memoryGameActive = true;
        }
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function flipMemoryCard(index) {
            if (!memoryGameActive || flippedCards.length >= 2) return;
            
            const cardElement = document.querySelector(`[data-index="${index}"]`);
            if (cardElement.classList.contains('flipped') || cardElement.classList.contains('matched')) return;
            
            cardElement.classList.add('flipped');
            cardElement.querySelector('.card-back').style.display = 'none';
            cardElement.querySelector('.card-front').style.display = 'block';
            
            flippedCards.push(index);
            
            // Speak the word
            const card = memoryCards[index];
            const lang = card.type === 'german' ? 'de-DE' : 'hu-HU';
            speak(card.word, lang);
            
            if (flippedCards.length === 2) {
                attempts++;
                document.getElementById('attempts').textContent = attempts;
                
                setTimeout(() => {
                    checkMemoryMatch();
                }, 1000);
            }
        }
        
        function checkMemoryMatch() {
            const [first, second] = flippedCards;
            const firstCard = memoryCards[first];
            const secondCard = memoryCards[second];
            
            const firstElement = document.querySelector(`[data-index="${first}"]`);
            const secondElement = document.querySelector(`[data-index="${second}"]`);
            
            if (firstCard.word === secondCard.pair) {
                // Match found
                firstElement.classList.add('matched');
                secondElement.classList.add('matched');
                
                // Check if game is complete
                const matchedCards = document.querySelectorAll('.memory-card.matched').length;
                if (matchedCards === memoryCards.length) {
                    endMemoryGame(true);
                }
            } else {
                // No match, flip back
                firstElement.classList.remove('flipped');
                secondElement.classList.remove('flipped');
                firstElement.querySelector('.card-back').style.display = 'block';
                firstElement.querySelector('.card-front').style.display = 'none';
                secondElement.querySelector('.card-back').style.display = 'block';
                secondElement.querySelector('.card-front').style.display = 'none';
            }
            
            flippedCards = [];
        }
        
        function updateTimer() {
            if (!startTime) return;
            
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function endMemoryGame(won) {
            memoryGameActive = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            const result = document.getElementById('memoryResult');
            result.style.display = 'block';
            result.className = won ? 'result-message success' : 'result-message error';
            result.textContent = won ? 
                `🎉 Geschafft! Versuche: ${attempts} - Sikerült! Próbák: ${attempts}` : 
                '❌ Versuche es nochmal! - Próbáld újra!';
        }
        
        // Exercise Functions
        function generateExercise(type) {
            const container = document.getElementById('exerciseContainer');
            const allWords = Object.values(vocabulary).flat();
            
            switch(type) {
                case 'matching':
                    generateMatchingExercise(container, allWords);
                    break;
                case 'gapfill':
                    generateGapFillExercise(container, allWords);
                    break;
                case 'translation':
                    generateTranslationExercise(container, allWords);
                    break;
            }
        }
        
        function generateMatchingExercise(container, words) {
            const selectedWords = shuffleArray(words).slice(0, 6);
            const germanWords = shuffleArray([...selectedWords]);
            const hungarianWords = shuffleArray([...selectedWords]);
            
            container.innerHTML = `
                <div class="exercise">
                    <div class="exercise-question">🔗 Verbinde die passenden Wörter - Kösd össze a megfelelő szavakat!</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                        <div>
                            <h3>Deutsch:</h3>
                            ${germanWords.map((word, i) => `
                                <div class="option" onclick="selectForMatching(this, '${word.german}', 'german')" data-word="${word.german}">
                                    ${word.icon} ${word.german}
                                </div>
                            `).join('')}
                        </div>
                        <div>
                            <h3>Magyar:</h3>
                            ${hungarianWords.map((word, i) => `
                                <div class="option" onclick="selectForMatching(this, '${word.hungarian}', 'hungarian')" data-word="${word.hungarian}" data-pair="${word.german}">
                                    ${word.icon} ${word.hungarian}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="control-buttons">
                        <button class="btn" onclick="checkMatching()">✅ Prüfen - Ellenőriz</button>
                        <button class="btn" onclick="generateExercise('matching')">🔄 Neu - Új</button>
                    </div>
                    <div id="matchingResult"></div>
                </div>
            `;
        }
        
        let selectedMatching = {german: null, hungarian: null};
        let matchingPairs = [];
        
        function selectForMatching(element, word, type) {
            // Remove previous selection of same type
            document.querySelectorAll(`.option.selected-${type}`).forEach(el => {
                el.classList.remove(`selected-${type}`);
            });
            
            element.classList.add(`selected-${type}`);
            selectedMatching[type] = {element: element, word: word};
            
            // If both selected, create pair
            if (selectedMatching.german && selectedMatching.hungarian) {
                const pair = {
                    german: selectedMatching.german,
                    hungarian: selectedMatching.hungarian
                };
                
                // Visual feedback
                pair.german.element.style.backgroundColor = '#e1f5fe';
                pair.hungarian.element.style.backgroundColor = '#e1f5fe';
                pair.german.element.style.border = '2px solid #2196f3';
                pair.hungarian.element.style.border = '2px solid #2196f3';
                
                matchingPairs.push(pair);
                selectedMatching = {german: null, hungarian: null};
                
                // Speak both words
                speak(pair.german.word, 'de-DE');
                setTimeout(() => speak(pair.hungarian.word, 'hu-HU'), 1000);
            }
        }
        
        function checkMatching() {
            let correct = 0;
            
            matchingPairs.forEach(pair => {
                const hungarianElement = pair.hungarian.element;
                const correctGerman = hungarianElement.dataset.pair;
                
                if (pair.german.word === correctGerman) {
                    pair.german.element.classList.add('correct');
                    pair.hungarian.element.classList.add('correct');
                    correct++;
                } else {
                    pair.german.element.classList.add('wrong');
                    pair.hungarian.element.classList.add('wrong');
                }
            });
            
            const result = document.getElementById('matchingResult');
            result.className = correct === matchingPairs.length ? 'result-message success' : 'result-message error';
            result.textContent = `${correct}/${matchingPairs.length} richtig - helyes`;
        }
        
        function generateGapFillExercise(container, words) {
            const selectedWords = shuffleArray(words).slice(0, 5);
            const sentences = [
                'Die {word} scheint hell.',
                'Der {word} bellt laut.',
                'Das {word} fliegt hoch.',
                'Die {word} ist kalt.',
                'Der {word} läuft schnell.'
            ];
            
            container.innerHTML = `
                <div class="exercise">
                    <div class="exercise-question">📝 Fülle die Lücken aus - Töltsd ki a hézagokat!</div>
                    ${selectedWords.map((word, i) => {
                        const sentence = sentences[i] || 'Das {word} ist schön.';
                        const parts = sentence.split('{word}');
                        return `
                            <div style="margin: 20px 0; font-size: 1.2em;">
                                ${word.icon} ${parts[0]}
                                <input type="text" class="gap-input" data-answer="${word.german}" placeholder="?" onkeyup="checkGapInput(this)">
                                ${parts[1]}
                                <button class="speak-btn" onclick="speak('${word.german}', 'de-DE')">🔊</button>
                                <small style="color: #666;"> (${word.hungarian})</small>
                            </div>
                        `;
                    }).join('')}
                    <div class="control-buttons">
                        <button class="btn" onclick="checkAllGaps()">✅ Alle prüfen - Mind ellenőriz</button>
                        <button class="btn" onclick="generateExercise('gapfill')">🔄 Neu - Új</button>
                    </div>
                    <div id="gapResult"></div>
                </div>
            `;
        }
        
        function checkGapInput(input) {
            const answer = input.dataset.answer.toLowerCase();
            const userInput = input.value.toLowerCase().trim();
            
            if (userInput === answer) {
                input.style.borderBottomColor = '#4caf50';
                input.style.backgroundColor = '#e8f5e8';
            } else if (userInput.length > 0) {
                input.style.borderBottomColor = '#f44336';
                input.style.backgroundColor = '#ffebee';
            } else {
                input.style.borderBottomColor = '#ff6b6b';
                input.style.backgroundColor = 'transparent';
            }
        }
        
        function checkAllGaps() {
            const inputs = document.querySelectorAll('.gap-input');
            let correct = 0;
            
            inputs.forEach(input => {
                const answer = input.dataset.answer.toLowerCase();
                const userInput = input.value.toLowerCase().trim();
                
                if (userInput === answer) {
                    input.style.borderBottomColor = '#4caf50';
                    input.style.backgroundColor = '#e8f5e8';
                    correct++;
                } else {
                    input.style.borderBottomColor = '#f44336';
                    input.style.backgroundColor = '#ffebee';
                    input.value = input.dataset.answer; // Show correct answer
                }
            });
            
            const result = document.getElementById('gapResult');
            result.className = correct === inputs.length ? 'result-message success' : 'result-message error';
            result.textContent = `${correct}/${inputs.length} richtig - helyes`;
        }
        
        function generateTranslationExercise(container, words) {
            const selectedWords = shuffleArray(words).slice(0, 4);
            const question = shuffleArray(selectedWords)[0];
            const options = shuffleArray([
                question.hungarian,
                ...shuffleArray(words.filter(w => w.german !== question.german)).slice(0, 3).map(w => w.hungarian)
            ]);
            
            container.innerHTML = `
                <div class="exercise">
                    <div class="exercise-question">
                        🔄 Was bedeutet "${question.german}"? - Mit jelent a "${question.german}"?
                        <button class="speak-btn" onclick="speak('${question.german}', 'de-DE')">🔊</button>
                    </div>
                    <div style="text-align: center; margin: 20px 0; font-size: 3em;">
                        ${question.icon}
                    </div>
                    <div class="options">
                        ${options.map(option => `
                            <div class="option" onclick="selectTranslation(this, '${option}', '${question.hungarian}')">
                                ${option}
                                <button class="speak-btn" onclick="event.stopPropagation(); speak('${option}', 'hu-HU')">🔊</button>
                            </div>
                        `).join('')}
                    </div>
                    <div class="control-buttons">
                        <button class="btn" onclick="generateExercise('translation')">🔄 Nächste Frage - Következő kérdés</button>
                    </div>
                    <div id="translationResult"></div>
                </div>
            `;
        }
        
        function selectTranslation(element, selected, correct) {
            // Remove previous selections
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('correct', 'wrong');
            });
            
            if (selected === correct) {
                element.classList.add('correct');
                speak(selected, 'hu-HU');
                
                const result = document.getElementById('translationResult');
                result.className = 'result-message success';
                result.textContent = '🎉 Richtig! - Helyes!';
            } else {
                element.classList.add('wrong');
                // Show correct answer
                document.querySelectorAll('.option').forEach(opt => {
                    if (opt.textContent.trim().includes(correct)) {
                        opt.classList.add('correct');
                    }
                });
                
                const result = document.getElementById('translationResult');
                result.className = 'result-message error';
                result.textContent = `❌ Falsch! Richtig ist: ${correct} - Helytelen! A helyes: ${correct}`;
            }
        }
        
        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            initVocabulary();
        });
    </script>
</body>
</html>
