<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Über Filme sprechen · A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFEA;--card:#fff;--ink:#1C1C22;--soft:#5D5C66;--navy:#1F2B47;--blue:#33528A;--blue-l:#E4EAF5;--lila:#5E4B7A;--lila-l:#EEE8F4;--gold:#B8862A;--gold-l:#F6EDD9;--bad:#B4485A;--bad-l:#F7E3E6;--line:#E1DCD2}
*{box-sizing:border-box}
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6}
header{background:radial-gradient(circle at 85% 20%,#4A3D6B 0,transparent 45%),linear-gradient(135deg,#141C33,#1F2B47 55%,#33528A);color:#fff;padding:28px 20px 34px}
header .in{max-width:960px;margin:0 auto}
header h1{margin:0;font-size:29px}
header p{margin:6px 0 0;opacity:.85}
.pts{float:right;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 16px;font-weight:600}
main{max-width:960px;margin:-16px auto 40px;padding:0 16px}
.card{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(31,43,71,.08);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}
.mode{border:none;text-align:left;cursor:pointer;background:#fff;border-radius:20px;padding:18px;font-family:inherit;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.04),0 6px 18px rgba(31,43,71,.08);transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode .ic{font-size:28px}.mode h3{margin:6px 0 4px;font-size:19px}.mode p{margin:0;color:var(--soft);font-size:15px}
.tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--lila-l);color:var(--lila)}
h2{margin:0 0 6px;font-size:24px;color:var(--navy)}
.back{background:none;border:none;font-family:inherit;color:var(--blue);font-weight:600;font-size:16px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.btn{font-family:inherit;font-size:17px;font-weight:600;border:none;border-radius:14px;padding:11px 20px;cursor:pointer;background:var(--navy);color:#fff}
.btn.sec{background:#E6E2D9;color:var(--ink)}.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.bar{height:10px;background:#E6E2D9;border-radius:999px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lila),var(--blue));width:0;transition:width .3s}
.q{font-size:21px;font-weight:500;margin:8px 0 14px}
.quote{font-size:21px;padding:14px 18px;border-radius:16px;background:var(--lila-l);border-left:5px solid var(--lila);margin:8px 0 14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{font-family:inherit;font-size:17px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 16px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.opt.bad{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.opt:disabled{cursor:default}
.ex{margin-top:12px;padding:12px 15px;border-radius:14px;font-size:16px;background:var(--gold-l);border-left:5px solid var(--gold)}
.ex.badx{background:var(--bad-l);border-left-color:var(--bad)}
.hintbtn{font-family:inherit;background:none;border:2px dashed var(--lila);color:var(--lila);border-radius:12px;padding:6px 12px;cursor:pointer;font-size:15px;margin-bottom:12px}
.hint{font-size:16px;color:var(--lila);background:var(--lila-l);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.count{color:var(--soft);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font-family:inherit;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.chip.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.flip{perspective:1000px;cursor:pointer;margin:12px 0}
.flip .in{position:relative;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.front{background:linear-gradient(135deg,#1F2B47,#3B4F80);color:#fff}
.front .w{font-size:34px;font-weight:700}.front .pl{opacity:.8;margin-top:6px}
.backf{background:var(--lila-l);transform:rotateY(180deg);color:var(--ink)}
.backf .d{font-size:20px;font-weight:500}.backf .s{margin-top:12px;font-style:italic;color:var(--soft)}
.story{font-size:20px;line-height:2.3}
.gap{display:inline-block;min-width:110px;text-align:center;border-bottom:3px dashed var(--lila);padding:0 6px;font-weight:600;color:var(--lila)}
.gap.cur{background:var(--lila-l);border-radius:8px 8px 0 0}
.gap.done{border-bottom-style:solid;color:var(--blue);border-color:var(--blue)}
.gap.wrong{color:var(--bad);border-color:var(--bad);border-bottom-style:solid}
.build{min-height:58px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:19px}
.fixed{font-weight:600;color:var(--navy);padding:6px 4px}
.word{font-family:inherit;font-size:18px;border:2px solid var(--lila);background:#fff;color:var(--lila);border-radius:12px;padding:6px 14px;cursor:pointer}
.word.used{opacity:.25;cursor:default}
.placed{font-family:inherit;font-size:18px;border:2px solid var(--blue);background:var(--blue-l);color:var(--blue);border-radius:12px;padding:6px 14px;cursor:pointer}
.big{font-size:44px;text-align:center}.center{text-align:center}
.split{font-size:26px;font-weight:600;text-align:center;margin:10px 0}
.split span{display:inline-block;padding:4px 12px;border-radius:12px;margin:0 3px}
.split .a{background:var(--lila-l);color:var(--lila)}.split .b{background:var(--blue-l);color:var(--blue)}
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t td{padding:8px;border-bottom:1px solid var(--line)}
@media(max-width:600px){body{font-size:17px}header h1{font-size:23px}.pts{float:none;display:inline-block;margin-bottom:8px}.story{font-size:18px}}
.film{border-radius:20px;padding:20px 22px;background:linear-gradient(135deg,#1F2B47,#3B4F80);color:#fff;margin:6px 0 14px}
.film h2{color:#fff;margin:0}.film .gen{opacity:.85;font-size:15px;margin-top:4px}
.txt{font-size:19px;line-height:1.85}
.gl{font-family:inherit;font-size:inherit;background:var(--gold-l);border:none;border-bottom:2px dotted var(--gold);border-radius:6px;padding:0 4px;cursor:pointer;color:var(--ink)}
.glbox{margin-top:10px;min-height:0}
h4{margin:22px 0 8px;font-size:19px;color:var(--lila)}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.wl div{background:var(--blue-l);border-radius:12px;padding:8px 12px}.wl b{color:var(--navy)}.wl span{display:block;font-size:14px;color:var(--soft)}
.rf{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.rf .opts{margin-top:8px}
.ql{list-style:none;padding:0;margin:0}
.ql li{background:var(--lila-l);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.ql .qq{font-weight:500}
.help{font-family:inherit;font-size:14px;background:none;border:none;color:var(--lila);cursor:pointer;padding:4px 0;font-weight:600}
.hb{font-size:16px;color:var(--soft);font-style:italic}
.rm{background:var(--lila-l);border-radius:16px;padding:14px 18px;margin-bottom:12px}
.rm h3{margin:0 0 6px;color:var(--navy);font-size:19px}.rm ul{margin:0;padding-left:20px}.rm li{margin:3px 0}
.game{text-align:center;padding:26px 18px;border-radius:20px;background:linear-gradient(135deg,#1F2B47,#5E4B7A);color:#fff;margin:12px 0}
.game .gt{font-size:26px;font-weight:700;margin:6px 0}.game .gs{font-size:19px;opacity:.95}
.game .vs{font-size:18px;opacity:.8;margin:6px 0}
.forb{display:inline-block;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px;margin:4px;text-decoration:line-through}
.opts.row{justify-content:flex-start;margin-top:8px}
.sec-h:first-child{margin-top:34px}
.sec-h{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:18px 2px 8px}

</style>
</head>
<body>

{id:"tau",t:"TAU",ic:"🏠",g:"Science-Fiction-Thriller · USA 2018",

/* ---- Multiple Choice ---- */
let mc;
function runMC(title,items,mode){mc={title,items,mode,i:0,s:0};drawMC()}
function drawMC(){
 if(mc.i>=mc.items.length)return done(mc.s,mc.items.length,mc.mode);
 const it=mc.items[mc.i]; const ord=shuffle(it.o.map((t,k)=>({t,k})));
 app.innerHTML=`<div class="card">${back}<h2>${mc.title}</h2><div class="bar"><i style="width:${mc.i/mc.items.length*100}%"></i></div>
 ${it.pre||""}${it.tip?`<button class="hintbtn" id="hb">💡 Tipp anzeigen</button>`:""}
 <div class="q">${it.q}</div><div class="opts">${ord.map(o=>`<button class="opt" data-k="${o.k}" onclick="pickMC(this)">${o.t}</button>`).join("")}</div><div id="fb"></div>
 <div class="row"><span class="count">${mc.i+1} / ${mc.items.length}</span><button class="btn" id="nx" disabled onclick="mc.i++;drawMC()">Weiter →</button></div></div>`;
 if(it.tip)document.getElementById("hb").onclick=function(){this.outerHTML=`<div class="hint">💡 ${it.tip}</div>`}}
function pickMC(el){const it=mc.items[mc.i];const r=el.dataset.k==="0";
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.k==="0")b.classList.add("ok")});
 if(r){mc.s++;addP()}else el.classList.add("bad");
 document.getElementById("fb").innerHTML=`<div class="ex ${r?"":"badx"}">${r?"✔ Richtig! ":"✘ Nicht ganz. Richtig ist: <b>"+it.o[0]+"</b>. "}${it.ex}</div>`;
 document.getElementById("nx").disabled=false}

let lt;
function gaps(){app.innerHTML=`<div class="card">${back}<h2>📖 Lückentexte</h2><p>Wähle eine Geschichte. Die Lücken kommen der Reihe nach.</p>
 <div class="grid">${LT.map((s,i)=>`<button class="mode" onclick="startLT(${i})"><h3>${s.t}</h3><p>${(s.x.match(/\{/g)||[]).length} Lücken</p></button>`).join("")}</div></div>`}
function startLT(i){const s=LT[i];const gp=[];let k=0;
 const html=s.x.replace(/\{([^}]+)\}/g,(m,c)=>{const o=c.split("|");gp.push({o,ex:s.ex[k]});return `<span class="gap" id="g${k++}">( ${k} )</span>`});
 lt={i,gp,cur:0,s:0};
 app.innerHTML=`<div class="card">${back}<h2>${s.t}</h2><div class="bar"><i id="ltbar"></i></div><div class="story">${html}</div><div id="ltq" style="margin-top:14px"></div>
 <div class="row"><span class="count" id="ltc"></span><button class="btn" id="nx" disabled onclick="nextLT()">Weiter →</button></div></div>`;showLT()}
function showLT(){const g=lt.gp[lt.cur];document.querySelectorAll(".gap").forEach(x=>x.classList.remove("cur"));document.getElementById("g"+lt.cur).classList.add("cur");
 document.getElementById("ltbar").style.width=lt.cur/lt.gp.length*100+"%";document.getElementById("ltc").textContent=`Lücke ${lt.cur+1} / ${lt.gp.length}`;
 document.getElementById("ltq").innerHTML=`<div class="opts row">${shuffle(g.o.map((t,k)=>({t,k}))).map(o=>`<button class="opt" data-k="${o.k}" onclick="pickLT(this)">${o.t}</button>`).join("")}</div><div id="fb"></div>`;
 document.getElementById("nx").disabled=true}
function pickLT(el){const g=lt.gp[lt.cur];const r=el.dataset.k==="0";
 document.querySelectorAll("#ltq .opt").forEach(b=>{b.disabled=true;if(b.dataset.k==="0")b.classList.add("ok")});
 if(r){lt.s++;addP()}else el.classList.add("bad");
 const gEl=document.getElementById("g"+lt.cur);gEl.textContent=g.o[0];gEl.classList.remove("cur");gEl.classList.add(r?"done":"wrong");
 document.getElementById("fb").innerHTML=`<div class="ex ${r?"":"badx"}">${r?"✔ Richtig! ":"✘ Hier passt <b>"+g.o[0]+"</b>. "}${g.ex}</div>`;
 document.getElementById("nx").disabled=false}
function nextLT(){lt.cur++;if(lt.cur>=lt.gp.length){app.innerHTML=`<div class="card center">${back}<div class="big">📖</div><h2>Geschichte fertig!</h2><p>${lt.s} von ${lt.gp.length} Lücken richtig.</p>
 <div class="row" style="justify-content:center"><button class="btn sec" onclick="startLT(${lt.i})">Nochmal</button>${lt.i<LT.length-1?`<button class="btn gold" onclick="startLT(${lt.i+1})">Nächste Geschichte →</button>`:`<button class="btn gold" onclick="go('sv')">Weiter: Sätze verstehen →</button>`}</div></div>`;return}showLT()}

let sb;
function sbStart(){sb={list:shuffle(SB),i:0,s:0};drawSB()}
function drawSB(){if(sb.i>=sb.list.length)return done(sb.s,sb.list.length,"sb");
 const it=sb.list[sb.i];sb.cur={it,placed:[],pool:shuffle(it[1].map((t,k)=>({t,k}))),checked:false};renderSB()}
function renderSB(){const c=sb.cur,it=c.it;
 app.innerHTML=`<div class="card">${back}<h2>🧱 Sätze bauen</h2><div class="bar"><i style="width:${sb.i/sb.list.length*100}%"></i></div>
 <p>Tippe die Bausteine in der richtigen Reihenfolge an. Antippen im Satz = Baustein wieder entfernen.</p>
 <div class="build"><span class="fixed">${it[0]}</span>${c.placed.map((p,j)=>`<button class="placed" ${c.checked?"disabled":""} onclick="unplace(${j})">${p.t}</button>`).join("")}<span class="fixed">${it[2]}</span></div>
 <div class="chips">${c.pool.map((p,j)=>`<button class="word ${c.placed.includes(p)?"used":""}" ${c.placed.includes(p)||c.checked?"disabled":""} onclick="place(${j})">${p.t}</button>`).join("")}</div>
 <div id="fb"></div><div class="row"><span class="count">${sb.i+1} / ${sb.list.length}</span>
 ${c.checked?`<button class="btn" onclick="sb.i++;drawSB()">Weiter →</button>`:`<button class="btn" ${c.placed.length<it[1].length?"disabled":""} onclick="checkSB()">Prüfen ✓</button>`}</div></div>`;
 if(c.checked)document.getElementById("fb").innerHTML=c.fb}
function place(j){sb.cur.placed.push(sb.cur.pool[j]);renderSB()}
function unplace(j){sb.cur.placed.splice(j,1);renderSB()}
function checkSB(){const c=sb.cur,it=c.it;const ans=c.placed.map(p=>p.t).join(" ");const r=it[3].includes(ans);
 if(r){sb.s++;addP()}c.checked=true;
 c.fb=`<div class="ex ${r?"":"badx"}">${r?"✔ Perfekt gebaut! ":`✘ Noch nicht ganz. Richtig: <b>${it[0]} ${it[3][0]}${it[2]}</b> `}${it[4]}${it[3].length>1?`<br><span class="count">Auch richtig: ${it[0]} ${it[3][1]}${it[2]}</span>`:""}</div>`;renderSB()}

/* ---- Redemittel ---- */
function rm(){app.innerHTML=`<div class="card">${back}<h2>💬 So sprichst du über Filme</h2>
 ${RM.map(r=>`<div class="rm"><h3>${r[0]}</h3><ul>${r[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
 <div class="row"><span></span><button class="btn gold" onclick="go('games')">Weiter: Sprechspiele →</button></div></div>`}

/* ---- Sprechspiele ---- */
let gm="wuerfel";
const GM=[["wuerfel","🎲 Film-Würfel"],["duell","⚔️ Film-Duell"],["tabu","🚫 Tabu"],["big","💭 Große Fragen"]];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function games(){let inner="",info="";
 if(gm==="wuerfel"){const f=pick(F);info="Würfle einen Film und eine Aufgabe. Antworte in ganzen Sätzen.";
  inner=`<div class="gs">${f.ic}</div><div class="gt">${f.t}</div><div class="gs">${pick(TASKS)}</div>`}
 if(gm==="duell"){const [a,b]=shuffle(F);const qs=shuffle(DUELL).slice(0,3);info="Zwei Filme treten gegeneinander an. Vergleiche mit <i>… ist spannender als …</i>";
  inner=`<div class="gt">${a.ic} ${a.t}</div><div class="vs">gegen</div><div class="gt">${b.ic} ${b.t}</div><div class="gs" style="margin-top:12px">${qs.join("<br>")}<br><b>Und: Welcher Film gewinnt?</b></div>`}
 if(gm==="tabu"){const t=pick(TABU);info="Erkläre das Wort. Die durchgestrichenen Wörter darfst du nicht sagen!";
  inner=`<div class="gt">${t[0]}</div><div>${t[1].map(x=>`<span class="forb">${x}</span>`).join("")}</div>`}
 if(gm==="big"){info="Eine große Frage zum Diskutieren. Sag deine Meinung und begründe sie mit <i>weil</i>.";
  inner=`<div class="gt" style="font-size:23px">${pick(BIG)}</div>`}
 app.innerHTML=`<div class="card">${back}<h2>🎲 Sprechspiele</h2><div class="chips">${GM.map(g=>`<button class="chip ${g[0]===gm?"sel":""}" onclick="gm='${g[0]}';games()">${g[1]}</button>`).join("")}</div>
 <p>${info}</p><div class="game">${inner}</div><div class="row"><span></span><button class="btn gold" onclick="games()">🔄 Neue Karte</button></div></div>`}

/* ---- Abschluss ---- */
function final(){
 const ltItems=[];LT.forEach(s=>{let k=0;const plain=s.x;const all=[...plain.matchAll(/\{([^}]+)\}/g)];
  all.forEach((m,idx)=>{let n=0;const ctx=plain.replace(/\{([^}]+)\}/g,(mm,cc)=>n++===idx?"____":cc.split("|")[0]);
   const sent=ctx.split(/(?<=[.!?“])\s/).find(z=>z.includes("____"));
   ltItems.push({pre:`<div class="quote" style="font-size:18px">${sent}</div>`,q:"Welches Wort passt in die Lücke?",o:m[1].split("|"),ex:s.ex[idx]})})});
 const items=shuffle([...whatItems(5),...shuffle(kompItems()).slice(0,3),...shuffle(fwItems()).slice(0,4),...shuffle(ltItems).slice(0,4),...shuffle(svItems()).slice(0,4)]);
 runMC("🏁 Abschluss-Mission",items,"final")}
function go(m){({cards,what,komp,films,fw,gaps,sv,sb:sbStart,rm,games,final})[m]();scrollTo(0,0)}
home();

</script>
