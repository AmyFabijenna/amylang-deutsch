<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel-Training für Profis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 50%, #f5f7fa 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d3748;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2d3748; font-size: 2.2em; margin-bottom: 30px; }
        .game-area { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .article-buttons { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .article-btn {
            width: 130px; height: 130px; font-size: 2.2em; font-weight: bold;
            border: 3px solid transparent; border-radius: 20px; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 6px 20px rgba(0,0,0,0.12); color: #1a202c;
        }
        .article-btn.btn-der { background: #b8d4e8; border-color: #8fc1de; }
        .article-btn.btn-der:hover { background: #9ec9e3; transform: scale(1.08); }
        .article-btn.btn-die { background: #f5c6d6; border-color: #eda5bd; }
        .article-btn.btn-die:hover { background: #f0b0c5; transform: scale(1.08); }
        .article-btn.btn-das { background: #ffd9b3; border-color: #ffc285; }
        .article-btn.btn-das:hover { background: #ffcfa0; transform: scale(1.08); }
        .article-btn:active { transform: scale(0.95); }
        .article-btn.correct { animation: correctPulse 0.5s; background: #9ae6b4 !important; border-color: #68d391 !important; }
        .article-btn.wrong { animation: wrongShake 0.5s; background: #fc8181 !important; border-color: #f56565 !important; }
        @keyframes correctPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .word-display { text-align: center; margin: 40px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .current-word { font-size: 3em; font-weight: bold; color: #2d3748; }
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-box { background: #f7fafc; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-value { font-size: 1.8em; font-weight: bold; color: #2d3748; }
        .stat-label { font-size: 0.9em; color: #718096; margin-top: 5px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .btn { padding: 15px 30px; font-size: 1.1em; font-weight: bold; border: 2px solid #cbd5e0; border-radius: 25px; background: white; color: #2d3748; cursor: pointer; transition: all 0.3s; }
        .btn:hover { background: #f7fafc; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .btn-start { background: linear-gradient(135deg, #9ae6b4 0%, #68d391 100%); border-color: #68d391; color: #1a202c; }
        .btn-start:hover { background: linear-gradient(135deg, #68d391 0%, #48bb78 100%); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-content h2 { color: #2d3748; margin-bottom: 20px; font-size: 2.2em; }
        .modal-content p { font-size: 1.2em; margin: 12px 0; color: #4a5568; }
        .modal-content input { width: 100%; padding: 15px; font-size: 1.2em; border: 2px solid #e2e8f0; border-radius: 10px; background: #f7fafc; color: #2d3748; margin: 20px 0; text-align: center; }
        .modal-content input:focus { outline: none; border-color: #9ae6b4; }
        .highscore-section { background: white; padding: 30px; border-radius: 20px; margin-top: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .highscore-section h3 { color: #2d3748; margin-bottom: 20px; font-size: 1.8em; text-align: center; }
        .highscore-list { display: grid; gap: 10px; }
        .highscore-item { background: #f7fafc; padding: 15px; border-radius: 10px; display: grid; grid-template-columns: 50px 1fr 120px 120px; gap: 15px; align-items: center; border: 1px solid #e2e8f0; }
        .highscore-rank { font-weight: bold; font-size: 1.3em; color: #2d3748; text-align: center; }
        .highscore-rank.gold { color: #d69e2e; }
        .highscore-rank.silver { color: #718096; }
        .highscore-rank.bronze { color: #c05621; }
        .highscore-name { font-weight: bold; color: #2d3748; }
        .progress-bar { width: 100%; height: 16px; background: #e2e8f0; border-radius: 8px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #9ae6b4 0%, #68d391 100%); width: 0%; transition: width 0.3s ease; }
        .streak-indicator { text-align: center; font-size: 1.4em; color: #d69e2e; margin-bottom: 20px; font-weight: bold; min-height: 35px; }
        .streak-fire { animation: fireFlicker 0.5s infinite; }
        @keyframes fireFlicker { 0%, 100% { text-shadow: 0 0 10px #fbd38d, 0 0 20px #f6ad55; } 50% { text-shadow: 0 0 20px #fbd38d, 0 0 30px #f6ad55; } }
        .word-count-info { text-align: center; color: #718096; font-size: 0.9em; margin-top: 20px; }
        @media (max-width: 600px) {
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .article-btn { width: 100px; height: 100px; font-size: 1.8em; }
            .current-word { font-size: 2.2em; }
            .highscore-item { grid-template-columns: 40px 1fr 80px; }
            .highscore-item > div:last-child { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Artikel-Training für Profis 📝</h1>
        <div class="game-area">
            <div class="controls">
                <button class="btn btn-start" id="startBtn" onclick="startGame()">🎮 Spiel starten</button>
                <button class="btn" id="stopBtn" onclick="stopGame()" style="display: none;">⏹️ Beenden</button>
            </div>
            <div class="streak-indicator" id="streakDisplay"></div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
            <div class="stats-bar">
                <div class="stat-box"><div class="stat-value" id="correct">0</div><div class="stat-label">Richtig ✓</div></div>
                <div class="stat-box"><div class="stat-value" id="wrong">0</div><div class="stat-label">Falsch ✗</div></div>
                <div class="stat-box"><div class="stat-value" id="timer">0:00</div><div class="stat-label">Zeit ⏱️</div></div>
                <div class="stat-box"><div class="stat-value" id="points">0</div><div class="stat-label">Punkte ⭐</div></div>
            </div>
            <div class="article-buttons">
                <button class="article-btn btn-der" onclick="checkAnswer('der')">DER</button>
                <button class="article-btn btn-die" onclick="checkAnswer('die')">DIE</button>
                <button class="article-btn btn-das" onclick="checkAnswer('das')">DAS</button>
            </div>
            <div class="word-display"><div class="current-word" id="currentWord">Klicke auf "Spiel starten"</div></div>
            <div class="word-count-info">1500 Wörter zum Üben – perfekt für Aufsätze!</div>
        </div>
        <div class="highscore-section">
            <h3>🏆 Top 10 Rekorde</h3>
            <div class="highscore-list" id="highscoreList"><p style="text-align: center; color: #718096;">Noch keine Rekorde. Sei der Erste!</p></div>
        </div>
    </div>
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>🎉 Geschafft!</h2>
            <p><strong>Richtig:</strong> <span id="finalCorrect"></span></p>
            <p><strong>Falsch:</strong> <span id="finalWrong"></span></p>
            <p><strong>Zeit:</strong> <span id="finalTime"></span></p>
            <p><strong>Punkte:</strong> <span id="finalPoints"></span></p>
            <p id="recordMessage" style="font-size: 1.1em; color: #48bb78; font-weight: bold;"></p>
            <input type="text" id="playerName" placeholder="Dein Name" maxlength="20">
            <button class="btn btn-start" onclick="saveScore()">💾 Speichern</button>
            <button class="btn" onclick="closeModal()">❌ Schließen</button>
        </div>
    </div>

let gameActive = false;
let currentNounIndex = 0;
let shuffledNouns = [];
let correctCount = 0;
let wrongCount = 0;
let timerInterval = null;
let seconds = 0;
let currentStreak = 0;
let bestStreak = 0;

function shuffleArray(array) {
    const newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
}

function startGame() {
    gameActive = true;
    currentNounIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    seconds = 0;
    currentStreak = 0;
    bestStreak = 0;
    document.getElementById('correct').textContent = '0';
    document.getElementById('wrong').textContent = '0';
    document.getElementById('timer').textContent = '0:00';
    document.getElementById('points').textContent = '0';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('streakDisplay').textContent = '';
    shuffledNouns = shuffleArray(nouns);
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    showNextWord();
    startTimer();
}

function stopGame() {
    if (!gameActive) return;
    gameActive = false;
    clearInterval(timerInterval);
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
    showGameOverModal();
}

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(function() {
        seconds++;
        var mins = Math.floor(seconds / 60);
        var secs = seconds % 60;
        document.getElementById('timer').textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
        updatePoints();
    }, 1000);
}

function showNextWord() {
    if (!gameActive) return;
    if (currentNounIndex >= shuffledNouns.length) {
        stopGame();
        return;
    }
    var currentNoun = shuffledNouns[currentNounIndex];
    document.getElementById('currentWord').textContent = currentNoun.word;
    var progress = ((currentNounIndex + 1) / shuffledNouns.length) * 100;
    document.getElementById('progressBar').style.width = progress + '%';
}

function checkAnswer(selectedArticle) {
    if (!gameActive) return;
    var currentNoun = shuffledNouns[currentNounIndex];
    var buttons = document.querySelectorAll('.article-btn');
    if (selectedArticle === currentNoun.article) {
        correctCount++;
        currentStreak++;
        if (currentStreak > bestStreak) bestStreak = currentStreak;
        document.getElementById('correct').textContent = correctCount;
        buttons.forEach(function(btn) {
            if (btn.textContent === selectedArticle.toUpperCase()) {
                btn.classList.add('correct');
                setTimeout(function() { btn.classList.remove('correct'); }, 500);
            }
        });
    } else {
        wrongCount++;
        currentStreak = 0;
        document.getElementById('wrong').textContent = wrongCount;
        buttons.forEach(function(btn) {
            if (btn.textContent === selectedArticle.toUpperCase()) {
                btn.classList.add('wrong');
                setTimeout(function() { btn.classList.remove('wrong'); }, 500);
            }
        });
    }
    updateStreakDisplay();
    updatePoints();
    currentNounIndex++;
    setTimeout(showNextWord, 500);
}

function updateStreakDisplay() {
    var display = document.getElementById('streakDisplay');
    if (currentStreak >= 3) {
        display.innerHTML = '🔥 ' + currentStreak + ' in Folge richtig! 🔥';
        display.classList.add('streak-fire');
    } else {
        display.textContent = '';
        display.classList.remove('streak-fire');
    }
}

function calculatePoints() {
    var basePoints = correctCount * 100;
    var timePenalty = seconds;
    var streakBonus = bestStreak * 50;
    return Math.max(0, Math.round(basePoints - timePenalty + streakBonus));
}

function updatePoints() {
    document.getElementById('points').textContent = calculatePoints();
}

function showGameOverModal() {
    var mins = Math.floor(seconds / 60);
    var secs = seconds % 60;
    document.getElementById('finalCorrect').textContent = correctCount;
    document.getElementById('finalWrong').textContent = wrongCount;
    document.getElementById('finalTime').textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
    document.getElementById('finalPoints').textContent = calculatePoints();
    var highscores = getHighscores();
    var isTopTen = highscores.length < 10 || calculatePoints() > highscores[highscores.length - 1].points;
    document.getElementById('recordMessage').textContent = isTopTen ? '🎉 Du hast es in die Top 10 geschafft!' : '';
    document.getElementById('playerName').value = '';
    document.getElementById('gameOverModal').classList.add('active');
}

function closeModal() {
    document.getElementById('gameOverModal').classList.remove('active');
    document.getElementById('currentWord').textContent = 'Klicke auf "Spiel starten"';
}

function saveScore() {
    var playerName = document.getElementById('playerName').value.trim() || 'Anonym';
    var score = {
        name: playerName,
        correct: correctCount,
        wrong: wrongCount,
        time: seconds,
        points: calculatePoints(),
        streak: bestStreak,
        date: new Date().toISOString()
    };
    var highscores = getHighscores();
    highscores.push(score);
    highscores.sort(function(a, b) { return b.points - a.points; });
    highscores = highscores.slice(0, 10);
    localStorage.setItem('articleHighscoresProfi', JSON.stringify(highscores));
    displayHighscores();
    closeModal();
}

function getHighscores() {
    return JSON.parse(localStorage.getItem('articleHighscoresProfi') || '[]');
}

function displayHighscores() {
    var highscores = getHighscores();
    var container = document.getElementById('highscoreList');
    if (highscores.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #718096;">Noch keine Rekorde. Sei der Erste!</p>';
        return;
    }
    var html = '';
    for (var i = 0; i < highscores.length; i++) {
        var score = highscores[i];
        var mins = Math.floor(score.time / 60);
        var secs = score.time % 60;
        var rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
        var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        html += '<div class="highscore-item"><div class="highscore-rank ' + rankClass + '">' + medal + ' #' + (i + 1) + '</div><div class="highscore-name">' + score.name + '</div><div style="color: #48bb78;">' + score.correct + '✓ / <span style="color: #fc8181;">' + score.wrong + '✗</span></div><div style="color: #2d3748; text-align: right;"><strong>' + score.points + ' Pkt</strong><br><small>' + mins + ':' + (secs < 10 ? '0' : '') + secs + '</small></div></div>';
    }
    container.innerHTML = html;
}

displayHighscores();

document.addEventListener('keydown', function(e) {
    if (!gameActive) return;
    if (e.key === '1') checkAnswer('der');
    else if (e.key === '2') checkAnswer('die');
    else if (e.key === '3') checkAnswer('das');
});
    </script>
</body>
</html>
