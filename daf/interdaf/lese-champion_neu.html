<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lese-Champion</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f4a261 0%, #e76f51 40%, #ffb84d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }
        h1 {
            color: #e76f51;
            margin-bottom: 20px;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .word-display {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            color: #1a1a1a;
            font-size: 6em;
            font-weight: bold;
            padding: 80px 40px;
            border-radius: 20px;
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .word-display.highlight {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        /* Kleinerer Trennpunkt */
        .word-display {
            font-size: 6em;
        }
        .word-display::first-line {
            line-height: 1;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #e76f51;
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.3em;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:hover {
            background: #d65a3f;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #fff9e7 0%, #ffe0b2 100%);
            border-radius: 15px;
        }
        .stat {
            text-align: center;
        }
        .stat-label {
            color: #666;
            font-size: 1em;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .stat-value {
            color: #e76f51;
            font-size: 2.5em;
            font-weight: bold;
        }
        .speed-control {
            margin: 25px 0;
            padding: 20px;
            background: #fff9e7;
            border-radius: 12px;
        }
        .speed-control label {
            color: #666;
            font-size: 1.2em;
            margin-right: 15px;
            font-weight: bold;
        }
        .speed-control input {
            width: 250px;
            height: 8px;
            cursor: pointer;
        }
        .speed-value {
            display: inline-block;
            margin-left: 15px;
            color: #e76f51;
            font-weight: bold;
            font-size: 1.2em;
        }
        .start-screen, .end-screen {
            padding: 40px 20px;
        }
        .end-screen {
            display: none;
        }
        .final-score {
            font-size: 4em;
            color: #e76f51;
            font-weight: bold;
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .hidden {
            display: none;
        }
        .trophy {
            font-size: 5em;
            margin: 20px 0;
            animation: bounce 0.5s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-20px); }
        }
        .stars {
            font-size: 3em;
            margin: 20px 0;
        }
        .message {
            font-size: 1.5em;
            color: #d65a3f;
            margin: 20px 0;
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e76f51 0%, #ffb84d 100%);
            width: 0%;
            transition: width 0.3s;
            border-radius: 15px;
        }
        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8em;
            animation: celebrate 1s ease-out;
            pointer-events: none;
            z-index: 1000;
        }
        @keyframes celebrate {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Lese-Champion</h1>
        
        <div id="startScreen" class="start-screen">
            <p style="font-size: 1.4em; color: #666; margin-bottom: 30px;">
                Lies so viele Wörter wie du kannst!<br>
                5 Minuten Zeit - bist du bereit?
            </p>
            <div class="speed-control">
                <label>⏱️ Zeit pro Wort:</label>
                <input type="range" id="speedSlider" min="1000" max="15000" value="3000" step="500">
                <span class="speed-value" id="speedLabel">3 Sek.</span>
            </div>
            <button onclick="startGame()" style="font-size: 1.8em; padding: 25px 60px;">🚀 START</button>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="word-display" id="wordDisplay">Bereit?</div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            
            <div class="controls">
                <button onclick="nextWord()">▶️ Nächstes Wort</button>
                <button onclick="pauseGame()" id="pauseBtn">⏸️ Pause</button>
                <button onclick="endGame()">🛑 Stopp</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Gelesen</div>
                    <div class="stat-value" id="counter">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Zeit</div>
                    <div class="stat-value" id="timer">5:00</div>
                </div>
            </div>
        </div>

        <div id="endScreen" class="end-screen">
            <div class="trophy">🏆</div>
            <h2>Spiel zu Ende!</h2>
            <div class="final-score" id="finalScore">0</div>
            <p style="font-size: 1.3em; color: #666;">Wörter gelesen</p>
            <div class="stars" id="stars">⭐</div>
            <div class="message" id="message">Gut gemacht!</div>
            <button onclick="resetGame()" style="font-size: 1.5em; margin-top: 30px;">🔄 Nochmal spielen</button>
        </div>
    </div>

        let autoSpeed = 3000;
        let isPaused = false;
        let totalTime = 300;

        // Audio Context für Sounds
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(frequency, duration) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playSuccessSound() {
            playBeep(523, 0.1);
            setTimeout(() => playBeep(659, 0.1), 100);
            setTimeout(() => playBeep(784, 0.2), 200);
        }

        function playFanfare() {
            const notes = [523, 659, 784, 1047];
            notes.forEach((note, index) => {
                setTimeout(() => playBeep(note, 0.3), index * 150);
            });
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function showCelebration(emoji) {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = emoji;
            document.body.appendChild(celebration);
            setTimeout(() => celebration.remove(), 1000);
        }

        // Speed Slider
        document.getElementById('speedSlider').addEventListener('input', function() {
            autoSpeed = parseInt(this.value);
            const seconds = (autoSpeed / 1000).toFixed(1);
            document.getElementById('speedLabel').textContent = seconds + ' Sek.';
            
            // Restart interval with new speed if game is running
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = setInterval(() => {
                    if (!isPaused) {
                        nextWord();
                    }
                }, autoSpeed);
            }
        });

        function startGame() {
            // Clear any existing intervals first
            if (gameInterval) clearInterval(gameInterval);
            if (timerInterval) clearInterval(timerInterval);
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('endScreen').style.display = 'none';
            
            counter = 0;
            timeLeft = totalTime;
            isPaused = false;
            
            updateDisplay();
            showNextWord();
            
            // Timer
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    document.getElementById('timer').textContent = formatTime(timeLeft);
                    updateProgressBar();
                    
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);

            // Auto-advance
            gameInterval = setInterval(() => {
                if (!isPaused) {
                    nextWord();
                }
            }, autoSpeed);
        }

        function showNextWord() {
            const randomIndex = Math.floor(Math.random() * words.length);
            const wordDisplay = document.getElementById('wordDisplay');
            // Replace • with smaller superscript dot
            const displayWord = words[randomIndex].replace(/•/g, '<span style="font-size:0.3em; vertical-align:middle;">•</span>');
            wordDisplay.innerHTML = displayWord;
            wordDisplay.classList.add('highlight');
            setTimeout(() => wordDisplay.classList.remove('highlight'), 300);
        }

        function nextWord() {
            counter++;
            updateDisplay();
            showNextWord();
            playBeep(440, 0.05);
            
            // Reset auto-advance interval to prevent double-triggering
            if (gameInterval && !isPaused) {
                clearInterval(gameInterval);
                gameInterval = setInterval(() => {
                    if (!isPaused) {
                        nextWord();
                    }
                }, autoSpeed);
            }
            
            // Celebration bei Meilensteinen
            if (counter % 20 === 0) {
                showCelebration('🎉');
                playSuccessSound();
            }
        }

        function updateDisplay() {
            document.getElementById('counter').textContent = counter;
        }

        function updateProgressBar() {
            const progress = ((totalTime - timeLeft) / totalTime) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function pauseGame() {
            isPaused = !isPaused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = isPaused ? '▶️ Weiter' : '⏸️ Pause';
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(timerInterval);
            
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = counter;
            
            // Bewertung basierend auf Anzahl
            let stars = '⭐';
            let message = 'Gut gemacht!';
            
            if (counter >= 80) {
                stars = '⭐⭐⭐⭐⭐';
                message = 'UNGLAUBLICH! Du bist ein Lese-Champion! 🏆';
            } else if (counter >= 60) {
                stars = '⭐⭐⭐⭐';
                message = 'SUPER! Du liest schon sehr gut! 🎯';
            } else if (counter >= 40) {
                stars = '⭐⭐⭐';
                message = 'Toll gemacht! Du wirst immer besser! 🌟';
            } else if (counter >= 25) {
                stars = '⭐⭐';
                message = 'Gut! Weiter so! 💪';
            }
            
            document.getElementById('stars').textContent = stars;
            document.getElementById('message').textContent = message;
            
            // Fanfare abspielen
            playFanfare();
            
            // Konfetti-Effekt
            for (let i = 0; i < 5; i++) {
                setTimeout(() => showCelebration('🎊'), i * 200);
            }
        }

        function resetGame() {
            document.getElementById('endScreen').style.display = 'none';
            document.getElementById('startScreen').classList.remove('hidden');
            counter = 0;
            timeLeft = totalTime;
            updateDisplay();
            document.getElementById('timer').textContent = formatTime(timeLeft);
            document.getElementById('progressBar').style.width = '0%';
        }
    </script>
</body>
</html>
