<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lese-Champion – Neue Wörter</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ff8c00 0%, #ff5e00 30%, #9945ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: linear-gradient(145deg, #fff3e0 0%, #ffe6c7 100%);
            border-radius: 55px;
            padding: 40px;
            box-shadow: 0 25px 65px rgba(128, 0, 255, 0.5);
            text-align: center;
            max-width: 720px;
            width: 100%;
            border: 3px solid #ffb347;
        }
        h1 {
            background: linear-gradient(135deg, #ff8c42, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 3px 3px 0 #ffd966;
            margin-bottom: 20px;
            font-size: 3em;
            letter-spacing: 2px;
        }
        .word-display {
            background: linear-gradient(135deg, #ffefc0 0%, #ffe0a3 100%);
            padding: 30px 30px 22px;
            border-radius: 55px;
            margin: 30px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 18px 40px rgba(156, 0, 210, 0.4);
            border: 3px solid #ffaa33;
            transition: all 0.3s ease;
            gap: 10px;
        }
        .word-display.highlight {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(255, 100, 0, 0.6);
            background: #fff2c9;
        }
        .main-word {
            font-weight: bold;
            color: #5e2a8c;
            letter-spacing: 2px;
            line-height: 1.15;
            word-break: break-word;
            transition: font-size 0.2s;
        }
        .word-meta {
            line-height: 1.7;
            text-align: center;
        }
        .word-def {
            display: block;
            font-size: 0.92rem;
            color: #7a3e9a;
            font-style: normal;
        }
        .word-hu {
            display: block;
            font-size: 0.82rem;
            color: #b06090;
            font-style: italic;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: linear-gradient(95deg, #ff9142, #f27024);
            color: #2e0a4a;
            border: none;
            padding: 18px 35px;
            font-size: 1.3em;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 8px 0 #8b3c00;
            font-family: inherit;
        }
        button:hover {
            background: linear-gradient(95deg, #ffaa55, #ff7b2c);
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #8b3c00;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 5px 0 #8b3c00;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f5e5ff, #e2bdff);
            border-radius: 48px;
            border: 2px solid #ffad60;
        }
        .stat { text-align: center; }
        .stat-label { color: #6b2e9e; font-size: 1.2em; margin-bottom: 8px; font-weight: bold; }
        .stat-value { color: #c43b00; font-size: 2.5em; font-weight: bold; text-shadow: 2px 2px 0px #ffd58c; }
        .speed-control {
            margin: 25px 0;
            padding: 20px;
            background: #faebd2;
            border-radius: 50px;
            border: 2px dashed #ff9040;
        }
        .speed-control label { color: #aa4c1c; font-size: 1.2em; margin-right: 15px; font-weight: bold; }
        .speed-control input { width: 250px; height: 8px; cursor: pointer; accent-color: #ff6a00; }
        .speed-value { display: inline-block; margin-left: 15px; color: #a53f00; font-weight: bold; font-size: 1.2em; background: #ffe1b3; padding: 4px 12px; border-radius: 30px; }
        .start-screen, .end-screen { padding: 40px 20px; }
        .end-screen { display: none; }
        .final-score { font-size: 4em; color: #ff6a00; font-weight: bold; margin: 30px 0; text-shadow: 3px 3px 0 #cd9cff; }
        .hidden { display: none; }
        .trophy { font-size: 5em; margin: 20px 0; animation: bounce 0.5s infinite alternate; }
        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-20px); }
        }
        .stars { font-size: 3em; margin: 20px 0; }
        .message { font-size: 1.5em; color: #d45500; margin: 20px 0; font-weight: bold; background: #fff2cf; display: inline-block; padding: 10px 25px; border-radius: 45px; }
        .progress-bar { width: 100%; height: 30px; background: #fdd49c; border-radius: 30px; overflow: hidden; margin: 20px 0; border: 2px solid #ffa047; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff9142 0%, #a855f7 100%); width: 0%; transition: width 0.3s; border-radius: 30px; }
        .celebration { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8em; animation: celebrate 1s ease-out; pointer-events: none; z-index: 1000; }
        @keyframes celebrate {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0; }
        }
        button#pauseBtn { background: #a855f7; box-shadow: 0 8px 0 #6029a3; }
        button#pauseBtn:hover { background: #c77dff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ LESE-CHAMP ⚡</h1>

        <div id="startScreen" class="start-screen">
            <p style="font-size:1.5em;color:#aa5511;margin-bottom:30px;background:#ffebc2;border-radius:50px;padding:12px;">
                🚀 Echte Wörter für echte Lese-Profis!<br>
                5 Minuten – lies so viele coole Wörter wie du kannst! 💪
            </p>
            <div class="speed-control">
                <label>⏱️ Zeit pro Wort:</label>
                <input type="range" id="speedSlider" min="1000" max="15000" value="3000" step="500">
                <span class="speed-value" id="speedLabel">3 Sek.</span>
            </div>
            <button onclick="startGame()" style="font-size:1.8em;padding:25px 60px;">🔥 START 🔥</button>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="word-display" id="wordDisplay">
                <div class="main-word" style="font-size:5em;">✨ LOS ✨</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="controls">
                <button onclick="nextWord()">📖 Nächstes Wort</button>
                <button onclick="pauseGame()" id="pauseBtn">⏸️ Pause</button>
                <button onclick="endGame()">🛑 Stopp</button>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">🎯 Gelesen</div>
                    <div class="stat-value" id="counter">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">⏰ Zeit</div>
                    <div class="stat-value" id="timer">5:00</div>
                </div>
            </div>
        </div>

        <div id="endScreen" class="end-screen">
            <div class="trophy">🏆</div>
            <h2 style="color:#fb8c2c;font-size:2.5em;text-shadow:2px 2px #b77eff;">SUPER GEMACHT!</h2>
            <div class="stars" id="stars">⭐⭐⭐</div>
            <div class="final-score" id="finalScore">0</div>
            <p class="message" id="message">Wörter gelesen!</p>
            <button onclick="resetGame()" style="font-size:1.5em;padding:20px 50px;margin-top:30px;">🔄 Nochmal spielen</button>
        </div>
    </div>

    // =========================================
    // SPIELMECHANIK

    let currentInterval = null;
    let timerInterval = null;
    let wordCount = 0;
    let timeLeft = 300; // 5 Minuten
    let speed = 3000;
    let isPaused = false;
    let shuffledList = [];
    let currentIndex = 0;

    document.getElementById('speedSlider').addEventListener('input', function() {
        const sec = (this.value / 1000).toFixed(1);
        document.getElementById('speedLabel').textContent = sec + ' Sek.';
        speed = parseInt(this.value);
    });

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function getWordFontSize(word) {
        const len = word.replace(/\./g, '').length;
        if (len > 20) return '2.2em';
        if (len > 16) return '2.8em';
        if (len > 12) return '3.5em';
        if (len > 8)  return '4.5em';
        return '5.2em';
    }

    function renderWord(item) {
        const rendered = item.w.replace(/\.(?=[a-zA-ZäöüÄÖÜßé])/g,
            '<span style="font-size:0.35em;vertical-align:middle;color:#e07820;opacity:0.65;margin:0 1px;">·</span>');
        const fs = getWordFontSize(item.w);
        return `
            <div class="main-word" style="font-size:${fs};">${rendered}</div>
            <div class="word-meta">
                <span class="word-def">📖 ${item.def}</span>
                <span class="word-hu">🇭🇺 ${item.hu}</span>
            </div>`;
    }

    function showNextWord() {
        if (currentIndex >= shuffledList.length) {
            shuffledList = shuffle(shuffledList);
            currentIndex = 0;
        }
        const item = shuffledList[currentIndex++];
        const wordDisplay = document.getElementById('wordDisplay');
        wordDisplay.innerHTML = renderWord(item);
        wordDisplay.classList.add('highlight');
        setTimeout(() => wordDisplay.classList.remove('highlight'), 300);
        wordCount++;
        document.getElementById('counter').textContent = wordCount;
        updateProgress();
    }

    function updateProgress() {
        const pct = ((300 - timeLeft) / 300) * 100;
        document.getElementById('progressBar').style.width = pct + '%';
    }

    function startGame() {
        shuffledList = shuffle(finalWordList);
        currentIndex = 0;
        wordCount = 0;
        timeLeft = 300;
        isPaused = false;

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('endScreen').style.display = 'none';
        document.getElementById('gameScreen').classList.remove('hidden');
        document.getElementById('counter').textContent = '0';
        document.getElementById('pauseBtn').textContent = '⏸️ Pause';

        showNextWord();

        currentInterval = setInterval(() => {
            if (!isPaused) showNextWord();
        }, speed);

        timerInterval = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                document.getElementById('timer').textContent =
                    m + ':' + (s < 10 ? '0' : '') + s;
                if (timeLeft <= 0) endGame();
            }
        }, 1000);
    }

    function nextWord() {
        showNextWord();
        clearInterval(currentInterval);
        currentInterval = setInterval(() => {
            if (!isPaused) showNextWord();
        }, speed);
    }

    function pauseGame() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').textContent =
            isPaused ? '▶️ Weiter' : '⏸️ Pause';
    }

    function endGame() {
        clearInterval(currentInterval);
        clearInterval(timerInterval);

        document.getElementById('gameScreen').classList.add('hidden');
        const end = document.getElementById('endScreen');
        end.style.display = 'block';

        document.getElementById('finalScore').textContent = wordCount;

        let stars = '⭐⭐⭐';
        let msg = '🔥 Lese-Champion!';
        if (wordCount < 20) { stars = '⭐'; msg = '🌱 Super Anfang!'; }
        else if (wordCount < 50) { stars = '⭐⭐'; msg = '💪 Richtig gut!'; }
        else if (wordCount >= 80) { stars = '⭐⭐⭐⭐⭐'; msg = '🚀 MEGA CHAMP!'; }
        else if (wordCount >= 60) { stars = '⭐⭐⭐⭐'; msg = '🏆 Ausgezeichnet!'; }

        document.getElementById('stars').textContent = stars;
        document.getElementById('message').textContent = 'Wörter gelesen! ' + msg;

        // Konfetti
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const emojis = ['🎉','🌟','✨','🏆','🎊','💫','🦋','🐝'];
                const el = document.createElement('div');
                el.className = 'celebration';
                el.style.left = (20 + Math.random() * 60) + '%';
                el.style.top = (20 + Math.random() * 60) + '%';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1200);
            }, i * 300);
        }
    }

    function resetGame() {
        clearInterval(currentInterval);
        clearInterval(timerInterval);
        wordCount = 0;
        timeLeft = 300;
        isPaused = false;

        document.getElementById('endScreen').style.display = 'none';
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('startScreen').classList.remove('hidden');
        document.getElementById('progressBar').style.width = '0%';
    }
