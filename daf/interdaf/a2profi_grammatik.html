<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch A2+ – Neue Herausforderungen</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  padding: 24px 16px 60px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.container {
  background: #fafaf8;
  border-radius: 22px;
  padding: 34px 38px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.5);
  width: 100%;
  max-width: 840px;
}
h1 { color: #0f3460; font-size: 2.4em; margin-bottom: 4px; text-align:center; letter-spacing:-1px; }
.subtitle { color:#888; font-size:1em; font-weight:bold; text-align:center; margin-bottom:26px; }

.screen { display:none; }
.screen.active { display:block; }

/* MENU */
.menu-title { font-size:1.3em; color:#0f3460; font-weight:bold; margin-bottom:14px; }
.menu-grid { display:flex; flex-direction:column; gap:9px; margin-bottom:22px; }
.mode-btn {
  background: linear-gradient(135deg,#f0f4ff,#e8eeff);
  border: 2px solid #c0cdee;
  border-radius: 13px;
  padding: 14px 18px;
  cursor: pointer;
  text-align: left;
  font-size: 1.05em;
  font-weight: bold;
  color: #1a1a2e;
  position: relative;
  transition: all .22s;
  font-family: 'Segoe UI', Arial, sans-serif;
}
.mode-btn:hover { background:linear-gradient(135deg,#e8eeff,#d0dbf8); border-color:#0f3460; transform:translateX(5px); }
.mode-btn .ico { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:1.5em; }
.mode-btn .desc { font-size:.78em; color:#777; margin-top:2px; font-weight:normal; }
.badge { display:inline-block; background:#0f3460; color:white; padding:1px 9px; border-radius:18px; font-size:.68em; font-weight:bold; margin-left:7px; vertical-align:middle; }
.badge.g { background:#e76f51; }
.badge.n { background:#17a2b8; }

/* GAME AREA */
.game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.stats { display:flex; gap:9px; flex-wrap:wrap; }
.stat { background:linear-gradient(135deg,#f0f4ff,#e8eeff); padding:7px 14px; border-radius:11px; border:2px solid #c0cdee; text-align:center; min-width:70px; }
.stat-l { font-size:.65em; color:#aaa; text-transform:uppercase; letter-spacing:1px; font-weight:bold; }
.stat-v { font-size:1.5em; font-weight:bold; color:#0f3460; }
.mode-tag { background:#0f3460; color:white; padding:7px 16px; border-radius:18px; font-weight:bold; font-size:.88em; }

.prog-bar { width:100%; height:18px; background:#eee; border-radius:10px; overflow:hidden; margin-bottom:5px; }
.prog-fill { height:100%; background:linear-gradient(90deg,#0f3460,#e76f51); transition:width .4s; border-radius:10px; }
.prog-text { color:#aaa; font-size:.85em; font-weight:bold; margin-bottom:14px; text-align:center; }

.card {
  background: linear-gradient(135deg,#f7f9ff,#f0f4ff);
  border-radius: 18px;
  padding: 28px 26px;
  margin-bottom: 18px;
  border: 2px solid #c0cdee;
  text-align: center;
}
.card .nr { font-size:.78em; color:#bbb; font-weight:bold; margin-bottom:8px; }
.card .sentence { font-size: 1.65em; font-weight: bold; color: #1a1a2e; line-height: 1.7; margin-bottom: 8px; }
.card .context { font-size: 1.05em; color: #666; font-style: italic; margin-bottom: 0; line-height: 1.5; }
.card.read-mode .sentence { font-size:1.9em; color:#0f3460; }
.card.read-mode .context { font-size:1.1em; }

.ans-row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:16px; }
.ans-btn {
  background: #0f3460;
  color: white;
  border: none;
  border-radius: 13px;
  padding: 13px 24px;
  font-size: 1.1em;
  font-weight: bold;
  cursor: pointer;
  transition: all .22s;
  font-family: 'Segoe UI', Arial, sans-serif;
  box-shadow: 0 4px 12px rgba(15,52,96,.25);
}
.ans-btn:hover { background:#16213e; transform:translateY(-3px); }
.ans-btn.correct { background:#1a7a4a !important; color:white; }
.ans-btn.wrong { background:#c0392b !important; color:white; }

.solution-box {
  background: #eafaf1;
  border-left: 4px solid #1a7a4a;
  padding: 13px 18px;
  border-radius: 11px;
  margin-bottom: 14px;
  display: none;
  text-align: left;
  font-size: 1.05em;
  color: #145a32;
  font-weight: bold;
  line-height: 1.6;
}
.solution-box.visible { display:block; }

.ctrl-row { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
.ctrl-btn {
  background: white;
  border: 2px solid #c0cdee;
  border-radius: 11px;
  padding: 10px 20px;
  color: #0f3460;
  font-size:.95em;
  font-weight:bold;
  cursor:pointer;
  transition:all .22s;
  font-family: 'Segoe UI', Arial, sans-serif;
}
.ctrl-btn:hover { background:#f0f4ff; border-color:#0f3460; transform:translateY(-2px); }
.ctrl-btn.primary { background:#0f3460; color:white; border-color:#0f3460; }
.ctrl-btn.primary:hover { background:#16213e; }
.ctrl-btn.secondary { color:#bbb; border-color:#ddd; }
.ctrl-btn.secondary:hover { color:#0f3460; border-color:#c0cdee; }
.ctrl-btn.sol { background:#fff8e1; border-color:#f0ad00; color:#7a5900; }
.ctrl-btn.sol:hover { background:#fff3cd; }

.result-wrap { text-align:center; padding:10px 0; }
.result-wrap .trophy { font-size:4em; animation:bounce .5s infinite alternate; }
@keyframes bounce { from{transform:translateY(0);} to{transform:translateY(-14px);} }
.result-title { font-size:2.2em; color:#0f3460; font-weight:bold; margin:16px 0 22px; }
.res-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
.res-stat { background:linear-gradient(135deg,#f0f4ff,#e8eeff); padding:16px; border-radius:13px; border:2px solid #c0cdee; }
.res-stat-l { font-size:.85em; color:#aaa; font-weight:bold; margin-bottom:5px; }
.res-stat-v { font-size:2em; font-weight:bold; color:#0f3460; }

.pts-pop { position:fixed; background:linear-gradient(135deg,#1a7a4a,#27ae60); color:white; padding:9px 20px; border-radius:20px; font-size:1.4em; font-weight:bold; pointer-events:none; z-index:1000; animation:floatUp 1s ease forwards; }
@keyframes floatUp { to{transform:translateY(-80px);opacity:0;} }
.cfetti { position:fixed; z-index:999; }

.back-btn { position:fixed; top:14px; left:14px; background:white; border:2px solid #c0cdee; border-radius:11px; padding:8px 16px; color:#0f3460; font-weight:bold; cursor:pointer; display:none; z-index:200; font-family:'Segoe UI',Arial; }
.back-btn:hover { background:#f0f4ff; }

.milestone { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:2000; }
.milestone-inner { text-align:center; }
.milestone-n { font-size:7em; font-weight:bold; color:#e76f51; }
.milestone-t { font-size:1.8em; color:white; font-weight:bold; margin-top:12px; }

.menu-sep { font-size:.78em; color:#aaa; font-weight:bold; text-transform:uppercase; letter-spacing:2px; margin:16px 0 6px; border-top:1px solid #e0e6f5; padding-top:12px; }

@media(max-width:600px){
  .container{padding:20px 14px;}
  h1{font-size:1.8em;}
  .card .sentence{font-size:1.35em;}
  .ans-btn{font-size:1em;padding:11px 16px;}
}
</style>
</head>
<body>
<button class="back-btn" id="backBtn" onclick="goMenu()">← Menü</button>
<div class="container">
<h1>🚀 Deutsch A2+</h1>
<p class="subtitle">Neue Herausforderungen · für echte Profis</p>

<!-- ===== MENU ===== -->
<div id="menuScreen" class="screen active">
  <div class="menu-title">🎯 Wähle eine Übung!</div>
  <div class="menu-grid">

    <div class="menu-sep">📍 Präpositionen</div>
    <button class="mode-btn" onclick="startMode('praep1')">
      1. Wechselpräpositionen – Wo oder Wohin? <span class="badge">Dativ vs. Akk</span>
      <div class="desc">auf den / auf dem? hinter das / hinter dem? – Positions- vs. Richtungsangabe!</div>
      <span class="ico">🏹</span>
    </button>
    <button class="mode-btn" onclick="startMode('praep2')">
      2. Verb + Präposition – Feste Verbindungen <span class="badge g">Wichtig!</span>
      <div class="desc">warten auf, denken an, träumen von, sich freuen auf/über – welche Präp. gehört wohin?</div>
      <span class="ico">🔗</span>
    </button>
    <button class="mode-btn" onclick="startMode('praep3')">
      3. Temporale Präpositionen – Wann? <span class="badge">Zeit!</span>
      <div class="desc">vor, nach, seit, bis, ab, während, um, am, im – Zeitpräpositionen meistern</div>
      <span class="ico">⏱️</span>
    </button>

    <div class="menu-sep">⏰ Perfekt</div>
    <button class="mode-btn" onclick="startMode('perfekt')">
      4. Perfekt – Die kniffligen Fälle <span class="badge">Fallen!</span>
      <div class="desc">Reflexive Verben, liegen/legen, stehen/stellen, begegnen – jetzt wirds schwieriger!</div>
      <span class="ico">⏰</span>
    </button>

    <div class="menu-sep">⚡ Verben</div>
    <button class="mode-btn" onclick="startMode('verbformen')">
      5. Konjunktiv II – Wünsche &amp; Bedingungen <span class="badge g">A2+</span>
      <div class="desc">wäre, hätte, könnte, würde, müsste – was wäre, wenn...?</div>
      <span class="ico">✨</span>
    </button>
    <button class="mode-btn" onclick="startMode('modal')">
      6. Modalverben – Vergangenheit (Präteritum) <span class="badge">Zeitreise!</span>
      <div class="desc">musste, durfte, konnte, wollte, sollte – früher war das so!</div>
      <span class="ico">💬</span>
    </button>

    <div class="menu-sep">📈 Vergleiche</div>
    <button class="mode-btn" onclick="startMode('komp1')">
      7. Komparativ – als oder wie? <span class="badge">Knifflig!</span>
      <div class="desc">größer ALS oder genauso groß WIE? nicht so...WIE – der Unterschied zählt!</div>
      <span class="ico">⚖️</span>
    </button>
    <button class="mode-btn" onclick="startMode('komp2')">
      8. Komparativ – Drei Dinge vergleichen <span class="badge g">Sprechen</span>
      <div class="desc">Drei Dinge, drei Formen – jetzt mit schwierigeren Adjektiven und Themen!</div>
      <span class="ico">🐆</span>
    </button>

    <div class="menu-sep">❌ Verneinung</div>
    <button class="mode-btn" onclick="startMode('vernein')">
      9. Verneinung – Starke Verneinung <span class="badge">Profi!</span>
      <div class="desc">weder...noch, überhaupt nicht, auf keinen Fall, keineswegs, nirgendwo – stark verneinen!</div>
      <span class="ico">🚫</span>
    </button>

    <div class="menu-sep">🪞 Reflexivpronomen</div>
    <button class="mode-btn" onclick="startMode('reflex')">
      10. Reflexivpronomen – Ich auch! <span class="badge">Sprechen</span>
      <div class="desc">Neue Abenteuerwelt-Sätze – Dativ (mir) und Akkusativ (mich) unterscheiden!</div>
      <span class="ico">🪞</span>
    </button>

    <div class="menu-sep">🔄 Passiv</div>
    <button class="mode-btn" onclick="startMode('passiv')">
      11. Passiv – mit von &amp; Perfekt <span class="badge g">Profi!</span>
      <div class="desc">wurde gemacht · wird von... · muss/kann/soll gemacht werden – Passiv in allen Formen!</div>
      <span class="ico">🔄</span>
    </button>

    <div class="menu-sep">👤 Personalpronomen</div>
    <button class="mode-btn" onclick="startMode('proakk')">
      12. Pronomen – Akkusativ <span class="badge">Klick!</span>
      <div class="desc">Das Mädchen → es! (sächlich!) · die Hufe → sie (Plural!) – genau hinschauen!</div>
      <span class="ico">👉</span>
    </button>
    <button class="mode-btn" onclick="startMode('prodat')">
      13. Pronomen – Dativ <span class="badge">Klick!</span>
      <div class="desc">helfen, gehören, gefallen, schmecken, begegnen – Dativverben mit Pronomen!</div>
      <span class="ico">🤝</span>
    </button>

    <div class="menu-sep">🆕 Neu – Satzstruktur</div>
    <button class="mode-btn" onclick="startMode('nebensaetze')">
      14. Nebensätze – Verb am Ende! <span class="badge n">NEU</span>
      <div class="desc">weil, dass, obwohl, wenn, damit, ob – Verb steht IMMER am Ende des Nebensatzes!</div>
      <span class="ico">🔗</span>
    </button>
    <button class="mode-btn" onclick="startMode('relativsaetze')">
      15. Relativsätze – der/die/das/den/dem <span class="badge n">NEU</span>
      <div class="desc">Das ist der Junge, ___ so gut tanzt. – Welches Relativpronomen passt?</div>
      <span class="ico">🎯</span>
    </button>

  </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="gameScreen" class="screen">
  <div class="game-header">
    <div class="stats">
      <div class="stat"><div class="stat-l">Punkte</div><div class="stat-v" id="pts">0</div></div>
      <div class="stat"><div class="stat-l">Richtig</div><div class="stat-v" id="cor">0</div></div>
      <div class="stat"><div class="stat-l">Nr.</div><div class="stat-v" id="qnr">1</div></div>
    </div>
    <div class="mode-tag" id="modeTag">Modus</div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-text" id="progTxt">0 / 0</div>
  <div class="card" id="mainCard">
    <div class="nr" id="cardNr"></div>
    <div class="sentence" id="cardSentence"></div>
    <div class="context" id="cardContext"></div>
  </div>
  <div class="solution-box" id="solBox"></div>
  <div class="ans-row" id="ansRow"></div>
  <div class="ctrl-row">
    <button class="ctrl-btn sol" onclick="showSol()">💡 Lösung zeigen</button>
    <button class="ctrl-btn secondary" onclick="skipQ()">⏭ Weiter</button>
    <button class="ctrl-btn primary" onclick="endGame()">🏁 Fertig</button>
  </div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="resultScreen" class="screen">
  <div class="result-wrap">
    <div class="trophy">🏆</div>
    <div class="result-title">Klasse gemacht!</div>
    <div class="res-stats">
      <div class="res-stat"><div class="res-stat-l">⭐ Punkte</div><div class="res-stat-v" id="rPts">0</div></div>
      <div class="res-stat"><div class="res-stat-l">✅ Richtig</div><div class="res-stat-v" id="rCor">0</div></div>
      <div class="res-stat"><div class="res-stat-l">📋 Gesamt</div><div class="res-stat-v" id="rTot">0</div></div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn primary" onclick="replayMode()">🔄 Nochmal</button>
      <button class="ctrl-btn secondary" onclick="goMenu()">🏠 Menü</button>
    </div>
  </div>
</div>
</div>

<script>
const data = {

// ---- 1. WECHSELPRÄPOSITIONEN ----
praep1:{title:"Wechselpräpositionen – Wo oder Wohin?",type:"choice",items:[
  {s:"Ich lege das Buch ___ Tisch.",opts:["auf den","auf dem","in den","an dem"],a:"auf den",sol:"AUF DEN Tisch – wohin? legen = Bewegung zum Ziel → Akkusativ (der → den)."},
  {s:"Das Buch liegt ___ Tisch.",opts:["auf dem","auf den","an den","in dem"],a:"auf dem",sol:"AUF DEM Tisch – wo? liegen = Position → Dativ (der → dem)."},
  {s:"Die Lehrerin hängt das Plakat ___ Wand.",opts:["an die","an der","auf die","über die"],a:"an die",sol:"AN DIE Wand – wohin? hängen (transitiv) = Bewegung → Akkusativ (die bleibt die)."},
  {s:"Das Plakat hängt ___ Wand.",opts:["an der","an die","auf der","auf die"],a:"an der",sol:"AN DER Wand – wo? hängen (intransitiv) = Position → Dativ (die → der)."},
  {s:"Der Hund springt ___ Sofa.",opts:["auf das","auf dem","in das","in dem"],a:"auf das",sol:"AUF DAS Sofa – wohin? springen = Bewegung → Akkusativ (das bleibt das)."},
  {s:"Die Katze schläft ___ Sofa.",opts:["auf dem","auf das","in dem","in das"],a:"auf dem",sol:"AUF DEM Sofa – wo? schlafen = Position → Dativ (das → dem)."},
  {s:"Ben stellt seine Schuhe ___ Tür.",opts:["vor die","vor der","hinter die","hinter der"],a:"vor die",sol:"VOR DIE Tür – wohin? stellen = Bewegung → Akkusativ (die bleibt die)."},
  {s:"Die Schuhe stehen ___ Tür.",opts:["vor der","vor die","hinter der","hinter die"],a:"vor der",sol:"VOR DER Tür – wo? stehen = Position → Dativ (die → der)."},
  {s:"Der Drache kriecht ___ Höhle.",opts:["in die","in der","aus der","durch die"],a:"in die",sol:"IN DIE Höhle – wohin? kriechen (hinein) = Bewegung → Akkusativ (die bleibt die)."},
  {s:"Der Drache schläft ___ Höhle.",opts:["in der","in die","vor der","aus der"],a:"in der",sol:"IN DER Höhle – wo? schlafen = Position → Dativ (die → der)."},
  {s:"Das Sandwich fällt ___ Boden.",opts:["auf den","auf dem","unter den","unter dem"],a:"auf den",sol:"AUF DEN Boden – wohin? fallen = Bewegung → Akkusativ (der → den)."},
  {s:"Das Sandwich liegt ___ Boden.",opts:["auf dem","auf den","unter dem","unter den"],a:"auf dem",sol:"AUF DEM Boden – wo? liegen = Position → Dativ (der → dem)."},
  {s:"Finn hängt seine Jacke ___ Haken.",opts:["an den","an dem","auf den","auf dem"],a:"an den",sol:"AN DEN Haken – wohin? hängen (transitiv) = Bewegung → Akkusativ (der → den)."},
  {s:"Finns Jacke hängt ___ Haken.",opts:["an dem","an den","auf dem","auf den"],a:"an dem",sol:"AN DEM Haken – wo? hängen (intransitiv) = Position → Dativ (der → dem)."},
  {s:"Das Kind kriecht ___ Tisch.",opts:["unter den","unter dem","hinter den","hinter dem"],a:"unter den",sol:"UNTER DEN Tisch – wohin? kriechen = Bewegung → Akkusativ (der → den)."},
  {s:"Das Kind spielt ___ Tisch.",opts:["unter dem","unter den","hinter dem","hinter den"],a:"unter dem",sol:"UNTER DEM Tisch – wo? spielen = Position → Dativ (der → dem)."},
  {s:"Der Pirat legt den Schatz ___ Sofa.",opts:["hinter das","hinter dem","unter das","unter dem"],a:"hinter das",sol:"HINTER DAS Sofa – wohin? legen = Bewegung → Akkusativ (das bleibt das)."},
  {s:"Der Schatz liegt ___ Sofa.",opts:["hinter dem","hinter das","unter dem","unter das"],a:"hinter dem",sol:"HINTER DEM Sofa – wo? liegen = Position → Dativ (das → dem)."},
  {s:"Die Ameise läuft ___ Rucksack.",opts:["in den","in dem","auf den","auf dem"],a:"in den",sol:"IN DEN Rucksack – wohin? hineinlaufen = Bewegung → Akkusativ (der → den)."},
  {s:"Das Nilpferd sitzt ___ Lehrerpult.",opts:["hinter dem","hinter das","auf dem","auf das"],a:"hinter dem",sol:"HINTER DEM Lehrerpult – wo? sitzen = Position → Dativ (das → dem)."},
]},

// ---- 2. VERB + PRÄPOSITION ----
praep2:{title:"Verb + Präposition – Feste Verbindungen",type:"choice",items:[
  {s:"Ella wartet ___ die nächste Nachricht.",opts:["auf","für","an","nach"],a:"auf",sol:"WARTEN AUF – immer! Man wartet auf jemanden/etwas. auf + Akkusativ."},
  {s:"Finn denkt immer ___ seinen besten Freund.",opts:["an","auf","über","von"],a:"an",sol:"DENKEN AN – man denkt an jemanden/etwas. an + Akkusativ."},
  {s:"Mia träumt ___ einem eigenen Pferd.",opts:["von","an","über","auf"],a:"von",sol:"TRÄUMEN VON – immer von! von + Dativ."},
  {s:"Die Kinder freuen sich ___ den Schulausflug.",opts:["auf","über","von","bei"],a:"auf",sol:"SICH FREUEN AUF – Vorfreude auf etwas Zukünftiges! auf + Akkusativ."},
  {s:"Ben freut sich ___ das tolle Geschenk.",opts:["über","auf","von","für"],a:"über",sol:"SICH FREUEN ÜBER – Reaktion auf etwas Vorhandenes/Passiertes. über + Akkusativ."},
  {s:"Der Schüler hat Angst ___ dem Referat.",opts:["vor","auf","an","über"],a:"vor",sol:"ANGST HABEN VOR – immer vor! vor + Dativ."},
  {s:"Wir sprechen gerade ___ das neue Spiel.",opts:["über","mit","an","von"],a:"über",sol:"SPRECHEN ÜBER – über ein Thema. über + Akkusativ."},
  {s:"Lena interessiert sich sehr ___ Astronomie.",opts:["für","an","über","auf"],a:"für",sol:"SICH INTERESSIEREN FÜR – immer für! für + Akkusativ."},
  {s:"Der Detektiv kümmert sich ___ den Fall.",opts:["um","für","an","auf"],a:"um",sol:"SICH KÜMMERN UM – immer um! um + Akkusativ."},
  {s:"Ella erinnert sich gut ___ den letzten Sommer.",opts:["an","über","auf","von"],a:"an",sol:"SICH ERINNERN AN – an jemanden/etwas. an + Akkusativ."},
  {s:"Ben ärgert sich sehr ___ den Regen.",opts:["über","an","auf","von"],a:"über",sol:"SICH ÄRGERN ÜBER – über etwas Ärgerliches. über + Akkusativ."},
  {s:"Das ganze Publikum lacht ___ den Clown.",opts:["über","an","auf","mit"],a:"über",sol:"LACHEN ÜBER – über etwas Lustiges. über + Akkusativ."},
  {s:"Der Roboter reagiert nicht ___ Befehle.",opts:["auf","an","über","von"],a:"auf",sol:"REAGIEREN AUF – immer auf! auf + Akkusativ."},
  {s:"Die Mutter passt ___ ihr kleines Baby auf.",opts:["auf","über","an","für"],a:"auf",sol:"AUFPASSEN AUF – auf jemanden aufpassen. auf + Akkusativ."},

  {s:"Wenn sie mehr Zeit ___, würde sie Klavier spielen.",opts:["hätte","hat","hatte","haben"],a:"hätte",sol:"HÄTTE – Konjunktiv II von 'haben'. Sie hat keine Zeit, aber wenn..."},
  {s:"___ ich bitte einen Keks haben?",opts:["Dürfte","Durfte","Darf","Dürfe"],a:"Dürfte",sol:"DÜRFTE – Konjunktiv II von 'dürfen'. Höflichste Form der Bitte!"},
  {s:"Das ___ ich nie im Leben tun!",opts:["würde","werde","wurde","werden"],a:"würde",sol:"WÜRDE – Konjunktiv II: würde...tun = Aussage über (irreale) Handlung."},
  {s:"Wenn er krank ___, bliebe er zu Hause.",opts:["wäre","war","ist","sei"],a:"wäre",sol:"WÄRE – Konjunktiv II von 'sein'. Er ist nicht krank, aber hypothetisch..."},

]},

// ---- 7. ALS ODER WIE? ----
komp1:{title:"Komparativ – als oder wie?",type:"choice",items:[
  {s:"Der Elefant ist größer ___ der Esel.",opts:["als","wie","als wie","so wie"],a:"als",sol:"ALS – nach dem Komparativ (größer) immer als. Ungleicher Vergleich."},
  {s:"Finn ist genauso groß ___ Ben.",opts:["wie","als","als wie","so als"],a:"wie",sol:"WIE – genauso...wie = Gleichheit."},
  {s:"Mia läuft schneller ___ ich.",opts:["als","wie","so wie","als wie"],a:"als",sol:"ALS – schneller = Komparativ → als."},
  {s:"Der Hund ist nicht so gefährlich ___ der Löwe.",opts:["wie","als","als wie","so als"],a:"wie",sol:"WIE – nicht so...wie = Gleichheitsvergleich (negiert). Immer wie, nie als!"},
  {s:"Das Einhorn ist schöner ___ alle anderen Pferde.",opts:["als","wie","so wie","als wie"],a:"als",sol:"ALS – schöner = Komparativ → als."},
  {s:"Lena ist genauso alt ___ ihre Cousine.",opts:["wie","als","so als","als wie"],a:"wie",sol:"WIE – genauso alt wie = gleich alt. Gleichheitsvergleich → wie."},
  {s:"Ben schläft länger ___ erlaubt.",opts:["als","wie","so wie","als wie"],a:"als",sol:"ALS – länger = Komparativ → als."},
  {s:"Die Prüfung war nicht so schwer ___ erwartet.",opts:["wie","als","als wie","so als"],a:"wie",sol:"WIE – nicht so...wie. Achtung: auch wenn ungleich, bleibt es wie!"},
  {s:"Der Drache ist viel größer ___ das Einhorn.",opts:["als","wie","so als","als wie"],a:"als",sol:"ALS – größer = Komparativ → als."},
  {s:"Das Eis schmeckt genauso gut ___ der Kuchen.",opts:["wie","als","als wie","so wie"],a:"wie",sol:"WIE – genauso gut wie = Gleichheit."},
  {s:"Heute ist es wärmer ___ gestern.",opts:["als","wie","so wie","als wie"],a:"als",sol:"ALS – wärmer = Komparativ → als."},
  {s:"Ella spielt Klavier so gut ___ ihre Lehrerin.",opts:["wie","als","so als","als wie"],a:"wie",sol:"WIE – so gut wie = Gleichheit (fast gleich)."},
  {s:"Der Gepard ist schneller ___ das Auto.",opts:["als","wie","als wie","so wie"],a:"als",sol:"ALS – schneller = Komparativ → als."},
  {s:"Er ist genauso müde ___ ich.",opts:["wie","als","als wie","so als"],a:"wie",sol:"WIE – genauso müde wie = gleich müde."},
  {s:"Der Berg ist höher ___ ich dachte.",opts:["als","wie","so wie","als wie"],a:"als",sol:"ALS – höher = Komparativ → als."},
  {s:"Der Film ist nicht so gut ___ das Buch.",opts:["wie","als","als wie","so als"],a:"wie",sol:"WIE – nicht so gut wie. Auch negativer Gleichheitsvergleich → wie (nie als!)."},
  {s:"Lena arbeitet fleißiger ___ alle anderen.",opts:["als","wie","als wie","so wie"],a:"als",sol:"ALS – fleißiger = Komparativ → als."},
  {s:"Das Nilpferd ist genauso schwer ___ ein kleines Auto.",opts:["wie","als","so als","als wie"],a:"wie",sol:"WIE – genauso schwer wie = Gleichheitsvergleich."},
  {s:"Der Kuchen schmeckt heute besser ___ gestern.",opts:["als","wie","als wie","so wie"],a:"als",sol:"ALS – besser = Komparativ (gut → besser → am besten) → als."},
  {s:"Finn kann nicht so hoch springen ___ sein Bruder.",opts:["wie","als","als wie","so als"],a:"wie",sol:"WIE – nicht so hoch wie. Negativer Gleichheitsvergleich → immer wie!"},
]},

// ===== ENGINE =====
let state={mode:null,items:[],idx:0,pts:0,cor:0,attempted:0};
const modeNames={
  praep1:"📍 Wechselpräp.",praep2:"🔗 Verb+Präp.",praep3:"⏱️ Temporal",
  perfekt:"⏰ Perfekt",verbformen:"✨ Konjunktiv II",modal:"💬 Modal-Prät.",
  komp1:"⚖️ als/wie",komp2:"🐆 3 Dinge",vernein:"🚫 Verneinung",
  reflex:"🪞 Reflexiv",passiv:"🔄 Passiv",proakk:"👉 Pron.Akk.",
  prodat:"🤝 Pron.Dat.",nebensaetze:"🔗 Nebensätze",relativsaetze:"🎯 Relativsätze"
};

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('backBtn').style.display=id==='gameScreen'?'block':'none';
}
function goMenu(){showScreen('menuScreen');}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startMode(mode){
  state.mode=mode;
  state.items=shuffle(data[mode].items);
  state.idx=0;state.pts=0;state.cor=0;state.attempted=0;
  document.getElementById('modeTag').textContent=modeNames[mode];
  updateStats();showScreen('gameScreen');renderQ();
}
function replayMode(){startMode(state.mode);}

function renderQ(){
  const d=data[state.mode],q=state.items[state.idx],total=state.items.length;
  document.getElementById('qnr').textContent=state.idx+1;
  document.getElementById('progFill').style.width=(state.idx/total*100)+'%';
  document.getElementById('progTxt').textContent=state.idx+' / '+total+' erledigt';
  const isRead=d.type==='read';
  const card=document.getElementById('mainCard');
  card.className='card'+(isRead?' read-mode':'');
  document.getElementById('cardNr').textContent='Aufgabe '+(state.idx+1)+' von '+total;
  document.getElementById('cardSentence').textContent=q.s;
  document.getElementById('cardContext').textContent=q.c||'';
  document.getElementById('solBox').className='solution-box';
  document.getElementById('solBox').innerHTML='';
  const ansRow=document.getElementById('ansRow');
  ansRow.innerHTML='';
  if(d.type==='choice'){
    const opts=shuffle(q.opts);
    opts.forEach(opt=>{
      const btn=document.createElement('button');
      btn.className='ans-btn';btn.textContent=opt;
      btn.onclick=()=>checkAnswer(opt,btn,q);
      ansRow.appendChild(btn);
    });
  }
}

function checkAnswer(chosen,btnEl,q){
  state.attempted++;
  const allBtns=document.querySelectorAll('.ans-btn');
  allBtns.forEach(b=>b.onclick=null);
  if(chosen===q.a){
    btnEl.classList.add('correct');state.cor++;state.pts+=10;
    playSound(true);showPop('+10');updateStats();
    setTimeout(nextQ,900);
  }else{
    btnEl.classList.add('wrong');
    allBtns.forEach(b=>{if(b.textContent===q.a)b.classList.add('correct');});
    playSound(false);showSol();updateStats();
    setTimeout(nextQ,1700);
  }
}

function showSol(){
  const q=state.items[state.idx];
  const box=document.getElementById('solBox');
  box.innerHTML='✅ '+( q.sol||q.a);box.classList.add('visible');
}
function nextQ(){
  if(state.idx+1>=state.items.length){endGame();return;}
  state.idx++;renderQ();
  if(state.idx>0&&state.idx%5===0)showMilestone(state.idx);
}
function skipQ(){
  state.items.push(state.items[state.idx]);state.idx++;
  if(state.idx>=state.items.length){endGame();return;}
  renderQ();
}
function endGame(){
  document.getElementById('rPts').textContent=state.pts;
  document.getElementById('rCor').textContent=state.cor;
  document.getElementById('rTot').textContent=state.items.length;
  showScreen('resultScreen');
  document.getElementById('backBtn').style.display='none';
  playFanfare();confetti();
}
function updateStats(){
  document.getElementById('pts').textContent=state.pts;
  document.getElementById('cor').textContent=state.cor;
}
function playSound(ok){
  try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.frequency.value=ok?880:220;o.type=ok?'sine':'sawtooth';
    g.gain.setValueAtTime(.18,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3);
    o.start();o.stop(c.currentTime+.3);}catch(e){}
}
function playFanfare(){
  try{const c=new AudioContext();
    [523,659,784,1047].forEach((f,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);o.frequency.value=f;
      g.gain.setValueAtTime(.15,c.currentTime+i*.15);
      g.gain.exponentialRampToValueAtTime(.01,c.currentTime+i*.15+.25);
      o.start(c.currentTime+i*.15);o.stop(c.currentTime+i*.15+.3);
    });}catch(e){}
}
function showPop(txt){
  const p=document.createElement('div');p.className='pts-pop';p.textContent=txt;
  p.style.left=(30+Math.random()*40)+'%';p.style.top='30%';
  document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
}
function showMilestone(n){
  const ov=document.createElement('div');ov.className='milestone';
  ov.innerHTML='<div class="milestone-inner"><div class="milestone-n">'+n+'</div><div class="milestone-t">🎉 '+n+' Aufgaben erledigt!</div></div>';
  document.body.appendChild(ov);playFanfare();confetti();
  setTimeout(()=>ov.remove(),2200);
}
function confetti(){
  const cols=['#0f3460','#e76f51','#17a2b8','#1a7a4a','#f0ad00','#a78bfa','#f0abfc'];
  for(let i=0;i<90;i++){
    const c=document.createElement('div');c.className='cfetti';
    c.style.left=Math.random()*100+'vw';c.style.top='-10px';
    c.style.background=cols[Math.floor(Math.random()*cols.length)];
    c.style.borderRadius=Math.random()>.5?'50%':'3px';
    const sz=(Math.random()*10+5)+'px';c.style.width=c.style.height=sz;
    document.body.appendChild(c);
    const a=c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:'translateY(100vh) rotate('+Math.floor(Math.random()*720)+'deg)',opacity:0}],
      {duration:2000+Math.random()*1500,easing:'ease-out'});
    a.onfinish=()=>c.remove();
  }
}
</script>
