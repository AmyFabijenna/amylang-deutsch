<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel & Fälle Champion 🏆</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #052e2e;
            --primary-light: #0a4a4a;
            --accent: #0e9e8e;
            --accent-glow: #14c9b5;
            --indefinite: #f5c842;
            --indefinite-glow: #ffe066;
            --success: #2ed8a0;
            --error: #ff6b6b;
            --warning: #ffa94d;
            --bg-dark: #031e20;
            --bg-card: #062e2e;
            --text: #e8fffe;
            --text-muted: #7ecfcb;
            --gold: #ffd700;
            --possessive: #0a6e62;
            --possessive-glow: #14c9b5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #063333 50%, var(--bg-dark) 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: #14c9b5; border-radius: 50%; animation: twinkle 2s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-glow), #a0f5ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; }
        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .menu-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 2px solid var(--primary-light);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .mode-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; margin-bottom: 20px; color: var(--accent-glow); }
        .mode-buttons { display: flex; flex-direction: column; gap: 15px; }
        .mode-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 20px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
        }
        .mode-btn:hover { transform: translateX(10px); box-shadow: 0 5px 20px rgba(14, 158, 142, 0.4); border-color: var(--possessive-glow); }
        .mode-btn .mode-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
        .mode-btn .mode-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; font-weight: 400; }
        .mode-badge { display: inline-block; background: var(--possessive); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-left: 10px; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .stats-bar { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat-item { background: var(--bg-card); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--primary-light); text-align: center; min-width: 100px; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--accent-glow); }
        .streak-fire { display: inline-block; animation: flame 0.5s ease infinite alternate; }
        @keyframes flame { from { transform: scale(1); } to { transform: scale(1.2); } }
        .progress-bar { background: var(--bg-card); border-radius: 10px; height: 20px; overflow: hidden; margin-bottom: 30px; border: 1px solid var(--primary-light); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--possessive), var(--possessive-glow)); transition: width 0.5s ease; }
        .progress-text { text-align: center; margin-top: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .mode-indicator { background: linear-gradient(135deg, var(--possessive), var(--possessive-glow)); color: white; padding: 8px 20px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        .mode-indicator.preposition { background: linear-gradient(135deg, #0a6e62, #0e9e8e); }
        .mode-indicator.definite { background: linear-gradient(135deg, var(--accent), var(--accent-glow)); }
        .mode-indicator.indefinite { background: linear-gradient(135deg, #cc8800, var(--indefinite)); }
        .mode-indicator.negation { background: linear-gradient(135deg, #cc3333, var(--error)); }
        .sentence-box { background: var(--bg-card); border-radius: 20px; padding: 40px; margin-bottom: 30px; border: 2px solid var(--primary-light); box-shadow: 0 10px 40px rgba(14, 158, 142, 0.2); text-align: center; }
        .sentence { font-family: 'Fredoka', sans-serif; font-size: 1.8rem; line-height: 2.5; margin-bottom: 15px; }
        .word { display: inline-block; margin: 0 5px; }
        .article-slot {
            display: inline-block;
            min-width: 70px;
            padding: 8px 15px;
            background: var(--primary);
            border: 2px solid var(--primary-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            color: var(--text-muted);
        }
        .article-slot:hover { border-color: var(--accent); transform: scale(1.05); }
        .article-slot.selected { border-color: var(--accent-glow); background: var(--primary-light); box-shadow: 0 0 20px rgba(14, 158, 142, 0.5); }
        .article-slot.correct { background: linear-gradient(135deg, var(--success), #6ee7e0); color: white; border-color: var(--success); animation: correctPulse 0.5s ease; }
        .article-slot.wrong { animation: shake 0.5s ease; border-color: var(--error); }
        @keyframes correctPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .preposition-word { color: var(--accent-glow); font-weight: 700; }
        .possessive-base { color: var(--possessive-glow); font-weight: 700; font-size: 1.8rem; }
        .hint-box { background: rgba(14, 158, 142, 0.1); border-left: 4px solid var(--accent); padding: 15px 20px; border-radius: 10px; margin-bottom: 25px; display: none; }
        .hint-text { color: var(--accent-glow); font-weight: 600; font-size: 1rem; }
        .article-buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 25px; }
        .article-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 15px 25px;
            color: var(--text);
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
        }
        .article-btn:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(14, 158, 142, 0.4); border-color: var(--accent-glow); background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%); }
        .article-btn:active { transform: translateY(-2px); }
        .article-btn.definite { border-color: var(--accent); }
        .article-btn.indefinite { border-color: var(--indefinite); }
        .article-btn.indefinite:hover { border-color: var(--indefinite-glow); }
        .article-btn.negation { border-color: var(--error); }
        .article-btn.negation:hover { border-color: #ff8787; }
        .article-btn.possessive-ending { border-color: var(--possessive); font-size: 1.1rem; }
        .article-btn.possessive-ending:hover { border-color: var(--possessive-glow); }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .option-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); border: 2px solid rgba(14,158,142,0.3); border-radius: 12px; padding: 14px 20px; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .option-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(14,158,142,0.35); border-color: var(--accent-glow); background: linear-gradient(135deg, var(--primary-light) 0%, #0a5a5a 100%); }
        .option-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .control-btn {
            background: var(--primary);
            border: 2px solid var(--primary-light);
            border-radius: 12px;
            padding: 12px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(14, 158, 142, 0.3); }
        .control-btn.primary { background: linear-gradient(135deg, var(--possessive), var(--possessive-glow)); border-color: var(--possessive-glow); }
        .control-btn.primary:hover { box-shadow: 0 5px 20px rgba(14, 158, 142, 0.5); }
        .control-btn.secondary { background: transparent; border-color: var(--text-muted); color: var(--text-muted); }
        .control-btn.secondary:hover { border-color: var(--accent); color: var(--text); }
        .points-popup { position: fixed; background: linear-gradient(135deg, var(--success), #6ee7e0); color: white; padding: 10px 20px; border-radius: 20px; font-family: 'Fredoka', sans-serif; font-size: 1.5rem; font-weight: 700; pointer-events: none; z-index: 1000; animation: floatUp 1s ease forwards; box-shadow: 0 5px 20px rgba(46, 216, 160, 0.5); }
        .points-popup.streak-bonus { background: linear-gradient(135deg, var(--gold), #ffed4e); color: var(--primary); }
        @keyframes floatUp { to { transform: translateY(-80px); opacity: 0; } }
        .result-card { background: var(--bg-card); border-radius: 20px; padding: 40px; border: 2px solid var(--primary-light); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); text-align: center; }
        .result-title { font-family: 'Fredoka', sans-serif; font-size: 2.5rem; background: linear-gradient(135deg, var(--accent-glow), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 30px; }
        .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .result-stat { background: var(--primary); padding: 20px; border-radius: 15px; border: 1px solid var(--primary-light); }
        .result-stat-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
        .result-stat-value { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--accent-glow); }
        .player-name-input { width: 100%; max-width: 400px; margin: 20px auto; padding: 15px; background: var(--primary); border: 2px solid var(--primary-light); border-radius: 12px; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: 1.1rem; text-align: center; }
        .player-name-input:focus { outline: none; border-color: var(--accent); }
        .leaderboard { margin-top: 30px; }
        .leaderboard-title { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; color: var(--accent-glow); margin-bottom: 20px; }
        .leaderboard-entry { display: flex; justify-content: space-between; align-items: center; background: var(--primary); padding: 15px 20px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--primary-light); transition: all 0.3s ease; }
        .leaderboard-entry:hover { transform: translateX(5px); border-color: var(--accent); }
        .leaderboard-rank { font-size: 1.3rem; width: 50px; }
        .leaderboard-name { flex: 1; font-weight: 600; }
        .leaderboard-score { color: var(--accent-glow); font-weight: 700; margin-right: 15px; }
        .leaderboard-time { color: var(--text-muted); font-size: 0.9rem; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: var(--primary); border: 2px solid var(--primary-light); border-radius: 12px; padding: 10px 20px; color: var(--text); cursor: pointer; transition: all 0.3s ease; z-index: 100; display: none; }
        .back-btn:hover { border-color: var(--accent); transform: translateX(-5px); }
        .milestone-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn 0.5s ease; }
        .milestone-content { text-align: center; }
        .milestone-number { font-family: 'Fredoka', sans-serif; font-size: 8rem; background: linear-gradient(135deg, var(--gold), #ffed4e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .milestone-text { font-size: 2rem; color: var(--text); margin-top: 20px; }
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 1999; }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .sentence { font-size: 1.3rem; line-height: 2.2; }
            .article-btn { font-size: 1rem; padding: 12px 18px; min-width: 65px; }
            .result-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <button class="back-btn" id="backBtn" onclick="goToMenu()">← Zurück zum Menü</button>
    
    <div class="container">
        <header>
            <h1>Artikel & Fälle Champion 🏆</h1>
            <p class="subtitle">Meistere deutsche Artikel, Präpositionen und Fälle spielend!</p>
        </header>

        <div id="startScreen" class="screen active">
            <div class="menu-card">
                <h2 class="mode-title">🎮 Wähle deinen Spielmodus</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="startGame('preposition')">
                        <div>Präpositionen & Artikel <span class="mode-badge">NEU</span></div>
                        <div class="mode-desc">Welcher Artikel folgt nach Präpositionen? (in, an, auf, zu...)</div>
                        <span class="mode-icon">🎯</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('definite')">
                        <div>Bestimmte Artikel</div>
                        <div class="mode-desc">Der, die, das in allen vier Fällen</div>
                        <span class="mode-icon">📌</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('indefinite')">
                        <div>Unbestimmte Artikel</div>
                        <div class="mode-desc">Ein, eine in allen vier Fällen</div>
                        <span class="mode-icon">✨</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('negation')">
                        <div>Verneinung (kein)</div>
                        <div class="mode-desc">Kein, keine in allen vier Fällen</div>
                        <span class="mode-icon">🚫</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('possessive')">
                        <div>Possessivpronomen <span class="mode-badge">SCHWER</span></div>
                        <div class="mode-desc">Mein, dein, sein... mit richtigen Endungen</div>
                        <span class="mode-icon">💎</span>
                    </button>
                </div>
            </div>

            <div class="menu-card">
                <h2 class="mode-title">🏅 Top 5 Bestenliste</h2>
                <div id="menuLeaderboard"></div>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="mode-indicator" id="modeIndicator">Spielmodus</div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-label">Punkte</div>
                        <div class="stat-value" id="points">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Serie</div>
                        <div class="stat-value" id="streak">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Zeit</div>
                        <div class="stat-value" id="timer">0:00</div>
                    </div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0 Sätze gelöst</div>

            <div class="sentence-box">
                <div class="sentence" id="sentence"></div>
                <div class="hint-box" id="hintBox" style="display:none;">
                    <span id="hintText"></span>
                </div>
            </div>

            <div class="options-grid" id="optionsGrid"></div>

            <div class="control-buttons">
                <button class="control-btn secondary" onclick="skipSentence()">⏭️ Überspringen</button>
                <button class="control-btn primary" onclick="endGame()">🏁 Beenden</button>
            </div>
        </div>

        <div id="resultScreen" class="screen">
            <div class="result-card">
                <div class="result-title">🎉 Gratulation!</div>
                
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-label">Punkte</div>
                        <div class="result-stat-value" id="finalPoints">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Zeit</div>
                        <div class="result-stat-value" id="finalTime">0:00</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Beste Serie</div>
                        <div class="result-stat-value" id="bestStreak">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Genauigkeit</div>
                        <div class="result-stat-value" id="accuracy">0%</div>
                    </div>
                </div>

                <input type="text" class="player-name-input" id="playerName" placeholder="Dein Name..." maxlength="20">
                
                <div class="control-buttons">
                    <button class="control-btn primary" onclick="saveScore()">💾 Speichern</button>
                    <button class="control-btn secondary" onclick="playAgain()">🔄 Nochmal spielen</button>
                    <button class="control-btn secondary" onclick="goToMenu()">🏠 Hauptmenü</button>
                </div>

                <div class="leaderboard" id="resultLeaderboard"></div>
            </div>
        </div>
    </div>

    <script>
    const sounds = {
        correct: () => { try { const ctx = new (window.AudioContext||window.webkitAudioContext)(); const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value=800; gain.gain.value=0.13; osc.start(); gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.15); setTimeout(()=>ctx.close(),200); } catch(e){} },
        wrong: () => { try { const ctx = new (window.AudioContext||window.webkitAudioContext)(); const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value=200; osc.type='sawtooth'; gain.gain.value=0.1; osc.start(); gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.2); setTimeout(()=>ctx.close(),250); } catch(e){} },
        milestone: () => { try { const ctx = new (window.AudioContext||window.webkitAudioContext)(); [523,659,784,1047].forEach((f,i)=>{ setTimeout(()=>{ const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value=f; gain.gain.value=0.12; osc.start(); gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3); },i*100); }); setTimeout(()=>ctx.close(),600); } catch(e){} }
    };

    const sentenceData = {

            { text: "Das Nashorn rennt in [den] Blumenladen versehentlich.", slots: [{art:"den"}] },

            { text: "Die Muschel liegt an [dem] Ufer und lauscht.", slots: [{art:"dem"}] },
            { text: "Das Chamäleon klebt an [der] Zimmerdecke und denkt.", slots: [{art:"der"}] },
            { text: "Das Känguru hüpft an [die] Küste zum Sonnenbaden.", slots: [{art:"die"}] },
            { text: "Der Delfin schwimmt an [das] Ufer neugierig heran.", slots: [{art:"das"}] },

    let gameState = {
        mode: null, points: 0, streak: 0, bestStreak: 0,

    function init() { createBackground(); updateMenuLeaderboard(); showScreen("startScreen"); }

    function createBackground() {
        const stars = document.getElementById("stars");
        if (!stars) return;
        for (let i = 0; i < 80; i++) {
            const s = document.createElement("div");
            s.style.cssText = "position:absolute;width:" + (Math.random()*3+1) + "px;height:" + (Math.random()*3+1) + "px;background:rgba(20,201,181," + (Math.random()*0.5+0.1) + ");border-radius:50%;left:" + Math.random()*100 + "%;top:" + Math.random()*100 + "%";
            stars.appendChild(s);
        }
    }

    function showScreen(id) {
        document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
    }

    function startGame(mode) {
        gameState.mode = mode;
        gameState.points = 0; gameState.streak = 0; gameState.bestStreak = 0;
        gameState.correctAnswers = 0; gameState.totalAttempts = 0;
        gameState.startTime = Date.now();
        gameState.allSentences = [...sentenceData[mode]];
        gameState.remainingSentences = [...gameState.allSentences];
        gameState.solvedSentences = [];
        const modeNames = { preposition:"Präpositionen", definite:"Bestimmte Artikel", indefinite:"Unbestimmte Artikel", negation:"Verneinung", possessive:"Possessivpronomen", relative:"Relativpronomen" };
        document.getElementById("modeIndicator").textContent = modeNames[mode];
        updateStats(); updateProgress(); loadNextSentence();
        showScreen("gameScreen");
        document.getElementById("backBtn").style.display = "block";
    }

    function loadNextSentence() {
        if (gameState.remainingSentences.length === 0) { endGame(); return; }
        const idx = Math.floor(Math.random() * gameState.remainingSentences.length);
        gameState.currentSentence = gameState.remainingSentences[idx];
        document.getElementById("hintBox").style.display = "none";
        renderSentence(); renderOptions();
        const firstSlot = document.querySelector(".article-slot");
        if (firstSlot) selectSlot(firstSlot);
    }

    function renderSentence() {
        const s = gameState.currentSentence;
        const container = document.getElementById("sentence");
        container.innerHTML = "";
        let text = s.text, slotIndex = 0;
        const regex = /\[(.*?)\]/g;
        let lastIndex = 0, match;
        while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) { const w = document.createElement("span"); w.className = "word"; w.textContent = text.substring(lastIndex, match.index); container.appendChild(w); }
            const slot = document.createElement("span");
            slot.className = "article-slot"; slot.dataset.slotIndex = slotIndex; slot.textContent = "___";
            slot.onclick = () => selectSlot(slot);
            container.appendChild(slot); slotIndex++; lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) { const w = document.createElement("span"); w.className = "word"; w.textContent = text.substring(lastIndex); container.appendChild(w); }
    }

    function renderOptions() {
        const grid = document.getElementById("optionsGrid");
        grid.innerHTML = "";
        if (gameState.mode === "preposition") {
            const def = ["der","die","das","dem","den","des"];
            const indef = ["ein","eine","einen","einem","einer","eines"];
            const kein = ["kein","keine","keinen","keinem","keiner","keines"];
            let slotIdx = selectedSlot ? parseInt(selectedSlot.dataset.slotIndex) : 0;
            const correctArt = (gameState.currentSentence.slots[slotIdx]?.art || "").toLowerCase();
            let options;
            if (def.includes(correctArt)) options = [...def];
            else if (indef.includes(correctArt)) options = [...indef];
            else if (kein.includes(correctArt)) options = [...kein];
            else options = [...def, ...indef];
            options.push("_");
            options.forEach(opt => { const btn = document.createElement("button"); btn.className = "option-btn"; btn.textContent = opt === "_" ? "(kein Artikel)" : opt; btn.onclick = () => fillSlot(opt); grid.appendChild(btn); });
        } else if (gameState.mode === "possessive") {
            let slotIdx = selectedSlot ? parseInt(selectedSlot.dataset.slotIndex) : 0;
            const targetArt = gameState.currentSentence.slots[slotIdx]?.art || "";
            const lower = targetArt.toLowerCase();
            const formSets = {
                mein: ["mein","meine","meinen","meinem","meiner","meines"],
                dein: ["dein","deine","deinen","deinem","deiner","deines"],
                sein: ["sein","seine","seinen","seinem","seiner","seines"],
                ihr: ["ihr","ihre","ihren","ihrem","ihrer","ihres"],
                unser: ["unser","unsere","unseren","unserem","unserer","unseres"],
                euer: ["euer","eure","euren","eurem","eurer","eures"]
            };
            let base = "mein";
            if (lower.startsWith("mein")) base = "mein";
            else if (lower.startsWith("dein")) base = "dein";
            else if (lower.startsWith("sein")) base = "sein";
            else if (lower.startsWith("ihr") || lower === "ihr") base = "ihr";
            else if (lower.startsWith("unser")) base = "unser";
            else if (lower.startsWith("euer") || lower.startsWith("eur")) base = "euer";
            formSets[base].forEach(opt => { const btn = document.createElement("button"); btn.className = "option-btn"; btn.textContent = opt; btn.onclick = () => fillSlot(opt); grid.appendChild(btn); });
        } else {
            const opts = optionsData[gameState.mode];
            const allOpts = [];
            Object.keys(opts).forEach(k => opts[k].forEach(v => { if (!allOpts.includes(v)) allOpts.push(v); }));
            allOpts.forEach(opt => { const btn = document.createElement("button"); btn.className = "option-btn"; btn.textContent = opt === "_" ? "(kein Artikel)" : opt; btn.onclick = () => fillSlot(opt); grid.appendChild(btn); });
        }
    }

    let selectedSlot = null;

    function selectSlot(slot) {
        if (slot.classList.contains("correct") || slot.classList.contains("wrong")) return;
        document.querySelectorAll(".article-slot").forEach(s => s.classList.remove("selected"));
        slot.classList.add("selected"); selectedSlot = slot;
        if (gameState.mode === "possessive" || gameState.mode === "preposition") renderOptions();
    }

    function fillSlot(value) {
        if (!selectedSlot) { const fe = document.querySelector(".article-slot:not(.correct):not(.wrong)"); if (fe) selectSlot(fe); else return; }
        const slotIndex = parseInt(selectedSlot.dataset.slotIndex);
        const correct = gameState.currentSentence.slots[slotIndex].art;
        selectedSlot.textContent = value === "_" ? "∅" : value;
        gameState.totalAttempts++;
        const isCorrect = value.toLowerCase() === correct.toLowerCase();
        if (isCorrect) {
            selectedSlot.classList.add("correct"); selectedSlot.classList.remove("selected");
            gameState.correctAnswers++; gameState.streak++;
            if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak;
            let pts = gameState.basePointsPerSlot;
            if (gameState.streak >= 20) pts *= 5; else if (gameState.streak >= 15) pts *= 4; else if (gameState.streak >= 10) pts *= 3; else if (gameState.streak >= 5) pts *= 2;
            gameState.points += pts; updateStats(); sounds.correct(); showPointsPopup(pts, gameState.streak >= 5);
            const allCorrect = Array.from(document.querySelectorAll(".article-slot")).every(sl => sl.classList.contains("correct"));
            if (allCorrect) { setTimeout(() => { gameState.solvedSentences.push(gameState.remainingSentences.splice(gameState.remainingSentences.indexOf(gameState.currentSentence), 1)[0]); updateProgress(); if (gameState.solvedSentences.length % 10 === 0 && gameState.solvedSentences.length > 0) showMilestone(gameState.solvedSentences.length); loadNextSentence(); }, 800); }
            const nextEmpty = document.querySelector(".article-slot:not(.correct):not(.wrong)");
            if (nextEmpty) selectSlot(nextEmpty); else selectedSlot = null;
        } else {
            selectedSlot.classList.add("wrong"); gameState.streak = 0; updateStats(); sounds.wrong();
            document.getElementById("hintBox").style.display = "block";
            document.getElementById("hintText").textContent = "Richtig wäre: \u201e" + (correct === "_" ? "(kein Artikel)" : correct) + "\u201c";
            setTimeout(() => { selectedSlot.classList.remove("wrong","selected"); selectedSlot.textContent = "___"; selectedSlot = null; }, 500);
        }
    }

    function skipSentence() { gameState.streak = 0; updateStats(); const s = gameState.remainingSentences.shift(); gameState.remainingSentences.push(s); loadNextSentence(); }

    function updateStats() {
        document.getElementById("points").textContent = gameState.points;
        const el = document.getElementById("streak");
        el.innerHTML = gameState.streak > 2 ? "<span class=\"streak-fire\">🔥</span>" + gameState.streak : gameState.streak;
    }

    function updateProgress() {
        const total = gameState.solvedSentences.length + gameState.remainingSentences.length;
        const solved = gameState.solvedSentences.length;
        document.getElementById("progressFill").style.width = (total > 0 ? (solved/total)*100 : 0) + "%";
        document.getElementById("progressText").textContent = solved + " / " + total + " Sätze gelöst";
    }

    function showPointsPopup(pts, isStreak) {
        const popup = document.createElement("div");
        popup.className = "points-popup" + (isStreak ? " streak-bonus" : "");
        popup.textContent = isStreak ? "+" + pts + " 🔥 Combo!" : "+" + pts;
        popup.style.left = (Math.random()*60+20) + "%"; popup.style.top = "40%";
        document.body.appendChild(popup); setTimeout(() => popup.remove(), 1000);
    }

    function showMilestone(n) {
        const overlay = document.createElement("div"); overlay.className = "milestone-overlay";
        overlay.innerHTML = "<div class=\"milestone-content\"><div class=\"milestone-number\">" + n + "</div><div class=\"milestone-text\">🎉 Wow, " + n + " Sätze!</div></div>";
        document.body.appendChild(overlay); sounds.milestone(); createConfetti();
        setTimeout(() => overlay.remove(), 2500);
    }

    function createConfetti() {
        const colors = ["#0a6e62","#0e9e8e","#14c9b5","#f5c842","#2ed8a0","#ff6b6b"];
        for (let i = 0; i < 100; i++) {
            const c = document.createElement("div"); c.className = "confetti";
            c.style.left = Math.random()*100 + "vw"; c.style.top = "-10px";
            c.style.background = colors[Math.floor(Math.random()*colors.length)];
            c.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
            const sz = (Math.random()*10+5) + "px"; c.style.width = c.style.height = sz;
            document.body.appendChild(c);
            const anim = c.animate([{transform:"translateY(0) rotate(0deg)",opacity:1},{transform:"translateY(100vh) rotate(" + Math.random()*720 + "deg)",opacity:0}],{duration:Math.random()*2000+2000,easing:"ease-out"});
            anim.onfinish = () => c.remove();
        }
    }

    function endGame() {
        clearInterval(gameState.timerInterval);
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        document.getElementById("finalPoints").textContent = gameState.points;
        document.getElementById("finalTime").textContent = Math.floor(elapsed/60) + ":" + (elapsed%60).toString().padStart(2,"0");
        document.getElementById("bestStreak").textContent = gameState.bestStreak;
        document.getElementById("accuracy").textContent = gameState.totalAttempts > 0 ? Math.round((gameState.correctAnswers/gameState.totalAttempts)*100) + "%" : "0%";
        showScreen("resultScreen"); document.getElementById("backBtn").style.display = "none";
        updateResultLeaderboard(); sounds.milestone(); createConfetti();
    }

    function loadLeaderboard() { try { return JSON.parse(localStorage.getItem("artikelChampionTuerkisLeaderboard") || "[]"); } catch(e) { return []; } }
    function saveLeaderboard(b) { try { localStorage.setItem("artikelChampionTuerkisLeaderboard", JSON.stringify(b)); } catch(e) {} }

    function saveScore() {
        const name = document.getElementById("playerName").value.trim() || "Anonym";
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        const modeNames = { preposition:"Präpositionen", definite:"Bestimmte Artikel", indefinite:"Unbestimmte Artikel", negation:"Verneinung", possessive:"Possessivpronomen", relative:"Relativpronomen" };
        const entry = { name, points:gameState.points, time:elapsed, mode:modeNames[gameState.mode], date:new Date().toLocaleDateString("de-DE") };
        const board = loadLeaderboard(); board.push(entry); board.sort((a,b)=>b.points-a.points);
        saveLeaderboard(board.slice(0,10)); updateResultLeaderboard(); updateMenuLeaderboard();
        document.getElementById("playerName").disabled = true;
        event.target.disabled = true; event.target.textContent = "✓ Gespeichert!";
    }

    function formatTime(s) { return Math.floor(s/60) + ":" + (s%60).toString().padStart(2,"0"); }

    function renderBoard(container, entries, limit) {
        if (entries.length === 0) { container.innerHTML = "<p style=\"color:var(--text-muted);text-align:center;\">Noch keine Einträge!</p>"; return; }
        container.innerHTML = entries.slice(0,limit).map((e,i) =>
            "<div class=\"leaderboard-entry\"><span class=\"leaderboard-rank\">" + (i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+".") + "</span><span class=\"leaderboard-name\">" + e.name + "</span><span class=\"leaderboard-score\">" + e.points + " Pkt</span><span class=\"leaderboard-time\">" + formatTime(e.time) + "</span></div>"
        ).join("");
    }

    function updateMenuLeaderboard() { renderBoard(document.getElementById("menuLeaderboard"), loadLeaderboard(), 5); }
    function updateResultLeaderboard() {
        const c = document.getElementById("resultLeaderboard");
        c.innerHTML = "<h3 class=\"leaderboard-title\">🏅 Bestenliste</h3>";
        const inner = document.createElement("div"); renderBoard(inner, loadLeaderboard(), 5); c.appendChild(inner);
    }

    function playAgain() {
        document.getElementById("playerName").disabled = false; document.getElementById("playerName").value = "";
        const btn = document.querySelector("#resultScreen .control-btn.primary");
        if (btn) { btn.disabled = false; btn.textContent = "💾 Speichern"; }
        startGame(gameState.mode);
    }

    function goToMenu() {
        clearInterval(gameState.timerInterval); document.getElementById("backBtn").style.display = "none";
        document.getElementById("playerName").disabled = false; document.getElementById("playerName").value = "";
        const btn = document.querySelector("#resultScreen .control-btn.primary");
        if (btn) { btn.disabled = false; btn.textContent = "💾 Speichern"; }
        showScreen("startScreen"); updateMenuLeaderboard();
    }

    document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
