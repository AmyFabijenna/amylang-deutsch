<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel & Fälle Champion 🏆</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #052e2e;
            --primary-light: #0a4a4a;
            --accent: #0e9e8e;
            --accent-glow: #14c9b5;
            --indefinite: #f5c842;
            --indefinite-glow: #ffe066;
            --success: #2ed8a0;
            --error: #ff6b6b;
            --warning: #ffa94d;
            --bg-dark: #031e20;
            --bg-card: #062e2e;
            --text: #e8fffe;
            --text-muted: #7ecfcb;
            --gold: #ffd700;
            --possessive: #0a6e62;
            --possessive-glow: #14c9b5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #063333 50%, var(--bg-dark) 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: #14c9b5; border-radius: 50%; animation: twinkle 2s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-glow), #a0f5ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; }
        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .menu-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 2px solid var(--primary-light);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .mode-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; margin-bottom: 20px; color: var(--accent-glow); }
        .mode-buttons { display: flex; flex-direction: column; gap: 15px; }
        .mode-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 20px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
        }
        .mode-btn:hover { transform: translateX(10px); box-shadow: 0 5px 20px rgba(14, 158, 142, 0.4); border-color: var(--possessive-glow); }
        .mode-btn .mode-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
        .mode-btn .mode-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; font-weight: 400; }
        .mode-badge { display: inline-block; background: var(--possessive); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-left: 10px; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .stats-bar { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat-item { background: var(--bg-card); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--primary-light); text-align: center; min-width: 100px; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--accent-glow); }
        .streak-fire { display: inline-block; animation: flame 0.5s ease infinite alternate; }
        @keyframes flame { from { transform: scale(1); } to { transform: scale(1.2); } }
        .progress-bar { background: var(--bg-card); border-radius: 10px; height: 20px; overflow: hidden; margin-bottom: 30px; border: 1px solid var(--primary-light); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--possessive), var(--possessive-glow)); transition: width 0.5s ease; }
        .progress-text { text-align: center; margin-top: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .mode-indicator { background: linear-gradient(135deg, var(--possessive), var(--possessive-glow)); color: white; padding: 8px 20px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        .mode-indicator.preposition { background: linear-gradient(135deg, #0a6e62, #0e9e8e); }
        .mode-indicator.definite { background: linear-gradient(135deg, var(--accent), var(--accent-glow)); }
        .mode-indicator.indefinite { background: linear-gradient(135deg, #cc8800, var(--indefinite)); }
        .mode-indicator.negation { background: linear-gradient(135deg, #cc3333, var(--error)); }
        .sentence-box { background: var(--bg-card); border-radius: 20px; padding: 40px; margin-bottom: 30px; border: 2px solid var(--primary-light); box-shadow: 0 10px 40px rgba(14, 158, 142, 0.2); text-align: center; }
        .sentence { font-family: 'Fredoka', sans-serif; font-size: 1.8rem; line-height: 2.5; margin-bottom: 15px; }
        .word { display: inline-block; margin: 0 5px; }
        .article-slot {
            display: inline-block;
            min-width: 70px;
            padding: 8px 15px;
            background: var(--primary);
            border: 2px solid var(--primary-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            color: var(--text-muted);
        }
        .article-slot:hover { border-color: var(--accent); transform: scale(1.05); }
        .article-slot.selected { border-color: var(--accent-glow); background: var(--primary-light); box-shadow: 0 0 20px rgba(14, 158, 142, 0.5); }
        .article-slot.correct { background: linear-gradient(135deg, var(--success), #6ee7e0); color: white; border-color: var(--success); animation: correctPulse 0.5s ease; }
        .article-slot.wrong { animation: shake 0.5s ease; border-color: var(--error); }
        @keyframes correctPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .preposition-word { color: var(--accent-glow); font-weight: 700; }
        .possessive-base { color: var(--possessive-glow); font-weight: 700; font-size: 1.8rem; }
        .hint-box { background: rgba(14, 158, 142, 0.1); border-left: 4px solid var(--accent); padding: 15px 20px; border-radius: 10px; margin-bottom: 25px; display: none; }
        .hint-text { color: var(--accent-glow); font-weight: 600; font-size: 1rem; }
        .article-buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 25px; }
        .article-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 15px 25px;
            color: var(--text);
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
        }
        .article-btn:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(14, 158, 142, 0.4); border-color: var(--accent-glow); background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%); }
        .article-btn:active { transform: translateY(-2px); }
        .article-btn.definite { border-color: var(--accent); }
        .article-btn.indefinite { border-color: var(--indefinite); }
        .article-btn.indefinite:hover { border-color: var(--indefinite-glow); }
        .article-btn.negation { border-color: var(--error); }
        .article-btn.negation:hover { border-color: #ff8787; }
        .article-btn.possessive-ending { border-color: var(--possessive); font-size: 1.1rem; }
        .article-btn.possessive-ending:hover { border-color: var(--possessive-glow); }
        .control-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .control-btn {
            background: var(--primary);
            border: 2px solid var(--primary-light);
            border-radius: 12px;
            padding: 12px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(14, 158, 142, 0.3); }
        .control-btn.primary { background: linear-gradient(135deg, var(--possessive), var(--possessive-glow)); border-color: var(--possessive-glow); }
        .control-btn.primary:hover { box-shadow: 0 5px 20px rgba(14, 158, 142, 0.5); }
        .control-btn.secondary { background: transparent; border-color: var(--text-muted); color: var(--text-muted); }
        .control-btn.secondary:hover { border-color: var(--accent); color: var(--text); }
        .points-popup { position: fixed; background: linear-gradient(135deg, var(--success), #6ee7e0); color: white; padding: 10px 20px; border-radius: 20px; font-family: 'Fredoka', sans-serif; font-size: 1.5rem; font-weight: 700; pointer-events: none; z-index: 1000; animation: floatUp 1s ease forwards; box-shadow: 0 5px 20px rgba(46, 216, 160, 0.5); }
        .points-popup.streak-bonus { background: linear-gradient(135deg, var(--gold), #ffed4e); color: var(--primary); }
        @keyframes floatUp { to { transform: translateY(-80px); opacity: 0; } }
        .result-card { background: var(--bg-card); border-radius: 20px; padding: 40px; border: 2px solid var(--primary-light); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); text-align: center; }
        .result-title { font-family: 'Fredoka', sans-serif; font-size: 2.5rem; background: linear-gradient(135deg, var(--accent-glow), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 30px; }
        .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .result-stat { background: var(--primary); padding: 20px; border-radius: 15px; border: 1px solid var(--primary-light); }
        .result-stat-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
        .result-stat-value { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--accent-glow); }
        .player-name-input { width: 100%; max-width: 400px; margin: 20px auto; padding: 15px; background: var(--primary); border: 2px solid var(--primary-light); border-radius: 12px; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: 1.1rem; text-align: center; }
        .player-name-input:focus { outline: none; border-color: var(--accent); }
        .leaderboard { margin-top: 30px; }
        .leaderboard-title { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; color: var(--accent-glow); margin-bottom: 20px; }
        .leaderboard-entry { display: flex; justify-content: space-between; align-items: center; background: var(--primary); padding: 15px 20px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--primary-light); transition: all 0.3s ease; }
        .leaderboard-entry:hover { transform: translateX(5px); border-color: var(--accent); }
        .leaderboard-rank { font-size: 1.3rem; width: 50px; }
        .leaderboard-name { flex: 1; font-weight: 600; }
        .leaderboard-score { color: var(--accent-glow); font-weight: 700; margin-right: 15px; }
        .leaderboard-time { color: var(--text-muted); font-size: 0.9rem; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: var(--primary); border: 2px solid var(--primary-light); border-radius: 12px; padding: 10px 20px; color: var(--text); cursor: pointer; transition: all 0.3s ease; z-index: 100; display: none; }
        .back-btn:hover { border-color: var(--accent); transform: translateX(-5px); }
        .milestone-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn 0.5s ease; }
        .milestone-content { text-align: center; }
        .milestone-number { font-family: 'Fredoka', sans-serif; font-size: 8rem; background: linear-gradient(135deg, var(--gold), #ffed4e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .milestone-text { font-size: 2rem; color: var(--text); margin-top: 20px; }
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 1999; }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .sentence { font-size: 1.3rem; line-height: 2.2; }
            .article-btn { font-size: 1rem; padding: 12px 18px; min-width: 65px; }
            .result-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <button class="back-btn" id="backBtn" onclick="goToMenu()">← Zurück zum Menü</button>
    
    <div class="container">
        <header>
            <h1>Artikel & Fälle Champion 🏆</h1>
            <p class="subtitle">Meistere deutsche Artikel, Präpositionen und Fälle spielend!</p>
        </header>

        <div id="startScreen" class="screen active">
            <div class="menu-card">
                <h2 class="mode-title">🎮 Wähle deinen Spielmodus</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="startGame('preposition')">
                        <div>Präpositionen & Artikel <span class="mode-badge">NEU</span></div>
                        <div class="mode-desc">Welcher Artikel folgt nach Präpositionen? (in, an, auf, zu...)</div>
                        <span class="mode-icon">🎯</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('definite')">
                        <div>Bestimmte Artikel</div>
                        <div class="mode-desc">Der, die, das in allen vier Fällen</div>
                        <span class="mode-icon">📌</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('indefinite')">
                        <div>Unbestimmte Artikel</div>
                        <div class="mode-desc">Ein, eine in allen vier Fällen</div>
                        <span class="mode-icon">✨</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('negation')">
                        <div>Verneinung (kein)</div>
                        <div class="mode-desc">Kein, keine in allen vier Fällen</div>
                        <span class="mode-icon">🚫</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('possessive')">
                        <div>Possessivpronomen <span class="mode-badge">SCHWER</span></div>
                        <div class="mode-desc">Mein, dein, sein... mit richtigen Endungen</div>
                        <span class="mode-icon">💎</span>
                    </button>
                </div>
            </div>

            <div class="menu-card">
                <h2 class="mode-title">🏅 Top 5 Bestenliste</h2>
                <div id="menuLeaderboard"></div>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="mode-indicator" id="modeIndicator">Spielmodus</div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-label">Punkte</div>
                        <div class="stat-value" id="points">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Serie</div>
                        <div class="stat-value" id="streak">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Zeit</div>
                        <div class="stat-value" id="timer">0:00</div>
                    </div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0 Sätze gelöst</div>

            <div class="hint-box" id="hintBox">
                <div class="hint-text" id="hintText"></div>
            </div>

            <div class="sentence-box">
                <div class="sentence" id="sentence"></div>
            </div>

            <div class="article-buttons" id="articleButtons"></div>

            <div class="control-buttons">
                <button class="control-btn secondary" onclick="skipSentence()">⏭️ Überspringen</button>
                <button class="control-btn primary" onclick="endGame()">🏁 Beenden</button>
            </div>
        </div>

        <div id="resultScreen" class="screen">
            <div class="result-card">
                <div class="result-title">🎉 Gratulation!</div>
                
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-label">Punkte</div>
                        <div class="result-stat-value" id="finalPoints">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Zeit</div>
                        <div class="result-stat-value" id="finalTime">0:00</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Beste Serie</div>
                        <div class="result-stat-value" id="bestStreak">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Genauigkeit</div>
                        <div class="result-stat-value" id="accuracy">0%</div>
                    </div>
                </div>

                <input type="text" class="player-name-input" id="playerName" placeholder="Dein Name..." maxlength="20">
                
                <div class="control-buttons">
                    <button class="control-btn primary" onclick="saveScore()">💾 Speichern</button>
                    <button class="control-btn secondary" onclick="playAgain()">🔄 Nochmal spielen</button>
                    <button class="control-btn secondary" onclick="goToMenu()">🏠 Hauptmenü</button>
                </div>

                <div class="leaderboard" id="resultLeaderboard"></div>
            </div>
        </div>
    </div>

    <script>
        const articles = {
            definite: {
                nominativ: { m: 'der', f: 'die', n: 'das', pl: 'die' },
                akkusativ: { m: 'den', f: 'die', n: 'das', pl: 'die' },
                dativ: { m: 'dem', f: 'der', n: 'dem', pl: 'den' },
                genitiv: { m: 'des', f: 'der', n: 'des', pl: 'der' }
            },
            indefinite: {
                nominativ: { m: 'ein', f: 'eine', n: 'ein', pl: '' },
                akkusativ: { m: 'einen', f: 'eine', n: 'ein', pl: '' },
                dativ: { m: 'einem', f: 'einer', n: 'einem', pl: '' },
                genitiv: { m: 'eines', f: 'einer', n: 'eines', pl: '' }
            },
            negation: {
                nominativ: { m: 'kein', f: 'keine', n: 'kein', pl: 'keine' },
                akkusativ: { m: 'keinen', f: 'keine', n: 'kein', pl: 'keine' },
                dativ: { m: 'keinem', f: 'keiner', n: 'keinem', pl: 'keinen' },
                genitiv: { m: 'keines', f: 'keiner', n: 'keines', pl: 'keiner' }
            },
            possessive: {
                'ich': 'mein',
                'du': 'dein',
                'er': 'sein',
                'sie': 'ihr',
                'es': 'sein',
                'wir': 'unser',
                'ihr': 'euer',
                'sie-pl': 'ihr',
                'Sie': 'Ihr'
            }
        };

        const sentences = {
            preposition: [
                // mit + Dativ (14 Sätze)
                ['Das Nilpferd tanzt', 'mit', 'Tutu', 'auf der Bühne.', 'n', 'dativ'],
                ['Die Schildkröte surft', 'mit', 'Welle', 'zum Strand.', 'f', 'dativ'],
                ['Der Tintenfisch malt', 'mit', 'Tintenstrahl', 'Kunstwerke.', 'm', 'dativ'],
                ['Das Wombat kocht', 'mit', 'Eukalyptus', 'eine Suppe.', 'm', 'dativ'],
                ['Die Giraffe spielt', 'mit', 'Schmetterling', 'Federball.', 'm', 'dativ'],
                ['Der Seelöwe jongliert', 'mit', 'Ball', 'auf der Nase.', 'm', 'dativ'],
                ['Das Gürteltier rollt', 'mit', 'Tempo', 'bergab.', 'n', 'dativ'],
                ['Die Fledermaus schläft', 'mit', 'Augenklappe', 'kopfüber.', 'f', 'dativ'],
                ['Der Kaktus winkt', 'mit', 'Stachel', 'seinen Freunden.', 'm', 'dativ'],
                ['Das Nashorn schreibt', 'mit', 'Feder', 'seine Memoiren.', 'f', 'dativ'],
                ['Die Libelle fliegt', 'mit', 'Windrad', 'ums Haus.', 'n', 'dativ'],
                ['Der Biber baut', 'mit', 'Dampfhammer', 'seinen Damm.', 'm', 'dativ'],
                ['Das Alpaka läuft', 'mit', 'Sonnenbrille', 'durch die Wüste.', 'f', 'dativ'],
                ['Die Möwe surft', 'mit', 'Surfbrett', 'über das Meer.', 'n', 'dativ'],

                // in + Dativ (10 Sätze)
                ['Das Axolotl wohnt', 'in', 'Aquarium', 'mit Disco-Beleuchtung.', 'n', 'dativ'],
                ['Der Pinguin liest', 'in', 'Eisbar', 'seinen Lieblingsroman.', 'f', 'dativ'],
                ['Die Ratte trainiert', 'in', 'Fitnessstudio', 'täglich.', 'n', 'dativ'],
                ['Das Kamel träumt', 'in', 'Oase', 'von Schokolade.', 'f', 'dativ'],
                ['Der Krebs kocht', 'in', 'Küche', 'Pasta al dente.', 'f', 'dativ'],
                ['Die Krabbe meditiert', 'in', 'Korallenriff', 'still.', 'n', 'dativ'],
                ['Das Faultier hängt', 'in', 'Hängematte', 'wie ein Champion.', 'f', 'dativ'],
                ['Der Otter schläft', 'in', 'Fluss', 'auf dem Rücken.', 'm', 'dativ'],
                ['Die Schnecke wohnt', 'in', 'Gartenhaus', 'mit Terrasse.', 'n', 'dativ'],
                ['Das Krokodil lächelt', 'in', 'Sumpf', 'freundlich.', 'm', 'dativ'],

                // in + Akkusativ (10 Sätze)
                ['Der Pinguin springt', 'in', 'Swimmingpool', 'elegant hinein.', 'm', 'akkusativ'],
                ['Die Katze schleicht', 'in', 'Küche', 'nach dem Käse.', 'f', 'akkusativ'],
                ['Das Nashorn rennt', 'in', 'Blumenladen', 'versehentlich.', 'm', 'akkusativ'],
                ['Der Igel rollt', 'in', 'Turnhalle', 'hinein.', 'f', 'akkusativ'],
                ['Die Ente tapst', 'in', 'Supermarkt', 'für Brot.', 'm', 'akkusativ'],
                ['Das Huhn guckt', 'in', 'Spiegel', 'bewundernd.', 'm', 'akkusativ'],

        function getPossessiveForm(person, gender, kasus) {
            const base = articles.possessive[person];
            const endings = {
                nominativ: { m: '', f: 'e', n: '', pl: 'e' },
                akkusativ: { m: 'en', f: 'e', n: '', pl: 'e' },
                dativ: { m: 'em', f: 'er', n: 'em', pl: 'en' },
                genitiv: { m: 'es', f: 'er', n: 'es', pl: 'er' }
            };
            let ending = endings[kasus][gender];
            if (base === 'euer' && ending !== '') {
                return 'eur' + ending;
            }
            return base + ending;
        }

        let gameState = {
            mode: null, points: 0, streak: 0, bestStreak: 0,
            currentSentence: null, currentPossBase: null, selectedSlot: null,
            remainingSentences: [], solvedSentences: [], startTime: null,
            timerInterval: null, correctAnswers: 0, totalAttempts: 0
        };

        const sounds = {
            correct: () => { const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value = 800; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); },
            wrong: () => { const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value = 200; osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2); osc.start(); osc.stop(ctx.currentTime + 0.2); },
            milestone: () => { const ctx = new AudioContext(); [523, 659, 784, 1047].forEach((f, i) => { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value = f; gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.15); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.3); osc.start(ctx.currentTime + i * 0.15); osc.stop(ctx.currentTime + i * 0.15 + 0.3); }); },
            select: () => { const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value = 400; gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
        };

        function playSound(type) { try { sounds[type](); } catch(e) {} }

        function init() { createStars(); showScreen('startScreen'); updateMenuLeaderboard(); }

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = star.style.height = Math.random() * 3 + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'gameScreen') document.getElementById('backBtn').style.display = 'block';
            else document.getElementById('backBtn').style.display = 'none';
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startGame(mode) {
            gameState = {
                mode: mode, points: 0, streak: 0, bestStreak: 0,
                currentSentence: null, currentPossBase: null, selectedSlot: null,
                remainingSentences: shuffle(sentences[mode]),
                solvedSentences: [], startTime: Date.now(), timerInterval: null,
                correctAnswers: 0, totalAttempts: 0
            };
            const modes = { preposition: 'Präpositionen', definite: 'Bestimmte Artikel', indefinite: 'Unbestimmte Artikel', negation: 'Verneinung (kein)', possessive: 'Possessivpronomen' };
            const ind = document.getElementById('modeIndicator');
            ind.textContent = modes[mode];
            ind.className = 'mode-indicator ' + mode;
            updateStats(); updateProgress(); setupArticleButtons(); loadNextSentence(); startTimer(); showScreen('gameScreen');
        }

        function startTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
                document.getElementById('timer').textContent = `${Math.floor(elapsed / 60)}:${(elapsed % 60).toString().padStart(2, '0')}`;
            }, 1000);
        }

        function setupArticleButtons() {
            const container = document.getElementById('articleButtons');
            container.innerHTML = '';
            if (gameState.mode === 'preposition' || gameState.mode === 'definite') {
                ['der', 'die', 'das', 'dem', 'den', 'des'].forEach(art => {
                    const btn = document.createElement('button');
                    btn.className = 'article-btn definite';
                    btn.textContent = art;
                    btn.onclick = () => selectArticle(art);
                    container.appendChild(btn);
                });
            } else if (gameState.mode === 'indefinite') {
                ['ein', 'eine', 'einen', 'einem', 'einer', 'eines', '—'].forEach(art => {
                    const btn = document.createElement('button');
                    btn.className = 'article-btn indefinite';
                    btn.textContent = art === '—' ? '(kein Artikel)' : art;
                    btn.onclick = () => selectArticle(art === '—' ? '' : art);
                    container.appendChild(btn);
                });
            } else if (gameState.mode === 'negation') {
                ['kein', 'keine', 'keinen', 'keinem', 'keiner', 'keines'].forEach(art => {
                    const btn = document.createElement('button');
                    btn.className = 'article-btn negation';
                    btn.textContent = art;
                    btn.onclick = () => selectArticle(art);
                    container.appendChild(btn);
                });
            } else if (gameState.mode === 'possessive') {
                ['—', '-e', '-en', '-em', '-er', '-es'].forEach(ending => {
                    const btn = document.createElement('button');
                    btn.className = 'article-btn possessive-ending';
                    btn.textContent = ending === '—' ? '(keine Endung)' : ending;
                    btn.onclick = () => selectArticle(ending === '—' ? '' : ending.slice(1));
                    container.appendChild(btn);
                });
            }
        }

        function loadNextSentence() {
            if (gameState.remainingSentences.length === 0) { endGame(); return; }
            gameState.currentSentence = gameState.remainingSentences[0];
            gameState.selectedSlot = null;
            document.getElementById('hintBox').style.display = 'none';
            renderSentence();
            updateProgress();
        }

        function renderSentence() {
            const s = gameState.currentSentence;
            const sentenceDiv = document.getElementById('sentence');
            sentenceDiv.innerHTML = '';

            if (gameState.mode === 'preposition') {
                const [before, prep, noun, after, gender, kasus] = s;
                if (before) { const span = document.createElement('span'); span.className = 'word'; span.textContent = before + ' '; sentenceDiv.appendChild(span); }
                const prepSpan = document.createElement('span'); prepSpan.className = 'word preposition-word'; prepSpan.textContent = prep + ' '; sentenceDiv.appendChild(prepSpan);
                const slot = document.createElement('span'); slot.className = 'article-slot'; slot.id = 'slot-0'; slot.textContent = '___'; slot.onclick = () => { gameState.selectedSlot = 0; slot.classList.add('selected'); playSound('select'); }; sentenceDiv.appendChild(slot);
                const nounSpan = document.createElement('span'); nounSpan.className = 'word'; nounSpan.textContent = ' ' + noun + ' '; sentenceDiv.appendChild(nounSpan);
                if (after) { const afterSpan = document.createElement('span'); afterSpan.className = 'word'; afterSpan.textContent = after; sentenceDiv.appendChild(afterSpan); }
            } else if (gameState.mode === 'possessive') {
                const [before, person, noun, after, gender, kasus] = s;
                const possBase = articles.possessive[person];
                gameState.currentPossBase = { person, gender, kasus };
                if (before) { const span = document.createElement('span'); span.className = 'word'; span.textContent = before + ' '; sentenceDiv.appendChild(span); }
                const baseSpan = document.createElement('span'); baseSpan.className = 'possessive-base'; baseSpan.textContent = possBase; sentenceDiv.appendChild(baseSpan);
                const slot = document.createElement('span'); slot.className = 'article-slot'; slot.id = 'slot-0'; slot.textContent = '___'; slot.onclick = () => { gameState.selectedSlot = 0; slot.classList.add('selected'); playSound('select'); }; sentenceDiv.appendChild(slot);
                const nounSpan = document.createElement('span'); nounSpan.className = 'word'; nounSpan.textContent = ' ' + noun + ' '; sentenceDiv.appendChild(nounSpan);
                if (after) { const afterSpan = document.createElement('span'); afterSpan.className = 'word'; afterSpan.textContent = after; sentenceDiv.appendChild(afterSpan); }
            } else {
                const [before, noun, after, gender, kasus] = s;
                if (before) { const span = document.createElement('span'); span.className = 'word'; span.textContent = before + ' '; sentenceDiv.appendChild(span); }
                const slot = document.createElement('span'); slot.className = 'article-slot'; slot.id = 'slot-0'; slot.textContent = '___'; slot.onclick = () => { gameState.selectedSlot = 0; slot.classList.add('selected'); playSound('select'); }; sentenceDiv.appendChild(slot);
                const nounSpan = document.createElement('span'); nounSpan.className = 'word'; nounSpan.textContent = ' ' + noun + ' '; sentenceDiv.appendChild(nounSpan);
                if (after) { const afterSpan = document.createElement('span'); afterSpan.className = 'word'; afterSpan.textContent = after; sentenceDiv.appendChild(afterSpan); }
            }
        }

        function getCorrectArticle() {
            const s = gameState.currentSentence;
            if (gameState.mode === 'preposition') {
                const [,, noun, , gender, kasus] = s;
                return articles.definite[kasus][gender];
            } else if (gameState.mode === 'possessive') {
                const { person, gender, kasus } = gameState.currentPossBase;
                const endings = { nominativ: { m: '', f: 'e', n: '', pl: 'e' }, akkusativ: { m: 'en', f: 'e', n: '', pl: 'e' }, dativ: { m: 'em', f: 'er', n: 'em', pl: 'en' }, genitiv: { m: 'es', f: 'er', n: 'es', pl: 'er' } };
                const base = articles.possessive[person];
                const ending = endings[kasus][gender];
                if (base === 'euer' && ending !== '') return 'eur' + ending;
                return base + ending;
            } else {
                const [, noun, , gender, kasus] = s;
                const correctFull = articles[gameState.mode][kasus][gender];
                if (gameState.mode === 'possessive') return correctFull;
                if (gameState.mode === 'indefinite' && gender === 'pl') return '';
                return correctFull;
            }
        }

        function getCorrectAnswer() {
            const s = gameState.currentSentence;
            if (gameState.mode === 'preposition') {
                const [,,,, gender, kasus] = s;
                return articles.definite[kasus][gender];
            } else if (gameState.mode === 'possessive') {
                const { person, gender, kasus } = gameState.currentPossBase;
                return getPossessiveForm(person, gender, kasus);
            } else {
                const gender = s[3]; const kasus = s[4];
                if (gameState.mode === 'indefinite' && gender === 'pl') return '';
                return articles[gameState.mode][kasus][gender];
            }
        }

        function selectArticle(art) {
            gameState.totalAttempts++;
            const correct = getCorrectAnswer();
            const slot = document.getElementById('slot-0');
            if (!slot) return;

            if (art === correct) {
                slot.textContent = art || '–';
                slot.classList.remove('selected'); slot.classList.add('correct');
                gameState.correctAnswers++; gameState.streak++;
                if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak;
                const pts = 10 + (gameState.streak > 1 ? Math.min(gameState.streak - 1, 5) * 5 : 0);
                gameState.points += pts;
                showPointsPopup(pts, gameState.streak > 1);
                playSound('correct'); updateStats();
                if ([10, 25, 50, 75, 100].includes(gameState.solvedSentences.length + 1)) { showMilestone(gameState.solvedSentences.length + 1); }
                gameState.solvedSentences.push(gameState.remainingSentences.shift());
                setTimeout(loadNextSentence, 800);
            } else {
                slot.classList.add('wrong');
                gameState.streak = 0; updateStats(); playSound('wrong');
                const hint = document.getElementById('hintBox');
                hint.style.display = 'block';
                document.getElementById('hintText').textContent = `Richtig wäre: "${correct}"`;
                setTimeout(() => { slot.classList.remove('wrong'); slot.classList.remove('selected'); }, 500);
            }
        }

        function skipSentence() {
            gameState.streak = 0; updateStats();
            const s = gameState.remainingSentences.shift();
            gameState.remainingSentences.push(s);
            loadNextSentence();
        }

        function updateStats() {
            document.getElementById('points').textContent = gameState.points;
            const streakEl = document.getElementById('streak');
            streakEl.innerHTML = gameState.streak > 2 ? `<span class="streak-fire">🔥</span>${gameState.streak}` : gameState.streak;
        }

        function updateProgress() {
            const total = gameState.solvedSentences.length + gameState.remainingSentences.length;
            const solved = gameState.solvedSentences.length;
            const pct = total > 0 ? (solved / total) * 100 : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${solved} / ${total} Sätze gelöst`;
        }

        function showPointsPopup(pts, isStreak) {
            const popup = document.createElement('div');
            popup.className = 'points-popup' + (isStreak ? ' streak-bonus' : '');
            popup.textContent = isStreak ? `+${pts} 🔥 Combo!` : `+${pts}`;
            popup.style.left = (Math.random() * 60 + 20) + '%';
            popup.style.top = '40%';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1000);
        }

        function showMilestone(n) {
            const overlay = document.createElement('div');
            overlay.className = 'milestone-overlay';
            overlay.innerHTML = `<div class="milestone-content"><div class="milestone-number">${n}</div><div class="milestone-text">🎉 Wow, ${n} Sätze!</div></div>`;
            document.body.appendChild(overlay);
            playSound('milestone'); createConfetti();
            setTimeout(() => { overlay.remove(); }, 2500);
        }

        function createConfetti() {
            const colors = ['#0a6e62', '#0e9e8e', '#14c9b5', '#f5c842', '#2ed8a0', '#ff6b6b'];
            for (let i = 0; i < 100; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-10px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                c.style.width = (Math.random() * 10 + 5) + 'px';
                c.style.height = c.style.width;
                document.body.appendChild(c);
                const animation = c.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], { duration: Math.random() * 2000 + 2000, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' });
                animation.onfinish = () => c.remove();
            }
        }

        function endGame() {
            clearInterval(gameState.timerInterval);
            const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
            document.getElementById('finalPoints').textContent = gameState.points;
            document.getElementById('finalTime').textContent = `${Math.floor(elapsed / 60)}:${(elapsed % 60).toString().padStart(2, '0')}`;
            document.getElementById('bestStreak').textContent = gameState.bestStreak;
            document.getElementById('accuracy').textContent = gameState.totalAttempts > 0 ? Math.round((gameState.correctAnswers / gameState.totalAttempts) * 100) + '%' : '0%';
            showScreen('resultScreen');
            document.getElementById('backBtn').style.display = 'none';
            updateResultLeaderboard(); playSound('milestone'); createConfetti();
        }

        function loadLeaderboard() {
            const saved = localStorage.getItem('artikelChampionTuerkisLeaderboard');
            return saved ? JSON.parse(saved) : [];
        }

        function saveLeaderboard(board) {
            localStorage.setItem('artikelChampionTuerkisLeaderboard', JSON.stringify(board));
        }

        function saveScore() {
            const name = document.getElementById('playerName').value.trim() || 'Anonym';
            const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
            const modes = { preposition: 'Präpositionen', definite: 'Bestimmte Artikel', indefinite: 'Unbestimmte Artikel', negation: 'Verneinung (kein)', possessive: 'Possessivpronomen' };
            const entry = { name, points: gameState.points, time: elapsed, mode: modes[gameState.mode], date: new Date().toLocaleDateString('de-DE') };
            const board = loadLeaderboard();
            board.push(entry); board.sort((a, b) => b.points - a.points);
            saveLeaderboard(board.slice(0, 10)); updateResultLeaderboard(); updateMenuLeaderboard();
            document.getElementById('playerName').disabled = true;
            event.target.disabled = true; event.target.textContent = '✓ Gespeichert!';
        }

        function formatTime(s) { return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`; }

        function updateMenuLeaderboard() {
            const container = document.getElementById('menuLeaderboard');
            const board = loadLeaderboard();
            if (board.length === 0) { container.innerHTML = '<p style="color:var(--text-muted);text-align:center;">Noch keine Einträge. Sei die Erste!</p>'; return; }
            container.innerHTML = board.slice(0, 5).map((e, i) => `<div class="leaderboard-entry"><span class="leaderboard-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)+'.'}</span><span class="leaderboard-name">${e.name}</span><span class="leaderboard-score">${e.points} Pkt</span><span class="leaderboard-time">${formatTime(e.time)}</span></div>`).join('');
        }

        function updateResultLeaderboard() {
            const container = document.getElementById('resultLeaderboard');
            const board = loadLeaderboard();
            container.innerHTML = `<h3 class="leaderboard-title">🏅 Bestenliste</h3>${board.slice(0, 5).map((e, i) => `<div class="leaderboard-entry"><span class="leaderboard-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)+'.'}</span><span class="leaderboard-name">${e.name}</span><span class="leaderboard-score">${e.points} Pkt</span><span class="leaderboard-time">${formatTime(e.time)}</span></div>`).join('')}`;
        }

        function playAgain() {
            document.getElementById('playerName').disabled = false;
            document.getElementById('playerName').value = '';
            const btn = document.querySelector('#resultScreen .control-btn.primary');
            if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
            startGame(gameState.mode);
        }

        function goToMenu() {
            clearInterval(gameState.timerInterval);
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('playerName').disabled = false;
            document.getElementById('playerName').value = '';
            const btn = document.querySelector('#resultScreen .control-btn.primary');
            if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
            showScreen('startScreen'); updateMenuLeaderboard();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
