<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konnektor Champion 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e0a38;--primary-light:#2e1252;
  --accent:#b07fd4;--accent-glow:#d4a8f0;
  --gold:#f5c842;--gold2:#e8a800;--gold-glow:#ffe080;
  --success:#6dbe5a;--error:#e06060;
  --bg-dark:#130826;--bg-card:#251040;
  --text:#f5eeff;--text-muted:#c8aee8;
  --fl1:#9b6bbf;--fl2:#c49bdf;--fl3:#e8d5f8;
  --card-border:rgba(180,130,220,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Quicksand',sans-serif;background:radial-gradient(ellipse at 30% 0%,#2a0d4a 0%,#130826 45%,#0e051a 100%);min-height:100vh;color:var(--text);overflow-x:hidden}

/* ── BG PARTICLES ── */
.bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.ripple{position:absolute;border-radius:50%;border:1px solid rgba(180,130,220,.14);animation:rOut 10s ease-out infinite}
@keyframes rOut{0%{transform:scale(.2);opacity:.7}100%{transform:scale(3);opacity:0}}
.shimmer{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(212,168,240,.4),rgba(245,200,66,.3),transparent);animation:sFlow 8s ease-in-out infinite;opacity:0}
@keyframes sFlow{0%{width:0;left:-5%;opacity:0}20%{opacity:1}80%{opacity:1}100%{width:120%;left:100%;opacity:0}}
.star{position:absolute;border-radius:50%;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.85;transform:scale(1.7)}}

/* ── LAYOUT ── */
.container{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px}
header{text-align:center;margin-bottom:28px;padding-top:12px}
h1{font-family:'Fredoka',sans-serif;font-size:2.6rem;background:linear-gradient(135deg,#c49bdf,#f5c842,#e8d5f8,#c49bdf);background-size:220% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tShimmer 5s linear infinite;margin-bottom:8px;letter-spacing:.5px}
@keyframes tShimmer{to{background-position:220% center}}
.subtitle{color:var(--text-muted);font-size:.98rem}

.screen{display:none;animation:fadeIn .4s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── MAIN TABS ── */
.main-tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.main-tab{flex:1;min-width:140px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border:1.5px solid rgba(180,130,220,.25);border-radius:14px;padding:14px 18px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .25s;text-align:center}
.main-tab:hover,.main-tab.active{background:linear-gradient(135deg,#5a2a8a,var(--accent));border-color:var(--accent-glow);box-shadow:0 4px 22px rgba(176,127,212,.4),0 0 0 1px rgba(245,200,66,.15)}

/* ── CARDS ── */
.card{background:linear-gradient(135deg,rgba(37,16,64,.96),rgba(20,8,42,.98));border-radius:20px;padding:26px;margin-bottom:18px;border:1px solid var(--card-border);box-shadow:0 6px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:14px}
.s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1.15rem;color:var(--text-muted);pointer-events:none}
#searchInput{width:100%;padding:13px 42px;font-size:1.03rem;font-family:'Quicksand',sans-serif;background:rgba(30,10,56,.9);border:2px solid rgba(180,130,220,.28);border-radius:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
#searchInput:focus{border-color:var(--accent-glow);box-shadow:0 0 18px rgba(180,130,220,.22)}
#searchInput::placeholder{color:var(--text-muted)}
.clear-x{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;display:none;padding:4px}
.clear-x:hover{color:var(--gold)}

/* ── FILTER CHIPS ── */
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fchip{padding:4px 13px;border-radius:20px;border:1px solid rgba(180,130,220,.22);background:var(--primary);color:var(--text-muted);font-family:'Quicksand',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s}
.fchip:hover{border-color:var(--gold);color:var(--gold)}
.fchip.active{background:linear-gradient(135deg,#5a2a8a,var(--accent));border-color:var(--gold);color:#fff;box-shadow:0 2px 10px rgba(180,130,220,.3)}

.results-meta{font-size:.83rem;color:var(--text-muted);margin-bottom:10px}
.results-meta strong{color:var(--gold)}

/* ── KONNEKTOR KARTEN ── */
.kcard{background:linear-gradient(135deg,rgba(37,16,64,.9),rgba(20,8,42,.95));border-radius:15px;margin-bottom:10px;border:1px solid rgba(180,130,220,.16);overflow:hidden;animation:fadeIn .18s ease}
.kcard-header{display:flex;align-items:flex-start;gap:10px;padding:13px 15px 11px;cursor:pointer;transition:background .12s;user-select:none}
.kcard-header:hover{background:rgba(180,130,220,.07)}
.kcard.open .kcard-header{border-bottom:1px solid rgba(180,130,220,.14)}
.kword{font-family:'Fredoka',sans-serif;font-size:1.22rem;color:var(--accent-glow);line-height:1.2}
.kword mark{background:rgba(245,200,66,.28);color:#fff;border-radius:3px;padding:0 3px}
.kbadges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:700}
.b-kat{background:rgba(180,130,220,.2);color:var(--accent-glow);border:1px solid rgba(180,130,220,.3)}
.b-ns{background:rgba(109,190,90,.14);color:#9ee07a;border:1px solid rgba(109,190,90,.25)}
.b-adv{background:rgba(245,200,66,.14);color:#f5d060;border:1px solid rgba(245,200,66,.28)}
.b-hs{background:rgba(100,160,240,.15);color:#9bbff5;border:1px solid rgba(100,160,240,.25)}
.b-praep{background:rgba(220,160,240,.15);color:#e8b8f8;border:1px solid rgba(220,160,240,.28)}
.b-doppel{background:rgba(245,200,66,.18);color:#f0c840;border:1px solid rgba(245,200,66,.3)}
.b-inf{background:rgba(240,110,110,.15);color:#f09090;border:1px solid rgba(240,110,110,.22)}
.chevron{font-size:.9rem;color:var(--text-muted);transition:transform .22s;flex-shrink:0;margin-top:4px;margin-left:auto}
.kcard.open .chevron{transform:rotate(180deg);color:var(--gold)}
.kbody{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .2s}
.kcard.open .kbody{max-height:900px;padding:13px 15px}
.kbs-label{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:4px;margin-top:10px}
.kbs-label:first-child{margin-top:0}
.kbs-content{font-size:.88rem;color:var(--text);line-height:1.55}
.ex-list .ex{background:rgba(20,8,42,.8);border-left:3px solid var(--fl1);border-radius:0 8px 8px 0;padding:7px 12px;margin-bottom:5px;font-size:.84rem;line-height:1.6}
.ex .arr{display:block;margin-left:10px;color:var(--text-muted)}
.tip{background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.28);border-radius:10px;padding:8px 13px;font-size:.81rem;color:var(--text);margin-top:8px;line-height:1.5}
.tip::before{content:"💡 "}
.empty-state{text-align:center;padding:2.5rem;color:var(--text-muted);font-size:.93rem}

/* ── ÜBUNGSMENÜ ── */
.umode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:4px}
.umode-btn{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:1.5px solid rgba(180,130,220,.22);border-radius:16px;padding:18px 20px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;transition:all .25s;text-align:left;position:relative;overflow:hidden}
.umode-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--fl1),var(--gold));opacity:0;transition:opacity .2s}
.umode-btn:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(180,130,220,.35);border-color:var(--gold)}
.umode-btn:hover::after{opacity:1}
.umode-icon{font-size:1.55rem;margin-bottom:8px;display:block}
.umode-desc{font-size:.76rem;color:var(--text-muted);margin-top:4px;font-weight:500}
.umode-count{position:absolute;top:12px;right:14px;background:rgba(245,200,66,.2);border:1px solid rgba(245,200,66,.35);border-radius:20px;padding:2px 9px;font-size:.7rem;color:var(--gold);font-weight:700}

/* ── QUIZ ── */
.qhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.qstat{background:rgba(30,10,56,.85);padding:8px 15px;border-radius:12px;border:1px solid rgba(180,130,220,.18);text-align:center;min-width:78px}
.qstat-l{font-size:.66rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.qstat-v{font-family:'Fredoka',sans-serif;font-size:1.3rem;color:var(--gold)}
.prog-bar{background:rgba(30,10,56,.7);border-radius:10px;height:13px;overflow:hidden;margin-bottom:18px;border:1px solid rgba(180,130,220,.16)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--fl1),var(--gold));transition:width .5s ease;box-shadow:0 0 10px rgba(245,200,66,.3)}
.q-box{background:linear-gradient(135deg,rgba(37,16,64,.97),rgba(15,6,32,.99));border-radius:18px;padding:30px 24px;margin-bottom:20px;border:1px solid rgba(180,130,220,.2);text-align:center}
.q-type-badge{display:inline-block;background:linear-gradient(135deg,#5a2a8a,var(--accent));color:#f5eeff;padding:5px 14px;border-radius:20px;font-size:.76rem;font-weight:700;margin-bottom:14px;border:1px solid rgba(245,200,66,.2)}
.q-text{font-family:'Fredoka',sans-serif;font-size:1.45rem;line-height:1.75;margin-bottom:6px;color:var(--text)}
.q-text .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--gold);color:var(--gold-glow);font-weight:700;padding:0 5px;margin:0 3px}
.q-hint{font-size:.82rem;color:var(--text-muted);margin-top:5px;font-style:italic}
.feedback-box{display:none;border-radius:11px;padding:11px 17px;margin-top:14px;font-size:.9rem;line-height:1.5}
.feedback-box.correct{background:rgba(109,190,90,.13);border:1px solid rgba(109,190,90,.32);color:#9ee07a}
.feedback-box.wrong{background:rgba(224,96,96,.13);border:1px solid rgba(224,96,96,.3);color:#f0a0a0}
.ans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.ans-btn{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(180,130,220,.2);border-radius:13px;padding:12px 15px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:.93rem;font-weight:700;cursor:pointer;transition:all .2s;line-height:1.3}
.ans-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 5px 18px rgba(180,130,220,.3);border-color:var(--gold);color:var(--gold)}
.ans-btn:disabled{opacity:.42;cursor:not-allowed}
.ans-btn.correct-ans{background:rgba(109,190,90,.2);border-color:var(--success);color:#9ee07a}
.ans-btn.wrong-ans{background:rgba(224,96,96,.2);border-color:var(--error);color:#f0a0a0}
.ctrl-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctrl-btn{background:linear-gradient(135deg,var(--primary),var(--primary-light));border:2px solid rgba(180,130,220,.25);border-radius:13px;padding:10px 22px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s}
.ctrl-btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(180,130,220,.25);border-color:var(--gold)}
.ctrl-btn.primary{background:linear-gradient(135deg,#5a2a8a,var(--accent));border-color:var(--gold);color:#f5eeff}
.ctrl-btn.primary:hover{box-shadow:0 6px 24px rgba(180,130,220,.45)}

/* ── RESULT ── */
.result-big{font-family:'Fredoka',sans-serif;font-size:1.9rem;margin-bottom:18px;background:linear-gradient(135deg,var(--accent-glow),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px;margin-bottom:22px}
.r-stat{background:rgba(20,8,42,.7);padding:15px;border-radius:14px;border:1px solid rgba(180,130,220,.16)}
.r-stat-l{font-size:.73rem;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
.r-stat-v{font-family:'Fredoka',sans-serif;font-size:1.85rem;color:var(--gold)}

/* ── BACK BTN ── */
.back-btn{position:fixed;top:16px;left:16px;z-index:100;display:none;background:rgba(37,16,64,.95);border:1px solid rgba(180,130,220,.3);border-radius:12px;padding:8px 16px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── POPUP ── */
.pts-popup{position:fixed;font-family:'Fredoka',sans-serif;font-size:1.8rem;font-weight:700;color:var(--gold);pointer-events:none;z-index:1000;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.5)}
@keyframes floatUp{0%{transform:translateY(0) scale(.8);opacity:1}100%{transform:translateY(-85px) scale(1.2);opacity:0}}
.cp{position:fixed;pointer-events:none;z-index:3000}

@media(max-width:600px){h1{font-size:1.9rem}.q-text{font-size:1.2rem}.ans-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<button class="back-btn" id="backBtn" onclick="backToUeb()">← Zurück</button>

<div class="container">
  <header>
    <h1>💜 Konnektor Champion</h1>
    <p class="subtitle">Alle deutschen Konnektoren — Lexikon, Grammatik &amp; interaktive Übungen</p>
  </header>

  <div class="main-tabs">
    <button class="main-tab active" onclick="showTab('lex',this)">📚 Konnektor-Lexikon</button>
    <button class="main-tab" onclick="showTab('ueb',this)">🎯 Übungen &amp; Quiz</button>
  </div>

  <!-- LEXIKON -->
  <div id="tabLex" class="screen active">
    <div class="card">
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Konnektor suchen … weil, trotzdem, sowohl, indem, je … desto …" autocomplete="off">
        <button class="clear-x" id="clearX" onclick="clearSrch()">✕</button>
      </div>
      <div class="filter-row" id="filterRow"></div>
      <div class="results-meta" id="resMeta"></div>
      <div id="lexRes"></div>
    </div>
  </div>

  <!-- ÜBUNGEN -->
  <div id="tabUeb" class="screen">
    <div id="uebMenu">
      <div class="card">
        <h2 style="font-family:'Fredoka',sans-serif;font-size:1.35rem;color:var(--accent-glow);margin-bottom:18px">🎯 Übungsmodus wählen</h2>
        <div class="umode-grid">
          <button class="umode-btn" onclick="startQuiz('luecke')">
            <span class="umode-count">50 Fragen</span>
            <span class="umode-icon">✏️</span>
            Lückentext
            <div class="umode-desc">Setze den richtigen Konnektor in den Satz ein</div>
          </button>
          <button class="umode-btn" onclick="startQuiz('bedeutung')">
            <span class="umode-count">40 Fragen</span>
            <span class="umode-icon">🧠</span>
            Bedeutung erkennen
            <div class="umode-desc">Welche Funktion hat dieser Konnektor?</div>
          </button>
          <button class="umode-btn" onclick="startQuiz('wortstellung')">
            <span class="umode-count">30 Fragen</span>
            <span class="umode-icon">🔀</span>
            Wortstellung
            <div class="umode-desc">Welche Wortstellung folgt nach diesem Konnektor?</div>
          </button>
          <button class="umode-btn" onclick="startQuiz('doppel')">
            <span class="umode-count">40 Fragen</span>
            <span class="umode-icon">🔗</span>
            Doppelkonnektoren
            <div class="umode-desc">Ergänze den zweiten Teil des Doppelkonnektors</div>
          </button>
          <button class="umode-btn" onclick="startQuiz('umformung')">
            <span class="umode-count">40 Fragen</span>
            <span class="umode-icon">🔄</span>
            Umformung
            <div class="umode-desc">Forme den Satz mit dem angegebenen Konnektor um</div>
          </button>
        </div>
      </div>
    </div>

    <div id="quizScreen" style="display:none">
      <div class="card">
        <div class="qhdr">
          <div style="font-family:'Fredoka',sans-serif;font-size:1.05rem;color:var(--accent-glow)" id="qModeLabel">Quiz</div>
          <div style="display:flex;gap:10px">
            <div class="qstat"><div class="qstat-l">Punkte</div><div class="qstat-v" id="qPts">0</div></div>
            <div class="qstat"><div class="qstat-l">Richtig</div><div class="qstat-v" id="qRight">0</div></div>
            <div class="qstat"><div class="qstat-l">Frage</div><div class="qstat-v" id="qNum">1</div></div>
          </div>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="qProg" style="width:0%"></div></div>
        <div class="q-box">
          <div class="q-type-badge" id="qBadge">Lückentext</div>
          <div class="q-text" id="qText"></div>
          <div class="q-hint" id="qHint"></div>
          <div class="feedback-box" id="qFeedback"></div>
        </div>
        <div class="ans-grid" id="ansGrid"></div>
        <div class="ctrl-btns">
          <button class="ctrl-btn" id="skipBtn" onclick="nextQ()">⏭ Überspringen</button>
          <button class="ctrl-btn primary" id="nextBtn" onclick="nextQ()" style="display:none">Weiter ➜</button>
          <button class="ctrl-btn" onclick="endQuiz()">🏁 Beenden</button>
        </div>
      </div>
    </div>

    <div id="resultScreen" style="display:none">
      <div class="card" style="text-align:center">
        <div class="result-big" id="rEmoji">🎉 Ergebnis</div>
        <div class="result-grid">
          <div class="r-stat"><div class="r-stat-l">Punkte</div><div class="r-stat-v" id="rPts">0</div></div>
          <div class="r-stat"><div class="r-stat-l">Richtig</div><div class="r-stat-v" id="rRight">0</div></div>
          <div class="r-stat"><div class="r-stat-l">Falsch</div><div class="r-stat-v" id="rWrong">0</div></div>
          <div class="r-stat"><div class="r-stat-l">Genauigkeit</div><div class="r-stat-v" id="rAcc">0%</div></div>
        </div>
        <div class="ctrl-btns">
          <button class="ctrl-btn primary" onclick="restartQuiz()">🔄 Nochmal</button>
          <button class="ctrl-btn" onclick="backToUeb()">📚 Zurück</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  LEXIKON-DATENBANK
// ═══════════════════════════════════════════════════════════════
const DB = [
  // ADDITIV
  {w:"und",kat:"additiv",funk:["Konjunktion"],bed:"Aufzählung / Verbindung",ws:"Kein Einfluss auf Wortstellung",bsp:["Ich lerne Deutsch und sie lernt Englisch.","Er ist groß und sie ist klein."],tip:"Kein Komma vor 'und' bei einfacher Verbindung zweier Hauptsätze!"},
  {w:"auch",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung",ws:"Position 1 oder 3",bsp:["Er lernt viel. Auch sie arbeitet fleißig.","Sie arbeitet auch fleißig."]},
  {w:"außerdem",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung / dazu kommt",ws:"Position 1 oder 3",bsp:["Sie ist klug. Außerdem ist sie sehr fleißig.","Ich koche gerne. Außerdem backe ich auch."]},
  {w:"zudem",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (formal)",ws:"Position 1",bsp:["Das Projekt ist teuer. Zudem dauert es lange."],tip:"Formeller als 'außerdem', typisch in Fach- und Wissenschaftstexten."},
  {w:"darüber hinaus",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (betont)",ws:"Position 1",bsp:["Sie spricht Englisch. Darüber hinaus beherrscht sie Spanisch."]},
  {w:"überdies",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (gehoben)",ws:"Position 1",bsp:["Er ist talentiert. Überdies arbeitet er sehr hart."],tip:"Sehr formell / literarisch."},
  {w:"des Weiteren",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (schriftlich)",ws:"Position 1",bsp:["Das Konzept ist innovativ. Des Weiteren ist es kostengünstig."]},
  {w:"ferner",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (schriftlich)",ws:"Position 1",bsp:["Wir bitten um Ihre Unterlagen. Ferner benötigen wir Ihre Zeugnisse."]},
  {w:"dazu",kat:"additiv",funk:["Satzverbindendes Adverb","Finales Adverb"],bed:"Hinzufügung / Zweck",ws:"Position 1 oder 3",bsp:["Er lernt täglich. Dazu macht er Vokabelkarten."],tip:"Kann additiv ('außerdem') oder final ('zu diesem Zweck') sein!"},
  {w:"nicht nur … sondern auch",kat:"additiv",funk:["Doppelkonnektor"],bed:"Steigerung: A und besonders B",ws:"nicht nur (Pos. 3/Verbpos.) + sondern auch (Pos.0 + Verb-Zweit)",bsp:["Er ist nicht nur intelligent, sondern auch fleißig.","Nicht nur die Kinder, sondern auch die Erwachsenen haben gelacht."],tip:"'Sondern auch' leitet Hauptsatz ein. Kein Verb ans Ende!"},
  {w:"sowohl … als auch",kat:"additiv",funk:["Doppelkonnektor"],bed:"Beides trifft zu",ws:"Kein Einfluss auf Wortstellung",bsp:["Sowohl Maria als auch Peter kommen zur Party.","Er ist sowohl sportlich als auch musikalisch."],tip:"Kein Komma zwischen sowohl…als auch! Verb richtet sich nach dem Gesamtsubjekt."},
  {w:"einerseits … andererseits",kat:"additiv",funk:["Doppelkonnektor"],bed:"Zwei Aspekte gegenüberstellen",ws:"Pos. 1 im 1. HS + Pos. 1 im 2. HS",bsp:["Einerseits ist das Angebot günstig, andererseits ist die Qualität schlecht."],tip:"Beide Teile nötig! Zweiter Teil kann auch 'zum anderen' sein."},
  // ADVERSATIV
  {w:"aber",kat:"adversativ",funk:["Konjunktion (Pos. 0)"],bed:"Gegensatz / Einschränkung",ws:"Position 0 — Wortstellung unverändert!",bsp:["Er ist fleißig, aber er ist nicht erfolgreich.","Das ist teuer, aber es lohnt sich."],tip:"'Aber' steht auf Position 0 — es beeinflusst die Wortstellung NICHT!"},
  {w:"jedoch",kat:"adversativ",funk:["Konjunktion (Pos.0)","Satzverbindendes Adverb"],bed:"Gegensatz (formal)",ws:"Pos. 0 oder Pos. 1/3",bsp:["Er lernte viel, jedoch bestand er nicht.","Er lernte viel. Jedoch bestand er nicht."],tip:"Kann wie 'aber' (Pos.0) oder wie 'trotzdem' (Pos.1) verwendet werden."},
  {w:"doch",kat:"adversativ",funk:["Konjunktion (Pos.0)"],bed:"Gegensatz (umgangssprachlich)",ws:"Position 0",bsp:["Sie wollte kommen, doch sie wurde krank."]},
  {w:"sondern",kat:"adversativ",funk:["Konjunktion (Pos.0)"],bed:"Richtigstellung nach Verneinung",ws:"Position 0",bsp:["Das ist kein Fehler, sondern eine Absicht.","Nicht er, sondern sie hat das gemacht."],tip:"NUR nach Verneinung (nicht / kein) möglich! Nicht verwechseln mit 'aber'!"},
  {w:"dagegen",kat:"adversativ",funk:["Satzverbindendes Adverb"],bed:"Gegensatz / Kontrast",ws:"Position 1 oder 3",bsp:["Er mag Kaffee. Sie dagegen trinkt nur Tee."]},
  {w:"hingegen",kat:"adversativ",funk:["Satzverbindendes Adverb"],bed:"Gegensatz (formal)",ws:"Position 1 oder 3",bsp:["Deutschland ist kalt. Spanien hingegen ist warm."]},
  {w:"demgegenüber",kat:"adversativ",funk:["Satzverbindendes Adverb"],bed:"Gegenüberstellung (formal)",ws:"Position 1",bsp:["Die Preise steigen. Demgegenüber sinken die Löhne."]},
  {w:"wohingegen",kat:"adversativ",funk:["Nebensatzkonnektor"],bed:"Gegensatz",ws:"Verb ans Ende",bsp:["Er ist sportlich, wohingegen sein Bruder lieber liest."]},
  {w:"während",kat:"adversativ",funk:["Nebensatzkonnektor","Präposition (+ Gen.)"],bed:"Gegensatz ODER Gleichzeitigkeit (temporal!)",ws:"Verb ans Ende",bsp:["Er ist ruhig, während sie sehr lebhaft ist.","Während ich koche, hört er Musik."],tip:"ACHTUNG: 'während' kann temporal (gleichzeitig) ODER adversativ (Gegensatz) bedeuten!"},
  {w:"weder … noch",kat:"adversativ",funk:["Doppelkonnektor"],bed:"Weder das eine noch das andere",ws:"Verb an Pos.2 im zweiten Teil",bsp:["Er mag weder Kaffee noch Tee.","Weder sie noch er hat die Wahrheit gesagt."],tip:"Kein Komma zwischen weder…noch!"},
  {w:"entweder … oder",kat:"adversativ",funk:["Doppelkonnektor"],bed:"Das eine oder das andere (nicht beides)",ws:"Verb an Pos.2 im zweiten Teil",bsp:["Entweder kommst du mit, oder du bleibst hier."],tip:"Nach 'oder' in Hauptsätzen: Verb-Zweit-Stellung! Kein Komma."},
  {w:"zwar … aber",kat:"adversativ",funk:["Doppelkonnektor"],bed:"Einräumung mit Einschränkung",ws:"'zwar' Pos.1 oder 3; 'aber' Pos.0",bsp:["Das ist zwar teuer, aber es lohnt sich.","Er ist zwar müde, aber er arbeitet weiter."],tip:"'Zwar' auf Pos.1 oder 3; 'aber' leitet Hauptsatz auf Pos.0 ein."},
  // KAUSAL
  {w:"weil",kat:"kausal",funk:["Nebensatzkonnektor"],bed:"Grund (unbekannte / neue Information)",ws:"Verb ans Ende",bsp:["Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.","Weil es regnet, bleiben wir zu Hause."],tip:"'Weil' = aktuelle, unbekannte Begründung. Verb IMMER ans Ende!"},
  {w:"da",kat:"kausal",funk:["Nebensatzkonnektor"],bed:"Grund (bekannte / geteilte Information)",ws:"Verb ans Ende",bsp:["Da es regnet, nehmen wir den Schirm mit.","Da sie krank ist, kommt sie nicht."],tip:"'Da' = bekannte, geteilte Information; steht meist am Satzanfang. Formeller als 'weil'."},
  {w:"denn",kat:"kausal",funk:["Konjunktion (Pos.0)"],bed:"Begründung im Hauptsatz",ws:"Position 0 — KEIN Einfluss auf Wortstellung!",bsp:["Ich nehme den Schirm, denn es regnet.","Wir bleiben zu Hause, denn das Wetter ist schlecht."],tip:"'Denn' verändert die Wortstellung NICHT — es leitet einen normalen Hauptsatz ein!"},
  {w:"nämlich",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Begründung / Erklärung (nachgestellt)",ws:"NIEMALS Pos.1! Immer Pos.3 (hinter Subj.+Verb)",bsp:["Er kommt nicht. Er ist nämlich krank.","Sie lernt viel. Sie will nämlich die Prüfung bestehen."],tip:"WICHTIG: 'nämlich' steht NIEMALS auf Position 1! Immer nach Subjekt und Verb!"},
  {w:"deshalb",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Folge / Konsequenz",ws:"Position 1 oder 3",bsp:["Es regnet. Deshalb bleiben wir zu Hause.","Wir bleiben deshalb zu Hause."]},
  {w:"deswegen",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Folge / Konsequenz",ws:"Position 1 oder 3",bsp:["Sie ist krank. Deswegen kommt sie nicht."]},
  {w:"daher",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Folge / Konsequenz",ws:"Position 1 oder 3",bsp:["Er hat viel geübt. Daher ist er so gut."]},
  {w:"darum",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Folge / Konsequenz",ws:"Position 1 oder 3",bsp:["Ich mag Musik. Darum höre ich jeden Tag Radio."]},

  {w:"demnach",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Schlussfolgerung / laut dem",ws:"Position 1",bsp:["Der Bericht zeigt Probleme. Demnach müssen wir handeln."]},

  {w:"also",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Schlussfolgerung",ws:"Position 1 oder 3",bsp:["Sie ist müde. Also geht sie früh schlafen."]},

  {w:"weshalb",kat:"kausal",funk:["Nebensatzkonnektor"],bed:"Folge (= sodass)",ws:"Verb ans Ende",bsp:["Er kam zu spät, weshalb wir ohne ihn anfingen."]},

  {w:"obgleich",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Gegenargument (formal)",ws:"Verb ans Ende",bsp:["Obgleich er müde war, arbeitete er weiter."]},
  {w:"obschon",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Gegenargument (gehoben/literarisch)",ws:"Verb ans Ende",bsp:["Obschon er reich war, lebte er bescheiden."],tip:"Veraltet / literarisch. Gleiche Bedeutung wie 'obwohl'."},
  {w:"wenngleich",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Gegenargument (formal)",ws:"Verb ans Ende",bsp:["Wenngleich das Projekt teuer ist, lohnt es sich."]},

const MODE_LABELS = {luecke:"✏️ Lückentext",bedeutung:"🧠 Bedeutung",wortstellung:"🔀 Wortstellung",doppel:"🔗 Doppelkonnektoren",umformung:"🔄 Umformung"};
let qState = {mode:null,qs:[],idx:0,pts:0,right:0,wrong:0,done:false};

function startQuiz(mode) {
  const pool = POOLS[mode];
  const shuffled = [...pool].sort(()=>Math.random()-.5);
  qState = {mode,qs:shuffled,idx:0,pts:0,right:0,wrong:0,done:false};
  document.getElementById('qModeLabel').textContent = MODE_LABELS[mode];
  document.getElementById('uebMenu').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  document.getElementById('backBtn').style.display='block';
  loadQ();
}

function loadQ() {
  const total=qState.qs.length, i=qState.idx;
  if(i>=total){endQuiz();return;}
  const q=qState.qs[i];
  qState.done=false;
  document.getElementById('qNum').textContent=`${i+1}/${total}`;
  document.getElementById('qPts').textContent=qState.pts;
  document.getElementById('qRight').textContent=qState.right;
  document.getElementById('qProg').style.width=((i/total)*100)+'%';
  document.getElementById('qBadge').textContent=MODE_LABELS[qState.mode];
  document.getElementById('qText').innerHTML=q.q.replace(/___/g,'<span class="blank">___</span>');
  document.getElementById('qHint').textContent=q.hint||'';
  const fb=document.getElementById('qFeedback');
  fb.style.display='none'; fb.className='feedback-box';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('skipBtn').style.display='block';
  const grid=document.getElementById('ansGrid');
  grid.innerHTML='';
  [...q.opts].sort(()=>Math.random()-.5).forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='ans-btn'; btn.textContent=opt;
    btn.onclick=()=>checkAns(btn,opt,q.a);
    grid.appendChild(btn);
  });
}

function checkAns(btn, chosen, correct) {
  if(qState.done)return;
  qState.done=true;
  document.querySelectorAll('.ans-btn').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct-ans');});
  const fb=document.getElementById('qFeedback');
  if(chosen===correct){
    btn.classList.add('correct-ans');
    qState.right++; qState.pts+=10;
    fb.className='feedback-box correct';
    fb.textContent='✓ Richtig! '+correct;
    showPop('+10 💜');
  } else {
    btn.classList.add('wrong-ans');
    qState.wrong++;
    fb.className='feedback-box wrong';
    fb.textContent='✗ Falsch. Richtig wäre: '+correct;
  }
  fb.style.display='block';
  document.getElementById('qPts').textContent=qState.pts;
  document.getElementById('qRight').textContent=qState.right;
  document.getElementById('skipBtn').style.display='none';
  document.getElementById('nextBtn').style.display='block';
}

function nextQ(){qState.idx++;loadQ();}

function endQuiz(){
  document.getElementById('quizScreen').style.display='none';
  document.getElementById('resultScreen').style.display='block';
  const total=qState.right+qState.wrong;
  const pct=total>0?Math.round(qState.right/total*100):0;
  let msg='📚 Weiter lernen!';
  if(pct>=90)msg='🏆 Ausgezeichnet!';
  else if(pct>=75)msg='💜 Sehr gut!';
  else if(pct>=55)msg='🌿 Gut gemacht!';
  document.getElementById('rEmoji').textContent=msg;
  document.getElementById('rPts').textContent=qState.pts;
  document.getElementById('rRight').textContent=qState.right;
  document.getElementById('rWrong').textContent=qState.wrong;
  document.getElementById('rAcc').textContent=pct+'%';
  if(pct>=70)confetti();
}

function restartQuiz(){document.getElementById('resultScreen').style.display='none';startQuiz(qState.mode);}
function backToUeb(){
  document.getElementById('quizScreen').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('uebMenu').style.display='block';
  document.getElementById('backBtn').style.display='none';
}

function showPop(txt){
  const p=document.createElement('div');p.className='pts-popup';p.textContent=txt;
  p.style.left=(Math.random()*60+20)+'%';p.style.top='45%';
  document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
}
function confetti(){
  const cols=['#c49bdf','#f5c842','#9b6bbf','#e8d5f8','#6dbe5a','#f5a0d0'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');c.className='cp';
    c.style.left=Math.random()*100+'vw';c.style.top='-10px';
    c.style.background=cols[Math.floor(Math.random()*cols.length)];
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    const sz=(Math.random()*9+5)+'px';c.style.width=c.style.height=sz;
    document.body.appendChild(c);
    const a=c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(100vh) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:Math.random()*2000+2200,easing:'ease-out'});
    a.onfinish=()=>c.remove();
  }
}

// ═══════════════════════════════════════════════════════════════
//  LEXIKON
// ═══════════════════════════════════════════════════════════════
let aktKat=null, openK=new Set();

function showTab(tab,btn){
  document.querySelectorAll('.main-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['tabLex','tabUeb'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(tab==='lex'?'tabLex':'tabUeb').classList.add('active');
  if(tab==='lex')renderLex();
}

function buildFilters(){
  const row=document.getElementById('filterRow');
  const all=makeChip('Alle',true,()=>{aktKat=null;renderLex();updChips(all);});
  row.appendChild(all);
  KATEGORIEN.forEach(k=>{
    const b=makeChip(KL[k]||k,false,()=>{aktKat=k;renderLex();updChips(b);});
    row.appendChild(b);
  });
}
function makeChip(lbl,active,fn){const b=document.createElement('button');b.className='fchip'+(active?' active':'');b.textContent=lbl;b.onclick=fn;return b;}
function updChips(a){document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('active'));a.classList.add('active');}

function hl(t,q){if(!q)return t;return t.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),'<mark>$1</mark>');}

function renderLex(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('clearX').style.display=q?'block':'none';
  let res=DB.filter(k=>{
    const ko=!aktKat||k.kat===aktKat;
    if(!q)return ko;
    return ko&&(k.w.toLowerCase().includes(q)||k.bed.toLowerCase().includes(q)||(k.funk||[]).some(f=>f.toLowerCase().includes(q))||(k.bsp||[]).some(b=>b.toLowerCase().includes(q)));
  });
  const meta=document.getElementById('resMeta');
  const cont=document.getElementById('lexRes');
  if(q||aktKat){meta.innerHTML=`<strong>${res.length}</strong> Eintr${res.length===1?'ag':'äge'}${q?` für „<strong>${q}</strong>"`:''}${aktKat?` — Kategorie <strong>${KL[aktKat]}</strong>`:''}`;}
  else{meta.innerHTML=`<strong>${DB.length}</strong> Konnektoren — tippe einen Begriff oder wähle eine Kategorie`;}
  if(!q&&!aktKat){cont.innerHTML=`<div class="empty-state">🔍 Suche starten oder Kategorie wählen …</div>`;return;}
  if(!res.length){cont.innerHTML=`<div class="empty-state">Nichts gefunden — versuche andere Schreibweise</div>`;return;}
  cont.innerHTML=res.map(k=>buildCard(k,q)).join('');
}

function buildCard(k,q){
  const id='k_'+k.w.replace(/[^a-z]/gi,'_');
  const isOpen=openK.has(id);
  const funkB=(k.funk||[]).map(f=>{
    let c='b-ns';
    if(f.includes('Adverb'))c='b-adv';
    else if(f.includes('Pos.0')||f.includes('Hauptsatz'))c='b-hs';
    else if(f.includes('Präp'))c='b-praep';
    else if(f.includes('Doppel'))c='b-doppel';
    else if(f.includes('Inf'))c='b-inf';
    return `<span class="badge ${c}">${f}</span>`;
  }).join('');
  const katB=`<span class="badge b-kat">${KL[k.kat]||k.kat}</span>`;
  const exH=(k.bsp||[]).map(b=>{
    const p=b.split('→');
    return `<div class="ex">${p.map((x,i)=>i===0?x.trim():`<span class="arr">→ ${x.trim()}</span>`).join('')}</div>`;
  }).join('');
  const tipH=k.tip?`<div class="tip">${k.tip}</div>`:'';
  const wsH=k.ws?`<div><div class="kbs-label">Wortstellung</div><div class="kbs-content">${k.ws}</div></div>`:'';
  return `<div class="kcard${isOpen?' open':''}" id="${id}">
    <div class="kcard-header" onclick="toggleK('${id}')">
      <div style="flex:1">
        <div class="kword">${hl(k.w,q)}</div>
        <div class="kbadges" style="margin-top:5px">${katB}${funkB}</div>
        <div style="font-size:.78rem;color:var(--text-muted);margin-top:4px">${k.bed}</div>
      </div>
      <span class="chevron">▼</span>
    </div>
    <div class="kbody">
      ${wsH}
      <div><div class="kbs-label">Beispiele</div><div class="ex-list">${exH}</div></div>
      ${tipH}
    </div>
  </div>`;
}

function toggleK(id){
  if(openK.has(id))openK.delete(id);else openK.add(id);
  const el=document.getElementById(id);if(el)el.classList.toggle('open',openK.has(id));
}
function clearSrch(){document.getElementById('searchInput').value='';document.getElementById('clearX').style.display='none';renderLex();}

// ═══════════════════════════════════════════════════════════════
//  BG + INIT
// ═══════════════════════════════════════════════════════════════
function buildBG(){
  const c=document.getElementById('bg');
  const flCols=['rgba(155,107,191,.6)','rgba(196,155,223,.5)','rgba(245,200,66,.5)','rgba(232,213,248,.4)'];
  for(let i=0;i<10;i++){
    const r=document.createElement('div');r.className='ripple';
    r.style.width=r.style.height=(Math.random()*320+180)+'px';
    r.style.left=Math.random()*100+'%';r.style.top=Math.random()*100+'%';
    r.style.animationDelay=(Math.random()*9)+'s';
    r.style.borderColor=flCols[Math.floor(Math.random()*flCols.length)];
    c.appendChild(r);
  }
  for(let i=0;i<5;i++){
    const s=document.createElement('div');s.className='shimmer';
    s.style.top=(Math.random()*100)+'%';
    s.style.animationDelay=(i*1.9)+'s';s.style.animationDuration=(Math.random()*4+7)+'s';
    c.appendChild(s);
  }
  const stCols=['rgba(155,107,191,.7)','rgba(245,200,66,.7)','rgba(196,155,223,.6)','rgba(232,213,248,.5)'];
  for(let i=0;i<30;i++){
    const st=document.createElement('div');st.className='star';
    const sz=(Math.random()*4+3)+'px';
    st.style.width=st.style.height=sz;
    st.style.left=Math.random()*100+'%';st.style.top=Math.random()*100+'%';
    st.style.background=stCols[Math.floor(Math.random()*stCols.length)];
    st.style.animationDelay=(Math.random()*4)+'s';
    c.appendChild(st);
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  buildBG();
  buildFilters();
  document.getElementById('searchInput').addEventListener('input',renderLex);
  renderLex();
});
</script>
