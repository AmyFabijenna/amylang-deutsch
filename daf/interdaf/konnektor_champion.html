<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konnektor Champion 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#f3eefb;--primary-light:#ece4f7;
  --accent:#8a4cbf;--accent-glow:#6a2ea0;
  --gold:#b8860b;--gold2:#9a6f00;--gold-glow:#d4a017;
  --success:#2e7d32;--error:#c0392b;
  --bg-dark:#f8f4fd;--bg-card:#eee6f8;
  --text:#1a1025;--text-muted:#5a3e7a;
  --fl1:#8a4cbf;--fl2:#b07fd4;--fl3:#e8d5f8;
  --card-border:rgba(138,76,191,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Quicksand',sans-serif;background:linear-gradient(160deg,#f0e8fc 0%,#f8f4fd 40%,#fdf9ff 70%,#f3edfb 100%);min-height:100vh;color:var(--text);overflow-x:hidden}

/* ── BG PARTICLES ── */
.bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.ripple{position:absolute;border-radius:50%;border:1px solid rgba(138,76,191,.12);animation:rOut 10s ease-out infinite}
@keyframes rOut{0%{transform:scale(.2);opacity:.7}100%{transform:scale(3);opacity:0}}
.shimmer{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(138,76,191,.18),rgba(184,134,11,.2),transparent);animation:sFlow 8s ease-in-out infinite;opacity:0}
@keyframes sFlow{0%{width:0;left:-5%;opacity:0}20%{opacity:1}80%{opacity:1}100%{width:120%;left:100%;opacity:0}}
.star{position:absolute;border-radius:50%;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.85;transform:scale(1.7)}}

/* ── LAYOUT ── */
.container{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px}
header{text-align:center;margin-bottom:28px;padding-top:12px}
h1{font-family:'Fredoka',sans-serif;font-size:2.6rem;background:linear-gradient(135deg,#6a2ea0,#b8860b,#8a4cbf,#6a2ea0);background-size:220% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tShimmer 5s linear infinite;margin-bottom:8px;letter-spacing:.5px}
@keyframes tShimmer{to{background-position:220% center}}
.subtitle{color:var(--text-muted);font-size:1.05rem}

.screen{display:none;animation:fadeIn .4s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── MAIN TABS ── */
.main-tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.main-tab{flex:1;min-width:140px;background:linear-gradient(135deg,#ede5f8,#e8dff5);border:1.5px solid rgba(138,76,191,.22);border-radius:14px;padding:14px 18px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .25s;text-align:center}
.main-tab:hover,.main-tab.active{background:linear-gradient(135deg,#c9960a,#e8b800);border-color:#c9960a;box-shadow:0 4px 22px rgba(201,150,10,.35),0 0 0 1px rgba(232,184,0,.25)}

/* ── CARDS ── */
.card{background:linear-gradient(135deg,#ede5f8,#f5f0fc);border-radius:20px;padding:26px;margin-bottom:18px;border:1px solid rgba(138,76,191,.2);box-shadow:0 6px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:14px}
.s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1.15rem;color:var(--text-muted);pointer-events:none}
#searchInput{width:100%;padding:13px 42px;font-size:1.08rem;font-family:'Quicksand',sans-serif;background:#faf7ff;border:2px solid rgba(138,76,191,.28);border-radius:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
#searchInput:focus{border-color:var(--accent-glow);box-shadow:0 0 14px rgba(138,76,191,.18)}
#searchInput::placeholder{color:var(--text-muted)}
.clear-x{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;display:none;padding:4px}
.clear-x:hover{color:var(--gold2)}

/* ── FILTER CHIPS ── */
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fchip{padding:4px 13px;border-radius:20px;border:1px solid rgba(138,76,191,.2);background:#f0e8fc;color:var(--text-muted);font-family:'Quicksand',sans-serif;font-size:.86rem;font-weight:600;cursor:pointer;transition:all .15s}
.fchip:hover{border-color:var(--gold);color:var(--gold)}
.fchip.active{background:linear-gradient(135deg,#c9960a,#e8b800);border-color:#b07d00;color:#1a1025;box-shadow:0 2px 10px rgba(201,150,10,.3)}

.results-meta{font-size:.9rem;color:var(--text-muted);margin-bottom:10px}
.results-meta strong{color:var(--gold)}

/* ── KONNEKTOR KARTEN ── */
.kcard{background:linear-gradient(135deg,#f0e8fc,#f8f3ff);border-radius:15px;margin-bottom:10px;border:1px solid rgba(138,76,191,.15);overflow:hidden;animation:fadeIn .18s ease}
.kcard-header{display:flex;align-items:flex-start;gap:10px;padding:13px 15px 11px;cursor:pointer;transition:background .12s;user-select:none}
.kcard-header:hover{background:rgba(138,76,191,.08)}
.kcard.open .kcard-header{border-bottom:1px solid rgba(138,76,191,.2)}
.kword{font-family:'Fredoka',sans-serif;font-size:1.32rem;color:var(--accent-glow);line-height:1.2}
.kword mark{background:rgba(245,200,66,.28);color:#fff;border-radius:3px;padding:0 3px}
.kbadges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.78rem;font-weight:700}
.b-kat{background:rgba(180,130,220,.2);color:var(--accent-glow);border:1px solid rgba(180,130,220,.3)}
.b-ns{background:rgba(109,190,90,.14);color:#9ee07a;border:1px solid rgba(109,190,90,.25)}
.b-adv{background:rgba(245,200,66,.14);color:#f5d060;border:1px solid rgba(184,134,11,.25)}
.b-hs{background:rgba(100,160,240,.15);color:#9bbff5;border:1px solid rgba(100,160,240,.25)}
.b-praep{background:rgba(220,160,240,.15);color:#e8b8f8;border:1px solid rgba(220,160,240,.28)}
.b-doppel{background:rgba(245,200,66,.18);color:#f0c840;border:1px solid rgba(245,200,66,.3)}
.b-inf{background:rgba(240,110,110,.15);color:#f09090;border:1px solid rgba(240,110,110,.22)}
.chevron{font-size:.9rem;color:var(--text-muted);transition:transform .22s;flex-shrink:0;margin-top:4px;margin-left:auto}
.kcard.open .chevron{transform:rotate(180deg);color:var(--accent)}
.kbody{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .2s}
.kcard.open .kbody{max-height:900px;padding:13px 15px}
.kbs-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:4px;margin-top:10px}
.kbs-label:first-child{margin-top:0}
.kbs-content{font-size:.96rem;color:var(--text);line-height:1.55}
.ex-list .ex{background:#ede5f8;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:7px 12px;margin-bottom:5px;font-size:.92rem;line-height:1.6}
.ex .arr{display:block;margin-left:10px;color:var(--text-muted)}
.tip{background:rgba(184,134,11,.08);border:1px solid rgba(245,200,66,.28);border-radius:10px;padding:8px 13px;font-size:.9rem;color:var(--text);margin-top:8px;line-height:1.5}
.tip::before{content:"💡 "}
.empty-state{text-align:center;padding:2.5rem;color:var(--text-muted);font-size:.93rem}

/* ── ÜBUNGSMENÜ ── */
.umode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:4px}
.umode-btn{background:linear-gradient(135deg,#ede5f8,#e8dff5);border:1.5px solid rgba(180,130,220,.22);border-radius:16px;padding:18px 20px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:1.05rem;font-weight:700;cursor:pointer;transition:all .25s;text-align:left;position:relative;overflow:hidden}
.umode-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--fl1),var(--gold2));opacity:0;transition:opacity .2s}
.umode-btn:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(201,150,10,.3);border-color:#c9960a}
.umode-btn:hover::after{opacity:1}
.umode-icon{font-size:1.55rem;margin-bottom:8px;display:block}
.umode-desc{font-size:.84rem;color:var(--text-muted);margin-top:4px;font-weight:500}
.umode-count{position:absolute;top:12px;right:14px;background:rgba(184,134,11,.12);border:1px solid rgba(184,134,11,.3);border-radius:20px;padding:2px 9px;font-size:.7rem;color:var(--gold2);font-weight:700}

/* ── QUIZ ── */
.qhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.qstat{background:#ede5f8;padding:8px 15px;border-radius:12px;border:1px solid rgba(180,130,220,.18);text-align:center;min-width:78px}
.qstat-l{font-size:.74rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.qstat-v{font-family:'Fredoka',sans-serif;font-size:1.45rem;color:var(--accent)}
.prog-bar{background:#ddd4f0;border-radius:10px;height:13px;overflow:hidden;margin-bottom:18px;border:1px solid rgba(180,130,220,.16)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--fl1),var(--gold));transition:width .5s ease;box-shadow:0 0 10px rgba(245,200,66,.3)}
.q-box{background:linear-gradient(135deg,#ede5f8,#f5f0fc);border-radius:18px;padding:30px 24px;margin-bottom:20px;border:1px solid rgba(180,130,220,.2);text-align:center}
.q-type-badge{display:inline-block;background:linear-gradient(135deg,#c9960a,#e8b800);color:#ffffff;padding:5px 14px;border-radius:20px;font-size:.84rem;font-weight:700;margin-bottom:14px;border:1px solid rgba(245,200,66,.2)}
.q-text{font-family:'Fredoka',sans-serif;font-size:1.55rem;line-height:1.75;margin-bottom:6px;color:var(--text)}
.q-text .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--gold2);color:var(--gold2);font-weight:700;padding:0 5px;margin:0 3px}
.q-hint{font-size:.9rem;color:var(--text-muted);margin-top:5px;font-style:italic}
.feedback-box{display:none;border-radius:11px;padding:11px 17px;margin-top:14px;font-size:.9rem;line-height:1.5}
.feedback-box.correct{background:rgba(46,125,50,.1);border:1px solid rgba(46,125,50,.3);color:#1b5e20}
.feedback-box.wrong{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.28);color:#7f1010}
.ans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.ans-btn{background:linear-gradient(135deg,#ede5f8,#f0e8fc);border:2px solid rgba(180,130,220,.2);border-radius:13px;padding:12px 15px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:.93rem;font-weight:700;cursor:pointer;transition:all .2s;line-height:1.3}
.ans-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 5px 18px rgba(180,130,220,.3);border-color:var(--gold);color:var(--gold)}
.ans-btn:disabled{opacity:.42;cursor:not-allowed}
.ans-btn.correct-ans{background:rgba(46,125,50,.15);border-color:var(--success);color:#1b5e20}
.ans-btn.wrong-ans{background:rgba(192,57,43,.12);border-color:var(--error);color:#7f1010}
.ctrl-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctrl-btn{background:linear-gradient(135deg,#ede5f8,#f0e8fc);border:2px solid rgba(180,130,220,.25);border-radius:13px;padding:10px 22px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
.ctrl-btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(180,130,220,.25);border-color:var(--gold)}
.ctrl-btn.primary{background:linear-gradient(135deg,#c9960a,#e8b800);border-color:#b07d00;color:#1a1025}
.ctrl-btn.primary:hover{box-shadow:0 6px 24px rgba(180,130,220,.45)}

/* ── RESULT ── */
.result-big{font-family:'Fredoka',sans-serif;font-size:1.9rem;margin-bottom:18px;background:linear-gradient(135deg,var(--accent),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px;margin-bottom:22px}
.r-stat{background:#ede5f8;padding:15px;border-radius:14px;border:1px solid rgba(180,130,220,.16)}
.r-stat-l{font-size:.73rem;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
.r-stat-v{font-family:'Fredoka',sans-serif;font-size:1.85rem;color:var(--accent)}

/* ── BACK BTN ── */
.back-btn{position:fixed;top:16px;left:16px;z-index:100;display:none;background:#ede5f8;border:1px solid rgba(180,130,220,.3);border-radius:12px;padding:8px 16px;color:var(--text);font-family:'Quicksand',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}
.back-btn:hover{border-color:#c9960a;color:#c9960a}

/* ── POPUP ── */
.pts-popup{position:fixed;font-family:'Fredoka',sans-serif;font-size:1.8rem;font-weight:700;color:var(--gold);pointer-events:none;z-index:1000;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.5)}
@keyframes floatUp{0%{transform:translateY(0) scale(.8);opacity:1}100%{transform:translateY(-85px) scale(1.2);opacity:0}}
.cp{position:fixed;pointer-events:none;z-index:3000}

@media(max-width:600px){h1{font-size:1.9rem}.q-text{font-size:1.2rem}.ans-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<button class="back-btn" id="backBtn" onclick="backToUeb()">← Zurück</button>

<div class="container">
  <header>
    <h1>💜 Konnektor Champion</h1>
    <p class="subtitle">Alle deutschen Konnektoren — Lexikon, Grammatik &amp; interaktive Übungen</p>
  </header>

  <div class="main-tabs">
    <button class="main-tab active" onclick="showTab('lex',this)">📚 Konnektor-Lexikon</button>
    <button class="main-tab" onclick="showTab('ueb',this)">🎯 Übungen &amp; Quiz</button>
  </div>

  <!-- LEXIKON -->
  <div id="tabLex" class="screen active">
    <div class="card">
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Konnektor suchen … weil, trotzdem, sowohl, indem, je … desto …" autocomplete="off">
        <button class="clear-x" id="clearX" onclick="clearSrch()">✕</button>
      </div>
      <div class="filter-row" id="filterRow"></div>
      <div class="results-meta" id="resMeta"></div>
      <div id="lexRes"></div>
    </div>
  </div>

  <!-- ÜBUNGEN -->
  <div id="tabUeb" class="screen">
    <div id="uebMenu">
      <div class="card">
        <h2 style="font-family:'Fredoka',sans-serif;font-size:1.35rem;color:var(--accent-glow);margin-bottom:18px">🎯 Übungsmodus wählen</h2>
        <div class="umode-grid">
          <button class="umode-btn" onclick="startQuiz('luecke')">
            <span class="umode-count">51 Fragen</span>
            <span class="umode-icon">✏️</span>
            Lückentext
            <div class="umode-desc">Setze den richtigen Konnektor in den Satz ein</div>
          </button>
          <button class="umode-btn" onclick="startQuiz('bedeutung')">
            <span class="umode-count">41 Fragen</span>
            <span class="umode-icon">🧠</span>
            Bedeutung erkennen
            <div class="umode-desc">Welche Funktion hat dieser Konnektor?</div>
          </button>
          <button class="umode-btn" onclick="startQuiz('wortstellung')">
            <span class="umode-count">30 Fragen</span>
            <span class="umode-icon">🔀</span>
            Wortstellung
            <div class="umode-desc">Welche Wortstellung folgt nach diesem Konnektor?</div>
          </button>
          <button class="umode-btn" onclick="startQuiz('doppel')">
            <span class="umode-count">35 Fragen</span>
            <span class="umode-icon">🔗</span>
            Doppelkonnektoren
            <div class="umode-desc">Ergänze den zweiten Teil des Doppelkonnektors</div>
          </button>
          <button class="umode-btn" onclick="startQuiz('umformung')">
            <span class="umode-count">42 Fragen</span>
            <span class="umode-icon">🔄</span>
            Umformung
            <div class="umode-desc">Forme den Satz mit dem angegebenen Konnektor um</div>
          </button>
        </div>
      </div>
    </div>

    <div id="quizScreen" style="display:none">
      <div class="card">
        <div class="qhdr">
          <div style="font-family:'Fredoka',sans-serif;font-size:1.05rem;color:var(--accent-glow)" id="qModeLabel">Quiz</div>
          <div style="display:flex;gap:10px">
            <div class="qstat"><div class="qstat-l">Punkte</div><div class="qstat-v" id="qPts">0</div></div>
            <div class="qstat"><div class="qstat-l">Richtig</div><div class="qstat-v" id="qRight">0</div></div>
            <div class="qstat"><div class="qstat-l">Frage</div><div class="qstat-v" id="qNum">1</div></div>
          </div>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="qProg" style="width:0%"></div></div>
        <div class="q-box">
          <div class="q-type-badge" id="qBadge">Lückentext</div>
          <div class="q-text" id="qText"></div>
          <div class="q-hint" id="qHint"></div>
          <div class="feedback-box" id="qFeedback"></div>
        </div>
        <div class="ans-grid" id="ansGrid"></div>
        <div class="ctrl-btns">
          <button class="ctrl-btn" id="skipBtn" onclick="nextQ()">⏭ Überspringen</button>
          <button class="ctrl-btn primary" id="nextBtn" onclick="nextQ()" style="display:none">Weiter ➜</button>
          <button class="ctrl-btn" onclick="endQuiz()">🏁 Beenden</button>
        </div>
      </div>
    </div>

    <div id="resultScreen" style="display:none">
      <div class="card" style="text-align:center">
        <div class="result-big" id="rEmoji">🎉 Ergebnis</div>
        <div class="result-grid">
          <div class="r-stat"><div class="r-stat-l">Punkte</div><div class="r-stat-v" id="rPts">0</div></div>
          <div class="r-stat"><div class="r-stat-l">Richtig</div><div class="r-stat-v" id="rRight">0</div></div>
          <div class="r-stat"><div class="r-stat-l">Falsch</div><div class="r-stat-v" id="rWrong">0</div></div>
          <div class="r-stat"><div class="r-stat-l">Genauigkeit</div><div class="r-stat-v" id="rAcc">0%</div></div>
        </div>
        <div class="ctrl-btns">
          <button class="ctrl-btn primary" onclick="restartQuiz()">🔄 Nochmal</button>
          <button class="ctrl-btn" onclick="backToUeb()">📚 Zurück</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  LEXIKON-DATENBANK
// ═══════════════════════════════════════════════════════════════
const DB = [
  // ── ADDITIV ─────────────────────────────────────────────────────────
  {w:"und",kat:"additiv",funk:["Konjunktion (Pos.0)"],bed:"Aufzählung / Verbindung",ws:"Position 0 — kein Einfluss auf Wortstellung",bsp:["Sie lernt Deutsch und er lernt Englisch."],tip:"Kein Komma bei einfacher Verbindung zweier HS!"},
  {w:"auch",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung",ws:"Position 1 oder 3",bsp:["Er lernt viel. Auch sie arbeitet fleißig.","Sie arbeitet auch fleißig."]},
  {w:"außerdem",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung / dazu kommt noch",ws:"Position 1 oder 3",bsp:["Sie ist klug. Außerdem ist sie sehr fleißig."]},
  {w:"zudem",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (formal)",ws:"Position 1",bsp:["Das Projekt ist teuer. Zudem dauert es lange."],tip:"Formeller als 'außerdem', typisch in Fach- und Wissenschaftstexten."},
  {w:"darüber hinaus",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Zusätzlich / noch mehr (betont)",ws:"Position 1",bsp:["Sie spricht Englisch. Darüber hinaus beherrscht sie Spanisch."]},
  {w:"überdies",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (gehoben/literarisch)",ws:"Position 1",bsp:["Er ist talentiert. Überdies arbeitet er sehr hart."],tip:"Sehr formell / literarisch."},
  {w:"des Weiteren",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (schriftlich/formal)",ws:"Position 1",bsp:["Das Konzept ist innovativ. Des Weiteren ist es kostengünstig."]},
  {w:"ferner",kat:"additiv",funk:["Satzverbindendes Adverb"],bed:"Hinzufügung (schriftlich/formal)",ws:"Position 1",bsp:["Wir bitten um Ihre Unterlagen. Ferner benötigen wir Ihre Zeugnisse."]},
  {w:"dazu",kat:"additiv",funk:["Satzverbindendes Adverb","Finales Adverb"],bed:"Hinzufügung ODER Zweck (je nach Kontext)",ws:"Position 1 oder 3",bsp:["Er lernt täglich. Dazu macht er Vokabelkarten."],tip:"Kann additiv ('außerdem') oder final ('zu diesem Zweck') bedeuten — Kontext entscheidet!"},
  {w:"dafür",kat:"additiv",funk:["Satzverbindendes Adverb","Finales Adverb"],bed:"dafür / dazu (Zweck oder Kompensation)",ws:"Position 1 oder 3",bsp:["Er verdient wenig. Dafür hat er viel Freizeit.","Sie will Erfolg. Dafür arbeitet sie hart."]},
  {w:"nicht nur … sondern auch",kat:"additiv",funk:["Doppelkonnektor"],bed:"Steigerung: A, und besonders auch B",ws:"nicht nur (Pos.3 / Verbpos.) + sondern auch (Pos.0 + Verb-Zweit)",bsp:["Er ist nicht nur intelligent, sondern auch fleißig.","Nicht nur die Kinder, sondern auch die Erwachsenen lachten."],tip:"'Sondern auch' leitet Hauptsatz ein → Verb-Zweit! Kein Verb ans Ende."},
  {w:"sowohl … als auch",kat:"additiv",funk:["Doppelkonnektor"],bed:"Beides trifft zu (kumulativ)",ws:"Kein Einfluss auf Wortstellung; Verb richtet sich nach Gesamtsubjekt",bsp:["Sowohl Maria als auch Peter kommen zur Party.","Er ist sowohl sportlich als auch musikalisch."],tip:"Kein Komma zwischen sowohl … als auch! Verb oft im Plural (Gesamtsubjekt)."},
  {w:"einerseits … andererseits",kat:"additiv",funk:["Doppelkonnektor"],bed:"Zwei Seiten / Aspekte einer Sache gegenüberstellen",ws:"Pos.1 im 1. HS + Pos.1 im 2. HS; jeweils Verb-Zweit",bsp:["Einerseits ist das Angebot günstig, andererseits ist die Qualität schlecht.","Das Studium ist einerseits interessant, andererseits sehr zeitaufwendig."],tip:"Beide Teile nötig! Zweiter Teil kann auch 'zum anderen' sein. Jeweils Position 1."},
  {w:"teils … teils",kat:"additiv",funk:["Doppelkonnektor"],bed:"Teils das eine, teils das andere (gemischt)",ws:"Pos.1 im 1. HS + Pos.1 im 2. HS",bsp:["Die Reaktionen waren teils positiv, teils negativ.","Teils bin ich froh, teils bin ich traurig darüber."],tip:"Drückt aus, dass beide Aspekte gleichzeitig und gemischt zutreffen."},
  {w:"zum einen … zum anderen",kat:"additiv",funk:["Doppelkonnektor"],bed:"Erstens … zweitens (Aufzählung von Aspekten)",ws:"Pos.1 im 1. HS + Pos.1 im 2. HS",bsp:["Zum einen ist es teuer, zum anderen fehlt die Zeit."],tip:"Stilistisch elegante Alternative zu 'einerseits … andererseits'."},
  // ── ADVERSATIV ───────────────────────────────────────────────────────
  {w:"aber",kat:"adversativ",funk:["Konjunktion (Pos.0)"],bed:"Gegensatz / Einschränkung",ws:"Position 0 — Wortstellung bleibt unverändert!",bsp:["Er ist fleißig, aber er ist nicht erfolgreich.","Das ist teuer, aber es lohnt sich."],tip:"'Aber' steht auf Pos.0 — es beeinflusst die Wortstellung NICHT!"},
  {w:"jedoch",kat:"adversativ",funk:["Konjunktion (Pos.0)","Satzverbindendes Adverb (Pos.1/3)"],bed:"Gegensatz / Einschränkung (formal)",ws:"Pos.0 (kein Einfl.) ODER Pos.1/3 (Verb-Zweit)",bsp:["Er lernte viel, jedoch bestand er nicht.","Er lernte viel. Jedoch bestand er nicht."],tip:"Flexibel: wie 'aber' (Pos.0) ODER wie Adverb (Pos.1). Formeller als 'aber'."},
  {w:"doch",kat:"adversativ",funk:["Konjunktion (Pos.0)"],bed:"Gegensatz (umgangssprachlich / expressiv)",ws:"Position 0",bsp:["Sie wollte kommen, doch sie wurde krank."]},
  {w:"sondern",kat:"adversativ",funk:["Konjunktion (Pos.0)"],bed:"Richtigstellung nach Verneinung",ws:"Position 0",bsp:["Das ist kein Fehler, sondern eine Absicht.","Nicht er, sondern sie hat das gemacht."],tip:"NUR nach Verneinung (nicht / kein)! Nicht mit 'aber' verwechseln!"},
  {w:"dagegen",kat:"adversativ",funk:["Satzverbindendes Adverb"],bed:"Gegensatz / Kontrast",ws:"Position 1 oder 3",bsp:["Er mag Kaffee. Sie dagegen trinkt nur Tee."]},
  {w:"hingegen",kat:"adversativ",funk:["Satzverbindendes Adverb"],bed:"Gegensatz (etwas formeller als 'dagegen')",ws:"Position 1 oder 3",bsp:["Deutschland ist kalt. Spanien hingegen ist warm."]},
  {w:"demgegenüber",kat:"adversativ",funk:["Satzverbindendes Adverb"],bed:"Gegenüberstellung (formal/schriftlich)",ws:"Position 1",bsp:["Die Preise steigen. Demgegenüber sinken die Löhne."]},
  {w:"wohingegen",kat:"adversativ",funk:["Nebensatzkonnektor"],bed:"Gegensatz (= während adversativ)",ws:"Verb ans Ende",bsp:["Er ist sportlich, wohingegen sein Bruder lieber liest."]},
  {w:"während",kat:"adversativ",funk:["Nebensatzkonnektor"],bed:"Gegensatz ODER Gleichzeitigkeit (temporal!)",ws:"Verb ans Ende",bsp:["Er ist ruhig, während sie sehr lebhaft ist.","Während ich koche, hört er Musik."],tip:"ACHTUNG: 'während' = temporal (gleichzeitig) ODER adversativ (Gegensatz). Kontext entscheidet!"},
  {w:"wo(hin)gegen",kat:"adversativ",funk:["Nebensatzkonnektor"],bed:"Gegensatz (= wohingegen, formal)",ws:"Verb ans Ende",bsp:["Er lacht, wogegen sie ernst bleibt."]},
  {w:"weder … noch",kat:"adversativ",funk:["Doppelkonnektor"],bed:"Keines von beidem trifft zu",ws:"Kein Komma; Verb-Zweit im zweiten Teil",bsp:["Er mag weder Kaffee noch Tee.","Weder sie noch er hat die Wahrheit gesagt."],tip:"Kein Komma zwischen weder … noch! Nach 'noch': Hauptsatz-Wortstellung."},
  {w:"entweder … oder",kat:"adversativ",funk:["Doppelkonnektor"],bed:"Das eine ODER das andere (nicht beides)",ws:"Kein Komma; Verb-Zweit im zweiten Teil",bsp:["Entweder kommst du mit, oder du bleibst hier.","Das machen wir entweder heute oder morgen."],tip:"Nach 'oder' im HS: Verb-Zweit-Stellung! Kein Komma."},
  {w:"zwar … aber",kat:"adversativ",funk:["Doppelkonnektor"],bed:"Einräumung + Einschränkung: zugegeben … trotzdem",ws:"'zwar' Pos.1 oder 3; 'aber' Pos.0 + Verb-Zweit",bsp:["Das ist zwar teuer, aber es lohnt sich.","Er ist zwar müde, aber er arbeitet weiter."],tip:"'Zwar' räumt ein, 'aber' schränkt ein. 'Aber' leitet Hauptsatz auf Pos.0 ein."},
  // ── KAUSAL ───────────────────────────────────────────────────────────
  {w:"weil",kat:"kausal",funk:["Nebensatzkonnektor"],bed:"Grund (neue / unbekannte Information)",ws:"Verb ans Ende",bsp:["Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.","Weil es regnet, bleiben wir zu Hause."],tip:"'Weil' = aktuelle, unbekannte Begründung. Verb IMMER ans Ende!"},
  {w:"da",kat:"kausal",funk:["Nebensatzkonnektor"],bed:"Grund (bekannte / geteilte Information)",ws:"Verb ans Ende; steht meist voran",bsp:["Da es regnet, nehmen wir den Schirm mit.","Da sie krank ist, kommt sie nicht."],tip:"'Da' = bekannte Information; steht meist am Satzanfang. Formeller als 'weil'."},
  {w:"denn",kat:"kausal",funk:["Konjunktion (Pos.0)"],bed:"Begründung im Hauptsatz",ws:"Position 0 — KEIN Einfluss auf Wortstellung!",bsp:["Ich nehme den Schirm, denn es regnet.","Wir bleiben zu Hause, denn das Wetter ist schlecht."],tip:"'Denn' verändert die Wortstellung NICHT — leitet normalen Hauptsatz ein!"},
  {w:"nämlich",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Nachgestellte Begründung / Erklärung",ws:"NIEMALS Pos.1! Immer Pos.3 (nach Subj.+Verb)",bsp:["Er kommt nicht. Er ist nämlich krank.","Sie lernt viel. Sie will nämlich die Prüfung bestehen."],tip:"KRITISCH: 'nämlich' steht NIEMALS auf Position 1! Immer nach Subjekt und Verb!"},
  {w:"deshalb",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Folge / Konsequenz",ws:"Position 1 oder 3",bsp:["Es regnet. Deshalb bleiben wir zu Hause.","Es regnet. Wir bleiben deshalb zu Hause."]},
  {w:"deswegen",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Folge / Konsequenz (= deshalb)",ws:"Position 1 oder 3",bsp:["Sie ist krank. Deswegen kommt sie nicht."]},
  {w:"daher",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Folge / Konsequenz (= deshalb)",ws:"Position 1 oder 3",bsp:["Er hat viel geübt. Daher ist er so gut."]},
  {w:"darum",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Folge / Konsequenz (= deshalb)",ws:"Position 1 oder 3",bsp:["Ich mag Musik. Darum höre ich jeden Tag Radio."]},
  {w:"folglich",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Konsequenz / Schlussfolgerung (formal)",ws:"Position 1",bsp:["Er hat nicht gelernt. Folglich hat er die Prüfung nicht bestanden."]},
  {w:"somit",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Konsequenz (formal)",ws:"Position 1",bsp:["Die Kosten sind gestiegen. Somit müssen wir sparen."]},
  {w:"demnach",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Schlussfolgerung / laut dem",ws:"Position 1",bsp:["Der Bericht zeigt Probleme. Demnach müssen wir handeln."]},
  {w:"infolgedessen",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Als Folge davon (sehr formal)",ws:"Position 1",bsp:["Es gab einen Unfall. Infolgedessen kam es zu Staus."]},
  {w:"also",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Schlussfolgerung / Konsequenz",ws:"Position 1 oder 3",bsp:["Sie ist müde. Also geht sie früh schlafen."]},
  {w:"aus diesem Grund",kat:"kausal",funk:["Satzverbindendes Adverb"],bed:"Wegen diesem Grund / deshalb",ws:"Position 1",bsp:["Er hat Angst. Aus diesem Grund traut er sich nicht."]},
  {w:"sodass",kat:"kausal",funk:["Nebensatzkonnektor"],bed:"Folge / Konsequenz",ws:"Verb ans Ende",bsp:["Er arbeitet viel, sodass er wenig Zeit hat."],tip:"'So … dass' mit Intensivierung: 'Er war so müde, dass er sofort schlief.'"},
  {w:"weshalb",kat:"kausal",funk:["Nebensatzkonnektor"],bed:"Folge (= sodass)",ws:"Verb ans Ende",bsp:["Er kam zu spät, weshalb wir ohne ihn anfingen."]},
  {w:"weswegen",kat:"kausal",funk:["Nebensatzkonnektor"],bed:"Folge (= sodass, formal)",ws:"Verb ans Ende",bsp:["Sie hatte Fieber, weswegen sie zuhause blieb."]},
  {w:"so … dass",kat:"kausal",funk:["Nebensatzkonnektor (graduell)"],bed:"Graduelle Folge: Intensität → Konsequenz",ws:"Verb ans Ende",bsp:["Er war so müde, dass er sofort einschlief.","Es war so kalt, dass wir frosteten."]},
  // ── KONZESSIV ────────────────────────────────────────────────────────
  {w:"obwohl",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Gegenargument (trotzdem)",ws:"Verb ans Ende",bsp:["Obwohl es regnet, gehen wir spazieren.","Er kam pünktlich, obwohl er weit weg wohnt."]},
  {w:"obgleich",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Gegenargument (formal = obwohl)",ws:"Verb ans Ende",bsp:["Obgleich er müde war, arbeitete er weiter."]},
  {w:"obschon",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Gegenargument (gehoben / veraltet)",ws:"Verb ans Ende",bsp:["Obschon er reich war, lebte er bescheiden."],tip:"Literarisch/veraltet. Gleiche Bedeutung wie 'obwohl'."},
  {w:"wenngleich",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Gegenargument (formal)",ws:"Verb ans Ende",bsp:["Wenngleich das Projekt teuer ist, lohnt es sich."]},
  {w:"auch wenn",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Konzessive Bedingung",ws:"Verb ans Ende",bsp:["Auch wenn er schreit, höre ich nicht hin."]},
  {w:"selbst wenn",kat:"konzessiv",funk:["Nebensatzkonnektor"],bed:"Konzessive Bedingung (besonders betont)",ws:"Verb ans Ende + Konjunktiv II möglich",bsp:["Selbst wenn er käme, würde es nichts ändern."]},
  {w:"trotzdem",kat:"konzessiv",funk:["Satzverbindendes Adverb"],bed:"trotzdem / dennoch",ws:"Position 1 oder 3",bsp:["Es regnet. Trotzdem gehen wir spazieren."]},
  {w:"dennoch",kat:"konzessiv",funk:["Satzverbindendes Adverb"],bed:"trotzdem (etwas formeller)",ws:"Position 1 oder 3",bsp:["Sie war müde. Dennoch arbeitete sie bis Mitternacht."]},
  {w:"gleichwohl",kat:"konzessiv",funk:["Satzverbindendes Adverb"],bed:"dennoch (gehoben/formal)",ws:"Position 1",bsp:["Das Vorhaben ist riskant. Gleichwohl unterstütze ich es."]},
  {w:"allerdings",kat:"konzessiv",funk:["Satzverbindendes Adverb"],bed:"Einschränkung (weicher als 'trotzdem')",ws:"Position 1 oder 3",bsp:["Das Konzept ist gut. Allerdings braucht es mehr Zeit."],tip:"Schwächer als 'trotzdem' — signalisiert Einschränkung, keinen direkten Widerspruch."},
  {w:"zwar … aber",kat:"konzessiv",funk:["Doppelkonnektor"],bed:"Einräumung + Einschränkung",ws:"'zwar' Pos.1/3; 'aber' Pos.0",bsp:["Er ist zwar müde, aber er arbeitet weiter."]},
  {w:"wenn … auch (so)",kat:"konzessiv",funk:["Doppelkonnektor"],bed:"Egal ob/wie … trotzdem",ws:"wenn + Verb-Ende; auch (so) + Verb-Zweit",bsp:["Wenn er auch viel arbeitet, so verdient er wenig."]},
  // ── TEMPORAL ─────────────────────────────────────────────────────────
  {w:"als",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Einmaliges Ereignis in der Vergangenheit",ws:"Verb ans Ende",bsp:["Als ich Kind war, liebte ich Eis.","Als er ankam, war sie schon weg."],tip:"NUR für EINMALIGES in der VERGANGENHEIT! Für Routinen: 'wenn'. Für Vergleich: 'als' nach Komparativ."},
  {w:"wenn",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Routine / Wiederholung (alle Zeiten) + Bedingung",ws:"Verb ans Ende",bsp:["Wenn ich nach Hause komme, esse ich.","Wenn es regnet, nehme ich den Schirm."],tip:"TEMPORAL: Routinen. KONDITIONAL: Bedingung. Kontext entscheidet!"},
  {w:"während",kat:"temporal",funk:["Nebensatzkonnektor","Präposition (+ Gen.)"],bed:"Gleichzeitigkeit ODER Gegensatz",ws:"Verb ans Ende",bsp:["Während ich koche, hört er Musik.","Während des Essens hörte er Radio."],tip:"Temporal = gleichzeitig. Adversativ = Gegensatz. Kontext entscheidet!"},
  {w:"nachdem",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Reihenfolge: erst A, dann B",ws:"Verb ans Ende; ZEITVERSCHIEBUNG zwingend!",bsp:["Nachdem er gegessen hatte, schlief er ein.","Nachdem sie die Prüfung bestanden hat, feiert sie."],tip:"ZEITVERSCHIEBUNG! Plusquamperf.→Prät. oder Perf.→Präsens. 'Nachdem er aß' ist FALSCH!"},
  {w:"bevor",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Reihenfolge: erst B, dann A (Aktion 2 → Aktion 1)",ws:"Verb ans Ende",bsp:["Bevor ich schlafe, lese ich noch.","Ich lerne, bevor ich die Prüfung schreibe."]},
  {w:"bis",kat:"temporal",funk:["Nebensatzkonnektor","Präposition"],bed:"Ende einer Phase / Aktion",ws:"Verb ans Ende",bsp:["Ich lerne, bis ich alles verstehe.","Bis zum Abend bin ich fertig."]},
  {w:"seit / seitdem",kat:"temporal",funk:["Nebensatzkonnektor","Präposition (+ Dat.)","Satzverbindendes Adverb"],bed:"Beginn in der Vergangenheit — noch jetzt andauernd",ws:"Verb ans Ende (NS); Position 1 (Adverb)",bsp:["Seitdem er in Berlin wohnt, ist er glücklicher.","Er ist umgezogen. Seitdem ist er glücklich.","Seit dem Umzug fühlt er sich wohl."]},
  {w:"sobald",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Unmittelbar danach / sofort wenn",ws:"Verb ans Ende",bsp:["Sobald er anruft, fahre ich los.","Ruf mich an, sobald du da bist."]},
  {w:"solange",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Für die gesamte Dauer",ws:"Verb ans Ende",bsp:["Solange ich hier bin, bin ich glücklich.","Solange du schläfst, bin ich ruhig."]},
  {w:"ehe",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Bevor (literarisch / formell)",ws:"Verb ans Ende",bsp:["Ehe du gehst, sag mir Bescheid."],tip:"Formeller/literarischer als 'bevor'. Gleiche Bedeutung."},
  {w:"kaum dass",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Unmittelbar danach (literarisch)",ws:"Verb ans Ende",bsp:["Kaum hatte er den Raum betreten, begann es zu regnen."],tip:"Literarisch/formal: 'Kaum hatte er …' (Verb-Erst-Stellung im kaum-Satz!)."},
  {w:"sobald",kat:"temporal",funk:["Nebensatzkonnektor"],bed:"Unmittelbar nach einem Ereignis",ws:"Verb ans Ende",bsp:["Sobald sie da ist, fangen wir an."]},
  {w:"danach",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"Danach / reihenfolge",ws:"Position 1",bsp:["Ich esse. Danach schlafe ich."]},
  {w:"vorher",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"Reihenfolge: davor",ws:"Position 1 oder 3",bsp:["Ich schlafe. Vorher esse ich noch kurz."]},
  {w:"davor",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"Davor / zeitlich vorher",ws:"Position 1",bsp:["Er zog nach Berlin. Davor wohnte er in München."]},
  {w:"zuvor",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"Davor / vorher (formal)",ws:"Position 1",bsp:["Er lernte. Zuvor hatte er lange gezögert."]},
  {w:"anschließend",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"Danach / im Anschluss",ws:"Position 1",bsp:["Sie bestand die Prüfung. Anschließend feierten alle."]},
  {w:"währenddessen",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"In der Zwischenzeit / gleichzeitig",ws:"Position 1",bsp:["Sie arbeitet. Währenddessen spielt er Gitarre."]},
  {w:"gleichzeitig",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"Zur gleichen Zeit",ws:"Position 1 oder 3",bsp:["Er kocht. Gleichzeitig höre ich Musik."]},
  {w:"dabei",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"Gleichzeitig / währenddessen (bei einer Handlung)",ws:"Position 1 oder 3",bsp:["Er liest. Dabei hört er Musik.","Beim Tanzen bin ich glücklich. Ich singe dabei."]},
  {w:"jedesmal",kat:"temporal",funk:["Satzverbindendes Adverb"],bed:"Bei jeder Wiederholung",ws:"Position 1",bsp:["Er kommt zu spät. Jedesmal entschuldigt er sich."]},
  // ── KONDITIONAL ──────────────────────────────────────────────────────
  {w:"wenn",kat:"konditional",funk:["Nebensatzkonnektor"],bed:"Bedingung (real oder irreal mit Konj.II)",ws:"Verb ans Ende",bsp:["Wenn du lernst, wirst du Erfolg haben.","Wenn ich Zeit hätte, würde ich kommen."],tip:"Real: Indikativ. Irreal: Konjunktiv II. Für Routinen auch temporal!"},
  {w:"falls",kat:"konditional",funk:["Nebensatzkonnektor"],bed:"Bedingung (eher unwahrscheinlicher Fall)",ws:"Verb ans Ende",bsp:["Falls er kommt, sag mir Bescheid.","Falls du Hilfe brauchst, ruf mich an."]},
  {w:"sofern",kat:"konditional",funk:["Nebensatzkonnektor"],bed:"Einschränkende Bedingung",ws:"Verb ans Ende",bsp:["Ich komme, sofern ich Zeit habe.","Sofern keine Einwände bestehen, beginnen wir."]},
  {w:"soweit",kat:"konditional",funk:["Nebensatzkonnektor"],bed:"Einschränkend / soweit bekannt",ws:"Verb ans Ende",bsp:["Soweit ich weiß, kommt er heute.","Das ist korrekt, soweit ich das beurteilen kann."]},
  {w:"vorausgesetzt",kat:"konditional",funk:["Konnektor mit Hauptsatz (Pos.0)"],bed:"Bedingung (= wenn, formal)",ws:"Position 0; Verb-Zweit im Folgesatz",bsp:["Vorausgesetzt, du lernst fleißig, wirst du Erfolg haben.","Wir kommen, vorausgesetzt das Wetter ist gut."]},
  {w:"es sei denn",kat:"konditional",funk:["Konnektor mit Hauptsatz (Pos.0)"],bed:"Ausnahme / außer wenn (negative Bedingung)",ws:"Position 0; leitet HS ein",bsp:["Wir gehen spazieren, es sei denn, es regnet.","Ich helfe dir, es sei denn, du willst es nicht."],tip:"'Es sei denn' = 'außer wenn'. Leitet Hauptsatz ein!"},
  {w:"sonst",kat:"konditional",funk:["Satzverbindendes Adverb"],bed:"Negative Bedingung / andernfalls",ws:"Position 1",bsp:["Lern fleißig, sonst fällst du durch!","Beeil dich! Sonst kommen wir zu spät."]},
  {w:"andernfalls",kat:"konditional",funk:["Satzverbindendes Adverb"],bed:"Negative Bedingung (formal = sonst)",ws:"Position 1",bsp:["Zahlen Sie die Rechnung. Andernfalls schalten wir einen Anwalt ein."]},
  {w:"ansonsten",kat:"konditional",funk:["Satzverbindendes Adverb"],bed:"Negative Bedingung (= sonst)",ws:"Position 1",bsp:["Mach das Licht aus. Ansonsten ist es zu hell."]},
  // ── FINAL ────────────────────────────────────────────────────────────
  {w:"damit",kat:"final",funk:["Nebensatzkonnektor"],bed:"Zweck / Ziel (verschiedene Subjekte!)",ws:"Verb ans Ende",bsp:["Sie spricht laut, damit alle sie hören.","Ich erkläre es nochmal, damit du es verstehst."],tip:"'Damit' = verschiedene Subjekte! Bei gleichem Subjekt → 'um … zu'!"},
  {w:"um … zu",kat:"final",funk:["Infinitivkonstruktion"],bed:"Zweck / Ziel (GLEICHES Subjekt!)",ws:"'um' + Infinitiv mit 'zu' am Satzende",bsp:["Er lernt viel, um die Prüfung zu bestehen.","Ich fahre in die Stadt, um einzukaufen."],tip:"NUR bei GLEICHEM Subjekt! Verschiedene Subjekte → zwingend 'damit'!"},
  {w:"dazu",kat:"final",funk:["Satzverbindendes Adverb"],bed:"Zu diesem Zweck",ws:"Position 1 oder 3",bsp:["Sie will abnehmen. Dazu treibt sie täglich Sport."]},
  {w:"dafür",kat:"final",funk:["Satzverbindendes Adverb"],bed:"Dafür / zu diesem Ziel",ws:"Position 1 oder 3",bsp:["Er will Erfolg. Dafür arbeitet er hart."]},

// ═══════════════════════════════════════════════════════════════
//  QUIZ LOGIK
// ═══════════════════════════════════════════════════════════════
const MODE_LABELS = {luecke:"✏️ Lückentext",bedeutung:"🧠 Bedeutung",wortstellung:"🔀 Wortstellung",doppel:"🔗 Doppelkonnektoren",umformung:"🔄 Umformung"};
let qState = {mode:null,qs:[],idx:0,pts:0,right:0,wrong:0,done:false};

function startQuiz(mode) {
  const pool = POOLS[mode];
  const shuffled = [...pool].sort(()=>Math.random()-.5);
  qState = {mode,qs:shuffled,idx:0,pts:0,right:0,wrong:0,done:false};
  document.getElementById('qModeLabel').textContent = MODE_LABELS[mode];
  document.getElementById('uebMenu').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  document.getElementById('backBtn').style.display='block';
  loadQ();
}

function loadQ() {
  const total=qState.qs.length, i=qState.idx;
  if(i>=total){endQuiz();return;}
  const q=qState.qs[i];
  qState.done=false;
  document.getElementById('qNum').textContent=`${i+1}/${total}`;
  document.getElementById('qPts').textContent=qState.pts;
  document.getElementById('qRight').textContent=qState.right;
  document.getElementById('qProg').style.width=((i/total)*100)+'%';
  document.getElementById('qBadge').textContent=MODE_LABELS[qState.mode];
  document.getElementById('qText').innerHTML=q.q.replace(/___/g,'<span class="blank">___</span>');
  document.getElementById('qHint').textContent=q.hint||'';
  const fb=document.getElementById('qFeedback');
  fb.style.display='none'; fb.className='feedback-box';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('skipBtn').style.display='block';
  const grid=document.getElementById('ansGrid');
  grid.innerHTML='';
  [...q.opts].sort(()=>Math.random()-.5).forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='ans-btn'; btn.textContent=opt;
    btn.onclick=()=>checkAns(btn,opt,q.a);
    grid.appendChild(btn);
  });
}

function checkAns(btn, chosen, correct) {
  if(qState.done) return;
  const fb = document.getElementById('qFeedback');
  if(chosen === correct){
    // CORRECT
    qState.done = true;
    btn.classList.add('correct-ans');
    document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
    qState.right++; qState.pts += 10;
    fb.className = 'feedback-box correct';
    fb.textContent = '✓ Richtig!';
    fb.style.display = 'block';
    document.getElementById('qPts').textContent = qState.pts;
    document.getElementById('qRight').textContent = qState.right;
    document.getElementById('skipBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    showPop('+10 💜');
    // Auto-advance after 2 seconds
    setTimeout(() => { qState.idx++; loadQ(); }, 2000);
  } else {
    // WRONG — flash red, let user retry
    qState.wrong++;
    btn.classList.add('wrong-ans');
    btn.disabled = true;
    fb.className = 'feedback-box wrong';
    fb.textContent = '✗ Nicht ganz — versuch es nochmal!';
    fb.style.display = 'block';
    document.getElementById('qPts').textContent = qState.pts;
    // Remove red flash after 0.8s so user can see which was wrong
    setTimeout(() => { btn.classList.remove('wrong-ans'); }, 900);
  }
}

function nextQ(){qState.idx++;loadQ();}

function endQuiz(){
  document.getElementById('quizScreen').style.display='none';
  document.getElementById('resultScreen').style.display='block';
  const total=qState.right+qState.wrong;
  const pct=total>0?Math.round(qState.right/total*100):0;
  let msg='📚 Weiter lernen!';
  if(pct>=90)msg='🏆 Ausgezeichnet!';
  else if(pct>=75)msg='💜 Sehr gut!';
  else if(pct>=55)msg='🌿 Gut gemacht!';
  document.getElementById('rEmoji').textContent=msg;
  document.getElementById('rPts').textContent=qState.pts;
  document.getElementById('rRight').textContent=qState.right;
  document.getElementById('rWrong').textContent=qState.wrong;
  document.getElementById('rAcc').textContent=pct+'%';
  if(pct>=70)confetti();
}

function restartQuiz(){document.getElementById('resultScreen').style.display='none';startQuiz(qState.mode);}
function backToUeb(){
  document.getElementById('quizScreen').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('uebMenu').style.display='block';
  document.getElementById('backBtn').style.display='none';
}

function showPop(txt){
  const p=document.createElement('div');p.className='pts-popup';p.textContent=txt;
  p.style.left=(Math.random()*60+20)+'%';p.style.top='45%';
  document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
}
function confetti(){
  const cols=['#c49bdf','#f5c842','#9b6bbf','#e8d5f8','#6dbe5a','#f5a0d0'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');c.className='cp';
    c.style.left=Math.random()*100+'vw';c.style.top='-10px';
    c.style.background=cols[Math.floor(Math.random()*cols.length)];
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    const sz=(Math.random()*9+5)+'px';c.style.width=c.style.height=sz;
    document.body.appendChild(c);
    const a=c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(100vh) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:Math.random()*2000+2200,easing:'ease-out'});
    a.onfinish=()=>c.remove();
  }
}

// ═══════════════════════════════════════════════════════════════
//  LEXIKON
// ═══════════════════════════════════════════════════════════════
let aktKat=null, openK=new Set();

function showTab(tab,btn){
  document.querySelectorAll('.main-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['tabLex','tabUeb'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(tab==='lex'?'tabLex':'tabUeb').classList.add('active');
  if(tab==='lex')renderLex();
}

function buildFilters(){
  const row=document.getElementById('filterRow');
  const all=makeChip('Alle',true,()=>{aktKat=null;renderLex();updChips(all);});
  row.appendChild(all);
  KATEGORIEN.forEach(k=>{
    const b=makeChip(KL[k]||k,false,()=>{aktKat=k;renderLex();updChips(b);});
    row.appendChild(b);
  });
}
function makeChip(lbl,active,fn){const b=document.createElement('button');b.className='fchip'+(active?' active':'');b.textContent=lbl;b.onclick=fn;return b;}
function updChips(a){document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('active'));a.classList.add('active');}

function hl(t,q){if(!q)return t;return t.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),'<mark>$1</mark>');}

function renderLex(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('clearX').style.display=q?'block':'none';
  let res=DB.filter(k=>{
    const ko=!aktKat||k.kat===aktKat;
    if(!q)return ko;
    return ko&&(k.w.toLowerCase().includes(q)||k.bed.toLowerCase().includes(q)||(k.funk||[]).some(f=>f.toLowerCase().includes(q))||(k.bsp||[]).some(b=>b.toLowerCase().includes(q)));
  });
  const meta=document.getElementById('resMeta');
  const cont=document.getElementById('lexRes');
  if(q||aktKat){meta.innerHTML=`<strong>${res.length}</strong> Eintr${res.length===1?'ag':'äge'}${q?` für „<strong>${q}</strong>"`:''}${aktKat?` — Kategorie <strong>${KL[aktKat]}</strong>`:''}`;}
  else{meta.innerHTML=`<strong>${DB.length}</strong> Konnektoren — tippe einen Begriff oder wähle eine Kategorie`;}
  if(!q&&!aktKat){cont.innerHTML=`<div class="empty-state">🔍 Suche starten oder Kategorie wählen …</div>`;return;}
  if(!res.length){cont.innerHTML=`<div class="empty-state">Nichts gefunden — versuche andere Schreibweise</div>`;return;}
  cont.innerHTML=res.map(k=>buildCard(k,q)).join('');
}

function buildCard(k,q){
  const id='k_'+k.w.replace(/[^a-z]/gi,'_');
  const isOpen=openK.has(id);
  const funkB=(k.funk||[]).map(f=>{
    let c='b-ns';
    if(f.includes('Adverb'))c='b-adv';
    else if(f.includes('Pos.0')||f.includes('Hauptsatz'))c='b-hs';
    else if(f.includes('Präp'))c='b-praep';
    else if(f.includes('Doppel'))c='b-doppel';
    else if(f.includes('Inf'))c='b-inf';
    return `<span class="badge ${c}">${f}</span>`;
  }).join('');
  const katB=`<span class="badge b-kat">${KL[k.kat]||k.kat}</span>`;
  const exH=(k.bsp||[]).map(b=>{
    const p=b.split('→');
    return `<div class="ex">${p.map((x,i)=>i===0?x.trim():`<span class="arr">→ ${x.trim()}</span>`).join('')}</div>`;
  }).join('');
  const tipH=k.tip?`<div class="tip">${k.tip}</div>`:'';
  const wsH=k.ws?`<div><div class="kbs-label">Wortstellung</div><div class="kbs-content">${k.ws}</div></div>`:'';
  return `<div class="kcard${isOpen?' open':''}" id="${id}">
    <div class="kcard-header" onclick="toggleK('${id}')">
      <div style="flex:1">
        <div class="kword">${hl(k.w,q)}</div>
        <div class="kbadges" style="margin-top:5px">${katB}${funkB}</div>
        <div style="font-size:.78rem;color:var(--text-muted);margin-top:4px">${k.bed}</div>
      </div>
      <span class="chevron">▼</span>
    </div>
    <div class="kbody">
      ${wsH}
      <div><div class="kbs-label">Beispiele</div><div class="ex-list">${exH}</div></div>
      ${tipH}
    </div>
  </div>`;
}

function toggleK(id){
  if(openK.has(id))openK.delete(id);else openK.add(id);
  const el=document.getElementById(id);if(el)el.classList.toggle('open',openK.has(id));
}
function clearSrch(){document.getElementById('searchInput').value='';document.getElementById('clearX').style.display='none';renderLex();}

// ═══════════════════════════════════════════════════════════════
//  BG + INIT
// ═══════════════════════════════════════════════════════════════
function buildBG(){
  const c=document.getElementById('bg');
  const flCols=['rgba(138,76,191,.3)','rgba(176,127,212,.25)','rgba(184,134,11,.2)','rgba(138,76,191,.2)'];
  for(let i=0;i<10;i++){
    const r=document.createElement('div');r.className='ripple';
    r.style.width=r.style.height=(Math.random()*320+180)+'px';
    r.style.left=Math.random()*100+'%';r.style.top=Math.random()*100+'%';
    r.style.animationDelay=(Math.random()*9)+'s';
    r.style.borderColor=flCols[Math.floor(Math.random()*flCols.length)];
    c.appendChild(r);
  }
  for(let i=0;i<5;i++){
    const s=document.createElement('div');s.className='shimmer';
    s.style.top=(Math.random()*100)+'%';
    s.style.animationDelay=(i*1.9)+'s';s.style.animationDuration=(Math.random()*4+7)+'s';
    c.appendChild(s);
  }
  const stCols=['rgba(138,76,191,.4)','rgba(184,134,11,.4)','rgba(176,127,212,.35)','rgba(138,76,191,.3)'];
  for(let i=0;i<30;i++){
    const st=document.createElement('div');st.className='star';
    const sz=(Math.random()*4+3)+'px';
    st.style.width=st.style.height=sz;
    st.style.left=Math.random()*100+'%';st.style.top=Math.random()*100+'%';
    st.style.background=stCols[Math.floor(Math.random()*stCols.length)];
    st.style.animationDelay=(Math.random()*4)+'s';
    c.appendChild(st);
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  buildBG();
  buildFilters();
  document.getElementById('searchInput').addEventListener('input',renderLex);
  renderLex();
});
</script>
