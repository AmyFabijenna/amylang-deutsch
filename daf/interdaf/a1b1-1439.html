            {word: "Gesundheit", type: "Ausdruck", en: "Bless you", hu: "Egészségedre", it: "Salute"},
            {word: "Keine Ahnung", type: "Ausdruck", en: "No idea", hu: "Fogalmam sincs", it: "Non ne ho idea"},
            {word: "Das macht nichts", type: "Ausdruck", en: "That doesn't matter", hu: "Nem számít", it: "Non importa"},
            {word: "Es geht", type: "Ausdruck", en: "It's okay/so-so", hu: "Elmegy", it: "Va bene/così così"},
            {word: "Stimmt", type: "Ausdruck", en: "That's correct", hu: "Stimmel", it: "È vero"},
            {word: "Genau", type: "Ausdruck", en: "Exactly", hu: "Pontosan", it: "Esattamente"},
            {word: "Natürlich", type: "Ausdruck", en: "Of course", hu: "Természetesen", it: "Certo"},
            {word: "Klar", type: "Ausdruck", en: "Sure/Clear", hu: "Persze/Világos", it: "Chiaro"},
            {word: "Auf keinen Fall", type: "Ausdruck", en: "No way", hu: "Semmi esetre sem", it: "Assolutamente no"}
        ];

        // State variables
        let currentMode = 'flashcard';
        let currentFilter = 'all';
        let currentLanguage = 'en';
        let isReversed = false;
        let currentIndex = 0;
        let filteredVocab = [];
        let learnedWords = {};
        let isFlipped = false;
        let quizScore = {correct: 0, total: 0};

        // Initialize
        function init() {
            loadLearnedWords();
            filterVocab();
            renderContent();
        }

        // Load learned words from localStorage
        function loadLearnedWords() {
            const saved = localStorage.getItem('learnedWords');
            if (saved) {
                learnedWords = JSON.parse(saved);
            }
        }

        // Save learned words to localStorage
        function saveLearnedWords() {
            localStorage.setItem('learnedWords', JSON.stringify(learnedWords));
        }

        // Toggle learned status
        function toggleLearned(word, status) {
            learnedWords[word] = status;
            saveLearnedWords();
            renderContent();
        }

        // Filter vocabulary
        function filterVocab() {
            if (currentFilter === 'all') {
                filteredVocab = vocabData;
            } else if (currentFilter === 'learned') {
                filteredVocab = vocabData.filter(item => learnedWords[item.word]);
            } else if (currentFilter === 'unlearned') {
                filteredVocab = vocabData.filter(item => !learnedWords[item.word]);
            } else {
                filteredVocab = vocabData.filter(item => item.type === currentFilter);
            }
            
            // Shuffle for quiz mode
            if (currentMode === 'quiz') {
                filteredVocab = [...filteredVocab].sort(() => Math.random() - 0.5);
            }
            
            currentIndex = 0;
        }

        // Set mode
        function setMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            isFlipped = false;
            quizScore = {correct: 0, total: 0};
            
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            filterVocab();
            renderContent();
        }

        // Set filter
        function setFilter(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            filterVocab();
            renderContent();
        }

        // Set language
        function setLanguage(lang) {
            currentLanguage = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderContent();
        }

function toggleDirection() {
    isReversed = !isReversed;
    const directionText = document.getElementById('directionText');
    
    if (isReversed) {
        // Show the current foreign language in the emoji
        let flagEmoji = '🇬🇧';
        if (currentLanguage === 'hu') flagEmoji = '🇭🇺';
        if (currentLanguage === 'it') flagEmoji = '🇮🇹';
        directionText.textContent = `${flagEmoji} Fremdsprache → 🇩🇪 Deutsch`;
    } else {
        directionText.textContent = '🇩🇪 Deutsch → 🇬🇧 Fremdsprache';
    }
    
    renderContent();
}

        // Render content based on current mode
        function renderContent() {
            const container = document.getElementById('contentArea');
            
            if (filteredVocab.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #8B4513; font-size: 1.3em; padding: 40px;">Keine Vokabeln gefunden!</p>';
                return;
            }
            
            switch(currentMode) {
                case 'flashcard':
                    renderFlashcard(container);
                    break;
                case 'list':
                    renderList(container);
                    break;
                case 'quiz':
                    renderQuiz(container);
                    break;
            }
        }

        // Render flashcard mode
        function renderFlashcard(container) {
            const item = filteredVocab[currentIndex];
            const showingGerman = !isReversed && !isFlipped || isReversed && isFlipped;
            
            container.innerHTML = `
                <div class="flashcard-container">
                    <div class="flashcard" onclick="flipCard()">
                        <div class="flashcard-word">${isFlipped ? (isReversed ? item.word : item[currentLanguage]) : (isReversed ? item[currentLanguage] : item.word)}</div>
                        ${!isFlipped && showingGerman ? `
                            <div class="flashcard-details">
                                <span class="vocab-type">${item.type}</span><br>
                                ${getDetails(item)}
                            </div>
                        ` : ``}
                        ${isFlipped && !showingGerman ? `
                            <div class="flashcard-translation">${isReversed ? item.word : item[currentLanguage]}</div>
                        ` : ``}
                        ${isFlipped && showingGerman ? `
                            <div class="flashcard-translation">${isReversed ? item[currentLanguage] : item.word}</div>
                            <div class="flashcard-details">
                                <span class="vocab-type">${item.type}</span><br>
                                ${getDetails(item)}
                            </div>
                        ` : ``}
                        <p style="margin-top: 20px; color: #999; font-size: 0.9em;">Klicken zum Umdrehen</p>
                    </div>
                    <div class="flashcard-controls">
                        <button class="flashcard-btn" onclick="previousCard()">◀ Zurück</button>
                        <button class="flashcard-btn unknown" onclick="markUnknown()">❌ Nicht gewusst</button>
                        <button class="flashcard-btn known" onclick="markKnown()">✅ Gewusst</button>
                        <button class="flashcard-btn" onclick="nextCard()">Weiter ▶</button>
                    </div>
                    <p style="text-align: center; margin-top: 20px; color: #8B4513; font-weight: bold;">
                        Karte ${currentIndex + 1} von ${filteredVocab.length}
                    </p>
                </div>
            `;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            renderContent();
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % filteredVocab.length;
            isFlipped = false;
            renderContent();
        }

        function previousCard() {
            currentIndex = currentIndex === 0 ? filteredVocab.length - 1 : currentIndex - 1;
            isFlipped = false;
            renderContent();
        }

        function markKnown() {
            toggleLearned(filteredVocab[currentIndex].word, true);
            nextCard();
        }

        function markUnknown() {
            toggleLearned(filteredVocab[currentIndex].word, false);
            nextCard();
        }

        // Render list mode
        function renderList(container) {
            let html = '<div class="vocab-list">';
            
            filteredVocab.forEach(item => {
                const isLearned = learnedWords[item.word];
                html += `
                    <div class="vocab-item ${isLearned ? 'learned' : ''}">
                        <div class="vocab-german">
                            ${item.word}
                            <span class="vocab-type">${item.type}</span>
                        </div>
                        <div class="vocab-details">${getDetails(item)}</div>
                        <div class="vocab-translation">
                            ${getTranslationLabel()}: ${item[currentLanguage]}
                        </div>
                        <div class="vocab-actions">
                            ${!isLearned ? 
                                `<button class="action-btn mark-learned" onclick='toggleLearned("${item.word}", true)'>✅ Als gelernt markieren</button>` :
                                `<button class="action-btn mark-unlearned" onclick='toggleLearned("${item.word}", false)'>❌ Als ungelernt markieren</button>`
                            }
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Render quiz mode - VERBESSERTE VERSION
        function renderQuiz(container) {
            if (currentIndex >= filteredVocab.length) {
                container.innerHTML = `
                    <div class="quiz-container">
                        <div class="quiz-score">
                            🎉 Quiz abgeschlossen! 🎉<br><br>
                            Ergebnis: ${quizScore.correct} von ${quizScore.total} richtig<br>
                            (${Math.round(quizScore.correct / quizScore.total * 100)}%)
                        </div>
                        <button class="flashcard-btn" onclick="restartQuiz()" style="display: block; margin: 20px auto;">Quiz neu starten</button>
                    </div>
                `;
                return;
            }

            const item = filteredVocab[currentIndex];
            const options = generateQuizOptions(item);
            
            // Bestimme Frage und Antworten basierend auf Richtung
            const question = isReversed ? item[currentLanguage] : item.word;
            const correctAnswer = isReversed ? item.word : item[currentLanguage];
            const questionLang = isReversed ? getLanguageName() : 'Deutsch';
            const answerLang = isReversed ? 'Deutsch' : getLanguageName();
            
            container.innerHTML = `
                <div class="quiz-container">
                    <div class="quiz-score">Frage ${currentIndex + 1} von ${filteredVocab.length} | Richtig: ${quizScore.correct}/${quizScore.total}</div>
                    <div class="quiz-question">
                        <div class="quiz-word">${question}</div>
                        <p style="text-align: center; color: #666; margin-bottom: 20px;">Was bedeutet das auf ${answerLang}?</p>
                        <div class="quiz-options" id="quizOptions">
                            ${options.map((opt, idx) => `
                                <div class="quiz-option" data-answer="${opt}" onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${correctAnswer.replace(/'/g, "\\'")}', ${idx})">${opt}</div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function generateQuizOptions(correctItem) {
            // Bestimme, aus welcher Sprache die Optionen kommen sollen
            const answerLanguage = isReversed ? 'word' : currentLanguage;
            const correctAnswer = isReversed ? correctItem.word : correctItem[currentLanguage];
            
            const options = [correctAnswer];
            const sameType = vocabData.filter(v => v.type === correctItem.type && v.word !== correctItem.word);
            
            while (options.length < 4 && sameType.length > 0) {
                const randomIndex = Math.floor(Math.random() * sameType.length);
                const randomOption = isReversed ? sameType[randomIndex].word : sameType[randomIndex][currentLanguage];
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
                sameType.splice(randomIndex, 1);
            }
            
            // If not enough same-type words, add from other types
            while (options.length < 4) {
                const randomItem = vocabData[Math.floor(Math.random() * vocabData.length)];
                const randomOption = isReversed ? randomItem.word : randomItem[currentLanguage];
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }
            
            // Shuffle options
            return options.sort(() => Math.random() - 0.5);
        }

        // KORRIGIERTE checkAnswer Funktion
        function checkAnswer(selected, correct, optionIndex) {
            const options = document.querySelectorAll('.quiz-option');
            const clickedOption = options[optionIndex];
            
            // Wenn diese Option bereits als falsch markiert wurde, ignoriere weitere Klicks darauf
            if (clickedOption.classList.contains('incorrect')) {
                return;
            }
            
            // Wenn die Frage bereits beantwortet wurde (eine grüne Antwort existiert), ignoriere weitere Klicks
            const alreadyAnswered = Array.from(options).some(opt => opt.classList.contains('correct'));
            if (alreadyAnswered) {
                return;
            }
            
            if (selected === correct) {
                // RICHTIGE Antwort - grün markieren
                quizScore.total++;
                quizScore.correct++;
                clickedOption.classList.add('correct');
                toggleLearned(filteredVocab[currentIndex].word, true);
                
                // Alle Optionen deaktivieren
                options.forEach(opt => opt.style.pointerEvents = 'none');
                
                // Nach 1,5 Sekunden automatisch zur nächsten Frage springen
                setTimeout(() => {
                    currentIndex++;
                    renderContent();
                }, 1500);
            } else {
                // FALSCHE Antwort - nur rot markieren, KEIN Score-Update
                clickedOption.classList.add('incorrect');
                
                // Nur diese falsche Option deaktivieren, andere bleiben klickbar
                clickedOption.style.pointerEvents = 'none';
                
                // Der Schüler kann weiter raten - keine automatische Anzeige der richtigen Antwort
            }
        }

        function restartQuiz() {
            currentIndex = 0;
            quizScore = {correct: 0, total: 0};
            filterVocab();
            renderContent();
        }

        // Helper functions
        function getDetails(item) {
            switch(item.type) {
                case 'Nomen':
                    return `Plural: ${item.plural}`;
                case 'Verb':
                    return `Präteritum: ${item.preterite}<br>Perfekt: ${item.perfect}`;
                default:
                    return '';
            }
        }

        function getTranslationLabel() {
            switch(currentLanguage) {
                case 'en': return '🇬🇧 English';
                case 'hu': return '🇭🇺 Magyar';
                case 'it': return '🇮🇹 Italiano';
                default: return '';
            }
        }

        function getLanguageName() {
            switch(currentLanguage) {
                case 'en': return 'Englisch';
                case 'hu': return 'Ungarisch';
                case 'it': return 'Italienisch';
                default: return '';
            }
        }

        // Initialize on load
        window.onload = init;
    </script>
