<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch-Übungen – Waldorf A2</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #f4a261 0%, #e76f51 45%, #ffb347 100%);
  min-height: 100vh;
  padding: 24px 16px 60px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.container {
  background: white;
  border-radius: 24px;
  padding: 34px 38px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 820px;
}
h1 { color: #e76f51; font-size: 2.4em; margin-bottom: 4px; text-align:center; }
.subtitle { color:#999; font-size:1em; font-weight:bold; text-align:center; margin-bottom:26px; }

/* SCREENS */
.screen { display:none; }
.screen.active { display:block; }

/* MENU */
.menu-title { font-size:1.3em; color:#e76f51; font-weight:bold; margin-bottom:14px; }
.menu-grid { display:flex; flex-direction:column; gap:9px; margin-bottom:22px; }
.mode-btn {
  background: linear-gradient(135deg,#fff3e0,#ffe0b2);
  border: 2px solid #f4a261;
  border-radius: 13px;
  padding: 14px 18px;
  cursor: pointer;
  text-align: left;
  font-size: 1.05em;
  font-weight: bold;
  color: #333;
  position: relative;
  transition: all .22s;
  font-family: Arial, Helvetica, sans-serif;
}
.mode-btn:hover { background:linear-gradient(135deg,#ffe0b2,#ffcc80); border-color:#e76f51; transform:translateX(5px); }
.mode-btn .ico { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:1.5em; }
.mode-btn .desc { font-size:.78em; color:#888; margin-top:2px; font-weight:normal; }
.badge { display:inline-block; background:#e76f51; color:white; padding:1px 9px; border-radius:18px; font-size:.68em; font-weight:bold; margin-left:7px; vertical-align:middle; }
.badge.g { background:#f4a261; }

/* GAME AREA */
.game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.stats { display:flex; gap:9px; flex-wrap:wrap; }
.stat { background:linear-gradient(135deg,#fff3e0,#ffe0b2); padding:7px 14px; border-radius:11px; border:2px solid #f4a261; text-align:center; min-width:70px; }
.stat-l { font-size:.65em; color:#aaa; text-transform:uppercase; letter-spacing:1px; font-weight:bold; }
.stat-v { font-size:1.5em; font-weight:bold; color:#e76f51; }
.mode-tag { background:#e76f51; color:white; padding:7px 16px; border-radius:18px; font-weight:bold; font-size:.88em; }

.prog-bar { width:100%; height:18px; background:#eee; border-radius:10px; overflow:hidden; margin-bottom:5px; }
.prog-fill { height:100%; background:linear-gradient(90deg,#e76f51,#ffb347); transition:width .4s; border-radius:10px; }
.prog-text { color:#aaa; font-size:.85em; font-weight:bold; margin-bottom:14px; text-align:center; }

/* CARD – sentence display */
.card {
  background: linear-gradient(135deg,#fff8f0,#fff3e0);
  border-radius: 18px;
  padding: 28px 26px;
  margin-bottom: 18px;
  border: 2px solid #f4c494;
  text-align: center;
}
.card .nr { font-size:.78em; color:#ccc; font-weight:bold; margin-bottom:8px; }
.card .sentence {
  font-size: 1.65em;
  font-weight: bold;
  color: #222;
  line-height: 1.7;
  margin-bottom: 8px;
}
.card .context {
  font-size: 1.05em;
  color: #777;
  font-style: italic;
  margin-bottom: 0;
  line-height: 1.5;
}
/* READ-ALOUD mode: bigger, clearer */
.card.read-mode .sentence { font-size:1.9em; color:#1a1a1a; }
.card.read-mode .context { font-size:1.1em; }

/* ANSWER BUTTONS */
.ans-row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:16px; }
.ans-btn {
  background: #e76f51;
  color: white;
  border: none;
  border-radius: 13px;
  padding: 13px 24px;
  font-size: 1.15em;
  font-weight: bold;
  cursor: pointer;
  transition: all .22s;
  font-family: Arial, Helvetica, sans-serif;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
.ans-btn:hover { background:#d65a3f; transform:translateY(-3px); }
.ans-btn.correct { background:#28a745 !important; color:white; }
.ans-btn.wrong { background:#dc3545 !important; color:white; }

/* SOLUTION reveal */
.solution-box {
  background: #e8f5e9;
  border-left: 4px solid #28a745;
  padding: 13px 18px;
  border-radius: 11px;
  margin-bottom: 14px;
  display: none;
  text-align: left;
  font-size: 1.05em;
  color: #1b5e20;
  font-weight: bold;
  line-height: 1.55;
}
.solution-box.visible { display:block; }

/* CONTROLS */
.ctrl-row { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
.ctrl-btn {
  background: white;
  border: 2px solid #f4a261;
  border-radius: 11px;
  padding: 10px 20px;
  color: #e76f51;
  font-size:.95em;
  font-weight:bold;
  cursor:pointer;
  transition:all .22s;
  font-family: Arial, Helvetica, sans-serif;
}
.ctrl-btn:hover { background:#fff3e0; border-color:#e76f51; transform:translateY(-2px); }
.ctrl-btn.primary { background:#e76f51; color:white; border-color:#e76f51; }
.ctrl-btn.primary:hover { background:#d65a3f; }
.ctrl-btn.secondary { color:#bbb; border-color:#ddd; }
.ctrl-btn.secondary:hover { color:#e76f51; border-color:#f4a261; }
.ctrl-btn.sol { background:#fff8e1; border-color:#ffc107; color:#856404; }
.ctrl-btn.sol:hover { background:#fff3cd; }

/* RESULT */
.result-wrap { text-align:center; padding:10px 0; }
.result-wrap .trophy { font-size:4em; animation:bounce .5s infinite alternate; }
@keyframes bounce { from{transform:translateY(0);} to{transform:translateY(-14px);} }
.result-title { font-size:2.2em; color:#e76f51; font-weight:bold; margin:16px 0 22px; }
.res-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
.res-stat { background:linear-gradient(135deg,#fff3e0,#ffe0b2); padding:16px; border-radius:13px; border:2px solid #f4a261; }
.res-stat-l { font-size:.85em; color:#aaa; font-weight:bold; margin-bottom:5px; }
.res-stat-v { font-size:2em; font-weight:bold; color:#e76f51; }

/* POINTS POPUP */
.pts-pop { position:fixed; background:linear-gradient(135deg,#28a745,#5cb85c); color:white; padding:9px 20px; border-radius:20px; font-size:1.4em; font-weight:bold; pointer-events:none; z-index:1000; animation:floatUp 1s ease forwards; }
@keyframes floatUp { to{transform:translateY(-80px);opacity:0;} }

/* CONFETTI */
.cfetti { position:fixed; z-index:999; }

/* BACK */
.back-btn { position:fixed; top:14px; left:14px; background:white; border:2px solid #f4a261; border-radius:11px; padding:8px 16px; color:#e76f51; font-weight:bold; cursor:pointer; display:none; z-index:200; font-family:Arial; }
.back-btn:hover { background:#fff3e0; }

/* MILESTONE */
.milestone { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:2000; }
.milestone-inner { text-align:center; }
.milestone-n { font-size:7em; font-weight:bold; color:#ffb347; }
.milestone-t { font-size:1.8em; color:white; font-weight:bold; margin-top:12px; }

/* SECTION divider in menu */
.menu-sep { font-size:.8em; color:#ccc; font-weight:bold; text-transform:uppercase; letter-spacing:2px; margin:14px 0 6px; border-top:1px solid #f0e0d0; padding-top:12px; }

@media(max-width:600px){
  .container{padding:20px 14px;}
  h1{font-size:1.8em;}
  .card .sentence{font-size:1.35em;}
  .ans-btn{font-size:1em;padding:11px 16px;}
}
</style>
</head>
<body>
<button class="back-btn" id="backBtn" onclick="goMenu()">← Menü</button>
<div class="container">
<h1>📖 Deutsch-Übungen</h1>
<p class="subtitle">Waldorf A2 · für schlaue Köpfe</p>

<!-- ===================== MENU ===================== -->
<div id="menuScreen" class="screen active">
  <div class="menu-title">🎯 Wähle eine Übung!</div>
  <div class="menu-grid">

    <div class="menu-sep">📍 Präpositionen</div>
    <button class="mode-btn" onclick="startMode('praep1')">
      1. Präpositionen – Wo ist das? <span class="badge">Lustig</span>
      <div class="desc">Wähle die richtige Präposition – viele witzige Sätze zum Lachen!</div>
      <span class="ico">🗺️</span>
    </button>
    <button class="mode-btn" onclick="startMode('praep2')">
      2. Präpositionen – Womit? Woher? Für wen? <span class="badge g">Vielseitig</span>
      <div class="desc">mit, aus, von, für, seit, bei, nach, zu – in echten Sätzen üben</div>
      <span class="ico">🔍</span>
    </button>
    <button class="mode-btn" onclick="startMode('praep3')">
      3. Präpositionen – Wähle passend <span class="badge">Mix</span>
      <div class="desc">Alle Präpositionen gemischt – was passt am besten?</div>
      <span class="ico">🎲</span>
    </button>

    <div class="menu-sep">⏰ Perfekt</div>
    <button class="mode-btn" onclick="startMode('perfekt')">
      4. Perfekt – haben oder sein? <span class="badge">Zeitreise</span>
      <div class="desc">Etwas schwerer: auch Zustandswechsel und knifflige Verben</div>
      <span class="ico">⏰</span>
    </button>

    <div class="menu-sep">⚡ Verben</div>
    <button class="mode-btn" onclick="startMode('verbformen')">
      5. Unregelmäßige Verben – Präsens <span class="badge g">Achtung!</span>
      <div class="desc">Nur ganze Verbformen eintippen – trennbare Verben sauber getrennt</div>
      <span class="ico">⚡</span>
    </button>
    <button class="mode-btn" onclick="startMode('modal')">
      6. Modalverben <span class="badge">Erklärsatz dabei</span>
      <div class="desc">Immer ein zweiter Satz erklärt die Situation – wähle das richtige Modalverb!</div>
      <span class="ico">💬</span>
    </button>

    <div class="menu-sep">📈 Vergleiche</div>
    <button class="mode-btn" onclick="startMode('komp1')">
      7. Komparativ &amp; Superlativ – Multiple Choice <span class="badge">Erklärsatz</span>
      <div class="desc">Vorlesen – Kinder antworten mündlich. Erklärsatz macht klar, was gesucht wird.</div>
      <span class="ico">🏆</span>
    </button>
    <button class="mode-btn" onclick="startMode('komp2')">
      8. Komparativ – Drei Dinge vergleichen <span class="badge g">Sprechen</span>
      <div class="desc">Tiger, Löwe, Gepard – bilde alle drei Vergleichsformen!</div>
      <span class="ico">🐆</span>
    </button>

    <div class="menu-sep">❌ Verneinung</div>
    <button class="mode-btn" onclick="startMode('vernein')">
      9. Verneinung – Stimmt das? <span class="badge">Lachen!</span>
      <div class="desc">Vorlesen – Kinder schütteln Kopf &amp; negieren. Lustige Sätze, auch nicht mehr / noch nicht!</div>
      <span class="ico">🚫</span>
    </button>

    <div class="menu-sep">🪞 Reflexivpronomen</div>
    <button class="mode-btn" onclick="startMode('reflex')">
      10. Reflexivpronomen – Ich auch! <span class="badge">Sprechen</span>
      <div class="desc">Vorlesen – Kinder sagen: "Ich … mich/mir auch …" Akkusativ &amp; Dativ gemischt!</div>
      <span class="ico">🪞</span>
    </button>

    <div class="menu-sep">🔄 Passiv</div>
    <button class="mode-btn" onclick="startMode('passiv')">
      11. Passiv – was wird gemacht? <span class="badge g">Einstieg</span>
      <div class="desc">Vorlesen – Kinder formen den Satz ins Passiv um. Schritt für Schritt!</div>
      <span class="ico">🔄</span>
    </button>

    <div class="menu-sep">👤 Personalpronomen</div>
    <button class="mode-btn" onclick="startMode('proakk')">
      12. Personalpronomen – Akkusativ <span class="badge">Klick!</span>
      <div class="desc">Die Mutter ruft ihre Tochter. → Die Mutter ruft _____</div>
      <span class="ico">👉</span>
    </button>
    <button class="mode-btn" onclick="startMode('prodat')">
      13. Personalpronomen – Dativ <span class="badge">Klick!</span>
      <div class="desc">Die Tochter hilft der Mutter. → Die Tochter hilft _____</div>
      <span class="ico">🤝</span>
    </button>

  </div>
</div><!-- /menuScreen -->

<!-- ===================== GAME SCREEN ===================== -->
<div id="gameScreen" class="screen">
  <div class="game-header">
    <div class="stats">
      <div class="stat"><div class="stat-l">Punkte</div><div class="stat-v" id="pts">0</div></div>
      <div class="stat"><div class="stat-l">Richtig</div><div class="stat-v" id="cor">0</div></div>
      <div class="stat"><div class="stat-l">Nr.</div><div class="stat-v" id="qnr">1</div></div>
    </div>
    <div class="mode-tag" id="modeTag">Modus</div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-text" id="progTxt">0 / 0</div>

  <div class="card" id="mainCard">
    <div class="nr" id="cardNr"></div>
    <div class="sentence" id="cardSentence"></div>
    <div class="context" id="cardContext"></div>
  </div>

  <div class="solution-box" id="solBox"></div>
  <div class="ans-row" id="ansRow"></div>

  <div class="ctrl-row">
    <button class="ctrl-btn sol" onclick="showSol()">💡 Lösung zeigen</button>
    <button class="ctrl-btn secondary" onclick="skipQ()">⏭ Weiter</button>
    <button class="ctrl-btn primary" onclick="endGame()">🏁 Fertig</button>
  </div>
</div>

<!-- ===================== RESULT SCREEN ===================== -->
<div id="resultScreen" class="screen">
  <div class="result-wrap">
    <div class="trophy">🏆</div>
    <div class="result-title">Klasse gemacht!</div>
    <div class="res-stats">
      <div class="res-stat"><div class="res-stat-l">⭐ Punkte</div><div class="res-stat-v" id="rPts">0</div></div>
      <div class="res-stat"><div class="res-stat-l">✅ Richtig</div><div class="res-stat-v" id="rCor">0</div></div>
      <div class="res-stat"><div class="res-stat-l">📋 Gesamt</div><div class="res-stat-v" id="rTot">0</div></div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn primary" onclick="replayMode()">🔄 Nochmal</button>
      <button class="ctrl-btn secondary" onclick="goMenu()">🏠 Menü</button>
    </div>
  </div>
</div>

</div><!-- /container -->
<script>
// ============================================================
// DATA
// ============================================================

const data = {

// ---- 1. PRÄPOSITIONEN – WO IST DAS?
// Regel: Ablenkoptionen sind entweder grammatikalisch falsch ODER inhaltlich absurd/komisch.
// Erklärung warum die anderen falsch sind, steht in der Lösung.
praep1: {
  title: "Präpositionen – Wo ist was?",
  type: "choice",
  items: [
    { s:"Das Buch liegt ___ dem Tisch.", opts:["auf","wegen","dank","laut"], a:"auf",
      sol:"AUF dem Tisch. Die anderen (wegen/dank/laut) sind Kausalpräpositionen – die sagen keinen Ort!" },
    { s:"Die Katze schläft ___ der Badewanne.", opts:["in","ohne","statt","trotz"], a:"in",
      sol:"IN der Badewanne. Ohne/statt/trotz sind keine Ortspräpositionen." },
    { s:"Das Gespenst hängt ___ der Tafel.", opts:["an","außerhalb","wegen","dank"], a:"an",

    { s:"Das Einhorn steht ___ der Schule und wartet.", opts:["vor","laut","zwecks","anlässlich"], a:"vor",
      sol:"VOR der Schule. laut/zwecks/anlässlich sind keine Lokalpräpositionen." },
    { s:"Der Drache schnarcht ___ der Höhle.", opts:["in","ohne","dank","gegen"], a:"in",
      sol:"IN der Höhle. Ohne/dank/gegen passen hier überhaupt nicht." },
    { s:"Das Nilpferd schläft ___ dem Schreibtisch.", opts:["unter","laut","trotz","wegen"], a:"unter",
      sol:"UNTER dem Schreibtisch. laut/trotz/wegen sind keine Lokalpräpositionen." },
    { s:"Der Affe hängt ___ dem Ast.", opts:["an","ohne","dank","zwecks"], a:"an",
      sol:"AN dem Ast – er hält sich fest. Die anderen geben keinen Ort an." },
    { s:"Die Lampe hängt ___ dem Esstisch.", opts:["über","laut","wegen","außer"], a:"über",
      sol:"ÜBER dem Esstisch. laut/wegen/außer sind keine lokalen Hängepräpositionen." },
    { s:"Das Sandwich steckt ___ meinem Buch.", opts:["in","ohne","dank","statt"], a:"in",
      sol:"IN meinem Buch – reingesteckt. Die anderen sind keine Ortspräpositionen." },
    { s:"Der Pirat schläft ___ dem Steuer.", opts:["an","laut","trotz","wegen"], a:"an",

    { s:"Das Känguru springt ___ den Zaun.", opts:["über","ohne","dank","statt"], a:"über",
      sol:"ÜBER den Zaun – drüber hinweg! ohne/dank/statt passen hier nicht." },
    { s:"Die Oma schläft ___ dem Fernseher.", opts:["vor","laut","wegen","zwecks"], a:"vor",
      sol:"VOR dem Fernseher – sie sitzt davor und nickt ein. Die anderen passen nicht." },
    { s:"Das Chamäleon sitzt ___ dem Heft – man sieht es kaum!", opts:["auf","ohne","dank","trotz"], a:"auf",
      sol:"AUF dem Heft. ohne/dank/trotz sind keine Lokalpräpositionen." },
    { s:"Der Oktopus hängt ___ der Lampe.", opts:["an","laut","wegen","außer"], a:"an",

    { s:"Die Spinne schwimmt ___ der Suppe.", opts:["in","ohne","statt","dank"], a:"in",

    { s:"Der Yeti sitzt ___ meinem Stuhl.", opts:["auf","laut","wegen","trotz"], a:"auf",
      sol:"AUF meinem Stuhl. laut/wegen/trotz passen hier nicht." },
    { s:"Das Nilpferd tanzt ___ der Bühne.", opts:["auf","ohne","dank","zwecks"], a:"auf",

    { s:"Die Prinzessin wohnt ___ dem Turm.", opts:["in","laut","trotz","wegen"], a:"in",

    { s:"Das Gespenst wohnt ___ dem Kleiderschrank.", opts:["in","ohne","statt","dank"], a:"in",

    { s:"Der Frosch sitzt ___ dem Tisch – mitten auf dem Frühstück.", opts:["auf","laut","wegen","außer"], a:"auf",

    { s:"Das Bild hängt ___ der Wand.", opts:["an","ohne","dank","trotz"], a:"an",

    { s:"Die Schildkröte rennt ___ den Tisch.", opts:["um","laut","trotz","außer"], a:"um",

    { s:"Der Riese wohnt ___ dem Wolkenkratzer.", opts:["hinter","ohne","dank","statt"], a:"hinter",

  praep3:"📍 Präpositionen III", perfekt:"⏰ Perfekt",
  verbformen:"⚡ Verbformen", modal:"💬 Modalverben",
  komp1:"📈 Komparativ I", komp2:"🐆 Komparativ II",
  vernein:"🚫 Verneinung", reflex:"🪞 Reflexiv",
  passiv:"🔄 Passiv", proakk:"👉 Pronomen Akk.",
  prodat:"🤝 Pronomen Dat."
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('backBtn').style.display = id === 'gameScreen' ? 'block' : 'none';
}

function goMenu() {
  showScreen('menuScreen');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startMode(mode) {
  state.mode = mode;
  state.items = shuffle(data[mode].items);
  state.idx = 0;
  state.pts = 0;
  state.cor = 0;
  state.attempted = 0;
  document.getElementById('modeTag').textContent = modeNames[mode];
  updateStats();
  showScreen('gameScreen');
  renderQ();
}

function replayMode() { startMode(state.mode); }

function renderQ() {
  const d = data[state.mode];
  const q = state.items[state.idx];
  const total = state.items.length;

  document.getElementById('qnr').textContent = state.idx + 1;
  document.getElementById('progFill').style.width = (state.idx / total * 100) + '%';
  document.getElementById('progTxt').textContent = state.idx + ' / ' + total + ' erledigt';

  const isRead = d.type === 'read';
  const card = document.getElementById('mainCard');
  card.className = 'card' + (isRead ? ' read-mode' : '');

  document.getElementById('cardNr').textContent = 'Aufgabe ' + (state.idx+1) + ' von ' + total;
  document.getElementById('cardSentence').textContent = q.s;
  document.getElementById('cardContext').textContent = q.c || '';

  document.getElementById('solBox').className = 'solution-box';
  document.getElementById('solBox').innerHTML = '';

  const ansRow = document.getElementById('ansRow');
  ansRow.innerHTML = '';

  if (d.type === 'choice') {
    const opts = shuffle(q.opts);
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(opt, btn, q);
      ansRow.appendChild(btn);
    });
  }
  // read-aloud: no buttons, just solution on request
}

function checkAnswer(chosen, btnEl, q) {
  state.attempted++;
  const allBtns = document.querySelectorAll('.ans-btn');
  allBtns.forEach(b => b.onclick = null);

  if (chosen === q.a) {
    btnEl.classList.add('correct');
    state.cor++;
    state.pts += 10;
    playSound(true);
    showPop('+10');
    updateStats();
    setTimeout(nextQ, 900);
  } else {
    btnEl.classList.add('wrong');
    // highlight correct
    allBtns.forEach(b => { if (b.textContent === q.a) b.classList.add('correct'); });
    playSound(false);
    showSol();
    updateStats();
    setTimeout(nextQ, 1600);
  }
}

function showSol() {
  const q = state.items[state.idx];
  const box = document.getElementById('solBox');
  box.innerHTML = '✅ ' + (q.sol || q.a);
  box.classList.add('visible');
}

function nextQ() {
  if (state.idx + 1 >= state.items.length) { endGame(); return; }
  state.idx++;
  renderQ();
  if (state.idx > 0 && state.idx % 5 === 0) showMilestone(state.idx);
}

function skipQ() {
  state.items.push(state.items[state.idx]);
  state.idx++;
  if (state.idx >= state.items.length) { endGame(); return; }
  renderQ();
}

function endGame() {
  document.getElementById('rPts').textContent = state.pts;
  document.getElementById('rCor').textContent = state.cor;
  document.getElementById('rTot').textContent = state.items.length;
  showScreen('resultScreen');
  document.getElementById('backBtn').style.display = 'none';
  playFanfare();
  confetti();
}

function updateStats() {
  document.getElementById('pts').textContent = state.pts;
  document.getElementById('cor').textContent = state.cor;
}

function playSound(ok) {
  try {
    const c = new AudioContext();
    const o = c.createOscillator();
    const g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = ok ? 880 : 220;
    o.type = ok ? 'sine' : 'sawtooth';
    g.gain.setValueAtTime(.2, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.01, c.currentTime + .3);
    o.start(); o.stop(c.currentTime + .3);
  } catch(e){}
}

function playFanfare() {
  try {
    const c = new AudioContext();
    [523,659,784,1047].forEach((f,i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.value = f;
      g.gain.setValueAtTime(.15, c.currentTime + i*.15);
      g.gain.exponentialRampToValueAtTime(.01, c.currentTime + i*.15 + .25);
      o.start(c.currentTime + i*.15); o.stop(c.currentTime + i*.15 + .3);
    });
  } catch(e){}
}

function showPop(txt) {
  const p = document.createElement('div');
  p.className = 'pts-pop';
  p.textContent = txt;
  p.style.left = (30 + Math.random()*40) + '%';
  p.style.top = '30%';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1000);
}

function showMilestone(n) {
  const ov = document.createElement('div');
  ov.className = 'milestone';
  ov.innerHTML = '<div class="milestone-inner"><div class="milestone-n">' + n + '</div><div class="milestone-t">🎉 ' + n + ' Aufgaben erledigt!</div></div>';
  document.body.appendChild(ov);
  playFanfare(); confetti();
  setTimeout(() => ov.remove(), 2200);
}

function confetti() {
  const cols = ['#e76f51','#f4a261','#ffb347','#28a745','#17a2b8','#a78bfa','#f0abfc'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'cfetti';
    c.style.left = Math.random()*100+'vw';
    c.style.top = '-10px';
    c.style.background = cols[Math.floor(Math.random()*cols.length)];
    c.style.borderRadius = Math.random()>.5 ? '50%' : '3px';
    const sz = (Math.random()*10+5)+'px';
    c.style.width = c.style.height = sz;
    document.body.appendChild(c);
    const a = c.animate([
      {transform:'translateY(0) rotate(0)',opacity:1},
      {transform:'translateY(100vh) rotate('+Math.floor(Math.random()*720)+'deg)',opacity:0}
    ], {duration: 2000+Math.random()*1500, easing:'ease-out'});
    a.onfinish = () => c.remove();
  }
}
</script>
