<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel & Fälle Champion 🏆</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1f3a;
            --primary-light: #132d52;
            --accent: #1a6fb5;
            --accent-glow: #3a9de0;
            --indefinite: #f5a623;
            --indefinite-glow: #ffc55a;
            --success: #2ecf8a;
            --error: #ff5e6a;
            --warning: #ffa94d;
            --bg-dark: #06121f;
            --bg-card: #0d2240;
            --text: #e0f4ff;
            --text-muted: #7ab8e0;
            --gold: #ffd700;
            --possessive: #1a4d7a;
            --possessive-glow: #4db3ff;
            --relative: #1a3a7a;
            --relative-glow: #6fb3ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(160deg, #06121f 0%, #0a1e36 40%, #081528 70%, #06121f 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        /* Bach ripple background */
        .ripples { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(58, 157, 224, 0.12);
            animation: rippleOut 8s ease-out infinite;
        }
        @keyframes rippleOut {
            0% { transform: scale(0.2); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        .shimmer {
            position: absolute;
            width: 200px; height: 3px;
            background: linear-gradient(90deg, transparent, rgba(58,157,224,0.3), transparent);
            animation: shimmerFlow 6s ease-in-out infinite;
        }
        @keyframes shimmerFlow {
            0% { transform: translateX(-200px) translateY(0) rotate(-10deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(110vw) translateY(30px) rotate(-10deg); opacity: 0; }
        }

        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; padding-top: 10px; }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #4db3ff, #a8d8ff, #4db3ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 4s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes shimmerText { to { background-position: 200% center; } }
        .subtitle { color: var(--text-muted); font-size: 1.05rem; }

        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .menu-card {
            background: linear-gradient(135deg, rgba(13,34,64,0.95) 0%, rgba(10,24,45,0.95) 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(58,157,224,0.25);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .mode-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; margin-bottom: 20px; color: var(--accent-glow); }
        .mode-buttons { display: flex; flex-direction: column; gap: 12px; }
        .mode-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 1px solid rgba(58,157,224,0.3);
            border-radius: 15px;
            padding: 18px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
        }
        .mode-btn:hover {
            transform: translateX(8px);
            box-shadow: 0 4px 20px rgba(26,111,181,0.35);
            border-color: var(--accent-glow);
            background: linear-gradient(135deg, var(--primary-light) 0%, #1a3d6e 100%);
        }
        .mode-btn .mode-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
        .mode-btn .mode-desc { font-size: 0.83rem; color: var(--text-muted); margin-top: 4px; font-weight: 400; }
        .mode-badge { display: inline-block; background: linear-gradient(135deg, #1a5a9e, #3a9de0); color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; margin-left: 8px; }
        .mode-badge.new-badge { background: linear-gradient(135deg, #1a7a4a, #2ecf8a); }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
        .stats-bar { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-item { background: var(--bg-card); padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(58,157,224,0.2); text-align: center; min-width: 90px; }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--accent-glow); }
        .streak-fire { display: inline-block; animation: flame 0.5s ease infinite alternate; }
        @keyframes flame { from { transform: scale(1); } to { transform: scale(1.2); } }

        .progress-bar { background: rgba(13,34,64,0.8); border-radius: 10px; height: 18px; overflow: hidden; margin-bottom: 25px; border: 1px solid rgba(58,157,224,0.2); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-glow)); transition: width 0.5s ease; box-shadow: 0 0 8px rgba(58,157,224,0.5); }
        .progress-text { text-align: center; margin-top: 6px; color: var(--text-muted); font-size: 0.88rem; }

        .mode-indicator { background: linear-gradient(135deg, var(--accent), var(--accent-glow)); color: white; padding: 8px 20px; border-radius: 20px; font-weight: 700; font-size: 0.88rem; }
        .mode-indicator.preposition { background: linear-gradient(135deg, #0d4080, #1a6fb5); }
        .mode-indicator.definite { background: linear-gradient(135deg, #1a5fa0, #3a9de0); }
        .mode-indicator.indefinite { background: linear-gradient(135deg, #7a4a00, var(--indefinite)); }
        .mode-indicator.negation { background: linear-gradient(135deg, #8a1a20, var(--error)); }
        .mode-indicator.possessive { background: linear-gradient(135deg, #0a3055, #1a6fb5); }
        .mode-indicator.relative { background: linear-gradient(135deg, #1a2a7a, #4d7bff); }

        .sentence-box {
            background: linear-gradient(135deg, rgba(13,34,64,0.95), rgba(8,20,42,0.98));
            border-radius: 20px;
            padding: 38px 30px;
            margin-bottom: 28px;
            border: 1px solid rgba(58,157,224,0.25);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 60px rgba(26,111,181,0.07);
            text-align: center;
        }
        .sentence { font-family: 'Fredoka', sans-serif; font-size: 1.75rem; line-height: 2.6; margin-bottom: 10px; }
        .word { display: inline-block; margin: 0 4px; }
        .article-slot {
            display: inline-block;
            min-width: 90px;
            padding: 7px 14px;
            background: rgba(10,31,58,0.9);
            border: 2px solid rgba(58,157,224,0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            color: var(--text-muted);
        }
        .article-slot:hover { border-color: var(--accent-glow); transform: scale(1.05); }
        .article-slot.selected { border-color: var(--accent-glow); background: rgba(26,111,181,0.25); box-shadow: 0 0 18px rgba(58,157,224,0.4); }
        .article-slot.correct { background: linear-gradient(135deg, #1a7a4a, #2ecf8a); color: white; border-color: var(--success); animation: correctPulse 0.5s ease; }
        .article-slot.wrong { animation: shake 0.5s ease; border-color: var(--error); }
        @keyframes correctPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .preposition-word { color: var(--accent-glow); font-weight: 700; }
        .relative-base { color: #6fb3ff; font-weight: 700; font-size: 1.75rem; }
        .possessive-context { color: #ffc55a; font-weight: 700; font-size: 0.85rem; font-family: 'Quicksand', sans-serif; display: block; margin-bottom: 5px; }

        .hint-box { background: rgba(26,111,181,0.1); border-left: 3px solid var(--accent); padding: 12px 18px; border-radius: 10px; margin-bottom: 22px; display: none; }
        .hint-text { color: var(--accent-glow); font-weight: 600; font-size: 0.95rem; }

        .article-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 22px; }
        .article-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 13px 22px;
            color: var(--text);
            font-family: 'Fredoka', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 78px;
        }
        .article-btn:hover { transform: translateY(-4px); box-shadow: 0 7px 22px rgba(26,111,181,0.4); border-color: var(--accent-glow); background: linear-gradient(135deg, var(--primary-light), #1a3d6e); }
        .article-btn:active { transform: translateY(-1px); }
        .article-btn.definite { border-color: var(--accent); }
        .article-btn.indefinite { border-color: var(--indefinite); }
        .article-btn.indefinite:hover { border-color: var(--indefinite-glow); }
        .article-btn.negation { border-color: var(--error); }
        .article-btn.negation:hover { border-color: #ff8080; }
        .article-btn.possessive-full { border-color: var(--possessive-glow); font-size: 1rem; min-width: 90px; }
        .article-btn.possessive-full:hover { border-color: #80ccff; }
        .article-btn.relative-btn { border-color: #6fb3ff; }
        .article-btn.relative-btn:hover { border-color: #a0d0ff; }

        .control-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .control-btn {
            background: var(--primary);
            border: 1px solid rgba(58,157,224,0.3);
            border-radius: 12px;
            padding: 11px 22px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover { border-color: var(--accent-glow); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(26,111,181,0.3); }
        .control-btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-glow)); border-color: var(--accent-glow); }
        .control-btn.primary:hover { box-shadow: 0 5px 20px rgba(58,157,224,0.5); }
        .control-btn.secondary { background: transparent; border-color: var(--text-muted); color: var(--text-muted); }
        .control-btn.secondary:hover { border-color: var(--accent-glow); color: var(--text); }

        .points-popup { position: fixed; background: linear-gradient(135deg, var(--success), #6eefc0); color: white; padding: 9px 18px; border-radius: 20px; font-family: 'Fredoka', sans-serif; font-size: 1.4rem; font-weight: 700; pointer-events: none; z-index: 1000; animation: floatUp 1s ease forwards; box-shadow: 0 5px 18px rgba(46,207,138,0.5); }
        .points-popup.streak-bonus { background: linear-gradient(135deg, #c89000, var(--gold)); color: var(--primary); }
        @keyframes floatUp { to { transform: translateY(-80px); opacity: 0; } }

        .result-card { background: var(--bg-card); border-radius: 20px; padding: 40px; border: 1px solid rgba(58,157,224,0.25); box-shadow: 0 10px 40px rgba(0,0,0,0.4); text-align: center; }
        .result-title { font-family: 'Fredoka', sans-serif; font-size: 2.5rem; background: linear-gradient(135deg, var(--accent-glow), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 28px; }
        .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; margin-bottom: 28px; }
        .result-stat { background: var(--primary); padding: 18px; border-radius: 14px; border: 1px solid rgba(58,157,224,0.2); }
        .result-stat-label { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 7px; }
        .result-stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.9rem; color: var(--accent-glow); }
        .player-name-input { width: 100%; max-width: 380px; margin: 18px auto; padding: 13px; background: var(--primary); border: 2px solid rgba(58,157,224,0.3); border-radius: 12px; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: 1.05rem; text-align: center; display: block; }
        .player-name-input:focus { outline: none; border-color: var(--accent-glow); }

        .leaderboard { margin-top: 28px; }
        .leaderboard-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--accent-glow); margin-bottom: 16px; }
        .leaderboard-entry { display: flex; justify-content: space-between; align-items: center; background: var(--primary); padding: 13px 18px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(58,157,224,0.15); transition: all 0.3s ease; }
        .leaderboard-entry:hover { transform: translateX(4px); border-color: var(--accent); }
        .leaderboard-rank { font-size: 1.2rem; width: 46px; }
        .leaderboard-name { flex: 1; font-weight: 600; }
        .leaderboard-score { color: var(--accent-glow); font-weight: 700; margin-right: 12px; }
        .leaderboard-time { color: var(--text-muted); font-size: 0.88rem; }

        .back-btn { position: fixed; top: 18px; left: 18px; background: var(--primary); border: 1px solid rgba(58,157,224,0.3); border-radius: 12px; padding: 9px 18px; color: var(--text); cursor: pointer; transition: all 0.3s ease; z-index: 100; display: none; font-family: 'Quicksand', sans-serif; font-weight: 600; }
        .back-btn:hover { border-color: var(--accent-glow); transform: translateX(-4px); }

        .milestone-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn 0.5s ease; }
        .milestone-content { text-align: center; }
        .milestone-number { font-family: 'Fredoka', sans-serif; font-size: 8rem; background: linear-gradient(135deg, var(--gold), #ffe880); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .milestone-text { font-size: 2rem; color: var(--text); margin-top: 18px; }
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 1999; }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .sentence { font-size: 1.25rem; line-height: 2.2; }
            .article-btn { font-size: 0.95rem; padding: 11px 15px; min-width: 62px; }
            .result-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="ripples" id="ripples"></div>
    <button class="back-btn" id="backBtn" onclick="goToMenu()">← Zurück</button>

    <div class="container">
        <header>
            <h1>Artikel & Fälle Champion 🏆</h1>
            <p class="subtitle">Meistere deutsche Artikel, Pronomen und Fälle spielend!</p>
        </header>

        <div id="startScreen" class="screen active">
            <div class="menu-card">
                <h2 class="mode-title">🎮 Wähle deinen Spielmodus</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="startGame('preposition')">
                        <div>Präpositionen & Artikel</div>
                        <div class="mode-desc">Welcher Artikel folgt nach Präpositionen? (in, an, auf, zu...)</div>
                        <span class="mode-icon">🎯</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('definite')">
                        <div>Bestimmte Artikel</div>
                        <div class="mode-desc">Der, die, das in allen vier Fällen</div>
                        <span class="mode-icon">📌</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('indefinite')">
                        <div>Unbestimmte Artikel <span class="mode-badge">+Plural</span></div>
                        <div class="mode-desc">Ein, eine – und kein Artikel im Plural</div>
                        <span class="mode-icon">✨</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('negation')">
                        <div>Verneinung (kein)</div>
                        <div class="mode-desc">Kein, keine in allen vier Fällen</div>
                        <span class="mode-icon">🚫</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('possessive')">
                        <div>Possessivpronomen <span class="mode-badge">SCHWER</span></div>
                        <div class="mode-desc">Mein, dein, sein... – vollständige Form wählen</div>
                        <span class="mode-icon">💎</span>
                    </button>
                    <button class="mode-btn" onclick="startGame('relative')">
                        <div>Relativpronomen <span class="mode-badge new-badge">NEU</span></div>
                        <div class="mode-desc">Der/die/das als Relativpronomen – alle Fälle und mit Präpositionen</div>
                        <span class="mode-icon">🔗</span>
                    </button>
                </div>
            </div>
            <div class="menu-card">
                <h2 class="mode-title">🏅 Top 5 Bestenliste</h2>
                <div id="menuLeaderboard"></div>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="mode-indicator" id="modeIndicator">Spielmodus</div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-label">Punkte</div>
                        <div class="stat-value" id="points">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Serie</div>
                        <div class="stat-value" id="streak">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Zeit</div>
                        <div class="stat-value" id="timer">0:00</div>
                    </div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0 Sätze gelöst</div>

            <div class="hint-box" id="hintBox">
                <div class="hint-text" id="hintText"></div>
            </div>

            <div class="sentence-box">
                <div class="sentence" id="sentence"></div>
            </div>

            <div class="article-buttons" id="articleButtons"></div>

            <div class="control-buttons">
                <button class="control-btn secondary" onclick="skipSentence()">⏭️ Überspringen</button>
                <button class="control-btn primary" onclick="endGame()">🏁 Beenden</button>
            </div>
        </div>

        <div id="resultScreen" class="screen">
            <div class="result-card">
                <div class="result-title">🎉 Gratulation!</div>
                <div class="result-stats">
                    <div class="result-stat"><div class="result-stat-label">Punkte</div><div class="result-stat-value" id="finalPoints">0</div></div>
                    <div class="result-stat"><div class="result-stat-label">Zeit</div><div class="result-stat-value" id="finalTime">0:00</div></div>
                    <div class="result-stat"><div class="result-stat-label">Beste Serie</div><div class="result-stat-value" id="bestStreak">0</div></div>
                    <div class="result-stat"><div class="result-stat-label">Genauigkeit</div><div class="result-stat-value" id="accuracy">0%</div></div>
                </div>
                <input type="text" class="player-name-input" id="playerName" placeholder="Dein Name..." maxlength="20">
                <div class="control-buttons">
                    <button class="control-btn primary" onclick="saveScore()">💾 Speichern</button>
                    <button class="control-btn secondary" onclick="playAgain()">🔄 Nochmal</button>
                    <button class="control-btn secondary" onclick="goToMenu()">🏠 Menü</button>
                </div>
                <div class="leaderboard" id="resultLeaderboard"></div>
            </div>
        </div>
    </div>

    <script>
    // ==================== DATA ====================

    const articles = {
        definite: {
            nominativ: { m: 'der', f: 'die', n: 'das', pl: 'die' },
            akkusativ: { m: 'den', f: 'die', n: 'das', pl: 'die' },
            dativ:    { m: 'dem', f: 'der', n: 'dem', pl: 'den' },
            genitiv:  { m: 'des', f: 'der', n: 'des', pl: 'der' }
        },
        indefinite: {
            nominativ: { m: 'ein', f: 'eine', n: 'ein', pl: '' },
            akkusativ: { m: 'einen', f: 'eine', n: 'ein', pl: '' },
            dativ:    { m: 'einem', f: 'einer', n: 'einem', pl: '' },
            genitiv:  { m: 'eines', f: 'einer', n: 'eines', pl: '' }
        },
        negation: {
            nominativ: { m: 'kein', f: 'keine', n: 'kein', pl: 'keine' },
            akkusativ: { m: 'keinen', f: 'keine', n: 'kein', pl: 'keine' },
            dativ:    { m: 'keinem', f: 'keiner', n: 'keinem', pl: 'keinen' },
            genitiv:  { m: 'keines', f: 'keiner', n: 'keines', pl: 'keiner' }
        },
        // Relativpronomen = fast wie bestimmter Artikel, außer Genitiv und Dativ Plural
        relative: {
            nominativ: { m: 'der', f: 'die', n: 'das', pl: 'die' },
            akkusativ: { m: 'den', f: 'die', n: 'das', pl: 'die' },
            dativ:    { m: 'dem', f: 'der', n: 'dem', pl: 'denen' },
            genitiv:  { m: 'dessen', f: 'deren', n: 'dessen', pl: 'deren' }
        }
    };

    // Possessivpronomen: base stems
    const possStems = {
        'ich': 'mein', 'du': 'dein', 'er': 'sein', 'sie': 'ihr',
        'es': 'sein', 'wir': 'unser', 'ihr': 'euer', 'sie-pl': 'ihr', 'Sie': 'Ihr'
    };

    function getPossForm(person, gender, kasus) {
        const base = possStems[person];
        const endings = {
            nominativ: { m: '', f: 'e', n: '', pl: 'e' },
            akkusativ: { m: 'en', f: 'e', n: '', pl: 'e' },

        };

        if (base === 'euer' && ending !== '') return 'eur' + ending;
        return base + ending;
    }

    function getPossButtonSet(person) {
        const base = possStems[person];

            return base + e;
        });

    function createRipples() {
        const container = document.getElementById('ripples');
        // Static ripple circles
        for (let i = 0; i < 8; i++) {
            const r = document.createElement('div');
            r.className = 'ripple';
            const size = 80 + i * 60;
            r.style.width = r.style.height = size + 'px';
            r.style.left = (10 + Math.random() * 80) + '%';
            r.style.top = (10 + Math.random() * 80) + '%';
            r.style.marginLeft = r.style.marginTop = (-size/2) + 'px';
            r.style.animationDelay = (i * 1.2) + 's';
            r.style.animationDuration = (6 + i * 0.8) + 's';
            container.appendChild(r);
        }
        // Shimmer lines
        for (let i = 0; i < 5; i++) {
            const s = document.createElement('div');
            s.className = 'shimmer';
            s.style.top = (15 + i * 18) + '%';
            s.style.animationDelay = (i * 1.5) + 's';
            s.style.animationDuration = (5 + i * 1.2) + 's';
            container.appendChild(s);
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('backBtn').style.display = id === 'gameScreen' ? 'block' : 'none';
    }

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // ==================== GAME FLOW ====================

    function startGame(mode) {
        gameState = {
            mode, points: 0, streak: 0, bestStreak: 0,
            currentSentence: null, selectedSlot: null,
            remainingSentences: shuffle(sentences[mode]),
            solvedSentences: [], startTime: Date.now(), timerInterval: null,
            correctAnswers: 0, totalAttempts: 0
        };
        const modeLabels = {
            preposition: 'Präpositionen',
            definite: 'Bestimmte Artikel',
            indefinite: 'Unbestimmte Artikel',
            negation: 'Verneinung (kein)',
            possessive: 'Possessivpronomen',
            relative: 'Relativpronomen'
        };
        const ind = document.getElementById('modeIndicator');
        ind.textContent = modeLabels[mode];
        ind.className = 'mode-indicator ' + mode;
        updateStats(); updateProgress();
        setupArticleButtons();
        loadNextSentence();
        startTimer();
        showScreen('gameScreen');
    }

    function startTimer() {
        clearInterval(gameState.timerInterval);
        gameState.timerInterval = setInterval(() => {
            const e = Math.floor((Date.now() - gameState.startTime) / 1000);
            document.getElementById('timer').textContent = `${Math.floor(e/60)}:${(e%60).toString().padStart(2,'0')}`;
        }, 1000);
    }

    // ==================== BUTTONS ====================

    function setupArticleButtons() {
        const container = document.getElementById('articleButtons');
        container.innerHTML = '';

        if (gameState.mode === 'preposition' || gameState.mode === 'definite') {
            ['der','die','das','dem','den','des'].forEach(art => makeBtn(container, art, 'definite', art));
        } else if (gameState.mode === 'indefinite') {
            // Include plural option (kein Artikel)
            ['ein','eine','einen','einem','einer','eines','(Plural: —)'].forEach(art => {
                const val = art === '(Plural: —)' ? '' : art;
                makeBtn(container, art, 'indefinite', val);
            });
        } else if (gameState.mode === 'negation') {
            ['kein','keine','keinen','keinem','keiner','keines'].forEach(art => makeBtn(container, art, 'negation', art));
        } else if (gameState.mode === 'possessive') {
            // Buttons are generated per sentence in renderSentence
        } else if (gameState.mode === 'relative') {
            // Relativpronomen buttons – show all possible forms
            ['der','die','das','dem','den','des','denen','dessen','deren'].forEach(art => makeBtn(container, art, 'relative-btn', art));
        }
    }

    function makeBtn(container, label, cls, value) {
        const btn = document.createElement('button');
        btn.className = 'article-btn ' + cls;
        btn.textContent = label;
        btn.onclick = () => selectArticle(value);
        container.appendChild(btn);
    }

    // ==================== RENDER ====================

    function loadNextSentence() {
        if (gameState.remainingSentences.length === 0) { endGame(); return; }
        gameState.currentSentence = gameState.remainingSentences[0];
        gameState.selectedSlot = null;
        document.getElementById('hintBox').style.display = 'none';
        renderSentence();
        updateProgress();
    }

    function renderSentence() {
        const s = gameState.currentSentence;
        const sentenceDiv = document.getElementById('sentence');
        sentenceDiv.innerHTML = '';

        const makeSlot = () => {
            const slot = document.createElement('span');
            slot.className = 'article-slot';
            slot.id = 'slot-0';
            slot.textContent = '___';
            slot.onclick = () => { gameState.selectedSlot = 0; slot.classList.add('selected'); sounds.select(); };
            return slot;
        };

        if (gameState.mode === 'preposition') {
            const [before, prep, noun, after, gender, kasus] = s;
            if (before) addWord(sentenceDiv, before + ' ');
            addWord(sentenceDiv, prep + ' ', 'preposition-word');
            sentenceDiv.appendChild(makeSlot());
            addWord(sentenceDiv, ' ' + noun + ' ');
            if (after) addWord(sentenceDiv, after);

        } else if (gameState.mode === 'possessive') {
            const [before, person, noun, after, gender, kasus] = s;
            // Show the person label as context hint
            const personLabels = {
                'ich':'(ich)', 'du':'(du)', 'er':'(er)', 'sie':'(sie/ihr)',
                'es':'(es)', 'wir':'(wir)', 'ihr':'(ihr)', 'sie-pl':'(sie)', 'Sie':'(Sie)'
            };
            if (before) addWord(sentenceDiv, before + ' ');
            const ctx = document.createElement('span');
            ctx.className = 'possessive-context';
            ctx.textContent = personLabels[person] + ':';
            sentenceDiv.appendChild(ctx);
            sentenceDiv.appendChild(makeSlot());
            addWord(sentenceDiv, ' ' + noun + ' ');
            if (after) addWord(sentenceDiv, after);

            // Generate possessive-specific buttons
            const container = document.getElementById('articleButtons');
            container.innerHTML = '';
            const forms = getPossButtonSet(person);
            forms.forEach(f => makeBtn(container, f, 'possessive-full', f));
            // Also add a "keine Endung" form that matches the base
            // (already included as first item with '' ending)

        } else if (gameState.mode === 'relative') {
            const [before, antGender, relKasus, after, prep] = s;
            if (before) addWord(sentenceDiv, before + ' ');
            if (prep) addWord(sentenceDiv, prep + ' ', 'preposition-word');
            sentenceDiv.appendChild(makeSlot());
            addWord(sentenceDiv, ' ' + after);

        } else {
            // definite, indefinite, negation
            const [before, noun, after, gender, kasus] = s;
            if (before) addWord(sentenceDiv, before + ' ');
            sentenceDiv.appendChild(makeSlot());
            addWord(sentenceDiv, ' ' + noun + ' ');
            if (after) addWord(sentenceDiv, after);
        }
    }

    function addWord(parent, text, cls) {
        const span = document.createElement('span');
        span.className = 'word' + (cls ? ' ' + cls : '');
        span.textContent = text;
        parent.appendChild(span);
    }

    // ==================== ANSWER LOGIC ====================

    function getCorrectAnswer() {
        const s = gameState.currentSentence;
        if (gameState.mode === 'preposition') {
            const [,,, , gender, kasus] = s;
            return articles.definite[kasus][gender];
        } else if (gameState.mode === 'possessive') {
            const [, person, , , gender, kasus] = s;
            return getPossForm(person, gender, kasus);
        } else if (gameState.mode === 'relative') {
            const [, antGender, relKasus, , prep] = s;
            // Relativpronomen has special dative plural and genitiv forms
            const relTable = {
                nominativ: { m:'der', f:'die', n:'das', pl:'die' },
                akkusativ: { m:'den', f:'die', n:'das', pl:'die' },
                dativ:     { m:'dem', f:'der', n:'dem', pl:'denen' },
                genitiv:   { m:'dessen', f:'deren', n:'dessen', pl:'deren' }
            };
            return relTable[relKasus][antGender];
        } else {
            const gender = s[3]; const kasus = s[4];
            if (gameState.mode === 'indefinite' && gender === 'pl') return '';
            return articles[gameState.mode][kasus][gender];
        }
    }

    function selectArticle(art) {
        gameState.totalAttempts++;
        const correct = getCorrectAnswer();
        const slot = document.getElementById('slot-0');
        if (!slot) return;

        if (art === correct) {
            slot.textContent = art || '–';
            slot.classList.remove('selected'); slot.classList.add('correct');
            gameState.correctAnswers++; gameState.streak++;
            if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak;
            const pts = 10 + (gameState.streak > 1 ? Math.min(gameState.streak - 1, 5) * 5 : 0);
            gameState.points += pts;
            showPointsPopup(pts, gameState.streak > 1);
            sounds.correct(); updateStats();
            if ([10,25,50,75,100].includes(gameState.solvedSentences.length + 1)) {
                showMilestone(gameState.solvedSentences.length + 1);
            }
            gameState.solvedSentences.push(gameState.remainingSentences.shift());
            setTimeout(loadNextSentence, 800);
        } else {
            slot.classList.add('wrong');
            gameState.streak = 0; updateStats(); sounds.wrong();
            document.getElementById('hintBox').style.display = 'block';
            document.getElementById('hintText').textContent = `Richtig wäre: „${correct || '(kein Artikel)'}"`;
            setTimeout(() => { slot.classList.remove('wrong'); slot.classList.remove('selected'); }, 500);
        }
    }

    function skipSentence() {
        gameState.streak = 0; updateStats();
        const s = gameState.remainingSentences.shift();
        gameState.remainingSentences.push(s);
        loadNextSentence();
    }

    // ==================== STATS & UI ====================

    function updateStats() {
        document.getElementById('points').textContent = gameState.points;
        const el = document.getElementById('streak');
        el.innerHTML = gameState.streak > 2 ? `<span class="streak-fire">🔥</span>${gameState.streak}` : gameState.streak;
    }

    function updateProgress() {
        const total = gameState.solvedSentences.length + gameState.remainingSentences.length;
        const solved = gameState.solvedSentences.length;
        const pct = total > 0 ? (solved / total) * 100 : 0;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = `${solved} / ${total} Sätze gelöst`;
    }

    function showPointsPopup(pts, isStreak) {
        const popup = document.createElement('div');
        popup.className = 'points-popup' + (isStreak ? ' streak-bonus' : '');
        popup.textContent = isStreak ? `+${pts} 🔥 Combo!` : `+${pts}`;
        popup.style.left = (Math.random() * 60 + 20) + '%';
        popup.style.top = '40%';
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 1000);
    }

    function showMilestone(n) {
        const overlay = document.createElement('div');
        overlay.className = 'milestone-overlay';
        overlay.innerHTML = `<div class="milestone-content"><div class="milestone-number">${n}</div><div class="milestone-text">🎉 Wow, ${n} Sätze!</div></div>`;
        document.body.appendChild(overlay);
        sounds.milestone(); createConfetti();
        setTimeout(() => overlay.remove(), 2500);
    }

    function createConfetti() {
        const colors = ['#1a6fb5','#3a9de0','#4db3ff','#ffd700','#2ecf8a','#ff5e6a','#6fb3ff'];
        for (let i = 0; i < 100; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-10px';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            const sz = (Math.random() * 10 + 5) + 'px';
            c.style.width = c.style.height = sz;
            document.body.appendChild(c);
            const anim = c.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                { transform: `translateY(100vh) rotate(${Math.random()*720}deg)`, opacity: 0 }
            ], { duration: Math.random() * 2000 + 2000, easing: 'ease-out' });
            anim.onfinish = () => c.remove();
        }
    }

    // ==================== RESULT ====================

    function endGame() {
        clearInterval(gameState.timerInterval);
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        document.getElementById('finalPoints').textContent = gameState.points;
        document.getElementById('finalTime').textContent = `${Math.floor(elapsed/60)}:${(elapsed%60).toString().padStart(2,'0')}`;
        document.getElementById('bestStreak').textContent = gameState.bestStreak;
        document.getElementById('accuracy').textContent = gameState.totalAttempts > 0
            ? Math.round((gameState.correctAnswers / gameState.totalAttempts) * 100) + '%' : '0%';
        showScreen('resultScreen');
        document.getElementById('backBtn').style.display = 'none';
        updateResultLeaderboard();
        sounds.milestone(); createConfetti();
    }

    // ==================== LEADERBOARD ====================

    function loadLeaderboard() {
        try { return JSON.parse(localStorage.getItem('artikelChampionBachLeaderboard') || '[]'); } catch(e) { return []; }
    }
    function saveLeaderboard(b) {
        try { localStorage.setItem('artikelChampionBachLeaderboard', JSON.stringify(b)); } catch(e) {}
    }

    function saveScore() {
        const name = document.getElementById('playerName').value.trim() || 'Anonym';
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        const modeNames = { preposition:'Präpositionen', definite:'Bestimmte Artikel', indefinite:'Unbestimmte Artikel', negation:'Verneinung', possessive:'Possessivpronomen', relative:'Relativpronomen' };
        const entry = { name, points: gameState.points, time: elapsed, mode: modeNames[gameState.mode], date: new Date().toLocaleDateString('de-DE') };
        const board = loadLeaderboard();
        board.push(entry); board.sort((a,b) => b.points - a.points);
        saveLeaderboard(board.slice(0, 10));
        updateResultLeaderboard(); updateMenuLeaderboard();
        document.getElementById('playerName').disabled = true;
        event.target.disabled = true; event.target.textContent = '✓ Gespeichert!';
    }

    function formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

    function renderBoard(container, entries, limit) {
        if (entries.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted);text-align:center;">Noch keine Einträge. Sei die Erste!</p>';
            return;
        }
        container.innerHTML = entries.slice(0, limit).map((e,i) =>
            `<div class="leaderboard-entry">
                <span class="leaderboard-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'}${'</span>'}
                <span class="leaderboard-name">${e.name}</span>
                <span class="leaderboard-score">${e.points} Pkt</span>
                <span class="leaderboard-time">${formatTime(e.time)}</span>
            </div>`
        ).join('');
    }

    function updateMenuLeaderboard() {
        renderBoard(document.getElementById('menuLeaderboard'), loadLeaderboard(), 5);
    }
    function updateResultLeaderboard() {
        const c = document.getElementById('resultLeaderboard');
        c.innerHTML = '<h3 class="leaderboard-title">🏅 Bestenliste</h3>';
        const board = loadLeaderboard();
        const inner = document.createElement('div');
        renderBoard(inner, board, 5);
        c.appendChild(inner);
    }

    function playAgain() {
        document.getElementById('playerName').disabled = false;
        document.getElementById('playerName').value = '';
        const btn = document.querySelector('#resultScreen .control-btn.primary');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
        startGame(gameState.mode);
    }

    function goToMenu() {
        clearInterval(gameState.timerInterval);
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('playerName').disabled = false;
        document.getElementById('playerName').value = '';
        const btn = document.querySelector('#resultScreen .control-btn.primary');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
        showScreen('startScreen'); updateMenuLeaderboard();
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
