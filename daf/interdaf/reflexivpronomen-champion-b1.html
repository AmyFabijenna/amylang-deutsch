<html lang="de">

<title>Reflexiv-Champion B1</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gelb:#ffd93d; --gelb-hell:#fff6c7; --gelb-tief:#f4b400;
  --pink:#ff4fa3; --pink-hell:#ffd6ea; --pink-tief:#d81b7a;
  --text:#4a1033; --weiss:#ffffff; --gruen:#2fbf71; --rot:#e5484d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif;color:var(--text);min-height:100vh;
  background:linear-gradient(135deg,var(--gelb) 0%,#ffe680 35%,var(--pink-hell) 70%,var(--pink) 100%);
  background-attachment:fixed;padding:16px;
}
.blase{position:fixed;border-radius:50%;opacity:.25;pointer-events:none;animation:schweben 14s ease-in-out infinite;z-index:0}
@keyframes schweben{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(1.1)}}
.wrap{max-width:780px;margin:0 auto;position:relative;z-index:1}
header{text-align:center;margin:10px 0 18px}
h1{font-family:'Fredoka',sans-serif;font-size:clamp(28px,6vw,44px);color:var(--pink-tief);
  text-shadow:3px 3px 0 var(--gelb),5px 5px 0 rgba(216,27,122,.25);letter-spacing:.5px}
.untertitel{font-weight:700;margin-top:4px;color:var(--text);opacity:.85}
.karte{background:rgba(255,255,255,.92);border-radius:24px;padding:22px;
  box-shadow:0 10px 30px rgba(216,27,122,.25);border:3px solid var(--pink-hell)}
.modi{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.modus{cursor:pointer;border:none;text-align:left;border-radius:20px;padding:16px 18px;
  background:linear-gradient(135deg,var(--gelb-hell),var(--weiss));border:3px solid var(--gelb);
  font-family:inherit;color:var(--text);transition:transform .15s,box-shadow .15s}
.modus:nth-child(even){background:linear-gradient(135deg,var(--pink-hell),var(--weiss));border-color:var(--pink)}
.modus:hover{transform:translateY(-3px) rotate(-.5deg);box-shadow:0 8px 18px rgba(216,27,122,.25)}
.modus .emoji{font-size:28px}
.modus .titel{font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;margin:4px 0 2px}
.modus .info{font-size:14px;opacity:.8}
.leiste{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.knopf-klein{cursor:pointer;border:none;background:var(--pink);color:#fff;font-family:'Fredoka',sans-serif;
  font-size:15px;padding:8px 16px;border-radius:999px;box-shadow:0 3px 0 var(--pink-tief)}
.knopf-klein:active{transform:translateY(2px);box-shadow:none}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--gelb);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.stat.pink{background:var(--pink);color:#fff}
.fortschritt{height:14px;background:var(--gelb-hell);border-radius:999px;overflow:hidden;margin-bottom:16px;border:2px solid var(--gelb)}
.balken{height:100%;width:0;background:linear-gradient(90deg,var(--gelb-tief),var(--pink));transition:width .4s}
.regel{background:var(--gelb-hell);border-left:6px solid var(--pink);border-radius:14px;padding:12px 14px;
  font-size:15px;line-height:1.5;margin-bottom:16px}
.regel b{color:var(--pink-tief)}
.hinweis{text-align:center;font-weight:700;color:var(--pink-tief);font-size:15px;min-height:22px}
.satz{font-family:'Fredoka',sans-serif;font-size:clamp(21px,4.6vw,28px);text-align:center;line-height:1.5;
  margin:10px 0 22px;font-weight:500}
.luecke{display:inline-block;min-width:70px;border-bottom:4px dashed var(--pink);color:var(--pink-tief);font-weight:700;padding:0 4px}
.luecke.voll{border-bottom:4px solid var(--gruen);color:var(--gruen)}
.optionen{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{cursor:pointer;font-family:'Fredoka',sans-serif;font-size:20px;font-weight:600;min-width:72px;
  padding:12px 18px;border-radius:16px;border:3px solid var(--gelb-tief);background:var(--gelb);color:var(--text);
  box-shadow:0 4px 0 var(--gelb-tief);transition:transform .1s}
.opt:nth-child(even){background:var(--pink-hell);border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.falsch{background:#ffd3d4;border-color:var(--rot);box-shadow:0 4px 0 var(--rot);opacity:.55;animation:wackeln .4s;cursor:not-allowed}
.opt.richtig{background:var(--gruen);border-color:#1f9a59;color:#fff;box-shadow:0 4px 0 #1f9a59}
.optionen.saetze{flex-direction:column;align-items:stretch}
.optionen.saetze .opt{font-size:18px;text-align:left;font-weight:500;line-height:1.4}
@keyframes wackeln{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.rueckmeldung{min-height:52px;text-align:center;margin-top:18px;font-weight:700;font-size:16px;line-height:1.4}
.rueckmeldung.gut{color:var(--gruen)}
.rueckmeldung.nochmal{color:var(--rot)}
.ende{text-align:center}
.pokal{font-size:80px;animation:huepfen 1.2s ease-in-out infinite}
@keyframes huepfen{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.ende h2{font-family:'Fredoka',sans-serif;color:var(--pink-tief);font-size:30px;margin:6px 0}
.ende p{font-size:17px;margin:6px 0}
.fehlerliste{text-align:left;margin:16px 0;background:var(--pink-hell);border-radius:14px;padding:12px 16px}
.fehlerliste li{margin:6px 0 6px 18px;line-height:1.4}
.knopfreihe{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.versteckt{display:none}
.konfetti{position:fixed;width:10px;height:14px;top:-20px;z-index:5;pointer-events:none;animation:fallen linear forwards}
@keyframes fallen{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:480px){.karte{padding:16px}.opt{font-size:18px;min-width:60px;padding:10px 14px}}
</style>
</head>
<body>
<div class="blase" style="width:160px;height:160px;background:#fff;top:8%;left:-40px"></div>
<div class="blase" style="width:110px;height:110px;background:var(--pink);top:60%;right:-30px;animation-delay:-4s"></div>
<div class="blase" style="width:80px;height:80px;background:var(--gelb-tief);bottom:6%;left:12%;animation-delay:-8s"></div>

<div class="wrap">
  <header>
    <h1>✨ Reflexiv-Champion ✨</h1>
    <div class="untertitel">Reflexivpronomen · Niveau B1 · klicken, nicht tippen!</div>
  </header>

  <!-- MENÜ -->
  <div id="menue" class="karte">
    <p style="text-align:center;margin-bottom:16px;font-weight:600">Wähle eine Übung. Klick auf die richtige Lösung – ist sie richtig, geht es automatisch weiter. Ist sie falsch, probierst du noch einmal.</p>
    <div class="modi" id="modi"></div>
  </div>

  <!-- SPIEL -->
  <div id="spiel" class="karte versteckt">
    <div class="leiste">
      <button class="knopf-klein" onclick="zumMenue()">← Menü</button>
      <div class="stats">
        <span class="stat" id="zaehler">1 / 40</span>
        <span class="stat pink" id="punkte">⭐ 0</span>
        <span class="stat" id="serie">🔥 0</span>
      </div>
    </div>
    <div class="fortschritt"><div class="balken" id="balken"></div></div>
    <div class="regel" id="regel"></div>
    <div class="hinweis" id="hinweis"></div>
    <div class="satz" id="satz"></div>
    <div class="optionen" id="optionen"></div>
    <div class="rueckmeldung" id="rueckmeldung"></div>
  </div>

  <!-- ENDE -->
  <div id="ende" class="karte ende versteckt">
    <div class="pokal">🏆</div>
    <h2 id="endeTitel">Geschafft!</h2>
    <p id="endeText"></p>
    <div id="endeFehler"></div>
    <div class="knopfreihe">
      <button class="knopf-klein" onclick="starte(aktuellerModus)">🔁 Nochmal</button>
      <button class="knopf-klein" style="background:var(--gelb-tief);box-shadow:0 3px 0 #b88400;color:var(--text)" onclick="zumMenue()">Andere Übung</button>
    </div>
  </div>
</div>

 ["Wir treffen ___ heute im Café.","uns","treffen"],
 ["Wir treffen ___ heute unsere Lehrerin.","—","treffen"],
 ["Du erinnerst ___ gern an deine Kindheit.","dich","erinnern"],
 ["Du erinnerst ___ deinen Freund an seinen Termin.","—","erinnern"],
 ["Die Ärztin beruhigt ___ den Patienten.","—","beruhigen"],
 ["Nach dem Streit beruhigt die Ärztin ___ langsam.","sich","beruhigen"],
 ["Ich langweile ___ in diesem Film.","mich","langweilen"],
 ["Der Film langweilt ___ die Zuschauer.","—","langweilen"],
 ["Ihr freut ___ über den Schnee.","euch","freuen"],
 ["Das Geschenk freut ___ meine Oma.","—","freuen"],
 ["Ich verletze ___ beim Kochen.","mich","verletzen"],
 ["Ich stelle ___ deinen Eltern vor und sage meinen Namen.","mich","vorstellen (= präsentieren)"],
 ["Ich stelle ___ ein Haus am Meer vor.","mir","vorstellen (= im Kopf sehen)"],
 ["Du ziehst ___ den Mantel an.","dir","anziehen"],
 ["Wir legen ___ in die Sonne.","uns","legen"],
 ["Die Krankenschwester legt ___ den Patienten ins Bett.","—","legen"],
 ["Bewegt ___ mehr!","euch","bewegen"],
 ["Die Musik bewegt ___ die Menschen.","—","bewegen"],
 ["Ich habe ___ die Haare schneiden lassen.","mir","schneiden lassen"],
 ["Der Friseur schneidet ___ meinem Mann die Haare.","—","schneiden"],
 ["Sie setzt ___ ans Fenster.","sich","setzen"],
 ["Er hat ___ in den letzten Jahren sehr verändert.","sich","verändern"],
 ["Der Umzug hat ___ sein Leben verändert.","—","verändern"],
 ["Ihr habt ___ eure Kinder warm angezogen.","—","anziehen"]
];
// DATA END

const MODI = {
 akk:{emoji:"🌼",titel:"Akkusativ",info:"mich · dich · sich · uns · euch",
   regel:"Hat der Satz <b>kein anderes Akkusativobjekt</b>, steht das Reflexivpronomen im <b>Akkusativ</b>: ich → <b>mich</b>, du → <b>dich</b>, er/sie/es/Sie → <b>sich</b>, wir → <b>uns</b>, ihr → <b>euch</b>, sie → <b>sich</b>.",
   items:()=>akkusativ.map(x=>({typ:"luecke",satz:x[0],loes:x[1],hinweis:x[2],opts:AKK}))},
 dat:{emoji:"🌸",titel:"Dativ",info:"mir · dir · sich · uns · euch",
   regel:"Gibt es schon ein <b>Akkusativobjekt</b> (die Zähne, ein Fahrrad, das …), steht das Reflexivpronomen im <b>Dativ</b>: ich → <b>mir</b>, du → <b>dir</b>, wir → <b>uns</b>, ihr → <b>euch</b>. Bei er/sie/es/Sie bleibt es <b>sich</b>.",
   items:()=>dativ.map(x=>({typ:"luecke",satz:x[0],loes:x[1],hinweis:x[2],opts:DAT}))},
 akkdat:{emoji:"⚖️",titel:"Akkusativ oder Dativ?",info:"mich oder mir? dich oder dir?",
   regel:"Frag dich: Gibt es im Satz noch ein <b>anderes Akkusativobjekt</b>? → <b>Dativ</b> (mir/dir). Gibt es keins? → <b>Akkusativ</b> (mich/dich). Nur bei ich und du sieht man den Unterschied!",
   items:()=>[...akkusativ,...dativ].map(x=>({typ:"luecke",satz:x[0],loes:x[1],hinweis:x[2],opts:ALLE}))},
 praep:{emoji:"🔗",titel:"Verben mit Präposition",info:"sich freuen auf, sich ärgern über …",
   regel:"Viele reflexive Verben haben eine <b>feste Präposition</b>. Lerne sie immer zusammen: sich interessieren <b>für</b>, sich erinnern <b>an</b>, sich kümmern <b>um</b> … Tipp: Achte auch auf den Kasus nach der Lücke (dem/der → Dativ, den/die/das → Akkusativ).",
   items:()=>praepositionen.map(x=>({typ:"luecke",satz:x[0],loes:x[1],hinweis:x[2],opts:PRAEP}))},
 stellung:{emoji:"🧩",titel:"Satzstellung",info:"Wo steht das Reflexivpronomen?",
   regel:"Das Reflexivpronomen steht <b>so weit vorne wie möglich</b>: direkt nach dem konjugierten Verb – oder, wenn das Subjekt ein Pronomen ist und hinter dem Verb steht, direkt <b>nach dem Subjekt</b>. Im Nebensatz: <b>dass er sich …</b>",
   items:()=>satzstellung.map(x=>({typ:"satz",loes:x[0],hinweis:x[3],opts:[x[0],x[1],x[2]]}))},
 ron:{emoji:"🤔",titel:"Reflexiv oder nicht?",info:"Ich wasche mich – ich wasche das Baby",
   regel:"Viele Verben können <b>reflexiv</b> oder <b>nicht reflexiv</b> sein. Tut das Subjekt etwas mit <b>sich selbst</b>? → Reflexivpronomen. Geht die Handlung auf <b>eine andere Person oder Sache</b>? → kein Reflexivpronomen: Klick auf <b>—</b>.",
   items:()=>reflexivOderNicht.map(x=>({typ:"luecke",satz:x[0],loes:x[1],hinweis:x[2],opts:MIT_STRICH}))},
 mix:{emoji:"👑",titel:"Champion-Mix",info:"50 gemischte Aufgaben aus allem",
   regel:"Alles gemischt! Lies jede Aufgabe genau: Akkusativ oder Dativ? Welche Präposition? Wo steht das Pronomen? Reflexiv oder nicht?",
   items:()=>mische(["akk","dat","praep","stellung","ron"].flatMap(k=>MODI[k].items())).slice(0,50)}
};

let aktuellerModus=null, aufgaben=[], idx=0, punkte=0, serie=0, besteSerie=0, fehlerHier=false, fehlerSaetze=[], gesperrt=false;

function mische(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $=id=>document.getElementById(id);

function baueMenue(){
  $("modi").innerHTML=Object.entries(MODI).map(([k,m])=>{
    const n=k==="mix"?50:m.items().length;
    return `<button class="modus" onclick="starte('${k}')"><div class="emoji">${m.emoji}</div><div class="titel">${m.titel}</div><div class="info">${m.info} · ${n} Aufgaben</div></button>`}).join("");
}
function zeige(id){["menue","spiel","ende"].forEach(x=>$(x).classList.toggle("versteckt",x!==id));window.scrollTo({top:0,behavior:"smooth"})}
function zumMenue(){zeige("menue")}

function starte(k){
  aktuellerModus=k; aufgaben=mische(MODI[k].items());
  idx=0;punkte=0;serie=0;besteSerie=0;fehlerSaetze=[];
  zeige("spiel"); zeigeAufgabe();
}

function satzHTML(a,gefuellt){
  const inhalt=gefuellt?(a.loes==="—"?"✓":a.loes):"&nbsp;?&nbsp;";
  return a.satz.replace("___",`<span class="luecke${gefuellt?" voll":""}">${inhalt}</span>`);
}

function zeigeAufgabe(){
  const a=aufgaben[idx]; fehlerHier=false; gesperrt=false;
  const m=MODI[a.modus||aktuellerModus];
  $("regel").innerHTML=MODI[aktuellerModus].regel;
  $("zaehler").textContent=`${idx+1} / ${aufgaben.length}`;
  $("punkte").textContent=`⭐ ${punkte}`;
  $("serie").textContent=`🔥 ${serie}`;
  $("balken").style.width=`${idx/aufgaben.length*100}%`;
  $("rueckmeldung").textContent=""; $("rueckmeldung").className="rueckmeldung";
  const box=$("optionen");
  if(a.typ==="satz"){
    $("hinweis").textContent=`Welcher Satz ist richtig? (${a.hinweis})`;
    $("satz").innerHTML="";
    box.className="optionen saetze";
    box.innerHTML=mische(a.opts).map(o=>`<button class="opt">${o}</button>`).join("");
  }else{
    $("hinweis").textContent=`(${a.hinweis})`;
    $("satz").innerHTML=satzHTML(a,false);
    box.className="optionen";
    box.innerHTML=a.opts.map(o=>`<button class="opt">${o}</button>`).join("");
  }
  [...box.children].forEach(b=>b.addEventListener("click",()=>pruefe(b,a)));
}

function pruefe(btn,a){
  if(gesperrt||btn.classList.contains("falsch"))return;
  const r=$("rueckmeldung");
  if(btn.textContent===a.loes){
    gesperrt=true; btn.classList.add("richtig");
    if(!fehlerHier){punkte++;serie++;besteSerie=Math.max(besteSerie,serie)}
    $("punkte").textContent=`⭐ ${punkte}`; $("serie").textContent=`🔥 ${serie}`;
    if(a.typ!=="satz") $("satz").innerHTML=satzHTML(a,true);
    const lob=["Super! 🎉","Richtig! 💛","Klasse! 💖","Genau so! ✨","Perfekt! 🌟","Bravo! 🌸"];
    r.className="rueckmeldung gut";
    r.textContent=fehlerHier?"Jetzt stimmt's! 👍":lob[Math.floor(Math.random()*lob.length)];
    if(serie>0&&serie%10===0&&!fehlerHier){konfetti(40);r.textContent=`${serie} richtig hintereinander! 🔥`}
    setTimeout(()=>{idx++; idx<aufgaben.length?zeigeAufgabe():beende()},1100);
  }else{
    btn.classList.add("falsch");
    if(!fehlerHier){fehlerHier=true;serie=0;$("serie").textContent="🔥 0";
      fehlerSaetze.push(a.typ==="satz"?a.loes:a.satz.replace("___",a.loes==="—"?"":a.loes).replace(/\s{2,}/g," "))}
    r.className="rueckmeldung nochmal";
    r.textContent=tipp(a,btn.textContent);
  }
}

function tipp(a,gewaehlt){
  if(a.typ==="satz")return "Noch nicht – schau, wo das Reflexivpronomen steht. Versuch's nochmal!";
  if(a.loes==="—")return "Hier tut das Subjekt etwas mit einer anderen Person oder Sache. Brauchst du wirklich ein Reflexivpronomen?";
  if(gewaehlt==="—")return "Hier macht das Subjekt etwas mit sich selbst – du brauchst ein Reflexivpronomen!";
  if(PRAEP.includes(a.loes))return "Diese Präposition passt nicht zu diesem Verb. Versuch's nochmal!";
  if(["mich","dich"].includes(gewaehlt)&&["mir","dir"].includes(a.loes))return "Es gibt schon ein Akkusativobjekt im Satz – also Dativ!";
  if(["mir","dir"].includes(gewaehlt)&&["mich","dich"].includes(a.loes))return "Es gibt kein anderes Akkusativobjekt – also Akkusativ!";
  return "Schau genau auf das Subjekt: Wer macht etwas? Versuch's nochmal!";
}

function beende(){
  $("balken").style.width="100%";
  const n=aufgaben.length, q=punkte/n;
  $("endeTitel").textContent=q===1?"Reflexiv-Champion! 👑":q>=.85?"Fantastisch!":q>=.6?"Gut gemacht!":"Weiter üben – du schaffst das!";
  $("endeText").innerHTML=`Beim ersten Versuch richtig: <b>${punkte} von ${n}</b><br>Längste Serie: <b>🔥 ${besteSerie}</b>`;
  $("endeFehler").innerHTML=fehlerSaetze.length?`<div class="fehlerliste"><b>Diese Sätze schaust du dir am besten noch einmal an:</b><ul>${fehlerSaetze.map(s=>`<li>${s}</li>`).join("")}</ul></div>`:"";
  zeige("ende"); if(q>=.85)konfetti(90);
}

function konfetti(anz){
  const farben=["#ffd93d","#ff4fa3","#f4b400","#ffd6ea","#d81b7a","#ffffff"];
  for(let i=0;i<anz;i++){const k=document.createElement("div");k.className="konfetti";
    k.style.left=Math.random()*100+"vw";k.style.background=farben[i%farben.length];
    k.style.animationDuration=(2+Math.random()*2)+"s";k.style.animationDelay=Math.random()*.5+"s";
    k.style.borderRadius=Math.random()>.5?"50%":"2px";document.body.appendChild(k);setTimeout(()=>k.remove(),4800)}
}

baueMenue();
</script>
</body>
</html>
