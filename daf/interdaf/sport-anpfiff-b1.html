<!DOCTYPE html>
<html lang="de">
<head>
<script src="/daf/interdaf/passwort.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anpfiff! – Über Sport sprechen (B1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f2ed; --card:#fffdf9; --ink:#1c1c1e; --muted:#55525c;
    --blue:#34557a; --blue-soft:#e4ebf3;
    --lilac:#5a4a7f; --lilac-soft:#ece8f3;
    --amber:#a8762f; --amber-soft:#f6ecdc;
    --rose:#9a4f60; --rose-soft:#f5e6e9;
    --night:#232744;
    --line:#e2ddd5; --radius:20px;
    --shadow:0 6px 24px rgba(40,35,60,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Lexend',system-ui,sans-serif;font-size:18px;line-height:1.65;color:var(--ink);background:var(--bg);font-weight:300}
  b,strong{font-weight:600}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  header.hero{background:linear-gradient(160deg,#1d2140 0%,#2f3560 55%,#4a3f6e 100%);color:#f4f1fa;padding:64px 0 54px;position:relative;overflow:hidden}
  header.hero::before{content:"";position:absolute;inset:0;background-image:
    radial-gradient(1.5px 1.5px at 12% 22%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 34% 70%,#fff7 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 58% 18%,#fff9 50%,transparent 51%),
    radial-gradient(1px 1px at 76% 52%,#fff6 50%,transparent 51%),
    radial-gradient(2px 2px at 88% 26%,#fffa 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 88%,#fff5 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 66% 84%,#fff7 50%,transparent 51%);}
  .hero h1{font-size:clamp(32px,5vw,52px);line-height:1.15;margin:0 0 14px;font-weight:600;position:relative}
  .hero p{font-size:20px;max-width:720px;margin:0;color:#dcd7ea;position:relative}
  .hero .tag{display:inline-block;background:#ffffff1f;border:1px solid #ffffff33;border-radius:99px;padding:4px 14px;font-size:14px;margin-bottom:18px;position:relative;letter-spacing:.03em}

  nav.top{position:sticky;top:0;z-index:20;background:#f5f2edee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav.top .wrap{scrollbar-width:none;display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
  nav.top a{white-space:nowrap;text-decoration:none;color:var(--blue);font-weight:500;font-size:15px;padding:7px 14px;border-radius:99px;background:var(--blue-soft)}
  nav.top a:hover{background:#d3deeb}

  section{padding:46px 0 12px}
  h2{font-size:30px;margin:0 0 6px;font-weight:600;color:var(--night)}
  h2 .num{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--lilac);color:#fff;font-size:20px;margin-right:12px;vertical-align:4px}
  .lead{color:var(--muted);margin:0 0 22px;max-width:780px}
  h3{font-size:21px;margin:0 0 8px;font-weight:600}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;border:1px solid var(--line)}
  .grid{display:grid;gap:18px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

  button{font-family:inherit;font-size:16px;cursor:pointer;border:none;border-radius:12px;padding:9px 16px;font-weight:500;transition:.15s}
  .btn{background:var(--blue);color:#fff}
  .btn:hover{background:#2a4664}
  .btn-soft{background:var(--blue-soft);color:var(--blue)}
  .btn-soft:hover{background:#d3deeb}
  .btn-lilac{background:var(--lilac-soft);color:var(--lilac)}
  .btn-lilac:hover{background:#ddd6ec}
  .btn-amber{background:var(--amber-soft);color:#7d5520}
  .btn-amber:hover{background:#efdfc4}
  .spk{background:transparent;padding:2px 8px;font-size:18px;color:var(--blue);border-radius:8px}
  .spk:hover{background:var(--blue-soft)}

  /* Tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .tabs button{background:#ebe6de;color:var(--ink)}
  .tabs button.on{background:var(--lilac);color:#fff}

  /* Wortschatz */
  .vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .w{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .w .de{font-weight:500;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .w .gram{font-size:14px;color:var(--muted)}
  .w .en{font-size:15px;color:var(--lilac);font-style:italic}
  .w .ex{font-size:15px;color:#3b3842;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
  .hide-en .w .en{filter:blur(6px);cursor:pointer}
  .hide-en .w .en.show{filter:none}
  .der{color:var(--blue)} .die{color:var(--rose)} .das{color:var(--amber)}

  /* Thesen */
  .these{border-left:6px solid var(--lilac)}
  .these .t{font-size:19px;font-weight:400;margin:4px 0 14px}
  .these .nr{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--lilac);font-weight:600}
  .scale{display:flex;flex-wrap:wrap;gap:8px}
  .scale button{background:#efebe4;color:var(--ink);font-size:15px}
  .scale button.on{background:var(--night);color:#fff}
  .reply{margin-top:14px;background:var(--lilac-soft);border-radius:14px;padding:12px 16px;font-size:16px;display:none}
  .reply.show{display:block}
  .reply ul{margin:6px 0 0;padding-left:20px}

  /* Redemittel */
  .stufe{border-top:6px solid var(--blue)}
  .stufe.s2{border-top-color:var(--lilac)} .stufe.s3{border-top-color:var(--rose)}
  .stufe ul{margin:8px 0 0;padding-left:0;list-style:none}
  .stufe li{padding:7px 0;border-bottom:1px solid #f0ebe3;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .stufe li:last-child{border-bottom:none}
  .stufe .lvl{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

  /* Gesprächstreppe */
  .stairs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stairs button{background:#ebe6de;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;padding:10px 16px;min-width:150px;text-align:left}
  .stairs button small{font-weight:300;font-size:13px;opacity:.85}
  .stairs button.on{background:var(--night);color:#fff}
  .stepinfo{background:var(--blue-soft);border-radius:14px;padding:12px 18px;margin-bottom:16px;color:#23344d}
  .q{display:flex;flex-direction:column;gap:10px}
  .q .frage{font-size:20px;font-weight:500;color:var(--night);display:flex;justify-content:space-between;gap:10px}
  .q .tools{display:flex;flex-wrap:wrap;gap:8px}
  .q .box{display:none;background:#f7f4ef;border-radius:12px;padding:10px 14px;font-size:16px}
  .q .box.show{display:block}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--lilac-soft);color:var(--lilac);border-radius:99px;padding:3px 12px;font-size:15px}
  .box.deeper{background:var(--rose-soft);color:#5d2d38}

  /* Übungen */
  .ex-q{padding:16px 0;border-bottom:1px solid var(--line)}
  .ex-q:last-child{border-bottom:none}
  .ex-q .s{font-size:19px;margin-bottom:10px}
  .ex-q .s .gap{display:inline-block;min-width:90px;border-bottom:2px solid var(--lilac);text-align:center;font-weight:500;color:var(--lilac)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opts button{background:#efebe4;color:var(--ink);min-width:110px}
  .opts button.right{background:var(--blue);color:#fff}
  .opts button.wrong{background:var(--rose);color:#fff}
  .opts button:disabled{cursor:default}
  .expl{display:none;margin-top:10px;font-size:16px;background:var(--amber-soft);border-radius:12px;padding:10px 14px;color:#4c3a1d}
  .expl.show{display:block}
  .score{font-weight:500;color:var(--lilac);margin-top:10px}
  .hint{font-size:15px;color:var(--muted);margin:-4px 0 10px}

  /* Spiele */
  .game-card{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;background:linear-gradient(160deg,#fffdf9,#f1edf7)}
  .game-card .big{font-size:24px;font-weight:500;color:var(--night);max-width:720px}
  .game-card .sub{color:var(--muted);font-size:16px;max-width:680px}
  .forbidden{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .forbidden span{background:var(--rose-soft);color:var(--rose);border-radius:99px;padding:3px 12px;font-size:15px;text-decoration:line-through}
  .dice{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .dice span{background:var(--night);color:#fff;border-radius:14px;padding:10px 18px;font-size:20px;font-weight:500}

  /* Gedankenexperiment */
  .story{background:linear-gradient(160deg,#272b4b,#3d3561);color:#f1eef8;border:none}
  .story h3{color:#fff}
  .story p{margin:8px 0;color:#dcd7ea}
  .story .stepbtn{background:#ffffff22;color:#fff;border:1px solid #ffffff44}
  .story .stepbtn:hover{background:#ffffff33}
  .story .part{display:none;background:#ffffff14;border-radius:14px;padding:12px 16px;margin-top:12px}
  .story .part.show{display:block}

  /* Hausübung */
  .check li{margin:6px 0}
  .note{font-size:15px;color:var(--muted)}
  footer{padding:50px 0 60px;text-align:center;color:var(--muted);font-size:14px}
  @media(max-width:600px){body{font-size:17px}.card{padding:18px}}
  /* Zauber */
  .zb .en-thought{font-size:17px;color:var(--muted);font-style:italic;margin-bottom:10px}
  .zb .de-simple{display:none;font-size:21px;font-weight:500;color:var(--night);background:var(--lilac-soft);border-radius:14px;padding:12px 16px;margin:10px 0}
  .zb .de-simple.show{display:block}
  .zb .gram-note{display:none;font-size:15px;color:var(--muted)}
  .zb .gram-note.show{display:block}
  .zb .weiter{display:none;margin-top:8px;font-size:16px;background:var(--amber-soft);border-radius:12px;padding:10px 14px;color:#4c3a1d}
  .zb .weiter.show{display:block}
  /* Satzanfang-Karten */
  .starter .st{font-size:20px;font-weight:500;color:var(--night)}
  .starter .ideas{display:none;margin-top:10px;font-size:16px;color:#3b3842}
  .starter .ideas.show{display:block}
  /* Zwei Stimmen */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
  @media(max-width:700px){.duo{grid-template-columns:1fr}}
  .voice{background:#f7f4ef;border:2px solid transparent;border-radius:16px;padding:14px 16px;cursor:pointer;transition:.15s;font-size:17px}
  .voice:hover{border-color:#d6cfe6}
  .voice.on{border-color:var(--lilac);background:var(--lilac-soft)}
  .voice .lab{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--lilac);margin-bottom:4px}
  .task{display:none;margin-top:6px}
  .task.show{display:block}
  .task .step{background:var(--blue-soft);border-radius:14px;padding:12px 16px;margin-top:10px;font-size:16px}
  .task .step.devil{background:var(--rose-soft)}
  .task .step b.t{display:block;margin-bottom:4px}
  .focus{display:inline-block;background:var(--night);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;margin-bottom:8px}
  /* Satzwerkstatt */
  .line{min-height:62px;background:#f7f4ef;border:2px dashed #d8d1c5;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
  .line.ok{border-color:var(--blue);border-style:solid;background:var(--blue-soft)}
  .line.bad{border-color:var(--rose);border-style:solid}
  .tiles{display:flex;flex-wrap:wrap;gap:8px}
  .tile{background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(40,35,60,.06);color:var(--ink);font-weight:400;font-size:17px;padding:8px 14px}
  .tile:hover{background:var(--lilac-soft)}
  .tile.used{visibility:hidden}
  .line .tile{background:var(--card)}
  .werk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .werk-fb{margin-top:12px;font-size:16px;display:none;border-radius:12px;padding:10px 14px}
  .werk-fb.show{display:block}
  .werk-fb.good{background:var(--blue-soft);color:#23344d}
  .werk-fb.try{background:var(--amber-soft);color:#4c3a1d}
  .werk-prompt{font-size:19px;margin:4px 0 2px}
  header.hero.food{background:linear-gradient(155deg,#2e1a26 0%,#4f2a3a 50%,#6e4436 100%)}
  header.hero.food::before{background-image:radial-gradient(circle at 85% 30%,#ffffff10 0,#ffffff10 90px,transparent 91px),radial-gradient(circle at 85% 30%,transparent 120px,#ffffff0c 121px,#ffffff0c 124px,transparent 125px)}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:16px 0}
  .modes button{background:var(--card);border:1px solid var(--line);color:var(--ink);text-align:left;padding:14px 16px;border-radius:16px;box-shadow:var(--shadow)}
  .modes button .ic{font-size:26px;display:block}
  .modes button b{display:block;font-size:17px}
  .modes button small{font-weight:300;color:var(--muted);font-size:14px}
  .modes button.on{background:var(--night);color:#fff;border-color:var(--night)}
  .modes button.on small{color:#d8d3e6}
  .panel-intro{background:linear-gradient(160deg,#fffdf9,#f3ece6);border-radius:var(--radius);padding:22px 26px;border:1px solid var(--line);font-size:18px}
  .panel-intro h2{margin-bottom:8px}
  .sub-h{font-size:24px;font-weight:600;color:var(--night);margin:40px 0 4px;display:flex;align-items:center;gap:10px}
  .sub-h .dot{width:12px;height:12px;border-radius:50%;background:var(--rose)}
  .country{border-top:6px solid var(--amber)}
  .country .flag{font-size:30px}
  .dish{padding:8px 0;border-bottom:1px dashed var(--line)}
  .dish:last-of-type{border-bottom:none}
  .dish b{color:var(--rose)}
  .fact{background:var(--amber-soft);border-radius:12px;padding:10px 14px;font-size:16px;margin:12px 0;color:#4c3a1d}
  .cq{font-size:16px;margin:4px 0;padding-left:22px;position:relative}
  .cq::before{content:"💬";position:absolute;left:0;font-size:14px}
  .ctabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .ctabs button{background:#ebe6de;color:var(--ink)}
  .ctabs button.on{background:var(--rose);color:#fff}
  .precise{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .pr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .pr .from{font-size:15px;color:var(--muted);text-decoration:line-through;text-decoration-color:#c9a0aa}
  .pr .to{font-size:18px;font-weight:500;color:var(--night);margin-top:4px}
  .pr .to div{margin:3px 0}
  .phr h3{color:var(--rose)}
  .order-list{counter-reset:o;margin:12px 0;padding:0;list-style:none}
  .order-list li{counter-increment:o;background:var(--blue-soft);border-radius:12px;padding:8px 14px;margin:6px 0}
  .order-list li::before{content:counter(o)". ";font-weight:600}
  .order-pool{display:flex;flex-direction:column;gap:8px}
  .order-pool button{background:#fff;border:1px solid var(--line);text-align:left;font-weight:400;color:var(--ink)}
  .order-pool button.shake{background:var(--rose-soft);animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .gen{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .gen div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:180px}
  .gen div small{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
  .gen div b{font-size:19px;color:var(--night)}
  header.hero.sport{background:linear-gradient(155deg,#121c33 0%,#22365a 55%,#3a3466 100%)}
  header.hero.sport::before{background-image:radial-gradient(ellipse at 15% -10%,#ffffff26 0,transparent 45%),radial-gradient(ellipse at 85% -10%,#ffffff26 0,transparent 45%)}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .factc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:14px;padding:12px 16px;font-size:16px}
  .factc b{display:block;color:var(--night);font-size:17px;margin-bottom:2px}
  .timer{font-size:44px;font-weight:600;color:var(--night);font-variant-numeric:tabular-nums}
  .timer.low{color:var(--rose)}
  .clues{list-style:none;padding:0;margin:8px 0;text-align:left;max-width:640px}
  .clues li{background:var(--blue-soft);border-radius:12px;padding:8px 14px;margin:6px 0;font-size:18px}
  .solution{font-size:28px;font-weight:600;color:var(--rose)}
  .press-q{list-style:none;padding:0;margin:6px 0;text-align:left;max-width:680px}
  .press-q li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:6px 0;font-size:17px}
  .press-q li::before{content:"🎤 "}
  .starters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .starters span{background:var(--lilac-soft);color:var(--lilac);border-radius:99px;padding:3px 12px;font-size:15px}
</style>
</head>
<body>
<header class="hero sport">
  <div class="wrap">
    <span class="tag">Gesprächstraining · Deutsch B1 · Thema Sport</span>
    <h1>Anpfiff!</h1>
    <p>Fußball, Gym, Formel 1, Berge, Tennis und die großen Streitfragen des Sports. Sieben Arenen, in denen du genau sagst, was du denkst – mit Leidenschaft, Argumenten und Stoppuhr.</p>
  </div>
</header>
<main class="wrap">
  <div class="modes" id="modes"></div>
  <div id="panel"></div>
</main>
<footer>Gesprächstraining Deutsch · Thema Sport · B1</footer>

<script>
/* ===== Grundbausteine ===== */
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[„“…]/g,''));u.lang='de-DE';u.rate=0.9;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('de'));if(v)u.voice=v;speechSynthesis.speak(u);}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function spk(text){const b=el('button','spk','🔊');b.title='Anhören';b.onclick=e=>{e.stopPropagation();say(text)};return b;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function subH(txt,lead){const f=document.createDocumentFragment();f.appendChild(el('div','sub-h','<span class="dot"></span>'+txt));if(lead)f.appendChild(el('p','lead',lead));return f;}
function expand(templates,opts){let out=templates.slice();Object.keys(opts||{}).forEach(k=>{const n=[];out.forEach(t=>opts[k].forEach(o=>n.push(t.split('{'+k+'}').join(o))));out=n;});return out;}

/* ===== Render-Bausteine ===== */
function rVocab(groups){
  const box=el('div'); const tabs=el('div','tabs'); const grid=el('div','vocab'); const tog=el('button','btn-lilac','Übersetzung verstecken (Selbsttest)');
  tog.style.marginBottom='14px';
  tog.onclick=()=>{grid.classList.toggle('hide-en');tog.textContent=grid.classList.contains('hide-en')?'Übersetzung zeigen':'Übersetzung verstecken (Selbsttest)';};
  function show(k){tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.textContent===k));grid.innerHTML='';
    groups[k].forEach(([art,word,gram,en,ex])=>{const c=el('div','w');
      const de=el('div','de','<span>'+(art?'<span class="'+art+'">'+art+'</span> ':'')+word+'</span>');de.appendChild(spk((art?art+' ':'')+word));c.appendChild(de);
      if(gram)c.appendChild(el('div','gram',gram));
      const e=el('div','en',en);e.onclick=()=>e.classList.toggle('show');c.appendChild(e);
      const x=el('div','ex',ex);x.appendChild(spk(ex));c.appendChild(x);grid.appendChild(c);});}
  Object.keys(groups).forEach(k=>{const b=el('button',null,k);b.onclick=()=>show(k);tabs.appendChild(b);});
  box.append(tabs,tog,grid);show(Object.keys(groups)[0]);return box;
}
function rThoughts(list){
  const g=el('div','grid g2');
  list.forEach(z=>{const c=el('div','card zb');
    c.appendChild(el('div','en-thought','💭 <b>Du willst sagen:</b> '+z.m));
    const d=el('div','de-simple',z.de);d.appendChild(spk(z.de));

const norm=s=>s.toLowerCase().replace(/[,.]/g,'').replace(/\s+/g,' ').trim();

    function rl(){line.innerHTML='';line.classList.remove('ok','bad');if(!chosen.length)line.appendChild(el('span','note','Klick auf die Bausteine …'));

      line.classList.toggle('ok',ok);line.classList.toggle('bad',!ok);fb.className='werk-fb show '+(ok?'good':'try');

      else fb.innerHTML='<b>Fast!</b> Die Wörter sind gut gewählt, nur die Reihenfolge stimmt noch nicht. Tipp: '+w.e;};
    br.onclick=()=>show(i);

const M=document.getElementById('modes'),P=document.getElementById('panel');
function showMode(i){activeTimers.forEach(s=>s());activeTimers=[];M.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',i===j));P.innerHTML='';const m=modes[i];
  P.appendChild(el('div','panel-intro','<h2>'+m.ic+' '+m.t+'</h2>'+m.intro));m.build(P);}
modes.forEach((m,i)=>{const b=el('button',null,'<span class="ic">'+m.ic+'</span><b>'+m.t+'</b><small>'+m.s+'</small>');b.onclick=()=>{showMode(i);window.scrollTo({top:M.offsetTop-10,behavior:'smooth'});};M.appendChild(b);});
showMode(0);
