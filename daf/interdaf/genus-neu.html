<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel-Training - Amy Lang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 50%, #f5f7fa 100%); 
            min-height: 100vh; 
            padding: 20px; 
            color: #2d3748; 
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2d3748; font-size: 2.2em; margin-bottom: 30px; }
        .game-area { 
            background: white; 
            border-radius: 20px; 
            padding: 40px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
        }
        .article-buttons { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .article-btn { 
            width: 130px; 
            height: 130px; 
            font-size: 2.2em; 
            font-weight: bold; 
            border: 3px solid transparent; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: all 0.2s; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.12); 
            color: #1a202c; 
        }
        .article-btn.btn-der { background: #b8d4e8; border-color: #8fc1de; }
        .article-btn.btn-der:hover:not(:disabled) { background: #9ec9e3; transform: scale(1.08); }
        .article-btn.btn-die { background: #f5c6d6; border-color: #eda5bd; }
        .article-btn.btn-die:hover:not(:disabled) { background: #f0b0c5; transform: scale(1.08); }
        .article-btn.btn-das { background: #ffd9b3; border-color: #ffc285; }
        .article-btn.btn-das:hover:not(:disabled) { background: #ffcfa0; transform: scale(1.08); }
        .article-btn:active:not(:disabled) { transform: scale(0.95); }
        .article-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .article-btn.correct { 
            animation: correctPulse 0.5s; 
            background: #9ae6b4 !important; 
            border-color: #68d391 !important; 
        }
        .article-btn.wrong { 
            animation: wrongShake 0.5s; 
            background: #fc8181 !important; 
            border-color: #f56565 !important; 
        }
        @keyframes correctPulse { 
            0%, 100% { transform: scale(1); } 
            50% { transform: scale(1.15); } 
        }
        @keyframes wrongShake { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-10px); } 
            75% { transform: translateX(10px); } 
        }
        .word-display { 
            text-align: center; 
            margin: 40px 0; 
            min-height: 100px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .current-word { font-size: 3em; font-weight: bold; color: #2d3748; }
        .stats-bar { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        .stat-box { 
            background: #f7fafc; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid #e2e8f0; 
        }
        .stat-value { font-size: 1.8em; font-weight: bold; color: #2d3748; }
        .stat-label { font-size: 0.9em; color: #718096; margin-top: 5px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .btn { 
            padding: 15px 30px; 
            font-size: 1.1em; 
            font-weight: bold; 
            border: 2px solid #cbd5e0; 
            border-radius: 25px; 
            background: white; 
            color: #2d3748; 
            cursor: pointer; 
            transition: all 0.3s; 
        }
        .btn:hover { 
            background: #f7fafc; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.1); 
        }
        .btn-start { 
            background: linear-gradient(135deg, #9ae6b4 0%, #68d391 100%); 
            border-color: #68d391; 
            color: #1a202c; 
        }
        .btn-start:hover { 
            background: linear-gradient(135deg, #68d391 0%, #48bb78 100%); 
        }
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            text-align: center; 
            max-width: 500px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); 
        }
        .modal-content h2 { color: #2d3748; margin-bottom: 20px; font-size: 2.2em; }
        .modal-content p { font-size: 1.2em; margin: 12px 0; color: #4a5568; }
        .modal-content input { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.2em; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            background: #f7fafc; 
            color: #2d3748; 
            margin: 20px 0; 
            text-align: center; 
        }
        .modal-content input:focus { outline: none; border-color: #9ae6b4; }
        .highscore-section { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            margin-top: 30px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
        }
        .highscore-section h3 { 
            color: #2d3748; 
            margin-bottom: 20px; 
            font-size: 1.8em; 
            text-align: center; 
        }
        .highscore-list { display: grid; gap: 10px; }
        .highscore-item { 
            background: #f7fafc; 
            padding: 15px; 
            border-radius: 10px; 
            display: grid; 
            grid-template-columns: 50px 1fr 120px 120px; 
            gap: 15px; 
            align-items: center; 
            border: 1px solid #e2e8f0; 
        }
        .highscore-rank { font-weight: bold; font-size: 1.3em; color: #2d3748; text-align: center; }
        .highscore-rank.gold { color: #d69e2e; }
        .highscore-rank.silver { color: #718096; }
        .highscore-rank.bronze { color: #c05621; }
        .highscore-name { font-weight: bold; color: #2d3748; }
        .progress-bar { 
            width: 100%; 
            height: 16px; 
            background: #e2e8f0; 
            border-radius: 8px; 
            margin-bottom: 30px; 
            overflow: hidden; 
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #9ae6b4 0%, #68d391 100%); 
            width: 0%; 
            transition: width 0.3s ease; 
        }
        .streak-indicator { 
            text-align: center; 
            font-size: 1.4em; 
            color: #d69e2e; 
            margin-bottom: 20px; 
            font-weight: bold; 
            min-height: 35px; 
        }
        .streak-fire { animation: fireFlicker 0.5s infinite; }
        @keyframes fireFlicker { 
            0%, 100% { text-shadow: 0 0 10px #fbd38d, 0 0 20px #f6ad55; } 
            50% { text-shadow: 0 0 20px #fbd38d, 0 0 30px #f6ad55; } 
        }
        .word-count-info { 
            text-align: center; 
            color: #718096; 
            font-size: 0.9em; 
            margin-top: 20px; 
        }
        @media (max-width: 600px) { 
            .stats-bar { grid-template-columns: repeat(2, 1fr); } 
            .article-btn { width: 100px; height: 100px; font-size: 1.8em; } 
            .current-word { font-size: 2.2em; } 
            .highscore-item { grid-template-columns: 40px 1fr 80px; } 
            .highscore-item > div:last-child { display: none; } 
        }
    </style>
</head>

    </div>

            <p><strong>Zeit:</strong> <span id="finalTime">0:00</span></p>
            <p><strong>Punkte:</strong> <span id="finalPoints">0</span></p>
            <p id="recordMessage" style="color: #d69e2e; font-weight: bold; margin-top: 15px;"></p>
            <input type="text" id="playerName" placeholder="Dein Name (optional)" maxlength="20">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-start" onclick="saveScore()">💾 Speichern</button>
                <button class="btn" onclick="closeModal()">Schließen</button>
            </div>
        </div>
    </div>

let gameActive = false;
let currentNounIndex = 0;
let shuffledNouns = [];
let correctCount = 0;
let wrongCount = 0;
let timerInterval = null;
let seconds = 0;
let currentStreak = 0;
let bestStreak = 0;
let wrongArticleClicked = null;

function shuffleArray(array) {
    let shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function startGame() {
    gameActive = true;
    currentNounIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    seconds = 0;
    currentStreak = 0;
    bestStreak = 0;
    wrongArticleClicked = null;
    
    document.getElementById('correct').textContent = '0';
    document.getElementById('wrong').textContent = '0';
    document.getElementById('timer').textContent = '0:00';
    document.getElementById('points').textContent = '0';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('streakDisplay').textContent = '';
    
    shuffledNouns = shuffleArray(nouns);
    
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    
    showNextWord();
    startTimer();
}

function stopGame() {
    if (!gameActive) return;
    gameActive = false;
    clearInterval(timerInterval);
    
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
    
    showGameOverModal();
}

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(function() {
        seconds++;
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        document.getElementById('timer').textContent = minutes + ':' + (secs < 10 ? '0' : '') + secs;
        updatePoints();
    }, 1000);
}

function showNextWord() {
    if (!gameActive) return;
    
    if (currentNounIndex >= shuffledNouns.length) {
        stopGame();
        return;
    }
    
    wrongArticleClicked = null;
    const buttons = document.querySelectorAll('.article-btn');
    buttons.forEach(btn => {
        btn.disabled = false;
        btn.classList.remove('correct', 'wrong');
    });
    
    document.getElementById('currentWord').textContent = shuffledNouns[currentNounIndex].word;
    document.getElementById('progressBar').style.width = ((currentNounIndex + 1) / shuffledNouns.length * 100) + '%';
}

function checkAnswer(selected) {
    if (!gameActive) return;
    
    const currentNoun = shuffledNouns[currentNounIndex];
    const buttons = document.querySelectorAll('.article-btn');
    const clickedButton = Array.from(buttons).find(btn => btn.textContent === selected.toUpperCase());
    
    if (selected === currentNoun.article) {
        // Richtige Antwort
        if (wrongArticleClicked === null) {
            // Beim ersten Versuch richtig
            correctCount++;
            currentStreak++;
            if (currentStreak > bestStreak) bestStreak = currentStreak;
            document.getElementById('correct').textContent = correctCount;
        } else {
            // Nach einem Fehler richtig - zählt als falsch
            wrongCount++;
            currentStreak = 0;
            document.getElementById('wrong').textContent = wrongCount;
        }
        
        // Grüne Markierung
        clickedButton.classList.add('correct');
        
        // Alle Buttons deaktivieren
        buttons.forEach(btn => btn.disabled = true);
        
        updateStreakDisplay();
        updatePoints();
        
        // Automatisch zum nächsten Wort nach kurzer Verzögerung
        setTimeout(() => {
            currentNounIndex++;
            showNextWord();
        }, 800);
        
    } else {
        // Falsche Antwort
        // Markiere den ersten Fehler
        if (wrongArticleClicked === null) {
            wrongArticleClicked = selected;
        }
        
        // JEDER falsche Klick wird rot markiert
        clickedButton.classList.add('wrong');
        
        // Button deaktivieren
        clickedButton.disabled = true;
        
        // Rote Markierung entfernen nach Animation
        setTimeout(() => {
            clickedButton.classList.remove('wrong');
        }, 500);
    }
}

function updateStreakDisplay() {
    const display = document.getElementById('streakDisplay');
    if (currentStreak >= 3) {
        display.innerHTML = '🔥 ' + currentStreak + ' in Folge richtig! 🔥';
        display.classList.add('streak-fire');
    } else {
        display.textContent = '';
        display.classList.remove('streak-fire');
    }
}

function calculatePoints() {
    return Math.max(0, Math.round(correctCount * 100 - seconds + bestStreak * 50));
}

function updatePoints() {
    document.getElementById('points').textContent = calculatePoints();
}

function showGameOverModal() {
    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;
    
    document.getElementById('finalCorrect').textContent = correctCount;
    document.getElementById('finalWrong').textContent = wrongCount;
    document.getElementById('finalTime').textContent = minutes + ':' + (secs < 10 ? '0' : '') + secs;
    document.getElementById('finalPoints').textContent = calculatePoints();
    
    const highscores = getHighscores();
    const isTopTen = highscores.length < 10 || calculatePoints() > highscores[highscores.length - 1].points;
    document.getElementById('recordMessage').textContent = isTopTen ? '🎉 Top 10!' : '';
    
    document.getElementById('playerName').value = '';
    document.getElementById('gameOverModal').classList.add('active');
}

function closeModal() {
    document.getElementById('gameOverModal').classList.remove('active');
    document.getElementById('currentWord').textContent = 'Klicke auf "Spiel starten"';
}

function saveScore() {
    const name = document.getElementById('playerName').value.trim() || 'Anonym';
    const score = {
        name: name,
        correct: correctCount,
        wrong: wrongCount,
        time: seconds,
        points: calculatePoints(),
        streak: bestStreak
    };
    
    let highscores = getHighscores();
    highscores.push(score);
    highscores.sort((a, b) => b.points - a.points);
    highscores = highscores.slice(0, 10);
    
    localStorage.setItem('articleHighscoresA1B1', JSON.stringify(highscores));
    displayHighscores();
    closeModal();
}

function getHighscores() {
    return JSON.parse(localStorage.getItem('articleHighscoresA1B1') || '[]');
}

function displayHighscores() {
    const highscores = getHighscores();
    const container = document.getElementById('highscoreList');
    
    if (highscores.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#718096;">Noch keine Rekorde!</p>';
        return;
    }
    
    let html = '';
    for (let i = 0; i < highscores.length; i++) {
        const score = highscores[i];
        const minutes = Math.floor(score.time / 60);
        const secs = score.time % 60;
        const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        
        html += `
            <div class="highscore-item">
                <div class="highscore-rank ${rankClass}">${medal} #${i + 1}</div>
                <div class="highscore-name">${score.name}</div>
                <div style="color:#48bb78;">${score.correct}✓ / <span style="color:#fc8181;">${score.wrong}✗</span></div>
                <div style="color:#2d3748;text-align:right;">
                    <strong>${score.points} Pkt</strong><br>
                    <small>${minutes}:${secs < 10 ? '0' : ''}${secs}</small>
                </div>
            </div>
        `;
    }
    
    container.innerHTML = html;
}

displayHighscores();

document.addEventListener('keydown', function(e) {
    if (!gameActive) return;
    if (e.key === '1') checkAnswer('der');
    else if (e.key === '2') checkAnswer('die');
    else if (e.key === '3') checkAnswer('das');
});
    </script>
