let af='all';

function render(){
  const q=document.getElementById('srch').value.toLowerCase().trim();
  const o=document.getElementById('out');
  if(af==='tricky'){o.innerHTML=renderTricky(q);return;}
  const gs=af==='all'?G:G.filter(g=>g.id===af);
  let h='',total=0;
  for(const g of gs){
    const es=g.e.filter(e=>!q||e.v.toLowerCase().includes(q)||e.x.toLowerCase().includes(q));
    if(!es.length)continue;
    total+=es.length;
    h+=`<div class="ps"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="cb ${g.c}">${g.l}</span><span style="font-size:12px;color:var(--color-text-secondary)">${es.length} Einträge</span></div>`;
    for(const e of es){
      h+=`<div class="vr"><div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap"><span class="vn">${e.v}</span>${e.t?'<span class="tb">⚡ mehrere Preps</span>':''}</div><div class="ex">${e.x}</div></div>`;
    }
    h+='</div>';
  }
  if(q&&total>0)h=`<p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">${total} Treffer für „${q}"</p>`+h;
  o.innerHTML=h||`<p style="font-size:14px;color:var(--color-text-secondary)">Kein Treffer für „${q}".</p>`;
}

function renderTricky(q){
  const ps=q?TR.filter(p=>p.v.toLowerCase().includes(q)):TR;
  if(!ps.length)return`<p style="font-size:14px;color:var(--color-text-secondary)">Kein Treffer.</p>`;
  let h=`<p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">Verben, die je nach Präposition verschiedene Bedeutungen haben (${ps.length} Gruppen)</p>`;
  for(const p of ps){
    h+=`<div class="ps"><div style="font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px">${p.v}</div>`;
    for(const c of p.p){
      h+=`<div class="vr"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="cb ${c.c}" style="font-size:11px">${c.p}</span><span style="font-size:13px;color:var(--color-text-secondary)">${c.m}</span></div><div class="ex">${c.x}</div></div>`;
    }
    h+='</div>';
  }
  return h;
}

function setFilter(id){
  af=id;
  document.querySelectorAll('.fbn').forEach(b=>b.classList.toggle('fa',b.dataset.id===id));
  document.getElementById('srch').value='';
  render();
}

const bar=document.getElementById('filterBar');
const fi=[{id:'all',l:'Alle'},{id:'tricky',l:'⚡ Tückisch'},...G.map(g=>({id:g.id,l:g.l}))];
bar.innerHTML=fi.map(f=>`<button class="fbn${f.id==='all'?' fa':''}" data-id="${f.id}" onclick="setFilter('${f.id}')">${f.l}</button>`).join('');
render();
</script>
