<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rechtschreib-Insel</title>
<style>
:root{--ink:#2d2a4a;--accent:#6c5ce7;--ok:#2ecc71;--bad:#ff6b6b;--sun:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#dff1ff 0%,#fff6e6 60%);min-height:100vh;user-select:none;-webkit-user-select:none}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 60px}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 rgba(60,50,120,.10);padding:18px;margin-bottom:16px}
h1,h2,h3{margin:0 0 8px}
h2{font-size:24px}
.btn{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:20px;padding:14px 24px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 5px 0 #4b3fb8}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4b3fb8}
.btn.alt{background:var(--sun);color:#4a3b00;box-shadow:0 5px 0 #d9a93a}
.btn.green{background:var(--ok);box-shadow:0 5px 0 #1e9c52}
.btn.small{font-size:16px;padding:9px 16px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:default}
.icon{font:inherit;font-size:20px;border:0;background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.owl{font-size:64px;line-height:1}
.grow{flex:1;min-width:180px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.10)}
.bar{height:16px;border-radius:99px;background:#e6e2ff;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#8e7dff,#ff7ab8);border-radius:99px;transition:width .4s}
.small{font-size:14px;opacity:.8}
.grid{display:grid;gap:12px}
.themes{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.modes{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.chip{border:4px solid transparent;border-radius:20px;padding:10px 8px;text-align:center;cursor:pointer;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08);font-weight:800}
.chip .ic{font-size:34px}
.chip.sel{border-color:var(--accent);background:#f3f0ff}
.chip .mini{height:8px;border-radius:9px;background:#eee;margin-top:6px;overflow:hidden}
.chip .mini i{display:block;height:100%;background:var(--ok)}
.mode{border:0;border-radius:22px;padding:16px;text-align:left;cursor:pointer;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.10);font:inherit}
.mode:active{transform:translateY(3px)}
.mode .mi{font-size:42px}
.mode b{font-size:19px;display:block}
.hl{color:#e8590c}
.good .hl,.bad .hl{color:inherit;text-decoration:underline}
.game{max-width:900px;margin:0 auto;padding:12px 14px 60px}
.gtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gstars{font-weight:900;font-size:20px;background:#fff;border-radius:99px;padding:4px 12px}
.theme-chip{display:inline-block;color:#fff;font-weight:800;border-radius:99px;padding:4px 14px;margin-bottom:6px}
.stage{background:#fff;border-radius:28px;box-shadow:0 6px 0 rgba(60,50,120,.10);padding:20px 14px 24px;text-align:center}
.qemoji{font-size:clamp(60px,15vw,110px);line-height:1.1}
.qword{font-size:clamp(40px,10vw,76px);font-weight:900;letter-spacing:2px;margin:6px 0 10px;word-break:break-word}
.qsent{font-size:clamp(22px,5vw,34px);font-weight:700;margin:8px 0 6px;line-height:1.5}
.gap{display:inline-block;min-width:1.5em;border-bottom:6px solid var(--accent);color:var(--accent);margin:0 4px;text-align:center}
.gap.wide{min-width:3.2em}
.gap.good{color:#fff;background:var(--ok);border-radius:10px;border-bottom-color:var(--ok);padding:0 8px}
.gap.bad{color:#fff;background:var(--bad);border-radius:10px;border-bottom-color:var(--bad);padding:0 8px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.speak,.tool{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:16px;padding:10px 16px;cursor:pointer;background:#e9e5ff;color:#3d2fa0}
.tool{background:#fff3cf;color:#6b4e00}
.hintbox{min-height:26px;font-size:20px;font-weight:700;color:#6b4e00}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.opt{font:inherit;font-weight:900;font-size:clamp(34px,8vw,58px);min-width:110px;padding:12px 26px;border:0;border-radius:24px;background:#f0edff;color:#3d2fa0;cursor:pointer;box-shadow:0 6px 0 #cfc8ff}
.opt:active{transform:translateY(3px)}
.cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.wcard{font:inherit;font-weight:900;font-size:clamp(28px,6.5vw,46px);padding:14px 26px;border:0;border-radius:22px;background:#f0edff;color:#3d2fa0;cursor:pointer;box-shadow:0 6px 0 #cfc8ff}
.wcard:active{transform:translateY(3px)}
.opt.good,.wcard.good,.opt.bad,.wcard.bad{color:#fff}
.opt.good,.wcard.good{background:var(--ok);box-shadow:0 6px 0 #1e9c52}
.opt.bad,.wcard.bad{background:var(--bad);box-shadow:0 6px 0 #c94444;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:16px;border-radius:20px;padding:14px;font-size:24px;font-weight:800}
.fb.good{background:#d9f7e6;color:#13693a}
.fb.bad{background:#ffe3e3;color:#9b2c2c}
.fb .big{font-size:clamp(30px,7vw,48px);display:block;margin:6px 0}
.next{margin-top:14px}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.slot,.tile{font:inherit;font-weight:900;font-size:clamp(28px,7vw,44px);width:clamp(40px,10vw,60px);height:clamp(52px,12vw,72px);border-radius:14px;border:0;cursor:pointer}
.slot{background:#fff;border-bottom:6px solid var(--accent);color:var(--ink);box-shadow:inset 0 0 0 2px #e6e2ff}
.slot.good{background:var(--ok);color:#fff}.slot.bad{background:var(--bad);color:#fff}
.tile{background:#ffd166;color:#4a3b00;box-shadow:0 5px 0 #d9a93a}
.tile.used{visibility:hidden}
.mgrid{display:grid;gap:10px;margin-top:10px}
.mcard{aspect-ratio:1/1.05;border-radius:18px;border:0;font:inherit;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#8e7dff,#ff7ab8);color:#fff;font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;padding:4px;text-align:center}
.mcard.up{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 4px #cfc8ff}
.mcard.up.w{font-size:clamp(15px,3.6vw,26px)}
.mcard.up.p{font-size:clamp(34px,8vw,60px)}
.mcard.done{background:#d9f7e6;box-shadow:inset 0 0 0 4px var(--ok)}
.sky{position:relative;height:min(62vh,540px);border-radius:26px;overflow:hidden;background:linear-gradient(#a9dcff,#f1fbff);box-shadow:0 6px 0 rgba(60,50,120,.10)}
.balloon{position:absolute;bottom:-100px;padding:18px 24px 20px;border-radius:50% 50% 48% 48%/60% 60% 40% 40%;font-size:clamp(22px,5vw,32px);font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);animation:rise linear forwards;cursor:pointer;white-space:nowrap;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:40px;background:#8a8aa8}
.balloon.pop{animation:none;transform:scale(1.5);opacity:0;transition:.25s}
@keyframes rise{to{transform:translateY(calc(-1 * (var(--h,520px) + 180px)))}}
#overlay{position:fixed;inset:0;background:rgba(40,30,90,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
#overlay .box{background:#fff;border-radius:28px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.rule{font-size:20px;line-height:1.55}
.ex{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.ex span{background:#f3f0ff;border-radius:14px;padding:8px 14px;font-size:22px;font-weight:800}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-120px);background:#fff;border-radius:20px;padding:12px 22px;font-weight:800;font-size:20px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:70;transition:transform .35s;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.conf{position:fixed;top:-40px;font-size:28px;z-index:60;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;text-align:center}
.album div{font-size:42px;background:#f6f3ff;border-radius:16px;padding:8px}
.album .lock{opacity:.25;filter:grayscale(1)}
.trow{display:flex;align-items:center;gap:10px;margin:8px 0}
.trow .nm{width:210px;font-weight:800}
.wl{display:flex;flex-wrap:wrap;gap:8px}
.wl span{background:#fff3cf;border-radius:14px;padding:6px 12px;font-weight:800;font-size:20px}
input[type=text]{font:inherit;font-size:24px;padding:12px 16px;border-radius:16px;border:3px solid #cfc8ff;width:100%}
label.set{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:700;font-size:18px}
@media(max-width:560px){.trow .nm{width:120px;font-size:14px}.owl{font-size:48px}}
</style>
</head>

const app=document.getElementById('app'), ov=document.getElementById('overlay');
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pickOne=a=>a[rnd(a.length)];
const LETTER=/[A-Za-zÄÖÜäöüß]/;

function splitSent(e){
  const s=e.sentence; if(!s) return null;
  let from=0,i;
  while((i=s.indexOf(e.full,from))>=0){
    const b=i>0?s[i-1]:'', a=s[i+e.full.length]||'';
    if(!(b&&LETTER.test(b))&&!(a&&LETTER.test(a))) return [s.slice(0,i),s.slice(i+e.full.length)];
    from=i+1;
  }
  return null;
}
const ALL=[];
THEMES.forEach(t=>{
  t.entries=t.words.trim().split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.split('|'); const m=parts[0].match(/^(.*?)\[(.*?)\](.*)$/);
    const e={t,pre:m[1],mid:m[2],post:m[3],emoji:parts[1]||'',sentence:parts[2]||'',hint:parts[3]||''};
    e.full=e.pre+e.mid+e.post; e.id=t.id+':'+e.full; e.sp=splitSent(e); return e;
  });
  ALL.push(...t.entries);
});
const BYID={}; ALL.forEach(e=>BYID[e.id]=e);

function optionsFor(e){
  const c=e.mid, lc=c.toLowerCase(), typ=e.t.opts; let L;
  if(Array.isArray(typ)) L=typ.slice();
  else if(typ==='double') L=(lc.length===2&&lc[0]===lc[1])?[lc,lc[0]]:[lc,lc+lc];
  else if(typ==='vowel'){const v=lc[0]; L=[v,v+'h']; if('aeo'.includes(v)) L.push(v+v);}
  else if(typ==='pair'){const m={b:'p',p:'b',d:'t',t:'d',g:'k',k:'g'}; L=[lc,m[lc]];}
  else if(typ==='chsch'){const m={ch:['ch','sch'],sch:['sch','ch'],chs:['chs','x','ks'],x:['x','chs','ks'],ks:['ks','x','chs']}; L=m[lc].slice();}
  else if(typ==='stsp') L=lc==='st'?['st','scht']:['sp','schp'];
  else if(typ==='vfw'){const m={v:['v','f','w'],f:['f','v'],pf:['pf','f','p'],w:['w','v'],qu:['qu','kw']}; L=m[lc].slice();}
  else if(typ==='case') return [c, c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()];
  const up=c[0]!==c[0].toLowerCase();
  L=L.map(x=>up?x[0].toUpperCase()+x.slice(1):x);
  if(!L.includes(c)) L.unshift(c);
  return [...new Set(L)];
}
const wrongs=e=>optionsFor(e).filter(o=>o!==e.mid).map(o=>e.pre+o+e.post);
const hl=e=>esc(e.pre)+'<b class="hl">'+esc(e.mid)+'</b>'+esc(e.post);
function tipText(e){
  if(e.hint){const h=e.hint.replace(/^(Mehrzahl|Verlängern): /,''); return 'Verlängere das Wort: <b>'+esc(h)+'</b> – hörst du den Buchstaben?';}
  return esc(e.t.tip);
}

    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(when||0);
    o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}

function pickEntry(pool,recent){
  const cand=pool.filter(e=>!recent.includes(e.id)); const L=cand.length>3?cand:pool;
  let tot=0; const ws=L.map(e=>{const w=weightOf(e);tot+=w;return w;}); let r=Math.random()*tot;
  for(let i=0;i<L.length;i++){r-=ws[i];if(r<=0)return L[i];} return L[L.length-1];
}

// ---------- Spiel-Ablauf ----------
function startGame(mode,sel){
  if(sel!=='all'&&!S.seen[sel]){showRule(sel,()=>startGame(mode,sel));return;}
  cleanup();closeOv();
  G={mode,sel,total:S.qn,i:0,ok:0,stars:0,wrong:[],recent:[],retry:[],rt:new Set(),streak:0,cur:null,extra:''};
  if(mode==='ballon')return ballon();
  if(mode==='memory')return memory();
  nextQ();
}
const PRAISE=['Super!','Richtig!','Toll gemacht!','Genau!','Wunderbar!','Prima!','Klasse!','Stark!'];
function shell(e,withStage){
  app.innerHTML=`<div class="game"><div class="gtop"><button class="icon" id="quit">✖</button><div class="bar"><i id="pbar" style="width:${G.i/G.total*100}%"></i></div><div class="gstars" id="gst">⭐ ${G.stars}</div></div>
  <span class="theme-chip" style="background:${e.t.color}">${e.t.icon} ${esc(e.t.name)}</span> <button class="icon" id="rl" style="padding:3px 10px;font-size:16px">📘 Regel</button>
  <div class="stage" id="stage"></div><div id="fb"></div></div>`;
  document.getElementById('quit').onclick=()=>{if(confirm('Spiel beenden?'))showHub();};
  document.getElementById('rl').onclick=()=>showRule(e.t.id);
}
function updateTop(){const b=document.getElementById('pbar');if(b)b.style.width=Math.min(100,G.i/G.total*100)+'%';const s=document.getElementById('gst');if(s)s.textContent='⭐ '+G.stars;}
function nextQ(){
  clearTimeout(NT);
  if(G.i>=G.total)return showResult();
  let e;
  if(G.retry.length&&(G.i-G.retry[0].at>=3||G.total-G.i<=G.retry.length)) e=G.retry.shift().e;
  else e=pickEntry(poolFor(G.mode==='train'?'luecke':G.mode,G.sel),G.recent);
  G.recent.push(e.id); if(G.recent.length>8)G.recent.shift();
  const m=G.mode==='train'?modeForWord(e):G.mode;
  G.cur={e,m,done:false};
  shell(e); Q[m](e,document.getElementById('stage'));
}
function finishQ(ok){
  const c=G.cur; if(!c||c.done)return; c.done=true; const e=c.e;
  record(e,ok,c.m); G.i++;
  if(ok){G.ok++;G.streak++;const n=G.streak%5===0?2:1;G.stars+=n;addStars(n);sfx.ok();if(G.streak%5===0){confetti(14);toast('🔥 '+G.streak+' richtig hintereinander!');}}
  else{G.streak=0;G.wrong.push(e);sfx.bad();if(!G.rt.has(e.id)){G.rt.add(e.id);G.retry.push({e,at:G.i});G.total++;}}
  updateTop();
  const fb=document.getElementById('fb');
  if(ok){fb.innerHTML='<div class="fb good">🎉 '+pickOne(PRAISE)+'</div>';NT=setTimeout(nextQ,1150);}
  else{
    fb.innerHTML=`<div class="fb bad">Fast! So schreibt man es:<span class="big">${e.emoji||''} ${hl(e)}</span><div style="font-size:18px">${tipText(e)}</div> <button class="speak" id="spk2">🔊 Hören</button></div><button class="btn next" id="nx">Weiter ▶</button>`;
    document.getElementById('spk2').onclick=()=>speak(e.full);
    document.getElementById('nx').onclick=nextQ; speak(e.full);
  }
  const st=document.getElementById('stage'); if(st){const em=st.querySelector('.reveal');if(em)em.classList.remove('hidden');}
}

// ---------- Fragetypen ----------
const Q={};
function headRow(e,st,speakText,hint){
  st.querySelector('#spk').onclick=()=>speak(speakText);
  const h=st.querySelector('#hint'); if(h)h.onclick=()=>{st.querySelector('#hb').innerHTML='💡 '+tipText(e);};
}
Q.luecke=(e,st)=>{
  const opts=shuffle(optionsFor(e));
  st.innerHTML=`${e.emoji?`<div class="qemoji">${e.emoji}</div>`:''}<div class="qword">${esc(e.pre)}<span class="gap" id="gap">?</span>${esc(e.post)}</div>
  <div class="row"><button class="speak" id="spk">🔊 Hören</button><button class="tool" id="hint">💡 Tipp</button></div><div class="hintbox" id="hb"></div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  headRow(e,st,e.full); setTimeout(()=>speak(e.full),250);

    if(G.cur.done)return; const ok=b.dataset.o===e.mid;

};
function cardChoice(e,st,words){
  const box=st.querySelector('.cards');
  box.innerHTML=shuffle(words).map(w=>`<button class="wcard" data-w="${esc(w)}">${esc(w)}</button>`).join('');
  box.querySelectorAll('.wcard').forEach(b=>b.onclick=()=>{
    if(G.cur.done)return; const ok=b.dataset.w===e.full;
    box.querySelectorAll('.wcard').forEach(x=>{x.disabled=true;if(x.dataset.w===e.full){x.classList.add('good');x.innerHTML=hl(e);}});
    if(!ok)b.classList.add('bad'); finishQ(ok);
  });
}
Q.detektiv=(e,st)=>{
  if(Math.random()<.3)return tf(e,st);
  st.innerHTML=`${e.emoji?`<div class="qemoji">${e.emoji}</div>`:''}<div class="qsent">Welches Wort ist richtig geschrieben?</div>
  <div class="row"><button class="speak" id="spk">🔊 Hören</button><button class="tool" id="hint">💡 Tipp</button></div><div class="hintbox" id="hb"></div><div class="cards"></div>`;
  headRow(e,st,e.full); setTimeout(()=>speak(e.full),250);
  cardChoice(e,st,[e.full,...shuffle(wrongs(e)).slice(0,2)]);
};
function tf(e,st){
  const right=Math.random()<.5, w=right?e.full:pickOne(wrongs(e));
  st.innerHTML=`${e.emoji?`<div class="qemoji">${e.emoji}</div>`:''}<div class="qsent">Ist das Wort richtig geschrieben?</div>
  <div class="qword">${esc(w)}</div><div class="row"><button class="speak" id="spk">🔊 Hören</button><button class="tool" id="hint">💡 Tipp</button></div><div class="hintbox" id="hb"></div>
  <div class="opts"><button class="opt" data-a="r" style="font-size:28px">✅ richtig</button><button class="opt" data-a="f" style="font-size:28px">❌ falsch</button></div>`;
  headRow(e,st,e.full); setTimeout(()=>speak(e.full),250);
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(G.cur.done)return; const ok=(b.dataset.a==='r')===right;

  });
}
Q.hoeren=(e,st)=>{
  st.innerHTML=`<div class="qemoji" style="font-size:90px">🎧</div><div class="qsent">Hör gut zu! Wie schreibt man das Wort?</div>
  <div class="row"><button class="speak" id="spk" style="font-size:24px">🔊 Nochmal hören</button><button class="tool" id="hint">💡 Tipp</button></div><div class="hintbox" id="hb"></div><div class="cards"></div>
  <div class="qemoji reveal hidden">${e.emoji}</div>`;
  headRow(e,st,e.full); setTimeout(()=>speak(e.full),300);
  cardChoice(e,st,[e.full,...shuffle(wrongs(e)).slice(0,2)]);
};
Q.saetze=(e,st)=>{
  st.innerHTML=`${e.emoji?`<div class="qemoji">${e.emoji}</div>`:''}<div class="qsent">${esc(e.sp[0])}<span class="gap wide" id="gap">&nbsp;</span>${esc(e.sp[1])}</div>
  <div class="row"><button class="speak" id="spk">🔊 Satz hören</button><button class="tool" id="hint">💡 Tipp</button></div><div class="hintbox" id="hb"></div><div class="cards"></div>`;
  headRow(e,st,e.sentence); setTimeout(()=>speak(e.sentence),250);
  cardChoice(e,st,[e.full,...shuffle(wrongs(e)).slice(0,2)]);
  st.querySelectorAll('.wcard').forEach(b=>{const old=b.onclick;b.onclick=ev=>{const ok=b.dataset.w===e.full;const g=st.querySelector('#gap');if(!G.cur.done){g.textContent=e.full;g.classList.add(ok?'good':'bad');}old.call(b,ev);};});
};
const CONF={a:'ä',ä:'e',e:'ä',u:'ü',o:'ö',s:'ß',ß:'s',k:'c',c:'k',t:'d',d:'t',z:'t',b:'p',p:'b',g:'k',f:'v',v:'f',w:'v',h:'e',i:'y'};
function distractors(e,n){
  const have=new Set([...e.full.toLowerCase()]); const c=[];
  [...e.full.toLowerCase()].forEach(ch=>{const x=CONF[ch];if(x&&!have.has(x)&&!c.includes(x))c.push(x);});
  shuffle([...'aehkstzdfvwpbgl']).forEach(x=>{if(!have.has(x)&&!c.includes(x))c.push(x);});
  return shuffle(c).slice(0,n);
}
function tilesGame(e,st,mode){
  const chars=[...e.full]; let tiles=chars.map((c,i)=>({c,id:i,used:false}));
  if(mode==='diktat')distractors(e,3).forEach((c,k)=>tiles.push({c,id:100+k,used:false}));
  tiles=shuffle(tiles); if(mode==='salat'&&chars.length>2&&tiles.map(t=>t.c).join('')===e.full)tiles=shuffle(tiles);
  const slots=Array(chars.length).fill(null);
  const intro=mode==='salat'
    ?`${e.emoji?`<div class="qemoji">${e.emoji}</div>`:''}${e.sp?`<div class="qsent" style="font-size:22px">${esc(e.sp[0])}<span class="gap wide">&nbsp;</span>${esc(e.sp[1])}</div>`:''}<div class="qsent" style="font-size:22px">Setze die Buchstaben zum Wort zusammen.</div>`
    :`<div class="qemoji" style="font-size:80px">🎤</div><div class="qsent" style="font-size:22px">Hör zu und baue das Wort. Pass auf: Es sind zu viele Buchstaben da!</div>`;
  st.innerHTML=`${intro}<div class="row"><button class="speak" id="spk">🔊 Hören</button><button class="tool" id="hint">💡 Tipp</button></div><div class="hintbox" id="hb"></div>
  <div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>
  <div class="row"><button class="btn small" id="clr" style="background:#8a8aa8;box-shadow:0 5px 0 #66667f">↺ Neu</button><button class="btn green" id="chk" disabled>Prüfen ✔</button></div>
  <div class="qemoji reveal hidden">${e.emoji}</div>`;
  headRow(e,st,e.full); setTimeout(()=>speak(e.full),300);
  const sl=st.querySelector('#slots'), tl=st.querySelector('#tiles'), chk=st.querySelector('#chk');
  function draw(){
    sl.innerHTML=slots.map((t,i)=>`<button class="slot" data-i="${i}">${t?esc(t.c):''}</button>`).join('');
    tl.innerHTML=tiles.map(t=>`<button class="tile ${t.used?'used':''}" data-id="${t.id}">${esc(t.c)}</button>`).join('');
    chk.disabled=slots.some(x=>!x);
    if(G.cur.done)return;
    sl.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(slots[i]){slots[i].used=false;slots[i]=null;draw();}});
    tl.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const t=tiles.find(x=>x.id==b.dataset.id);if(t.used)return;const i=slots.indexOf(null);if(i<0)return;t.used=true;slots[i]=t;beep(500,.05,'sine',.08);draw();});
  }
  draw();
  st.querySelector('#clr').onclick=()=>{if(G.cur.done)return;tiles.forEach(t=>t.used=false);slots.fill(null);draw();};
  chk.onclick=()=>{
    if(G.cur.done)return; const w=slots.map(t=>t.c).join(''), ok=w===e.full;
    sl.querySelectorAll('.slot').forEach(b=>b.classList.add(ok?'good':'bad')); chk.disabled=true; finishQ(ok);
  };
}
Q.salat=(e,st)=>tilesGame(e,st,'salat');
Q.diktat=(e,st)=>tilesGame(e,st,'diktat');

// ---------- Ballon-Pop ----------
function ballon(){
  cleanup(); G.total=0; G.title='Ballon-Pop';
  let time=60,hearts=3,pops=0,over=false,spawned=0;
  const pool=poolFor('ballon',G.sel).filter(e=>e.full.length<=13);
  const colors=['#ff6b9d','#6c5ce7','#00b894','#e17055','#0984e3','#fdcb6e','#e84393','#00cec9'];
  app.innerHTML=`<div class="game"><div class="gtop"><button class="icon" id="quit">✖</button><div class="gstars" id="tm">⏱ 60</div><div class="gstars" id="hr">❤️❤️❤️</div><div class="gstars" id="gst">⭐ 0</div></div>
  <div class="card" style="text-align:center;padding:10px"><b>Platze nur die RICHTIG geschriebenen Wörter!</b> Fehlerhafte Wörter lässt du fliegen. 🎈</div><div class="sky" id="sky"></div></div>`;
  const sky=document.getElementById('sky'); sky.style.setProperty('--h',sky.clientHeight+'px');
  document.getElementById('quit').onclick=()=>{if(confirm('Spiel beenden?'))showHub();};
  const upd=()=>{document.getElementById('tm').textContent='⏱ '+time;document.getElementById('hr').textContent='❤️'.repeat(hearts)+'🖤'.repeat(3-hearts);document.getElementById('gst').textContent='⭐ '+G.stars;};
  function end(){if(over)return;over=true;cleanup();G.ok=pops;G.total=pops+G.wrong.length;showResult();}
  function spawn(){
    if(over)return;
    const e=pickEntry(pool,G.recent); G.recent.push(e.id); if(G.recent.length>10)G.recent.shift();
    const wrong=Math.random()<.5, txt=wrong?pickOne(wrongs(e)):e.full;
    const b=document.createElement('div'); b.className='balloon'; b.textContent=txt;
    b.style.left=(2+Math.random()*60)+'%'; b.style.background=pickOne(colors);
    b.style.animationDuration=Math.max(5.5,10-spawned*.08)+'s'; spawned++;
    b.addEventListener('animationend',()=>b.remove());
    b.onpointerdown=()=>{
      if(b.dataset.d||over)return; b.dataset.d=1;
      if(!wrong){pops++;G.stars++;addStars(1);record(e,true,'ballon');sfx.pop();b.classList.add('pop');}
      else{hearts--;record(e,false,'ballon');sfx.bad();G.wrong.push(e);b.classList.add('pop');toast('Oje! Richtig ist: <b>'+esc(e.full)+'</b>');speak(e.full);}
      setTimeout(()=>b.remove(),260); upd(); if(hearts<=0)end();
    };
    sky.appendChild(b); timers.push(setTimeout(spawn,Math.max(650,1500-spawned*20)));
  }
  spawn();
  timers.push(setInterval(()=>{time--;upd();if(time<=0)end();},1000));
}

// ---------- Memory ----------
function memory(){
  cleanup(); G.title='Memory';
  const narrow=innerWidth<560, pairs=narrow?6:8, cols=narrow?3:4;
  const pool=poolFor('memory',G.sel); const chosen=[],em=new Set(),rec=[];
  while(chosen.length<pairs&&rec.length<400){const e=pickEntry(pool,rec);rec.push(e.id);if(!em.has(e.emoji)&&!chosen.includes(e)){em.add(e.emoji);chosen.push(e);}}
  const cards=shuffle(chosen.flatMap(e=>[{e,k:'p'},{e,k:'w'}]));
  G.total=chosen.length; let first=null,lock=false,matched=0,moves=0;
  app.innerHTML=`<div class="game"><div class="gtop"><button class="icon" id="quit">✖</button><div class="bar"><i id="pbar" style="width:0%"></i></div><div class="gstars" id="gst">⭐ 0</div></div>
  <div class="card" style="text-align:center;padding:10px"><b>Finde zu jedem Bild das passende Wort!</b> Schau genau, wie das Wort geschrieben wird.</div>
  <div class="mgrid" id="mg" style="grid-template-columns:repeat(${cols},1fr)">${cards.map((c,i)=>`<button class="mcard" data-i="${i}">❓</button>`).join('')}</div></div>`;
  document.getElementById('quit').onclick=()=>{if(confirm('Spiel beenden?'))showHub();};
  const els=[...document.querySelectorAll('.mcard')];
  function up(i){const c=cards[i],b=els[i];b.classList.add('up',c.k);b.innerHTML=c.k==='p'?c.e.emoji:hl(c.e);if(c.k==='w')speak(c.e.full);}
  function down(i){els[i].classList.remove('up','p','w');els[i].textContent='❓';}
  els.forEach((b,i)=>b.onclick=()=>{
    if(lock||b.classList.contains('up'))return; up(i);
    if(first===null){first=i;return;}
    moves++; const a=first; first=null;
    if(cards[a].e===cards[i].e){
      matched++;G.stars++;addStars(1);record(cards[i].e,true,'memory');sfx.ok();
      els[a].classList.add('done');els[i].classList.add('done');
      document.getElementById('pbar').style.width=matched/pairs*100+'%';document.getElementById('gst').textContent='⭐ '+G.stars;
      if(matched===pairs){G.ok=pairs;G.extra='Du hast '+moves+' Züge gebraucht.';timers.push(setTimeout(showResult,900));}
    }else{lock=true;sfx.bad();timers.push(setTimeout(()=>{down(a);down(i);lock=false;},1000));}
  });
}

// ---------- Ergebnis ----------
function showResult(){
  cleanup();
  const total=Math.max(G.total,1), pct=Math.round(G.ok/total*100);
  const msg=pct>=90?'Fantastisch!':pct>=70?'Sehr gut!':pct>=50?'Gut gemacht!':'Weiter so – Übung macht die Meisterin!';
  const uniq=[...new Map(G.wrong.map(e=>[e.id,e])).values()];
  if(pct>=70){confetti(30);sfx.win();}
  const name=G.mode==='train'?'Mein Training':(G.title||MODES[G.mode].name);
  app.innerHTML=`<div class="wrap"><div class="card" style="text-align:center;margin-top:30px"><div class="owl">${pct>=70?'🦉🎉':'🦉'}</div>
  <h1>${msg}</h1><p style="font-size:22px">${esc(name)}: <b>${G.ok}</b> von <b>${G.total}</b> richtig (${pct}%)<br>⭐ ${G.stars} Sterne verdient ${G.extra?'<br><span class="small">'+G.extra+'</span>':''}</p>
  ${uniq.length?`<h3>Diese Wörter üben wir bald wieder:</h3><div class="wl" style="justify-content:center">${uniq.map(e=>`<span>${e.emoji||''} ${hl(e)}</span>`).join('')}</div>`:'<p>🌟 Kein einziger Fehler!</p>'}
  <p style="margin-top:18px"><button class="btn alt" id="again">Nochmal ▶</button> <button class="btn" id="home">Zur Startseite</button></p></div></div>`;
  document.getElementById('again').onclick=()=>startGame(G.mode,G.sel);
  document.getElementById('home').onclick=showHub;
}

// ---------- Start ----------
if(S.name)showHub();else showStart();
</script>
</body>
</html>
