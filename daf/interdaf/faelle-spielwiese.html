<!DOCTYPE html>
<html lang="de">
<head>
<script src="/daf/interdaf/passwort.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fälle-Spielwiese · Akkusativ & Dativ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0EA; --card:#FFFFFF; --ink:#1C1C22; --soft:#5B5B66;
  --navy:#22324F; --petrol:#2B6574; --dat:#2F5D9A; --dat-l:#E4ECF7;
  --akk:#9E2F68; --akk-l:#F6E4EE; --gold:#B8862A; --gold-l:#F6EDD9;
  --lila:#6C5B93; --lila-l:#ECE8F4;
  --ok:#2F5D9A; --bad:#B4485A; --bad-l:#F7E3E6; --line:#E2DDD3;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55}
header{background:linear-gradient(135deg,var(--navy),#2E3F66 60%,var(--petrol));color:#fff;padding:26px 20px 32px}
header .in{max-width:1000px;margin:0 auto}
header h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.3px}
header p{margin:6px 0 0;opacity:.9;font-size:17px}
.stars{float:right;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 16px;font-weight:600;font-size:17px}
main{max-width:1000px;margin:-14px auto 40px;padding:0 16px}
.card{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(34,50,79,.07);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mode{border:none;text-align:left;cursor:pointer;background:var(--card);border-radius:20px;padding:18px 18px 16px;font-family:inherit;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.04),0 6px 18px rgba(34,50,79,.07);transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode .ic{font-size:32px}
.mode h3{margin:6px 0 4px;font-size:19px}
.mode p{margin:0;color:var(--soft);font-size:15px}
.mode .tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gold-l);color:#7A5A18}
h2{margin:0 0 6px;font-size:24px;color:var(--navy)}
h3.sec{margin:24px 0 10px;color:var(--navy);font-size:20px}
.muted{color:var(--soft);font-size:16px}
.bD{background:var(--dat-l);color:var(--dat);border-radius:8px;padding:1px 7px;font-weight:600}
.bA{background:var(--akk-l);color:var(--akk);border-radius:8px;padding:1px 7px;font-weight:600}
.bN{background:#FBF3E2;color:#80601C;border-radius:8px;padding:1px 7px;font-weight:600}
.btn{font-family:inherit;font-size:17px;font-weight:600;border:none;border-radius:14px;padding:11px 20px;cursor:pointer;background:var(--navy);color:#fff}
.btn.sec{background:#E7E3DA;color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.back{background:none;border:none;font-family:inherit;color:var(--petrol);font-weight:600;font-size:16px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.bar{height:10px;background:#E7E3DA;border-radius:999px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--petrol),var(--dat));width:0;transition:width .3s}
.sentence{font-size:24px;line-height:2.2;margin:8px 0 6px}
.gap{display:inline-block;min-width:90px;text-align:center;border-bottom:3px dashed #B9B2A4;padding:0 6px;font-weight:600}
.gap.D{border-color:var(--dat)}.gap.A{border-color:var(--akk)}
.gap.fill-D{color:var(--dat);border-bottom-style:solid}.gap.fill-A{color:var(--akk);border-bottom-style:solid}
.gap.fill-bad{color:var(--bad);border-color:var(--bad);border-bottom-style:solid}
.chip{display:inline-block;font-size:13px;color:var(--soft);background:#EFEBE3;border-radius:8px;padding:0 7px;margin-left:4px;vertical-align:middle;line-height:1.6;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.opt{font-family:inherit;font-size:19px;font-weight:500;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 18px;cursor:pointer;color:var(--ink);min-width:70px}
.opt:hover:not(:disabled){border-color:var(--petrol)}
.opt.ok{border-color:var(--ok);background:var(--dat-l);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.opt.sel{border-color:var(--navy);background:#E7E9EF}
.opt:disabled{cursor:default}
.ex{margin-top:12px;padding:12px 15px;border-radius:14px;font-size:16.5px;background:var(--gold-l);border-left:5px solid var(--gold)}
.ex.badx{background:var(--bad-l);border-left-color:var(--bad)}
.ex p{margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.count{color:var(--soft);font-size:15px}
.setrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.tg{font-family:inherit;font-size:15.5px;font-weight:500;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.tg.on{border-color:var(--petrol);background:#E3EFF1;color:var(--petrol);font-weight:600}
table.t{border-collapse:separate;border-spacing:0;width:100%;margin:10px 0;font-size:17px}
table.t th,table.t td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
table.t th{color:var(--soft);font-weight:500;font-size:15px}
table.t td:first-child,table.t th:first-child{text-align:left}
.merk{font-size:20px;text-align:center;padding:16px;border-radius:18px;background:linear-gradient(135deg,#F7F3EA,#EEF2F8);margin:12px 0;font-weight:500}
/* Spielflächen */
.arena{position:relative;height:400px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#DCE5EF 0%,#EEF1F4 55%,#F5EFE4 100%);touch-action:none;user-select:none}
.balloon{position:absolute;width:118px;height:138px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:21px;color:#fff;border-radius:50% 50% 48% 48% / 55% 55% 45% 45%;box-shadow:inset -10px -14px 0 rgba(0,0,0,.10),inset 8px 10px 0 rgba(255,255,255,.18);transition:opacity .25s,transform .25s}
.balloon::after{content:"";position:absolute;bottom:-46px;left:50%;width:2px;height:46px;background:rgba(40,40,60,.35)}
.balloon::before{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom-color:inherit}
.balloon.pop{transform:scale(1.5);opacity:0}
.balloon.badpop{background:#B9A9AE !important;transform:scale(.85);opacity:.6}
.fall{position:absolute;padding:7px 14px;border-radius:12px;background:#fff;font-weight:600;font-size:19px;color:var(--navy);box-shadow:0 3px 10px rgba(34,50,79,.15);white-space:nowrap}
.basketEl{position:absolute;bottom:10px;width:130px;height:54px;border-radius:0 0 28px 28px;background:linear-gradient(180deg,#B8862A,#8E6618);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(28,28,34,.86);color:#fff;padding:8px 16px;border-radius:12px;font-size:15.5px;max-width:92%;text-align:center;pointer-events:none;transition:opacity .3s}
.hud{display:flex;gap:16px;flex-wrap:wrap;font-weight:600;color:var(--navy);margin:6px 0 10px}
.memgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.mcard{height:104px;border-radius:16px;border:none;font-family:inherit;font-size:16.5px;font-weight:600;cursor:pointer;padding:8px;line-height:1.3;background:linear-gradient(135deg,var(--navy),var(--petrol));color:transparent;transition:background .2s}
.mcard:not(.open):not(.done) *{visibility:hidden}
.mcard.open{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.mcard.done{background:var(--dat-l);color:var(--dat);box-shadow:inset 0 0 0 2px var(--dat);cursor:default}
.mcard small{display:block;font-weight:500;font-size:13.5px;margin-top:4px}
.phr{display:inline-block;border:2px solid var(--line);border-radius:12px;padding:0 10px;margin:0 2px;cursor:pointer;background:#FAF8F4;line-height:1.7}
.phr.N{border-color:#C9A24E;background:#FBF3E2}.phr.A{border-color:var(--akk);background:var(--akk-l)}.phr.D{border-color:var(--dat);background:var(--dat-l)}
.phr.wrong{outline:3px solid var(--bad);outline-offset:2px}
.phr .lab{font-size:12.5px;font-weight:600;margin-left:6px;color:var(--soft)}
.paint{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.paint .tg.N.on{border-color:#C9A24E;background:#FBF3E2;color:#80601C}
.paint .tg.A.on{border-color:var(--akk);background:var(--akk-l);color:var(--akk)}
.paint .tg.D.on{border-color:var(--dat);background:var(--dat-l);color:var(--dat)}
.step{margin:14px 0 6px;font-weight:600;color:var(--navy)}
.rocketWrap{display:flex;gap:20px;align-items:stretch}
.tower{width:64px;min-width:64px;border-radius:18px;background:linear-gradient(180deg,#22324F,#3A4D78 60%,#6C5B93);position:relative;overflow:hidden}
.tower .rk{position:absolute;left:50%;transform:translateX(-50%);font-size:34px;transition:bottom .5s}
.big{font-size:44px;text-align:center;margin:6px 0}
.timer{font-variant-numeric:tabular-nums}
.medal{font-size:60px;text-align:center}
.list{margin:8px 0;padding-left:20px}.list li{margin:6px 0}
@media (max-width:600px){header h1{font-size:24px}.sentence{font-size:20px}.balloon{width:86px;height:104px;font-size:17px}.arena{height:360px}}
</style>
</head>
<body>
<header><div class="in"><span class="stars" id="stars">⭐ 0</span><h1>Fälle-Spielwiese</h1><p>Akkusativ und Dativ – in allen Spielarten</p></div></header>
<main id="app"></main>

<script>
/* ---------- Speicher ---------- */
const store={get(k,d){try{const v=localStorage.getItem("fsw_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("fsw_"+k,JSON.stringify(v))}catch(e){}}};
let STARS=store.get("stars",0);
const S=Object.assign({cases:{A:true,D:true,DA:true},fam:{def:true,ein:true,kein:true,poss:true,dies:true},tip:true},store.get("settings",{}));
function saveS(){store.set("settings",S)}
function star(n=1){STARS+=n;store.set("stars",STARS);document.getElementById("stars").textContent="⭐ "+STARS}
document.getElementById("stars").textContent="⭐ "+STARS;

/* ---------- Grammatik ---------- */
const G={m:"männlich",f:"weiblich",n:"sächlich"};
const ART={m:"der",f:"die",n:"das"};
const CASE={N:"Nominativ",A:"Akkusativ",D:"Dativ"};
const DEF={m:{N:"der",A:"den",D:"dem"},f:{N:"die",A:"die",D:"der"},n:{N:"das",A:"das",D:"dem"}};
const E_EIN={m:{N:"",A:"en",D:"em"},f:{N:"e",A:"e",D:"er"},n:{N:"",A:"",D:"em"}};
const E_DER={m:{N:"er",A:"en",D:"em"},f:{N:"e",A:"e",D:"er"},n:{N:"es",A:"es",D:"em"}};
const DERTYPE=["dies","jed","welch"];
const POSS={ich:"mein",du:"dein",er:"sein",sie:"ihr",wir:"unser"};
function isDerT(fk){return DERTYPE.includes(fk)}
function form(fk,g,c){if(fk==="def")return DEF[g][c];return fk+(isDerT(fk)?E_DER:E_EIN)[g][c]}
function ending(fk,g,c){return fk==="def"?"":(isDerT(fk)?E_DER:E_EIN)[g][c]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function famLabel(fk){return fk==="def"?"der/die/das":fk+"-"}

/* ---------- Wörter ---------- */
const N=(w,g,k)=>({w,g,k});
const NOUNS=[
 N("Opa","m","P"),N("Onkel","m","P"),N("Lehrer","m","P"),N("Freund","m","P"),N("Bruder","m","P"),N("Trainer","m","P"),
 N("Oma","f","P"),N("Tante","f","P"),N("Lehrerin","f","P"),N("Freundin","f","P"),N("Schwester","f","P"),N("Trainerin","f","P"),
 N("Kind","n","P"),N("Mädchen","n","P"),N("Baby","n","P"),
 N("Hund","m","T2"),N("Vogel","m","T2"),N("Fisch","m","T2"),N("Esel","m","T2"),
 N("Katze","f","T2"),N("Maus","f","T2"),N("Kuh","f","T2"),N("Ente","f","T2"),
 N("Pferd","n","T2"),N("Schwein","n","T2"),N("Huhn","n","T2"),N("Pony","n","T2"),
 N("Ball","m","T"),N("Apfel","m","T"),N("Kuchen","m","T"),N("Brief","m","T"),N("Hut","m","T"),N("Teddy","m","T"),N("Schlüssel","m","T"),
 N("Puppe","f","T"),N("Blume","f","T"),N("Tasche","f","T"),N("Kerze","f","T"),N("Uhr","f","T"),N("Torte","f","T"),N("Jacke","f","T"),
 N("Buch","n","T"),N("Fahrrad","n","T"),N("Bild","n","T"),N("Geschenk","n","T"),N("Spiel","n","T"),N("Heft","n","T")
].map(n=>n.k==="T2"?Object.assign(n,{k:"Ti"}):n); // Ti = Tiere
const FAMILY=["Opa","Onkel","Bruder","Oma","Tante","Schwester"];
const NOFOOD=["Apfel","Kuchen","Torte","Kerze"];
function nounsOf(kinds,fk,verb){return NOUNS.filter(n=>kinds.includes(n.k)&&!(fk==="ein"&&FAMILY.includes(n.w))&&!(["mein","dein","sein","ihr","unser"].includes(fk)&&n.w==="Mädchen")&&!(verb&&["leihen","schicken"].includes(verb.inf)&&NOFOOD.includes(n.w)))}

const V=(inf,ich,du,er,wir,t,o)=>({inf,c:{ich,du,er,sie:er,wir},t,o});
const VERBS={
 A:[V("sehen","sehe","siehst","sieht","sehen","A",["P","Ti","T"]),V("suchen","suche","suchst","sucht","suchen","A",["P","Ti","T"]),
    V("finden","finde","findest","findet","finden","A",["Ti","T"]),V("malen","male","malst","malt","malen","A",["P","Ti","T"]),
    V("füttern","füttere","fütterst","füttert","füttern","A",["Ti"]),V("streicheln","streichle","streichelst","streichelt","streicheln","A",["Ti"]),
    V("kaufen","kaufe","kaufst","kauft","kaufen","A",["T"]),V("brauchen","brauche","brauchst","braucht","brauchen","A",["T"]),
    V("besuchen","besuche","besuchst","besucht","besuchen","A",["P"]),V("fragen","frage","fragst","fragt","fragen","A",["P"]),
    V("tragen","trage","trägst","trägt","tragen","A",["T"]),V("haben","habe","hast","hat","haben","A",["Ti","T"])],
 D:[V("helfen","helfe","hilfst","hilft","helfen","D",["P","Ti"]),V("danken","danke","dankst","dankt","danken","D",["P"]),
    V("antworten","antworte","antwortest","antwortet","antworten","D",["P"]),V("gratulieren","gratuliere","gratulierst","gratuliert","gratulieren","D",["P"]),
    V("folgen","folge","folgst","folgt","folgen","D",["P","Ti"]),V("winken","winke","winkst","winkt","winken","D",["P"]),
    V("vertrauen","vertraue","vertraust","vertraut","vertrauen","D",["P","Ti"])],
 DA:[V("geben","gebe","gibst","gibt","geben","DA",["P"]),V("schenken","schenke","schenkst","schenkt","schenken","DA",["P"]),
    V("zeigen","zeige","zeigst","zeigt","zeigen","DA",["P"]),V("bringen","bringe","bringst","bringt","bringen","DA",["P"]),
    V("schicken","schicke","schickst","schickt","schicken","DA",["P"]),V("leihen","leihe","leihst","leiht","leihen","DA",["P"])]
};
const SUBJ=[{w:"Ich",k:"ich"},{w:"Du",k:"du"},{w:"Er",k:"er"},{w:"Sie",k:"sie"},{w:"Wir",k:"wir"}];
/* Verben nur für den Fänger (eindeutig zuordenbar) */
const CATCH=[["sehen","A"],["suchen","A"],["finden","A"],["füttern","A"],["streicheln","A"],["besuchen","A"],["fragen","A"],["brauchen","A"],["haben","A"],["lieben","A"],
 ["helfen","D"],["danken","D"],["antworten","D"],["gratulieren","D"],["folgen","D"],["winken","D"],["vertrauen","D"],["gehören","D"],["gefallen","D"],["zuhören","D"],
 ["geben","DA"],["schenken","DA"],["zeigen","DA"],["bringen","DA"],["schicken","DA"],["leihen","DA"],["erklären","DA"],["erzählen","DA"]];
const CATNAME={A:"Akkusativ-Verb",D:"Dativ-Verb",DA:"Dativ + Akkusativ"};
const CATQ={A:"Wen oder was?",D:"Wem?",DA:"Wem? und Was?"};

/* ---------- Erklärungen ---------- */
function caseExpl(verb,c){
 const du=verb.c.du;
 if(verb.t==="A")return `„${verb.inf}“ will den <span class="bA">Akkusativ</span>. Frag: <b>Wen oder was ${du} du?</b>`;
 if(verb.t==="D")return `„${verb.inf}“ will den <span class="bD">Dativ</span>. Frag: <b>Wem ${du} du?</b>`;
 return `Bei „${verb.inf}“ gibt es zwei Ergänzungen: <b>Wem?</b> – die Person, das ist der <span class="bD">Dativ</span>, und <b>Was?</b> – die Sache, das ist der <span class="bA">Akkusativ</span>. Die Lücke fragt nach <b>${c==="D"?"Wem?":"Was?"}</b> → ${c==="D"?'<span class="bD">Dativ</span>':'<span class="bA">Akkusativ</span>'}.`;
}
function formExpl(fk,g,c,noun){
 const d=DEF[g][c], w=form(fk,g,c);
 let s=`<b>${noun}</b> ist ${G[g]}: ${ART[g]} ${noun}. `;
 if(fk==="def"){
  s+= d===ART[g]?`Im ${CASE[c]} bleibt „${d}“ gleich: <b>${d} ${noun}</b>.`:`Im ${CASE[c]} wird aus „${ART[g]}“ → <b>${d}</b>: ${d} ${noun}.`;
 }else if(isDerT(fk)){
  s+=`${cap(fk)}- bekommt dieselbe Endung wie der Artikel. Der Artikel heißt hier „${d}“, also: <b>${w} ${noun}</b>.`;
 }else{
  const e=ending(fk,g,c);
  s+=`${cap(fk)}- funktioniert wie ein und kein. ${CASE[c]}, ${G[g]}: ${e?`Endung <b>-${e}</b>`:`<b>keine Endung</b>`} → <b>${w} ${noun}</b>.`;
 }
 if(c==="D")s+=` <span class="muted">Merke: Im Dativ endet es auf -m (männlich, sächlich) oder -r (weiblich).</span>`;
 return s;
}

/* ---------- Aufgaben-Generator ---------- */
function typePool(){const p=[];["A","D","DA"].forEach(k=>{if(S.cases[k])p.push(k)});return p.length?p:["A","D","DA"]}
function famPool(noQ){const p=[];if(S.fam.def)p.push("def");if(S.fam.ein)p.push("ein");if(S.fam.kein)p.push("kein");if(S.fam.poss)p.push("poss");if(S.fam.dies){p.push("dies","jed");if(!noQ)p.push("welch")}return p.length?p:["def"]}
function optsFor(fk,g,c,capit){
 let all=fk==="def"?["der","die","das","den","dem"]:(isDerT(fk)?["er","e","es","en","em"]:["","e","en","em","er"]).map(e=>fk+e);
 const ans=form(fk,g,c);
 let o=[ans,...shuffle(all.filter(x=>x!==ans)).slice(0,3)];
 o=shuffle(o);
 return capit?o.map(cap):o;
}
/* Teile: {t:text} | {gap:1} | {n:noun} */
function genQ(fixedVerb){
 const type=fixedVerb?fixedVerb.t:pick(typePool());
 const verb=fixedVerb||pick(VERBS[type]);
 let subj=pick(SUBJ);
 let fk=pick(famPool());
 if(fk==="welch")subj={w:"du",k:"du"};
 if(fk==="poss")fk=POSS[subj.k];
 const Q=fk==="welch";
 let parts=[],gap;
 if(type!=="DA"){
  const noun=pick(nounsOf(verb.o,fk));
  gap={c:type,g:noun.g,fk,noun:noun.w,capit:Q};
  if(Q)parts=[{gap:1},{n:noun},{t:verb.c.du+" du?"}];
  else parts=[{t:subj.w+" "+verb.c[subj.k]},{gap:1},{n:noun,end:"."}];
 }else{
  const gc=pick(["D","A"]);
  const ofk=Q?"def":pick(["def","ein"]);
  const dn=pick(nounsOf(["P"],gc==="D"?fk:ofk)), an=pick(nounsOf(["T"],null,verb));
  const gn=gc==="D"?dn:an, on=gc==="D"?an:dn, oc=gc==="D"?"A":"D";
  gap={c:gc,g:gn.g,fk,noun:gn.w,capit:Q};
  const other={t:form(ofk,on.g,oc)+" "+on.w};
  if(Q)parts=[{gap:1},{n:gn},{t:verb.c.du+" du "+other.t+"?"}];
  else{
   const gp=[{gap:1},{n:gn}];
   const dPart=gc==="D"?gp:[{t:other.t}], aPart=gc==="A"?gp:[{t:other.t}];
   parts=[{t:subj.w+" "+verb.c[subj.k]},...dPart,...aPart];
   const last=parts[parts.length-1]; if(last.n)last.end=".";else last.t+=".";
  }
 }
 gap.ans=form(fk,gap.g,gap.c);if(Q)gap.ans=cap(gap.ans);
 gap.opts=optsFor(fk,gap.g,gap.c,Q);
 const q={verb,parts,gap};
 q.expl=`<p>${caseExpl(verb,gap.c)}</p><p>${formExpl(fk,gap.g,gap.c,gap.noun)}</p>`;
 q.full=()=>parts.map(p=>p.gap?gap.ans:p.n?p.n.w+(p.end||""):p.t).join(" ");
 return q;
}
function renderParts(q,fill,state){
 return q.parts.map(p=>{
  if(p.gap){const cls=state==="ok"?"fill-"+q.gap.c:state==="bad"?"fill-bad":"";return `<span class="gap ${q.gap.c} ${cls}" id="gapEl">${fill||"&nbsp;"}</span>`}
  if(p.n)return `${p.n.w}${S.tip&&!state?`<span class="chip">${ART[p.n.g]}</span>`:""}${p.end||""}`;
  return p.t;
 }).join(" ");
}

/* ---------- 1 Ballon-Jagd ---------- */
const BCOL=["#22324F","#2B6574","#6C5B93","#B8862A","#8C5E7E"];
function ballon(){
 const N_Q=10;let i=0,score=0,q,balls=[],raf,last,answered;
 function frame(t){
  const dt=last?(t-last)/1000:0;last=t;
  const ar=document.getElementById("arena");if(!ar)return;
  const H=ar.clientHeight;let alive=0;
  balls.forEach(b=>{if(b.gone)return;if(!answered)b.y+=b.v*dt;if(b.y<H+190)alive++;b.el.style.bottom=(b.y-150)+"px"});
  if(!answered&&alive===0){launch(true)}
  raf=requestAnimationFrame(frame);
 }
 function launch(again){
  const ar=document.getElementById("arena");ar.querySelectorAll(".balloon").forEach(e=>e.remove());
  const W=ar.clientWidth, lane=W/q.gap.opts.length;
  balls=q.gap.opts.map((o,k)=>{const el=document.createElement("div");el.className="balloon";el.textContent=o;
   const col=BCOL[(k+i)%BCOL.length];el.style.background=col;el.style.borderBottomColor=col;
   const bw=W<600?86:118;el.style.left=Math.max(4,Math.min(W-bw-4,lane*k+(lane-bw)/2+(Math.random()*20-10)))+"px";
   el.onclick=()=>hit(o,el);ar.appendChild(el);
   return {el,o,y:90+Math.random()*90,v:(again?50:40)+Math.random()*26};});
  if(again){const tt=document.getElementById("toast");tt.style.opacity=1;tt.textContent="Die sind entwischt – noch einmal!";setTimeout(()=>tt.style.opacity=0,1500)}
 }
 function next(){
  if(i>=N_Q)return end();
  q=genQ();answered=false;
  app.innerHTML=`<div class="card">${backBtn()}<h2>🎈 Ballon-Jagd</h2>${bar(i,N_Q)}
  <div class="hud"><span>Satz ${i+1} von ${N_Q}</span><span>Treffer: ${score}</span></div>
  <div class="sentence">${renderParts(q)}</div>
  <div class="arena" id="arena"><div class="toast" id="toast" style="opacity:0"></div></div>
  <div id="fb"></div></div>`;
  last=0;launch(false);
 }
 function hit(o,el){
  if(answered)return;answered=true;const ok=o===q.gap.ans;
  if(ok){el.classList.add("pop");score++;star()}else{el.classList.add("badpop");balls.forEach(b=>{if(b.o===q.gap.ans)b.el.style.boxShadow="0 0 0 5px #fff,0 0 0 9px var(--dat)"})}
  document.querySelector(".sentence").innerHTML=renderParts(q,q.gap.ans,ok?"ok":"bad");
  document.getElementById("fb").innerHTML=`<div class="ex ${ok?"":"badx"}"><p><b>${ok?"Treffer!":"Daneben – richtig ist „"+q.gap.ans+"“."}</b></p>${q.expl}</div><div class="row"><span></span><button class="btn" id="nx">Weiter →</button></div>`;
  document.getElementById("nx").onclick=()=>{i++;next()};
 }
 function end(){
  app.innerHTML=`<div class="card">${backBtn()}<h2>🎈 Geschafft!</h2><div class="big">${score} / ${N_Q}</div><p style="text-align:center">${score>=9?"Meisterschütze! Fast jeder Ballon getroffen.":score>=6?"Starke Runde – noch eine, dann wird es noch besser!":"Jeder Fehler hat dir eine Erklärung gezeigt. Noch eine Runde?"}</p><div class="row" style="justify-content:center"><button class="btn" onclick="go(ballon)">Noch eine Runde</button></div></div>`;
 }
 next();raf=requestAnimationFrame(frame);
 stopFn=()=>cancelAnimationFrame(raf);
}

function faenger(){
 app.innerHTML=`<div class="card">${backBtn()}<h2>🧺 Verben-Fänger</h2>
 <p>Verben fallen vom Himmel. Fang mit dem Korb <b>nur</b> die Verben, die gesucht sind. Bewege den Korb mit der Maus, dem Finger oder den Pfeiltasten ← →. Drei falsche Fänge – dann ist die Runde vorbei.</p>
 <div class="step">Was fängst du?</div>
 <div class="opts"><button class="opt" onclick="faengerRun('A')"><span class="bA">Akkusativ</span> – Wen oder was?</button>
 <button class="opt" onclick="faengerRun('D')"><span class="bD">Dativ</span> – Wem?</button>
 <button class="opt" onclick="faengerRun('DA')"><span class="bD">Dativ</span> + <span class="bA">Akkusativ</span> – Wem? Was?</button></div></div>`;
}
function faengerRun(target){
 const DUR=50;let t0=null,score=0,hearts=3,words=[],spawnT=0,bx=200,raf,over=false,seen={},keys={};
 app.innerHTML=`<div class="card">${backBtn()}<h2>🧺 Fang: ${CATNAME[target]}</h2>
 <div class="hud"><span>Gesucht: ${CATQ[target]}</span><span>Punkte: <span id="sc">0</span></span><span id="hh">❤️❤️❤️</span><span class="timer">⏱ <span id="tm">${DUR}</span> s</span></div>
 <div class="arena" id="arena"><div class="basketEl" id="bk">${target==="A"?"Wen/Was?":target==="D"?"Wem?":"Wem + Was?"}</div><div class="toast" id="toast" style="opacity:0"></div></div>
 <div id="fb"></div></div>`;
 const ar=document.getElementById("arena"),bk=document.getElementById("bk");
 const W=()=>ar.clientWidth;
 ar.addEventListener("pointermove",e=>{const r=ar.getBoundingClientRect();bx=e.clientX-r.left-65});
 ar.addEventListener("pointerdown",e=>{const r=ar.getBoundingClientRect();bx=e.clientX-r.left-65});
 const kd=e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){keys[e.key]=true;e.preventDefault()}};
 const ku=e=>{keys[e.key]=false};
 window.addEventListener("keydown",kd);window.addEventListener("keyup",ku);
 function toast(s){const tt=document.getElementById("toast");if(!tt)return;tt.innerHTML=s;tt.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>tt.style.opacity=0,2200)}
 function spawn(){
  // etwa jedes zweite Wort ist ein gesuchtes
  const pool=Math.random()<.5?CATCH.filter(c=>c[1]===target):CATCH.filter(c=>c[1]!==target);
  const c=pick(pool);const el=document.createElement("div");el.className="fall";el.textContent=c[0];ar.appendChild(el);
  const x=10+Math.random()*(W()-130);words.push({el,c,x,y:-40,v:75+Math.random()*45+Math.min(score*2,40)});
 }
 function frame(t){
  if(over)return;if(!t0)t0=t;const el=(t-t0)/1000;const dt=Math.min(.05,(t-(frame.l||t))/1000);frame.l=t;
  if(keys.ArrowLeft)bx-=420*dt;if(keys.ArrowRight)bx+=420*dt;
  bx=Math.max(0,Math.min(W()-130,bx));bk.style.left=bx+"px";
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=1.05}
  const H=ar.clientHeight;
  words.forEach(w=>{if(w.done)return;w.y+=w.v*dt;w.el.style.left=w.x+"px";w.el.style.top=w.y+"px";
   const ww=w.el.offsetWidth;
   if(w.y+38>=H-64&&w.y<H-30&&w.x+ww>bx+10&&w.x<bx+120){w.done=true;w.el.remove();seen[w.c[0]]=w.c[1];
    if(w.c[1]===target){score++;star();document.getElementById("sc").textContent=score;toast(`✓ <b>${w.c[0]}</b> – ${CATQ[target]}`)}
    else{hearts--;document.getElementById("hh").textContent="❤️".repeat(Math.max(0,hearts))+"🤍".repeat(3-Math.max(0,hearts));toast(`<b>${w.c[0]}</b> ist ein ${CATNAME[w.c[1]]}: ${CATQ[w.c[1]]}`);if(hearts<=0)return finish()}}
   else if(w.y>H){w.done=true;w.el.remove();if(w.c[1]===target)seen[w.c[0]]=w.c[1]}});
  const left=Math.max(0,DUR-Math.floor(el));document.getElementById("tm").textContent=left;
  if(left<=0)return finish();
  raf=requestAnimationFrame(frame);
 }
 function finish(){
  over=true;cancelAnimationFrame(raf);
  const rows=Object.keys(seen).map(v=>`<li><b>${v}</b> – ${CATNAME[seen[v]]} <span class="muted">(${CATQ[seen[v]]})</span></li>`).join("");
  document.getElementById("fb").innerHTML=`<div class="ex"><p><b>Runde vorbei – ${score} Punkte!</b></p><p>Diese Verben sind dir begegnet:</p><ul class="list">${rows||"<li>–</li>"}</ul></div>
  <div class="row"><button class="btn sec" onclick="go(faenger)">Andere Verben fangen</button><button class="btn" onclick="go(()=>faengerRun('${target}'))">Noch einmal</button></div>`;
 }
 raf=requestAnimationFrame(frame);
 stopFn=()=>{over=true;cancelAnimationFrame(raf);window.removeEventListener("keydown",kd);window.removeEventListener("keyup",ku)};
}

/* ---------- 3 Memory ---------- */
function memory(){
 const PAIRS=6;let used=new Set(),pairs=[];
 while(pairs.length<PAIRS){
  const type=pick(typePool());let c=type==="DA"?pick(["D","A"]):type;
  let fk=pick(famPool());if(fk==="poss")fk=pick(["mein","dein","sein","ihr","unser"]);
  const noun=pick(NOUNS);if(used.has(noun.w))continue;used.add(noun.w);
  const w=form(fk,noun.g,c);
  pairs.push({id:pairs.length,a:`${famLabel(fk)} + ${noun.w}${S.tip?` <span class="muted">(${ART[noun.g]})</span>`:""}<small>${c==="D"?'<span class="bD">Dativ</span>':'<span class="bA">Akkusativ</span>'}</small>`,b:`${w} ${noun.w}`,ex:formExpl(fk,noun.g,c,noun.w)});
 }
 let cards=shuffle(pairs.flatMap(p=>[{p:p.id,h:p.a},{p:p.id,h:p.b}]));
 let open=[],done=0,tries=0,lock=false;
 app.innerHTML=`<div class="card">${backBtn()}<h2>🃏 Endungs-Memory</h2><p class="muted">Dreh zwei Karten um. Ein Paar sind der Begleiter mit dem Fall und die passende Form.</p>
 <div class="hud"><span>Paare: <span id="pd">0</span> / ${PAIRS}</span><span>Versuche: <span id="tr">0</span></span></div>
 <div class="memgrid" id="mg">${cards.map((c,k)=>`<button class="mcard" data-k="${k}">${c.h}</button>`).join("")}</div><div id="fb"></div></div>`;
 document.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k;if(lock||b.classList.contains("open")||b.classList.contains("done"))return;
  b.classList.add("open");open.push(k);
  if(open.length===2){tries++;document.getElementById("tr").textContent=tries;
   const [x,y]=open, bx=document.querySelector(`[data-k="${x}"]`), by=b;
   if(cards[x].p===cards[y].p){bx.classList.add("done");by.classList.add("done");done++;star();document.getElementById("pd").textContent=done;
    document.getElementById("fb").innerHTML=`<div class="ex"><p><b>Paar gefunden!</b></p><p>${pairs[cards[x].p].ex}</p></div>`;open=[];
    if(done===PAIRS)document.getElementById("fb").innerHTML+=`<div class="ex"><p><b>Alle Paare in ${tries} Versuchen!</b> ${tries<=9?"Ein super Gedächtnis!":"Beim nächsten Mal geht es noch schneller."}</p></div><div class="row"><span></span><button class="btn" onclick="go(memory)">Neues Memory</button></div>`;
   }else{lock=true;setTimeout(()=>{bx.classList.remove("open");by.classList.remove("open");open=[];lock=false},1100)}
  }
 });
}

/* ---------- 4 Fall-Detektiv ---------- */
function genDet(){
 const type=pick(typePool());
 const verb=pick(VERBS[type]);
 let objs=[];
 const fams=famPool(true).filter(f=>f!=="welch");
 const objFam=n=>{let f;do{f=pick(fams)}while(f==="ein"&&FAMILY.includes(n.w)&&fams.length>1);if(f==="ein"&&FAMILY.includes(n.w))f="def";if(f==="poss")f=pick(["mein","dein","sein","ihr","unser"]);return f};
 if(type==="A"){const n=pick(nounsOf(verb.o));objs=[{n,c:"A",fk:objFam(n)}]}
 else if(type==="D"){const n=pick(nounsOf(verb.o));objs=[{n,c:"D",fk:objFam(n)}]}
 else{const d=pick(nounsOf(["P"])),a=pick(nounsOf(["T"]));objs=[{n:d,c:"D",fk:objFam(d)},{n:a,c:"A",fk:objFam(a)}]}
 // Subjekt: wenn ein Akkusativ nicht männlich ist, muss das Subjekt männlich sein (sonst wäre der Satz mehrdeutig)
 const akk=objs.find(o=>o.c==="A");const needM=akk&&akk.n.g!=="m";
 let sn;do{sn=pick(nounsOf(["P"]))}while((needM&&sn.g!=="m")||objs.some(o=>o.n.w===sn.w));
 const sfk=FAMILY.includes(sn.w)?"def":pick(["def","ein"]);
 const subj={n:sn,c:"N",fk:sfk};
 objs.forEach(o=>{if(o.fk==="kein"&&objs.filter(p=>p.fk==="kein").length>1)o.fk="def"});
 const ph=o=>({txt:form(o.fk,o.n.g,o.c)+" "+o.n.w,c:o.c,o});
 let order;
 const frontable=objs.filter(o=>o.c==="D"||(o.c==="A"&&o.n.g==="m"));
 if(frontable.length&&Math.random()<.45){const f=pick(frontable);order=[ph(f),{verb:verb.c.er},ph(subj),...objs.filter(o=>o!==f).map(ph)]}
 else order=[ph(subj),{verb:verb.c.er},...objs.map(ph)];
 order[0].first=true;
 return {verb,order};
}
function detektiv(){
 const N_Q=8;let i=0,score=0,d,paint="N",marks={};
 function next(){
  if(i>=N_Q)return end();
  d=genDet();marks={};
  app.innerHTML=`<div class="card">${backBtn()}<h2>🔍 Fall-Detektiv</h2>${bar(i,N_Q)}
  <p class="muted">Wähle eine Farbe und tippe dann auf den passenden Satzteil. Achtung: Manchmal steht nicht das Subjekt am Anfang – schau auf die Endungen!</p>
  <div class="paint"><button class="tg N" data-p="N">Wer? · Nominativ</button><button class="tg A" data-p="A">Wen/Was? · Akkusativ</button><button class="tg D" data-p="D">Wem? · Dativ</button></div>
  <div class="sentence" id="sen"></div>
  <div class="row"><span class="count">Fall ${i+1} von ${N_Q}</span><button class="btn" id="chk">Prüfen</button></div><div id="fb"></div></div>`;
  document.querySelectorAll(".paint .tg").forEach(b=>b.onclick=()=>{paint=b.dataset.p;setPaint()});
  setPaint();draw();
  document.getElementById("chk").onclick=check;
 }
 function setPaint(){document.querySelectorAll(".paint .tg").forEach(b=>b.classList.toggle("on",b.dataset.p===paint))}
 function draw(res){
  const sen=document.getElementById("sen");
  const phs=d.order.filter(x=>!x.verb);
  sen.innerHTML=d.order.map((x,k)=>{
   if(x.verb)return x.verb;
   const t=x.first?cap(x.txt):x.txt;const pi=phs.indexOf(x);const m=marks[pi];
   const wrong=res&&m!==x.c;
   return `<span class="phr ${m||""} ${wrong?"wrong":""}" data-i="${pi}">${t}${m?`<span class="lab">${m==="N"?"Wer?":m==="A"?"Wen/Was?":"Wem?"}</span>`:""}</span>`;
  }).join(" ")+".";
  if(!res)sen.querySelectorAll(".phr").forEach(s=>s.onclick=()=>{marks[s.dataset.i]=paint;draw()});
 }
 function check(){
  const phs=d.order.filter(x=>!x.verb);
  if(Object.keys(marks).length<phs.length){document.getElementById("fb").innerHTML=`<div class="ex">Mal zuerst <b>alle</b> Satzteile an.</div>`;return}
  const allOk=phs.every((x,k)=>marks[k]===x.c);if(allOk){score++;star()}
  draw(true);
  const ex=phs.map(x=>{const o=x.o;const q=x.c==="N"?`<span class="bN">Wer?</span> → Nominativ`:x.c==="A"?`<span class="bA">Wen oder was?</span> → Akkusativ`:`<span class="bD">Wem?</span> → Dativ`;
   return `<p><b>${x.txt}</b>: ${q}. ${x.c==="N"?`Das ist die Person, die etwas tut. ${o.n.w} ist ${G[o.n.g]}, im Nominativ heißt es „${form(o.fk,o.n.g,"N")}“.`:formExpl(o.fk,o.n.g,x.c,o.n.w).replace(/<span class="muted">.*<\/span>/,"")}</p>`}).join("");
  document.getElementById("fb").innerHTML=`<div class="ex ${allOk?"":"badx"}"><p><b>${allOk?"Fall gelöst!":"Fast – die rot umrandeten Teile stimmen noch nicht."}</b></p><p>${caseExpl(d.verb,"D").split(" Die Lücke")[0]}</p>${ex}</div><div class="row"><span></span><button class="btn" id="nx">Nächster Fall →</button></div>`;
  document.getElementById("chk").disabled=true;
  document.getElementById("nx").onclick=()=>{i++;next()};
 }
 function end(){app.innerHTML=`<div class="card">${backBtn()}<h2>🔍 Alle Fälle bearbeitet!</h2><div class="big">${score} / ${N_Q}</div><p style="text-align:center">${score>=7?"Meisterdetektiv! Dich täuscht keine Satzstellung.":"Jeder Fall macht dich schärfer. Auf zur nächsten Runde!"}</p><div class="row" style="justify-content:center"><button class="btn" onclick="go(detektiv)">Neue Fälle</button></div></div>`}
 next();
}

/* ---------- 5 Satz-Werkstatt ---------- */
function werkstatt(){
 const W={s:null,v:null,d:null,a:null,fd:null,fa:null};
 const BEG=[["def","der / die / das"],["ein","ein / eine"],["kein","kein / keine"],["poss","mein / dein / sein …"],["dies","dies-"],["jed","jed-"]];
 function chips(key,list,lab){return `<div class="step">${lab}</div><div class="opts">${list.map((x,k)=>`<button class="opt ${W[key]===k?"sel":""}" onclick="wsSet('${key}',${k})">${x}</button>`).join("")}</div>`}
 const P=nounsOf(["P"]),T=nounsOf(["T"]);
 window.wsSet=(k,v)=>{W[k]=v;if(k==="fa"&&W.fd!==null&&BEG[W.fd][0]==="kein"&&BEG[v][0]==="kein")W.fd=null;if(k==="fd"&&W.fa!==null&&BEG[W.fa][0]==="kein"&&BEG[v][0]==="kein")W.fa=null;draw()};
 function draw(){
  const ready=Object.values(W).every(x=>x!==null);
  app.innerHTML=`<div class="card">${backBtn()}<h2>🛠️ Satz-Werkstatt</h2><p class="muted">Du bestimmst, was im Satz passiert. Danach setzt du die richtigen Formen ein.</p>
  ${chips("s",SUBJ.map(s=>s.w),"1 · Wer?")}
  ${chips("v",VERBS.DA.map(v=>v.inf),"2 · Was passiert?")}
  ${chips("d",P.map(n=>n.w+(S.tip?` <span class="chip">${ART[n.g]}</span>`:"")),'3 · <span class="bD">Wem?</span> (Person)')}
  ${chips("fd",BEG.map(b=>b[1]),'Begleiter für die Person')}
  ${chips("a",T.map(n=>n.w+(S.tip?` <span class="chip">${ART[n.g]}</span>`:"")),'4 · <span class="bA">Was?</span> (Sache)')}
  ${chips("fa",BEG.map(b=>b[1]),'Begleiter für die Sache')}
  <div class="row"><span class="muted">${ready?"Alles gewählt!":"Wähle in jeder Reihe etwas aus."}</span><button class="btn" ${ready?"":"disabled"} onclick="wsBuild()">Satz bauen →</button></div></div>`;
 }
 window.wsBuild=()=>{
  const s=SUBJ[W.s],v=VERBS.DA[W.v],dn=P[W.d],an=T[W.a];
  const rf=b=>b==="poss"?POSS[s.k]:b;
  const fd=rf(BEG[W.fd][0]),fa=rf(BEG[W.fa][0]);
  const g1={c:"D",g:dn.g,fk:fd,noun:dn.w,ans:form(fd,dn.g,"D"),opts:optsFor(fd,dn.g,"D")};
  const g2={c:"A",g:an.g,fk:fa,noun:an.w,ans:form(fa,an.g,"A"),opts:optsFor(fa,an.g,"A")};
  const chosen={1:null,2:null};
  function render(done){
   const gp=(g,k)=>`<span class="gap ${g.c} ${done?(chosen[k]===g.ans?"fill-"+g.c:"fill-bad"):""}">${chosen[k]||"&nbsp;"}</span>`;
   const sen=`${s.w} ${v.c[s.k]} ${gp(g1,1)} ${dn.w} ${gp(g2,2)} ${an.w}.`;
   const full=`${s.w} ${v.c[s.k]} ${g1.ans} ${dn.w} ${g2.ans} ${an.w}.`;
   const slot=(g,k,lab)=>`<div class="step">${lab}</div><div class="opts">${g.opts.map(o=>`<button class="opt ${chosen[k]===o?(done?(o===g.ans?"ok":"bad"):"sel"):(done&&o===g.ans?"ok":"")}" ${done?"disabled":""} onclick="wsPick(${k},'${o}')">${o}</button>`).join("")}</div>`;
   app.innerHTML=`<div class="card">${backBtn()}<h2>🛠️ Dein Satz</h2><div class="sentence">${sen}</div>
   ${slot(g1,1,`<span class="bD">Wem?</span> ${famLabel(fd)} + ${dn.w}`)}${slot(g2,2,`<span class="bA">Was?</span> ${famLabel(fa)} + ${an.w}`)}
   <div class="row"><button class="btn sec" onclick="go(werkstatt)">Neuen Satz bauen</button><button class="btn" ${done||!chosen[1]||!chosen[2]?"disabled":""} onclick="wsCheck()">Prüfen</button></div>
   <div id="fb">${done?`<div class="ex ${chosen[1]===g1.ans&&chosen[2]===g2.ans?"":"badx"}"><p><b>${chosen[1]===g1.ans&&chosen[2]===g2.ans?"Perfekt gebaut!":"Richtig heißt der Satz:"}</b> ${full} <button class="opt" style="font-size:15px;padding:3px 10px" onclick="speak('${full.replace(/'/g,"")}')">🔊</button></p><p>${caseExpl(v,"D").split(" Die Lücke")[0]}</p><p>${formExpl(fd,dn.g,"D",dn.w)}</p><p>${formExpl(fa,an.g,"A",an.w).replace(/<span class="muted">.*<\/span>/,"")}</p></div>`:""}</div></div>`;
  }
  window.wsPick=(k,o)=>{chosen[k]=o;render(false)};
  window.wsCheck=()=>{if(chosen[1]===g1.ans)star();if(chosen[2]===g2.ans)star();render(true)};
  render(false);
 };
 draw();
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- 6 Endungs-Rakete ---------- */
function genEnd(){
 // Endungs-Aufgabe: nur Begleiter mit Endungen (nicht der/die/das)
 let q;let n=0;
 do{q=genQ();n++}while(q.gap.fk==="def"&&n<40);
 if(q.gap.fk==="def"){ // falls nur der/die/das gewählt ist: dies- verwenden
  const save=S.fam;S.fam={dies:true};q=genQ();S.fam=save;
 }
 const fk=q.gap.fk;
 q.endOpts=(isDerT(fk)?["er","e","es","en","em"]:["","e","en","em","er"]);
 q.endAns=ending(fk,q.gap.g,q.gap.c);
 q.stem=q.gap.capit?cap(fk):fk;
 return q;
}
function rakete(){
 const N_Q=12;let i=0,score=0,q;
 function next(){
  if(i>=N_Q)return end();
  q=genEnd();
  draw(null);
 }
 function draw(chosen){
  const done=chosen!==null;const ok=chosen===q.endAns;
  const fill=done?q.stem+q.endAns:q.stem+"___";
  app.innerHTML=`<div class="card">${backBtn()}<h2>🚀 Endungs-Rakete</h2>
  <div class="rocketWrap"><div class="tower"><div class="rk" style="bottom:${8+score/N_Q*82}%">🚀</div></div><div style="flex:1">
  <div class="hud"><span>Aufgabe ${i+1} von ${N_Q}</span><span>Höhe: ${score*100} m</span></div>
  <div class="sentence">${renderParts(q,fill,done?(ok?"ok":"bad"):null)}</div>
  <div class="muted">Welche Endung bekommt <b>${q.stem}-</b>?</div>
  <div class="opts">${q.endOpts.map(e=>`<button class="opt ${done?(e===q.endAns?"ok":e===chosen?"bad":""):""}" ${done?"disabled":""} data-e="${e}">${e?"-"+e:"keine Endung"}</button>`).join("")}</div>
  <div id="fb">${done?`<div class="ex ${ok?"":"badx"}"><p><b>${ok?"Richtig – die Rakete steigt!":"Richtig ist „"+q.stem+q.endAns+"“."}</b></p>${q.expl}</div><div class="row"><span></span><button class="btn" id="nx">Weiter →</button></div>`:""}</div>
  </div></div></div>`;
  if(!done)document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const e=b.dataset.e;if(e===q.endAns){score++;star()}draw(e)});
  else document.getElementById("nx").onclick=()=>{i++;next()};
 }
 function end(){app.innerHTML=`<div class="card">${backBtn()}<h2>🚀 Landung!</h2><div class="big">${score*100} m</div><p style="text-align:center">${score>=11?"Bis ins All! Die Endungen sitzen.":score>=8?"Hoch hinaus – fast im Weltraum!":"Die Rakete ist gestartet. Mit jeder Runde fliegt sie höher!"}</p><div class="row" style="justify-content:center"><button class="btn" onclick="go(rakete)">Noch ein Start</button></div></div>`}
 next();
}

/* ---------- 7 Blitz-Runde ---------- */
function blitz(){
 app.innerHTML=`<div class="card">${backBtn()}<h2>⚡ Blitz-Runde</h2><p>Du hast <b>60 Sekunden</b>. Tipp so schnell wie möglich die richtige Form an. Am Ende siehst du alle Fehler mit Erklärung.</p><div class="row"><span></span><button class="btn gold" onclick="blitzRun()">Los geht's!</button></div></div>`;
}
function blitzRun(){
 let left=60,score=0,wrong=[],q,tm,to,stopped=false;
 function next(){
  q=genQ();
  app.innerHTML=`<div class="card">${backBtn()}<h2>⚡ Blitz-Runde</h2>
  <div class="hud"><span class="timer">⏱ <span id="tm">${left}</span> s</span><span>Richtig: ${score}</span><span>Fehler: ${wrong.length}</span></div>
  <div class="sentence">${renderParts(q)}</div>
  <div class="opts">${q.gap.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div><div id="fl" style="height:30px;margin-top:8px;font-weight:600"></div></div>`;
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
   const ok=b.dataset.o===q.gap.ans;
   if(ok){score++;star()}else wrong.push(q);
   document.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;if(x.dataset.o===q.gap.ans)x.classList.add("ok");else if(x===b)x.classList.add("bad")});
   to=setTimeout(()=>{if(left>0&&!stopped)next()},ok?350:900);
  });
 }
 tm=setInterval(()=>{left--;const e=document.getElementById("tm");if(e)e.textContent=left;if(left<=0){clearInterval(tm);clearTimeout(to);end()}},1000);
 function end(){
  app.innerHTML=`<div class="card">${backBtn()}<h2>⚡ Zeit um!</h2><div class="big">${score} richtig</div>
  ${wrong.length?`<h3 class="sec">Deine Fehler – so geht's richtig:</h3>${wrong.map(w=>`<div class="ex badx"><p><b>${w.full()}</b></p>${w.expl}</div>`).join("")}`:`<p style="text-align:center">Kein einziger Fehler – Blitzmeister!</p>`}
  <div class="row" style="justify-content:center"><button class="btn gold" onclick="go(blitzRun)">Noch einmal 60 Sekunden</button></div></div>`;
 }
 next();
 stopFn=()=>{stopped=true;clearInterval(tm);clearTimeout(to)};
}

/* ---------- 8 Meister-Prüfung ---------- */
function genVerbQ(){
 const all=[...VERBS.A,...VERBS.D,...VERBS.DA];const v=pick(all);
 const q=genQ(v);const ans=v.t;
 return {kind:"verb",v,ans,opts:["A","D","DA"],ex:q,
  html:`Welche Ergänzung braucht <b>„${v.inf}“</b>?`};
}
function pruefung(){
 const plan=shuffle([..."gggggggggggg",..."vvvv",..."eeee"]);
 let i=0,score=0,cur;
 function next(){
  if(i>=plan.length)return end();
  const k=plan[i];
  if(k==="g"){cur={kind:"gap",q:genQ()}}else if(k==="v")cur=genVerbQ();else cur={kind:"end",q:genEnd()};
  draw(null);
 }
 function draw(ch){
  const done=ch!==null;let body="",ok=false,ex="";
  if(cur.kind==="gap"){const q=cur.q;ok=ch===q.gap.ans;
   body=`<div class="sentence">${renderParts(q,done?q.gap.ans:null,done?(ok?"ok":"bad"):null)}</div><div class="opts">${q.gap.opts.map(o=>`<button class="opt ${done?(o===q.gap.ans?"ok":o===ch?"bad":""):""}" ${done?"disabled":""} data-a="${o}">${o}</button>`).join("")}</div>`;ex=q.expl}
  else if(cur.kind==="end"){const q=cur.q;ok=ch===q.endAns;
   body=`<div class="sentence">${renderParts(q,done?q.stem+q.endAns:q.stem+"___",done?(ok?"ok":"bad"):null)}</div><div class="muted">Welche Endung bekommt <b>${q.stem}-</b>?</div><div class="opts">${q.endOpts.map(e=>`<button class="opt ${done?(e===q.endAns?"ok":e===ch?"bad":""):""}" ${done?"disabled":""} data-a="${e}">${e?"-"+e:"keine Endung"}</button>`).join("")}</div>`;ex=q.expl}
  else{ok=ch===cur.ans;const lab={A:'nur <span class="bA">Akkusativ</span> (Wen/Was?)',D:'nur <span class="bD">Dativ</span> (Wem?)',DA:'<span class="bD">Dativ</span> + <span class="bA">Akkusativ</span> (Wem? Was?)'};
   body=`<div class="sentence">${cur.html}</div><div class="opts">${cur.opts.map(o=>`<button class="opt ${done?(o===cur.ans?"ok":o===ch?"bad":""):""}" ${done?"disabled":""} data-a="${o}">${lab[o]}</button>`).join("")}</div>`;
   ex=`<p>${caseExpl(cur.v,"D").split(" Die Lücke")[0]}</p><p>Beispiel: <b>${cur.ex.full()}</b></p>`}
  app.innerHTML=`<div class="card">${backBtn()}<h2>🏆 Meister-Prüfung</h2>${bar(i,plan.length)}<div class="hud"><span>Aufgabe ${i+1} von ${plan.length}</span><span>Punkte: ${score}</span></div>${body}
  <div id="fb">${done?`<div class="ex ${ok?"":"badx"}"><p><b>${ok?"Richtig!":"Nicht ganz."}</b></p>${ex}</div><div class="row"><span></span><button class="btn" id="nx">Weiter →</button></div>`:""}</div></div>`;
  if(!done)document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;
   const right=cur.kind==="gap"?cur.q.gap.ans:cur.kind==="end"?cur.q.endAns:cur.ans;if(a===right){score++;star()}draw(a)});
  else document.getElementById("nx").onclick=()=>{i++;next()};
 }
 function end(){
  const m=score>=18?["🥇","Gold! Du bist Fälle-Meister."]:score>=15?["🥈","Silber! Nur noch ein kleines Stück bis Gold."]:score>=11?["🥉","Bronze! Ein starker Anfang."]:["🌱","Weiter so – übe noch ein paar Spiele und versuch es dann wieder."];
  app.innerHTML=`<div class="card">${backBtn()}<h2>🏆 Ergebnis</h2><div class="medal">${m[0]}</div><div class="big">${score} / ${plan.length}</div><p style="text-align:center">${m[1]}</p><p class="muted" style="text-align:center">Gold ab 18 · Silber ab 15 · Bronze ab 11 Punkten</p><div class="row" style="justify-content:center"><button class="btn" onclick="go(pruefung)">Neue Prüfung</button></div></div>`;
 }
 next();
}

/* ---------- 9 Spickzettel ---------- */
function spick(){
 app.innerHTML=`<div class="card">${backBtn()}<h2>📖 Spickzettel</h2>
 <h3 class="sec">1 · Welcher Fall? Frag das Verb!</h3>
 <p><span class="bN">Wer?</span> → Nominativ – wer etwas tut.<br><span class="bA">Wen oder was?</span> → Akkusativ: sehen, suchen, finden, füttern, besuchen, fragen, brauchen, haben …<br><span class="bD">Wem?</span> → Dativ: helfen, danken, antworten, gratulieren, folgen, winken, vertrauen, gehören, gefallen …<br><span class="bD">Wem?</span> + <span class="bA">Was?</span> → beide: geben, schenken, zeigen, bringen, schicken, leihen, erklären, erzählen …</p>
 <div class="merk">Ich schenke <span class="bD">der Oma</span> <span class="bA">eine Blume</span>. <br><span class="muted">Wem? → der Oma (Person) · Was? → eine Blume (Sache)</span></div>
 <h3 class="sec">2 · der / die / das</h3>
 <table class="t"><tr><th></th><th>männlich</th><th>weiblich</th><th>sächlich</th></tr>
 <tr><td>Nominativ <span class="muted">(Wer?)</span></td><td>der</td><td>die</td><td>das</td></tr>
 <tr><td><span class="bA">Akkusativ</span></td><td><b>den</b></td><td>die</td><td>das</td></tr>
 <tr><td><span class="bD">Dativ</span></td><td><b>dem</b></td><td><b>der</b></td><td><b>dem</b></td></tr></table>
 <h3 class="sec">3 · ein / kein / mein / dein / sein / ihr / unser</h3>
 <table class="t"><tr><th></th><th>männlich</th><th>weiblich</th><th>sächlich</th></tr>
 <tr><td>Nominativ</td><td>ein</td><td>ein<b>e</b></td><td>ein</td></tr>
 <tr><td><span class="bA">Akkusativ</span></td><td>ein<b>en</b></td><td>ein<b>e</b></td><td>ein</td></tr>
 <tr><td><span class="bD">Dativ</span></td><td>ein<b>em</b></td><td>ein<b>er</b></td><td>ein<b>em</b></td></tr></table>
 <p class="muted">kein, mein, dein, sein, ihr, unser bekommen genau dieselben Endungen: keinen Hund, meinem Opa, ihrer Tante, unserem Kind.</p>
 <h3 class="sec">4 · dieser / jeder / welcher</h3>
 <p>Diese Wörter bekommen die Endung vom Artikel: d<b>er</b> → dies<b>er</b>, d<b>en</b> → dies<b>en</b>, d<b>em</b> → dies<b>em</b>, di<b>e</b> → dies<b>e</b>, d<b>as</b> → dies<b>es</b>.</p>
 <table class="t"><tr><th></th><th>männlich</th><th>weiblich</th><th>sächlich</th></tr>
 <tr><td>Nominativ</td><td>dies<b>er</b></td><td>dies<b>e</b></td><td>dies<b>es</b></td></tr>
 <tr><td><span class="bA">Akkusativ</span></td><td>dies<b>en</b></td><td>dies<b>e</b></td><td>dies<b>es</b></td></tr>
 <tr><td><span class="bD">Dativ</span></td><td>dies<b>em</b></td><td>dies<b>er</b></td><td>dies<b>em</b></td></tr></table>
 <div class="merk">Dativ-Trick: männlich und sächlich enden auf <b>-m</b>, weiblich auf <b>-r</b>.<br>dem · einem · meinem · diesem — der · einer · meiner · dieser</div>
 </div>`;
}
