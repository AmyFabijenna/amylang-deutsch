<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akkusativ-Zauber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf0f3; --card:#fffafb; --rose:#ecc3d0; --rose-soft:#f7e3ea;
  --berry:#9c2f5c; --berry-deep:#6b1f41; --ink:#1d1418; --muted:#6b5a61;
  --gold:#b48a35; --gold-deep:#8a6623; --gold-soft:#f6ebcf; --line:#ead2da;
  --shadow:0 6px 22px rgba(107,31,65,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:20px;line-height:1.55;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;max-width:860px;margin:0 auto}
.brand{font-weight:600;color:var(--berry-deep);letter-spacing:.3px;font-size:1.05rem}
.brand span{color:var(--gold)}
.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;font-size:.9rem;color:var(--berry-deep)}
.stars{background:var(--ink);color:#f3dfa6;border-radius:14px;padding:6px 14px;font-size:.9rem;font-weight:500}
main{max-width:860px;margin:0 auto;padding:6px 16px 60px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line);padding:30px 28px}
h1{font-size:2rem;margin:.2em 0 .3em;color:var(--berry-deep);font-weight:700;line-height:1.2}
h2{font-size:1.45rem;margin:.1em 0 .5em;color:var(--berry-deep);font-weight:600;line-height:1.25}
p{margin:.5em 0}
.center{text-align:center}
.muted{color:var(--muted)}
.illu{display:block;margin:0 auto;max-width:100%;height:auto}
.btn{background:var(--berry);color:#fff;border:none;border-radius:18px;padding:14px 28px;font-weight:500;box-shadow:0 4px 0 var(--berry-deep);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--berry-deep)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep)}
.btn.ghost{background:var(--card);color:var(--berry-deep);border:1.5px solid var(--rose);box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}

/* Menü */
.levels{display:grid;gap:14px;margin-top:18px}
.level{display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);transition:border-color .2s,transform .15s}
.level:hover{border-color:var(--berry);transform:translateY(-2px)}
.level .num{flex:0 0 52px;height:52px;border-radius:50%;background:var(--rose-soft);display:grid;place-items:center;font-size:1.5rem}
.level b{display:block;color:var(--berry-deep);font-weight:600}
.level small{color:var(--muted);font-size:.85rem;line-height:1.35;display:block}
.level .best{margin-left:auto;color:var(--gold);font-size:1.1rem;white-space:nowrap}

/* Regel */
.rulebox{background:var(--gold-soft);border-radius:20px;padding:16px 20px;margin:16px 0;border:1.5px solid #ead9ad}
.rulebox strong{color:var(--berry-deep)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.ncard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 8px;text-align:center;transition:all .35s}
.ncard .emo{font-size:2.6rem;line-height:1.2}
.ncard .art{font-weight:600;font-size:1.15rem;transition:all .35s}
.ncard .noun{font-size:1rem}
.ncard .tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.ncard.magic{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 4px rgba(180,138,53,.18)}
.ncard.magic .art{color:var(--gold-deep)}
.ncard.same .art{color:var(--berry-deep)}
button.ncard:hover{border-color:var(--berry)}
.ncard.wrongpick{border-color:var(--berry);background:var(--rose-soft)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}
.pop{animation:pop .5s ease}

/* Aufgabe */
.progress{height:12px;background:var(--rose-soft);border-radius:10px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--berry),var(--gold));border-radius:10px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.verbtag{display:inline-block;background:var(--ink);color:#f3dfa6;border-radius:12px;padding:4px 14px;font-size:.9rem;font-weight:500}
.pic{width:118px;height:118px;border-radius:50%;margin:14px auto 8px;display:grid;place-items:center;font-size:3.7rem;background:radial-gradient(circle at 35% 30%,#fff,var(--rose-soft));border:3px solid var(--rose);position:relative}
.pic::after{content:"✦";position:absolute;right:4px;top:6px;color:var(--gold);font-size:1.2rem}
.chip{display:inline-block;background:var(--rose-soft);border:1.5px dashed var(--berry);border-radius:14px;padding:3px 14px;font-size:.95rem;color:var(--berry-deep)}
.chip small{color:var(--muted)}
.sentence{font-size:1.6rem;font-weight:500;text-align:center;margin:18px 0 22px;line-height:1.6}
.gap{display:inline-block;min-width:96px;border-bottom:3px solid var(--berry);margin:0 6px;color:var(--gold-deep);font-weight:700;text-align:center}
.gap.filled{border-bottom-color:var(--gold);animation:pop .5s ease}
.gap.ok{color:var(--gold-deep)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px;margin:0 auto}
.opt{background:var(--card);border:2px solid var(--rose);border-radius:20px;padding:16px;font-size:1.35rem;font-weight:600;color:var(--ink);transition:all .2s}
.opt:hover:not(:disabled){border-color:var(--berry);background:var(--rose-soft);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep)}
.opt.wrong{background:var(--rose-soft);border-color:var(--berry);color:var(--berry-deep);text-decoration:line-through;text-decoration-thickness:2px}
.feedback{margin-top:22px;border-radius:22px;padding:18px 22px;font-size:1.02rem;line-height:1.6}
.feedback.good{background:var(--gold-soft);border:1.5px solid #e4d09e}
.feedback.bad{background:var(--rose-soft);border:1.5px solid var(--rose)}
.feedback h3{margin:0 0 6px;font-size:1.2rem;color:var(--berry-deep)}
.feedback .full{display:block;margin-top:8px;font-weight:600}
.feedback .again{display:block;margin-top:6px;font-size:.88rem;color:var(--muted)}
.feedback .row{margin-top:14px;justify-content:flex-end}
@media (max-width:560px){
  body{font-size:18px}
  .card{padding:22px 16px;border-radius:22px}
  h1{font-size:1.6rem}
  .sentence{font-size:1.3rem}
  .ncard .emo{font-size:2rem}
  .trio{gap:8px}
}
</style>
</head>

  const parts = it.s.split('___');
  let a = answerOf(it);
  if(parts[0]==='') a = cap(a);

  if(it.g==='p') return `die ${it.n} <small>(Mehrzahl)</small>`;

 {v:'mitnehmen', s:'Nimm ___ Jacke mit!', n:'Jacke', g:'f', t:'d', e:'🧥'},
 {v:'es gibt', s:'Im Kühlschrank gibt es ___ Torte.', n:'Torte', g:'f', t:'i', e:'🍰'},
 {v:'es gibt', s:'Im Zoo gibt es ___ Tiger.', n:'Tiger', g:'m', t:'i', e:'🐯'},
 {v:'lieben', s:'Ich liebe ___ Sonne.', n:'Sonne', g:'f', t:'d', e:'☀️'},
 {v:'reparieren', s:'Opa repariert ___ Fahrrad.', n:'Fahrrad', g:'n', t:'d', e:'🚲'},
 {v:'finden', s:'Ich finde ___ Knopf.', n:'Knopf', g:'m', t:'i', e:'🔘'},
 {v:'mögen', s:'Ich mag ___ Eis mit Erdbeeren.', n:'Eis', g:'n', t:'d', e:'🍦'},
 {v:'kennen', s:'Kennst du ___ Weg?', n:'Weg', g:'m', t:'d', e:'🗺️'},
 {v:'vergessen', s:'Ich vergesse nie ___ Mütze.', n:'Mütze', g:'f', t:'d', e:'🧢'}
];

const LEVEL_TRANSFORM = [
 {t:'d', verb:'Ich sehe …', cards:[['Hund','m','🐶'],['Katze','f','🐱'],['Pferd','n','🐴']]},
 {t:'d', verb:'Ich esse …', cards:[['Apfel','m','🍎'],['Banane','f','🍌'],['Ei','n','🥚']]},
 {t:'d', verb:'Ich finde …', cards:[['Ball','m','⚽'],['Tasche','f','👜'],['Buch','n','📕']]},
 {t:'i', verb:'Ich bekomme …', cards:[['Teddy','m','🧸'],['Blume','f','🌸'],['Geschenk','n','🎁']]},
 {t:'i', verb:'Ich backe …', cards:[['Kuchen','m','🎂'],['Pizza','f','🍕'],['Brot','n','🍞']]},
 {t:'i', verb:'Ich male …', cards:[['Stern','m','⭐'],['Sonne','f','☀️'],['Herz','n','💖']]},
 {t:'d', verb:'Ich trinke …', cards:[['Saft','m','🧃'],['Milch','f','🥛'],['Wasser','n','💧']]},
 {t:'i', verb:'Ich habe …', cards:[['Hamster','m','🐹'],['Katze','f','🐱'],['Kaninchen','n','🐰']]}
];

/* ---------- Speicher & Zustand ---------- */
let totalStars = 0;
let best = {};
try{ best = JSON.parse(localStorage.getItem('akkZauberBest')||'{}')||{}; }catch(e){ best={}; }
function saveBest(key,stars){
  if(!best[key] || stars>best[key]) best[key]=stars;
  try{ localStorage.setItem('akkZauberBest', JSON.stringify(best)); }catch(e){}
}
const app = document.getElementById('app');
const starsEl = document.getElementById('starsTotal');
function addStar(){ totalStars++; starsEl.textContent='★ '+totalStars; starsEl.classList.remove('pop'); void starsEl.offsetWidth; starsEl.classList.add('pop'); }
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const PRAISE = ['Richtig!','Super gemacht!','Zauberhaft!','Genau so!','Toll!','Wunderbar!','Perfekt!'];
const praise = () => PRAISE[Math.floor(Math.random()*PRAISE.length)];
const scrollUp = () => window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('homeBtn').onclick = showMenu;

/* ---------- Startbildschirm ---------- */
function showStart(){
  app.innerHTML = `
  <div class="card center">
    ${SVG_CHEST}
    <h1>Der Akkusativ-Zauber</h1>
    <p>In dieser Zauberkiste steckt ein kleines Geheimnis über <b>der</b>, <b>die</b> und <b>das</b>. Nach manchen Verben verwandelt sich nämlich ein Wort – aber nur ein einziges!</p>
    <p class="muted">Findest du heraus, welches?</p>
    <div class="row"><button class="btn" id="go">Zauberkiste öffnen ✨</button></div>
  </div>`;
  document.getElementById('go').onclick = showMenu;
}

/* ---------- Menü ---------- */
function showMenu(){
  const b = k => best[k] ? '★'.repeat(best[k]) + '☆'.repeat(3-best[k]) : '';
  app.innerHTML = `
  <div class="card">
    <h2>Wähle dein Zauber-Level</h2>
    <p class="muted">Am besten spielst du der Reihe nach – von oben nach unten.</p>
    <div class="levels">
      <button class="level" data-l="rule"><span class="num">🪄</span><span><b>1 · Die Zauberregel</b><small>Schau zu, welches Wort sich verwandelt.</small></span></button>
      <button class="level" data-l="tr"><span class="num">🔍</span><span><b>2 · Wer verwandelt sich?</b><small>Tippe auf das Wort, das sich verwandelt.</small></span><span class="best">${b('tr')}</span></button>
      <button class="level" data-l="den"><span class="num">👑</span><span><b>3 · Der den-Zauber</b><small>der wird zu den – übe mit vielen Verben.</small></span><span class="best">${b('den')}</span></button>
      <button class="level" data-l="einen"><span class="num">💎</span><span><b>4 · Der einen-Zauber</b><small>ein wird zu einen – bei männlichen Wörtern.</small></span><span class="best">${b('einen')}</span></button>
      <button class="level" data-l="mix"><span class="num">🌟</span><span><b>5 · Die große Zauberprobe</b><small>Jetzt gemischt: Verwandelt es sich – oder bleibt es gleich?</small></span><span class="best">${b('mix')}</span></button>
    </div>
  </div>`;
  app.querySelectorAll('.level').forEach(btn=>btn.onclick=()=>{
    const l=btn.dataset.l;
    if(l==='rule') showRule();
    else if(l==='tr') playTransform();
    else if(l==='den') playLevel('den', LEVEL_DEN, 'Der den-Zauber');
    else if(l==='einen') playLevel('einen', LEVEL_EINEN, 'Der einen-Zauber');
    else playLevel('mix', LEVEL_MIX, 'Die große Zauberprobe');
  });
  scrollUp();
}

/* ---------- Zauberregel ---------- */
function trioHTML(set, t){
  return `<div class="trio">${set.map(([n,g,e])=>`
    <div class="ncard" data-g="${g}">
      <div class="emo">${e}</div>
      <div class="art">${t==='d'?DEF[g]:IND[g]}</div>
      <div class="noun">${n}</div>
      <div class="tag">${GW[g]}</div>
    </div>`).join('')}</div>`;
}
function showRule(){
  const set=[['Hund','m','🐶'],['Katze','f','🐱'],['Pferd','n','🐴']];
  app.innerHTML = `
  <div class="card">
    <h2>Die Zauberregel</h2>
    ${SVG_WAND}
    <p>Manche Verben sind <b>Zauberverben</b>: <i>sehen, finden, haben, essen, malen …</i> Danach fragst du: <b>Wen oder was?</b> – zum Beispiel: Ich sehe … <i>wen oder was?</i></p>
    <p>Tippe auf den Zauberstab und schau genau hin, was passiert:</p>
    <div id="demo1">${trioHTML(set,'d')}</div>
    <div class="row"><button class="btn gold" id="w1">🪄 Ich sehe …</button></div>
    <div id="after1"></div>
  </div>`;
  document.getElementById('w1').onclick = ()=>{
    magicTrio(document.getElementById('demo1'),'d');
    document.getElementById('w1').disabled=true;
    document.getElementById('after1').innerHTML = `
      <div class="rulebox"><strong>Hast du es gesehen?</strong> Nur <b>der Hund</b> hat sich verwandelt: <b>der → den</b>. Der Hund ist ein <b>männliches</b> Wort. <b>die Katze</b> und <b>das Pferd</b> bleiben genau so, wie sie sind.</div>
      <p>Und jetzt mit <b>ein</b> und <b>eine</b>. Pass gut auf – Hund und Pferd haben beide <b>ein</b>!</p>
      <div id="demo2">${trioHTML(set,'i')}</div>
      <div class="row"><button class="btn gold" id="w2">🪄 Ich habe …</button></div>
      <div id="after2"></div>`;
    document.getElementById('w2').onclick = ()=>{
      magicTrio(document.getElementById('demo2'),'i');
      document.getElementById('w2').disabled=true;
      document.getElementById('after2').innerHTML = `
        <div class="rulebox"><strong>Die Zauberregel:</strong><br>
        Nach einem Zauberverb verwandeln sich <b>nur männliche Wörter</b>:<br>
        <b>der → den</b> &nbsp;und&nbsp; <b>ein → einen</b>.<br>
        Alle anderen bleiben gleich: <b>die</b> bleibt <b>die</b>, <b>das</b> bleibt <b>das</b>, <b>eine</b> bleibt <b>eine</b>. Und <b>ein Pferd</b> bleibt <b>ein Pferd</b>, weil es sächlich ist: <b>das</b> Pferd.</div>
        <div class="row"><button class="btn" id="next">Jetzt bist du dran! →</button></div>`;
      document.getElementById('next').onclick = playTransform;
    };
  };
  scrollUp();
}
function magicTrio(box,t){
  box.querySelectorAll('.ncard').forEach(c=>{
    const g=c.dataset.g, art=c.querySelector('.art');
    if(g==='m'){ art.textContent = t==='d'?'den':'einen'; c.classList.add('magic','pop'); }
    else c.classList.add('same');
  });
}

/* ---------- Level 2: Wer verwandelt sich? ---------- */
function playTransform(){
  const rounds = shuffle(LEVEL_TRANSFORM);
  let i=0, firstTry=0;
  function render(){
    const r=rounds[i];
    const cards=shuffle(r.cards);
    app.innerHTML = `
    <div class="card">
      <div class="meta"><span>Wer verwandelt sich?</span><span>${i+1} / ${rounds.length}</span></div>
      <div class="progress"><i style="width:${i/rounds.length*100}%"></i></div>
      <p class="center"><span class="verbtag">${r.verb}</span></p>
      <h2 class="center">Welches Wort verwandelt sich nach dem Verb?</h2>
      <div class="trio">${cards.map(([n,g,e],k)=>`
        <button class="ncard" data-k="${k}">
          <div class="emo">${e}</div>
          <div class="art">${r.t==='d'?DEF[g]:IND[g]}</div>
          <div class="noun">${n}</div>
          <div class="tag">${r.t==='i' ? '('+DEF[g]+')' : '&nbsp;'}</div>
        </button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
    const btns=[...app.querySelectorAll('button.ncard')];
    btns.forEach(b=>b.onclick=()=>{
      const [n,g]=cards[+b.dataset.k];
      const masc=cards.find(c=>c[1]==='m');
      btns.forEach(x=>x.disabled=true);
      btns.forEach((x,k)=>{
        const c=cards[k];
        if(c[1]==='m'){ x.querySelector('.art').textContent = r.t==='d'?'den':'einen'; x.classList.add('magic','pop'); }
        else x.classList.add('same');
      });
      const ok = g==='m';
      if(ok){ firstTry++; addStar(); }
      else b.classList.add('wrongpick');
      const mA = r.t==='d' ? `der ${masc[0]} → den ${masc[0]}` : `ein ${masc[0]} → einen ${masc[0]}`;
      let txt;
      if(ok){
        txt = `„${n}“ ist männlich (der ${n}). Nur männliche Wörter verwandeln sich: <b>${mA}</b>. Die anderen bleiben, wie sie sind.`;
        if(r.t==='i'){ const neu=cards.find(c=>c[1]==='n'); txt += ` Achtung: <b>ein ${neu[0]}</b> bleibt <b>ein ${neu[0]}</b>, obwohl es auch „ein“ hat – denn es heißt <b>das</b> ${neu[0]}.`; }
      } else {
        const a = r.t==='d'?DEF[g]:IND[g];
        txt = `„${n}“ ist ${GW[g]} (${DEF[g]} ${n}) – darum bleibt <b>${a} ${n}</b> genau so. Verwandeln tut sich nur das männliche Wort: <b>${mA}</b>.`;
        if(r.t==='i' && g==='n') txt += ` „ein“ allein verrät es nicht: Schau, ob es <b>der</b> oder <b>das</b> heißt.`;
      }
      document.getElementById('fb').innerHTML = `
        <div class="feedback ${ok?'good':'bad'}">
          <h3>${ok?praise()+' ✨':'Fast! Schau mal genau:'}</h3>${txt}
          <div class="row"><button class="btn" id="nx">${i<rounds.length-1?'Weiter →':'Fertig ✨'}</button></div>
        </div>`;
      document.getElementById('nx').onclick=()=>{ i++; if(i<rounds.length) render(); else finish('tr','Wer verwandelt sich?',firstTry,rounds.length,()=>playLevel('den',LEVEL_DEN,'Der den-Zauber')); };
    });
    scrollUp();
  }
  render();
}

/* ---------- Erklärungen ---------- */
function explain(it, chosen){
  const n=it.n, g=it.g, ans=answerOf(it);
  const ask = it.v==='es gibt'
    ? 'Nach „es gibt“ kommt immer der Akkusativ.'
    : `Nach „${it.v}“ fragst du: Wen oder was?`;
  let pre='';
  if(chosen!==ans){
    if(g==='m'){
      if(chosen==='der') pre='„der“ ist die Grundform – so steht das Wort im Wörterbuch. Nach diesem Verb verwandelt es sich aber. ';
      else if(chosen==='ein') pre='„ein“ ist fast richtig! Aber männliche Wörter bekommen nach dem Zauberverb ein -en am Ende: einen. ';
      else if(chosen==='einem') pre='„einem“ ist eine andere Form, die du später kennenlernst (zum Beispiel nach „mit“). ';
      else pre=`„${chosen}“ passt nicht zu „${n}“, denn es heißt der ${n}. `;
    } else {
      if(chosen==='den' || chosen==='einen') pre=`„${chosen}“ gibt es nur bei männlichen Wörtern. „${n}“ ist aber ${g==='p'?'Mehrzahl':GW[g]}. `;
      else if(chosen==='einem') pre='„einem“ ist eine andere Form, die du später kennenlernst (zum Beispiel nach „mit“). ';
      else if(g==='p') pre=`In der Mehrzahl heißt es immer „die“. `;
      else pre=`„${chosen}“ passt nicht zu „${n}“ – es heißt ${DEF[g]} ${n}. `;
    }
  }
  let core;
  if(g==='m') core = it.t==='d'
    ? `„${n}“ ist männlich: der ${n}. ${ask} Bei männlichen Wörtern wird <b>der zu den</b>.`
    : `„${n}“ ist männlich: der ${n}. ${ask} Bei männlichen Wörtern wird <b>ein zu einen</b>.`;
  else if(g==='p') core = `„${n}“ ist Mehrzahl: die ${n}. ${ask} Die Mehrzahl verwandelt sich nicht – <b>die bleibt die</b>.`;
  else if(it.t==='d') core = `„${n}“ ist ${GW[g]}: ${DEF[g]} ${n}. ${ask} ${cap(GW[g])}e Wörter verwandeln sich nicht – <b>${DEF[g]} bleibt ${DEF[g]}</b>.`;
  else core = `„${n}“ ist ${GW[g]}: ${DEF[g]} ${n}. ${ask} ${cap(GW[g])}e Wörter verwandeln sich nicht – <b>${IND[g]} bleibt ${IND[g]}</b>.`;
  return pre + core + `<span class="full">→ ${fullSentence(it)}</span>`;
}

/* ---------- Spiel-Level ---------- */
function playLevel(key, items, title){
  let queue = shuffle(items).map(x=>({...x}));
  const total = items.length;
  let done=0, firstTry=0;
  function render(){
    const it=queue[0];
    const opts = shuffle(it.t==='d'?OPTS_D:OPTS_I);
    const [before,after] = it.s.split('___');
    app.innerHTML = `
    <div class="card">
      <div class="meta"><span>${title}</span><span>${Math.min(done+1,total)} / ${total}</span></div>
      <div class="progress"><i style="width:${done/total*100}%"></i></div>
      <p class="center"><span class="verbtag">${it.v}</span></p>
      <div class="pic">${it.e}</div>
      <p class="center"><span class="chip">${chipHTML(it)}</span></p>
      <div class="sentence">${before}<span class="gap" id="gap">&nbsp;</span>${after}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
    const btns=[...app.querySelectorAll('.opt')];
    btns.forEach(b=>b.onclick=()=>{
      const chosen=b.dataset.o, ans=answerOf(it), ok=chosen===ans;
      btns.forEach(x=>{ x.disabled=true; if(x.dataset.o===ans) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      const gap=document.getElementById('gap');
      gap.textContent = before==='' ? cap(ans) : ans;
      gap.classList.add('filled','ok');
      if(ok && !it.retry){ firstTry++; addStar(); }
      let againNote='';
      if(!ok && !it.retry){ queue.push({...it,retry:true}); againNote='<span class="again">Diese Aufgabe kommt später noch einmal – dann klappt es bestimmt!</span>'; }
      document.getElementById('fb').innerHTML = `
        <div class="feedback ${ok?'good':'bad'}">
          <h3>${ok?praise()+' ✨':'Fast! Schau mal:'}</h3>
          ${explain(it, chosen)}${againNote}
          <div class="row"><button class="btn" id="nx">Weiter →</button></div>
        </div>`;
      document.getElementById('nx').onclick=()=>{
        if(!it.retry) done++;
        queue.shift();
        if(queue.length) render();
        else {
          const nextMap={den:()=>playLevel('einen',LEVEL_EINEN,'Der einen-Zauber'), einen:()=>playLevel('mix',LEVEL_MIX,'Die große Zauberprobe'), mix:null};
          finish(key,title,firstTry,total,nextMap[key]);
        }
      };
      document.getElementById('nx').focus();
    });
    scrollUp();
  }
  render();
}

/* ---------- Abschluss ---------- */
function finish(key,title,score,total,next){
  const r=score/total, stars = r>=0.9?3:r>=0.7?2:1;
  saveBest(key,stars);
  const msg = stars===3 ? 'Du bist eine echte Akkusativ-Zauberin!' : stars===2 ? 'Sehr schön gezaubert! Mit etwas Übung schaffst du alle drei Sterne.' : 'Gut gemacht, dass du bis zum Ende geübt hast! Spiel das Level ruhig noch einmal.';
  app.innerHTML = `
  <div class="card center">
    ${SVG_CROWN}
    <h1>${title} geschafft!</h1>
    <p style="font-size:2rem;color:var(--gold);margin:.2em 0">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
    <p>Beim ersten Versuch richtig: <b>${score} von ${total}</b></p>
    <p class="muted">${msg}</p>
    <div class="rulebox" style="text-align:left"><strong>Merk dir:</strong> Nur männliche Wörter verwandeln sich – <b>der → den</b>, <b>ein → einen</b>. Alle anderen bleiben gleich.</div>
    <div class="row">
      <button class="btn ghost" id="again">Nochmal spielen</button>
      <button class="btn ghost" id="menu">Zum Menü</button>
      ${next?'<button class="btn" id="next">Nächstes Level →</button>':''}
    </div>
  </div>`;
  document.getElementById('menu').onclick=showMenu;
  document.getElementById('again').onclick=()=>{
    if(key==='tr') playTransform();
    else if(key==='den') playLevel('den',LEVEL_DEN,'Der den-Zauber');
    else if(key==='einen') playLevel('einen',LEVEL_EINEN,'Der einen-Zauber');
    else playLevel('mix',LEVEL_MIX,'Die große Zauberprobe');
  };
  if(next) document.getElementById('next').onclick=next;
  scrollUp();
}

showStart();
</script>
</body>
</html>
