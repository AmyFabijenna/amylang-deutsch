<!doctype html>
<html lang="de"><head>
<script src="/daf/interdaf/passwort.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch-Training: auf zur Eins!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#161823;--card:#1f2233;--card2:#2a2e45;--tx:#dfe3f0;--mu:#9aa1bd;--bl:#7aa2f7;--gr:#7ed6a5;--vi:#bb9af7;--or:#f2a56b;--pk:#f28fad;--te:#5ccfe6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:6px 0 2px;background:linear-gradient(90deg,var(--bl),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin:0 0 14px;font-size:.95rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{border:2px solid var(--c);background:transparent;color:var(--tx);padding:7px 13px;border-radius:999px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
.tab.on{background:var(--c);color:#14151f}
details{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:14px;color:var(--mu);font-size:.95rem}
summary{cursor:pointer;color:var(--te);font-weight:700}
.top{display:flex;justify-content:space-between;color:var(--mu);font-weight:700;font-size:.95rem}
.bar{height:8px;background:var(--card);border-radius:9px;margin:6px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--gr));border-radius:9px;transition:width .3s}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 4px 18px #0004}
.ins{color:var(--or);font-weight:800;margin-bottom:8px}
.p{font-size:1.25rem;margin-bottom:14px}
mark{background:#7aa2f733;color:var(--bl);padding:1px 7px;border-radius:8px;font-weight:800}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.lb{width:64px;color:var(--mu);font-size:.85rem;font-weight:700}
.chip,.w{border:2px solid var(--c,var(--vi));background:var(--card2);color:var(--tx);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.on,.w.on{background:var(--c,var(--vi));color:#14151f;font-weight:800}
.chip.right,.w.right{outline:3px solid var(--gr);outline-offset:1px}
.chip.wrong,.w.wrong{outline:3px solid var(--pk);outline-offset:1px;text-decoration:line-through}
.w{margin:4px 3px;--c:var(--vi)}
input{font:inherit;font-size:1.2rem;background:var(--card2);color:var(--tx);border:2px solid var(--te);border-radius:12px;padding:8px 14px;width:min(260px,100%)}
.btn{margin-top:16px;border:0;background:linear-gradient(90deg,var(--bl),var(--vi));color:#14151f;font:inherit;font-weight:800;padding:11px 24px;border-radius:14px;cursor:pointer}
.fb{margin-top:14px;padding:10px 14px;border-radius:12px;font-weight:700}
.fb.ok{background:#7ed6a522;color:var(--gr)}.fb.no{background:#f28fad22;color:var(--pk)}
.res{text-align:center}.big{font-size:3rem;font-weight:800;color:var(--gr)}
.note{font-size:1.4rem;color:var(--or);font-weight:800}
</style></head>
<body><div id="app"></div>
<script>
const R=a=>a[Math.floor(Math.random()*a.length)];
const NP=`‹Der Hund› bellt laut.|mSkN
Ich sehe ‹den Hund› im Park.|mSkA
Ich gebe ‹dem Hund› einen Knochen.|mSkD
Das ist das Fell ‹des Hundes›.|mSkG
‹Die Freundschaft› ist wichtig.|fSaN
Er vertraut ‹der Freundschaft›.|fSaD
Wir lieben ‹die Freiheit›.|fSaA
Der Wert ‹der Liebe› ist groß.|fSaG
‹Das Kind› lacht.|nSkN
Sie hilft ‹dem Kind›.|nSkD
Ich höre ‹das Lied›.|nSkA
Die Farbe ‹des Himmels› ist blau.|mSkG
‹Die Kinder› spielen im Hof.|nPkN
Ich schenke ‹den Kindern› Bücher.|nPkD
Er hat ‹die Hausübungen› vergessen.|fPkA
Der Lehrer lobt ‹die Schüler›.|mPkA
‹Der Mut› hilft ihm.|mSaN
Sie bewundert ‹den Mut› des Jungen.|mSaA
Sie spürt ‹die Angst› im Bauch.|fSaA
Wir sind ‹dem Glück› dankbar.|nSaD
‹Das Glück› ist nicht planbar.|nSaN
Das Heft ‹der Schülerin› liegt da.|fSkG
Ich gebe ‹der Katze› Milch.|fSkD
‹Die Blumen› blühen im Garten.|fPkN
Er hilft ‹den Freunden›.|mPkD
Der Duft ‹der Rosen› ist schön.|fPkG
‹Die Wut› war groß.|fSaN
Mama liest ‹das Buch›.|nSkA`.split("\n");
const W="Hund mk,Katze fk,Haus nk,Tisch mk,Schule fk,Fenster nk,Banane fk,Lehrerin fk,Buch nk,Garten mk,Apfel mk,Sonne fk,Wasser nk,Mädchen nk,Liebe fa,Mut ma,Glück na,Freundschaft fa,Zeit fa,Angst fa,Frieden ma,Freiheit fa,Wut fa,Spaß ma,Hoffnung fa,Geduld fa,Ärger ma,Streit ma,Stolz ma,Sehnsucht fa,Neugier fa".split(",");
const NUM="Hund S,Hunde P,Kinder P,Haus S,Häuser P,Liebe S,Freunde P,Mut S,Bücher P,Tisch S,Tische P,Freiheit S,Freiheiten P,Zeit S,Äpfel P,Apfel S,Katzen P,Schule S,Blumen P".split(",");
const PR=`*Er hat *meine Hausübung gefressen.
*Wir spielen mit *unserem Ball.
Gibst *du *mir *deinen Stift?
*Dieser Apfel schmeckt *mir sehr gut.
*Sie schenkt *ihrer Freundin ein Buch.
Der Hund wartet auf *sein Futter.
*Ich sehe *euch im Park.
*Jener Baum ist sehr alt.
*Wer hat *meinen Kuli genommen?
*Unsere Lehrerin lobt *uns.
*Das ist *mein Bruder und *er mag Fußball.
Die Kinder haben *ihre Jause vergessen.
*Es regnet, aber *wir gehen hinaus.
*Welches Buch liest *du gerade?
Der Lehrer erklärt *uns *diese Aufgabe.
*Jemand klopft an *meine Tür.`.split("\n");
const SUF="bar A essbar,haft A schmackhaft,heit N Schönheit,ig A mutig,keit N Freundlichkeit,lich A freundlich,los A hilflos,nis N Ergebnis,sal N Schicksal,sam A langsam,tum N Reichtum,ung N Wohnung,schaft N Freundschaft,ling N Liebling,isch A kindisch".split(",");
const WA="Hoffnung N,Zeitung N,Gesundheit N,Dankbarkeit N,Geheimnis N,Irrtum N,Wachstum N,Erlebnis N,Gemeinschaft N,Zwilling N,Rettung N,Krankheit N,Heiterkeit N,furchtbar A,lebhaft A,ruhig A,sportlich A,sorglos A,sparsam A,friedlich A,sichtbar A,schmerzhaft A,neblig A,wunderbar A,wertlos A,hungrig A".split(",");
const AD="klein,kleiner,kleinsten;schnell,schneller,schnellsten;alt,älter,ältesten;jung,jünger,jüngsten;lang,länger,längsten;stark,stärker,stärksten;warm,wärmer,wärmsten;kalt,kälter,kältesten;kurz,kürzer,kürzesten;klug,klüger,klügsten;groß,größer,größten;leicht,leichter,leichtesten;heiß,heißer,heißesten;nett,netter,nettesten;schön,schöner,schönsten;dumm,dümmer,dümmsten;hell,heller,hellsten;laut,lauter,lautesten;arm,ärmer,ärmsten;gesund,gesünder,gesündesten;gut,besser,besten;viel,mehr,meisten;gern,lieber,liebsten;hoch,höher,höchsten;nah,näher,nächsten;wenig,weniger,wenigsten".split(";").map(s=>s.split(","));
const ST="schön J,Hund N,laufen N,groß J,Tisch N,ich N,der N,schnell J,hoch J,mutig J,Liebe N,viel J,gut J,gern J,und N,Schule N,klein J,mein N".split(",");
const FK=[["Wer oder was?","Nominativ","1. Fall"],["Wessen?","Genitiv","2. Fall"],["Wem?","Dativ","3. Fall"],["Wen oder was?","Akkusativ","4. Fall"]];
const BL="var(--bl)",GR="var(--gr)";
const FALL=["Nominativ","Genitiv","Dativ","Akkusativ"];
const G={
 nomen(){const [s,c]=R(NP).split("|");return{k:s,ins:"Kreuze zum markierten Nomen den passenden Begriff an.",p:s.replace(/‹(.+?)›/,"<mark>$1</mark>"),parts:[
  {l:"Genus",o:["feminin","neutral","maskulin"],a:"fnm".indexOf(c[0])},
  {l:"Zahl",o:["Singular","Plural"],a:"SP".indexOf(c[1])},
  {l:"Art",o:["konkret","abstrakt"],a:"ka".indexOf(c[2])},
  {l:"Fall",o:FALL,a:"NGDA".indexOf(c[3])}]}},
 blitz(){if(Math.random()<.3){const [w,n]=R(NUM).split(" ");return{k:w,ins:"Singular oder Plural?",p:`<mark>${w}</mark>`,parts:[{l:"Zahl",o:["Singular","Plural"],a:"SP".indexOf(n)}]}}
  const [w,c]=R(W).split(" ");return{k:w,ins:"Bestimme das Nomen.",p:`<mark>${w}</mark>`,parts:[{l:"Genus",o:["feminin","neutral","maskulin"],a:"fnm".indexOf(c[0])},{l:"Art",o:["konkret","abstrakt"],a:"ka".indexOf(c[1])}]}},
 pron(){const s=R(PR);return{k:s,ins:"Markiere alle Pronomen im Satz (tippe sie an).",p:"",pron:s.split(" ").map(w=>({w:w.replace("*",""),x:w[0]=="*"}))}},
 suf(){const O=["Nomen (blau)","Adjektiv (grün)"],C=[BL,GR];
  if(Math.random()<.5){const [s,a,e]=R(SUF).split(" ");return{k:s,ins:"Ordne das Suffix zu.",p:`<mark>-${s}</mark> <span style="color:var(--mu);font-size:.9rem">(z. B. ${e})</span>`,parts:[{l:"Wortart",o:O,c:C,a:a=="N"?0:1}]}}
  const [w,a]=R(WA).split(" ");return{k:w,ins:"Nomen oder Adjektiv? Das Suffix verrät es.",p:`<mark>${w}</mark>`,parts:[{l:"Wortart",o:O,c:C,a:a=="N"?0:1}]}},
 steig(){const r=Math.random(),A=R(AD);
  if(r<.15)return{k:"w"+Math.random(),ins:"Wähle richtig.",p:"Steigern kann ich nur diese Wortart:",parts:[{l:"",o:["Nomen","Verb","Adjektiv","Pronomen"],a:2}]};
  if(r<.35){const [w,j]=R(ST).split(" ");return{k:w,ins:"Kann man das Wort steigern?",p:`<mark>${w}</mark>`,parts:[{l:"",o:["Ja","Nein"],a:j=="J"?0:1}]}}
  if(r<.55)return{k:A[1]+"p",ins:"Bilde den Positiv.",p:`Positiv zu „${A[1]}“:`,text:1,acc:[A[0]]};
  if(r<.8)return{k:A[0]+"k",ins:"Bilde den Komparativ.",p:`Positiv „${A[0]}“ → Komparativ:`,text:1,acc:[A[1]]};
  return{k:A[0]+"s",ins:"Bilde den Superlativ (ohne „am“ oder mit, beides gilt).",p:`Positiv „${A[0]}“ → Superlativ: am …`,text:1,acc:[A[2]]}},
 fall(){const f=R(FK),t=Math.floor(Math.random()*4);const m=[[0,1,"Welcher Fall gehört zur Frage?"],[1,0,"Wie lautet die Frage?"],[2,1,"Wie heißt der Fall?"],[1,2,"Welche Zahl hat der Fall?"]][t];
  return{k:f[0]+t,ins:m[2],p:`<mark>${f[m[0]]}</mark>`,parts:[{l:"",o:FK.map(x=>x[m[1]]),a:FK.indexOf(f)}]}}
};
const SECS=[["nomen","Nomen-Profi","var(--bl)"],["blitz","Blitz-Nomen","var(--te)"],["pron","Pronomen","var(--vi)"],["suf","Suffixe","var(--gr)"],["steig","Steigern","var(--or)"],["fall","Fälle","var(--pk)"],["mix","⭐ Mix-Test","var(--or)"]];
const TIPS={
nomen:"<b>Fall:</b> Nominativ = Wer oder was? · Genitiv = Wessen? · Dativ = Wem? · Akkusativ = Wen oder was?<br><b>Abstrakt</b> = man kann es nicht anfassen (Liebe, Mut). <b>Konkret</b> = man kann es anfassen (Hund, Tisch).",
blitz:"Mit dem Artikel erkennst du das Genus: der = maskulin, die = feminin, das = neutral. Plural: <i>die</i> + Endung (Hunde, Häuser).",
pron:"Pronomen stehen für ein Nomen (<i>er, sie, es, ich, du, wir, mir, uns</i>) oder begleiten es (<i>mein, dein, sein, ihr, unser, euer, dieser, jener</i>). Auch Fragepronomen wie <i>wer</i>, <i>welches</i> zählen.",
suf:"<b>Nomen (blau):</b> -heit, -keit, -ung, -nis, -sal, -tum, -schaft, -ling<br><b>Adjektiv (grün):</b> -bar, -haft, -ig, -lich, -los, -sam, -isch",
steig:"Nur <b>Adjektive</b> kann man steigern: Positiv (schön) – Komparativ (schöner) – Superlativ (am schönsten).<br>Unregelmäßig: gut – besser – am besten · viel – mehr – am meisten · gern – lieber – am liebsten · hoch – höher – am höchsten · nah – näher – am nächsten.",
fall:"1. Fall = Nominativ (Wer oder was?) · 2. Fall = Genitiv (Wessen?) · 3. Fall = Dativ (Wem?) · 4. Fall = Akkusativ (Wen oder was?)",
mix:"Gemischte Aufgaben aus allen Bereichen – wie bei der echten Schularbeit. 9–10 Punkte = Sehr gut!"};
const S={};const app=document.getElementById("app");
function gen(k){return k=="mix"?G[R(Object.keys(G))]():G[k]()}
function start(k){S.k=k;S.i=0;S.pt=0;S.fin=false;const seen=new Set();S.q=[];
 while(S.q.length<10){let q,n=0;do{q=gen(k)}while(seen.has(q.k)&&++n<30);seen.add(q.k);S.q.push(q)}reset();render()}
function reset(){S.done=false;S.sel=[];S.val="";}
function pick(p,o){if(S.done)return;S.sel[p]=o;render()}
function tog(i){if(S.done)return;S.sel[i]=!S.sel[i];render()}
function norm(s){return s.trim().toLowerCase().replace(/^am\s+/,"")}
function check(){const q=S.q[S.i];
 if(q.text){S.val=document.getElementById("in").value;S.ok=q.acc.includes(norm(S.val))}
 else if(q.pron)S.ok=q.pron.every((t,i)=>!!S.sel[i]===t.x);
 else S.ok=q.parts.every((p,i)=>S.sel[i]===p.a);
 if(S.ok)S.pt++;S.done=true;render()}
function next(){S.i++;if(S.i>=10)S.fin=true;reset();render()}
function note(p){return p>=9?"Sehr gut – Note 1! 🏆":p>=8?"Gut – Note 2 👍":p>=7?"Befriedigend – Note 3":p>=5?"Genügend – Note 4":"Noch üben – du schaffst das! 💪"}
function render(){
 let h=`<h1>Deutsch-Training: auf zur Eins!</h1><p class="sub">Nomen · Pronomen · Suffixe · Steigern – jede Runde hat 10 neue, zufällige Aufgaben.</p><div class="tabs">`+
 SECS.map(s=>`<button class="tab ${S.k==s[0]?"on":""}" style="--c:${s[2]}" onclick="start('${s[0]}')">${s[1]}</button>`).join("")+`</div>`+
 `<details><summary>💡 Merkhilfe</summary><p>${TIPS[S.k]}</p></details>`;
 if(S.fin){h+=`<div class="card res"><div class="big">${S.pt} / 10</div><div class="note">${note(S.pt)}</div><button class="btn" onclick="start('${S.k}')">Neue Runde</button></div>`}
 else{const q=S.q[S.i];
  h+=`<div class="top"><span>Aufgabe ${S.i+1} / 10</span><span>Punkte: ${S.pt}</span></div><div class="bar"><i style="width:${S.i*10}%"></i></div><div class="card"><div class="ins">${q.ins}</div><div class="p">${q.p}</div>`;
  if(q.parts)h+=q.parts.map((p,pi)=>`<div class="row">${p.l?`<span class="lb">${p.l}</span>`:""}`+p.o.map((o,oi)=>{let c=S.sel[pi]===oi?"on":"";if(S.done){if(oi===p.a)c+=" right";else if(S.sel[pi]===oi)c+=" wrong"}return`<button class="chip ${c}" style="--c:${p.c?p.c[oi]:"var(--vi)"}" onclick="pick(${pi},${oi})">${o}</button>`}).join("")+`</div>`).join("");
  if(q.pron)h+=q.pron.map((t,i)=>{let c=S.sel[i]?"on":"";if(S.done){if(t.x)c+=" right";else if(S.sel[i])c+=" wrong"}return`<button class="w ${c}" onclick="tog(${i})">${t.w}</button>`}).join("");
  if(q.text)h+=`<input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" value="${S.val}" ${S.done?"disabled":""}>`;
  if(S.done){h+=S.ok?`<div class="fb ok">Richtig! 🎉</div>`:`<div class="fb no">Fast! ${q.text?"Richtig wäre: <b>"+q.acc[0]+"</b>":"So ist es richtig (grün umrandet)."}</div>`;
   h+=`<button class="btn" onclick="next()">${S.i==9?"Ergebnis":"Weiter →"}</button>`}
  else h+=`<button class="btn" onclick="check()">Prüfen</button>`;
  h+=`</div>`}
 app.innerHTML=h;const el=document.getElementById("in");if(el&&!S.done)el.focus()}
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&S.q&&!S.fin){S.done?next():check()}});
start("nomen");
</script></body></html>
