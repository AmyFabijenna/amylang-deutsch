<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science-Fiction 2 · Wörter verstehen, Sätze verstehen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFEA;--card:#fff;--ink:#1C1C22;--soft:#5D5C66;--navy:#1F2B47;--blue:#33528A;--blue-l:#E4EAF5;--lila:#5E4B7A;--lila-l:#EEE8F4;--gold:#B8862A;--gold-l:#F6EDD9;--bad:#B4485A;--bad-l:#F7E3E6;--line:#E1DCD2}
*{box-sizing:border-box}
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6}
header{background:radial-gradient(circle at 85% 20%,#4A3D6B 0,transparent 45%),linear-gradient(135deg,#141C33,#1F2B47 55%,#33528A);color:#fff;padding:28px 20px 34px}
header .in{max-width:960px;margin:0 auto}
header h1{margin:0;font-size:29px}
header p{margin:6px 0 0;opacity:.85}
.pts{float:right;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 16px;font-weight:600}
main{max-width:960px;margin:-16px auto 40px;padding:0 16px}
.card{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(31,43,71,.08);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}
.mode{border:none;text-align:left;cursor:pointer;background:#fff;border-radius:20px;padding:18px;font-family:inherit;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.04),0 6px 18px rgba(31,43,71,.08);transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode .ic{font-size:28px}.mode h3{margin:6px 0 4px;font-size:19px}.mode p{margin:0;color:var(--soft);font-size:15px}
.tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--lila-l);color:var(--lila)}
h2{margin:0 0 6px;font-size:24px;color:var(--navy)}
.back{background:none;border:none;font-family:inherit;color:var(--blue);font-weight:600;font-size:16px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.btn{font-family:inherit;font-size:17px;font-weight:600;border:none;border-radius:14px;padding:11px 20px;cursor:pointer;background:var(--navy);color:#fff}
.btn.sec{background:#E6E2D9;color:var(--ink)}.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.bar{height:10px;background:#E6E2D9;border-radius:999px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lila),var(--blue));width:0;transition:width .3s}
.q{font-size:21px;font-weight:500;margin:8px 0 14px}
.quote{font-size:21px;padding:14px 18px;border-radius:16px;background:var(--lila-l);border-left:5px solid var(--lila);margin:8px 0 14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{font-family:inherit;font-size:17px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 16px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.opt.bad{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.opt:disabled{cursor:default}
.ex{margin-top:12px;padding:12px 15px;border-radius:14px;font-size:16px;background:var(--gold-l);border-left:5px solid var(--gold)}
.ex.badx{background:var(--bad-l);border-left-color:var(--bad)}
.hintbtn{font-family:inherit;background:none;border:2px dashed var(--lila);color:var(--lila);border-radius:12px;padding:6px 12px;cursor:pointer;font-size:15px;margin-bottom:12px}
.hint{font-size:16px;color:var(--lila);background:var(--lila-l);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.count{color:var(--soft);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font-family:inherit;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.chip.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.flip{perspective:1000px;cursor:pointer;margin:12px 0}
.flip .in{position:relative;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.front{background:linear-gradient(135deg,#1F2B47,#3B4F80);color:#fff}
.front .w{font-size:34px;font-weight:700}.front .pl{opacity:.8;margin-top:6px}
.backf{background:var(--lila-l);transform:rotateY(180deg);color:var(--ink)}
.backf .d{font-size:20px;font-weight:500}.backf .s{margin-top:12px;font-style:italic;color:var(--soft)}
.story{font-size:20px;line-height:2.3}
.gap{display:inline-block;min-width:110px;text-align:center;border-bottom:3px dashed var(--lila);padding:0 6px;font-weight:600;color:var(--lila)}
.gap.cur{background:var(--lila-l);border-radius:8px 8px 0 0}
.gap.done{border-bottom-style:solid;color:var(--blue);border-color:var(--blue)}
.gap.wrong{color:var(--bad);border-color:var(--bad);border-bottom-style:solid}
.build{min-height:58px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:19px}
.fixed{font-weight:600;color:var(--navy);padding:6px 4px}
.word{font-family:inherit;font-size:18px;border:2px solid var(--lila);background:#fff;color:var(--lila);border-radius:12px;padding:6px 14px;cursor:pointer}
.word.used{opacity:.25;cursor:default}
.placed{font-family:inherit;font-size:18px;border:2px solid var(--blue);background:var(--blue-l);color:var(--blue);border-radius:12px;padding:6px 14px;cursor:pointer}
.big{font-size:44px;text-align:center}.center{text-align:center}
.split{font-size:26px;font-weight:600;text-align:center;margin:10px 0}
.split span{display:inline-block;padding:4px 12px;border-radius:12px;margin:0 3px}
.split .a{background:var(--lila-l);color:var(--lila)}.split .b{background:var(--blue-l);color:var(--blue)}
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t td{padding:8px;border-bottom:1px solid var(--line)}
@media(max-width:600px){body{font-size:17px}header h1{font-size:23px}.pts{float:none;display:inline-block;margin-bottom:8px}.story{font-size:18px}}
</style>
</head>
<body>
<header><div class="in"><span class="pts" id="pts">✦ 0 Punkte</span>
<h1>🚀 Science-Fiction 2 · Wörter und Sätze verstehen</h1>
<p>Wortschatz zu Zukunft, Weltraum, Zeit und Film · Niveau A2</p></div></header>
<main id="app"></main>
<script>
/* ============ WORTSCHATZ ============ */
// [Wort, Plural/Info, Gruppe, Erklärung, Beispiel]
const W=[
["die Utopie","die Utopien","Zukunft","eine Idee von einer perfekten, besseren Welt","In der Utopie leben alle Menschen in Frieden."],
["die Dystopie","die Dystopien","Zukunft","eine Idee von einer schlechten, gefährlichen Zukunft","In der Dystopie kontrolliert ein Computer alle Menschen."],
["die Zukunft","–","Zeit","die Zeit, die noch kommt","In der Zukunft fahren alle Autos allein."],
["die Vergangenheit","–","Zeit","die Zeit, die schon vorbei ist","Mit der Zeitmaschine reist er in die Vergangenheit."],
["die Zeitreise","die Zeitreisen","Zeit","eine Reise in die Vergangenheit oder in die Zukunft","Die Zeitreise dauert nur eine Sekunde."],
["die Zeitmaschine","die Zeitmaschinen","Zeit","eine Maschine, mit der man durch die Zeit reisen kann","Der Professor baut eine Zeitmaschine."],
["die Zeitschleife","die Zeitschleifen","Zeit","Die Zeit wiederholt sich: Man erlebt denselben Tag immer wieder.","Jeden Morgen ist wieder Montag – er steckt in einer Zeitschleife."],
["die Zeitlupe","–","Film","Ein Film zeigt eine Szene ganz langsam.","Die Explosion sieht man in Zeitlupe."],
["das Drehbuch","die Drehbücher","Film","der Text für einen Film, mit allen Szenen und Dialogen","Der Schauspieler liest das Drehbuch."],
["der Regisseur","die Regisseure","Film","die Person, die einen Film macht und den Schauspielern sagt, wie sie spielen sollen","Der Regisseur ruft: „Kamera läuft!“"],
["die Hauptfigur","die Hauptfiguren","Film","die wichtigste Person in einer Geschichte","Die Hauptfigur ist ein junger Pilot."],
["die Handlung","die Handlungen","Film","das, was in einem Buch oder Film passiert","Die Handlung ist spannend, aber kompliziert."],
["die Fortsetzung","die Fortsetzungen","Film","der nächste Teil von einem Buch oder Film","Die Fortsetzung kommt nächstes Jahr ins Kino."],
["die Spezialeffekte","nur Plural","Film","Tricks im Film, zum Beispiel Explosionen oder Monster aus dem Computer","Die Spezialeffekte sind fantastisch."],
["der Weltraum","–","Weltraum","der riesige Raum außerhalb der Erde, mit Sternen und Planeten","Im Weltraum gibt es keine Luft."],
["das Raumschiff","die Raumschiffe","Weltraum","ein Fahrzeug, das durch den Weltraum fliegt","Das Raumschiff fliegt zum Mars."],
["der Planet","die Planeten","Weltraum","ein großer, runder Himmelskörper, der um eine Sonne kreist","Der Mars ist ein roter Planet."],
["die Kolonie","die Kolonien","Weltraum","ein Ort, an dem Menschen neu wohnen, weit weg von ihrer Heimat","Auf dem Mars gibt es eine kleine Kolonie."],
["der Außerirdische","die Außerirdischen","Weltraum","ein Lebewesen von einem anderen Planeten","Der Außerirdische hat drei Augen."],
["der Raumanzug","die Raumanzüge","Weltraum","spezielle Kleidung, mit der man im Weltraum atmen kann","Ohne Raumanzug kann man draußen nicht leben."],
["der Roboter","die Roboter","Technik","eine Maschine, die Arbeiten selbst macht","Der Roboter putzt das ganze Haus."],
["die künstliche Intelligenz (KI)","–","Technik","ein Computerprogramm, das selbst lernen und denken kann","Die KI beantwortet alle Fragen."],
["der Klon","die Klone","Technik","eine genaue Kopie von einem Lebewesen","Der Klon sieht genauso aus wie das Original."],
["die Erfindung","die Erfindungen","Technik","etwas Neues, das jemand zum ersten Mal gemacht hat","Die Zeitmaschine ist eine gefährliche Erfindung."],
["die Menschheit","–","Technik","alle Menschen auf der Welt zusammen","Der Held will die Menschheit retten."],
["erfinden","er erfindet – hat erfunden","Verben","etwas ganz Neues machen oder bauen","Sie erfindet einen Roboter, der kochen kann."],
["entdecken","er entdeckt – hat entdeckt","Verben","etwas finden, das man vorher nicht kannte","Die Forscher entdecken einen neuen Planeten."],
["landen","es landet – ist gelandet","Verben","mit einem Flugzeug oder Raumschiff auf den Boden kommen","Das Raumschiff ist auf dem Mond gelandet."],
["retten","er rettet – hat gerettet","Verben","jemandem in Gefahr helfen, damit ihm nichts passiert","Der Roboter rettet das Kind."],
["zerstören","er zerstört – hat zerstört","Verben","etwas ganz kaputt machen","Der Sturm zerstört die Stadt."],
["kontrollieren","er kontrolliert – hat kontrolliert","Verben","bestimmen, was andere tun dürfen","Die Regierung kontrolliert alle Handys."],
["spannend","Adjektiv","Adjektive","so interessant, dass man unbedingt weiterlesen will","Das Buch ist so spannend, ich lese die ganze Nacht."],
["unheimlich","Adjektiv","Adjektive","ein bisschen gruselig; man hat ein komisches Gefühl","Der dunkle Gang ist unheimlich."],
["gefährlich","Adjektiv","Adjektive","so, dass etwas Schlimmes passieren kann","Die Reise zum Mars ist gefährlich."]
];
const GROUPS=["Alle","Zukunft","Zeit","Film","Weltraum","Technik","Verben","Adjektive"];
const bare=w=>w.replace(/^(der|die|das) /,"").replace(/ \(KI\)/,"");

/* ============ KOMPOSITA ============ */
const KOMP=[
["Raum","anzug","Was ist ein Raumanzug?",["Kleidung, die man im Weltraum trägt","ein großer Raum in einem Raumschiff","ein Weltraum, der wie Kleidung aussieht","ein Schrank für Kleidung im Raumschiff"],"Das letzte Wort sagt, <b>was</b> es ist: ein <b>Anzug</b> (Kleidung). Das erste Wort sagt, <b>wofür</b>: für den (Welt-)<b>Raum</b>."],
["Mond","landung","Was ist eine Mondlandung?",["Ein Raumschiff kommt auf dem Mond an.","Der Mond fällt auf die Erde.","Ein Land, das auf dem Mond liegt.","Eine Reise, die nachts bei Mondlicht stattfindet."],"<b>Landung</b> kommt von <i>landen</i>. Wo? Auf dem <b>Mond</b>."],
["Sternen","himmel","Was ist ein Sternenhimmel?",["der Himmel in der Nacht mit vielen Sternen","ein Stern, der sehr hoch am Himmel steht","ein Planet, auf dem es keine Sterne gibt","eine Karte, auf der alle Sterne stehen"],"Hauptwort: <b>Himmel</b>. Was für ein Himmel? Einer mit <b>Sternen</b>."],
["Weltraum","station","Was ist eine Weltraumstation?",["ein Ort im Weltraum, wo Astronauten wohnen und arbeiten","ein Bahnhof, von dem Züge in den Weltraum fahren","ein Film über das Leben im Weltraum","eine Firma, die Raumschiffe verkauft"],"<b>Station</b> = ein Ort, an dem man bleibt oder arbeitet. Wo? Im <b>Weltraum</b>."],
["Roboter","hund","Was ist ein Roboterhund?",["eine Maschine, die wie ein Hund aussieht und sich so bewegt","ein Hund, der gern mit Robotern spielt","ein Roboter, der Hunde füttert","ein Hund, der Angst vor Robotern hat"],"Das letzte Wort ist <b>Hund</b> – also ist es ein Hund, aber einer, der ein <b>Roboter</b> ist."],
["Sauerstoff","maske","Was ist eine Sauerstoffmaske?",["eine Maske, durch die man Luft zum Atmen bekommt","eine Maske, die man im Theater trägt","ein Gerät, das Sauerstoff zerstört","eine Maske gegen Kälte und Schnee"],"<b>Sauerstoff</b> brauchen wir zum Atmen. Die <b>Maske</b> bringt ihn zu Mund und Nase."],
["Licht","geschwindigkeit","Was bedeutet Lichtgeschwindigkeit?",["wie schnell sich das Licht bewegt – extrem schnell","wie hell eine Lampe leuchtet","wie lange ein Licht brennen kann","die Farbe von sehr schnellem Licht"],"<b>Geschwindigkeit</b> = wie schnell etwas ist. Wovon? Vom <b>Licht</b>."],
["Kino","film","Was ist ein Kinofilm?",["ein Film, der im Kino gezeigt wird","ein Film, der in einem Kino spielt","eine Kamera, mit der man im Kino filmt","eine Karte für das Kino"],"Hauptwort: <b>Film</b>. Was für ein Film? Einer fürs <b>Kino</b>."],
["Zeit","reisende","Was ist eine Zeitreisende?",["eine Frau, die durch die Zeit reist","eine Reise, die sehr viel Zeit braucht","eine Uhr, die man auf Reisen mitnimmt","eine Frau, die nie Zeit für Reisen hat"],"<b>Reisende</b> = eine Person, die reist. Wohin? Durch die <b>Zeit</b>."],
["Planeten","forscher","Was macht ein Planetenforscher?",["Er untersucht Planeten und lernt über sie.","Er baut neue Planeten im Labor.","Er wohnt auf einem fremden Planeten.","Er verkauft Bücher über Planeten."],"<b>Forscher</b> = jemand, der etwas genau untersucht. Was? <b>Planeten</b>."]
];

/* ============ SÄTZE VERSTEHEN ============ */
// [Satz, Frage, Optionen (0 = richtig), Erklärung, Tipp]
const SV=[
["Die Stadt wurde von den Robotern zerstört.","Was ist passiert?",["Die Roboter haben die Stadt kaputt gemacht.","Die Stadt hat die Roboter kaputt gemacht.","Die Roboter wurden in der Stadt kaputt gemacht.","Die Roboter wollen die Stadt bald zerstören."],"Das ist <b>Passiv</b>: <i>wurde … zerstört</i>. Wer macht es? <b>von</b> den Robotern. Die Stadt ist das Opfer.","Frag: Wer macht etwas? Schau nach <b>von …</b>."],
["Der Mann, der die Zeitmaschine erfunden hat, lebt allein.","Wer lebt allein?",["der Mann, von dem die Zeitmaschine ist","die Zeitmaschine","ein Mann, der eine Zeitmaschine kaufen will","alle Männer, die Zeitreisen machen"],"Der Teil <i>der die Zeitmaschine erfunden hat</i> ist ein <b>Relativsatz</b>. Er erklärt nur, <b>welcher</b> Mann. Der Hauptsatz ist: <b>Der Mann lebt allein.</b>","Lies zuerst ohne den Teil zwischen den Kommas."],
["Obwohl das Raumschiff kaputt war, landete es sicher.","Was stimmt?",["Das Raumschiff war kaputt, aber es kam gut auf den Boden.","Weil das Raumschiff kaputt war, ist es abgestürzt.","Das Raumschiff landete sicher und ging danach kaputt.","Das Raumschiff war ganz und landete deshalb sicher."],"<b>obwohl</b> = man erwartet etwas anderes. Es war kaputt – trotzdem ist die Landung gut gegangen.","<i>obwohl</i> bedeutet so viel wie: <i>…, aber trotzdem …</i>"],
["Ohne Wasser können die Menschen auf dem Mars nicht überleben.","Was bedeutet der Satz?",["Auf dem Mars brauchen die Menschen Wasser zum Leben.","Auf dem Mars gibt es zu viel Wasser für die Menschen.","Die Menschen auf dem Mars trinken kein Wasser.","Ohne Menschen gibt es auf dem Mars kein Wasser."],"<b>überleben</b> = am Leben bleiben. <b>Ohne</b> Wasser geht das <b>nicht</b> – also brauchen sie Wasser.","Zerleg das Wort: über + leben."],
["In dem Buch geht es um einen Jungen, der in einem weißen Raum aufwacht.","Worum geht es im Buch?",["Ein Junge wacht in einem weißen Raum auf.","Ein Junge malt einen Raum weiß an.","Ein Junge geht in einem weißen Raum schlafen.","Ein Junge sucht ein Buch in einem weißen Raum."],"<b>Es geht um …</b> = das Thema ist … <b>aufwachen</b> = nach dem Schlafen die Augen öffnen.","<i>auf|wachen</i>: Das „auf“ steht im Nebensatz zusammen mit dem Verb am Ende."],
["Die Kinder sind auf dem Mars geboren und haben die Erde noch nie gesehen.","Was stimmt?",["Die Kinder kennen die Erde nicht.","Die Kinder sind auf der Erde geboren.","Die Kinder fliegen bald zur Erde.","Die Kinder haben die Erde nur einmal gesehen."],"<b>noch nie</b> = kein einziges Mal. Sie haben die Erde also nie gesehen.","Achte auf kleine Wörter wie <b>nie</b>, <b>nicht</b>, <b>kein</b>."],
["Je mehr der Roboter lernt, desto gefährlicher wird er.","Was bedeutet das?",["Wenn der Roboter mehr lernt, wird er gefährlicher.","Wenn der Roboter gefährlich ist, lernt er nichts.","Der Roboter lernt, wie man gefährliche Dinge vermeidet.","Der Roboter wird ungefährlich, wenn er viel lernt."],"<b>je … desto</b> verbindet zwei Dinge, die zusammen wachsen: mehr lernen → mehr Gefahr.","<i>je … desto</i> = „immer mehr … und immer mehr …“"],
["Niemand glaubt dem Mädchen, dass es aus der Zukunft kommt.","Was denken die Leute?",["Sie denken, dass das Mädchen nicht die Wahrheit sagt.","Sie denken, dass das Mädchen aus der Vergangenheit kommt.","Sie wissen, dass das Mädchen aus der Zukunft kommt.","Sie glauben, dass niemand aus der Zukunft kommt außer dem Mädchen."],"<b>Niemand</b> = keine Person. Keiner glaubt ihr – sie denken also, ihre Geschichte ist nicht wahr.","<i>niemand</i> = kein Mensch."],
["Die KI lässt die Menschen nicht mehr nach draußen.","Was macht die KI?",["Sie erlaubt den Menschen nicht, nach draußen zu gehen.","Sie schickt alle Menschen nach draußen.","Sie geht selbst nicht mehr nach draußen.","Sie vergisst die Menschen draußen."],"<b>jemanden (nicht) lassen</b> = etwas (nicht) erlauben. Die KI erlaubt es nicht mehr.","<i>lassen</i> heißt hier: erlauben."],
["Nachdem die Rakete gestartet war, gab es plötzlich ein Problem.","Was passierte zuerst?",["Die Rakete startete.","Es gab ein Problem.","Beides passierte genau gleichzeitig.","Die Rakete landete."],"<b>nachdem</b> = zuerst passiert der Teil mit <i>nachdem</i>, danach der andere Teil.","Plusquamperfekt (<i>war gestartet</i>) = das, was noch früher war."],
["Die Hauptfigur muss sich entscheiden: Sie kann die Welt retten oder ihre Familie.","Was ist das Problem der Hauptfigur?",["Sie kann nicht beides retten und muss eins wählen.","Sie will weder die Welt noch die Familie retten.","Ihre Familie will die Welt zerstören.","Sie hat ihre Familie verloren und sucht sie."],"<b>sich entscheiden</b> = wählen. <b>oder</b> zeigt: nur eins von beiden ist möglich.","Achte auf <b>oder</b>: A oder B, nicht beides."],
["Der Film ist zwar lang, aber keine Minute langweilig.","Wie findet der Sprecher den Film?",["Er ist lang, aber die ganze Zeit interessant.","Er ist kurz und ein bisschen langweilig.","Er ist so lang, dass er langweilig wird.","Nur eine Minute im Film ist interessant."],"<b>zwar … aber</b> = das Erste stimmt, aber das Zweite ist wichtiger. <i>keine Minute langweilig</i> = immer spannend.","<i>zwar … aber</i> kündigt einen Gegensatz an."]
];

/* ============ LÜCKENTEXTE ============ */
// Text mit {richtig|falsch|falsch}; Erklärungen in EX
const LT=[
{t:"🔴 Die Mars-Kolonie",x:"Im Jahr 2090 lebt eine kleine {Kolonie|Zeitlupe|Fortsetzung} auf dem Mars. Die Menschen sind vor zehn Jahren mit einem großen {Raumschiff|Drehbuch|Regisseur} gekommen. Draußen kann man nicht atmen, deshalb trägt man einen {Raumanzug|Planeten|Klon}. Eines Tages {entdeckt|landet|rettet} ein Mädchen eine geheime Höhle. In der Höhle ist es dunkel, still und {unheimlich|gelandet|erfunden}. Das Mädchen ist sicher: Hier war schon jemand vor den Menschen – vielleicht ein {Außerirdischer|Weltraum|Spezialeffekt}.",
ex:["Eine Gruppe Menschen, die an einem neuen, fernen Ort wohnt, ist eine <b>Kolonie</b>.","Mit einem <b>Raumschiff</b> reist man zum Mars. Ein Drehbuch ist ein Text, ein Regisseur eine Person.","Kleidung zum Atmen im Weltraum = <b>Raumanzug</b>.","Sie findet etwas Neues → <b>entdeckt</b>. <i>landen</i> braucht kein Objekt, und eine Höhle rettet man nicht.","Nach <i>es ist</i> brauchen wir ein Adjektiv: <b>unheimlich</b>. <i>gelandet</i> und <i>erfunden</i> sind Verbformen.","Jemand, der vor den Menschen da war = ein Lebewesen von einem anderen Planeten: <b>ein Außerirdischer</b>."]},
{t:"🔁 Der Tag, der nicht endet",x:"Jeden Morgen wacht Tom auf, und es ist wieder Montag. Er steckt in einer {Zeitschleife|Zeitlupe|Zeitmaschine}. Am Anfang findet er das lustig, aber bald wird es {langweilig|lustig|neu}. Er will den Montag {beenden|beginnen|erfinden}. Er muss herausfinden, {warum|obwohl|denn} der Tag immer wieder von vorne beginnt. Er spricht mit allen Menschen und hilft am Abend einem alten Mann. Am nächsten Morgen ist endlich {Dienstag|Montag|Sonntag}.",
ex:["Derselbe Tag wiederholt sich → <b>Zeitschleife</b>. Zeitlupe = langsam im Film; in einer Zeitmaschine steckt er nicht.","<b>aber</b> zeigt einen Gegensatz: zuerst lustig, <b>aber</b> dann <b>langweilig</b>.","Er will, dass der Montag aufhört → <b>beenden</b>. Beginnen würde nichts ändern.","Nach <i>herausfinden</i> fragt man nach dem Grund: <b>warum</b>. <i>obwohl</i> und <i>denn</i> passen nicht nach <i>herausfinden</i>.","Die Schleife ist zu Ende → es kommt der nächste Tag: <b>Dienstag</b>."]},
{t:"🎬 Im Kino",x:"Gestern habe ich einen Science-Fiction-Film gesehen. Die {Handlung|Kolonie|Rakete} war sehr spannend: Eine KI will die ganze {Menschheit|Zeitlupe|Erfindung} kontrollieren. Die {Hauptfigur|Regisseur|Drehbuch} ist eine junge Ingenieurin, die gegen die KI kämpft. Die Spezialeffekte waren fantastisch, besonders die Explosion in {Zeitlupe|Zeitschleife|Zeitreise}. Der {Regisseur|Planet|Klon} hat auch das Drehbuch selbst geschrieben. Das Ende ist offen – ich hoffe, es gibt bald eine {Fortsetzung|Erfindung|Dystopie}.",
ex:["Was im Film passiert = die <b>Handlung</b>.","Alle Menschen zusammen = die <b>Menschheit</b>.","<i>Die …</i> + eine Person: <b>die Hauptfigur</b> (Regisseur ist <i>der</i>, Drehbuch ist <i>das</i>).","Eine Szene ganz langsam zeigen = <b>Zeitlupe</b>.","Wer macht den Film und schreibt vielleicht das Drehbuch? <b>der Regisseur</b>.","Das Ende ist offen → man wartet auf den nächsten Teil: <b>Fortsetzung</b>."]},
{t:"🤖 Der neue Roboter",x:"Meine Nachbarin ist Ingenieurin. Sie hat einen Roboter {erfunden|entdeckt|gelandet}, den es vorher noch nicht gab. Er kann kochen. Der Roboter ist sehr klug, denn er hat eine {künstliche Intelligenz|Zeitlupe|Kolonie}. Jeden Tag lernt er etwas Neues. Aber {je|weil|wenn} mehr er lernt, desto mehr Fragen stellt er. Gestern hat er gefragt: „Bin ich ein Mensch oder eine {Maschine|Zukunft|Handlung}?“ Meine Nachbarin war {überrascht|gerettet|zerstört}. So eine Frage hat sie nicht erwartet.",
ex:["Etwas, das es vorher <b>noch nicht gab</b>, hat sie selbst gemacht → <b>erfunden</b>. <i>Entdecken</i> kann man nur etwas, das schon da ist; <i>landen</i> braucht <i>ist</i> und kein Objekt.","Die Fähigkeit, selbst zu lernen und zu denken = <b>künstliche Intelligenz</b>.","<b>je</b> … desto: Das Wort <i>desto</i> im Satz verrät die Antwort.","Das Gegenteil von Mensch ist hier <b>Maschine</b>.","Sie hat die Frage nicht erwartet → sie war <b>überrascht</b>."]}
];

/* ============ SÄTZE BAUEN ============ */
// [fester Anfang, Bausteine, Satzzeichen, erlaubte Lösungen, Erklärung]
const SB=[
["Die Astronautin",["ist","auf dem Mars","gelandet"],".",["ist auf dem Mars gelandet"],"<b>Perfekt</b>: <i>ist</i> steht an Position 2, das Partizip <i>gelandet</i> ganz am Ende."],
["Morgen",["startet","die Rakete","zum Mond"],".",["startet die Rakete zum Mond"],"Das <b>Verb steht an Position 2</b>. Wenn <i>Morgen</i> vorne steht, kommt das Subjekt erst nach dem Verb."],
["Im Film",["reist","der Held","in die Zukunft"],".",["reist der Held in die Zukunft"],"Position 1: <i>Im Film</i>. Position 2: das Verb <i>reist</i>. Dann das Subjekt."],
["Der Roboter",["kann","selbst","denken"],".",["kann selbst denken"],"<b>Modalverb</b> (<i>kann</i>) an Position 2, das zweite Verb (<i>denken</i>) am Ende."],
["Ich mag die Dystopie,",["weil","sie","spannend","ist"],".",["weil sie spannend ist"],"Nach <b>weil</b> steht das Verb am <b>Ende</b> des Satzes."],
["Wenn die Maschine kaputt ist,",["können","wir","nicht","zurückreisen"],".",["können wir nicht zurückreisen"],"Der <i>wenn</i>-Satz ist Position 1. Darum kommt danach sofort das Verb: <i>können wir</i>."],
["Der Film",["hat","mir","sehr gut","gefallen"],".",["hat mir sehr gut gefallen"],"<i>gefallen</i> + Dativ (<i>mir</i>). Perfekt: <i>hat … gefallen</i>."],
["Das ist das Raumschiff,",["das","zum Mars","fliegt"],".",["das zum Mars fliegt"],"<b>Relativsatz</b>: <i>das</i> am Anfang, das Verb <i>fliegt</i> am Ende."],
["Hast",["du","das Drehbuch","schon","gelesen"],"?",["du das Drehbuch schon gelesen","du schon das Drehbuch gelesen"],"<b>Ja/Nein-Frage</b>: Das Verb steht an Position 1, das Partizip <i>gelesen</i> am Ende."],
["Die Menschen",["wurden","von Robotern","gerettet"],".",["wurden von Robotern gerettet"],"<b>Passiv</b>: <i>wurden</i> + Partizip <i>gerettet</i> am Ende. <i>von Robotern</i> = wer es gemacht hat."],
["In der Zeitschleife",["erlebt","er","denselben Tag","immer wieder"],".",["erlebt er denselben Tag immer wieder","erlebt er immer wieder denselben Tag"],"Position 1 ist besetzt, also <b>Verb an Position 2</b>, dann das Subjekt <i>er</i>."],
["Ich glaube,",["dass","die KI","die Welt","kontrolliert"],".",["dass die KI die Welt kontrolliert"],"Nach <b>dass</b> steht das Verb am <b>Ende</b>."]
];

/* ============ ENGINE ============ */
let PTS=0; try{PTS=+localStorage.getItem("sf2pts")||0}catch(e){}
const ptsEl=document.getElementById("pts"); const showP=()=>ptsEl.textContent="✦ "+PTS+" Punkte"; showP();
function addP(n=1){PTS+=n;try{localStorage.setItem("sf2pts",PTS)}catch(e){};showP()}
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const back=`<button class="back" onclick="home()">← Zur Übersicht</button>`;
const MODES=[
["🃏","Wortkarten","Lerne die Wörter: Karte antippen, Erklärung und Beispiel lesen.","Schritt 1","cards"],
["❓","Was ist das?","Du liest eine Erklärung und findest das passende Wort.","Schritt 2","what"],
["🧩","Wort-Detektiv","Lange Wörter zerlegen und die Bedeutung selbst herausfinden.","Schritt 3","komp"],
["📖","Lückentexte","Kurze Science-Fiction-Geschichten: Welches Wort passt?","Schritt 4","gaps"],
["🔎","Sätze verstehen","Was bedeutet der Satz wirklich? Mit Tipps zur Grammatik.","Schritt 5","sv"],
["🧱","Sätze bauen","Wörter in die richtige Reihenfolge bringen.","Schritt 6","sb"],
["🏁","Abschluss-Mission","Alles gemischt – zeig, was du jetzt kannst!","Finale","final"]
];
function home(){
 app.innerHTML=`<div class="card"><h2>Willkommen an Bord!</h2><p>Hier trainierst du die wichtigsten Wörter rund um Science-Fiction: Zukunft, Zeitreisen, Weltraum, Roboter und Film. Danach liest du kurze Geschichten und lernst, auch längere Sätze sicher zu verstehen. Geh die Schritte am besten der Reihe nach durch. Du musst nicht alles sofort können – Wörter wiederzuerkennen ist der erste große Schritt. 🚀</p></div>
 <div class="grid">${MODES.map(m=>`<button class="mode" onclick="go('${m[4]}')"><div class="ic">${m[0]}</div><h3>${m[1]}</h3><p>${m[2]}</p><span class="tag">${m[3]}</span></button>`).join("")}</div>`;scrollTo(0,0)}
const NEXT={final:null,what:"komp",komp:"gaps",gaps:"sv",sv:"sb",sb:"final"};
function done(s,t,m){const p=t?s/t:0;
 app.innerHTML=`<div class="card center">${back}<div class="big">${p>=.9?"🌟":p>=.7?"🚀":"💪"}</div><h2>${p>=.9?"Hervorragend!":p>=.7?"Sehr gut!":"Gut gemacht – üb ruhig noch einmal!"}</h2><p>${s} von ${t} richtig.</p>
 <div class="row" style="justify-content:center"><button class="btn sec" onclick="go('${m}')">Nochmal</button>${NEXT[m]?`<button class="btn gold" onclick="go('${NEXT[m]}')">Weiter zum nächsten Schritt →</button>`:""}</div></div>`}

/* ---- Wortkarten ---- */
let cg="Alle",ci=0,cl=W;
function cards(){cl=W.filter(w=>cg==="Alle"||w[2]===cg);if(ci>=cl.length)ci=0;
 const w=cl[ci];
 app.innerHTML=`<div class="card">${back}<h2>🃏 Wortkarten</h2><div class="chips">${GROUPS.map(g=>`<button class="chip ${g===cg?"sel":""}" onclick="cg='${g}';ci=0;cards()">${g}</button>`).join("")}</div>
 <div class="flip" id="fl" onclick="this.classList.toggle('on')"><div class="in"><div class="face front"><div class="w">${w[0]}</div><div class="pl">${w[1]}</div><div class="pl" style="margin-top:18px;font-size:14px">antippen zum Umdrehen</div></div>
 <div class="face backf"><div class="d">${w[3]}</div><div class="s">${w[4]}</div></div></div></div>
 <div class="row"><button class="btn sec" onclick="ci=(ci-1+cl.length)%cl.length;cards()">← Zurück</button><span class="count">${ci+1} / ${cl.length}</span><button class="btn" onclick="ci=(ci+1)%cl.length;cards()">Weiter →</button></div></div>`}

/* ---- generisches Multiple Choice ---- */
let mc;
function runMC(title,items,mode){mc={title,items,mode,i:0,s:0};drawMC()}
function drawMC(){
 if(mc.i>=mc.items.length)return done(mc.s,mc.items.length,mc.mode);
 const it=mc.items[mc.i]; const ord=shuffle(it.o.map((t,k)=>({t,k})));
 app.innerHTML=`<div class="card">${back}<h2>${mc.title}</h2><div class="bar"><i style="width:${mc.i/mc.items.length*100}%"></i></div>
 ${it.pre||""}${it.tip?`<div id="tipbox"><button class="hintbtn" onclick="showTip()">💡 Tipp anzeigen</button></div>`:""}
 <div class="q">${it.q}</div><div class="opts">${ord.map(o=>`<button class="opt" data-k="${o.k}" onclick="pickMC(this)">${o.t}</button>`).join("")}</div><div id="fb"></div>
 <div class="row"><span class="count">${mc.i+1} / ${mc.items.length}</span><button class="btn" id="nx" disabled onclick="mc.i++;drawMC()">Weiter →</button></div></div>`}
function showTip(){document.getElementById('tipbox').innerHTML='<div class="hint">💡 '+mc.items[mc.i].tip+'</div>'}
function pickMC(el){const it=mc.items[mc.i];const r=el.dataset.k==="0";
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.k==="0")b.classList.add("ok")});
 if(r){mc.s++;addP()}else el.classList.add("bad");
 document.getElementById("fb").innerHTML=`<div class="ex ${r?"":"badx"}">${r?"✔ Richtig! ":"✘ Nicht ganz. Richtig ist: <b>"+it.o[0]+"</b>. "}${it.ex}</div>`;
 document.getElementById("nx").disabled=false}

/* ---- Was ist das? ---- */
function whatItems(n){
 return shuffle(W).slice(0,n).map(w=>{
  const same=shuffle(W.filter(x=>x!==w&&x[2]===w[2]));const other=shuffle(W.filter(x=>x!==w&&x[2]!==w[2]));
  const d=same.concat(other).slice(0,3);
  return {q:`„${w[3]}“ – welches Wort ist das?`,o:[w[0],...d.map(x=>x[0])],ex:`Beispiel: <i>${w[4]}</i>`};
 })}
function what(){runMC("❓ Was ist das?",whatItems(15),"what")}

/* ---- Wort-Detektiv ---- */
const kompItems=()=>shuffle(KOMP).map(k=>({pre:`<div class="split"><span class="a">${k[0]}</span>+<span class="b">${k[1]}</span></div><p class="center count">Tipp: Das <b>letzte</b> Wort sagt dir, <b>was</b> es ist.</p>`,q:k[2],o:k[3],ex:k[4]}));
function komp(){runMC("🧩 Wort-Detektiv",kompItems(),"komp")}

/* ---- Sätze verstehen ---- */
const svItems=()=>shuffle(SV).map(s=>({pre:`<div class="quote">${s[0]}</div>`,q:s[1],o:s[2],ex:s[3],tip:s[4]}));
function sv(){runMC("🔎 Sätze verstehen",svItems(),"sv")}

/* ---- Lückentexte ---- */
let lt;
function gaps(){app.innerHTML=`<div class="card">${back}<h2>📖 Lückentexte</h2><p>Wähle eine Geschichte. Klick die Lücken der Reihe nach an und wähle das passende Wort.</p>
 <div class="grid">${LT.map((s,i)=>`<button class="mode" onclick="startLT(${i})"><h3>${s.t}</h3><p>${(s.x.match(/\{/g)||[]).length} Lücken</p></button>`).join("")}</div></div>`}
function startLT(i){const s=LT[i];const parts=[];const gp=[];let k=0;
 const html=s.x.replace(/\{([^}]+)\}/g,(m,c)=>{const o=c.split("|");gp.push({o,ex:s.ex[k]});return `<span class="gap" id="g${k++}">( ${k} )</span>`});
 lt={i,gp,cur:0,s:0};
 app.innerHTML=`<div class="card">${back}<h2>${s.t}</h2><div class="bar"><i id="ltbar"></i></div><div class="story">${html}</div><div id="ltq" style="margin-top:14px"></div>
 <div class="row"><span class="count" id="ltc"></span><button class="btn" id="nx" disabled onclick="nextLT()">Weiter →</button></div></div>`;showLT()}
function showLT(){const g=lt.gp[lt.cur];document.querySelectorAll(".gap").forEach(x=>x.classList.remove("cur"));document.getElementById("g"+lt.cur).classList.add("cur");
 document.getElementById("ltbar").style.width=lt.cur/lt.gp.length*100+"%";document.getElementById("ltc").textContent=`Lücke ${lt.cur+1} / ${lt.gp.length}`;
 document.getElementById("ltq").innerHTML=`<div class="opts row">${shuffle(g.o.map((t,k)=>({t,k}))).map(o=>`<button class="opt" data-k="${o.k}" onclick="pickLT(this)">${o.t}</button>`).join("")}</div><div id="fb"></div>`;
 document.getElementById("nx").disabled=true}
function pickLT(el){const g=lt.gp[lt.cur];const r=el.dataset.k==="0";
 document.querySelectorAll("#ltq .opt").forEach(b=>{b.disabled=true;if(b.dataset.k==="0")b.classList.add("ok")});
 if(r){lt.s++;addP()}else el.classList.add("bad");
 const gEl=document.getElementById("g"+lt.cur);gEl.textContent=g.o[0];gEl.classList.remove("cur");gEl.classList.add(r?"done":"wrong");
 document.getElementById("fb").innerHTML=`<div class="ex ${r?"":"badx"}">${r?"✔ Richtig! ":"✘ Hier passt <b>"+g.o[0]+"</b>. "}${g.ex}</div>`;
 document.getElementById("nx").disabled=false}
function nextLT(){lt.cur++;if(lt.cur>=lt.gp.length){app.innerHTML=`<div class="card center">${back}<div class="big">📖</div><h2>Geschichte fertig!</h2><p>${lt.s} von ${lt.gp.length} Lücken richtig.</p><p>Lies die ganze Geschichte jetzt noch einmal laut – du verstehst bestimmt alles!</p>
 <div class="row" style="justify-content:center"><button class="btn sec" onclick="startLT(${lt.i})">Nochmal</button>${lt.i<LT.length-1?`<button class="btn gold" onclick="startLT(${lt.i+1})">Nächste Geschichte →</button>`:`<button class="btn gold" onclick="go('sv')">Weiter: Sätze verstehen →</button>`}</div></div>`;return}showLT()}

/* ---- Sätze bauen ---- */
let sb;
function sbStart(){sb={list:shuffle(SB),i:0,s:0};drawSB()}
function drawSB(){if(sb.i>=sb.list.length)return done(sb.s,sb.list.length,"sb");
 const it=sb.list[sb.i];sb.cur={it,placed:[],pool:shuffle(it[1].map((t,k)=>({t,k}))),checked:false};renderSB()}
function renderSB(){const c=sb.cur,it=c.it;
 app.innerHTML=`<div class="card">${back}<h2>🧱 Sätze bauen</h2><div class="bar"><i style="width:${sb.i/sb.list.length*100}%"></i></div>
 <p>Tippe die Bausteine in der richtigen Reihenfolge an. Ein Baustein im Satz lässt sich durch Antippen wieder entfernen.</p>
 <div class="build"><span class="fixed">${it[0]}</span>${c.placed.map((p,j)=>`<button class="placed" ${c.checked?"disabled":""} onclick="unplace(${j})">${p.t}</button>`).join("")}<span class="fixed">${it[2]}</span></div>
 <div class="chips">${c.pool.map((p,j)=>`<button class="word ${c.placed.includes(p)?"used":""}" ${c.placed.includes(p)||c.checked?"disabled":""} onclick="place(${j})">${p.t}</button>`).join("")}</div>
 <div id="fb"></div><div class="row"><span class="count">${sb.i+1} / ${sb.list.length}</span>
 ${c.checked?`<button class="btn" onclick="sb.i++;drawSB()">Weiter →</button>`:`<button class="btn" ${c.placed.length<it[1].length?"disabled":""} onclick="checkSB()">Prüfen ✓</button>`}</div></div>`;
 if(c.checked)document.getElementById("fb").innerHTML=c.fb}
function place(j){sb.cur.placed.push(sb.cur.pool[j]);renderSB()}
function unplace(j){sb.cur.placed.splice(j,1);renderSB()}
function checkSB(){const c=sb.cur,it=c.it;const ans=c.placed.map(p=>p.t).join(" ");const r=it[3].includes(ans);
 if(r){sb.s++;addP()}c.checked=true;
 c.fb=`<div class="ex ${r?"":"badx"}">${r?"✔ Perfekt gebaut! ":`✘ Noch nicht ganz. Richtig: <b>${it[0]} ${it[3][0]}${it[2]}</b> `}${it[4]}${it[3].length>1?`<br><span class="count">Auch richtig: ${it[0]} ${it[3][1]}${it[2]}</span>`:""}</div>`;renderSB()}

/* ---- Abschluss ---- */
function final(){
 const ltItems=[];LT.forEach(s=>{let k=0;s.x.replace(/\{([^}]+)\}/g,(m,c)=>{const o=c.split("|");const ctx=s.x.replace(/\{([^}]+)\}/g,(mm,cc,off)=>mm===m?"____":cc.split("|")[0]);ltItems.push({pre:`<div class="quote" style="font-size:18px">${ctx.split(/(?<=[.!?“])\s/).find(z=>z.includes("____"))}</div>`,q:"Welches Wort passt in die Lücke?",o:o,ex:s.ex[k++]});return m})});
 const items=shuffle([...whatItems(5),...shuffle(kompItems()).slice(0,3),...shuffle(ltItems).slice(0,4),...shuffle(svItems()).slice(0,4)]);
 runMC("🏁 Abschluss-Mission",items,"final")}
function go(m){({cards,what,komp,gaps,sv,sb:sbStart,final})[m]();scrollTo(0,0)}
home();
</script>
</body>
</html>
