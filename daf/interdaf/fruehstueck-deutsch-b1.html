<!doctype html>
<html lang="de">
<head>
<script src="/daf/interdaf/passwort.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frühstück & Gäste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec; --card:#ffffff; --ink:#1b1b1f; --muted:#5b5862; --line:#e4ddd2;
  --sky:#34527e; --petrol:#1d6a70; --lilac:#5f4a72; --terra:#9a5a3c; --plum:#7b3f5e;
  --ocean:#2e5d86; --amber:#8a6526; --rose:#9b4d5a; --indigo:#3f4a8a; --slate:#4a5568; --honey:#7a5a1e;
  --ok:#1f6f78; --ok-bg:#e2f0f1; --bad:#a3463e; --bad-bg:#f6e4e1;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,sans-serif;font-size:18px;line-height:1.6;font-weight:300}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;border-radius:50%;opacity:.13;animation:float 26s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-40px) translateX(18px)}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:24px 16px 80px}
header.top{background:linear-gradient(135deg,#2c4669 0%,#1d6a70 55%,#5f4a72 100%);color:#fff;border-radius:26px;padding:30px 30px 26px;margin-bottom:22px;box-shadow:0 10px 30px rgba(30,40,60,.15)}
header.top h1{margin:0 0 6px;font-size:2rem;font-weight:600;letter-spacing:-.01em}
header.top p{margin:0;opacity:.94;font-size:1.05rem}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 16px;font-size:.95rem}
.pill select{background:transparent;color:#fff;border:none;outline:none;cursor:pointer}
.pill select option{color:#000}
nav.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:24px}
nav.modes button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:.15s}
nav.modes button:hover{transform:translateY(-2px)}
nav.modes button.active{border-color:var(--c)}
nav.modes .num{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);font-weight:600}
nav.modes .t{font-weight:500;line-height:1.25}
nav.modes .s{display:block;font-weight:300;font-size:.8rem;color:var(--muted)}
.mode{display:none}.mode.show{display:block}
.intro{background:var(--card);border-left:6px solid var(--c);border-radius:20px;padding:18px 22px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.intro h2{margin:0 0 4px;font-size:1.4rem;font-weight:600;color:var(--c)}
.intro p{margin:0;color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.btn{background:var(--c,var(--sky));color:#fff;border:none;border-radius:14px;padding:10px 20px;cursor:pointer;font-weight:500;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--c,var(--sky));border:2px solid var(--c,var(--sky))}
.btn.small{padding:6px 14px;font-size:.9rem}
.spk{background:none;border:none;cursor:pointer;padding:2px 6px;vertical-align:middle;color:var(--c,var(--sky));opacity:.8}
.spk:hover{opacity:1}
.spk svg{width:20px;height:20px}
/* Phrasebook */
.pbtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.pbtools input{flex:1 1 260px;border:2px solid var(--line);border-radius:14px;padding:10px 16px;background:#fff}
.topic h3{margin:22px 0 10px;font-size:1.15rem;font-weight:600;color:var(--c)}
.phr{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.phr .g{font-weight:500;margin-bottom:8px}
.phr .g::before{content:"Gast: ";color:var(--muted);font-weight:300}
.ans{display:grid;gap:8px}
.ans div{border-radius:12px;padding:8px 12px;background:var(--soft,#f1eef4);transition:filter .2s}
.ans .lv{display:inline-block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:8px;color:var(--c)}
.selftest .ans div:not(.revealed){filter:blur(6px);cursor:pointer}
/* MC */
.prog{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.bar{height:8px;background:#eee8df;border-radius:99px;margin:6px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.sit{color:var(--muted);margin-bottom:6px}
.qtext{font-size:1.25rem;font-weight:500;margin:4px 0 16px}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--c);margin:0 4px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#faf8f5;border:2px solid var(--line);border-radius:16px;padding:12px 16px;cursor:pointer;transition:.15s;line-height:1.45}
.opt:hover{border-color:var(--c)}
.opt .why{display:block;font-size:.92rem;margin-top:6px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .why{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .why{color:var(--bad)}
.opt.dim{opacity:.75}
.fbbox{margin-top:14px;border-radius:14px;padding:12px 16px;font-weight:400}
.fbbox.good{background:var(--ok-bg);color:var(--ok)}
.fbbox.bad{background:var(--bad-bg);color:var(--bad)}
.nav2{margin-top:14px;text-align:right}
.done{text-align:center}
.done h3{font-size:1.5rem;margin:6px 0;color:var(--c)}
.bubble{background:var(--soft,#eef2f7);border-radius:20px 20px 20px 6px;padding:14px 18px;font-size:1.15rem;font-weight:500;margin:6px 0 16px;display:inline-block}
.storypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:16px}
.storypick button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer}
.storypick button.active{border-color:var(--c)}
.storypick b{display:block;font-weight:600;color:var(--c)}
.storypick span{font-size:.9rem;color:var(--muted)}
/* Match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.mgrid{grid-template-columns:1fr}}
.mcol{display:grid;gap:8px;align-content:start}
.mq,.ma{text-align:left;background:#faf8f5;border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;line-height:1.4}
.mq b{color:var(--c);margin-right:6px}
.mq.sel,.ma.sel{border-color:var(--c);background:var(--soft,#eef2f7)}
.mq.ok,.ma.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.ma .tag{font-weight:600;color:var(--ok);margin-right:6px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{color:var(--muted);margin-top:0}
/* Gaps */
.gs{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;margin:2px 4px}
.chip{border:2px solid var(--line);background:#faf8f5;border-radius:10px;padding:2px 12px;cursor:pointer}
.chip:hover{border-color:var(--c)}
.chip.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:500}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.gs .ex{font-size:.92rem;color:var(--muted);margin-top:8px;display:none}
.gs.solved .ex{display:block}
.gh{margin:22px 0 10px;font-weight:600;color:var(--c)}
/* Build */
.line{min-height:62px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tok{background:var(--soft,#eef2f7);border:2px solid transparent;border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:400}
.tok:hover{border-color:var(--c)}
.line .tok{background:#fff;border-color:var(--c)}
.playbig{display:block;margin:6px auto 10px;width:84px;height:84px;border-radius:50%;border:none;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.playbig svg{width:38px;height:38px}
.hiddenq{filter:blur(7px)}
footer{margin-top:40px;text-align:center;color:var(--muted);font-size:.85rem}
@media(max-width:600px){header.top{padding:22px 18px}header.top h1{font-size:1.5rem}.card{padding:16px}}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="wrap">
<header class="top">
  <h1>Frühstück & Gäste</h1>
  <p>Deutsch im Hotel und im Frühstückscafé · Niveau B1 · Buffet, Zimmernummern, Reservierungen und echte Gästegespräche</p>
  <div class="topbar">
    <span class="pill">⭐ Punkte: <b id="score">0</b></span>
    <span class="pill">🔊 Tempo:
      <select id="rate"><option value="0.75">langsam</option><option value="0.9" selected>mittel</option><option value="1">normal</option></select>
    </span>
    <span class="pill">Tipp: Auf 🔊 klicken – jeder Satz wird vorgelesen</span>
  </div>
</header>
<nav class="modes" id="nav"></nav>
<main id="main"></main>
<footer>Übungsmaterial Deutsch B1 · Hotel & Gastronomie</footer>
</div>

<script>
/* ================= DATEN ================= */

/* Phrasebook: [Gast, kurz, höflich, ausführlich & elegant] */
const PHRASES=[
{t:"Ankommen & Zimmernummer",e:"🛎️",items:[
["Guten Morgen! Ist hier noch frei?","Ja, bitte sehr.","Guten Morgen! Ja, natürlich – setzen Sie sich gern.","Guten Morgen und herzlich willkommen beim Frühstück! Dieser Tisch ist frei – nehmen Sie gern Platz."],
["Muss ich meine Zimmernummer sagen?","Ja, bitte.","Ja, bitte – dann kann ich Sie auf der Frühstücksliste abhaken.","Ja, wenn Sie so freundlich wären. Ich hake Sie dann kurz auf unserer Liste ab, und Sie können sofort ans Buffet."],
["Wir wohnen in Zimmer vierzehn.","Danke, passt.","Vielen Dank, Zimmer vierzehn – ich habe Sie gefunden.","Herzlichen Dank, Zimmer vierzehn ist notiert. Darf ich Ihnen schon einen Kaffee oder Tee bringen, während Sie sich am Buffet bedienen?"],
["Ich habe meine Zimmernummer vergessen.","Kein Problem. Ihr Name, bitte?","Das macht gar nichts. Darf ich nach Ihrem Nachnamen fragen?","Das passiert ganz oft, keine Sorge. Wenn Sie mir Ihren Nachnamen sagen, finde ich Sie sofort auf unserer Liste."],
["Ist das Frühstück im Zimmerpreis inbegriffen?","Ja, inklusive.","Ja, das Frühstück ist in Ihrem Zimmerpreis schon inbegriffen.","Ja, selbstverständlich – das Frühstücksbuffet ist in Ihrer Buchung enthalten. Sie müssen also nichts extra bezahlen."],
["Wir sind zu fünft. Haben Sie einen großen Tisch?","Ja, dort hinten.","Ja, gern – ich stelle Ihnen schnell zwei Tische zusammen.","Sehr gern. Geben Sie mir bitte eine Minute, dann stelle ich Ihnen zwei Tische zusammen, damit Sie alle bequem Platz haben."]]},
{t:"Frühstückszeiten",e:"⏰",items:[
["Bis wann gibt es Frühstück?","Bis halb elf.","Unter der Woche bis 10:30 Uhr, am Wochenende bis 11 Uhr.","Unser Buffet ist von Montag bis Freitag von 7 bis 10:30 Uhr geöffnet. Am Wochenende können Sie bis 11 Uhr in Ruhe frühstücken."],
["Kann ich morgen schon um sechs frühstücken? Mein Zug fährt sehr früh.","Leider erst ab sieben.","Das Buffet öffnet leider erst um 7 Uhr. Wir können Ihnen aber ein Frühstückspaket vorbereiten.","Um 6 Uhr ist das Buffet leider noch nicht aufgebaut. Gern packen wir Ihnen aber ein Frühstückspaket, das Sie heute Abend an der Rezeption abholen können."],
["Wann ist es hier am ruhigsten?","Vor acht Uhr.","Am ruhigsten ist es meistens vor 8 Uhr oder nach halb zehn.","Wenn Sie es gern ruhig haben, empfehle ich Ihnen die Zeit vor 8 Uhr. Auch nach halb zehn wird es wieder deutlich ruhiger."],
["Schaffen wir es um zehn nach zehn noch?","Ja, das geht.","Ja, sicher – Sie haben dann noch zwanzig Minuten Zeit.","Selbstverständlich, kommen Sie gern. Wir räumen nicht hektisch ab, Sie können in Ruhe fertig frühstücken."],
["Gibt es am Sonntag einen Brunch?","Nein, nur Frühstück.","Einen Brunch haben wir leider nicht, aber das Frühstück gibt es am Sonntag bis 11 Uhr.","Einen eigenen Brunch bieten wir leider nicht an. Am Sonntag ist unser Frühstücksbuffet aber bis 11 Uhr geöffnet – das ist fast dasselbe, nur ohne Mittagsgerichte."]]},
{t:"Am Buffet",e:"🥐",items:[
["Wo finde ich das Brot?","Dort beim Fenster.","Brot und Gebäck finden Sie auf dem Holztisch beim Fenster.","Brot, Semmeln und Gebäck stehen auf dem Holztisch beim Fenster. Direkt daneben gibt es auch einen Toaster."],
["Gibt es auch warme Speisen?","Ja, Eier auf Wunsch.","Ja, wir machen Ihnen gern Spiegelei, Rührei oder ein Omelett.","Gern! Unsere Küche bereitet Ihnen frisch Spiegelei, Rührei oder ein Omelett mit Zutaten Ihrer Wahl zu. Sagen Sie mir einfach, was Sie möchten."],
["Könnte ich ein weiches Ei bekommen?","Ja, gern.","Ja, gern. Soll es vier oder fünf Minuten kochen?","Sehr gern. Möchten Sie es ganz weich mit flüssigem Dotter, also etwa vier Minuten, oder lieber fünf Minuten?"],
["Es gibt keine Croissants mehr. Kommen noch welche?","Ja, gleich.","Entschuldigung! Frische Croissants kommen in ein paar Minuten.","Danke für den Hinweis! Die nächsten Croissants kommen gerade aus dem Ofen – in etwa fünf Minuten stehen sie am Buffet."],
["Ist der Orangensaft frisch gepresst?","Ja.","Ja, der Orangensaft wird jeden Morgen frisch gepresst.","Ja, wir pressen ihn jeden Morgen frisch. Und wenn Sie es lieber regional mögen: Der Apfelsaft kommt von einem Bauernhof ganz in der Nähe."],
["Darf ich mir ein Stück Obst mitnehmen?","Ja, gern.","Ja, natürlich, ein Stück Obst für unterwegs ist kein Problem.","Selbstverständlich, ein Apfel oder eine Banane für unterwegs ist gern gesehen. Wenn Sie mehr brauchen, packen wir Ihnen gern ein Lunchpaket."],
["Was ist Topfen?","Ein Frischkäse.","Topfen ist ein milder Frischkäse – in Deutschland sagt man Quark.","Topfen ist ein milder, cremiger Frischkäse, in Deutschland sagt man Quark dazu. Probieren Sie ihn mit Honig oder mit unserer hausgemachten Marmelade."]]},
{t:"Kaffee & Tee",e:"☕",items:[
["Kann ich einen Cappuccino haben?","Natürlich, sofort.","Selbstverständlich, ich bringe ihn Ihnen gleich an den Tisch.","Sehr gern. Möchten Sie ihn mit normaler Milch oder lieber mit Hafermilch? Ich bringe ihn Ihnen dann an den Tisch."],
["Wie funktioniert die Kaffeemaschine?","Tasse drunter, Knopf drücken.","Sie stellen die Tasse unter den Auslauf und drücken auf Ihr Getränk.","Ganz einfach: Stellen Sie die Tasse unter den Auslauf und wählen Sie auf dem Bildschirm Ihr Getränk. Wenn Sie möchten, zeige ich es Ihnen kurz."],
["Haben Sie laktosefreie Milch?","Ja, haben wir.","Ja, die laktosefreie Milch steht im Kühlschrank mit dem blauen Schild.","Ja, natürlich. Laktosefreie Milch und Hafermilch finden Sie im kleinen Kühlschrank mit dem blauen Schild. Soll ich Ihnen ein Kännchen an den Tisch bringen?"],
["Welche Teesorten gibt es?","Schwarz, grün und Kräuter.","Wir haben Schwarztee, Grüntee, Pfefferminze und Kamille.","Zur Auswahl stehen Schwarztee, Grüntee, Pfefferminze, Kamille und ein Früchtetee. Das heiße Wasser kommt aus dem silbernen Spender neben den Tassen."],
["Könnte ich bitte noch eine Kanne Kaffee bekommen?","Gern, kommt sofort.","Gern, ich bringe Ihnen sofort eine frische Kanne.","Aber gern. Ich bringe Ihnen gleich eine frische, heiße Kanne – darf es noch etwas Milch dazu sein?"]]},
{t:"Allergien & Ernährung",e:"🌾",items:[
["Ich vertrage kein Gluten. Was kann ich essen?","Wir haben glutenfreies Brot.","Wir haben glutenfreies Brot, das ich Ihnen gern frisch toaste.","Für Sie haben wir glutenfreies Brot und Gebäck, das extra gelagert wird. Ich toaste es Ihnen gern in einem eigenen Toaster, damit nichts mit Gluten in Berührung kommt."],
["Gibt es etwas Veganes?","Ja, einiges.","Ja – Obst, Gemüse, Hummus, Haferflocken und Pflanzenmilch sind vegan.","Ja, sehr gern. Vegan sind zum Beispiel Obst, Gemüse, Hummus, die Haferflocken und alle Pflanzenmilchsorten. Alles ist mit einem kleinen Blatt-Symbol gekennzeichnet."],
["Sind Nüsse im Müsli?","Ja, Haselnüsse.","Ja, in diesem Müsli sind Haselnüsse. Das nussfreie steht gleich daneben.","Ja, darin sind leider Haselnüsse. Wenn Sie eine Allergie haben, nehmen Sie bitte das Müsli mit dem blauen Schild – das ist garantiert nussfrei."],
["Woran erkenne ich die Allergene?","An den Schildern.","Auf jedem Schild am Buffet stehen die Allergene.","Auf jedem kleinen Schild am Buffet sind die Allergene mit Buchstaben angegeben. Die Erklärung der Buchstaben finden Sie auf der Tafel beim Eingang – oder fragen Sie mich einfach."],
["Ist im Rührei Milch?","Ja, ein bisschen.","Ja, ein bisschen. Wir können es aber auch ohne Milch zubereiten.","Normalerweise geben wir einen Schuss Milch dazu. Für Sie bereiten wir es aber gern ganz ohne Milch und mit Öl statt Butter zu."]]},
{t:"Tisch & Service",e:"🍽️",items:[
["Könnten wir einen Kinderhochstuhl bekommen?","Ja, sofort.","Natürlich, ich hole Ihnen gleich einen.","Selbstverständlich. Ich bringe Ihnen sofort einen Hochstuhl – und für die Kleinen haben wir auch Kinderbesteck und bunte Becher."],
["Dürfen wir auf der Terrasse sitzen?","Ja, gern.","Ja, gern – ich decke Ihnen draußen einen Tisch.","Sehr gern. Die Morgensonne ist auf der Terrasse wunderschön. Ich decke Ihnen draußen einen Tisch und bringe Ihnen bei Bedarf auch eine Decke."],
["Darf mein Hund mit in den Frühstücksraum?","Leider nein.","Im Frühstücksraum leider nicht, aber auf der Terrasse ist er herzlich willkommen.","Im Frühstücksraum dürfen wir aus Hygienegründen leider keine Hunde erlauben. Auf der Terrasse ist Ihr Hund aber herzlich willkommen, und eine Schüssel Wasser bringe ich auch gleich."],
["Kann ich das Frühstück aufs Zimmer bestellen?","Ja, gegen Aufpreis.","Ja, das ist möglich. Der Zimmerservice kostet acht Euro extra.","Ja, sehr gern. Füllen Sie einfach die Karte auf Ihrem Zimmer aus und hängen Sie sie bis 22 Uhr an die Tür. Für den Zimmerservice berechnen wir acht Euro."],
["Wie ist das WLAN-Passwort?","Es steht auf der Karte.","Das Passwort steht auf der kleinen Karte auf Ihrem Tisch.","Das Passwort finden Sie auf der kleinen Karte auf jedem Tisch. Es ist übrigens dasselbe wie auf Ihrem Zimmer."],
["Wo ist die Toilette?","Dort hinten rechts.","Die Toiletten sind gleich neben der Rezeption, rechts.","Gehen Sie bitte hier hinaus und dann gleich rechts – die Toiletten sind direkt neben der Rezeption."]]},
{t:"Reservierung & externe Gäste",e:"📞",items:[
["Ich wohne nicht im Hotel. Kann ich trotzdem frühstücken?","Ja, für 18 Euro.","Ja, gern. Das Buffet kostet für externe Gäste 18 Euro pro Person.","Selbstverständlich, auch externe Gäste sind herzlich willkommen. Das Buffet kostet 18 Euro pro Person, Kinder bis sechs Jahre frühstücken gratis."],
["Ich möchte für Sonntag einen Tisch für sechs Personen reservieren.","Gern. Um wie viel Uhr?","Sehr gern. Um wie viel Uhr möchten Sie kommen, und auf welchen Namen darf ich reservieren?","Sehr gern, für Sonntag, sechs Personen. Darf ich fragen, um wie viel Uhr Sie kommen möchten und auf welchen Namen ich den Tisch reservieren darf?"],
["Muss man fürs Frühstück reservieren?","Hotelgäste nicht.","Als Hotelgast nicht. Externe Gäste sollten am Wochenende lieber reservieren.","Als Hotelgast brauchen Sie keine Reservierung. Wenn Sie aber Freunde mitbringen möchten, empfehle ich am Wochenende eine Reservierung, weil wir mit unseren dreißig Zimmern schnell voll sind."],
["Ich muss meine Reservierung leider absagen.","Kein Problem, danke.","Kein Problem, danke, dass Sie Bescheid gegeben haben.","Das ist überhaupt kein Problem – vielen Dank, dass Sie uns rechtzeitig Bescheid geben. Ich storniere den Tisch sofort, und wir freuen uns, wenn Sie ein anderes Mal kommen."],
["Können wir die Reservierung auf halb zehn verschieben?","Ja, das geht.","Ja, das geht. Ich ändere die Uhrzeit gleich auf 9:30 Uhr.","Sehr gern, das lässt sich einrichten. Ich habe Ihre Reservierung auf 9:30 Uhr geändert – der Tisch wartet auf Sie."],
["Haben Sie am Samstag noch etwas frei?","Leider ausgebucht.","Am Samstag sind wir leider ausgebucht. Am Sonntag hätte ich noch einen Tisch.","Am Samstag sind wir leider schon ausgebucht. Am Sonntag um halb neun hätte ich aber noch einen schönen Tisch am Fenster – soll ich ihn für Sie reservieren?"]]},
{t:"Rezeption & Zimmer",e:"🔑",items:[
["Wann muss ich auschecken?","Bis elf Uhr.","Der Check-out ist bis 11 Uhr.","Der Check-out ist bis 11 Uhr. Wenn Sie etwas mehr Zeit brauchen, fragen Sie gern an der Rezeption nach einem späten Check-out."],

/* Multiple-Choice-Motor */
function makeMC(root,getItems,cfg){
  let items,idx,right;
  function start(){items=getItems();idx=0;right=0;show();}
  function show(){
    if(idx>=items.length){
      root.innerHTML=`<div class="card done"><div class="label">${esc(cfg.label)}</div><h3>Geschafft!</h3><p>Sie haben <b>${right} von ${items.length}</b> richtig beantwortet.${right===items.length?" Hervorragend – das war fehlerfrei!":right>=items.length*0.7?" Sehr gut gemacht!":" Wiederholen lohnt sich – beim zweiten Mal sitzt es schon viel besser."}</p><button class="btn again">Noch einmal</button></div>`;
      root.querySelector(".again").onclick=start;return;
    }
    const it=items[idx];
    const op=cfg.keep?it.o.map(o=>({t:o[0],ok:!!o[1],x:o[2]})):shuffle(it.o.map(o=>({t:o[0],ok:!!o[1],x:o[2]})));
    root.innerHTML=`<div class="card"><div class="prog"><span>${esc(cfg.label)} · ${idx+1} / ${items.length}</span><span>${right} richtig</span></div><div class="bar"><i style="width:${idx/items.length*100}%"></i></div>
      ${cfg.head(it)}
      <div class="opts">${op.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ot">${esc(o.t)}</span></button>`).join("")}</div>
      <div class="fb"></div><div class="nav2"><button class="btn next" hidden>Weiter →</button></div></div>`;
    let done=false;
    root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(done)return;done=true;const o=op[+b.dataset.i];
      if(o.ok){right++;addPts(cfg.pts||2);}
      root.querySelectorAll(".opt").forEach((bb,j)=>{const oo=op[j];bb.classList.add(oo.ok?"right":(bb===b?"wrong":"dim"));
        bb.insertAdjacentHTML("beforeend",`<span class="why">${oo.ok?"✓ ":"✗ "}${esc(oo.x)}</span>`);
        if(cfg.speakOpts&&oo.ok)bb.insertAdjacentHTML("beforeend",spk(oo.t));});
      root.querySelector(".fb").innerHTML=`<div class="fbbox ${o.ok?"good":"bad"}">${o.ok?"Richtig! ":"Leider nicht ganz. Die richtige Lösung ist markiert. "}${it.tip?esc(it.tip):""}</div>`;
      if(cfg.after)cfg.after(root,it);
      const n=root.querySelector(".next");n.hidden=false;n.onclick=()=>{idx++;show();root.scrollIntoView({behavior:"smooth",block:"start"});};
    });
  }
  start();
}

/* Zuordnungs-Motor */
function makeMatch(root,getPairs,cfg){
  function start(){
    const pairs=getPairs(),right=shuffle(pairs.map((p,i)=>({i,t:p[1]})));
    let sel=null,solved=0,miss=0;
    root.innerHTML=`<div class="card"><p class="hint">${esc(cfg.hint)}</p><div class="mgrid"><div class="mcol">${pairs.map((p,i)=>`<button class="mq" data-i="${i}"><b>${i+1}</b>${esc(p[0])}</button>`).join("")}</div><div class="mcol">${right.map(a=>`<button class="ma" data-i="${a.i}">${esc(a.t)}</button>`).join("")}</div></div><div class="fb"></div><div class="nav2"><button class="btn again">${esc(cfg.again)}</button></div></div>`;
    const qs=root.querySelectorAll(".mq"),as=root.querySelectorAll(".ma");
    qs.forEach(q=>q.onclick=()=>{if(q.classList.contains("ok"))return;qs.forEach(x=>x.classList.remove("sel"));q.classList.add("sel");sel=+q.dataset.i;if(cfg.say)speak(pairs[sel][0]);});
    as.forEach(a=>a.onclick=()=>{
      if(a.classList.contains("ok")||sel===null)return;
      if(+a.dataset.i===sel){
        a.classList.add("ok");a.insertAdjacentHTML("afterbegin",`<span class="tag">${sel+1}</span>`);
        root.querySelector(`.mq[data-i="${sel}"]`).classList.replace("sel","ok");sel=null;solved++;addPts(1);
        if(solved===pairs.length)root.querySelector(".fb").innerHTML=`<div class="fbbox good">Alles richtig zugeordnet${miss?` – mit ${miss} Fehlversuch${miss>1?"en":""}`:" – ohne einen einzigen Fehler"}! 🎉</div>`;
      }else{miss++;a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");}
    });
    root.querySelector(".again").onclick=start;
  }
  start();
}

  function show(){
    if(idx>=list.length){root.innerHTML=`<div class="card done"><h3>Geschafft!</h3><p><b>${right} von ${list.length}</b> Sätzen gleich beim ersten Versuch richtig gebaut.</p><button class="btn again">Neue Sätze</button></div>`;root.querySelector(".again").onclick=start;return;}
    const it=list[idx],sol=it.w.join(" "),alts=[sol,...(it.alt||[])].map(norm);
    const toks=shuffle(it.w.map((w,i)=>({w,i})));
    let line=[],first=true;
    root.innerHTML=`<div class="card"><div class="prog"><span>Satzbau · ${idx+1} / ${list.length}</span><span>${right} richtig</span></div><div class="bar"><i style="width:${idx/list.length*100}%"></i></div>
      <div class="sit">Klicken Sie die Wörter in der richtigen Reihenfolge an. Ein Klick auf ein Wort in der Zeile nimmt es wieder heraus.</div>
      <div class="line"></div><div class="pool"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn check">Prüfen</button><button class="btn ghost show">Lösung zeigen</button></div>
      <div class="fb"></div><div class="nav2"><button class="btn next" hidden>Weiter →</button></div></div>`;
    const L=root.querySelector(".line"),P=root.querySelector(".pool");
    function draw(){L.innerHTML=line.map((t,k)=>`<button class="tok" data-k="${k}">${esc(t.w)}</button>`).join("")||'<span class="hint">Hier entsteht Ihr Satz …</span>';
      P.innerHTML=toks.filter(t=>!line.includes(t)).map(t=>`<button class="tok" data-i="${t.i}">${esc(t.w)}</button>`).join("");}
    draw();
    P.onclick=e=>{const b=e.target.closest(".tok");if(!b)return;line.push(toks.find(t=>t.i===+b.dataset.i));draw();};
    L.onclick=e=>{const b=e.target.closest(".tok");if(!b)return;line.splice(+b.dataset.k,1);draw();};
    const fin=(ok,msg)=>{root.querySelector(".fb").innerHTML=`<div class="fbbox ${ok?"good":"bad"}">${msg}<br><b>${esc(sol)}</b> ${spk(sol)}${it.alt?`<br><span style="font-size:.92rem">Auch richtig: ${it.alt.map(esc).join(" · ")}</span>`:""}<br><span style="font-size:.92rem">${esc(it.e)}</span></div>`;
      root.querySelector(".check").disabled=true;root.querySelector(".show").disabled=true;const n=root.querySelector(".next");n.hidden=false;n.onclick=()=>{idx++;show();};};
    root.querySelector(".check").onclick=()=>{
      if(line.length<it.w.length){root.querySelector(".fb").innerHTML=`<div class="fbbox bad">Es fehlen noch Wörter.</div>`;return;}
      const guess=norm(line.map(t=>t.w).join(" "));
      if(alts.includes(guess)){if(first){right++;addPts(3);}fin(true,"Perfekt gebaut!");}
      else{first=false;root.querySelector(".fb").innerHTML=`<div class="fbbox bad">Noch nicht ganz – achten Sie auf die Position des Verbs. Versuchen Sie es noch einmal!</div>`;}
    };
    root.querySelector(".show").onclick=()=>fin(false,"Die Lösung:");
  }
  start();
}
function renderPolite(root){
  makeMC(root,()=>shuffle(POLITE),{label:"Höflich formulieren",pts:2,speakOpts:true,head:it=>`<div class="sit">So klingt es zu direkt oder unhöflich:</div><div class="qtext" style="color:var(--bad)">„${esc(it.r)}“</div><div class="sit">Welche Version ist für Hotelgäste am besten?</div>`});
}
function renderGaps(root){
  let h="";
  GAPS.forEach((g,gi)=>{h+=`<div class="gh">${esc(g.h)}</div>`;
    g.items.forEach((s,si)=>{const m=s[0].match(/\[\[(.*?)\]\]/),opts=m[1].split("|"),parts=s[0].split(m[0]);
      h+=`<div class="gs" data-c="${esc(opts[0])}" data-full="${esc(parts[0]+opts[0]+parts[1])}">${esc(parts[0])}<span class="chips">${shuffle(opts).map(o=>`<button class="chip" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</span>${esc(parts[1])}<div class="ex">✓ ${esc(s[1])}</div></div>`;});});
  root.innerHTML=`<div class="card"><p class="hint" style="margin:0">Klicken Sie auf das richtige Wort. Nach der richtigen Lösung erscheint eine kurze Erklärung, und der ganze Satz kann vorgelesen werden.</p></div>${h}<div class="nav2"><button class="btn reset">Alles zurücksetzen</button></div>`;
  root.addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;const s=c.closest(".gs");if(s.classList.contains("solved"))return;
    if(c.dataset.o===s.dataset.c){c.classList.add("right");s.classList.add("solved");if(!s.dataset.miss)addPts(1);s.querySelector(".ex").insertAdjacentHTML("beforeend"," "+spk(s.dataset.full));s.querySelectorAll(".chip:not(.right)").forEach(x=>x.style.display="none");}
    else{c.classList.add("wrong");s.dataset.miss=1;}});
  root.querySelector(".reset").onclick=()=>renderGaps(root);
}
function renderStories(root){
  root.innerHTML=`<div class="storypick">${STORIES.map((s,i)=>`<button data-i="${i}"><b>${i+1}. ${esc(s.t)}</b><span>${esc(s.d)}</span></button>`).join("")}</div><div class="sbody"></div>`;
  const body=root.querySelector(".sbody"),pick=root.querySelectorAll(".storypick button");
  function go(i){pick.forEach((b,j)=>b.classList.toggle("active",j===i));
    makeMC(body,()=>STORIES[i].steps,{label:STORIES[i].t,pts:2,speakOpts:true,head:it=>`<div class="label">Der Gast sagt</div><div class="bubble">${esc(it.g)} ${spk(it.g)}</div><div class="sit">Was antworten Sie?</div>`});}
  pick.forEach(b=>b.onclick=()=>go(+b.dataset.i));
  go(0);
}
function renderListen(root){
  makeMC(root,()=>shuffle(ALLP).slice(0,12).map(p=>{
    const others=shuffle(ALLP.filter(x=>x.c!==p.c)).slice(0,3);
    return {g:p.it[0],tip:"",o:[[p.it[2],1,"Diese Antwort passt genau zur Frage des Gastes."],...others.map(y=>[y.it[2],0,"Diese Antwort gehört zu einer anderen Frage: „"+y.it[0]+"“"])]};
  }),{label:"Hören & antworten",pts:2,head:it=>`<div class="label" style="text-align:center">Hören Sie dem Gast zu</div><button class="playbig" data-say="${esc(it.g)}" aria-label="Abspielen">${PLAY}</button><div style="text-align:center"><span class="qtext hiddenq">„${esc(it.g)}“</span><br><button class="btn ghost small showq" style="margin-top:8px">Text anzeigen</button></div><div class="sit" style="margin-top:12px">Welche Antwort passt?</div>`,
   after:r=>{const q=r.querySelector(".qtext");if(q)q.classList.remove("hiddenq");const s=r.querySelector(".showq");if(s)s.remove();}});
  root.addEventListener("click",e=>{const s=e.target.closest(".showq");if(s){root.querySelector(".qtext").classList.remove("hiddenq");s.remove();}});
}
function renderArt(root){
  makeMC(root,()=>shuffle(ART).slice(0,15).map(a=>({w:a[0],o:["der","die","das"].map(x=>[x+" "+a[0],x===a[1]?1:0,x===a[1]?"Richtig: "+a[1]+" "+a[0]+" – "+a[2]+".":"„"+x+" "+a[0]+"“ ist falsch – es heißt "+a[1]+" "+a[0]+"."])})),
  {label:"Artikel am Buffet",pts:1,keep:true,speakOpts:true,head:it=>`<div class="sit">Welcher Artikel ist richtig?</div><div class="qtext">${esc(it.w)} ${spk(it.w)}</div>`});
}

const MODES=[
{id:"pb",n:"Phrasebook",s:"Gastfragen & 3 Antworten",c:"var(--sky)",title:"Phrasebook",intro:"Typische Fragen von Gästen im Frühstückscafé und an der Rezeption – jeweils mit drei Antworten: kurz, höflich und ausführlich-elegant. Mit Suchfunktion und Selbsttest.",render:renderPhrasebook},
{id:"mc",n:"Knifflige Wahl",s:"Grammatik mit Erklärungen",c:"var(--petrol)",title:"Knifflige Wahl",intro:"Vier Möglichkeiten, eine ist richtig – und zu jeder Antwort erfahren Sie, warum sie passt oder nicht passt. Jede Runde mischt 15 von 30 Aufgaben.",render:renderMC},
{id:"ex",n:"Ausdrücke",s:"Feste Wendungen zuordnen",c:"var(--lilac)",title:"Ausdrücke zuordnen",intro:"Feste Wendungen, die man im Hotel und im Café jeden Tag braucht. Ordnen Sie jedem Ausdruck seine Bedeutung zu.",render:renderExpr},
{id:"m10",n:"Zuordnen 1–10",s:"Frage ↔ Antwort",c:"var(--terra)",title:"Zuordnen 1–10",intro:"Zehn Gastfragen aus zehn verschiedenen Themen – finden Sie die passende Antwort. Jede Runde ist neu gemischt.",render:renderMatch10},
{id:"fin",n:"Satz vollenden",s:"Wortstellung & Endungen",c:"var(--plum)",title:"Satz vollenden",intro:"Ein Satzanfang, vier mögliche Fortsetzungen. Nur eine ist grammatisch richtig – die Erklärungen zeigen, wo die Stolpersteine liegen.",render:renderFinish},
{id:"bld",n:"Satzbau",s:"Wörter ordnen",c:"var(--ocean)",title:"Satzbau",intro:"Bauen Sie aus den Wörtern einen richtigen Satz. Besonders wichtig: Wo steht das Verb?",render:renderBuild},
{id:"pol",n:"Höflich formulieren",s:"Vom Befehl zum Service",c:"var(--rose)",title:"Höflich formulieren",intro:"Wie wird aus einem zu direkten Satz eine freundliche, professionelle Antwort? Mit Profi-Tipp zu jeder Aufgabe.",render:renderPolite},
{id:"gap",n:"Lückentext",s:"Präpositionen, Fälle, Verben",c:"var(--indigo)",title:"Lückentext",intro:"24 Sätze aus dem Hotelalltag in drei Gruppen. Klicken Sie das richtige Wort an – danach erscheint die Erklärung.",render:renderGaps},
{id:"sto",n:"Rollenspiele",s:"3 komplette Gespräche",c:"var(--amber)",title:"Rollenspiele",intro:"Drei ganze Gespräche von Anfang bis Ende: eine Familie beim Frühstück, eine telefonische Reservierung und ein schwieriger Morgen mit Beschwerden.",render:renderStories},
{id:"lis",n:"Hören & antworten",s:"Nur mit den Ohren",c:"var(--slate)",title:"Hören & antworten",intro:"Hören Sie die Frage des Gastes, ohne sie zu lesen, und wählen Sie die passende Antwort. Den Text können Sie bei Bedarf einblenden.",render:renderListen},
{id:"art",n:"Artikel am Buffet",s:"der, die oder das?",c:"var(--honey)",title:"Artikel am Buffet",intro:"Wörter vom Buffet und aus dem Hotel – mit Merkhilfen, damit der Artikel beim nächsten Mal sitzt. Österreichische Wörter sind markiert.",render:renderArt}
];

const nav=$("#nav"),main=$("#main"),rendered={};
MODES.forEach((m,k)=>{
  nav.insertAdjacentHTML("beforeend",`<button data-k="${k}" style="--c:${m.c}"><span class="num">${k+1}</span><span class="t">${esc(m.n)}<span class="s">${esc(m.s)}</span></span></button>`);
  main.insertAdjacentHTML("beforeend",`<section class="mode" id="sec-${m.id}" style="--c:${m.c}"><div class="intro"><h2>${k+1}. ${esc(m.title)}</h2><p>${esc(m.intro)}</p></div><div class="body"></div></section>`);
});
function openMode(k){
  const m=MODES[k];
  nav.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("active",j===k));
  main.querySelectorAll(".mode").forEach(s=>s.classList.remove("show"));
  const sec=$("#sec-"+m.id);sec.classList.add("show");
  if(!rendered[m.id]){m.render(sec.querySelector(".body"));rendered[m.id]=true;}
}
nav.onclick=e=>{const b=e.target.closest("button");if(b){openMode(+b.dataset.k);window.scrollTo({top:nav.offsetTop+nav.offsetHeight-10,behavior:"smooth"});}};
openMode(0);
</script>
</body>
