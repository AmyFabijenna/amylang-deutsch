<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinder Vokabellern-App - Amy Lang</title>

    <!-- DAF Zugangsschutz -->
    <script src="../../daf-access-control.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FFD700 0%, #2a5298 50%, #FFA500 100%);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .top-navigation {
            background: #1e3c72;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .top-nav-links {
            display: flex;
            gap: 15px;
        }
        
        .top-nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
            font-weight: 600;
        }
        
        .home-link {
            background: #FFD700;
            color: #333 !important;
        }
        
        .home-link:hover {
            background: #FFC700;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .photo-whatsapp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .profile-photo:hover {
            transform: scale(1.05);
        }

        .whatsapp-link {
            display: inline-block;
            background: #25d366;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-link:hover {
            background: #20c158;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .controls {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 25px;
            color: #1e3c72;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .mode-btn:hover, .mode-btn.active {
            background: #1e3c72;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(135, 206, 235, 0.5);
            border-radius: 20px;
            color: #1E90FF;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .language-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 20px;
            color: #1e3c72;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #FFA500;
            color: white;
            border-color: #FFA500;
        }

        .direction-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 20px;
            color: #1e3c72;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
        }

        .direction-btn:hover {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .direction-btn.active {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .search-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-input {
            padding: 12px 20px;
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
        }

        .content-area {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            min-height: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Flashcard Mode */
        .flashcard {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .flashcard:hover {
            transform: scale(1.02);
        }

        .flashcard-word {
            font-size: 2.5em;
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .flashcard-emoji {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .flashcard-details {
            font-size: 1.2em;
            color: #666;
            text-align: center;
            line-height: 1.8;
        }

        .flashcard-translation {
            font-size: 1.4em;
            color: #1E90FF;
            margin-top: 15px;
            font-weight: 600;
        }

        .flashcard-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .flashcard-btn {
            padding: 12px 30px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .flashcard-btn:hover {
            background: #6AB5DB;
            transform: translateY(-2px);
        }

        .flashcard-btn.known {
            background: #32CD32;
        }

        .flashcard-btn.known:hover {
            background: #28A428;
        }

        .flashcard-btn.unknown {
            background: #FFD700;
        }

        .flashcard-btn.unknown:hover {
            background: #1e3c72;
        }

        /* List Mode */
        .vocab-list {
            display: grid;
            gap: 15px;
        }

        .vocab-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .vocab-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .vocab-item.learned {
            opacity: 0.6;
            background: #E0FFE0;
        }

        .vocab-german {
            font-size: 1.4em;
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vocab-emoji {
            font-size: 1.5em;
        }

        .vocab-type {
            display: inline-block;
            padding: 4px 12px;
            background: #2a5298;
            color: white;
            border-radius: 15px;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .vocab-details {
            color: #666;
            margin-top: 8px;
            font-size: 0.95em;
        }

        .vocab-translation {
            color: #1E90FF;
            font-weight: 600;
            margin-top: 10px;
        }

        .vocab-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mark-learned {
            background: #32CD32;
            color: white;
        }

        .mark-learned:hover {
            background: #28A428;
        }

        .mark-unlearned {
            background: #FFD700;
            color: white;
        }

        .mark-unlearned:hover {
            background: #1e3c72;
        }

        /* Quiz Mode */
        .quiz-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .quiz-question {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .quiz-word {
            font-size: 2em;
            color: #1e3c72;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }

        .quiz-options {
            display: grid;
            gap: 15px;
        }

        .quiz-option {
            padding: 15px 25px;
            background: rgba(135, 206, 235, 0.2);
            border: 2px solid #2a5298;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            text-align: center;
        }

        .quiz-option:hover {
            background: rgba(135, 206, 235, 0.3);
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: #32CD32;
            color: white;
            border-color: #32CD32;
        }

        .quiz-option.incorrect {
            background: #FFD700;
            color: white;
            border-color: #FFD700;
        }

        .quiz-score {
            text-align: center;
            font-size: 1.3em;
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Stats */
        .stats {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .stat-item {
            display: inline-block;
            margin: 0 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFD700, #2a5298);
            color: white;
            border-radius: 20px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .flashcard-word {
                font-size: 1.8em;
            }

            .mode-selector, .filters {
                flex-direction: column;
                align-items: center;
            }

            .photo-whatsapp-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-navigation">
            <div class="top-nav-links">
                <a href="../../index.html" class="home-link">← Zurück zur Hauptseite</a>
            </div>
        </div>

        <header>
            <h1>🌈 Kinder Vokabellern-App 🎨</h1>
            <div class="photo-whatsapp-container">
                <img src="../../images/amy_lang_photo.jpg" alt="Amy Lang" class="profile-photo">
                <a href="https://wa.me/4368120283291?text=Hallo%20Amy,%20ich%20möchte%20gerne%20Deutsch%20lernen!" 
                   target="_blank" 
                   class="whatsapp-link">
                    📱 WhatsApp: +36 30 181 8503
                </a>
            </div>
        </header>

        <div class="controls">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('flashcard')">🃏 Karteikarten</button>
                <button class="mode-btn" onclick="setMode('list')">📋 Liste</button>
                <button class="mode-btn" onclick="setMode('quiz')">🎯 Quiz</button>
            </div>

            <div class="language-selector">
                <button class="lang-btn active" onclick="setLanguage('en')">🇬🇧 English</button>
                <button class="lang-btn" onclick="setLanguage('hu')">🇭🇺 Magyar</button>
                <button class="direction-btn" onclick="toggleDirection()" id="directionBtn" title="Lernrichtung umkehren">
                    🇩🇪 → 🇬🇧
                </button>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all')">Alle</button>
                <button class="filter-btn" onclick="setFilter('Nomen')">Nomen</button>
                <button class="filter-btn" onclick="setFilter('Verb')">Verben</button>
                <button class="filter-btn" onclick="setFilter('Adjektiv')">Adjektive</button>
                <button class="filter-btn" onclick="setFilter('unlearned')">⭐ Zu lernen</button>
                <button class="filter-btn" onclick="setFilter('learned')">✅ Gelernt</button>
            </div>

            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Vokabel suchen..." oninput="filterVocab()">
            </div>
        </div>

        <div class="stats">
            <span class="stat-item">Gesamt: <span id="totalCount">0</span></span>
            <span class="stat-item">Gelernt: <span id="learnedCount">0</span></span>
            <span class="stat-item">Zu lernen: <span id="unlearnedCount">0</span></span>
        </div>

        <div class="content-area" id="contentArea">
            <!-- Content will be dynamically inserted here -->
        </div>
    </div>

            {word: "der Arzt", type: "Nomen", plural: "die Ärzte", en: "doctor", hu: "orvos", emoji: "👨‍⚕️"},

            // Orte
            {word: "der Park", type: "Nomen", plural: "die Parks", en: "park", hu: "park", emoji: "🏞️"},
            {word: "der Spielplatz", type: "Nomen", plural: "die Spielplätze", en: "playground", hu: "játszótér", emoji: "🎪"},
            {word: "der Zoo", type: "Nomen", plural: "die Zoos", en: "zoo", hu: "állatkert", emoji: "🦁"},
            {word: "das Kino", type: "Nomen", plural: "die Kinos", en: "cinema", hu: "mozi", emoji: "🎬"},
            {word: "der Supermarkt", type: "Nomen", plural: "die Supermärkte", en: "supermarket", hu: "szupermarket", emoji: "🛒"},
            {word: "die Bibliothek", type: "Nomen", plural: "die Bibliotheken", en: "library", hu: "könyvtár", emoji: "📚"},
            {word: "das Krankenhaus", type: "Nomen", plural: "die Krankenhäuser", en: "hospital", hu: "kórház", emoji: "🏥"},
            {word: "die Post", type: "Nomen", plural: "die Posten", en: "post office", hu: "posta", emoji: "📮"},
            {word: "die Bank", type: "Nomen", plural: "die Banken", en: "bank", hu: "bank", emoji: "🏦"},

            // Musikinstrumente
            {word: "das Klavier", type: "Nomen", plural: "die Klaviere", en: "piano", hu: "zongora", emoji: "🎹"},
            {word: "die Gitarre", type: "Nomen", plural: "die Gitarren", en: "guitar", hu: "gitár", emoji: "🎸"},
            {word: "die Geige", type: "Nomen", plural: "die Geigen", en: "violin", hu: "hegedű", emoji: "🎻"},
            {word: "die Flöte", type: "Nomen", plural: "die Flöten", en: "flute", hu: "fuvola", emoji: "🪈"},
            {word: "die Trommel", type: "Nomen", plural: "die Trommeln", en: "drum", hu: "dob", emoji: "🥁"},

            // Verschiedenes
            {word: "ja", type: "Adverb", en: "yes", hu: "igen", emoji: "✅"},
            {word: "nein", type: "Adverb", en: "no", hu: "nem", emoji: "❌"},
            {word: "bitte", type: "Adverb", en: "please", hu: "kérem", emoji: "🙏"},
            {word: "danke", type: "Adverb", en: "thank you", hu: "köszönöm", emoji: "🙏"},
            {word: "hallo", type: "Interjektion", en: "hello", hu: "helló", emoji: "👋"},
            {word: "tschüss", type: "Interjektion", en: "bye", hu: "szia", emoji: "👋"},
            {word: "guten Morgen", type: "Phrase", en: "good morning", hu: "jó reggelt", emoji: "🌅"},
            {word: "gute Nacht", type: "Phrase", en: "good night", hu: "jó éjszakát", emoji: "🌙"},
        ];

        // State management
        let currentMode = 'flashcard';
        let currentLanguage = 'en';
        let currentFilter = 'all';
        let currentIndex = 0;
        let learnedWords = JSON.parse(localStorage.getItem('kinderLearnedWords') || '{}');
        let quizScore = {correct: 0, total: 0};
        let filteredVocab = [];
        let isFlipped = false;
        let isReversed = JSON.parse(localStorage.getItem('kinderIsReversed') || 'false');

        // Initialize app
        function init() {
            filterVocab();
            updateStats();
            updateDirectionButton();
            renderContent();
        }

        // Mode switching
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentIndex = 0;
            isFlipped = false;
            if (mode === 'quiz') {
                quizScore = {correct: 0, total: 0};
            }
            renderContent();
        }

        // Language switching
        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateDirectionButton();
            renderContent();
        }

        // Toggle learning direction
        function toggleDirection() {
            isReversed = !isReversed;
            localStorage.setItem('kinderIsReversed', JSON.stringify(isReversed));
            updateDirectionButton();
            if (currentMode === 'flashcard') {
                isFlipped = false;
                renderContent();
            }
        }

        // Update direction button display
        function updateDirectionButton() {
            const btn = document.getElementById('directionBtn');
            if (!btn) return;
            
            const langFlag = currentLanguage === 'en' ? '🇬🇧' : '🇭🇺';
            
            if (isReversed) {
                btn.textContent = `${langFlag} → 🇩🇪`;
                btn.classList.add('active');
            } else {
                btn.textContent = `🇩🇪 → ${langFlag}`;
                btn.classList.remove('active');
            }
        }

        // Filter switching
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentIndex = 0;
            filterVocab();
            updateStats();
            renderContent();
        }

        // Filter vocabulary
        function filterVocab() {
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            
            filteredVocab = vocabData.filter(item => {
                // Search filter
                if (searchTerm && !item.word.toLowerCase().includes(searchTerm) && 
                    !item[currentLanguage].toLowerCase().includes(searchTerm)) {
                    return false;
                }
                
                // Type filter
                if (currentFilter !== 'all' && currentFilter !== 'learned' && currentFilter !== 'unlearned') {
                    if (item.type !== currentFilter) return false;
                }
                
                // Learned/unlearned filter
                if (currentFilter === 'learned' && !learnedWords[item.word]) return false;
                if (currentFilter === 'unlearned' && learnedWords[item.word]) return false;
                
                return true;
            });
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalCount').textContent = vocabData.length;
            document.getElementById('learnedCount').textContent = Object.keys(learnedWords).length;
            document.getElementById('unlearnedCount').textContent = vocabData.length - Object.keys(learnedWords).length;
        }

        // Mark word as learned/unlearned
        function toggleLearned(word, learned) {
            if (learned) {
                learnedWords[word] = true;
            } else {
                delete learnedWords[word];
            }
            localStorage.setItem('kinderLearnedWords', JSON.stringify(learnedWords));
            updateStats();
            if (currentFilter === 'learned' || currentFilter === 'unlearned') {
                filterVocab();
            }
            renderContent();
        }

        // Render content based on current mode
        function renderContent() {
            const contentArea = document.getElementById('contentArea');
            
            if (filteredVocab.length === 0) {
                contentArea.innerHTML = '<p style="text-align: center; color: #1e3c72; font-size: 1.2em; padding: 50px;">Keine Vokabeln gefunden 😔</p>';
                return;
            }
            
            switch(currentMode) {
                case 'flashcard':
                    renderFlashcard(contentArea);
                    break;
                case 'list':
                    renderList(contentArea);
                    break;
                case 'quiz':
                    renderQuiz(contentArea);
                    break;
            }
        }

        // Render flashcard mode
        function renderFlashcard(container) {
            if (currentIndex >= filteredVocab.length) currentIndex = 0;
            const item = filteredVocab[currentIndex];
            
            container.innerHTML = `
                <div class="flashcard" onclick="flipCard()">
                    ${item.emoji ? `<div class="flashcard-emoji">${item.emoji}</div>` : ''}
                    <div class="flashcard-word">${isFlipped ? (isReversed ? item.word : item[currentLanguage]) : (isReversed ? item[currentLanguage] : item.word)}</div>
                    ${!isFlipped ? `
                        <div class="flashcard-details">
                            <span class="vocab-type">${item.type}</span><br>
                            ${getDetails(item)}
                        </div>
                    ` : `
                        <div class="flashcard-translation">${isReversed ? item[currentLanguage] : item.word}</div>
                    `}
                    <p style="margin-top: 20px; color: #999; font-size: 0.9em;">Klicken zum Umdrehen</p>
                </div>
                <div class="flashcard-controls">
                    <button class="flashcard-btn" onclick="previousCard()">◀ Zurück</button>
                    <button class="flashcard-btn unknown" onclick="markUnknown()">❌ Nicht gewusst</button>
                    <button class="flashcard-btn known" onclick="markKnown()">✅ Gewusst</button>
                    <button class="flashcard-btn" onclick="nextCard()">Weiter ▶</button>
                </div>
                <p style="text-align: center; margin-top: 20px; color: #1e3c72; font-weight: bold;">
                    Karte ${currentIndex + 1} von ${filteredVocab.length}
                </p>
            `;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            renderContent();
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % filteredVocab.length;
            isFlipped = false;
            renderContent();
        }

        function previousCard() {
            currentIndex = currentIndex === 0 ? filteredVocab.length - 1 : currentIndex - 1;
            isFlipped = false;
            renderContent();
        }

        function markKnown() {
            toggleLearned(filteredVocab[currentIndex].word, true);
            nextCard();
        }

        function markUnknown() {
            toggleLearned(filteredVocab[currentIndex].word, false);
            nextCard();
        }

        // Render list mode
        function renderList(container) {
            let html = '<div class="vocab-list">';
            
            filteredVocab.forEach(item => {
                const isLearned = learnedWords[item.word];
                html += `
                    <div class="vocab-item ${isLearned ? 'learned' : ''}">
                        <div class="vocab-german">
                            ${item.emoji ? `<span class="vocab-emoji">${item.emoji}</span>` : ''}
                            ${item.word}
                            <span class="vocab-type">${item.type}</span>
                        </div>
                        <div class="vocab-details">${getDetails(item)}</div>
                        <div class="vocab-translation">
                            ${getTranslationLabel()}: ${item[currentLanguage]}
                        </div>
                        <div class="vocab-actions">
                            ${!isLearned ? 
                                `<button class="action-btn mark-learned" onclick='toggleLearned("${item.word}", true)'>✅ Als gelernt markieren</button>` :
                                `<button class="action-btn mark-unlearned" onclick='toggleLearned("${item.word}", false)'>❌ Als ungelernt markieren</button>`
                            }
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Render quiz mode
        function renderQuiz(container) {
            if (currentIndex >= filteredVocab.length) {
                container.innerHTML = `
                    <div class="quiz-container">
                        <div class="quiz-score">
                            🎉 Quiz abgeschlossen! 🎉<br><br>
                            Ergebnis: ${quizScore.correct} von ${quizScore.total} richtig<br>
                            (${Math.round(quizScore.correct / quizScore.total * 100)}%)
                        </div>
                        <button class="flashcard-btn" onclick="restartQuiz()" style="display: block; margin: 20px auto;">Quiz neu starten</button>
                    </div>
                `;
                return;
            }

            const item = filteredVocab[currentIndex];
            const options = generateQuizOptions(item);
            
            container.innerHTML = `
                <div class="quiz-container">
                    <div class="quiz-score">Frage ${currentIndex + 1} von ${filteredVocab.length} | Richtig: ${quizScore.correct}/${quizScore.total}</div>
                    <div class="quiz-question">
                        ${item.emoji ? `<div style="font-size: 3em; text-align: center; margin-bottom: 15px;">${item.emoji}</div>` : ''}
                        <div class="quiz-word">${item.word}</div>
                        <p style="text-align: center; color: #666; margin-bottom: 20px;">Was bedeutet das auf ${getLanguageName()}?</p>
                        <div class="quiz-options" id="quizOptions">
                            ${options.map((opt, idx) => `
                                <div class="quiz-option" onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${item[currentLanguage].replace(/'/g, "\\'")}', ${idx})">${opt}</div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function generateQuizOptions(correctItem) {
            const options = [correctItem[currentLanguage]];
            const sameType = vocabData.filter(v => v.type === correctItem.type && v.word !== correctItem.word);
            
            while (options.length < 4 && sameType.length > 0) {
                const randomIndex = Math.floor(Math.random() * sameType.length);
                const randomOption = sameType[randomIndex][currentLanguage];
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
                sameType.splice(randomIndex, 1);
            }
            
            // If not enough same-type words, add from other types
            while (options.length < 4) {
                const randomItem = vocabData[Math.floor(Math.random() * vocabData.length)];
                if (!options.includes(randomItem[currentLanguage])) {
                    options.push(randomItem[currentLanguage]);
                }
            }
            
            // Shuffle options
            return options.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selected, correct, optionIndex) {
            quizScore.total++;
            const options = document.querySelectorAll('.quiz-option');
            
            if (selected === correct) {
                quizScore.correct++;
                options[optionIndex].classList.add('correct');
                toggleLearned(filteredVocab[currentIndex].word, true);
            } else {
                options[optionIndex].classList.add('incorrect');
                // Highlight correct answer
                options.forEach(opt => {
                    if (opt.textContent === correct) {
                        opt.classList.add('correct');
                    }
                });
                toggleLearned(filteredVocab[currentIndex].word, false);
            }
            
            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');
            
            // Move to next question after delay
            setTimeout(() => {
                currentIndex++;
                renderContent();
            }, 1500);
        }

        function restartQuiz() {
            currentIndex = 0;
            quizScore = {correct: 0, total: 0};
            filterVocab();
            renderContent();
        }

        // Helper functions
        function getDetails(item) {
            switch(item.type) {
                case 'Nomen':
                    return item.plural ? `Plural: ${item.plural}` : '';
                case 'Verb':
                    return item.preterite && item.perfect ? `Präteritum: ${item.preterite}<br>Perfekt: ${item.perfect}` : '';
                default:
                    return '';
            }
        }

        function getTranslationLabel() {
            switch(currentLanguage) {
                case 'en': return '🇬🇧 English';
                case 'hu': return '🇭🇺 Magyar';
                default: return '';
            }
        }

        function getLanguageName() {
            switch(currentLanguage) {
                case 'en': return 'Englisch';
                case 'hu': return 'Ungarisch';
                default: return '';
            }
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
