<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinder Vokabellern-App - Amy Lang</title>

    <!-- DAF Zugangsschutz -->
    <script src="../../daf-access-control.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FFD700 0%, #2a5298 50%, #FFA500 100%);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .top-navigation {
            background: #1e3c72;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .top-nav-links {
            display: flex;
            gap: 15px;
        }
        
        .top-nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
            font-weight: 600;
        }
        
        .home-link {
            background: #FFD700;
            color: #333 !important;
        }
        
        .home-link:hover {
            background: #FFC700;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .photo-whatsapp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .profile-photo:hover {
            transform: scale(1.05);
        }

        .whatsapp-link {
            display: inline-block;
            background: #25d366;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-link:hover {
            background: #20c158;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .controls {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 25px;
            color: #1e3c72;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .mode-btn:hover, .mode-btn.active {
            background: #1e3c72;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(135, 206, 235, 0.5);
            border-radius: 20px;
            color: #1E90FF;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .language-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 20px;
            color: #1e3c72;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #FFA500;
            color: white;
            border-color: #FFA500;
        }

        .direction-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 20px;
            color: #1e3c72;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
        }

        .direction-btn:hover {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .direction-btn.active {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .search-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-input {
            padding: 12px 20px;
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
        }

        .content-area {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            min-height: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Flashcard Mode */
        .flashcard {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .flashcard:hover {
            transform: scale(1.02);
        }

        .flashcard-word {
            font-size: 2.5em;
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .flashcard-emoji {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .flashcard-details {
            font-size: 1.2em;
            color: #666;
            text-align: center;
            line-height: 1.8;
        }

        .flashcard-translation {
            font-size: 1.4em;
            color: #1E90FF;
            margin-top: 15px;
            font-weight: 600;
        }

        .flashcard-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .flashcard-btn {
            padding: 12px 30px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .flashcard-btn:hover {
            background: #6AB5DB;
            transform: translateY(-2px);
        }

        .flashcard-btn.known {
            background: #32CD32;
        }

        .flashcard-btn.known:hover {
            background: #28A428;
        }

        .flashcard-btn.unknown {
            background: #FFD700;
        }

        .flashcard-btn.unknown:hover {
            background: #1e3c72;
        }

        /* List Mode */
        .vocab-list {
            display: grid;
            gap: 15px;
        }

        .vocab-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .vocab-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .vocab-item.learned {
            opacity: 0.6;
            background: #E0FFE0;
        }

        .vocab-german {
            font-size: 1.4em;
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vocab-emoji {
            font-size: 1.5em;
        }

        .vocab-type {
            display: inline-block;
            padding: 4px 12px;
            background: #2a5298;
            color: white;
            border-radius: 15px;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .vocab-details {
            color: #666;
            margin-top: 8px;
            font-size: 0.95em;
        }

        .vocab-translation {
            color: #1E90FF;
            font-weight: 600;
            margin-top: 10px;
        }

        .vocab-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mark-learned {
            background: #32CD32;
            color: white;
        }

        .mark-learned:hover {
            background: #28A428;
        }

        .mark-unlearned {
            background: #FFD700;
            color: white;
        }

        .mark-unlearned:hover {
            background: #1e3c72;
        }

        /* Quiz Mode */
        .quiz-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .quiz-question {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .quiz-word {
            font-size: 2em;
            color: #1e3c72;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }

        .quiz-options {
            display: grid;
            gap: 15px;
        }

        .quiz-option {
            padding: 15px 25px;
            background: rgba(135, 206, 235, 0.2);
            border: 2px solid #2a5298;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            text-align: center;
        }

        .quiz-option:hover {
            background: rgba(135, 206, 235, 0.3);
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: #32CD32 !important;
            color: white !important;
            border-color: #32CD32 !important;
            transform: scale(1.05) !important;
            cursor: default !important;
        }

        .quiz-option.correct:hover {
            background: #32CD32 !important;
            transform: scale(1.05) !important;
        }

        .quiz-option.incorrect {
            background: #f44336 !important;
            color: white !important;
            border-color: #f44336 !important;
            cursor: default !important;
        }

        .quiz-option.incorrect:hover {
            background: #f44336 !important;
            transform: none !important;
        }

        .quiz-score {
            text-align: center;
            font-size: 1.3em;
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Stats */
        .stats {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .stat-item {
            display: inline-block;
            margin: 0 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFD700, #2a5298);
            color: white;
            border-radius: 20px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .flashcard-word {
                font-size: 1.8em;
            }

            .mode-selector, .filters {
                flex-direction: column;
                align-items: center;
            }

            .photo-whatsapp-container {
                flex-direction: column;
            }
            
            .memory-card { width: 70px; height: 70px; font-size: 0.8em; }
            .memory-grid.pairs-5 { grid-template-columns: repeat(5, 70px); }
            .memory-grid.pairs-10 { grid-template-columns: repeat(5, 70px); }
            .memory-grid.pairs-20 { grid-template-columns: repeat(5, 70px); }
        }

        /* NEUE SPIELE - Hangman/Blumen-Spiel */
        .hangman-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 4px solid #FFD700;
            text-align: center;
        }
        .flower-drawing {
            font-size: 5em;
            margin: 30px 0;
            min-height: 200px;
        }
        .word-display {
            font-size: 2.5em;
            letter-spacing: 10px;
            margin: 30px 0;
            color: #1e3c72;
            font-weight: bold;
        }
        .keyboard {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        .key {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 2px solid #FF8C00;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
            color: #1e3c72;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .key.used {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Memory */
        .memory-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 4px solid #1e3c72;
        }
        .memory-settings {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .pair-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 2px solid #FF8C00;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: #1e3c72;
            transition: all 0.3s ease;
        }
        .pair-btn:hover, .pair-btn.active {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #FFD700;
            transform: scale(1.05);
        }
        .memory-grid {
            display: grid;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        .memory-grid.pairs-5 { grid-template-columns: repeat(5, 100px); }
        .memory-grid.pairs-10 { grid-template-columns: repeat(5, 100px); }
        .memory-grid.pairs-20 { grid-template-columns: repeat(8, 100px); }
        .memory-card {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 3px solid #FF8C00;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
            color: #1e3c72;
            transition: all 0.3s ease;
            text-align: center;
            padding: 5px;
        }
        .memory-card:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .memory-card.flipped {
            background: white;
            border-color: #1e3c72;
        }
        .memory-card.matched {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border-color: #2e7d32;
            cursor: default;
        }
        .memory-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            font-weight: bold;
            color: #1e3c72;
            font-size: 1.2em;
        }

        /* Puzzle */
        .puzzle-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 4px solid #FFD700;
            text-align: center;
        }
        .scrambled-word {
            font-size: 2.5em;
            color: #1e3c72;
            font-weight: bold;
            margin: 30px 0;
            letter-spacing: 5px;
        }
        .puzzle-input {
            font-size: 1.5em;
            padding: 15px;
            border: 3px solid #1e3c72;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            margin: 20px auto;
            display: block;
        }

        /* Fill Blanks */
        .fillblanks-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 4px solid #1e3c72;
        }
        .story-text {
            font-size: 1.3em;
            line-height: 2;
            color: #1e3c72;
            margin: 20px 0;
        }
        .blank-input {
            font-size: 1.2em;
            padding: 8px 15px;
            border: 2px solid #FFD700;
            border-radius: 8px;
            margin: 0 5px;
            min-width: 120px;
            text-align: center;
        }
        .blank-input.correct {
            background: #4CAF50;
            color: white;
            border-color: #2e7d32;
        }
        .blank-input.incorrect {
            background: #f44336;
            color: white;
            border-color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-navigation">
            <div class="top-nav-links">
                <a href="../../index.html" class="home-link">← Zurück zur Hauptseite</a>
            </div>
        </div>

        <header>
            <h1>🌈 Kinder Vokabellern-App 🎨</h1>
            <div class="photo-whatsapp-container">
                <img src="../../images/amy_lang_photo.jpg" alt="Amy Lang" class="profile-photo">
                <a href="https://wa.me/4368120283291?text=Hallo%20Amy,%20ich%20möchte%20gerne%20Deutsch%20lernen!" 
                   target="_blank" 
                   class="whatsapp-link">
                    📱 WhatsApp: +43 681 20283291
                </a>
            </div>
        </header>

        <div class="controls">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('flashcard')">🃏 Karteikarten</button>
                <button class="mode-btn" onclick="setMode('list')">📋 Liste</button>
                <button class="mode-btn" onclick="setMode('quiz')">🎯 Quiz</button>
                <button class="mode-btn" onclick="setMode('hangman')">🌻 Blumen-Spiel</button>
                <button class="mode-btn" onclick="setMode('memory')">🎴 Memory</button>
                <button class="mode-btn" onclick="setMode('puzzle')">🧩 Worträtsel</button>
                <button class="mode-btn" onclick="setMode('fillblanks')">📝 Lückentext</button>
            </div>

            <div class="language-selector">
                <button class="lang-btn active" onclick="setLanguage('en')">🇬🇧 English</button>
                <button class="lang-btn" onclick="setLanguage('hu')">🇭🇺 Magyar</button>
                <button class="direction-btn" onclick="toggleDirection()" id="directionBtn" title="Lernrichtung umkehren">
                    🇩🇪 → 🇬🇧
                </button>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all')">Alle</button>
                <button class="filter-btn" onclick="setFilter('Nomen')">Nomen</button>
                <button class="filter-btn" onclick="setFilter('Verb')">Verben</button>
                <button class="filter-btn" onclick="setFilter('Adjektiv')">Adjektive</button>
                <button class="filter-btn" onclick="setFilter('unlearned')">⭐ Zu lernen</button>
                <button class="filter-btn" onclick="setFilter('learned')">✅ Gelernt</button>
            </div>

            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Vokabel suchen..." oninput="filterVocab()">
            </div>
        </div>

        <div class="stats">
            <span class="stat-item">Gesamt: <span id="totalCount">0</span></span>
            <span class="stat-item">Gelernt: <span id="learnedCount">0</span></span>
            <span class="stat-item">Zu lernen: <span id="unlearnedCount">0</span></span>
        </div>

        <div class="content-area" id="contentArea">
            <!-- Content will be dynamically inserted here -->
        </div>
    </div>

    <script>
        // Vocabulary data from Lissy & Oliver
        const vocabData = [
            // Familie
            {word: "die Mama", type: "Nomen", plural: "die Mamas", en: "mom", hu: "anya", emoji: "👩"},
            {word: "der Papa", type: "Nomen", plural: "die Papas", en: "dad", hu: "apa", emoji: "👨"},
            {word: "die Oma", type: "Nomen", plural: "die Omas", en: "grandma", hu: "nagymama", emoji: "👵"},
            {word: "der Opa", type: "Nomen", plural: "die Opas", en: "grandpa", hu: "nagypapa", emoji: "👴"},
            {word: "die Schwester", type: "Nomen", plural: "die Schwestern", en: "sister", hu: "nővér", emoji: "👧"},
            {word: "der Bruder", type: "Nomen", plural: "die Brüder", en: "brother", hu: "fiútestvér", emoji: "👦"},
            {word: "das Baby", type: "Nomen", plural: "die Babys", en: "baby", hu: "baba", emoji: "👶"},

            // Tiere
            {word: "der Hund", type: "Nomen", plural: "die Hunde", en: "dog", hu: "kutya", emoji: "🐕"},
            {word: "die Katze", type: "Nomen", plural: "die Katzen", en: "cat", hu: "macska", emoji: "🐈"},
            {word: "der Vogel", type: "Nomen", plural: "die Vögel", en: "bird", hu: "madár", emoji: "🐦"},

            {word: "die Zunge", type: "Nomen", plural: "die Zungen", en: "tongue", hu: "nyelv", emoji: "👅"},
            {word: "die Lippe", type: "Nomen", plural: "die Lippen", en: "lip", hu: "ajak", emoji: "💋"},
        ];

        // State management
        let currentMode = 'flashcard';
        let currentLanguage = 'en';
        let currentFilter = 'all';
        let currentIndex = 0;
        let learnedWords = JSON.parse(localStorage.getItem('kinderLearnedWords') || '{}');
        let quizScore = {correct: 0, total: 0};
        let filteredVocab = [];
        let isFlipped = false;
        let isReversed = JSON.parse(localStorage.getItem('kinderIsReversed') || 'false');
        
        // Hangman state
        let hangmanWord = '';
        let hangmanTranslation = '';
        let hangmanGuessed = [];
        let hangmanWrongGuesses = 0;
        let hangmanMaxWrong = 6;
        
        // Memory state
        let memoryPairs = 10;
        let memoryCards = [];
        let memoryFlipped = [];
        let memoryMatched = [];
        let memoryMoves = 0;
        let memoryStartTime = null;
        
        // Puzzle state
        let puzzleWord = '';
        let puzzleTranslation = '';
        let puzzleScrambled = '';
        
        // Fill blanks state
        let fillBlanksStory = null;

        // Initialize app
        function init() {
            filterVocab();
            updateStats();
            updateDirectionButton();
            renderContent();
        }

        // Mode switching
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentIndex = 0;
            isFlipped = false;
            if (mode === 'quiz') {
                quizScore = {correct: 0, total: 0};
            }
            renderContent();
        }

        // Language switching
        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateDirectionButton();
            renderContent();
        }

        // Toggle learning direction
        function toggleDirection() {
            isReversed = !isReversed;
            localStorage.setItem('kinderIsReversed', JSON.stringify(isReversed));
            updateDirectionButton();
            // Render neu für Flashcards UND Quiz
            if (currentMode === 'flashcard' || currentMode === 'quiz') {
                isFlipped = false;
                renderContent();
            }
        }

        // Update direction button display
        function updateDirectionButton() {
            const btn = document.getElementById('directionBtn');
            if (!btn) return;
            
            const langFlag = currentLanguage === 'en' ? '🇬🇧' : '🇭🇺';
            
            if (isReversed) {
                btn.textContent = `${langFlag} → 🇩🇪`;
                btn.classList.add('active');
            } else {
                btn.textContent = `🇩🇪 → ${langFlag}`;
                btn.classList.remove('active');
            }
        }

        // Filter switching
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentIndex = 0;
            filterVocab();
            updateStats();
            renderContent();
        }

        // Filter vocabulary
        function filterVocab() {
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            
            filteredVocab = vocabData.filter(item => {
                // Search filter
                if (searchTerm && !item.word.toLowerCase().includes(searchTerm) && 
                    !item[currentLanguage].toLowerCase().includes(searchTerm)) {
                    return false;
                }
                
                // Type filter
                if (currentFilter !== 'all' && currentFilter !== 'learned' && currentFilter !== 'unlearned') {
                    if (item.type !== currentFilter) return false;
                }
                
                // Learned/unlearned filter
                if (currentFilter === 'learned' && !learnedWords[item.word]) return false;
                if (currentFilter === 'unlearned' && learnedWords[item.word]) return false;
                
                return true;
            });
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalCount').textContent = vocabData.length;
            document.getElementById('learnedCount').textContent = Object.keys(learnedWords).length;
            document.getElementById('unlearnedCount').textContent = vocabData.length - Object.keys(learnedWords).length;
        }

        // Mark word as learned/unlearned
        function toggleLearned(word, learned) {
            if (learned) {
                learnedWords[word] = true;
            } else {
                delete learnedWords[word];
            }
            localStorage.setItem('kinderLearnedWords', JSON.stringify(learnedWords));
            updateStats();
            if (currentFilter === 'learned' || currentFilter === 'unlearned') {
                filterVocab();
            }
            renderContent();
        }

        // Render content based on current mode
        function renderContent() {
            const contentArea = document.getElementById('contentArea');
            
            if (filteredVocab.length === 0) {
                contentArea.innerHTML = '<p style="text-align: center; color: #1e3c72; font-size: 1.2em; padding: 50px;">Keine Vokabeln gefunden 😔</p>';
                return;
            }
            
            switch(currentMode) {
                case 'flashcard':
                    renderFlashcard(contentArea);
                    break;
                case 'list':
                    renderList(contentArea);
                    break;
                case 'quiz':
                    renderQuiz(contentArea);
                    break;
                case 'hangman':
                    renderHangman(contentArea);
                    break;
                case 'memory':
                    renderMemory(contentArea);
                    break;
                case 'puzzle':
                    renderPuzzle(contentArea);
                    break;
                case 'fillblanks':
                    renderFillBlanks(contentArea);
                    break;
            }
        }

        // Render flashcard mode
        function renderFlashcard(container) {
            if (currentIndex >= filteredVocab.length) currentIndex = 0;
            const item = filteredVocab[currentIndex];
            
            // Determine which side is showing
            const frontSide = isReversed ? currentLanguage : 'de';  // HU/EN or DE
            const backSide = isReversed ? 'de' : currentLanguage;   // DE or HU/EN
            
            // Get the word for current side
            const currentWord = isFlipped ? 
                (backSide === 'de' ? item.word : item[backSide]) :
                (frontSide === 'de' ? item.word : item[frontSide]);
            
            // Get details ONLY for the current language side
            let currentDetails = '';
            if (!isFlipped) {
                // Front side - show details only for the language being displayed
                if (frontSide === 'de' && item.type === 'Nomen' && item.plural) {
                    currentDetails = `Plural: ${item.plural}`;
                } else if (frontSide === 'de' && item.type === 'Verb' && item.preterite) {
                    currentDetails = `Präteritum: ${item.preterite}<br>Perfekt: ${item.perfect}`;
                }
                // Foreign language side shows NO German details!
            } else {
                // Back side - show translation details only
                if (backSide === 'de' && item.type === 'Nomen' && item.plural) {
                    currentDetails = `Plural: ${item.plural}`;
                } else if (backSide === 'de' && item.type === 'Verb' && item.preterite) {
                    currentDetails = `Präteritum: ${item.preterite}<br>Perfekt: ${item.perfect}`;
                }
            }
            
            container.innerHTML = `
                <div class="flashcard" onclick="flipCard()">
                    ${item.emoji ? `<div class="flashcard-emoji">${item.emoji}</div>` : ''}
                    <div class="flashcard-word">${currentWord}</div>
                    ${!isFlipped && currentDetails ? `
                        <div class="flashcard-details">
                            <span class="vocab-type">${item.type}</span><br>
                            ${currentDetails}
                        </div>
                    ` : isFlipped ? `
                        <div class="flashcard-translation">${currentWord}</div>
                        ${currentDetails ? `<div class="flashcard-details">${currentDetails}</div>` : ''}
                    ` : ''}
                    <p style="margin-top: 20px; color: #999; font-size: 0.9em;">Klicken zum Umdrehen</p>
                </div>
                <div class="flashcard-controls">
                    <button class="flashcard-btn" onclick="previousCard()">◀ Zurück</button>
                    <button class="flashcard-btn unknown" onclick="markUnknown()">❌ Nicht gewusst</button>
                    <button class="flashcard-btn known" onclick="markKnown()">✅ Gewusst</button>
                    <button class="flashcard-btn" onclick="nextCard()">Weiter ▶</button>
                </div>
                <p style="text-align: center; margin-top: 20px; color: #1e3c72; font-weight: bold;">
                    Karte ${currentIndex + 1} von ${filteredVocab.length}
                </p>
            `;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            renderContent();
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % filteredVocab.length;
            isFlipped = false;
            renderContent();
        }

        function previousCard() {
            currentIndex = currentIndex === 0 ? filteredVocab.length - 1 : currentIndex - 1;
            isFlipped = false;
            renderContent();
        }

        function markKnown() {
            toggleLearned(filteredVocab[currentIndex].word, true);
            nextCard();
        }

        function markUnknown() {
            toggleLearned(filteredVocab[currentIndex].word, false);
            nextCard();
        }

        // Render list mode
        function renderList(container) {
            let html = '<div class="vocab-list">';
            
            filteredVocab.forEach(item => {
                const isLearned = learnedWords[item.word];
                html += `
                    <div class="vocab-item ${isLearned ? 'learned' : ''}">
                        <div class="vocab-german">
                            ${item.emoji ? `<span class="vocab-emoji">${item.emoji}</span>` : ''}
                            ${item.word}
                            <span class="vocab-type">${item.type}</span>
                        </div>
                        <div class="vocab-details">${getDetails(item)}</div>
                        <div class="vocab-translation">
                            ${getTranslationLabel()}: ${item[currentLanguage]}
                        </div>
                        <div class="vocab-actions">
                            ${!isLearned ? 
                                `<button class="action-btn mark-learned" onclick='toggleLearned("${item.word}", true)'>✅ Als gelernt markieren</button>` :
                                `<button class="action-btn mark-unlearned" onclick='toggleLearned("${item.word}", false)'>❌ Als ungelernt markieren</button>`
                            }
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Render quiz mode
        function renderQuiz(container) {
            if (currentIndex >= filteredVocab.length) {
                container.innerHTML = `
                    <div class="quiz-container">
                        <div class="quiz-score">
                            🎉 Quiz abgeschlossen! 🎉<br><br>
                            Ergebnis: ${quizScore.correct} von ${quizScore.total} richtig<br>
                            (${Math.round(quizScore.correct / quizScore.total * 100)}%)
                        </div>
                        <button class="flashcard-btn" onclick="restartQuiz()" style="display: block; margin: 20px auto;">Quiz neu starten</button>
                    </div>
                `;
                return;
            }

            const item = filteredVocab[currentIndex];
            const options = generateQuizOptions(item);
            
            // Bestimme Frage und Antwort basierend auf isReversed
            const questionWord = isReversed ? item[currentLanguage] : item.word;
            const correctAnswer = isReversed ? item.word : item[currentLanguage];
            const questionLang = isReversed ? getLanguageName() : 'Deutsch';
            const answerLang = isReversed ? 'Deutsch' : getLanguageName();
            
            container.innerHTML = `
                <div class="quiz-container">
                    <div class="quiz-score">Frage ${currentIndex + 1} von ${filteredVocab.length} | Richtig: ${quizScore.correct}/${quizScore.total}</div>
                    <div class="quiz-question">
                        ${item.emoji ? `<div style="font-size: 3em; text-align: center; margin-bottom: 15px;">${item.emoji}</div>` : ''}
                        <div class="quiz-word">${questionWord}</div>
                        <p style="text-align: center; color: #666; margin-bottom: 20px;">Was bedeutet das auf ${answerLang}?</p>
                        <div class="quiz-options" id="quizOptions">
                            ${options.map((opt, idx) => `
                                <div class="quiz-option" onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${correctAnswer.replace(/'/g, "\\'")}', ${idx})">${opt}</div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function generateQuizOptions(correctItem) {
            // Bestimme die richtige Antwort basierend auf isReversed
            const correctAnswer = isReversed ? correctItem.word : correctItem[currentLanguage];
            const options = [correctAnswer];
            const sameType = vocabData.filter(v => v.type === correctItem.type && v.word !== correctItem.word);
            
            while (options.length < 4 && sameType.length > 0) {
                const randomIndex = Math.floor(Math.random() * sameType.length);
                const randomOption = isReversed ? sameType[randomIndex].word : sameType[randomIndex][currentLanguage];
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
                sameType.splice(randomIndex, 1);
            }
            
            // If not enough same-type words, add from other types
            while (options.length < 4) {
                const randomItem = vocabData[Math.floor(Math.random() * vocabData.length)];
                const randomOption = isReversed ? randomItem.word : randomItem[currentLanguage];
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }
            
            // Shuffle options
            return options.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selected, correct, optionIndex) {
            console.log('checkAnswer called:', {selected, correct, optionIndex});
            console.log('Are they equal?', selected === correct);
            
            const options = document.querySelectorAll('.quiz-option');
            console.log('Found options:', options.length);
            console.log('Option at index:', options[optionIndex]);
            
            // Entferne vorherige falsche Markierungen
            options.forEach(opt => {
                if (opt.classList.contains('incorrect')) {
                    opt.classList.remove('incorrect');
                }
            });
            
            if (selected === correct) {
                // RICHTIGE ANTWORT
                console.log('CORRECT ANSWER! Adding green class');
                playCorrectSound();
                quizScore.correct++;
                quizScore.total++;
                
                const targetOption = options[optionIndex];
                console.log('Target option before:', targetOption.className);
                targetOption.classList.add('correct');
                console.log('Target option after:', targetOption.className);
                
                toggleLearned(filteredVocab[currentIndex].word, true);
                
                // Disable all options
                options.forEach(opt => opt.style.pointerEvents = 'none');
                
                // Kurze Siegesfeier, dann zum nächsten Wort
                setTimeout(() => {
                    currentIndex++;
                    renderContent();
                }, 800);
            } else {
                // FALSCHE ANTWORT
                console.log('WRONG ANSWER! Adding red class');
                playIncorrectSound();
                options[optionIndex].classList.add('incorrect');
                console.log('After adding incorrect:', options[optionIndex].className);
                // Nicht weiterspringen - Schüler muss richtige Antwort finden
            }
        }

        function restartQuiz() {
            currentIndex = 0;
            quizScore = {correct: 0, total: 0};
            filterVocab();
            renderContent();
        }

        // Helper functions
        function getDetails(item) {
            switch(item.type) {
                case 'Nomen':
                    return item.plural ? `Plural: ${item.plural}` : '';
                case 'Verb':
                    return item.preterite && item.perfect ? `Präteritum: ${item.preterite}<br>Perfekt: ${item.perfect}` : '';
                default:
                    return '';
            }
        }

        function getTranslationLabel() {
            switch(currentLanguage) {
                case 'en': return '🇬🇧 English';
                case 'hu': return '🇭🇺 Magyar';
                default: return '';
            }
        }

        function getLanguageName() {
            switch(currentLanguage) {
                case 'en': return 'Englisch';
                case 'hu': return 'Ungarisch';
                default: return '';
            }
        }

        // ============================================
        // HANGMAN / BLUMEN-SPIEL
        // ============================================
        function renderHangman(container) {
            if (!hangmanWord) {
                initHangman();
            }
            
            const displayWord = hangmanWord.split('').map(letter => 
                letter === ' ' ? ' ' : (hangmanGuessed.includes(letter.toLowerCase()) ? letter : '_')
            ).join(' ');
            
            const won = !displayWord.includes('_');
            const lost = hangmanWrongGuesses >= hangmanMaxWrong;
            
            container.innerHTML = `
                <div class="hangman-container">
                    <h2 style="color: #1e3c72; margin-bottom: 20px;">🌻 Blumen-Spiel 🌻</h2>
                    <p style="color: #FF8C00; font-size: 1.2em; margin-bottom: 10px;">Übersetzung: ${hangmanTranslation}</p>
                    
                    <div class="flower-drawing">${getFlowerStages()[hangmanWrongGuesses]}</div>
                    
                    <div class="word-display">${displayWord}</div>
                    
                    ${won ? `
                        <div style="font-size: 2em; color: #4CAF50; margin: 20px 0;">
                            🎉 Gewonnen! 🎉
                        </div>
                        <button class="flashcard-btn" onclick="initHangman(); renderContent();">Neues Wort</button>
                    ` : lost ? `
                        <div style="font-size: 2em; color: #f44336; margin: 20px 0;">
                            Das Wort war: ${hangmanWord}
                        </div>
                        <button class="flashcard-btn" onclick="initHangman(); renderContent();">Neues Wort</button>
                    ` : `
                        <div class="keyboard">
                            ${generateKeyboard()}
                        </div>
                        <p style="margin-top: 20px; color: #1e3c72; font-weight: bold;">
                            Falsche Versuche: ${hangmanWrongGuesses} / ${hangmanMaxWrong}
                        </p>
                    `}
                </div>
            `;
        }

        function initHangman() {
            const item = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];
            hangmanWord = item.word;
            hangmanTranslation = item[currentLanguage];
            hangmanGuessed = [];
            hangmanWrongGuesses = 0;
        }

        function generateKeyboard() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'.split('');
            return letters.map(letter => {
                const used = hangmanGuessed.includes(letter.toLowerCase());
                return `<div class="key ${used ? 'used' : ''}" onclick="${used ? '' : `guessLetter('${letter.toLowerCase()}')`}">${letter}</div>`;
            }).join('');
        }

        function guessLetter(letter) {
            if (hangmanGuessed.includes(letter)) return;
            
            hangmanGuessed.push(letter);
            
            if (!hangmanWord.toLowerCase().includes(letter)) {
                hangmanWrongGuesses++;
            }
            
            renderContent();
            
            const displayWord = hangmanWord.split('').map(l => 
                l === ' ' ? ' ' : (hangmanGuessed.includes(l.toLowerCase()) ? l : '_')
            ).join('');
            
            if (!displayWord.includes('_')) {
                toggleLearned(hangmanWord, true);
            }
        }

        function getFlowerStages() {
            return [
                '🌱',
                '🌱🌿',
                '🌿🍃',
                '🌿🍃🌿',
                '🌺',
                '🌻',
                '🌻🌻'
            ];
        }

        // ============================================
        // MEMORY GAME
        // ============================================
        function renderMemory(container) {
            if (memoryCards.length === 0) {
                container.innerHTML = `
                    <div class="memory-container">
                        <h2 style="color: #1e3c72; margin-bottom: 20px;">🎴 Memory Spiel 🎴</h2>
                        <p style="color: #FF8C00; font-size: 1.1em; margin-bottom: 20px;">
                            Finde die passenden Paare!
                        </p>
                        <div class="memory-settings">
                            <button class="pair-btn active" onclick="startMemory(5)">5 Paare</button>
                            <button class="pair-btn" onclick="startMemory(10)">10 Paare</button>
                            <button class="pair-btn" onclick="startMemory(20)">20 Paare</button>
                        </div>
                    </div>
                `;
                return;
            }
            
            const gridClass = memoryPairs === 5 ? 'pairs-5' : memoryPairs === 10 ? 'pairs-10' : 'pairs-20';
            
            let html = `
                <div class="memory-container">
                    <h2 style="color: #1e3c72; margin-bottom: 10px;">🎴 Memory Spiel 🎴</h2>
                    <div class="memory-stats">
                        <div>⏱️ Zeit: <span id="memoryTime">00:00</span></div>
                        <div>🔄 Züge: ${memoryMoves}</div>
                        <div>✅ Gefunden: ${memoryMatched.length / 2} / ${memoryPairs}</div>
                    </div>
                    <div class="memory-grid ${gridClass}">
            `;
            
            memoryCards.forEach((card, index) => {
                const isFlipped = memoryFlipped.includes(index);
                const isMatched = memoryMatched.includes(index);
                
                html += `
                    <div class="memory-card ${isFlipped ? 'flipped' : ''} ${isMatched ? 'matched' : ''}" 
                         onclick="flipMemoryCard(${index})">
                        ${isFlipped || isMatched ? card.text : '?'}
                    </div>
                `;
            });
            
            html += '</div>';
            
            if (memoryMatched.length === memoryCards.length) {
                const timeElapsed = Math.floor((Date.now() - memoryStartTime) / 1000);
                const minutes = Math.floor(timeElapsed / 60);
                const seconds = timeElapsed % 60;
                html += `
                    <div style="font-size: 2em; color: #4CAF50; margin: 20px 0; text-align: center;">
                        🎉 Geschafft! 🎉<br>
                        Zeit: ${minutes}:${seconds.toString().padStart(2, '0')}<br>
                        Züge: ${memoryMoves}
                    </div>
                    <button class="flashcard-btn" onclick="memoryCards = []; renderContent();" style="display: block; margin: 20px auto;">
                        Neues Spiel
                    </button>
                `;
            }
            
            html += '</div>';
            container.innerHTML = html;
            
            if (memoryStartTime && memoryMatched.length < memoryCards.length) {
                updateMemoryTimer();
            }
        }

        function startMemory(pairs) {
            memoryPairs = pairs;
            memoryCards = [];
            memoryFlipped = [];
            memoryMatched = [];
            memoryMoves = 0;
            memoryStartTime = Date.now();
            
            const selected = shuffleArray([...filteredVocab]).slice(0, pairs);
            
            selected.forEach(item => {
                memoryCards.push({text: item.word, pair: item[currentLanguage]});
                memoryCards.push({text: item[currentLanguage], pair: item.word});
            });
            
            memoryCards = shuffleArray(memoryCards);
            renderContent();
        }

        function flipMemoryCard(index) {
            if (memoryFlipped.length === 2 || memoryMatched.includes(index) || memoryFlipped.includes(index)) {
                return;
            }
            
            memoryFlipped.push(index);
            renderContent();
            
            if (memoryFlipped.length === 2) {
                memoryMoves++;
                const [first, second] = memoryFlipped;
                const firstCard = memoryCards[first];
                const secondCard = memoryCards[second];
                
                if (firstCard.pair === secondCard.text || firstCard.text === secondCard.pair) {
                    memoryMatched.push(first, second);
                    memoryFlipped = [];
                    renderContent();
                } else {
                    setTimeout(() => {
                        memoryFlipped = [];
                        renderContent();
                    }, 1000);
                }
            }
        }

        function updateMemoryTimer() {
            const timeElapsed = Math.floor((Date.now() - memoryStartTime) / 1000);
            const minutes = Math.floor(timeElapsed / 60);
            const seconds = timeElapsed % 60;
            const timeElem = document.getElementById('memoryTime');
            if (timeElem) {
                timeElem.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                if (memoryMatched.length < memoryCards.length) {
                    setTimeout(updateMemoryTimer, 1000);
                }
            }
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // ============================================
        // AUDIO FEEDBACK
        // ============================================
        function playCorrectSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 523.25; // C5
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
            
            // Zweiter Ton für positiven Akkord
            setTimeout(() => {
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                osc2.frequency.value = 659.25; // E5
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.2, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 0.2);
            }, 100);
        }

        function playIncorrectSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 200; // Tiefer Ton
            oscillator.type = 'sawtooth';
            
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }

        // ============================================
        // WORD PUZZLE (Buchstabensalat)
        // ============================================
        function renderPuzzle(container) {
            if (!puzzleWord) {
                initPuzzle();
            }
            
            container.innerHTML = `
                <div class="puzzle-container">
                    <h2 style="color: #1e3c72; margin-bottom: 20px;">🧩 Worträtsel 🧩</h2>
                    <p style="color: #FF8C00; font-size: 1.2em; margin-bottom: 10px;">
                        Übersetzung: ${puzzleTranslation}
                    </p>
                    <p style="color: #666; margin-bottom: 20px;">Sortiere die Buchstaben!</p>
                    
                    <div class="scrambled-word">${puzzleScrambled}</div>
                    
                    <input type="text" class="puzzle-input" id="puzzleInput" placeholder="Deine Antwort...">
                    
                    <div style="margin-top: 30px;">
                        <button class="flashcard-btn" onclick="checkPuzzle()" style="margin-right: 10px;">✅ Prüfen</button>
                        <button class="flashcard-btn" onclick="initPuzzle(); renderContent();">🔄 Neues Wort</button>
                    </div>
                    
                    <div id="puzzleResult" style="margin-top: 20px; font-size: 1.3em; font-weight: bold;"></div>
                </div>
            `;
            
            document.getElementById('puzzleInput').focus();
            document.getElementById('puzzleInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkPuzzle();
            });
        }

        function initPuzzle() {
            const item = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];
            puzzleWord = item.word;
            puzzleTranslation = item[currentLanguage];
            
            let wordToScramble = puzzleWord.replace(/^(der|die|das|ein|eine) /, '');
            puzzleScrambled = shuffleArray(wordToScramble.split('')).join(' ');
        }

        function checkPuzzle() {
            const input = document.getElementById('puzzleInput').value.trim();
            const result = document.getElementById('puzzleResult');
            
            const correctWithoutArticle = puzzleWord.replace(/^(der|die|das|ein|eine) /, '').toLowerCase();
            const inputLower = input.toLowerCase();
            
            if (inputLower === puzzleWord.toLowerCase() || inputLower === correctWithoutArticle) {
                result.innerHTML = '🎉 Richtig! Super gemacht! 🎉';
                result.style.color = '#4CAF50';
                toggleLearned(puzzleWord, true);
                setTimeout(() => {
                    initPuzzle();
                    renderContent();
                }, 2000);
            } else {
                result.innerHTML = '❌ Nicht ganz... Versuch es nochmal!';
                result.style.color = '#f44336';
            }
        }

        // ============================================
        // FILL IN THE BLANKS (Lückentext)
        // ============================================
        function renderFillBlanks(container) {
            if (!fillBlanksStory) {
                initFillBlanks();
            }
            
            container.innerHTML = `
                <div class="fillblanks-container">
                    <h2 style="color: #1e3c72; margin-bottom: 20px;">📝 Lückentext 📝</h2>
                    <p style="color: #666; margin-bottom: 20px;">Fülle die Lücken mit den richtigen Wörtern!</p>
                    
                    <div class="story-text" id="storyText"></div>
                    
                    <div style="margin-top: 30px; text-align: center;">
                        <button class="flashcard-btn" onclick="checkFillBlanks()">✅ Prüfen</button>
                        <button class="flashcard-btn" onclick="initFillBlanks(); renderContent();">🔄 Neue Geschichte</button>
                    </div>
                    
                    <div id="fillBlanksResult" style="margin-top: 20px; font-size: 1.3em; font-weight: bold; text-align: center;"></div>
                </div>
            `;
            
            displayFillBlanksStory();
        }

        function initFillBlanks() {
            const stories = [
                {
                    text: "Heute ist ein schöner [TAG]. Die [SONNE] scheint hell am Himmel. Ein kleiner [VOGEL] singt ein fröhliches Lied. Der [HUND] spielt im Garten.",
                    blanks: ["Tag", "Sonne", "Vogel", "Hund"]
                },
                {
                    text: "In der [SCHULE] lernen die Kinder viele neue Dinge. Sie [LESEN] ein spannendes [BUCH]. Dann [SCHREIBEN] sie in ihre Hefte.",
                    blanks: ["Schule", "lesen", "Buch", "schreiben"]
                },
                {
                    text: "Die [KATZE] sitzt auf dem [STUHL]. Sie ist sehr [MÜDE]. Draußen ist es [KALT] und es fällt [SCHNEE].",
                    blanks: ["Katze", "Stuhl", "müde", "kalt", "Schnee"]
                },
                {
                    text: "Wir gehen in den [WALD]. Dort sehen wir viele [BÄUME] und schöne [BLUMEN]. Das [GRAS] ist [GRÜN] und weich.",
                    blanks: ["Wald", "Bäume", "Blumen", "Gras", "grün"]
                },
                {
                    text: "Zum Frühstück esse ich [BROT] mit [KÄSE]. Ich trinke [MILCH] dazu. Dann esse ich einen [APFEL]. Das schmeckt sehr [GUT]!",
                    blanks: ["Brot", "Käse", "Milch", "Apfel", "gut"]
                }
            ];
            
            fillBlanksStory = stories[Math.floor(Math.random() * stories.length)];
        }

        function displayFillBlanksStory() {
            const storyElem = document.getElementById('storyText');
            if (!storyElem) return;
            
            let storyHTML = fillBlanksStory.text;
            fillBlanksStory.blanks.forEach((blank, index) => {
                storyHTML = storyHTML.replace(`[${blank.toUpperCase()}]`, 
                    `<input type="text" class="blank-input" id="blank${index}" data-answer="${blank.toLowerCase()}">`
                );
            });
            
            storyElem.innerHTML = storyHTML;
        }

        function checkFillBlanks() {
            let allCorrect = true;
            let correctCount = 0;
            
            fillBlanksStory.blanks.forEach((blank, index) => {
                const input = document.getElementById(`blank${index}`);
                const userAnswer = input.value.toLowerCase().trim();
                
                // Entferne Artikel für den Vergleich
                const userAnswerClean = userAnswer.replace(/^(der|die|das|ein|eine) /, '');
                
                // Prüfe ob das eingegebene Wort IRGENDEIN Wort aus dem Vokabular ist
                const isValidWord = vocabData.some(vocab => {
                    const vocabWord = vocab.word.toLowerCase().replace(/^(der|die|das|ein|eine) /, '');
                    return vocabWord === userAnswerClean;
                });
                
                if (isValidWord && userAnswerClean.length > 0) {
                    input.classList.remove('incorrect');
                    input.classList.add('correct');
                    correctCount++;
                } else if (userAnswerClean.length === 0) {
                    // Leere Felder sind noch nicht ausgefüllt
                    input.classList.remove('correct');
                    input.classList.remove('incorrect');
                    allCorrect = false;
                } else {
                    input.classList.remove('correct');
                    input.classList.add('incorrect');
                    allCorrect = false;
                }
            });
            
            const result = document.getElementById('fillBlanksResult');
            if (allCorrect && correctCount === fillBlanksStory.blanks.length) {
                result.innerHTML = '🎉 Perfekt! Alle Lücken richtig gefüllt! 🎉';
                result.style.color = '#4CAF50';
                setTimeout(() => {
                    initFillBlanks();
                    renderContent();
                }, 3000);
            } else if (correctCount > 0) {
                result.innerHTML = `✅ ${correctCount} von ${fillBlanksStory.blanks.length} Wörtern sind richtig geschrieben!`;
                result.style.color = '#FF8C00';
            } else {
                result.innerHTML = '💡 Tipp: Schreibe deutsche Wörter, die du kennst!';
                result.style.color = '#1e3c72';
            }
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
