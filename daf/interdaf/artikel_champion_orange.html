<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel & Fälle Champion 🍊</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3d2506;
            --primary-light: #5a3708;
            --accent: #ff8c00;
            --accent-glow: #ffa740;
            --indefinite: #ff6b35;
            --indefinite-glow: #ff8c5a;
            --success: #75c743;
            --error: #e85d75;
            --warning: #ff9f1c;
            --bg-dark: #1a0f02;
            --bg-card: #2d1805;
            --text: #fff5e6;
            --text-muted: #d4a574;
            --gold: #ffd700;
            --possessive: #8a4a1a;
            --possessive-glow: #d4853f;
            --relative: #7a3f1a;
            --relative-glow: #c47543;
            --comma: #b85a2a;
            --comma-glow: #e8854d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(160deg, #1a0f02 0%, #2d1805 40%, #221508 70%, #1a0f02 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        /* Orange segments background */
        .ripples { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 140, 0, 0.12);
            animation: rippleOut 8s ease-out infinite;
        }
        @keyframes rippleOut {
            0% { transform: scale(0.2); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        .shimmer {
            position: absolute;
            width: 200px; height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,140,0,0.3), transparent);
            animation: shimmerFlow 6s ease-in-out infinite;
        }
        @keyframes shimmerFlow {
            0% { transform: translateX(-200px) translateY(0) rotate(-10deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(110vw) translateY(30px) rotate(-10deg); opacity: 0; }
        }
        .hexagon {
            position: absolute;
            width: 60px; height: 60px;
            background: radial-gradient(circle at 30% 30%, rgba(255,140,0,0.06), rgba(255,107,53,0.02));
            border-radius: 0 100% 100% 0;
            animation: floatHex 12s ease-in-out infinite;
        }
        @keyframes floatHex {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-25px) rotate(15deg); opacity: 0.5; }
        }

        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; padding-top: 10px; }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ff8c00, #ffa740, #ff8c00);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 4s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes shimmerText { to { background-position: 200% center; } }
        .subtitle { color: var(--text-muted); font-size: 1.05rem; }

        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .menu-card {
            background: linear-gradient(135deg, rgba(61,51,16,0.95) 0%, rgba(45,34,8,0.95) 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,200,64,0.25);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .mode-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; margin-bottom: 20px; color: var(--accent-glow); }
        .mode-buttons { display: flex; flex-direction: column; gap: 12px; }
        .mode-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 1px solid rgba(255,200,64,0.3);
            border-radius: 15px;
            padding: 18px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
        }
        .mode-btn:hover {
            transform: translateX(8px);
            box-shadow: 0 4px 20px rgba(232,168,9,0.35);
            border-color: var(--accent-glow);
            background: linear-gradient(135deg, var(--primary-light) 0%, #6b5410 100%);
        }
        .mode-btn .mode-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
        .mode-btn .mode-desc { font-size: 0.83rem; color: var(--text-muted); margin-top: 4px; font-weight: 400; }
        .mode-badge { display: inline-block; background: linear-gradient(135deg, #9e6e1a, #e8a809); color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; margin-left: 8px; }
        .mode-badge.new-badge { background: linear-gradient(135deg, #5a7a1a, #75c743); }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
        .stats-bar { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-item { background: var(--bg-card); padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(255,200,64,0.2); text-align: center; min-width: 90px; }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--accent-glow); }
        .streak-fire { display: inline-block; animation: flame 0.5s ease infinite alternate; }
        @keyframes flame { from { transform: scale(1); } to { transform: scale(1.2); } }

        .progress-bar { background: rgba(61,51,16,0.8); border-radius: 10px; height: 18px; overflow: hidden; margin-bottom: 25px; border: 1px solid rgba(255,200,64,0.2); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-glow)); transition: width 0.5s ease; box-shadow: 0 0 8px rgba(255,200,64,0.5); }
        .progress-text { text-align: center; margin-top: 6px; color: var(--text-muted); font-size: 0.88rem; }

        .mode-indicator { background: linear-gradient(135deg, var(--accent), var(--accent-glow)); color: #2d2208; padding: 8px 20px; border-radius: 20px; font-weight: 700; font-size: 0.88rem; }
        .mode-indicator.preposition { background: linear-gradient(135deg, #806d40, #e8a809); }
        .mode-indicator.definite { background: linear-gradient(135deg, #9e7e1a, #ffc840); }
        .mode-indicator.indefinite { background: linear-gradient(135deg, #7a4f00, var(--indefinite)); }
        .mode-indicator.negation { background: linear-gradient(135deg, #8a1a20, var(--error)); }
        .mode-indicator.possessive { background: linear-gradient(135deg, #5a4210, #d4a843); }
        .mode-indicator.relative { background: linear-gradient(135deg, #4a3a10, #b89543); }
        .mode-indicator.comma { background: linear-gradient(135deg, #6b4a1a, var(--comma-glow)); }

        .sentence-box {
            background: linear-gradient(135deg, rgba(61,51,16,0.95), rgba(37,30,8,0.98));
            border-radius: 20px;
            padding: 38px 30px;
            margin-bottom: 28px;
            border: 1px solid rgba(255,200,64,0.25);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 60px rgba(232,168,9,0.07);
            text-align: center;
        }
        .sentence { font-family: 'Fredoka', sans-serif; font-size: 1.75rem; line-height: 2.6; margin-bottom: 10px; }
        .word { display: inline-block; margin: 0 4px; }
        .article-slot {
            display: inline-block;
            min-width: 90px;
            padding: 7px 14px;
            background: rgba(58,47,10,0.9);
            border: 2px solid rgba(255,200,64,0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            color: var(--text-muted);
        }
        .article-slot:hover { border-color: var(--accent-glow); transform: scale(1.05); }
        .article-slot.selected { background: rgba(232,168,9,0.2); border-color: var(--accent-glow); color: var(--accent-glow); }
        .article-slot.correct {
            background: linear-gradient(135deg, rgba(117,199,67,0.3), rgba(117,199,67,0.1));
            border-color: var(--success); color: var(--success);
            animation: pulseSuccess 0.6s ease;
        }
        .article-slot.wrong {
            background: linear-gradient(135deg, rgba(232,93,117,0.3), rgba(232,93,117,0.1));
            border-color: var(--error); color: var(--error);
            animation: shake 0.5s ease;
        }
        @keyframes pulseSuccess { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .hint-box {
            display: none;
            background: rgba(232,168,9,0.15);
            border: 1px solid rgba(255,200,64,0.3);
            border-radius: 12px;
            padding: 14px 20px;
            margin-top: 18px;
            color: var(--text);
            font-size: 0.95rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid rgba(255,200,64,0.25);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(232,168,9,0.3);
            border-color: var(--accent-glow);
            background: linear-gradient(135deg, var(--primary-light) 0%, #6b5410 100%);
        }
        .option-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .control-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .control-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid rgba(255,200,64,0.3);
            border-radius: 12px;
            padding: 12px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(232,168,9,0.3);
            border-color: var(--accent-glow);
        }
        .control-btn.primary {
            background: linear-gradient(135deg, #9e6e1a 0%, var(--accent) 100%);
            border-color: var(--accent-glow);
            color: #1f1a06;
            font-weight: 700;
        }
        .control-btn.primary:hover {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-glow) 100%);
            box-shadow: 0 6px 25px rgba(232,168,9,0.5);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: none;
            background: linear-gradient(135deg, rgba(61,51,16,0.95) 0%, rgba(45,34,8,0.95) 100%);
            border: 1px solid rgba(255,200,64,0.3);
            border-radius: 12px;
            padding: 10px 18px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: linear-gradient(135deg, var(--primary-light) 0%, #6b5410 100%);
            box-shadow: 0 4px 15px rgba(232,168,9,0.3);
        }

        .result-card {
            background: linear-gradient(135deg, rgba(61,51,16,0.95) 0%, rgba(45,34,8,0.95) 100%);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,200,64,0.25);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            text-align: center;
        }
        .result-title { font-family: 'Fredoka', sans-serif; font-size: 2rem; margin-bottom: 25px; color: var(--accent-glow); }
        .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px; margin-bottom: 28px; }
        .result-stat { background: rgba(58,47,10,0.6); padding: 18px; border-radius: 14px; border: 1px solid rgba(255,200,64,0.2); }
        .result-stat-label { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .result-stat-value { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--accent-glow); }
        .player-name-input {
            width: 100%;
            max-width: 350px;
            background: rgba(58,47,10,0.9);
            border: 2px solid rgba(255,200,64,0.3);
            border-radius: 12px;
            padding: 14px 18px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            margin: 20px auto;
            display: block;
            text-align: center;
        }
        .player-name-input:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(232,168,9,0.3);
        }

        .leaderboard-container { background: rgba(58,47,10,0.6); border-radius: 14px; padding: 25px; margin-top: 25px; border: 1px solid rgba(255,200,64,0.2); }
        .leaderboard-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--accent-glow); margin-bottom: 18px; text-align: center; }
        .leaderboard-entry {
            display: grid;
            grid-template-columns: 50px 1fr auto auto;
            gap: 12px;
            padding: 12px;
            background: rgba(58,47,10,0.4);
            border-radius: 10px;
            margin-bottom: 8px;
            align-items: center;
            border: 1px solid rgba(255,200,64,0.15);
        }
        .leaderboard-rank { font-size: 1.2rem; font-weight: 700; text-align: center; }
        .leaderboard-name { font-weight: 600; color: var(--text); }
        .leaderboard-score { color: var(--accent-glow); font-weight: 700; }
        .leaderboard-time { color: var(--text-muted); font-size: 0.88rem; }

        .points-popup {
            position: fixed;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--success);
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .points-popup.streak-bonus { color: var(--gold); font-size: 2.2rem; }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }

        .milestone-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(31,26,6,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }
        .milestone-content {
            text-align: center;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes scaleIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .milestone-number { font-family: 'Fredoka', sans-serif; font-size: 6rem; color: var(--gold); margin-bottom: 15px; }
        .milestone-text { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--text); }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 3000;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .sentence { font-size: 1.4rem; line-height: 2.2; }
            .article-slot { min-width: 70px; padding: 6px 10px; font-size: 0.9rem; }
            .mode-btn { padding: 14px 18px; }
            .result-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="ripples" id="ripples"></div>
    <button class="back-btn" id="backBtn" onclick="goToMenu()">← Zurück zum Menü</button>

    <div class="container">
        <header>
            <h1>🍊 Artikel & Fälle Champion</h1>
            <p class="subtitle">Trainiere deutsche Artikel, Fälle und Satzzeichen wie ein Grammatik-Profi!</p>
        </header>

        <!-- ==================== START SCREEN ==================== -->
        <div id="startScreen" class="screen active">
            <div class="menu-card">
                <h2 class="mode-title">🎯 Wähle deinen Trainingsmodus</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="startGame('preposition')">
                        <span class="mode-icon">📍</span>
                        Präpositionen (mit, in, an, auf, ...)
                        <div class="mode-desc">Wähle Artikel nach Präposition: „mit dem Auto", „in eine Straße", „ohne Geld"</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('definite')">
                        <span class="mode-icon">🔷</span>
                        Bestimmte Artikel (der, die, das)
                        <div class="mode-desc">Finde den richtigen bestimmten Artikel im passenden Fall</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('indefinite')">
                        <span class="mode-icon">◇</span>
                        Unbestimmte Artikel (ein, eine, ein)
                        <div class="mode-desc">Übe unbestimmte Artikel in allen Fällen</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('negation')">
                        <span class="mode-icon">⊘</span>
                        Verneinung (kein, keine, nicht)
                        <div class="mode-desc">Lerne wann „kein" und wann „nicht" verwendet wird</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('possessive')">
                        <span class="mode-icon">👤</span>
                        Possessivpronomen (mein, dein, sein, ...)
                        <div class="mode-desc">Possessivartikel in allen Fällen meistern</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('relative')">
                        <span class="mode-icon">🔗</span>
                        Relativpronomen (der, die, das, ...)
                        <div class="mode-desc">Relativsätze mit den richtigen Pronomen bilden</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('comma')">
                        <span class="mode-icon">📝</span>
                        Beistriche <span class="mode-badge new-badge">NEU</span>
                        <div class="mode-desc">Setze Beistriche richtig bei Nebensätzen, Aufzählungen und Infinitivgruppen</div>
                    </button>
                </div>
            </div>

            <div class="menu-card">
                <h2 class="mode-title">🏆 Bestenliste</h2>
                <div id="menuLeaderboard"></div>
            </div>
        </div>

        <!-- ==================== GAME SCREEN ==================== -->
        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="mode-indicator" id="modeIndicator">Modus</div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-label">Punkte</div>
                        <div class="stat-value" id="points">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Serie</div>
                        <div class="stat-value" id="streak">0</div>
                    </div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0 Sätze gelöst</div>

            <div class="sentence-box">
                <div class="sentence" id="sentence"></div>
                <div class="hint-box" id="hintBox">
                    <span id="hintText"></span>
                </div>
            </div>

            <div class="options-grid" id="optionsGrid"></div>

            <div class="control-buttons">
                <button class="control-btn" onclick="skipSentence()">⏭️ Überspringen</button>
                <button class="control-btn primary" onclick="endGame()">🏁 Beenden</button>
            </div>
        </div>

        <!-- ==================== RESULT SCREEN ==================== -->
        <div id="resultScreen" class="screen">
            <div class="result-card">
                <h2 class="result-title">🎉 Geschafft!</h2>
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-label">Punkte</div>
                        <div class="result-stat-value" id="finalPoints">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Zeit</div>
                        <div class="result-stat-value" id="finalTime">0:00</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Beste Serie</div>
                        <div class="result-stat-value" id="bestStreak">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Genauigkeit</div>
                        <div class="result-stat-value" id="accuracy">0%</div>
                    </div>
                </div>

                <input type="text" class="player-name-input" id="playerName" placeholder="Dein Name..." maxlength="20">

                <div class="control-buttons">
                    <button class="control-btn primary" onclick="saveScore()">💾 Speichern</button>
                    <button class="control-btn" onclick="playAgain()">🔄 Nochmal spielen</button>
                    <button class="control-btn" onclick="goToMenu()">🏠 Zurück zum Menü</button>
                </div>

                <div id="resultLeaderboard" class="leaderboard-container"></div>
            </div>
        </div>
    </div>

    <script>
    // ==================== SOUNDS ====================
    const sounds = {
        correct: () => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 800; gain.gain.value = 0.15;
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            setTimeout(() => ctx.close(), 200);
        },
        wrong: () => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();

    function startGame(mode) {
        gameState.mode = mode;
        gameState.points = 0;
        gameState.streak = 0;
        gameState.bestStreak = 0;
        gameState.correctAnswers = 0;
        gameState.totalAttempts = 0;
        gameState.startTime = Date.now();
        gameState.allSentences = [...sentenceData[mode]];
        gameState.remainingSentences = [...gameState.allSentences];
        gameState.solvedSentences = [];
        
        const modeNames = {
            preposition: 'Präpositionen',
            definite: 'Bestimmte Artikel',
            indefinite: 'Unbestimmte Artikel',
            negation: 'Verneinung',
            possessive: 'Possessivpronomen',
            relative: 'Relativpronomen',
            comma: 'Beistriche'
        };
        
        const ind = document.getElementById('modeIndicator');
        ind.textContent = modeNames[mode];
        ind.className = 'mode-indicator ' + mode;
        
        updateStats();
        updateProgress();
        loadNextSentence();
        showScreen('gameScreen');
        document.getElementById('backBtn').style.display = 'block';
    }

    // ==================== SENTENCE LOADING ====================

    function loadNextSentence() {
        if (gameState.remainingSentences.length === 0) {
            endGame();
            return;
        }
        
        const idx = Math.floor(Math.random() * gameState.remainingSentences.length);
        gameState.currentSentence = gameState.remainingSentences[idx];
        
        document.getElementById('hintBox').style.display = 'none';
        renderSentence();
        renderOptions();
    }

    function renderSentence() {
        const s = gameState.currentSentence;
        const container = document.getElementById('sentence');
        container.innerHTML = '';
        
        let text = s.text;
        let slotIndex = 0;
        
        const regex = /\[(.*?)\]/g;
        let lastIndex = 0;
        let match;
        
        while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
                const word = document.createElement('span');
                word.className = 'word';
                word.textContent = text.substring(lastIndex, match.index);
                container.appendChild(word);
            }
            
            const slot = document.createElement('span');
            slot.className = 'article-slot';
            slot.dataset.slotIndex = slotIndex;
            
            if (gameState.mode === 'comma') {
                slot.textContent = '?';
                slot.style.minWidth = '50px';
            } else {
                slot.textContent = '___';
            }
            
            slot.onclick = () => selectSlot(slot);
            container.appendChild(slot);
            
            slotIndex++;
            lastIndex = regex.lastIndex;
        }
        
        if (lastIndex < text.length) {
            const word = document.createElement('span');
            word.className = 'word';
            word.textContent = text.substring(lastIndex);
            container.appendChild(word);
        }
    }

    function renderOptions() {
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        
        if (gameState.mode === 'comma') {
            const options = [
                { label: '✓ Beistrich setzen', value: true },
                { label: '✗ Kein Beistrich', value: false }
            ];
            options.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = o.label;
                btn.onclick = () => fillSlot(o.value);
                grid.appendChild(btn);
            });
        } else if (gameState.mode === 'preposition') {
            // NUR die eine Präposition + 4 Artikel = max 5 Buttons!
            const correctPrep = gameState.currentSentence.slots.find(s => s.prep)?.prep;
            const correctArt = gameState.currentSentence.slots.find(s => s.art)?.art;
            
            const artPool = ['dem', 'der', 'den', 'das', 'die', 'einen', 'einem', 'einer', 'eine', 'ein', 'keinen', 'keinem', 'keiner', 'keine', 'kein', '_'];
            
            // Richtiger Artikel + 3 falsche Ablenkungen
            const wrongArts = artPool.filter(a => a !== correctArt).sort(() => Math.random() - 0.5).slice(0, 3);
            const allOptions = [correctPrep, correctArt, ...wrongArts].sort(() => Math.random() - 0.5);
            
            allOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt === '_' ? '(kein Artikel)' : opt;
                btn.onclick = () => fillSlot(opt);
                grid.appendChild(btn);
            });
        } else if (gameState.mode === 'possessive') {
            // Nur Deklinationen des EINEN Pronomens im Satz!
            let correctBase = null;
            gameState.currentSentence.slots.forEach(slot => {
                if (slot.art) {
                    const lower = slot.art.toLowerCase();
                    if (lower.startsWith('mein')) correctBase = 'mein';
                    else if (lower.startsWith('dein')) correctBase = 'dein';
                    else if (lower.startsWith('sein')) correctBase = 'sein';
                    else if (lower.startsWith('ihr')) correctBase = 'ihr';
                    else if (lower.startsWith('unser') || lower.startsWith('uns')) correctBase = 'unser';
                    else if (lower.startsWith('euer') || lower.startsWith('eu')) correctBase = 'euer';
                }
            });
            
            const allForms = [];
            if (correctBase === 'mein') {
                allForms.push('mein', 'meine', 'meinen', 'meinem', 'meiner', 'meines', 'Mein', 'Meine');
            } else if (correctBase === 'dein') {
                allForms.push('dein', 'deine', 'deinen', 'deinem', 'deiner', 'deines', 'Dein', 'Deine');
            } else if (correctBase === 'sein') {
                allForms.push('sein', 'seine', 'seinen', 'seinem', 'seiner', 'seines', 'Sein', 'Seine');
            } else if (correctBase === 'ihr') {
                allForms.push('ihr', 'ihre', 'ihren', 'ihrem', 'ihrer', 'ihres', 'Ihr', 'Ihre');
            } else if (correctBase === 'unser') {
                allForms.push('unser', 'unsere', 'unseren', 'unserem', 'unserer', 'unseres', 'Unser', 'Unsere');
            } else if (correctBase === 'euer') {
                allForms.push('euer', 'eure', 'euren', 'eurem', 'eurer', 'eures', 'Euer', 'Eure');
            }
            
            allForms.sort(() => Math.random() - 0.5);
            
            allForms.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => fillSlot(opt);
                grid.appendChild(btn);
            });
        } else {
            const opts = optionsData[gameState.mode];
            const allOpts = [];
            Object.keys(opts).forEach(k => {
                opts[k].forEach(v => {
                    if (!allOpts.includes(v)) allOpts.push(v);
                });
            });
            
            allOpts.sort(() => Math.random() - 0.5);
            
            allOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt === '_' ? '(kein Artikel)' : opt;
                btn.onclick = () => fillSlot(opt);
                grid.appendChild(btn);
            });
        }
    }

    // ==================== SLOT INTERACTION ====================

    let selectedSlot = null;

    function selectSlot(slot) {
        if (slot.classList.contains('correct') || slot.classList.contains('wrong')) return;
        
        document.querySelectorAll('.article-slot').forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
        selectedSlot = slot;
    }

    function fillSlot(value) {
        if (!selectedSlot) {
            const firstEmpty = document.querySelector('.article-slot:not(.correct):not(.wrong)');
            if (firstEmpty) {
                selectSlot(firstEmpty);
            } else {
                return;
            }
        }
        
        const slotIndex = parseInt(selectedSlot.dataset.slotIndex);
        const s = gameState.currentSentence;
        const slotData = s.slots[slotIndex];
        
        let correct = null;
        
        if (gameState.mode === 'comma') {
            correct = slotData.comma;
            selectedSlot.textContent = value ? ',' : '—';
        } else if (gameState.mode === 'preposition') {
            if (slotData.prep) {
                correct = slotData.prep;
            } else {
                correct = slotData.art;
            }
            selectedSlot.textContent = value === '_' ? '∅' : value;
        } else {
            correct = slotData.art;
            selectedSlot.textContent = value === '_' ? '∅' : value;
        }
        
        gameState.totalAttempts++;
        
        if (value === correct) {
            selectedSlot.classList.add('correct');
            selectedSlot.classList.remove('selected');
            gameState.correctAnswers++;
            gameState.streak++;
            if (gameState.streak > gameState.bestStreak) {
                gameState.bestStreak = gameState.streak;
            }
            
            // Progressive Punktesystem: Mehr Punkte bei längeren Fehlerfreien Serien
            let points = gameState.basePointsPerSlot;
            if (gameState.streak >= 20) {
                points *= 5;
            } else if (gameState.streak >= 15) {
                points *= 4;
            } else if (gameState.streak >= 10) {
                points *= 3;
            } else if (gameState.streak >= 5) {
                points *= 2;
            }
            
            gameState.points += points;
            updateStats();
            sounds.correct();
            showPointsPopup(points, gameState.streak >= 5);
            
            const allCorrect = Array.from(document.querySelectorAll('.article-slot')).every(sl => 
                sl.classList.contains('correct')
            );
            
            if (allCorrect) {
                setTimeout(() => {
                    gameState.solvedSentences.push(gameState.remainingSentences.splice(
                        gameState.remainingSentences.indexOf(gameState.currentSentence), 1
                    )[0]);
                    updateProgress();
                    
                    if (gameState.solvedSentences.length % 10 === 0 && gameState.solvedSentences.length > 0) {
                        showMilestone(gameState.solvedSentences.length);
                    }
                    
                    loadNextSentence();
                }, 800);
            }
            
            selectedSlot = null;
        } else {
            selectedSlot.classList.add('wrong');
            gameState.streak = 0;
            updateStats();
            sounds.wrong();
            document.getElementById('hintBox').style.display = 'block';
            
            if (gameState.mode === 'comma') {
                document.getElementById('hintText').textContent = correct ? 
                    'Richtig wäre: Beistrich setzen (,)' : 
                    'Richtig wäre: Kein Beistrich';
            } else {
                document.getElementById('hintText').textContent = `Richtig wäre: „${correct === '_' ? '(kein Artikel)' : correct}"`;
            }
            
            setTimeout(() => {
                selectedSlot.classList.remove('wrong');
                selectedSlot.classList.remove('selected');
                if (gameState.mode === 'comma') {
                    selectedSlot.textContent = '?';
                } else {
                    selectedSlot.textContent = '___';
                }
                selectedSlot = null;
            }, 500);
        }
    }

    function skipSentence() {
        gameState.streak = 0;
        updateStats();
        const s = gameState.remainingSentences.shift();
        gameState.remainingSentences.push(s);
        loadNextSentence();
    }

    // ==================== STATS & UI ====================

    function updateStats() {
        document.getElementById('points').textContent = gameState.points;
        const el = document.getElementById('streak');
        el.innerHTML = gameState.streak > 2 ? `<span class="streak-fire">🔥</span>${gameState.streak}` : gameState.streak;
    }

    function updateProgress() {
        const total = gameState.solvedSentences.length + gameState.remainingSentences.length;
        const solved = gameState.solvedSentences.length;
        const pct = total > 0 ? (solved / total) * 100 : 0;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = `${solved} / ${total} Sätze gelöst`;
    }

    function showPointsPopup(pts, isStreak) {
        const popup = document.createElement('div');
        popup.className = 'points-popup' + (isStreak ? ' streak-bonus' : '');
        popup.textContent = isStreak ? `+${pts} 🔥 Combo!` : `+${pts}`;
        popup.style.left = (Math.random() * 60 + 20) + '%';
        popup.style.top = '40%';
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 1000);
    }

    function showMilestone(n) {
        const overlay = document.createElement('div');
        overlay.className = 'milestone-overlay';
        overlay.innerHTML = `<div class="milestone-content"><div class="milestone-number">${n}</div><div class="milestone-text">🎉 Wow, ${n} Sätze!</div></div>`;
        document.body.appendChild(overlay);
        sounds.milestone();
        createConfetti();
        setTimeout(() => overlay.remove(), 2500);
    }

    function createConfetti() {
        const colors = ['#e8a809', '#ffc840', '#ffe080', '#ffd700', '#75c743', '#ff9f1c', '#d4a843'];
        for (let i = 0; i < 100; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-10px';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            const sz = (Math.random() * 10 + 5) + 'px';
            c.style.width = c.style.height = sz;
            document.body.appendChild(c);
            const anim = c.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                { transform: `translateY(100vh) rotate(${Math.random()*720}deg)`, opacity: 0 }
            ], { duration: Math.random() * 2000 + 2000, easing: 'ease-out' });
            anim.onfinish = () => c.remove();
        }
    }

    // ==================== RESULT ====================

    function endGame() {
        clearInterval(gameState.timerInterval);
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        document.getElementById('finalPoints').textContent = gameState.points;
        document.getElementById('finalTime').textContent = `${Math.floor(elapsed/60)}:${(elapsed%60).toString().padStart(2,'0')}`;
        document.getElementById('bestStreak').textContent = gameState.bestStreak;
        document.getElementById('accuracy').textContent = gameState.totalAttempts > 0
            ? Math.round((gameState.correctAnswers / gameState.totalAttempts) * 100) + '%' : '0%';
        showScreen('resultScreen');
        document.getElementById('backBtn').style.display = 'none';
        updateResultLeaderboard();
        sounds.milestone();
        createConfetti();
    }

    // ==================== LEADERBOARD ====================

    function loadLeaderboard() {
        try { return JSON.parse(localStorage.getItem('artikelChampionBieneLeaderboard') || '[]'); } catch(e) { return []; }
    }
    function saveLeaderboard(b) {
        try { localStorage.setItem('artikelChampionBieneLeaderboard', JSON.stringify(b)); } catch(e) {}
    }

    function saveScore() {
        const name = document.getElementById('playerName').value.trim() || 'Anonym';
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        const modeNames = {
            preposition: 'Präpositionen',
            definite: 'Bestimmte Artikel',
            indefinite: 'Unbestimmte Artikel',
            negation: 'Verneinung',
            possessive: 'Possessivpronomen',
            relative: 'Relativpronomen',
            comma: 'Beistriche'
        };
        const entry = {
            name,
            points: gameState.points,
            time: elapsed,
            mode: modeNames[gameState.mode],
            date: new Date().toLocaleDateString('de-DE')
        };
        const board = loadLeaderboard();
        board.push(entry);
        board.sort((a,b) => b.points - a.points);
        saveLeaderboard(board.slice(0, 10));
        updateResultLeaderboard();
        updateMenuLeaderboard();
        document.getElementById('playerName').disabled = true;
        event.target.disabled = true;
        event.target.textContent = '✓ Gespeichert!';
    }

    function formatTime(s) {
        return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
    }

    function renderBoard(container, entries, limit) {
        if (entries.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted);text-align:center;">Noch keine Einträge. Sei die Erste!</p>';
            return;
        }
        container.innerHTML = entries.slice(0, limit).map((e,i) =>
            `<div class="leaderboard-entry">
                <span class="leaderboard-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'}${'</span>'}
                <span class="leaderboard-name">${e.name}</span>
                <span class="leaderboard-score">${e.points} Pkt</span>
                <span class="leaderboard-time">${formatTime(e.time)}</span>
            </div>`
        ).join('');
    }

    function updateMenuLeaderboard() {
        renderBoard(document.getElementById('menuLeaderboard'), loadLeaderboard(), 5);
    }
    function updateResultLeaderboard() {
        const c = document.getElementById('resultLeaderboard');
        c.innerHTML = '<h3 class="leaderboard-title">🏅 Bestenliste</h3>';
        const board = loadLeaderboard();
        const inner = document.createElement('div');
        renderBoard(inner, board, 5);
        c.appendChild(inner);
    }

    function playAgain() {
        document.getElementById('playerName').disabled = false;
        document.getElementById('playerName').value = '';
        const btn = document.querySelector('#resultScreen .control-btn.primary');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
        startGame(gameState.mode);
    }

    function goToMenu() {
        clearInterval(gameState.timerInterval);
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('playerName').disabled = false;
        document.getElementById('playerName').value = '';
        const btn = document.querySelector('#resultScreen .control-btn.primary');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
        showScreen('startScreen');
        updateMenuLeaderboard();
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
