<!DOCTYPE html>
<html lang="de">
<head>
<script src="/daf/interdaf/passwort.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel-Champion Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f1b24;
    --ink-soft: #4f4858;
    --muted: #6e6676;
    --card: rgba(255, 252, 248, 0.90);
    --card-solid: #fffcf8;
    --line: rgba(92, 72, 98, 0.14);
    --shadow: 0 14px 40px rgba(62, 48, 74, 0.10), 0 2px 6px rgba(62, 48, 74, 0.05);

    --rust: #a2542b;       /* Herbstlaub */
    --amber: #b9853d;      /* Bernstein */
    --plum: #6a4a7a;       /* Dunkelflieder */
    --dusk: #3d5a80;       /* Abendhimmel-Blau */
    --petrol: #2c6873;     /* Petrol */
    --berry: #8e3b56;      /* Beere */
    --slate: #4b5878;      /* Schiefer */

    --ok: #2c6873;  --ok-bg: #e2eef0;
    --no: #a03a55;  --no-bg: #f7e4ea;
    --sel: #b9853d; --sel-bg: #fbf1e1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Lexend', system-ui, sans-serif;
    font-weight: 400;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    background-color: #ebe3e0;
    background-image:
      radial-gradient(ellipse 70% 50% at 8% 100%, rgba(214, 160, 110, 0.28), transparent 70%),
      radial-gradient(ellipse 60% 45% at 95% 0%, rgba(168, 188, 214, 0.45), transparent 70%),
      radial-gradient(ellipse 50% 40% at 70% 70%, rgba(176, 150, 190, 0.18), transparent 70%),
      linear-gradient(165deg, #f2e8dd 0%, #ebe1e2 42%, #dfe4ec 100%);
    background-attachment: fixed;
    line-height: 1.55;
  }

  /* ── Dekor: Blätter und Schneeflocken ── */
  .deco-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .deco {
    position: absolute; top: -10vh; left: var(--x);
    width: var(--s); height: var(--s);
    opacity: var(--o);
    animation: drift var(--d) linear infinite;
    animation-delay: var(--delay);
    will-change: transform;
  }
  .deco svg { width: 100%; height: 100%; display: block; }
  @keyframes drift {
    0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
    25%  { transform: translate3d(var(--sway), 22vh, 0) rotate(calc(var(--rot) * 0.25)); }
    50%  { transform: translate3d(0, 52vh, 0) rotate(calc(var(--rot) * 0.5)); }
    75%  { transform: translate3d(calc(var(--sway) * -1), 82vh, 0) rotate(calc(var(--rot) * 0.75)); }
    100% { transform: translate3d(0, 118vh, 0) rotate(var(--rot)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .deco { animation: none; top: var(--y); }
  }

  .container { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; padding: 28px 18px 60px; }

  header { text-align: center; margin: 10px 0 30px; }
  .eyebrow {
    display: inline-block; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.08em;
    color: var(--plum); background: rgba(106, 74, 122, 0.09);
    padding: 5px 14px; border-radius: 999px; margin-bottom: 14px;
  }
  h1 { font-size: clamp(2rem, 5vw, 2.9rem); font-weight: 600; letter-spacing: -0.01em; color: var(--ink); line-height: 1.15; }
  h1 .easy { color: var(--rust); font-weight: 500; }
  .subtitle { color: var(--ink-soft); font-size: 1.08rem; margin-top: 10px; font-weight: 300; }

  .screen { display: none; animation: fadeIn 0.45s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 22px;
  }
  .card-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 18px; color: var(--ink); }

  /* ── Menü ── */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mode-btn {
    display: flex; align-items: center; gap: 16px;
    background: var(--card-solid);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px 18px;
    font-family: inherit; color: var(--ink); text-align: left;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .mode-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(62,48,74,0.10); border-color: var(--c); }
  .mode-btn:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
  .chip {
    flex: 0 0 auto; min-width: 62px; height: 52px; padding: 0 10px;
    display: grid; place-items: center;
    border-radius: 16px; background: var(--c); color: #fff;
    font-weight: 600; font-size: 1rem; letter-spacing: 0.01em;
  }
  .mode-name { font-weight: 600; font-size: 1.08rem; }
  .mode-desc { font-size: 0.92rem; color: var(--muted); margin-top: 2px; font-weight: 400; }
  .mode-count { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .mode-btn.wide { grid-column: 1 / -1; }

  /* ── Spiel ── */
  .game-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--c, var(--plum)); color: #fff;
    padding: 9px 18px; border-radius: 999px; font-weight: 500; font-size: 0.98rem;
  }
  .stats { display: flex; gap: 10px; }
  .stat {
    background: var(--card-solid); border: 1px solid var(--line); border-radius: 16px;
    padding: 8px 16px; text-align: center; min-width: 92px;
  }
  .stat-label { font-size: 0.74rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-value { font-size: 1.35rem; font-weight: 600; color: var(--ink); }

  .progress { height: 12px; background: rgba(92,72,98,0.10); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--rust), var(--amber) 45%, var(--plum)); border-radius: 999px; transition: width 0.5s ease; }
  .progress-text { text-align: right; font-size: 0.9rem; color: var(--muted); margin: 6px 4px 18px; }

  .sentence-card { text-align: center; padding: 40px 28px 30px; }
  .sentence { font-size: clamp(1.35rem, 3.6vw, 1.85rem); line-height: 2.3; font-weight: 400; color: var(--ink); }
  .slot {
    display: inline-block; min-width: 84px; margin: 0 3px; padding: 0 14px;
    line-height: 1.9; vertical-align: baseline;
    border: 2px dashed rgba(92,72,98,0.30); border-radius: 14px;
    background: rgba(255,255,255,0.7);
    color: var(--muted); font-weight: 500; cursor: pointer;
    transition: all 0.2s ease;
  }
  .slot.comma-slot { min-width: 46px; padding: 0 10px; }
  .slot:hover { border-color: var(--sel); }
  .slot.selected { border-style: solid; border-color: var(--sel); background: var(--sel-bg); color: var(--ink); box-shadow: 0 0 0 4px rgba(185,133,61,0.15); }
  .slot.correct { border-style: solid; border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 600; cursor: default; animation: pop 0.45s ease; }
  .slot.wrong { border-style: solid; border-color: var(--no); background: var(--no-bg); color: var(--no); animation: shake 0.4s ease; }
  @keyframes pop { 50% { transform: scale(1.08); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .noun {
    position: relative; cursor: help;
    border-bottom: 2px dotted rgba(106,74,122,0.45);
    transition: border-color 0.2s;
  }
  .noun:hover, .noun.show { border-bottom-color: var(--plum); }
  .tip {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #fffaf1; color: var(--ink);
    border: 1px solid rgba(185,133,61,0.55); border-radius: 12px;
    padding: 3px 14px; font-size: 0.95rem; font-weight: 500; line-height: 1.6;
    white-space: nowrap; z-index: 50;
    box-shadow: 0 8px 20px rgba(62,48,74,0.15);
    pointer-events: none;
  }
  .tip::after {
    content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: rgba(185,133,61,0.55);
  }
  .noun:hover .tip, .noun.show .tip { display: block; }

  .hint {
    display: none; margin-top: 18px; padding: 12px 18px;
    background: var(--no-bg); color: var(--ink); border-radius: 14px;
    font-size: 1rem; border: 1px solid rgba(160,58,85,0.25);
  }
  .helper { margin-top: 14px; font-size: 0.92rem; color: var(--muted); font-weight: 300; }

  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 6px 0 24px; }
  .options.two { grid-template-columns: 1fr 1fr; }
  .opt {
    background: var(--card-solid); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 12px; font-family: inherit; font-size: 1.12rem; font-weight: 500; color: var(--ink);
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s;
  }
  .opt:hover { transform: translateY(-2px); border-color: var(--c, var(--plum)); box-shadow: 0 8px 18px rgba(62,48,74,0.10); }
  .opt:active { transform: translateY(0); }
  .opt.zero { color: var(--ink-soft); font-size: 1rem; }

  .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-family: inherit; font-size: 1rem; font-weight: 500;
    padding: 12px 24px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card-solid); color: var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(62,48,74,0.10); }
  .btn.primary { background: var(--dusk); border-color: var(--dusk); color: #fff; }
  .btn.primary:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }

  /* ── Ergebnis ── */
  .result-title { font-size: 1.8rem; font-weight: 600; text-align: center; margin-bottom: 6px; }
  .result-sub { text-align: center; color: var(--muted); margin-bottom: 22px; }
  .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .r-stat { background: var(--card-solid); border: 1px solid var(--line); border-radius: 18px; padding: 16px 10px; text-align: center; }
  .r-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .r-value { font-size: 1.8rem; font-weight: 600; color: var(--plum); }
  .name-input {
    display: block; width: 100%; max-width: 340px; margin: 0 auto 16px;
    font-family: inherit; font-size: 1.05rem; text-align: center;
    padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .name-input:focus { outline: none; border-color: var(--dusk); box-shadow: 0 0 0 4px rgba(61,90,128,0.15); }

  .board-entry {
    display: grid; grid-template-columns: 44px 1fr auto auto; gap: 12px; align-items: center;
    padding: 10px 14px; border-radius: 14px; background: var(--card-solid); border: 1px solid var(--line); margin-bottom: 8px;
  }
  .board-rank { font-weight: 600; color: var(--plum); text-align: center; }
  .board-name { font-weight: 500; }
  .board-mode { display: block; font-size: 0.82rem; color: var(--muted); font-weight: 400; }
  .board-pts { font-weight: 600; color: var(--rust); }
  .board-time { color: var(--muted); font-size: 0.9rem; }
  .board-empty { color: var(--muted); text-align: center; }

  /* ── Effekte ── */
  .popup { position: fixed; z-index: 1000; pointer-events: none; font-weight: 600; font-size: 1.6rem; color: var(--petrol); animation: floatUp 1s ease-out forwards; }
  .popup.combo { color: var(--rust); font-size: 1.9rem; }
  @keyframes floatUp { from { transform: translateY(0) scale(0.9); opacity: 1; } to { transform: translateY(-70px) scale(1.1); opacity: 0; } }
  .milestone { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: rgba(242, 236, 232, 0.82); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fadeIn 0.3s ease; }
  .milestone-inner { text-align: center; animation: scaleIn 0.5s cubic-bezier(.2,1.3,.4,1); }
  @keyframes scaleIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .milestone-num { font-size: 6rem; font-weight: 700; color: var(--plum); line-height: 1; }
  .milestone-text { font-size: 1.6rem; font-weight: 500; color: var(--ink); margin-top: 10px; }
  .flake-burst { position: fixed; top: -20px; z-index: 3000; pointer-events: none; }

  @media (max-width: 680px) {
    .container { padding: 20px 14px 50px; }
    .card { padding: 20px; border-radius: 22px; }
    .mode-grid { grid-template-columns: 1fr; }
    .sentence-card { padding: 30px 16px 22px; }
    .result-grid { grid-template-columns: 1fr 1fr; }
    .slot { min-width: 66px; padding: 0 10px; }
    .stat { min-width: 76px; padding: 6px 12px; }
  }
</style>
</head>
<body>
<div class="deco-layer" id="deco"></div>

<div class="container">
  <header>
    <div class="eyebrow">A1 · A2 · Deutsch üben</div>
    <h1>Artikel-Champion <span class="easy">Easy</span></h1>
    <p class="subtitle">Artikel, Fälle und Beistriche – mit einfachen Sätzen aus dem Alltag</p>
  </header>

  <!-- Start -->
  <div id="startScreen" class="screen active">
    <div class="card">
      <h2 class="card-title">Was möchtest du üben?</h2>
      <div class="mode-grid" id="modeGrid"></div>
    </div>
    <div class="card">
      <h2 class="card-title">Bestenliste</h2>
      <div id="menuBoard"></div>
    </div>
  </div>

  <!-- Spiel -->
  <div id="gameScreen" class="screen">
    <div class="game-top">
      <span class="pill" id="modePill">Modus</span>
      <div class="stats">
        <div class="stat"><div class="stat-label">Punkte</div><div class="stat-value" id="points">0</div></div>
        <div class="stat"><div class="stat-label">Serie</div><div class="stat-value" id="streak">0</div></div>
      </div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0 Sätze</div>

    <div class="card sentence-card">
      <div class="sentence" id="sentence"></div>
      <div class="hint" id="hint"></div>
      <div class="helper" id="helper"></div>
    </div>

    <div class="options" id="options"></div>

    <div class="controls">
      <button class="btn" onclick="goToMenu()">← Menü</button>
      <button class="btn" onclick="skipSentence()">Überspringen</button>
      <button class="btn primary" onclick="endGame()">Beenden</button>
    </div>
  </div>

  <!-- Ergebnis -->
  <div id="resultScreen" class="screen">
    <div class="card">
      <h2 class="result-title">Geschafft!</h2>
      <p class="result-sub" id="resultSub"></p>
      <div class="result-grid">
        <div class="r-stat"><div class="r-label">Punkte</div><div class="r-value" id="finalPoints">0</div></div>
        <div class="r-stat"><div class="r-label">Zeit</div><div class="r-value" id="finalTime">0:00</div></div>
        <div class="r-stat"><div class="r-label">Beste Serie</div><div class="r-value" id="bestStreak">0</div></div>
        <div class="r-stat"><div class="r-label">Genauigkeit</div><div class="r-value" id="accuracy">0%</div></div>
      </div>
      <input type="text" class="name-input" id="playerName" placeholder="Dein Name …" maxlength="20">
      <div class="controls">
        <button class="btn primary" id="saveBtn" onclick="saveScore()">Speichern</button>
        <button class="btn" onclick="startGame(state.mode)">Nochmal spielen</button>
        <button class="btn" onclick="goToMenu()">Zum Menü</button>
      </div>
    </div>
    <div class="card">
      <h2 class="card-title">Bestenliste</h2>
      <div id="resultBoard"></div>
    </div>
  </div>
</div>

// ==================== MODI ====================
const MODES = {
  preposition: { name: 'Präpositionen', chip: 'mit', color: 'var(--rust)',  desc: 'mit, nach, aus, in, auf, für … – welcher Artikel passt?' },
  definite:    { name: 'Bestimmte Artikel', chip: 'der', color: 'var(--dusk)', desc: 'der, die, das, den, dem, des' },
  indefinite:  { name: 'Unbestimmte Artikel', chip: 'ein', color: 'var(--plum)', desc: 'ein, eine, einen, einem … oder gar kein Artikel?' },
  negation:    { name: 'Verneinung', chip: 'kein', color: 'var(--berry)', desc: 'kein, keine, keinen … oder nicht?' },
  possessive:  { name: 'Possessivartikel', chip: 'mein', color: 'var(--amber)', desc: 'mein, dein, sein, ihr, unser, euer, Ihr' },
  relative:    { name: 'Relativpronomen', chip: 'der,', color: 'var(--petrol)', desc: 'der, die, das, den, dem, denen, dessen, deren' },
  comma:       { name: 'Beistriche', chip: ' , ', color: 'var(--slate)', desc: 'Nebensätze, Aufzählungen, aber/sondern, um … zu – Beistrich oder nicht?' }
};

const DEF  = ['der', 'die', 'das', 'den', 'dem', 'des'];
const IND  = ['ein', 'eine', 'einen', 'einem', 'einer', 'eines'];
const KEIN = ['kein', 'keine', 'keinen', 'keinem', 'keiner'];
const REL  = ['der', 'die', 'das', 'den', 'dem', 'denen', 'dessen', 'deren'];

function possForms(base) {
  if (base === 'euer')  return ['euer', 'eure', 'euren', 'eurem', 'eurer', 'eures'];
  if (base === 'unser') return ['unser', 'unsere', 'unseren', 'unserem', 'unserer', 'unseres'];
  return ['', 'e', 'en', 'em', 'er', 'es'].map(e => base + e);
}
function familyOf(ans) {
  const a = ans.toLowerCase();
  if (DEF.includes(a)) return DEF.slice();
  if (IND.includes(a)) return IND.slice();
  if (KEIN.includes(a)) return KEIN.slice();
  for (const b of ['unser', 'euer', 'mein', 'dein', 'sein', 'ihr']) {
    if (a.startsWith(b) || (b === 'euer' && a.startsWith('eur'))) return possForms(b);
  }
  return null;
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ==================== SATZ-PARSER ====================
// [x] = Lücke, [x+] = Lücke, bei der zusätzlich „kein Artikel" angeboten wird
// [,] = hier gehört ein Beistrich hin, [_] = hier steht kein Beistrich / kein Artikel
// N{Artikel|Grundform} oder N{Artikel|Grundform|Form im Satz} = Nomen mit Artikel-Hilfe
const TOKEN = /\[([^\]]*)\]|N\{([^}]+)\}/g;
function parse(str, mode) {
  const parts = [], slots = [];
  let last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(str)) !== null) {
    if (m.index > last) parts.push({ t: 'text', v: str.slice(last, m.index) });
    if (m[1] !== undefined) {
      let v = m[1], addZero = false;
      if (v.endsWith('+')) { addZero = true; v = v.slice(0, -1); }
      const slot = mode === 'comma' ? { comma: v === ',' } : { art: v, addZero };
      slots.push(slot);
      parts.push({ t: 'slot', i: slots.length - 1 });
    } else {
      const p = m[2].split('|');
      parts.push({ t: 'noun', art: p[0], base: p[1], show: p[2] || p[1] });
    }
    last = TOKEN.lastIndex;
  }
  if (last < str.length) parts.push({ t: 'text', v: str.slice(last) });
  return { parts, slots };
}

const state = {
  mode: null, points: 0, streak: 0, bestStreak: 0,
  correct: 0, attempts: 0, start: 0,
  remaining: [], solved: 0, total: 0,
  current: null, selected: null, busy: false
};

function init() {
  buildDeco();
  buildMenu();
  renderBoard('menuBoard', 5);
}

function buildMenu() {
  const grid = document.getElementById('modeGrid');
  grid.innerHTML = '';
  Object.keys(MODES).forEach((k, idx, arr) => {
    const md = MODES[k];
    const b = document.createElement('button');
    b.className = 'mode-btn' + (idx === arr.length - 1 && arr.length % 2 === 1 ? ' wide' : '');
    b.style.setProperty('--c', md.color);
    b.onclick = () => startGame(k);
    b.innerHTML = `<span class="chip">${md.chip}</span>
      <span><span class="mode-name">${md.name}</span>
      <span class="mode-desc" style="display:block">${md.desc}</span>
      <span class="mode-count" style="display:block">${sentenceData[k].length} Sätze</span></span>`;
    grid.appendChild(b);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function startGame(mode) {
  Object.assign(state, {
    mode, points: 0, streak: 0, bestStreak: 0, correct: 0, attempts: 0,
    start: Date.now(), solved: 0, selected: null, busy: false
  });
  state.remaining = shuffle(sentenceData[mode].slice());
  state.total = state.remaining.length;

  const md = MODES[mode];
  const pill = document.getElementById('modePill');
  pill.textContent = md.name;
  pill.style.setProperty('--c', md.color);
  document.getElementById('options').style.setProperty('--c', md.color);
  document.getElementById('helper').textContent = (mode === 'comma' || mode === 'relative')
    ? 'Tippe auf eine Lücke und wähle unten die Antwort.'
    : 'Tipp: Zeig mit der Maus auf ein unterstrichenes Nomen (oder tippe darauf) – dann siehst du seinen Artikel.';

  const nameInput = document.getElementById('playerName');
  nameInput.disabled = false; nameInput.value = '';
  const sb = document.getElementById('saveBtn');
  sb.disabled = false; sb.textContent = 'Speichern';

  updateStats(); updateProgress();
  showScreen('gameScreen');
  loadNext();
}

function loadNext() {
  if (state.remaining.length === 0) { endGame(); return; }
  state.current = parse(state.remaining[0], state.mode);
  state.busy = false;
  document.getElementById('hint').style.display = 'none';
  renderSentence();
  const first = document.querySelector('.slot');
  if (first) selectSlot(first);
}

function renderSentence() {
  const box = document.getElementById('sentence');
  box.innerHTML = '';
  state.current.parts.forEach(p => {
    if (p.t === 'text') {
      box.appendChild(document.createTextNode(p.v));
    } else if (p.t === 'slot') {
      const s = document.createElement('span');
      s.className = 'slot' + (state.mode === 'comma' ? ' comma-slot' : '');
      s.dataset.i = p.i;
      s.textContent = state.mode === 'comma' ? '?' : '…';
      s.onclick = () => selectSlot(s);
      box.appendChild(s);
    } else {
      const n = document.createElement('span');
      n.className = 'noun';
      n.textContent = p.show;
      const tip = document.createElement('span');
      tip.className = 'tip';
      tip.textContent = p.art + ' ' + p.base;
      n.appendChild(tip);
      n.onclick = (e) => {
        e.stopPropagation();
        const on = n.classList.contains('show');
        document.querySelectorAll('.noun.show').forEach(x => x.classList.remove('show'));
        if (!on) n.classList.add('show');
      };
      box.appendChild(n);
    }
  });
}
document.addEventListener('click', () => document.querySelectorAll('.noun.show').forEach(x => x.classList.remove('show')));

function optionsForSlot(slot) {
  const m = state.mode;
  if (m === 'definite') return DEF.slice();
  if (m === 'indefinite') return IND.concat('_');
  if (m === 'negation') return KEIN.concat('nicht');
  if (m === 'relative') return REL.slice();
  const ans = slot.art;
  if (m === 'preposition') {
    if (ans === '_') return DEF.concat('_');
    const fam = familyOf(ans) || DEF.slice();
    return slot.addZero ? fam.concat('_') : fam;
  }
  if (m === 'possessive') {
    const fam = familyOf(ans) || [];
    return /^[A-ZÄÖÜ]/.test(ans) ? fam.map(cap) : fam;
  }
  return [];
}

function renderOptions() {
  const grid = document.getElementById('options');
  grid.innerHTML = '';
  grid.classList.toggle('two', state.mode === 'comma');
  if (!state.selected) return;
  if (state.mode === 'comma') {
    [{ l: 'Beistrich ( , )', v: true }, { l: 'kein Beistrich', v: false }].forEach(o => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o.l;
      b.onclick = () => answer(o.v);
      grid.appendChild(b);
    });
    return;
  }
  const slot = state.current.slots[+state.selected.dataset.i];
  optionsForSlot(slot).forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt' + (o === '_' ? ' zero' : '');
    b.textContent = o === '_' ? 'kein Artikel' : o;
    b.onclick = () => answer(o);
    grid.appendChild(b);
  });
}

function selectSlot(el) {
  if (state.busy || el.classList.contains('correct')) return;
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  state.selected = el;
  renderOptions();
}

function answer(value) {
  if (state.busy) return;
  if (!state.selected) {
    const free = document.querySelector('.slot:not(.correct)');
    if (!free) return;
    selectSlot(free);
  }
  const el = state.selected;
  const slot = state.current.slots[+el.dataset.i];
  state.attempts++;

  let ok, rightText;
  if (state.mode === 'comma') {
    ok = value === slot.comma;
    rightText = slot.comma ? 'Hier gehört ein Beistrich hin.' : 'Hier steht kein Beistrich.';
  } else {
    ok = value.toLowerCase() === slot.art.toLowerCase();
    rightText = 'Richtig wäre: „' + (slot.art === '_' ? 'kein Artikel' : slot.art) + '“';
  }

  if (ok) {
    el.classList.remove('selected', 'wrong');
    el.classList.add('correct');
    if (state.mode === 'comma') el.textContent = slot.comma ? ',' : '–';
    else el.textContent = slot.art === '_' ? '∅' : slot.art;
    state.correct++; state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    let pts = 10;
    if (state.streak >= 20) pts *= 5; else if (state.streak >= 15) pts *= 4;
    else if (state.streak >= 10) pts *= 3; else if (state.streak >= 5) pts *= 2;
    state.points += pts;
    updateStats(); sound('ok'); popup(pts, state.streak >= 5);
    document.getElementById('hint').style.display = 'none';

    const next = document.querySelector('.slot:not(.correct)');
    if (next) { selectSlot(next); }
    else {
      state.selected = null; state.busy = true;
      renderOptions();
      setTimeout(() => {
        state.remaining.shift();
        state.solved++;
        updateProgress();
        if (state.solved % 10 === 0 && state.remaining.length > 0) milestone(state.solved);
        loadNext();
      }, 850);
    }
  } else {
    state.streak = 0; updateStats(); sound('no');
    el.classList.add('wrong');
    el.textContent = state.mode === 'comma' ? (value ? ',' : '–') : (value === '_' ? '∅' : value);
    const h = document.getElementById('hint');
    h.textContent = rightText; h.style.display = 'block';
    setTimeout(() => {
      el.classList.remove('wrong');
      if (!el.classList.contains('correct')) el.textContent = state.mode === 'comma' ? '?' : '…';
    }, 650);
  }
}

function skipSentence() {
  if (state.busy || state.remaining.length < 2) return;
  state.streak = 0; updateStats();
  state.remaining.push(state.remaining.shift());
  loadNext();
}

function updateStats() {
  document.getElementById('points').textContent = state.points;
  document.getElementById('streak').textContent = state.streak;
}
function updateProgress() {
  const pct = state.total ? state.solved / state.total * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${state.solved} / ${state.total} Sätze`;
}

function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function endGame() {
  const sec = Math.floor((Date.now() - state.start) / 1000);
  document.getElementById('finalPoints').textContent = state.points;
  document.getElementById('finalTime').textContent = fmt(sec);
  document.getElementById('bestStreak').textContent = state.bestStreak;
  document.getElementById('accuracy').textContent = state.attempts ? Math.round(state.correct / state.attempts * 100) + '%' : '0%';
  document.getElementById('resultSub').textContent = `${MODES[state.mode].name} · ${state.solved} von ${state.total} Sätzen gelöst`;
  state.endSec = sec;
  showScreen('resultScreen');
  renderBoard('resultBoard', 5);
  sound('win'); flakeBurst();
}

// ==================== BESTENLISTE ====================
const BOARD_KEY = 'artikelChampionEasyBestenliste';
function loadBoard() { try { return JSON.parse(localStorage.getItem(BOARD_KEY) || '[]'); } catch (e) { return []; } }
function storeBoard(b) { try { localStorage.setItem(BOARD_KEY, JSON.stringify(b)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function saveScore() {
  const name = document.getElementById('playerName').value.trim() || 'Anonym';
  const b = loadBoard();
  b.push({ name, points: state.points, time: state.endSec || 0, mode: MODES[state.mode].name });
  b.sort((x, y) => y.points - x.points);
  storeBoard(b.slice(0, 10));
  renderBoard('resultBoard', 5); renderBoard('menuBoard', 5);
  document.getElementById('playerName').disabled = true;
  const sb = document.getElementById('saveBtn');
  sb.disabled = true; sb.textContent = '✓ Gespeichert';
}

function renderBoard(id, limit) {
  const c = document.getElementById(id);
  const b = loadBoard();
  if (!b.length) { c.innerHTML = '<p class="board-empty">Noch keine Einträge – du kannst die Erste oder der Erste sein!</p>'; return; }
  c.innerHTML = b.slice(0, limit).map((e, i) => `
    <div class="board-entry">
      <span class="board-rank">${i + 1}.</span>
      <span class="board-name">${esc(e.name)}<span class="board-mode">${esc(e.mode || '')}</span></span>
      <span class="board-pts">${e.points} Pkt</span>
      <span class="board-time">${fmt(e.time)}</span>
    </div>`).join('');
}

function goToMenu() {
  showScreen('startScreen');
  renderBoard('menuBoard', 5);
}

// ==================== TÖNE ====================
let audioCtx = null;
function tone(freq, start, dur, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function sound(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (kind === 'ok') { tone(784, 0, 0.18, 0.10); tone(1046, 0.07, 0.2, 0.07); }
    else if (kind === 'no') { tone(262, 0, 0.25, 0.08); }
    else { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.11, 0.35, 0.08)); }
  } catch (e) {}
}

// ==================== EFFEKTE ====================
function popup(pts, combo) {
  const p = document.createElement('div');
  p.className = 'popup' + (combo ? ' combo' : '');
  p.textContent = combo ? `+${pts} Serie!` : `+${pts}`;
  p.style.left = (Math.random() * 50 + 25) + '%';
  p.style.top = '38%';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1000);
}
function milestone(n) {
  const o = document.createElement('div');
  o.className = 'milestone';
  o.innerHTML = `<div class="milestone-inner"><div class="milestone-num">${n}</div><div class="milestone-text">Sätze geschafft – weiter so!</div></div>`;
  document.body.appendChild(o);
  sound('win'); flakeBurst();
  o.onclick = () => o.remove();
  setTimeout(() => o.remove(), 2200);
}

const LEAVES = [
  'M12 1.5l1.9 5.3 4.6-2.2-1.7 4.7 5.4.9-4.3 3.1 2 4.6-5.1-1.6L12 22.5l-2.8-6.2-5.1 1.6 2-4.6L1.8 10.2l5.4-.9-1.7-4.7 4.6 2.2z',
  'M12 2C6.5 6.5 4.8 12.4 12 22c7.2-9.6 5.5-15.5 0-20z',
  'M12 2c-2 2.5-5.5 3-5.5 7 0 1.6.8 2.6 1.6 3.3C6.6 13 5.6 14.4 5.6 16c0 3 3 4.6 6.4 6 3.4-1.4 6.4-3 6.4-6 0-1.6-1-3-2.5-3.7.8-.7 1.6-1.7 1.6-3.3 0-4-3.5-4.5-5.5-7z'
];
const LEAF_COLORS = ['#a2542b', '#b9853d', '#8e4a3a', '#6a4a7a', '#c08a58'];
function leafSVG(color) {
  const d = LEAVES[Math.floor(Math.random() * LEAVES.length)];
  return `<svg viewBox="0 0 24 24"><path d="${d}" fill="${color}"/><path d="M12 5v16" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" fill="none"/></svg>`;
}
function flakeSVG(color) {
  let arms = '';
  for (let a = 0; a < 180; a += 60) {
    arms += `<g transform="rotate(${a} 12 12)"><line x1="12" y1="2" x2="12" y2="22"/>
      <polyline points="9.5,4.5 12,7 14.5,4.5"/><polyline points="9.5,19.5 12,17 14.5,19.5"/></g>`;
  }
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${arms}</svg>`;
}
function buildDeco() {
  const layer = document.getElementById('deco');
  const make = (html, size, op, dur) => {
    const d = document.createElement('div');
    d.className = 'deco';
    d.innerHTML = html;
    d.style.setProperty('--x', (Math.random() * 98) + 'vw');
    d.style.setProperty('--y', (Math.random() * 95) + 'vh');
    d.style.setProperty('--s', size + 'px');
    d.style.setProperty('--o', op);
    d.style.setProperty('--d', dur + 's');
    d.style.setProperty('--delay', (-Math.random() * dur) + 's');
    d.style.setProperty('--sway', (Math.random() * 60 + 20) * (Math.random() < 0.5 ? -1 : 1) + 'px');
    d.style.setProperty('--rot', (Math.random() * 300 + 120) * (Math.random() < 0.5 ? -1 : 1) + 'deg');
    layer.appendChild(d);
  };
  for (let i = 0; i < 11; i++) make(leafSVG(LEAF_COLORS[i % LEAF_COLORS.length]), Math.random() * 16 + 18, (Math.random() * 0.14 + 0.16).toFixed(2), Math.random() * 18 + 30);
  for (let i = 0; i < 16; i++) make(flakeSVG(i % 3 ? '#8ea3bf' : '#a796b4'), Math.random() * 12 + 12, (Math.random() * 0.2 + 0.25).toFixed(2), Math.random() * 20 + 34);
}
function flakeBurst() {
  for (let i = 0; i < 36; i++) {
    const f = document.createElement('div');
    f.className = 'flake-burst';
    const size = Math.random() * 14 + 12;
    f.style.width = f.style.height = size + 'px';
    f.style.left = Math.random() * 100 + 'vw';
    f.innerHTML = Math.random() < 0.5 ? leafSVG(LEAF_COLORS[i % LEAF_COLORS.length]) : flakeSVG('#7f95b3');
    document.body.appendChild(f);
    const anim = f.animate([
      { transform: 'translateY(0) rotate(0deg)', opacity: 0.9 },
      { transform: `translate(${(Math.random() - 0.5) * 120}px, 105vh) rotate(${Math.random() * 540}deg)`, opacity: 0 }
    ], { duration: Math.random() * 1800 + 2200, easing: 'ease-in' });
    anim.onfinish = () => f.remove();
  }
}

document.addEventListener('DOMContentLoaded', init);
