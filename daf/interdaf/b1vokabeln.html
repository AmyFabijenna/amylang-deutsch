            {word: "zu guter Letzt", type: "Idiom", en: "finally", hu: "végül", it: "infine"},
            {word: "letzten Endes", type: "Idiom", en: "in the end", hu: "végső soron", it: "alla fine"},
            {word: "im Endeffekt", type: "Idiom", en: "in the end", hu: "végeredményben", it: "alla fine"},
            {word: "alles in allem", type: "Idiom", en: "all in all", hu: "összességében", it: "tutto sommato"},
            {word: "im Großen und Ganzen", type: "Idiom", en: "on the whole", hu: "egészében véve", it: "nel complesso"},
            {word: "Hand in Hand gehen", type: "Idiom", en: "to go hand in hand", hu: "kéz a kézben járni", it: "andare di pari passo"},
            {word: "Schritt für Schritt", type: "Idiom", en: "step by step", hu: "lépésről lépésre", it: "passo dopo passo"},
            {word: "von Fall zu Fall", type: "Idiom", en: "case by case", hu: "esetről esetre", it: "di volta in volta"},
            {word: "von Zeit zu Zeit", type: "Idiom", en: "from time to time", hu: "időről időre", it: "di tanto in tanto"},
            {word: "hin und wieder", type: "Idiom", en: "now and then", hu: "időnként", it: "di tanto in tanto"},
            {word: "ab und zu", type: "Idiom", en: "now and then", hu: "olykor", it: "ogni tanto"},
            {word: "so gut wie", type: "Idiom", en: "practically", hu: "gyakorlatilag", it: "praticamente"},
            {word: "mehr oder weniger", type: "Idiom", en: "more or less", hu: "többé-kevésbé", it: "più o meno"},
            {word: "früher oder später", type: "Idiom", en: "sooner or later", hu: "előbb vagy utóbb", it: "prima o poi"},
            {word: "so oder so", type: "Idiom", en: "either way", hu: "így vagy úgy", it: "comunque"},
            {word: "wie auch immer", type: "Idiom", en: "however", hu: "akárhogy is", it: "comunque"},
            {word: "was auch immer", type: "Idiom", en: "whatever", hu: "bármi is", it: "qualunque cosa"}
        ];

        // State variables
        let currentMode = 'flashcard';
        let currentFilter = 'all';
        let currentLanguage = 'en';
        let isReversed = false;
        let currentIndex = 0;
        let filteredVocab = [];
        let learnedWords = {};
        let isFlipped = false;
        let quizScore = {correct: 0, total: 0};

        // Initialize
        function init() {
            loadLearnedWords();
            filterVocab();
            renderContent();
        }

        // Load learned words from localStorage
        function loadLearnedWords() {
            const saved = localStorage.getItem('learnedWordsB1');
            if (saved) {
                learnedWords = JSON.parse(saved);
            }
        }

        // Save learned words to localStorage
        function saveLearnedWords() {
            localStorage.setItem('learnedWordsB1', JSON.stringify(learnedWords));
        }

        // Toggle learned status
        function toggleLearned(word, status) {
            learnedWords[word] = status;
            saveLearnedWords();
            renderContent();
        }

        // Filter vocabulary
        function filterVocab() {
            if (currentFilter === 'all') {
                filteredVocab = vocabData;
            } else if (currentFilter === 'learned') {
                filteredVocab = vocabData.filter(item => learnedWords[item.word]);
            } else if (currentFilter === 'unlearned') {
                filteredVocab = vocabData.filter(item => !learnedWords[item.word]);
            } else {
                filteredVocab = vocabData.filter(item => item.type === currentFilter);
            }
            
            // Shuffle for quiz mode
            if (currentMode === 'quiz') {
                filteredVocab = [...filteredVocab].sort(() => Math.random() - 0.5);
            }
            
            currentIndex = 0;
        }

        // Set mode
        function setMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            isFlipped = false;
            quizScore = {correct: 0, total: 0};
            
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            filterVocab();
            renderContent();
        }

        // Set filter
        function setFilter(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            filterVocab();
            renderContent();
        }

        // Set language
        function setLanguage(lang) {
            currentLanguage = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderContent();
        }

function toggleDirection() {
    isReversed = !isReversed;
    const directionText = document.getElementById('directionText');
    
    if (isReversed) {
        // Show the current foreign language in the emoji
        let flagEmoji = '🇬🇧';
        if (currentLanguage === 'hu') flagEmoji = '🇭🇺';
        if (currentLanguage === 'it') flagEmoji = '🇮🇹';
        directionText.textContent = `${flagEmoji} Fremdsprache → 🇩🇪 Deutsch`;
    } else {
        directionText.textContent = '🇩🇪 Deutsch → 🇬🇧 Fremdsprache';
    }
    
    renderContent();
}

        // Render content based on current mode
        function renderContent() {
            const container = document.getElementById('contentArea');
            
            if (filteredVocab.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #004d4d; font-size: 1.3em; padding: 40px;">Keine Vokabeln gefunden!</p>';
                return;
            }
            
            switch(currentMode) {
                case 'flashcard':
                    renderFlashcard(container);
                    break;
                case 'list':
                    renderList(container);
                    break;
                case 'quiz':
                    renderQuiz(container);
                    break;
            }
        }

        // Render flashcard mode
        function renderFlashcard(container) {
            if (filteredVocab.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #004d4d; font-size: 1.3em;">Keine Vokabeln gefunden!</p>';
                return;
            }

            const item = filteredVocab[currentIndex];
            
            // Vorderseite vs Rückseite bestimmen
            let frontSide, backSide;
            
            if (!isReversed) {
                // Normal: Deutsch → Fremdsprache
                frontSide = `
                    <div class="flashcard-word">${item.word}</div>
                    <div class="flashcard-type">${item.type}</div>
                    ${item.type === 'Nomen' ? `<p style="color: #666; margin-top: 15px; font-size: 0.9em;">Plural: ${item.plural}</p>` : ''}
                    ${item.type === 'Verb' ? `<p style="color: #666; margin-top: 15px; font-size: 0.9em;">Präteritum: ${item.preterite}<br>Perfekt: ${item.perfect}</p>` : ''}
                `;
                backSide = `<div class="flashcard-translation">${item[currentLanguage]}</div>`;
            } else {
                // Umgekehrt: Fremdsprache → Deutsch
                frontSide = `<div class="flashcard-word">${item[currentLanguage]}</div>`;
                backSide = `
                    <div class="flashcard-translation">${item.word}</div>
                    <div class="flashcard-type">${item.type}</div>
                    ${item.type === 'Nomen' ? `<p style="color: #666; margin-top: 15px; font-size: 0.9em;">Plural: ${item.plural}</p>` : ''}
                    ${item.type === 'Verb' ? `<p style="color: #666; margin-top: 15px; font-size: 0.9em;">Präteritum: ${item.preterite}<br>Perfekt: ${item.perfect}</p>` : ''}
                `;
            }
            
            container.innerHTML = `
                <div class="flashcard-container">
                    <div class="flashcard" onclick="flipCard()">
                        ${isFlipped ? backSide : frontSide}
                        <p style="margin-top: 20px; color: #999; font-size: 0.9em;">Klicken zum Umdrehen</p>
                    </div>
                    <div class="flashcard-controls">
                        <button class="flashcard-btn" onclick="previousCard()">◀ Zurück</button>
                        <button class="flashcard-btn unknown" onclick="markUnknown()">❌ Nicht gewusst</button>
                        <button class="flashcard-btn known" onclick="markKnown()">✅ Gewusst</button>
                        <button class="flashcard-btn" onclick="nextCard()">Weiter ▶</button>
                    </div>
                    <p style="text-align: center; margin-top: 20px; color: #004d4d; font-weight: bold;">
                        Karte ${currentIndex + 1} von ${filteredVocab.length}
                    </p>
                </div>
            `;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            renderContent();
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % filteredVocab.length;
            isFlipped = false;
            renderContent();
        }

        function previousCard() {
            currentIndex = currentIndex === 0 ? filteredVocab.length - 1 : currentIndex - 1;
            isFlipped = false;
            renderContent();
        }

        function markKnown() {
            toggleLearned(filteredVocab[currentIndex].word, true);
            nextCard();
        }

        function markUnknown() {
            toggleLearned(filteredVocab[currentIndex].word, false);
            nextCard();
        }

        // Render list mode
        function renderList(container) {
            let html = '<div class="vocab-list">';
            
            filteredVocab.forEach(item => {
                const isLearned = learnedWords[item.word];
                html += `
                    <div class="vocab-item ${isLearned ? 'learned' : ''}">
                        <div class="vocab-german">
                            ${item.word}
                            <span class="vocab-type">${item.type}</span>
                        </div>
                        <div class="vocab-details">${getDetails(item)}</div>
                        <div class="vocab-translation">
                            ${getTranslationLabel()}: ${item[currentLanguage]}
                        </div>
                        <div class="vocab-actions">
                            ${!isLearned ? 
                                `<button class="action-btn mark-learned" onclick='toggleLearned("${item.word.replace(/'/g, "\\\'")}", true)'>✅ Als gelernt markieren</button>` :
                                `<button class="action-btn mark-unlearned" onclick='toggleLearned("${item.word.replace(/'/g, "\\\'")}", false)'>❌ Als ungelernt markieren</button>`
                            }
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Render quiz mode
        function renderQuiz(container) {
            if (currentIndex >= filteredVocab.length) {
                container.innerHTML = `
                    <div class="quiz-container">
                        <div class="quiz-score">
                            🎉 Quiz abgeschlossen! 🎉<br><br>
                            Ergebnis: ${quizScore.correct} von ${quizScore.total} richtig<br>
                            (${Math.round(quizScore.correct / quizScore.total * 100)}%)
                        </div>
                        <button class="flashcard-btn" onclick="restartQuiz()" style="display: block; margin: 20px auto;">Quiz neu starten</button>
                    </div>
                `;
                return;
            }

            const item = filteredVocab[currentIndex];
            const options = generateQuizOptions(item);
            
            const question = isReversed ? item[currentLanguage] : item.word;
            const correctAnswer = isReversed ? item.word : item[currentLanguage];
            const questionLang = isReversed ? getLanguageName() : 'Deutsch';
            const answerLang = isReversed ? 'Deutsch' : getLanguageName();
            
            container.innerHTML = `
                <div class="quiz-container">
                    <div class="quiz-score">Frage ${currentIndex + 1} von ${filteredVocab.length} | Richtig: ${quizScore.correct}/${quizScore.total}</div>
                    <div class="quiz-question">
                        <div class="quiz-word">${question}</div>
                        <p style="text-align: center; color: #666; margin-bottom: 20px;">Was bedeutet das auf ${answerLang}?</p>
                        <div class="quiz-options" id="quizOptions">
                            ${options.map((opt, idx) => `
                                <div class="quiz-option" data-answer="${opt}" onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${correctAnswer.replace(/'/g, "\\'")}', ${idx})">${opt}</div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function generateQuizOptions(correctItem) {
            const answerLanguage = isReversed ? 'word' : currentLanguage;
            const correctAnswer = isReversed ? correctItem.word : correctItem[currentLanguage];
            
            const options = [correctAnswer];
            const sameType = vocabData.filter(v => v.type === correctItem.type && v.word !== correctItem.word);
            
            while (options.length < 4 && sameType.length > 0) {
                const randomIndex = Math.floor(Math.random() * sameType.length);
                const randomOption = isReversed ? sameType[randomIndex].word : sameType[randomIndex][currentLanguage];
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
                sameType.splice(randomIndex, 1);
            }
            
            while (options.length < 4) {
                const randomItem = vocabData[Math.floor(Math.random() * vocabData.length)];
                const randomOption = isReversed ? randomItem.word : randomItem[currentLanguage];
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }
            
            return options.sort(() => Math.random() - 0.5);
        }

        // KORRIGIERTE checkAnswer Funktion
        function checkAnswer(selected, correct, optionIndex) {
            const options = document.querySelectorAll('.quiz-option');
            const clickedOption = options[optionIndex];
            
            // Wenn bereits eine Animation läuft, ignoriere weitere Klicks
            if (clickedOption.classList.contains('animating')) {
                return;
            }
            
            // Wenn die Frage bereits beantwortet wurde (eine grüne Antwort existiert), ignoriere weitere Klicks
            const alreadyAnswered = Array.from(options).some(opt => opt.classList.contains('correct'));
            if (alreadyAnswered) {
                return;
            }
            
            if (selected === correct) {
                // RICHTIGE Antwort
                quizScore.total++;
                quizScore.correct++;
                clickedOption.classList.add('correct');
                clickedOption.classList.add('animating');
                toggleLearned(filteredVocab[currentIndex].word, true);
                
                // Alle Optionen deaktivieren
                options.forEach(opt => opt.style.pointerEvents = 'none');
                
                // Nach 1 Sekunde grün zur nächsten Frage springen
                setTimeout(() => {
                    currentIndex++;
                    renderContent();
                }, 1000);
            } else {
                // FALSCHE Antwort - kurz rot blinken lassen
                clickedOption.classList.add('incorrect');
                clickedOption.classList.add('animating');
                
                // Alle Optionen temporär deaktivieren während der Animation
                options.forEach(opt => opt.style.pointerEvents = 'none');
                
                // Nach 1 Sekunde: rot entfernen, Optionen wieder aktivieren
                setTimeout(() => {
                    clickedOption.classList.remove('incorrect');
                    clickedOption.classList.remove('animating');
                    
                    // Alle Optionen wieder aktivieren
                    options.forEach(opt => opt.style.pointerEvents = 'auto');
                }, 1000);
            }
        }

        function restartQuiz() {
            currentIndex = 0;
            quizScore = {correct: 0, total: 0};
            filterVocab();
            renderContent();
        }

        // Helper functions
        function getDetails(item) {
            switch(item.type) {
                case 'Nomen':
                    return `Plural: ${item.plural}`;
                case 'Verb':
                    return `Präteritum: ${item.preterite}<br>Perfekt: ${item.perfect}`;
                default:
                    return '';
            }
        }

        function getTranslationLabel() {
            switch(currentLanguage) {
                case 'en': return '🇬🇧 English';
                case 'hu': return '🇭🇺 Magyar';
                case 'it': return '🇮🇹 Italiano';
                default: return '';
            }
        }

        function getLanguageName() {
            switch(currentLanguage) {
                case 'en': return 'Englisch';
                case 'hu': return 'Ungarisch';
                case 'it': return 'Italienisch';
                default: return '';
            }
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
