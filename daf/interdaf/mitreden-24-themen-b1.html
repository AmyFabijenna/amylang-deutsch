<!DOCTYPE html>
<html lang="de">
<head>
<script src="/daf/interdaf/passwort.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitreden auf Deutsch – 24 Gesprächsthemen (B1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec; --card:#fffdf9; --ink:#1c1c1f; --muted:#5b5a66; --line:#e4ded4;
  --blue:#34557a; --blue-soft:#e6edf5;
  --lilac:#664d7a; --lilac-soft:#efe9f3;
  --petrol:#2e6577; --petrol-soft:#e3eff2;
  --plum:#7a4a5e; --plum-soft:#f4e9ee;
  --slate:#4a5876; --slate-soft:#e8ebf2;
  --ok:#2e6577; --ok-soft:#e1eef1;
  --bad:#9b4458; --bad-soft:#f6e6ea;
  --accent:var(--blue); --accent-soft:var(--blue-soft);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,sans-serif;font-size:19px;line-height:1.6;font-weight:300}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-weight:500;line-height:1.25;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header.top{background:linear-gradient(135deg,#2f4c6e 0%,#4d4470 60%,#5f4a6e 100%);color:#fff;padding:46px 0 40px}
header.top h1{font-size:2.1rem;letter-spacing:.2px}
header.top p{margin:.6rem 0 0;opacity:.92;max-width:760px;font-size:1.05rem}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.legend span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 14px;font-size:.85rem}
main{padding:34px 0 90px}
/* Startseite */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;text-align:left;position:relative;transition:transform .15s,box-shadow .15s;border-top:6px solid var(--c)}
.tcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(40,40,70,.10)}
.tcard .nr{font-size:.85rem;color:var(--c);font-weight:500;letter-spacing:.5px}
.tcard h3{font-size:1.18rem;margin:.25rem 0 .4rem}
.tcard p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.5}
.tcard .prog{margin-top:14px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.tcard .prog i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
/* Themenansicht */
.back{background:none;border:none;color:var(--muted);padding:0;margin-bottom:14px;font-size:.95rem}
.back:hover{color:var(--ink)}
.thead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.thead .nr{color:var(--accent);font-weight:500;font-size:.9rem;letter-spacing:.5px}
.thead h2{font-size:1.85rem}
.thead p{margin:.3rem 0 0;color:var(--muted)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 26px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:999px}
.steps button{border:none;background:none;border-radius:999px;padding:8px 15px;font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:7px}
.steps button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);font-size:.75rem;color:var(--ink)}
.steps button.done .n{background:var(--accent);color:#fff}
.steps button.on{background:var(--accent);color:#fff}
.steps button.on .n{background:rgba(255,255,255,.25);color:#fff}
.steps .sep{width:1px;background:var(--line);margin:4px 4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 30px}
.panel h3{font-size:1.3rem;margin-bottom:.35rem}
.hint{color:var(--muted);margin:0 0 22px;font-size:.95rem}
.nav{display:flex;justify-content:space-between;margin-top:26px;gap:12px}
.btn{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:11px 22px;font-size:.95rem;font-weight:400}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
/* Wortkarten */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.wcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;min-height:150px;position:relative;text-align:left;width:100%}
.wcard .term{font-weight:500;font-size:1.12rem;color:var(--accent)}
.wcard .back-side{display:none;margin-top:8px}
.wcard.open .back-side{display:block}
.wcard.open{background:var(--accent-soft);border-color:transparent}
.wcard .def{font-size:.95rem}
.wcard .ex{font-size:.92rem;color:var(--muted);font-style:italic;margin-top:6px}
.wcard .tap{font-size:.8rem;color:var(--muted);margin-top:10px}
.wcard.open .tap{display:none}
.spk{border:none;background:var(--accent-soft);color:var(--accent);width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;flex:0 0 auto}
.spk:hover{background:var(--accent);color:#fff}
.spk svg{width:17px;height:17px}
.wcard .spk{position:absolute;top:12px;right:12px}
/* Quiz */
.q{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;background:#fff}
.q .prompt{font-weight:400;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
.q .prompt .qn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.85rem;font-weight:500;margin-top:2px}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 15px;font-size:.97rem;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:12px;padding:12px 15px;border-radius:12px;font-size:.93rem;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb b{font-weight:500}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:500;padding:0 6px}
.blank.filled{border-bottom-color:var(--ok);color:var(--ok)}
.score{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 14px;font-size:.88rem;margin-bottom:16px}
/* Zuordnen */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:14px 22px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 15px;font-size:.95rem}
.mi.term{font-weight:500;color:var(--accent)}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.paired{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mi.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* Lückentext */
.gaptext{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px;font-size:1.05rem;line-height:2.05;margin-bottom:20px}
.gaprow{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;border-top:1px dashed var(--line);padding:14px 0}
.gaprow .lbl{font-weight:500;color:var(--accent);padding-top:8px}
.gaprow .opts{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
/* Baukasten */
.slots{display:grid;gap:14px}
.slot .sl{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:.95rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sentence{margin-top:22px;background:var(--accent-soft);border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:center;min-height:70px}
.sentence .txt{font-size:1.15rem;font-weight:400;flex:1}
.sentence .txt .ph{color:var(--muted);font-weight:300}
.note{margin-top:16px;font-size:.92rem;color:var(--muted);border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.collected{margin-top:18px}
.collected li{margin-bottom:4px}
/* Gespräch */
.talk{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.aside{position:sticky;top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-height:calc(100vh - 36px);overflow:auto}
.aside h4{margin:0 0 10px;font-weight:500;font-size:1rem;color:var(--accent)}
.aside .wl{list-style:none;margin:0 0 18px;padding:0}
.aside .wl li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.4}
.aside .wl li b{font-weight:500;display:block}
.aside .wl li span{color:var(--muted);font-size:.82rem}
.aside .ph li{font-size:.88rem}
.tabs2{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs2 button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-size:.92rem}
.tabs2 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lvlhead{margin:4px 0 14px;font-size:1.1rem}
.lvlhead small{display:block;color:var(--muted);font-weight:300;font-size:.88rem}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;transition:opacity .2s}
.qcard.did{opacity:.55}
.qcard .qt{display:flex;gap:12px;align-items:flex-start}
.qcard .qt .qn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:500}
.qcard .qt .tx{flex:1;font-size:1.05rem;font-weight:400}
.qcard .acts{display:flex;gap:8px;margin-top:12px;padding-left:42px;flex-wrap:wrap}
.small{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:.85rem}
.small.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.helps{display:none;padding-left:42px;margin-top:10px;flex-wrap:wrap;gap:8px}
.helps.show{display:flex}
.helps span{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:.9rem}
/* Spickzettel-Schublade */
#fab{position:fixed;right:22px;bottom:22px;border:none;background:var(--accent);color:#fff;border-radius:999px;padding:13px 22px;font-size:.95rem;box-shadow:0 8px 24px rgba(30,30,60,.22);display:none;z-index:20}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,92vw);background:var(--card);box-shadow:-10px 0 30px rgba(30,30,60,.18);transform:translateX(105%);transition:transform .25s;z-index:30;padding:24px;overflow:auto}
#drawer.open{transform:none}
#drawer .close{float:right;border:none;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:.85rem}
#drawer h4{margin:0 0 14px;font-weight:500;color:var(--accent)}
#drawer ul{list-style:none;padding:0;margin:0}
#drawer li{padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem;line-height:1.45}
#drawer li b{font-weight:500;display:block}
#drawer li span{color:var(--muted);font-size:.85rem}
@media (max-width:900px){
  .talk{grid-template-columns:1fr}
  .aside{position:static;max-height:none}
  .match{grid-template-columns:1fr}
  .panel{padding:22px 18px}
  .steps{border-radius:18px}
  body{font-size:18px}
}
/* Weiter-Modus */
.wmode{display:inline-flex;background:var(--accent-soft);border-radius:999px;padding:3px;gap:2px;align-items:center;vertical-align:middle}
.wmode button{border:0;background:transparent;border-radius:999px;padding:5px 13px;font-size:.82rem;color:var(--accent);font-weight:400}
.wmode button.on{background:var(--accent);color:#fff}
header.top .wmode{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
header.top .wmode button{color:#fff}
header.top .wmode button.on{background:#fff;color:#2f4c6e}
.modeline{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.modeline .score{margin:0}
.fb.try{background:var(--plum-soft)}
.fb .nextrow{display:flex;justify-content:flex-end;margin-top:10px;gap:12px;align-items:center}
.fb .hold{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.82rem;padding:0}
.fb .cd{height:4px;border-radius:4px;background:rgba(0,0,0,.07);overflow:hidden;margin-top:10px}
.fb .cd i{display:block;height:100%;width:100%;background:var(--ok);animation:cdrun linear forwards}
@keyframes cdrun{from{width:100%}to{width:0}}
.q.nextup,.gaprow.nextup{box-shadow:0 0 0 3px var(--accent-soft);border-radius:16px;transition:box-shadow .3s}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Mitreden auf Deutsch</h1>
    <p>24 Gesprächsthemen für Niveau B1. Zuerst sammelst du die Wörter, die du für das Thema brauchst. Dann sprichst du frei, mit deinem Spickzettel immer neben dir.</p>
    <div class="legend"><span>1–7 Wortschatz aufbauen</span><span>8 Gespräch: 7 leichte + 7 komplexe Fragen</span><span>🔊 nur auf Klick</span><span class="wmode"><button data-m="auto">sofort weiter</button><button data-m="manual">erst Erklärung, dann Weiter</button></span></div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<button id="fab" onclick="openDrawer()">Spickzettel</button>
<aside id="drawer" aria-label="Spickzettel"></aside>

<script>
const PHRASES = [

  "Das erinnert mich an …",
  "Wie soll ich sagen … ",
  "Mit anderen Worten: …",
  "Ich bin mir nicht ganz sicher, aber …",
  "Da hast du recht. / Da bin ich anderer Meinung.",
  "Was ich damit meine: …",

];

const TOPICS = [
/* ============ 1 ============ */
{t:"Heimatstadt & Herkunft", s:"Von der eigenen Stadt erzählen, so dass andere sie vor sich sehen.",
w:[
["die Altstadt","der alte, historische Teil einer Stadt","Am Abend ist die Altstadt wunderschön beleuchtet."],
["liegen","sich an einem Ort befinden (Städte, Länder, Orte)","Meine Stadt liegt im Süden, nicht weit vom Meer."],
["die Gegend","das Gebiet rund um einen Ort","In der Gegend gibt es viele kleine Dörfer und Strände."],
["bekannt sein für","wegen einer bestimmten Sache berühmt sein","Die Stadt ist für ihre Barockkirchen bekannt."],
["die Sehenswürdigkeit","ein Ort, den Besucher unbedingt sehen sollten","Die wichtigste Sehenswürdigkeit ist das alte Amphitheater."],
["die Spezialität","ein typisches Essen oder Getränk aus einer Region","Dieses Gebäck ist eine Spezialität aus meiner Stadt."],
["aufwachsen","als Kind an einem Ort leben und groß werden","Ich bin in einer kleinen Stadt im Süden aufgewachsen."],
["lebendig","voller Menschen und Aktivität","Im Sommer ist die Innenstadt bis spät in die Nacht lebendig."],
["die Stimmung","die Atmosphäre, das Gefühl an einem Ort","Auf der Piazza ist die Stimmung am Abend entspannt."],
["etwas vermissen","traurig sein, weil etwas fehlt","Ich vermisse das Meer und den Kaffee in der Bar."],
["Heimweh haben","große Sehnsucht nach der Heimat haben","Im Winter habe ich manchmal ein bisschen Heimweh."],
["stolz sein auf","ein gutes Gefühl wegen etwas haben, das zu einem gehört","Ich bin stolz auf meine Stadt und ihre Geschichte."]
],
m:[
["„Im Sommer ist die Altstadt sehr lebendig.“",["Es sind viele Menschen unterwegs, und es ist viel los.","Die Altstadt wird im Sommer renoviert.","Im Sommer ist es in der Altstadt sehr ruhig.","Die Altstadt ist im Sommer für Autos gesperrt."],"„Lebendig“ beschreibt einen Ort, an dem viel passiert: Menschen, Musik, offene Bars."],
["„Ich bin am Meer aufgewachsen.“",["Ich habe meine Kindheit am Meer verbracht.","Ich bin heute früh am Meer aufgewacht.","Ich wohne erst seit kurzem am Meer.","Ich fahre jeden Sommer ans Meer."],"<b>aufwachsen</b> heißt: als Kind groß werden. Vorsicht bei <b>aufwachen</b>, das heißt: nach dem Schlafen die Augen öffnen."],
["„Ich habe Heimweh.“",["Ich vermisse meine Heimat und wäre gern dort.","Ich habe Probleme mit meiner Wohnung.","Ich bin gerade zu Hause und fühle mich wohl.","Ich habe keine Lust, nach Hause zu fahren."],"Heimweh ist die Sehnsucht nach der Heimat. Man hat es, wenn man weit weg ist."],
["„Die Stadt ist für ihre Kirchen bekannt.“",["Viele Menschen kennen die Stadt wegen ihrer Kirchen.","Die Stadt kennt sich mit Kirchen besonders gut aus.","In der Stadt gibt es nur wenige Kirchen.","Die Kirchen der Stadt sind ganz neu gebaut."],"„bekannt sein für“ heißt: Die Leute kennen die Stadt wegen dieser Sache. „Sich auskennen“ hat eine andere Bedeutung, nämlich: viel über etwas wissen."]
],
c:[
["Meine Stadt ___ im Süden, etwa zehn Kilometer vom Meer entfernt.",["liegt","steht","sitzt"],"Städte, Länder und Orte <b>liegen</b>. „Stehen“ verwendet man für Gebäude: Die Kirche steht am Hauptplatz."],
["Ich habe meine ganze Kindheit dort ___.",["verbracht","gemacht","geführt"],"Zeit <b>verbringt</b> man: die Kindheit, den Urlaub, das Wochenende verbringen."],
["Ich bin sehr stolz ___ meine Stadt.",["auf","über","für"],"Die feste Verbindung ist <b>stolz sein auf</b> + Akkusativ."],
["Wenn Freunde mich besuchen, ___ ich ihnen zuerst die Altstadt.",["zeige","sehe","schaue"],"Man <b>zeigt</b> jemandem etwas (Dativ + Akkusativ): Ich zeige ihnen die Altstadt."]
],
r:[
["Jemand sagt: „Von deiner Stadt habe ich noch nie gehört.“ Du möchtest freundlich etwas über sie erzählen.",["Das glaube ich dir, sie ist eher klein. Sie liegt im Süden, direkt am Meer.","Das stimmt nicht, jeder kennt meine Stadt.","Ich weiß, meine Stadt ist nicht wichtig."],"Diese Antwort ist freundlich, nimmt die Aussage ernst und gibt gleich eine konkrete Information. So beginnt ein Gespräch."],
["Ein Kollege fragt: „Was sollte ich in deiner Stadt unbedingt sehen?“",["Auf jeden Fall die Altstadt, am besten am Abend, wenn alles beleuchtet ist.","Ich habe die Altstadt schon oft gesehen.","Ja, ich sehe sie sehr gern."],"„Auf jeden Fall …“ ist eine starke, klare Empfehlung. Mit einem Detail („am besten am Abend“) wird sie persönlich."],

]},
b:{s:[["In meiner Heimatstadt","Im Sommer","Am Sonntagabend"],["trifft man sich","sitzt man gern"],["mit Freunden","mit der ganzen Familie","bis spät in die Nacht"],["auf der Piazza.","am Hafen.","in einer kleinen Bar."]],
n:"Wenn der Satz mit einer Zeit oder einem Ort beginnt, kommt das Verb sofort danach (Position 2), dann „man“. Mit „man“ beschreibst du, was alle Leute normalerweise machen."},

["Eine neue Bekannte fragt: „Wie sieht es eigentlich bei dir zu Hause aus?“ Du willst die Landschaft so beschreiben, dass sie ein Bild vor Augen hat.",["Stell dir sanfte Hügel vor, mit Weinbergen und kleinen Dörfern, und am Horizont siehst du das Meer.","Ganz anders als hier, das kann man kaum beschreiben. Du musst einmal hinfahren.","Sehr schön, wirklich, eine der schönsten Gegenden, die ich kenne."],"Mit „Stell dir … vor“ und konkreten Bildern (Hügel, Weinberge, Meer) entsteht ein Bild im Kopf. Die anderen Antworten bewerten nur, beschreiben aber nichts."],
["Auf einer Wanderung fragst du einen Einheimischen, ob der Weg zum See für dich passt. Du hast nur Turnschuhe an und zwei Stunden Zeit.",["Entschuldigung, schafft man den Weg zum See in zwei Stunden hin und zurück, auch mit Turnschuhen?","Entschuldigung, wie lange braucht man ungefähr bis zum Gipfel?","Entschuldigung, ist der Weg zum See gut markiert?"],"Die erste Frage enthält beide wichtigen Informationen: deine Zeit und deine Schuhe. Nur so bekommst du eine Antwort, die dir wirklich hilft."]

{t:"Kunst & Museum", s:"Über Museen, Ausstellungen und Bilder sprechen, auch ohne Kunstexperte zu sein.",

r:[
["Eine Freundin zeigt dir stolz ein Bild, das sie gemalt hat. Dir gefallen vor allem die Farben, das Motiv berührt dich weniger. Du willst ehrlich und trotzdem herzlich sein.",["Die Farben finde ich wirklich toll, vor allem das Blau. Was wolltest du damit ausdrücken?","Wow, das ist wunderschön, mir gefällt einfach alles daran!","Ehrlich gesagt sagt mir das Motiv nicht so viel, aber du hast sicher viel Arbeit hineingesteckt."],"Die erste Antwort lobt ehrlich, was dir gefällt, und lädt sie mit einer Frage ein, zu erzählen. Die zweite ist nicht ehrlich, die dritte ist ehrlich, aber nicht herzlich."],
["Im Museum steht jemand schon lange vor demselben Bild wie du. Du möchtest ein Gespräch beginnen, ohne aufdringlich zu sein.",["Faszinierend, oder? Ich komme von diesem Bild gar nicht los.","Entschuldigung, wissen Sie zufällig, wie viel dieses Bild wert ist?","Entschuldigung, kennen Sie sich mit diesem Maler aus? Können Sie mir mehr darüber erzählen?"],"Ein kurzer, persönlicher Eindruck mit „oder?“ lädt zum Gespräch ein, ohne zu drängen. Die anderen Fragen verlangen gleich viel vom anderen."],
["Ein Kollege fragt, ob du am Samstag mit ins Museum gehst. Du hast Lust, möchtest aber nicht den ganzen Tag dort verbringen.",["Gern! Lass uns aber nur zwei, drei Säle anschauen und danach ins Museumscafé gehen.","Gern, ich gehe sehr gern ins Museum, egal wie lange.","Ins Museum? Lieber nicht, das dauert bei mir immer ewig."],"Zusage plus konkreter Vorschlag: So sagst du Ja und bestimmst trotzdem mit, wie lange es dauert."]

["„Da hast du aber Schwein gehabt!“",["Du hattest großes Glück.","Du hast dich unhöflich benommen.","Du hast zu viel gegessen.","Du hast einen großen Fehler gemacht."],"Das Schwein ist im Deutschen ein Glückssymbol, zu Silvester verschenkt man sogar kleine Glücksschweinchen. <b>Schwein haben</b> heißt also: Glück haben."],
["„Ich steh grad auf dem Schlauch.“",["Ich verstehe gerade etwas Einfaches nicht.","Ich habe gerade keine Zeit.","Ich bin gerade sehr müde.","Ich warte gerade auf jemanden."],"Wer auf dem Gartenschlauch steht, blockiert das Wasser. Genauso blockiert gerade der Gedanke. Eine sympathische Art zu sagen: Ich komme gerade nicht drauf."],

],

],
r:[
["Auf einer Party in Wien sagt jemand zu dir: „Na, wie geht's? Passt eh alles?“ Du willst locker und ein bisschen österreichisch antworten.",["Passt eh, danke! Und bei dir?","Ja, danke, es geht mir sehr gut. Wie geht es Ihnen?","Ja, alles ist richtig, danke."],"<b>Passt eh</b> ist typisch österreichisch und genau der richtige lockere Ton. Die zweite Antwort ist korrekt, aber viel zu förmlich für eine Party."],
["Ein Freund erzählt, dass sein Flug gestrichen wurde, er aber noch den letzten freien Platz im Zug bekommen hat. Du willst mit einer Redewendung reagieren.",["Da hast du aber Schwein gehabt!","Da hast du aber Tomaten auf den Augen gehabt!","Da hast du den Nagel auf den Kopf getroffen!"],"Er hatte Glück, und dafür sagt man <b>Schwein haben</b>. Die anderen Redewendungen gibt es auch, sie bedeuten aber etwas ganz anderes."],

/* ================= Logik ================= */
const COLORS=[["#34557a","#e6edf5"],["#664d7a","#efe9f3"],["#2e6577","#e3eff2"],["#7a4a5e","#f4e9ee"],["#4a5876","#e8ebf2"],["#5a4f86","#ebe8f4"]];
const STEPS=[["Wortkarten","karten"],["Zuordnen","zuordnen"],["Was bedeutet das?","bedeutung"],["Welches Wort passt?","passt"],["Lückentext","luecke"],["Wie reagierst du?","reaktion"],["Satzbaukasten","bau"],["Gespräch","gespraech"]];
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
let cur=null, step=0;
let store={};
try{store=JSON.parse(localStorage.getItem("mitreden-b1")||"{}")}catch(e){store={}}
function save(){try{localStorage.setItem("mitreden-b1",JSON.stringify(store))}catch(e){}}
function mark(ti,si){store[ti]=store[ti]||{};store[ti][si]=1;save();}
function isDone(ti,si){return store[ti]&&store[ti][si]}
const app=document.getElementById("app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function plain(s){const d=document.createElement("div");d.innerHTML=s;return d.textContent}
function say(t){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(plain(t).replace(/___/g,"…"));
  u.lang="de-DE";u.rate=0.92;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("de"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function spkBtn(text){return `<button class="spk" title="Vorlesen" onclick="event.stopPropagation();say(${JSON.stringify(text).replace(/"/g,'&quot;')})">${SPK}</button>`}
/* ---------- Weiter-Modus ---------- */
let ADV="auto";try{ADV=localStorage.getItem("weiterModus")||"auto"}catch(e){}
let advT=null;function clearAdv(){if(advT){clearTimeout(advT);advT=null}}
const SEGM='<span class="wmode"><button data-m="auto">sofort weiter</button><button data-m="manual">erst Erklärung, dann Weiter</button></span>';
function syncWM(){document.querySelectorAll(".wmode button").forEach(b=>{b.classList.toggle("on",b.dataset.m===ADV);b.onclick=()=>{ADV=b.dataset.m;try{localStorage.setItem("weiterModus",ADV)}catch(e){}syncWM()}})}
/* zur nächsten offenen Aufgabe weiterrücken – nur so weit, dass sie ganz zu sehen ist, nie an den Seitenanfang */
function bringNext(el){
  if(!el)return;
  el.classList.add("nextup");setTimeout(()=>el.classList.remove("nextup"),1600);
  const r=el.getBoundingClientRect();
  if(r.bottom>window.innerHeight-16){window.scrollBy({top:Math.min(r.top-16,r.bottom-window.innerHeight+30),behavior:"smooth"})}
  else if(r.top<0){window.scrollBy({top:r.top-16,behavior:"smooth"})}
  const f=el.querySelector(".opt:not(:disabled)");if(f)try{f.focus({preventScroll:true})}catch(e){}
}
/* nach richtiger Antwort: Countdown (sofort weiter) oder Weiter-Knopf */
function afterRight(fb,nextEl,late,expl){
  clearAdv();
  if(!nextEl)return;
  const go=()=>{clearAdv();const nr=fb.querySelector(".nextrow");if(nr)nr.remove();const c=fb.querySelector(".cd");if(c)c.remove();bringNext(nextEl)};
  if(ADV==="auto"){
    const L=plain(expl).length, ms=late?Math.min(9000,2800+L*40):Math.min(4500,1400+L*20);
    fb.insertAdjacentHTML("beforeend",`<div class="cd"><i style="animation-duration:${ms}ms"></i></div><div class="nextrow"><button class="hold" type="button">Moment, ich lese noch</button></div>`);
    fb.querySelector(".hold").onclick=()=>{clearAdv();fb.querySelector(".cd").remove();fb.querySelector(".nextrow").innerHTML='<button class="btn" type="button">Weiter →</button>';fb.querySelector(".nextrow .btn").onclick=go};
    advT=setTimeout(go,ms);
  }else{
    fb.insertAdjacentHTML("beforeend",'<div class="nextrow"><button class="btn" type="button">Weiter →</button></div>');
    fb.querySelector(".nextrow .btn").onclick=go;
  }
}
function setAccent(i){const c=COLORS[i%COLORS.length];document.documentElement.style.setProperty("--accent",c[0]);document.documentElement.style.setProperty("--accent-soft",c[1]);}

function home(){
  clearAdv();cur=null;document.getElementById("fab").style.display="none";closeDrawer();
  setAccent(0);
  app.innerHTML=`<div class="grid">${TOPICS.map((T,i)=>{
    const c=COLORS[i%COLORS.length][0];
    const d=STEPS.filter((s,si)=>isDone(i,si)).length;
    return `<button class="tcard" style="--c:${c}" onclick="openTopic(${i},0)">
      <div class="nr">THEMA ${i+1}</div><h3>${esc(T.t)}</h3><p>${esc(T.s)}</p>
      <div class="prog"><i style="width:${Math.round(d/STEPS.length*100)}%"></i></div></button>`}).join("")}</div>`;
  window.scrollTo(0,0);
}

function openTopic(i,s){cur=i;step=s;setAccent(i);render();window.scrollTo({top:0});}
function go(s){step=s;render();window.scrollTo({top:document.querySelector(".thead").offsetTop-10});}

function render(){
  clearAdv();
  const T=TOPICS[cur];
  document.getElementById("fab").style.display=step===7?"none":"block";
  fillDrawer();
  let tabs=STEPS.map((s,si)=>`${si===7?'<span class="sep"></span>':''}<button class="${si===step?'on':''} ${isDone(cur,si)?'done':''}" onclick="go(${si})"><span class="n">${isDone(cur,si)?'✓':si+1}</span>${s[0]}</button>`).join("");
  app.innerHTML=`<button class="back" onclick="home()">← Alle Themen</button>
  <div class="thead"><div><div class="nr">THEMA ${cur+1} VON ${TOPICS.length}</div><h2>${esc(T.t)}</h2><p>${esc(T.s)}</p></div></div>
  <nav class="steps">${tabs}</nav><section id="stage"></section>`;
  const st=document.getElementById("stage");
  [karten,zuordnen,bedeutung,passt,luecke,reaktion,bau,gespraech][step](st,T);
  syncWM();
}
function navBtns(){
  return `<div class="nav"><button class="btn ghost" ${step===0?'disabled':''} onclick="go(${step-1})">← Zurück</button>
  ${step<7?`<button class="btn" onclick="go(${step+1})">Weiter: ${STEPS[step+1][0]} →</button>`:`<button class="btn" onclick="${cur<TOPICS.length-1?`openTopic(${cur+1},0)`:'home()'}">${cur<TOPICS.length-1?'Nächstes Thema →':'Zur Übersicht'}</button>`}</div>`;
}

/* 1 Wortkarten */
function karten(st,T){
  st.innerHTML=`<div class="panel"><h3>Wortkarten</h3><p class="hint">Lies das Wort und überleg kurz, was es bedeutet. Dann klick auf die Karte. Mit 🔊 hörst du den Beispielsatz.</p>
  <div style="margin-bottom:16px"><button class="small" id="allopen">Alle aufdecken</button></div>
  <div class="cards">${T.w.map((w,i)=>`<div class="wcard" role="button" tabindex="0" data-i="${i}">
   ${spkBtn(w[0]+". "+w[2])}
   <div class="term">${esc(w[0])}</div>
   <div class="back-side"><div class="def">${esc(w[1])}</div><div class="ex">${esc(w[2])}</div></div>
   <div class="tap">Klick zum Aufdecken</div></div>`).join("")}</div>${navBtns()}</div>`;
  let opened=new Set();
  st.querySelectorAll(".wcard").forEach(c=>c.onclick=()=>{c.classList.toggle("open");opened.add(c.dataset.i);if(opened.size===T.w.length)mark(cur,0);});
  st.querySelector("#allopen").onclick=()=>{st.querySelectorAll(".wcard").forEach(c=>c.classList.add("open"));mark(cur,0);};
}

/* 2 Zuordnen */
function zuordnen(st,T){
  const pick=shuffle(T.w.map((w,i)=>i)).slice(0,6);
  const right=shuffle(pick);
  st.innerHTML=`<div class="panel"><h3>Zuordnen</h3><p class="hint">Klick zuerst links auf ein Wort und dann rechts auf die passende Erklärung. Mit „Neue Runde“ kommen andere Wörter.</p>
  <span class="score" id="msc">0 von 6 Paaren</span>
  <div class="match"><div class="mcol">${pick.map(i=>`<button class="mi term" data-i="${i}">${esc(T.w[i][0])}</button>`).join("")}</div>
  <div class="mcol">${right.map(i=>`<button class="mi" data-i="${i}">${esc(T.w[i][1])}</button>`).join("")}</div></div>
  <div class="fb" id="mfb"></div>
  <div style="margin-top:18px"><button class="small" id="again">Neue Runde</button></div>${navBtns()}</div>`;
  let sel=null,done=0;const fb=st.querySelector("#mfb");
  st.querySelectorAll(".mi.term").forEach(b=>b.onclick=()=>{if(b.classList.contains("paired"))return;st.querySelectorAll(".mi.term").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b;});
  st.querySelectorAll(".mi:not(.term)").forEach(b=>b.onclick=()=>{
    if(!sel||b.classList.contains("paired"))return;
    const w=T.w[sel.dataset.i];
    if(b.dataset.i===sel.dataset.i){
      sel.classList.remove("sel");sel.classList.add("paired");b.classList.add("paired");done++;
      fb.className="fb show ok";fb.innerHTML=`<b>Richtig: ${esc(w[0])}</b>. Beispiel: <i>${esc(w[2])}</i>`;
      st.querySelector("#msc").textContent=done+" von 6 Paaren";sel=null;
      if(done===6){mark(cur,1);fb.innerHTML+=`<br><b>Alle Paare gefunden!</b>`}
    }else{
      b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);
      fb.className="fb show no";fb.innerHTML=`<b>Nicht ganz.</b> Diese Erklärung passt zu einem anderen Wort. Überleg noch einmal: Was bedeutet „${esc(w[0])}“ genau?`;
    }
  });
  st.querySelector("#again").onclick=()=>zuordnen(st,T);
}

/* generisches Multiple Choice */
function mcList(st,items,stepIdx,title,hint,isGap){
  st.innerHTML=`<div class="panel"><h3>${title}</h3><p class="hint">${hint}</p><div class="modeline"><span class="score" id="sc">0 von ${items.length} richtig</span>${SEGM}</div><div id="ql"></div>${navBtns()}</div>`;syncWM();
  const ql=st.querySelector("#ql");let answered=0,right=0;
  items.forEach((it,qi)=>{
    const [prompt,opts,expl]=it;
    const order=shuffle(opts.map((o,i)=>i));
    const d=document.createElement("div");d.className="q";
    const pr=isGap?esc(prompt).replace("___",'<span class="blank">?</span>'):esc(prompt);
    d.innerHTML=`<div class="prompt"><span class="qn">${qi+1}</span><span>${pr}</span></div>
      <div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(opts[i])}</button>`).join("")}</div><div class="fb"></div>`;
    ql.appendChild(d);
    let missed=false;
    d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.i==="0";const fb=d.querySelector(".fb");
      if(!ok){b.classList.add("wrong");b.disabled=true;missed=true;fb.className="fb show try";fb.innerHTML="<b>Nicht ganz – versuch es noch einmal.</b>";return}
      d.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("right");
      fb.className="fb show ok";
      fb.innerHTML=`<b>${missed?"Jetzt stimmt’s.":"Richtig."}</b> ${expl}`;
      if(isGap){const bl=d.querySelector(".blank");bl.textContent=opts[0];bl.classList.add("filled")}
      answered++;if(!missed)right++;
      st.querySelector("#sc").textContent=right+" von "+items.length+" richtig";
      if(answered===items.length)mark(cur,stepIdx);
      const open=[...ql.querySelectorAll(".q")].filter(x=>x.querySelector(".opt:not(:disabled)"));
      const nx=open.find(x=>x.compareDocumentPosition(d)&Node.DOCUMENT_POSITION_PRECEDING)||open[0];
      afterRight(fb,nx,missed,expl);
    });
  });
}
function bedeutung(st,T){mcList(st,T.m,2,"Was bedeutet das?","Lies den Satz und wähl die Bedeutung, die genau passt. Nach jeder Antwort bekommst du eine kurze Erklärung.",false)}
function passt(st,T){mcList(st,T.c,3,"Welches Wort passt?","Auf Deutsch gehören bestimmte Wörter fest zusammen, zum Beispiel „eine Entscheidung treffen“. Wähl das Wort, das in die Lücke passt.",true)}
function reaktion(st,T){mcList(st,T.r,5,"Wie reagierst du?","Lies die Situation. Welche Antwort passt am besten, inhaltlich und im Ton?",false)}

/* 5 Lückentext */
function luecke(st,T){
  const parts=T.g.x.split("___");
  let html="";parts.forEach((p,i)=>{html+=esc(p);if(i<parts.length-1)html+=`<span class="blank" id="b${i}">${i+1}</span>`});
  st.innerHTML=`<div class="panel"><h3>Lückentext</h3><p class="hint">Lies zuerst den ganzen Text. Dann wähl für jede Lücke das passende Wort. Mit 🔊 hörst du den fertigen Text.</p>
  <div class="modeline"><span class="score" id="sc">0 von ${T.g.o.length} richtig</span>${SEGM}</div>
  <div class="gaptext" style="display:flex;gap:14px;align-items:flex-start"><div style="flex:1" id="gt">${html}</div><span id="gspk"></span></div>
  <div id="rows"></div>${navBtns()}</div>`;
  const full=parts.map((p,i)=>p+(i<T.g.o.length?T.g.o[i][0][0]:"")).join("");
  st.querySelector("#gspk").innerHTML=spkBtn(full);
  const rows=st.querySelector("#rows");let answered=0,right=0;
  T.g.o.forEach((g,gi)=>{
    const [opts,expl]=g;const order=shuffle(opts.map((o,i)=>i));
    const r=document.createElement("div");r.className="gaprow";
    r.innerHTML=`<div class="lbl">Lücke ${gi+1}</div><div><div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(opts[i])}</button>`).join("")}</div><div class="fb"></div></div>`;
    rows.appendChild(r);
    let missed=false;
    r.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.i==="0";const fb=r.querySelector(".fb");
      if(!ok){b.classList.add("wrong");b.disabled=true;missed=true;fb.className="fb show try";fb.innerHTML="<b>Nicht ganz – versuch es noch einmal.</b>";return}
      r.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("right");
      fb.className="fb show ok";
      fb.innerHTML=`<b>${missed?"Jetzt stimmt’s.":"Richtig."}</b> ${expl}`;
      const bl=st.querySelector("#b"+gi);bl.textContent=opts[0];bl.classList.add("filled");
      answered++;if(!missed)right++;st.querySelector("#sc").textContent=right+" von "+T.g.o.length+" richtig";
      if(answered===T.g.o.length)mark(cur,4);
      const open=[...rows.querySelectorAll(".gaprow")].filter(x=>x.querySelector(".opt:not(:disabled)"));
      const nx=open.find(x=>x.compareDocumentPosition(r)&Node.DOCUMENT_POSITION_PRECEDING)||open[0];
      afterRight(fb,nx,missed,expl);
    });
  });
}

/* 7 Satzbaukasten */
function bau(st,T){
  const S=T.b.s;let choice=S.map(s=>s.length===1?0:-1);const made=[];
  st.innerHTML=`<div class="panel"><h3>Satzbaukasten</h3><p class="hint">Wähl aus jeder Reihe einen Baustein. Jede Kombination ergibt einen korrekten Satz, du entscheidest, was du sagen willst. Bau mindestens drei verschiedene Sätze und sag sie laut.</p>
  <div class="slots">${S.map((s,si)=>`<div class="slot"><div class="sl">Baustein ${si+1}</div><div class="chips">${s.map((c,ci)=>`<button class="chip ${choice[si]===ci?'on':''}" data-s="${si}" data-c="${ci}">${esc(c)}</button>`).join("")}</div></div>`).join("")}</div>
  <div class="sentence"><div class="txt" id="sent"></div><span id="sspk"></span></div>
  <div class="note">${T.b.n}</div>
  <div class="collected"><b style="font-weight:500">Deine Sätze:</b><ul id="col"><li style="color:var(--muted)">noch keine</li></ul></div>${navBtns()}</div>`;
  function upd(){
    const done=choice.every(c=>c>=0);
    const txt=S.map((s,si)=>choice[si]>=0?esc(s[choice[si]]):'<span class="ph">…</span>').join(" ");
    st.querySelector("#sent").innerHTML=txt;
    st.querySelector("#sspk").innerHTML=done?spkBtn(S.map((s,si)=>s[choice[si]]).join(" ")):"";
    if(done){const t=S.map((s,si)=>s[choice[si]]).join(" ");if(!made.includes(t)){made.push(t);st.querySelector("#col").innerHTML=made.map(m=>`<li>${esc(m)}</li>`).join("");if(made.length>=3)mark(cur,6);}}
  }
  st.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const si=+b.dataset.s;choice[si]=+b.dataset.c;st.querySelectorAll(`.chip[data-s="${si}"]`).forEach(x=>x.classList.toggle("on",x===b));upd();});
  upd();
}

/* 8 Gespräch */
function gespraech(st,T){
  const did=(store["q"+cur]||{});
  function qcards(list,pre){return list.map((q,i)=>{const id=pre+i;return `<div class="qcard ${did[id]?'did':''}" id="qc${id}">
    <div class="qt"><span class="qn">${i+1}</span><div class="tx">${esc(q[0])}</div>${spkBtn(q[0])}</div>
    <div class="acts"><button class="small" onclick="toggleHelp('${id}',this)">Hilfe: Satzanfänge</button><button class="small ${did[id]?'on':''}" onclick="toggleDid('${id}',this)">${did[id]?'✓ besprochen':'besprochen'}</button></div>
    <div class="helps" id="h${id}">${q[1].split(" · ").map(h=>`<span>${esc(h)}</span>`).join("")}</div></div>`}).join("")}
  st.innerHTML=`<div class="talk"><div>
   <div class="panel"><h3>Gespräch</h3><p class="hint">Jetzt sprichst du. Rechts siehst du deine Wörter und Satzbausteine. Unter jeder Frage findest du Satzanfänge, falls du einen Start brauchst.</p>
   <div class="tabs2"><button class="on" data-l="e">Leicht (7)</button><button data-l="h">Komplex (7)</button><button data-l="a">Alle</button></div>
   <div id="lv-e"><div class="lvlhead">Leicht: ins Thema kommen<small>Kurze, konkrete Fragen. Antworte mit zwei, drei Sätzen und einem Detail.</small></div>${qcards(T.e,"e")}</div>
   <div id="lv-h" style="display:none"><div class="lvlhead">Komplex: erzählen, vergleichen, begründen<small>Hier darfst du länger sprechen: eine Geschichte erzählen, zwei Seiten vergleichen, deine Meinung mit Gründen sagen.</small></div>${qcards(T.h,"h")}</div>
   ${navBtns()}</div></div>
   <aside class="aside"><h4>Spickzettel: ${esc(T.t)}</h4><ul class="wl">${T.w.map(w=>`<li><b>${esc(w[0])}</b><span>${esc(w[1])}</span></li>`).join("")}</ul>
   <h4>Satzbausteine für jedes Gespräch</h4><ul class="ph">${PHRASES.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></aside></div>`;
  st.querySelectorAll(".tabs2 button").forEach(b=>b.onclick=()=>{
    st.querySelectorAll(".tabs2 button").forEach(x=>x.classList.toggle("on",x===b));
    const l=b.dataset.l;st.querySelector("#lv-e").style.display=(l==="e"||l==="a")?"block":"none";st.querySelector("#lv-h").style.display=(l==="h"||l==="a")?"block":"none";
  });
}
function toggleHelp(id,b){const h=document.getElementById("h"+id);h.classList.toggle("show");b.classList.toggle("on");}
function toggleDid(id,b){
  const k="q"+cur;store[k]=store[k]||{};store[k][id]=!store[k][id];
  b.classList.toggle("on",store[k][id]);b.textContent=store[k][id]?"✓ besprochen":"besprochen";
  document.getElementById("qc"+id).classList.toggle("did",store[k][id]);
  const n=Object.values(store[k]).filter(Boolean).length;if(n>=7)mark(cur,7);save();
}

/* Schublade */
function fillDrawer(){
  if(cur===null)return;const T=TOPICS[cur];
  document.getElementById("drawer").innerHTML=`<button class="close" onclick="closeDrawer()">Schließen ✕</button><h4>Spickzettel: ${esc(T.t)}</h4><ul>${T.w.map(w=>`<li><b>${esc(w[0])}</b><span>${esc(w[1])}</span></li>`).join("")}</ul>`;
}
function openDrawer(){document.getElementById("drawer").classList.add("open")}
function closeDrawer(){document.getElementById("drawer").classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
if("speechSynthesis" in window){speechSynthesis.getVoices();}
home();
syncWM();
</script>
