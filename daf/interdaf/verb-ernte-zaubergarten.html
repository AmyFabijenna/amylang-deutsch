<!doctype html>
<html lang="de">
<head>
<script src="/daf/interdaf/passwort.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Verb-Ernte im Zaubergarten – Akkusativ und Dativ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef6; --card:#fbfcfe; --soft:#e3e7f1; --line:#d5dbea;
  --ink:#151a2b; --muted:#5d6479; --navy:#22345c; --navy-deep:#16233f;
  --akk:#8e2f86; --akk-deep:#64205e; --akk-soft:#f3e3f1;
  --dat:#2d5c9c; --dat-deep:#1f416f; --dat-soft:#e1eaf6;
  --gold:#b48a35; --gold-deep:#86651f; --gold-soft:#f5ebd2;
  --lilac:#6d5a8e; --lilac-soft:#ebe5f3;
  --shadow:0 6px 22px rgba(22,35,63,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:20px;line-height:1.55;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 6px;max-width:900px;margin:0 auto}
.brand{font-weight:700;color:var(--navy);letter-spacing:.3px;font-size:1.1rem}
.brand .a{color:var(--akk)} .brand .d{color:var(--dat)}
.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;font-size:.9rem;color:var(--navy)}
.rightbar{display:flex;gap:8px;align-items:center}
.stars{background:var(--navy-deep);color:#f3dfa6;border-radius:14px;padding:6px 14px;font-size:.9rem;font-weight:500;transition:transform .2s}
.stars.bump{transform:scale(1.18)}
main{max-width:900px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line);padding:28px 26px}
h1{font-size:2rem;margin:.2em 0 .3em;color:var(--navy);font-weight:700;line-height:1.2}
h2{font-size:1.4rem;margin:.1em 0 .4em;color:var(--navy);font-weight:600;line-height:1.25}
p{margin:.5em 0}
.center{text-align:center}
.muted{color:var(--muted)}
.A{color:var(--akk);font-weight:600} .D{color:var(--dat);font-weight:600}
.btn{background:var(--navy);color:#fff;border:none;border-radius:18px;padding:14px 28px;font-weight:500;box-shadow:0 4px 0 var(--navy-deep);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy-deep)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep)}
.btn.ghost{background:var(--card);color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}

/* Startseite */
.hero{border-radius:24px;overflow:hidden;margin:4px 0 14px}
.hero svg{display:block;width:100%;height:auto}
.spell{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.spell div{border-radius:20px;padding:12px 14px;text-align:center;font-size:.98rem;line-height:1.4}
.spell .sa{background:var(--akk-soft);border:2px solid #e2c4df}
.spell .sd{background:var(--dat-soft);border:2px solid #c3d3ea}
.spell b{display:block;font-size:1.15rem}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.mode{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);transition:transform .15s,border-color .2s;border-top:7px solid var(--c)}
.mode:hover{transform:translateY(-2px);border-color:var(--c)}
.mode .ic{font-size:1.8rem;line-height:1}
.mode b{display:block;font-size:1.08rem;color:var(--ink);margin-top:4px}
.mode small{display:block;color:var(--muted);font-size:.84rem;line-height:1.4;margin-top:4px}
.mode .best{display:block;color:var(--gold);font-size:.95rem;margin-top:6px;min-height:1.2em}

/* Fortschritt */
.progress{height:12px;background:var(--soft);border-radius:10px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--akk),var(--dat));border-radius:10px;transition:width .4s}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.streak{color:var(--gold-deep);font-weight:600}

/* Baum */
.treename{text-align:center;font-weight:600;color:var(--lilac);font-size:1rem;margin:0 0 4px}
.tree{position:relative;margin:0 auto;max-width:660px}
.crown{background:radial-gradient(ellipse at 50% 38%,var(--c1),var(--c2));border-radius:46% 54% 50% 50%/58% 58% 42% 42%;padding:34px 24px 38px;display:flex;flex-wrap:wrap;gap:14px 12px;justify-content:center;min-height:180px;border:2px solid var(--c3);position:relative}
.crown::before,.crown::after{content:"✦";position:absolute;color:rgba(255,255,255,.85);font-size:1.1rem;animation:twinkle 2.6s ease-in-out infinite}
.crown::before{left:12%;top:16%} .crown::after{right:13%;top:22%;animation-delay:1.3s}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.trunk{width:56px;height:44px;margin:-6px auto 0;background:linear-gradient(90deg,#6e4c33,#8f6747,#6e4c33);border-radius:0 0 10px 10px}
.fruit{position:relative;border:2px solid rgba(21,26,43,.5);border-radius:50% 50% 46% 46%;padding:14px 14px 12px;font-size:1.02rem;font-weight:600;min-width:116px;transition:transform .2s,box-shadow .2s;animation:sway 3.4s ease-in-out infinite;transform-origin:50% -10px}
.fruit:nth-child(2n){animation-delay:-1.2s} .fruit:nth-child(3n){animation-delay:-2.1s}
@keyframes sway{0%,100%{rotate:-2deg}50%{rotate:2deg}}
.fruit::before{content:"";position:absolute;top:-9px;left:50%;width:3px;height:11px;background:#5b4330;border-radius:2px;transform:translateX(-50%) rotate(8deg)}
.fruit::after{content:"";position:absolute;top:-11px;left:calc(50% + 3px);width:16px;height:9px;background:#a3a07a;border-radius:0 80% 0 80%;border:1px solid #6b6848}
.fruit:hover:not(:disabled){transform:translateY(-3px)}
.fruit.sel{box-shadow:0 0 0 4px var(--gold),0 8px 18px rgba(0,0,0,.15);transform:translateY(-4px) scale(1.06)}
.fruit.gone{visibility:hidden}
.fc0{background:#f4c7a0} .fc1{background:#f1d98f} .fc2{background:#eeb6a6} .fc3{background:#e5d0aa} .fc4{background:#dcc7e4}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.basket{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:10px 10px 12px;text-align:center;transition:all .2s;position:relative}
.basket .weave{height:16px;margin:0 auto 6px;width:70%;border-radius:0 0 40px 40px;background:repeating-linear-gradient(90deg,var(--c) 0 6px,var(--cs) 6px 12px);opacity:.75}
.basket.ready{border-color:var(--c);box-shadow:0 0 0 4px var(--cs)}
.basket.ready:hover{transform:translateY(-3px)}
.basket .name{font-weight:700;font-size:1.15rem;color:var(--c)}
.basket .q{font-size:.9rem;color:var(--ink)}
.basket .pile{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:24px;margin-top:6px}
.basket .pile span{font-size:.72rem;border-radius:10px;padding:1px 8px;background:var(--cs);color:var(--c);font-weight:600}
.basket .pile span.miss{outline:1.5px dashed var(--muted)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}
.hop{animation:pop .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s ease}
.flyer{position:fixed;z-index:50;border:2px solid rgba(21,26,43,.5);border-radius:50% 50% 46% 46%;padding:14px 14px 12px;font-weight:600;font-size:1rem;text-align:center;pointer-events:none;transition:transform .6s cubic-bezier(.45,-0.35,.6,1),opacity .6s}
.spark{position:fixed;z-index:60;pointer-events:none;color:var(--gold);font-size:1.3rem;animation:spark .8s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}

/* Feedback */
.feedback{margin-top:18px;border-radius:22px;padding:16px 20px;font-size:1.02rem;line-height:1.6}
.feedback.good{background:var(--gold-soft);border:1.5px solid #e4d09e}
.feedback.bad{background:#eef1f7;border:1.5px solid var(--line)}
.feedback.info{background:var(--lilac-soft);border:1.5px solid #d7cde6;text-align:center}
.feedback h3{margin:0 0 6px;font-size:1.15rem;color:var(--navy)}
.feedback .full{display:block;margin-top:8px;font-weight:500}
.feedback .tip{display:block;margin-top:8px;font-size:.92rem;color:var(--muted)}
.feedback .bonus{display:block;margin-top:8px;font-weight:600;color:var(--gold-deep)}
.feedback .row{margin-top:12px;justify-content:flex-end}
.hl{border-radius:8px;padding:0 5px;font-weight:600}
.hl.A{background:var(--akk-soft)} .hl.D{background:var(--dat-soft)}

/* Zwillinge & Saftpresse */
.twins{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:8px 0 4px}
.twin{border:2px solid rgba(21,26,43,.5);border-radius:50% 50% 46% 46%;padding:14px 18px 12px;font-weight:600;background:#eee6d6;min-width:120px;text-align:center;transition:all .4s}
.twin.isA{background:var(--akk-soft);border-color:var(--akk);color:var(--akk)}
.twin.isD{background:var(--dat-soft);border-color:var(--dat);color:var(--dat)}
.twinstem{font-size:1.3rem;line-height:1;margin:4px 0 14px;text-align:center;color:var(--gold)}
.task{background:var(--soft);border-radius:20px;padding:14px 16px;margin:14px 0}
.sentence{font-size:1.4rem;font-weight:500;text-align:center;margin:6px 0 12px;line-height:1.7}
.gap{display:inline-block;min-width:84px;border-bottom:3px solid var(--navy);margin:0 6px;font-weight:700;text-align:center}
.gap.fA{color:var(--akk);border-bottom-color:var(--akk);animation:pop .5s ease} .gap.fD{color:var(--dat);border-bottom-color:var(--dat);animation:pop .5s ease}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:400px;margin:0 auto}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;font-size:1.3rem;font-weight:600;transition:all .2s}
.opt:hover:not(:disabled){border-color:var(--navy);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep)}
.opt.wrong{background:#f1f1f4;border-color:var(--muted);color:var(--muted);text-decoration:line-through}
.verbfruit{display:inline-block;border:2px solid rgba(21,26,43,.45);border-radius:50% 50% 46% 46%;padding:10px 20px 8px;font-weight:600;background:#eee6d6;transition:all .4s}
.verbfruit.isA{background:var(--akk-soft);border-color:var(--akk);color:var(--akk)}
.verbfruit.isD{background:var(--dat-soft);border-color:var(--dat);color:var(--dat)}
.chip{display:inline-block;background:var(--card);border:1.5px dashed var(--navy);border-radius:14px;padding:3px 14px;font-size:.95rem;color:var(--navy);margin-top:8px}
.chip small{color:var(--muted)}
.glass{width:64px;height:84px;margin:4px auto 0;border:3px solid var(--navy);border-top:none;border-radius:0 0 18px 18px;position:relative;overflow:hidden;background:#fff}
.glass i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#d9a8d4,#a6bde0);transition:height .5s}

/* Blitz-Ernte */
.field{position:relative;height:300px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#3b4a74 0%,#6d5a8e 60%,#c9a9b8 100%);margin-top:6px}
.field::before{content:"✦  ·   ✧     ·  ✦    ·   ✧   ·";position:absolute;left:0;right:0;top:12px;text-align:center;color:rgba(255,255,255,.7);letter-spacing:6px;font-size:.9rem}
.ground{position:absolute;left:0;right:0;bottom:0;height:26px;background:#7b5b46;border-top:3px solid #634837}
.drop{position:absolute;top:-70px;border:2px solid rgba(21,26,43,.5);border-radius:50% 50% 46% 46%;padding:14px 16px 12px;font-weight:600;font-size:1.1rem;background:#f1d98f;min-width:120px;text-align:center;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(330px)}}
.drop.caught{animation-play-state:paused}
.bbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.bbtn{border:none;border-radius:22px;padding:16px 10px;font-weight:600;font-size:1.1rem;color:#fff;line-height:1.3}
.bbtn small{display:block;font-weight:400;font-size:.85rem;opacity:.9}
.bbtn.a{background:var(--akk);box-shadow:0 4px 0 var(--akk-deep)}
.bbtn.d{background:var(--dat);box-shadow:0 4px 0 var(--dat-deep)}
.bbtn:active{transform:translateY(3px)}
.bbtn:disabled{opacity:.6;cursor:default}
.keys{font-size:.8rem;color:var(--muted);text-align:center;margin-top:6px}

/* Abschluss */
.bigstars{font-size:3rem;letter-spacing:8px;color:var(--gold);margin:6px 0}
.review{text-align:left;margin-top:16px}
.review li{margin:8px 0;line-height:1.5}
.review ul{padding-left:20px}

@media (max-width:600px){
  body{font-size:18px}
  .card{padding:20px 14px;border-radius:22px}
  h1{font-size:1.55rem}
  .modes{grid-template-columns:1fr}
  .fruit{min-width:96px;font-size:.92rem;padding:12px 10px 10px}
  .crown{padding:28px 12px 30px;gap:12px 8px}
  .sentence{font-size:1.18rem}
  .twin{min-width:100px;padding:12px 10px 10px}
  .basket .name{font-size:1rem}
  .field{height:260px}
  @keyframes fall{from{transform:translateY(0)}to{transform:translateY(290px)}}
}
@media (prefers-reduced-motion:reduce){ .fruit,.crown::before,.crown::after{animation:none} }
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="homeBtn">☰ Start</button>
  <div class="brand"><span class="a">Verb</span>-<span class="d">Ernte</span></div>
  <div class="rightbar"><button class="iconbtn" id="soundBtn" aria-label="Ton an oder aus">🔈</button><div class="stars" id="starsTotal">★ 0</div></div>
</header>
<main id="app"></main>

<script>
/* =========================================================
   DATEN
   ========================================================= */
// Große Ernte: [Verb, Fall, Satz mit {Objekt}, Tipp]
const ERNTE = [
 ['fangen','akk','Die Katze fängt {die Maus}.'],
 ['kaufen','akk','Mama kauft {ein Eis}.'],
 ['malen','akk','Ich male {einen Drachen}.'],
 ['füttern','akk','Wir füttern {die Hasen}.'],
 ['streicheln','akk','Ich streichle {den Hund}.'],
 ['umarmen','akk','Ich umarme {die Oma}.','Man umarmt <b>wen?</b> – darum Akkusativ, auch wenn es eine Person ist.'],
 ['brauchen','akk','Ich brauche {einen Bleistift}.'],
 ['lieben','akk','Das Baby liebt {den Teddy}.'],
 ['kennen','akk','Ich kenne {den Weg}.'],
 ['hören','akk','Ich höre {den Vogel}.','Achtung, Zwillingsfrucht: „Ich höre <b>dem</b> Vogel <b>zu</b>.“ – mit <b>zu</b> wird es Dativ.'],
 ['treffen','akk','Ich treffe {meinen Freund}.','Achtung, Zwillingsfrucht: <b>begegnen</b> heißt fast dasselbe, braucht aber den Dativ.'],
 ['pflücken','akk','Wir pflücken {einen Apfel}.'],
 ['verstecken','akk','Der Pirat versteckt {den Schatz}.'],
 ['retten','akk','Die Feuerwehr rettet {die Katze}.'],
 ['wecken','akk','Der Wecker weckt {den Papa}.'],
 ['abholen','akk','Papa holt {das Kind} ab.','Das kleine Wort <b>ab</b> steht am Ende. Der Fall bleibt Akkusativ: Wen holt Papa ab?'],
 ['aufräumen','akk','Ich räume {das Zimmer} auf.'],
 ['anziehen','akk','Ich ziehe {den Pullover} an.'],
 ['grüßen','akk','Ich grüße {den Nachbarn}.','Man grüßt <b>wen?</b> – Akkusativ. Aber: Ich winke <b>dem</b> Nachbarn <b>zu</b> – das ist Dativ.'],
 ['kochen','akk','Papa kocht {eine Suppe}.'],
 ['helfen','dat','Ich helfe {dem Opa}.','Viele möchten hier „den“ sagen. Aber man hilft immer <b>wem?</b> – helfen ist ein echtes Dativ-Verb.'],
 ['danken','dat','Wir danken {der Lehrerin}.'],
 ['gehören','dat','Das Fahrrad gehört {meinem Bruder}.'],
 ['gefallen','dat','Das Bild gefällt {der Mama}.','Wem gefällt das Bild? Der Mama. Das Bild ist hier das Subjekt.'],
 ['schmecken','dat','Das Eis schmeckt {dem Kind}.'],
 ['antworten','dat','Ich antworte {dem Lehrer}.','Achtung, Zwillingsfrucht: <b>fragen</b> braucht den Akkusativ – ich frage <b>den</b> Lehrer.'],
 ['gratulieren','dat','Wir gratulieren {der Oma}.'],
 ['zuhören','dat','Ich höre {dem Vogel} zu.','Das kleine Wort <b>zu</b> macht aus hören ein Dativ-Verb.'],
 ['zuschauen','dat','Wir schauen {dem Clown} zu.'],
 ['zuwinken','dat','Ich winke {dem Zug} zu.'],
 ['folgen','dat','Die Küken folgen {der Entenmama}.'],
 ['vertrauen','dat','Ich vertraue {meiner Freundin}.'],
 ['begegnen','dat','Im Wald begegne ich {einem Fuchs}.','Achtung, Zwillingsfrucht: Ich <b>treffe einen</b> Fuchs (Akkusativ) – ich <b>begegne einem</b> Fuchs (Dativ).'],
 ['ähneln','dat','Mein Bruder ähnelt {dem Papa}.','Wem ähnelt mein Bruder? Dem Papa – die beiden sehen sich ähnlich.'],
 ['zulächeln','dat','Das Baby lächelt {der Oma} zu.'],
 ['zunicken','dat','Der Trainer nickt {dem Spieler} zu.'],
 ['wehtun','dat','Der Fuß tut {dem Fußballer} weh.','Wem tut der Fuß weh? Dem Fußballer.'],
 ['nachlaufen','dat','Der Hund läuft {dem Ball} nach.'],
 ['entkommen','dat','Die Maus entkommt {der Katze}.'],
 ['gehorchen','dat','Der Hund gehorcht {dem Kind}.']
];
const TREES = [
 {n:'Der Sternapfelbaum',      c1:'#f8e9cf', c2:'#ecd3a6', c3:'#dfc28a'},
 {n:'Der Mondbirnenbaum',      c1:'#efe9f6', c2:'#d9cde9', c3:'#c6b6dd'},
 {n:'Der Goldkirschenbaum',    c1:'#f9e6c4', c2:'#eecb8e', c3:'#ddb46e'},
 {n:'Der Zauberpflaumenbaum',  c1:'#f6e1e8', c2:'#e8c2d0', c3:'#d9a9bb'},
 {n:'Der Funkelpfirsichbaum',  c1:'#fae4d6', c2:'#f0c6ab', c3:'#e2ad8d'}
];

// Zwillingsfrüchte: zwei ähnliche Verben – eines Akkusativ, eines Dativ
// a/d: [Verb, Satz mit ___, richtig, falsch]
const TWINS = [
 {a:['hören','Ich höre ___ Vogel.','den','dem'], d:['zuhören','Ich höre ___ Vogel zu.','dem','den'],
  tip:'Ganz ähnlich – und doch anders! Das kleine Wort <b>zu</b> verwandelt <b>hören</b> in <b>zuhören</b>, und zuhören fragt immer <b>wem?</b>'},
 {a:['anschauen','Wir schauen ___ Clown an.','den','dem'], d:['zuschauen','Wir schauen ___ Clown zu.','dem','den'],
  tip:'Schau genau auf das Ende des Satzes: Steht <b>an</b> da, ist es Akkusativ. Steht <b>zu</b> da, ist es Dativ.'},
 {a:['treffen','Ich treffe ___ Freundin.','die','der'], d:['begegnen','Ich begegne ___ Freundin.','der','die'],
  tip:'<b>treffen</b> und <b>begegnen</b> bedeuten fast dasselbe. Trotzdem: Ich treffe <b>wen?</b> – ich begegne <b>wem?</b> Bei der Freundin wird im Dativ aus <b>die</b> → <b>der</b>.'},
 {a:['fragen','Ich frage ___ Lehrer.','den','dem'], d:['antworten','Ich antworte ___ Lehrer.','dem','den'],
  tip:'Fragen und antworten gehören zusammen wie zwei Kirschen. Aber: Ich frage <b>wen?</b> – ich antworte <b>wem?</b>'},
 {a:['verfolgen','Der Hund verfolgt ___ Katze.','die','der'], d:['folgen','Der Hund folgt ___ Katze.','der','die'],
  tip:'Nur drei Buchstaben Unterschied: <b>ver</b>folgen braucht den Akkusativ, <b>folgen</b> braucht den Dativ.'},
 {a:['anlachen','Das Baby lacht ___ Papa an.','den','dem'], d:['zulächeln','Das Baby lächelt ___ Papa zu.','dem','den'],
  tip:'Wieder das Ende-Wort: <b>an</b>lachen → wen? Akkusativ. <b>zu</b>lächeln → wem? Dativ.'},
 {a:['grüßen','Ich grüße ___ Nachbarn.','den','dem'], d:['zuwinken','Ich winke ___ Nachbarn zu.','dem','den'],

let actx=null;
function tone(ok){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [660,880] : [330,262];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f;
      const t=actx.currentTime+i*0.11; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.3); });
  }catch(e){}
}
function sparks(el){
  const r=el.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/3;
  for(let i=0;i<8;i++){ const s=document.createElement('div'); s.className='spark'; s.textContent=i%2?'✦':'✧';
    const ang=i/8*Math.PI*2; s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.setProperty('--dx',Math.cos(ang)*60+'px'); s.style.setProperty('--dy',Math.sin(ang)*50-20+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),850); }
}
function fly(fromEl,toEl,cls){
  const r=fromEl.getBoundingClientRect(), t=toEl.getBoundingClientRect();
  const c=document.createElement('div'); c.className='flyer '+cls; c.textContent=fromEl.textContent;
  c.style.left=r.left+'px'; c.style.top=r.top+'px'; c.style.width=r.width+'px';
  document.body.appendChild(c); void c.offsetWidth;
  c.style.transform=`translate(${t.left+t.width/2-r.left-r.width/2}px,${t.top+t.height/2-r.top-r.height/2}px) scale(.35)`;
  c.style.opacity='.15';
  setTimeout(()=>c.remove(),650);
}

function ernteGame(){
  stopRunning();
  const akk=shuffle(ERNTE.filter(x=>x[1]==='akk')), dat=shuffle(ERNTE.filter(x=>x[1]==='dat'));
  const trees=TREES.map((t,k)=>shuffle([...akk.slice(k*4,k*4+4),...dat.slice(k*4,k*4+4)]));
  let tIdx=0, okAll=0, streak=0, sel=null; const tot=ERNTE.length, misses=[];
  const piles={akk:[],dat:[]};
  function render(){
    const tree=trees[tIdx], T=TREES[tIdx];
    piles.akk=[]; piles.dat=[];
    app.innerHTML = `
    <div class="card">
      <div class="meta"><span>Baum ${tIdx+1} von ${TREES.length}</span><span class="streak" id="streak"></span><span id="okc">${okAll} richtig</span></div>

        <button class="basket" data-c="akk" style="--c:var(--akk);--cs:var(--akk-soft)"><div class="weave"></div><div class="name">Akkusativ</div><div class="q">Wen oder was?</div><div class="pile" id="p-akk"></div></button>
        <button class="basket" data-c="dat" style="--c:var(--dat);--cs:var(--dat-soft)"><div class="weave"></div><div class="name">Dativ</div><div class="q">Wem?</div><div class="pile" id="p-dat"></div></button>
      </div>
      <div id="fb"><div class="feedback info">Tippe auf eine Frucht am Baum – und dann auf den richtigen Korb.</div></div>
    </div>`;
    showStreak();
    const fruits=[...app.querySelectorAll('.fruit')], baskets=[...app.querySelectorAll('.basket')];
    let left=tree.length;
    fruits.forEach(f=>f.onclick=()=>{
      fruits.forEach(x=>x.classList.remove('sel')); f.classList.add('sel'); sel=+f.dataset.k;
      baskets.forEach(b=>b.classList.add('ready'));
      document.getElementById('fb').innerHTML=`<div class="feedback info">Du hast <b>${tree[sel][0]}</b> gepflückt. Bau einen kleinen Satz: Fragt das Verb <b>wen?</b> oder <b>wem?</b></div>`;
    });
    baskets.forEach(b=>b.onclick=()=>{
      if(sel===null){ bounce(b,'shake'); document.getElementById('fb').innerHTML=`<div class="feedback info">Pflück zuerst eine Frucht vom Baum. 🍐</div>`; return; }
      const v=tree[sel], chosen=b.dataset.c, ok=chosen===v[1];
      const fEl=fruits[sel], target=app.querySelector(`.basket[data-c="${v[1]}"]`);
      fly(fEl,target,fEl.className.match(/fc\d/)[0]);
      fEl.classList.add('gone'); fEl.disabled=true;
      let bonus='';
      if(ok){ okAll++; streak++; addStar(); tone(true); setTimeout(()=>sparks(target),420);
        if(streak%5===0){ addStar(); bonus=`<span class="bonus">🌟 Goldene Frucht! ${streak} richtige hintereinander – du bekommst einen Extrastern.</span>`; } }
      else { streak=0; tone(false); misses.push(missLine(v)); bounce(b,'shake'); }
      setTimeout(()=>{ piles[v[1]].push([v[0],ok]); drawPiles(); bounce(target,'hop'); },560);
      const q=caseQ(v[1]);
      let txt = ok ? `<b>${v[0]}</b> gehört in den Korb ${caseName(v[1])}. Das Verb fragt: <b>${q}</b>`
                   : `<b>${v[0]}</b> gehört in den Korb ${caseName(v[1])}. Das Verb fragt nämlich: <b>${q}</b> Darum ist die Frucht in den anderen Korb geflogen.`;
      txt += `<span class="full">→ ${hlSent(v[2],v[1])}</span>`;
      if(v[3]) txt += `<span class="tip">💡 ${v[3]}</span>`;
      txt += bonus;
      sel=null; baskets.forEach(x=>x.classList.remove('ready')); left--;
      document.getElementById('okc').textContent=okAll+' richtig'; showStreak();
      document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><h3>${ok?praise()+' ✨':'Diese Frucht gehört in den anderen Korb.'}</h3>${txt}
        ${left===0?`<div class="row"><button class="btn" id="nx">${tIdx<TREES.length-1?'Zum nächsten Baum →':'Ernte beenden ✨'}</button></div>`:''}</div>`;

    });
    scrollUp();
  }
  function showStreak(){ const el=document.getElementById('streak'); if(el) el.textContent = streak>=2?`🔥 ${streak} in Folge`:''; }

}

          <span class="full"><span class="A">${P.a[0]}</span> fragt <b>wen oder was?</b> → Akkusativ · <span class="D">${P.d[0]}</span> fragt <b>wem?</b> → Dativ</span>
          <span class="tip">💡 ${P.tip}</span>
          <div class="row"><button class="btn" id="nx">${idx<list.length-1?'Nächstes Paar →':'Fertig ✨'}</button></div></div>`;
        document.getElementById('nx').onclick=()=>{ idx++; if(idx<list.length) render(); else finish('twins','Zwillingsfrüchte',okAll,tot,misses,twinsGame); };
      }
    });
    scrollUp();
  }
  render();
}

/* =========================================================
   MODUS 3: DIE SAFTPRESSE
   ========================================================= */
function presseGame(){
  stopRunning();
  const list=shuffle(PRESSE); let idx=0, okAll=0; const tot=list.length, misses=[];
  function render(){
    const [verb,c,sent,nomArt,noun,g,def]=list[idx];
    const right=FORMS[c][g+def], wrong=FORMS[c==='akk'?'dat':'akk'][g+def];
    const chip = def ? `${nomArt} ${noun}` : `${nomArt} ${noun} <small>(${GENDER[g]} ${noun})</small>`;
    app.innerHTML = `
    <div class="card">
      <div class="meta"><span>Glas ${idx+1} von ${tot}</span><span>${okAll} richtig</span></div>
      <div class="progress"><i style="width:${idx/tot*100}%"></i></div>
      <div class="center"><span class="verbfruit" id="vf">${verb}</span><div class="glass"><i style="height:${idx/tot*100}%"></i></div></div>
      <p class="sentence" style="margin-top:14px">${sent.replace('___','<span class="gap" id="gap">?</span>')}</p>
      <div class="center" style="margin:-4px 0 14px"><span class="chip">${chip}</span></div>
      <div class="opts">${shuffle([right,wrong]).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.o===right;
      app.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.o===right) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); });
      const gp=document.getElementById('gap'); gp.textContent=right; gp.classList.add(c==='akk'?'fA':'fD');
      document.getElementById('vf').classList.add(c==='akk'?'isA':'isD');
      if(ok){ okAll++; addStar(); tone(true); sparks(gp); } else { tone(false); }
      const change = nomArt===right ? `Hier ändert sich nichts: <b>${nomArt}</b> bleibt <b>${right}</b>.` : `Aus <b>${nomArt}</b> wird <b>${right}</b>.`;
      const expl = `<b>${verb}</b> ist ein ${caseName(c)}-Verb – es fragt <b>${caseQ(c)}</b> ${change}`;
      const full = sent.replace('___',`<span class="hl ${c==='akk'?'A':'D'}">${right}</span>`);
      if(!ok) misses.push(`${expl} → ${full}`);
      let tip='';
      if(!ok) tip = `<span class="tip">💡 <b>${wrong}</b> wäre der ${c==='akk'?'Dativ':'Akkusativ'}. Den braucht ein Verb, das <b>${c==='akk'?'wem?':'wen oder was?'}</b> fragt.</span>`;
      document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><h3>${ok?praise()+' 🧃':'Hier passt '+right+'.'}</h3>${expl}<span class="full">→ ${full}</span>${tip}
        <div class="row"><button class="btn" id="nx">${idx<tot-1?'Weiter →':'Fertig ✨'}</button></div></div>`;
      document.getElementById('nx').onclick=()=>{ idx++; if(idx<tot) render(); else finish('presse','Die Saftpresse',okAll,tot,misses,presseGame); };
    });
    scrollUp();
  }
  render();
}

/* =========================================================
   MODUS 4: BLITZ-ERNTE
   ========================================================= */
function blitzIntro(){
  stopRunning();
  app.innerHTML = `
  <div class="card center">
    <h1>⚡ Blitz-Ernte</h1>
    <p>Der Wind schüttelt den Zauberbaum! Die Verb-Früchte fallen herunter.</p>
    <p>Fang jede Frucht, bevor sie den Boden berührt: Tippe auf den <span class="A">Akkusativ-Korb</span> oder den <span class="D">Dativ-Korb</span>.</p>
    <p class="muted" style="font-size:.95rem">16 Früchte · am Anfang fallen sie langsam, dann immer schneller.<br>Am Computer gehen auch die Pfeiltasten: ← Akkusativ · → Dativ</p>
    <div class="row"><button class="btn gold" id="go">Los geht's ⚡</button></div>
  </div>`;
  document.getElementById('go').onclick=blitzGame;
  scrollUp();
}
function blitzGame(){
  stopRunning();
  const pool=[...ERNTE,...EXTRA];
  const list=shuffle([...shuffle(pool.filter(x=>x[1]==='akk')).slice(0,8),...shuffle(pool.filter(x=>x[1]==='dat')).slice(0,8)]);
  let idx=0, okAll=0, streak=0, waiting=false, timer=null; const tot=list.length, misses=[];
  app.innerHTML = `
  <div class="card">
    <div class="meta"><span id="bm">Frucht 1 von ${tot}</span><span class="streak" id="streak"></span><span id="okc">0 richtig</span></div>
    <div class="progress"><i id="bp" style="width:0%"></i></div>
    <div class="field" id="field"><div class="ground"></div></div>
    <div class="bbtns"><button class="bbtn a" data-c="akk">🧺 Akkusativ<small>wen oder was?</small></button><button class="bbtn d" data-c="dat">🧺 Dativ<small>wem?</small></button></div>
    <div class="keys">← Akkusativ · Dativ →</div>
    <div id="fb"><div class="feedback info">Gleich fällt die erste Frucht …</div></div>
  </div>`;
  const field=document.getElementById('field'), btns=[...app.querySelectorAll('.bbtn')];
  function drop(){
    if(idx>=tot){ finish('blitz','Blitz-Ernte',okAll,tot,misses,blitzGame); return; }
    waiting=false;
    document.getElementById('bm').textContent=`Frucht ${idx+1} von ${tot}`;
    document.getElementById('bp').style.width=(idx/tot*100)+'%';
    const v=list[idx]; const d=document.createElement('div'); d.className='drop'; d.textContent=v[0];
    d.style.background=['#f4c7a0','#f1d98f','#eeb6a6','#e5d0aa','#dcc7e4'][idx%5];
    d.style.left=(8+Math.random()*58)+'%';
    const dur=Math.max(4.2,7.5-idx*0.22); d.style.animationDuration=dur+'s';
    field.appendChild(d);
    btns.forEach(b=>b.disabled=false);
    d.addEventListener('animationend',()=>{ if(!waiting) answer(null); });
  }
  function answer(chosen){
    if(waiting) return; waiting=true;
    const v=list[idx], d=field.querySelector('.drop');
    btns.forEach(b=>b.disabled=true);
    const ok=chosen===v[1];
    if(d){ d.classList.add('caught'); if(chosen){ fly(d, app.querySelector(`.bbtn[data-c="${v[1]}"]`), ''); d.style.visibility='hidden'; } }
    if(ok){ okAll++; streak++; addStar(); tone(true); sparks(app.querySelector(`.bbtn[data-c="${v[1]}"]`)); }
    else { streak=0; tone(false); misses.push(missLine(v)); }
    let bonus=''; if(ok && streak%5===0){ addStar(); bonus=`<span class="bonus">🌟 Goldene Frucht! ${streak} in Folge – Extrastern!</span>`; }
    document.getElementById('okc').textContent=okAll+' richtig';
    document.getElementById('streak').textContent = streak>=2?`🔥 ${streak} in Folge`:'';
    const head = ok ? praise()+' ✨' : chosen===null ? 'Oh, die Frucht ist auf den Boden gefallen.' : 'Diese Frucht gehört in den anderen Korb.';
    document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><h3>${head}</h3><b>${v[0]}</b> → ${caseName(v[1])}, das Verb fragt <b>${caseQ(v[1])}</b><span class="full">→ ${hlSent(v[2],v[1])}</span>${bonus}</div>`;
    timer=setTimeout(()=>{ if(d) d.remove(); idx++; drop(); }, ok?1900:3200);
  }
  btns.forEach(b=>b.onclick=()=>answer(b.dataset.c));
  const onKey=e=>{ if(waiting) return; if(e.key==='ArrowLeft'){ e.preventDefault(); answer('akk'); } if(e.key==='ArrowRight'){ e.preventDefault(); answer('dat'); } };
  document.addEventListener('keydown',onKey);
  timer=setTimeout(drop,900);
  cleanup=()=>{ clearTimeout(timer); document.removeEventListener('keydown',onKey); waiting=true; };
  btns.forEach(b=>b.disabled=true);
  scrollUp();
}

home();
</script>
</body>
</html>
