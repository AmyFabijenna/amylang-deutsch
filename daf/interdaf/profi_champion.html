       // ==================== SATZGLIEDER-ANALYSE LOGIK (mehrteilige Prädikate mit Reihenfolge) ====================
    const orderSequence = ["P", "S", "O2", "O3", "O4", "PO3", "PO4", "ZE", "BE", "AE", "OE"];

    function renderAnalysis() {
        document.getElementById('optionsGrid').innerHTML = '';
        let s = gameState.currentSentence;
        let container = document.getElementById('sentence');
        container.innerHTML = '';
        let parts = s.parts;
        
        // Für jeden Part speichern: Text, Typ, korrekt-Status, DOM-Element, ursprünglicher Index
        gameState.analysisParts = parts.map((p, idx) => ({ 
            text: p.text, 
            type: p.type, 
            correct: false, 
            element: null, 
            originalIndex: idx 
        }));
        
        // Gruppiere die Parts nach Typ, behalte die originale Reihenfolge für jeden Typ
        let partsByType = {};
        parts.forEach((p, idx) => {
            if (!partsByType[p.type]) partsByType[p.type] = [];
            partsByType[p.type].push(idx);
        });
        
        // Definiere die erwartete Reihenfolge der Typen (statisch)
        let presentTypes = [...new Set(parts.map(p => p.type))];
        let expectedOrderStatic = orderSequence.filter(t => presentTypes.includes(t));
        gameState.analysisOrderStatic = expectedOrderStatic;
        
        // Für jeden Typ die Liste der Indizes in der originalen Satzreihenfolge
        gameState.expectedIndicesPerType = {};
        for (let type of expectedOrderStatic) {
            gameState.expectedIndicesPerType[type] = partsByType[type] || [];
        }
        
        // Aktueller Fortschritt: für jeden Typ, wie viele Parts davon bereits korrekt sind
        gameState.progressPerType = {};
        for (let type of expectedOrderStatic) {
            gameState.progressPerType[type] = 0;
        }
        
        // Der aktuell zu bearbeitende Typ (der erste, bei dem noch nicht alle Parts korrekt sind)
        gameState.currentTypeIndex = 0;
        gameState.currentType = expectedOrderStatic[0];
        
        // Farbige Darstellung
        let sentenceDiv = document.createElement('div');
        sentenceDiv.className = 'sentence-glider';
        let colors = ['#cfa3ff', '#ffd966', '#b87cff', '#f5b042', '#a37fd9', '#ffbf69', '#9f7ad3', '#f7c56e', '#e6ccff', '#ffe0a3', '#c2a5e0'];
        parts.forEach((part, idx) => {
            let span = document.createElement('span');
            span.className = 'glider-part';
            span.innerText = part.text;
            span.style.backgroundColor = colors[idx % colors.length];
            span.style.border = '1px solid #9b7bcf';
            span.dataset.idx = idx;
            span.dataset.type = part.type;
            span.onclick = () => handleAnalysisClick(idx);
            sentenceDiv.appendChild(span);
            sentenceDiv.appendChild(document.createTextNode(' '));
            gameState.analysisParts[idx].element = span;
        });
        container.appendChild(sentenceDiv);
        
        // Anzeige der erwarteten Reihenfolge (statisch, gruppiert)
        let orderDiv = document.createElement('div');
        orderDiv.className = 'analysis-order-bar';
        orderDiv.innerHTML = `<span>🎯 Reihenfolge (statisch):</span> ${expectedOrderStatic.map(t => `<span id="orderBadge-${t}">${t}</span>`).join(' → ')}`;
        let oldOrder = document.querySelector('.analysis-order-bar');
        if (oldOrder) oldOrder.remove();
        document.querySelector('.sentence-box').prepend(orderDiv);
        
        highlightCurrentTarget();
    }

    function highlightCurrentTarget() {
        if (!gameState.currentType) return;
        // Hebe den aktuell erwarteten Typ in der statischen Leiste hervor
        document.querySelectorAll('.analysis-order-bar span').forEach(span => span.classList.remove('current-target'));
        let targetSpan = Array.from(document.querySelectorAll('.analysis-order-bar span')).find(span => span.innerText === gameState.currentType);
        if (targetSpan) targetSpan.classList.add('current-target');
    }

    function handleAnalysisClick(partIdx) {
        let part = gameState.analysisParts[partIdx];
        if (part.correct) return; // bereits richtig geklickt
        
        let currentType = gameState.currentType;
        let expectedIndices = gameState.expectedIndicesPerType[currentType];
        let progress = gameState.progressPerType[currentType];
        
        // Prüfen: Ist der angeklickte Part überhaupt vom aktuell erwarteten Typ?
        if (part.type !== currentType) {
            part.element.classList.add('wrong');
            playWrong();
            setTimeout(() => part.element.classList.remove('wrong'), 2500);
            gameState.streak = 0;
            updateStats();
            return;
        }
        
        // Prüfen: Ist es der nächste erwartete Part in der Reihenfolge dieses Typs?
        let nextExpectedIndex = expectedIndices[progress];
        if (part.originalIndex !== nextExpectedIndex) {
            part.element.classList.add('wrong');
            playWrong();
            setTimeout(() => part.element.classList.remove('wrong'), 2500);
            gameState.streak = 0;
            updateStats();
            return;
        }
        
        // Richtig
        part.element.classList.add('correct');
        part.correct = true;
        gameState.correctAnswers++;
        gameState.totalAttempts++;
        gameState.streak++;
        if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak;
        let pts = 10 + (gameState.streak >= 5 ? 10 : 0);
        gameState.points += pts;
        updateStats();
        playCorrect();
        pointsPopup(pts, gameState.streak >= 5);
        
        // Fortschritt für diesen Typ erhöhen
        gameState.progressPerType[currentType]++;
        let allOfTypeCompleted = (gameState.progressPerType[currentType] === expectedIndices.length);
        
        if (allOfTypeCompleted) {
            // Wechsel zum nächsten Typ
            gameState.currentTypeIndex++;
            if (gameState.currentTypeIndex < gameState.analysisOrderStatic.length) {
                gameState.currentType = gameState.analysisOrderStatic[gameState.currentTypeIndex];
                highlightCurrentTarget();
            } else {
                // Alle Typen fertig – Satz abgeschlossen
                gameState.solvedCount++;
                let idxRem = gameState.remainingSentences.indexOf(gameState.currentSentence);
                if (idxRem !== -1) gameState.remainingSentences.splice(idxRem, 1);
                updateProgress();
                setTimeout(() => loadNextSentence(), 700);
            }
        } else {
            // Bleibe im gleichen Typ, aktualisiere die Hervorhebung
            highlightCurrentTarget();
        }
    }

    // ==================== SPIEL-LOGIK ====================
    let gameState = {
        mode: null, points: 0, streak: 0, bestStreak: 0, correctAnswers: 0, totalAttempts: 0,
        startTime: null, remainingSentences: [], solvedCount: 0, currentSentence: null,
        analysisParts: [], analysisCurrentTargetIndex: 0, analysisOrder: []
    };
    let selectedSlot = null;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function updateStats() {
        document.getElementById('points').innerText = gameState.points;
        document.getElementById('streak').innerText = gameState.streak;
    }
    function updateProgress() {
        let total = gameState.solvedCount + gameState.remainingSentences.length;
        let percent = total ? (gameState.solvedCount / total) * 100 : 0;
        document.getElementById('progressFill').style.width = percent + '%';
    }
    function pointsPopup(pts, bonus) {
        let p = document.createElement('div');
        p.className = 'points-popup';
        p.innerText = bonus ? `+${pts} 🔥 COMBO` : `+${pts}`;
        p.style.left = (Math.random() * 60 + 20) + '%';
        p.style.top = '40%';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
    }
    function playCorrect() {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.08;
        o.start(); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        setTimeout(() => ctx.close(), 250);
    }
    function playWrong() {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 240; o.type = 'sawtooth'; g.gain.value = 0.08;
        o.start(); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        setTimeout(() => ctx.close(), 280);
    }

    function startGame(mode) {
        gameState = {
            mode, points: 0, streak: 0, bestStreak: 0, correctAnswers: 0, totalAttempts: 0,
            startTime: Date.now(), remainingSentences: [...sentenceData[mode]], solvedCount: 0,
            currentSentence: null, analysisParts: [], analysisCurrentTargetIndex: 0, analysisOrder: []
        };
        const modeNames = {
            preposition: "📍 Präpositionen", definite: "🔷 Bestimmte Artikel",
            indefinite: "◇ Unbestimmte Artikel", negation: "⊘ Verneinung",
            possessive: "👤 Possessivpronomen", relative: "🔗 Relativsätze",
            comma: "📝 Beistriche", sentenceAnalysis: "🧩 Satzglieder"
        };
        document.getElementById('modeIndicator').innerHTML = modeNames[mode];
        updateStats(); updateProgress(); loadNextSentence();
        showScreen('gameScreen');
        document.getElementById('backBtn').style.display = 'block';
    }

    function loadNextSentence() {
        if (gameState.remainingSentences.length === 0) {
            endGame();
            return;
        }
        let idx = Math.floor(Math.random() * gameState.remainingSentences.length);
        gameState.currentSentence = gameState.remainingSentences[idx];
        document.getElementById('hintBox').style.display = 'none';
        if (gameState.mode === 'sentenceAnalysis') {
            renderAnalysis();
        } else {
            renderNormal();
            let firstSlot = document.querySelector('.article-slot');
            if (firstSlot) selectSlot(firstSlot);
        }
    }

    function renderNormal() {
        let s = gameState.currentSentence;
        let container = document.getElementById('sentence');
        container.innerHTML = '';
        let text = s.text;
        let slotIdx = 0;
        let regex = /\[(.*?)\]/g;
        let lastIndex = 0, match;
        while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
                let wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.innerText = text.slice(lastIndex, match.index);
                container.appendChild(wordSpan);
            }
            let slotSpan = document.createElement('span');
            slotSpan.className = 'article-slot';
            slotSpan.dataset.slotIndex = slotIdx++;
            slotSpan.innerText = '___';
            slotSpan.onclick = () => selectSlot(slotSpan);
            container.appendChild(slotSpan);
            lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) {
            let wordSpan = document.createElement('span');
            wordSpan.className = 'word';
            wordSpan.innerText = text.slice(lastIndex);
            container.appendChild(wordSpan);
        }
        renderOptionsNormal();
    }


function renderOptionsNormal() {
    let grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    if (gameState.mode === 'comma') {
        let btnTrue = document.createElement('button');
        btnTrue.className = 'option-btn';
        btnTrue.innerText = 'Beistrich setzen (,)';
        btnTrue.onclick = () => fillSlot(true);
        let btnFalse = document.createElement('button');
        btnFalse.className = 'option-btn';
        btnFalse.innerText = 'Kein Beistrich';
        btnFalse.onclick = () => fillSlot(false);
        grid.appendChild(btnTrue);
        grid.appendChild(btnFalse);
        return;
    }
    let slotIdx = selectedSlot ? parseInt(selectedSlot.dataset.slotIndex) : 0;
    let correctArt = gameState.currentSentence.slots[slotIdx]?.art || '';
    let options = [];

    // ----- Modus-spezifische Logik (Original, aber erweitert) -----
    if (gameState.mode === 'preposition') {
        let sentenceText = gameState.currentSentence.text || '';
        let genitivPreps = /\b(wegen|trotz|aufgrund|mangels|laut|zufolge|statt|anstatt|innerhalb|außerhalb|während|angesichts|zugunsten|zulasten)\b/i;
        if (['der', 'die', 'das', 'den', 'dem', 'des'].includes(correctArt)) {
            options = ['_', 'der', 'die', 'das', 'den', 'dem', 'des'];
        } else if (['ein', 'eine', 'einen', 'einem', 'einer', 'eines'].includes(correctArt)) {
            options = ['_', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines'];
        } else if (correctArt === '_') {
            if (genitivPreps.test(sentenceText)) {
                options = ['_', 'der', 'die', 'das', 'des', 'dem'];
            } else {
                options = ['_', 'die', 'das', 'den', 'ein', 'eine', 'einen'];
            }
        } else if (correctArt.startsWith('sein') || correctArt.startsWith('ihr') || correctArt.startsWith('mein') || correctArt.startsWith('unser') || correctArt.startsWith('dein') || correctArt.startsWith('euer')) {
            let base = correctArt.substring(0, 4);
            if (base === 'sein') options = ['_', 'sein', 'seine', 'seinen', 'seinem', 'seiner'];
            else if (base === 'ihr') options = ['_', 'ihr', 'ihre', 'ihren', 'ihrem', 'ihrer'];
            else if (base === 'mein') options = ['_', 'mein', 'meine', 'meinen', 'meinem', 'meiner'];
            else if (base === 'unse') options = ['_', 'unser', 'unsere', 'unseren', 'unserem', 'unserer'];
            else if (base === 'dein') options = ['_', 'dein', 'deine', 'deinen', 'deinem', 'deiner'];
            else if (base === 'euer') options = ['_', 'euer', 'eure', 'euren', 'eurem', 'eurer'];
            else options = ['_', 'der', 'die', 'das', 'den', 'dem'];
        } else {
            options = ['_', 'der', 'die', 'das', 'den', 'dem'];
        }
    } else if (gameState.mode === 'definite') {
        options = ['der', 'die', 'das', 'den', 'dem', 'des'];
    } else if (gameState.mode === 'indefinite') {
        options = ['ein', 'eine', 'einen', 'einem', 'einer', 'eines', '_'];
    } else if (gameState.mode === 'negation') {
        let negAdv = ['nicht','keineswegs','niemals','nichts','keinerlei','keinesfalls'];
        if (negAdv.includes(correctArt)) {
            options = ['nicht', 'keineswegs', 'niemals', 'nichts', 'keinerlei', 'keinesfalls'];
        } else {
            options = ['kein', 'keine', 'keinen', 'keinem', 'keiner', 'keines'];
        }
    } else if (gameState.mode === 'possessive') {
        let base = gameState.currentSentence.slots[slotIdx]?.base || 'mein';
        if (base === 'mein') options = ['mein', 'meine', 'meinen', 'meinem', 'meiner', 'meines'];
        else if (base === 'dein') options = ['dein', 'deine', 'deinen', 'deinem', 'deiner', 'deines'];
        else if (base === 'sein') options = ['sein', 'seine', 'seinen', 'seinem', 'seiner', 'seines'];
        else if (base === 'ihr') options = ['ihr', 'ihre', 'ihren', 'ihrem', 'ihrer', 'ihres'];
        else if (base === 'unser') options = ['unser', 'unsere', 'unseren', 'unserem', 'unserer', 'unseres'];
        else if (base === 'euer') options = ['euer', 'eure', 'euren', 'eurem', 'eurer', 'eures'];
        else options = ['mein', 'meine', 'meinen', 'meinem', 'meiner'];
    } else if (gameState.mode === 'relative') {
        options = ['der', 'die', 'das', 'den', 'dem', 'denen', 'dessen', 'deren',
                   'mit dem', 'mit der', 'in dem', 'in der', 'in die', 'in das',
                   'an dem', 'an der', 'auf den', 'auf die', 'auf das', 'auf dem',
                   'für den', 'für die', 'für das', 'von dem', 'von der',
                   'über den', 'über die', 'über das', 'zu dem', 'nach dem',
                   'vor der', 'bei dem', 'aus dem', 'aus der'];
    } else {
        options = ['der', 'die', 'das'];
    }

    // Buttons für die ermittelten Optionen erzeugen
    options.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt === '_' ? '∅ (kein Artikel)' : opt;
        btn.onclick = () => fillSlot(opt);
        grid.appendChild(btn);
    });
}


    function fillSlot(val) {
        if (!selectedSlot) return;
        let idx = parseInt(selectedSlot.dataset.slotIndex);
        let correct = gameState.currentSentence.slots[idx].art;
        if (gameState.mode === 'comma') correct = gameState.currentSentence.slots[idx].comma;
        let accepted = gameState.currentSentence.slots[idx].accepted || [correct];
        let isCorrect = (gameState.mode === 'comma') ? (val === correct) : accepted.some(a => val.toLowerCase() === a.toLowerCase());
        gameState.totalAttempts++;
        if (isCorrect) {
            selectedSlot.classList.add('correct');
            selectedSlot.classList.remove('selected');
            if (gameState.mode === 'comma') {
                selectedSlot.innerText = correct ? ',' : '—';
            } else {
                selectedSlot.innerText = (val === '_' ? '∅' : val);
            }
            gameState.correctAnswers++;
            gameState.streak++;
            if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak;
            let pts = 10 + (gameState.streak >= 5 ? 10 : 0) + (gameState.streak >= 10 ? 15 : 0);
            gameState.points += pts;
            updateStats();
            playCorrect();
            pointsPopup(pts, gameState.streak >= 5);
            let allCorrect = [...document.querySelectorAll('.article-slot')].every(s => s.classList.contains('correct'));
            if (allCorrect) {
                setTimeout(() => {
                    gameState.solvedCount++;
                    let idxRem = gameState.remainingSentences.indexOf(gameState.currentSentence);
                    if (idxRem !== -1) gameState.remainingSentences.splice(idxRem, 1);
                    updateProgress();
                    loadNextSentence();
                }, 600);
            } else {
                let nextSlot = document.querySelector('.article-slot:not(.correct)');
                if (nextSlot) selectSlot(nextSlot);
                else selectedSlot = null;
            }
        } else {
            selectedSlot.classList.add('wrong');
            gameState.streak = 0;
            updateStats();
            playWrong();
            setTimeout(() => {
                if (selectedSlot) selectedSlot.classList.remove('wrong');
            }, 800);
        }
    }

    function selectSlot(slot) {
        if (slot.classList.contains('correct')) return;
        document.querySelectorAll('.article-slot').forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
        selectedSlot = slot;
        renderOptionsNormal();
    }

    function skipSentence() {
        gameState.streak = 0;
        updateStats();
        if (gameState.remainingSentences.length) {
            let first = gameState.remainingSentences.shift();
            gameState.remainingSentences.push(first);
        }
        loadNextSentence();
    }

    function endGame() {
        let elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        document.getElementById('finalPoints').innerText = gameState.points;
        document.getElementById('finalTime').innerText = `${Math.floor(elapsed / 60)}:${(elapsed % 60).toString().padStart(2, '0')}`;
        document.getElementById('bestStreak').innerText = gameState.bestStreak;
        let accuracy = gameState.totalAttempts > 0 ? Math.round((gameState.correctAnswers / gameState.totalAttempts) * 100) : 0;
        document.getElementById('accuracy').innerText = accuracy + '%';
        showScreen('resultScreen');
        document.getElementById('backBtn').style.display = 'none';
        updateResultLeaderboard();
    }

    function goToMenu() {
        document.getElementById('backBtn').style.display = 'none';
        showScreen('startScreen');
        updateMenuLeaderboard();
    }

    function playAgain() {
        startGame(gameState.mode);
    }

    function saveScore() {
        let name = document.getElementById('playerName').value.trim() || 'Anonym';
        let elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        let entry = { name, points: gameState.points, time: elapsed, mode: gameState.mode, date: new Date().toLocaleDateString() };
        let board = JSON.parse(localStorage.getItem('profiBoard') || '[]');
        board.push(entry);
        board.sort((a, b) => b.points - a.points);
        localStorage.setItem('profiBoard', JSON.stringify(board.slice(0, 10)));
        updateResultLeaderboard();
        updateMenuLeaderboard();
        alert('Gespeichert!');
    }

    function updateMenuLeaderboard() {
        let board = JSON.parse(localStorage.getItem('profiBoard') || '[]');
        let div = document.getElementById('menuLeaderboard');
        if (!board.length) {
            div.innerHTML = '<p>✨ Noch keine Einträge</p>';
            return;
        }
        div.innerHTML = board.slice(0, 5).map((e, i) => `<div style="padding:4px">${i + 1}. ${e.name} – ${e.points} Pkt</div>`).join('');
    }

    function updateResultLeaderboard() {
        let board = JSON.parse(localStorage.getItem('profiBoard') || '[]');
        let div = document.getElementById('resultLeaderboard');
        div.innerHTML = '<div class="mode-title">🏆 TOP 10</div>' + board.slice(0, 10).map((e, i) => `<div>${i + 1}. ${e.name} (${e.points})</div>`).join('');
    }

    function buildMenu() {
        let modes = [
            { id: "preposition", label: "📍 Präpositionen (knifflig)", icon: "📍" },
            { id: "definite", label: "🔷 Bestimmte Artikel (alle Fälle)", icon: "🔷" },
            { id: "indefinite", label: "◇ Unbestimmte Artikel + Nullartikel", icon: "◇" },
            { id: "negation", label: "⊘ Verneinung (kein/nicht)", icon: "⊘" },
            { id: "possessive", label: "👤 Possessivpronomen (C2)", icon: "👤" },
            { id: "relative", label: "🔗 Relativpronomen (Genitiv)", icon: "🔗" },
            { id: "comma", label: "📝 Beistriche – komplex", icon: "📝" },
            { id: "sentenceAnalysis", label: "🧩 Satzglieder analysieren (150 Sätze)", icon: "🧩" }
        ];
        let container = document.getElementById('modeList');
        container.innerHTML = '';
        modes.forEach(m => {
            let btn = document.createElement('button');
            btn.className = 'mode-btn';
            btn.innerHTML = `<span>${m.icon} ${m.label}</span><span style="font-size:1.2rem;">→</span>`;
            btn.onclick = () => startGame(m.id);
            container.appendChild(btn);
        });
    }

    const sentenceData = {
        preposition: prepositionSentences,
        definite: definiteSentences,
        indefinite: indefiniteSentences,
        negation: negationSentences,
        possessive: possessiveSentences,
        relative: relativeSentences,
        comma: commaSentences,
        sentenceAnalysis: analysisSentences
    };

    buildMenu();
    updateMenuLeaderboard();
    showScreen('startScreen');
</script>
</body>
</html>
