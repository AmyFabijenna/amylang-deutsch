<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍋 Passiv Champion</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#180E00;--bg2:#241600;--card:#2E1C00;--card2:#3A2200;
  --gelb:#F5D800;--gelb-h:#FFEC60;--gelb-d:#A08000;--gelb-dim:rgba(245,216,0,.12);
  --pink:#C8005A;--pink-h:#F01070;--pink-dim:rgba(200,0,90,.15);
  --ok:#50C060;--err:#E84040;--warn:#FF9020;
  --txt:#FFF8E0;--txt2:#D4C090;--gold:#FFD700;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Quicksand',sans-serif;background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 40%,#1E1200 70%,var(--bg) 100%);min-height:100vh;color:var(--txt);overflow-x:hidden;}

/* PARTICLES */
.parts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
.rip{position:absolute;border-radius:50%;border:1px solid rgba(245,216,0,.12);animation:ripOut 10s ease-out infinite;}
@keyframes ripOut{0%{transform:scale(.2);opacity:.7;}100%{transform:scale(3);opacity:0;}}
.shim{position:absolute;width:220px;height:3px;background:linear-gradient(90deg,transparent,rgba(245,216,0,.3),transparent);animation:shimFlow 8s ease-in-out infinite;}
@keyframes shimFlow{0%{transform:translateX(-220px) translateY(0) rotate(-6deg);opacity:0;}50%{opacity:1;}100%{transform:translateX(110vw) translateY(50px) rotate(-6deg);opacity:0;}}
.star{position:absolute;width:5px;height:5px;background:rgba(245,216,0,.35);border-radius:50%;animation:twink 4s ease-in-out infinite;}
@keyframes twink{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:.9;transform:scale(1.7);}}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px;}
header{text-align:center;margin-bottom:28px;padding-top:12px;}
h1{font-family:'Fredoka',sans-serif;font-size:2.6rem;background:linear-gradient(135deg,var(--gelb),var(--gelb-h),#FFF5A0,var(--gelb));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimTxt 4s linear infinite;margin-bottom:8px;}
@keyframes shimTxt{to{background-position:200% center;}}
.sub{color:var(--txt2);font-size:1.05rem;}

/* SCREENS */
.scr{display:none;animation:fadeIn .4s ease;}
.scr.on{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* BACK BTN */
.back-btn{position:fixed;top:16px;left:16px;z-index:100;display:none;background:linear-gradient(135deg,rgba(46,28,0,.95),rgba(30,18,0,.95));border:1px solid rgba(245,216,0,.3);border-radius:12px;padding:9px 16px;color:var(--txt);font-family:'Quicksand',sans-serif;font-size:.93rem;font-weight:600;cursor:pointer;transition:all .2s;}
.back-btn:hover{background:var(--card2);box-shadow:0 3px 14px rgba(245,216,0,.2);}
.back-btn.show{display:block;}

/* START SCREEN */
.menu-card{background:linear-gradient(135deg,rgba(46,28,0,.95),rgba(30,18,0,.95));border-radius:20px;padding:28px;margin-bottom:18px;border:1px solid rgba(245,216,0,.18);box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);}
.sec-title{font-family:'Fredoka',sans-serif;font-size:1.25rem;color:var(--gelb-h);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(245,216,0,.3),transparent);}
.mode-btns{display:flex;flex-direction:column;gap:10px;}
.mode-btn{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid rgba(245,216,0,.2);border-radius:14px;padding:16px 22px;color:var(--txt);font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s;text-align:left;position:relative;}
.mode-btn:hover{transform:translateX(7px);box-shadow:0 4px 20px rgba(245,216,0,.25);border-color:var(--gelb-h);background:linear-gradient(135deg,var(--card2),#4A2E00);}
.mode-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:1.4rem;}
.mode-desc{font-size:.82rem;color:var(--txt2);margin-top:3px;font-weight:400;}
.mode-badge{display:inline-block;background:linear-gradient(135deg,var(--pink),var(--pink-h));color:#fff;padding:2px 10px;border-radius:16px;font-size:.72rem;font-weight:700;margin-left:8px;}
.mode-badge.ab{background:linear-gradient(135deg,#5A7A00,#90C820);}

/* GAME HEADER */
.g-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.stats{display:flex;gap:12px;flex-wrap:wrap;}
.stat{background:var(--card);padding:9px 16px;border-radius:11px;border:1px solid rgba(245,216,0,.15);text-align:center;min-width:80px;}
.stat-l{font-size:.7rem;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;}
.stat-v{font-family:'Fredoka',sans-serif;font-size:1.35rem;color:var(--gelb-h);}
.fire{display:inline-block;animation:flame .5s ease infinite alternate;}
@keyframes flame{from{transform:scale(1);}to{transform:scale(1.2);}}
.mode-tag{background:linear-gradient(135deg,var(--pink),var(--pink-h));color:#fff;padding:7px 18px;border-radius:18px;font-weight:700;font-size:.86rem;}
.prog-bar{background:rgba(46,28,0,.8);border-radius:9px;height:16px;overflow:hidden;margin-bottom:22px;border:1px solid rgba(245,216,0,.15);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gelb),var(--gelb-h));transition:width .5s ease;box-shadow:0 0 8px rgba(245,216,0,.4);}
.prog-txt{text-align:center;margin-top:5px;color:var(--txt2);font-size:.86rem;}

/* QUESTION CARD */
.q-card{background:linear-gradient(135deg,rgba(46,28,0,.97),rgba(24,12,0,.99));border-radius:20px;padding:36px 28px;margin-bottom:26px;border:1px solid rgba(245,216,0,.2);box-shadow:0 8px 40px rgba(0,0,0,.5),0 0 60px rgba(245,216,0,.05);text-align:center;}
.q-num{font-size:.78rem;color:var(--txt2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;}
.q-text{font-family:'Fredoka',sans-serif;font-size:1.5rem;line-height:1.55;color:var(--txt);margin-bottom:8px;}
.q-text em{color:var(--gelb-h);font-style:normal;}
.q-hint{display:none;background:var(--pink-dim);border:1px solid rgba(200,0,90,.3);border-radius:11px;padding:12px 18px;margin-top:16px;font-size:.9rem;color:var(--txt2);}
.q-hint.on{display:block;}
.q-hint em{color:var(--gelb-h);}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:11px;margin-bottom:22px;}
.opt-btn{background:linear-gradient(135deg,var(--card),var(--card2));border:2px solid rgba(245,216,0,.2);border-radius:13px;padding:15px 22px;color:var(--txt);font-family:'Quicksand',sans-serif;font-size:.97rem;font-weight:600;cursor:pointer;transition:all .3s;text-align:left;display:flex;align-items:center;gap:14px;}
.opt-btn:hover:not(:disabled){transform:translateX(5px);box-shadow:0 4px 18px rgba(245,216,0,.2);border-color:var(--gelb-h);background:linear-gradient(135deg,var(--card2),#4A2E00);}
.opt-btn:disabled{opacity:.5;cursor:not-allowed;}
.opt-lbl{background:var(--card2);border:1px solid rgba(245,216,0,.2);border-radius:7px;padding:4px 12px;font-family:'Fredoka',sans-serif;font-size:1rem;color:var(--gelb-h);flex-shrink:0;min-width:36px;text-align:center;}
.opt-btn.ok{border-color:var(--ok)!important;background:linear-gradient(135deg,rgba(80,192,96,.25),rgba(80,192,96,.1))!important;animation:pulseOk .5s ease;}
.opt-btn.ok .opt-lbl{background:var(--ok);color:#fff;border-color:var(--ok);}
.opt-btn.wrong{border-color:var(--err)!important;background:linear-gradient(135deg,rgba(232,64,64,.25),rgba(232,64,64,.1))!important;animation:shake .45s ease;}
.opt-btn.wrong .opt-lbl{background:var(--err);color:#fff;border-color:var(--err);}
@keyframes pulseOk{0%,100%{transform:scale(1);}50%{transform:scale(1.02);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

/* CONTROLS */
.ctrls{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;}
.ctrl-btn{background:linear-gradient(135deg,var(--card),var(--card2));border:2px solid rgba(245,216,0,.25);border-radius:12px;padding:11px 22px;color:var(--txt);font-family:'Quicksand',sans-serif;font-size:.92rem;font-weight:600;cursor:pointer;transition:all .2s;}
.ctrl-btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(245,216,0,.2);border-color:var(--gelb-h);}
.ctrl-btn.prim{background:linear-gradient(135deg,#8A0040,var(--pink));border-color:var(--pink-h);color:#fff;font-weight:700;}
.ctrl-btn.prim:hover{background:linear-gradient(135deg,var(--pink),var(--pink-h));box-shadow:0 5px 22px rgba(200,0,90,.4);}
.ctrl-btn.next{background:linear-gradient(135deg,var(--gelb-d),var(--gelb));border-color:var(--gelb-h);color:#1A1000;font-weight:800;}
.ctrl-btn.next:hover{background:linear-gradient(135deg,var(--gelb),var(--gelb-h));box-shadow:0 5px 22px rgba(245,216,0,.4);}

/* POINTS POPUP */
.pp{position:fixed;font-family:'Fredoka',sans-serif;font-size:1.9rem;font-weight:700;color:var(--ok);pointer-events:none;z-index:1000;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.pp.bonus{color:var(--gold);font-size:2.3rem;}
@keyframes floatUp{0%{transform:translateY(0) scale(.8);opacity:1;}100%{transform:translateY(-80px) scale(1.2);opacity:0;}}

/* MILESTONE */
.milestone{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(24,8,0,.9);display:flex;align-items:center;justify-content:center;z-index:2000;animation:fadeIn .3s ease;}
.milestone-inner{text-align:center;animation:scaleIn .5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes scaleIn{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
.milestone-n{font-family:'Fredoka',sans-serif;font-size:6rem;color:var(--gelb-h);margin-bottom:12px;}
.milestone-t{font-family:'Fredoka',sans-serif;font-size:2rem;color:var(--txt);}

/* RESULT */
.res-card{background:linear-gradient(135deg,rgba(46,28,0,.97),rgba(24,12,0,.99));border-radius:20px;padding:34px;margin-bottom:18px;border:1px solid rgba(245,216,0,.2);box-shadow:0 8px 40px rgba(0,0,0,.5);text-align:center;}
.res-title{font-family:'Fredoka',sans-serif;font-size:2rem;margin-bottom:22px;color:var(--gelb-h);}
.res-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:26px;}
.res-stat{background:rgba(46,28,0,.6);padding:16px;border-radius:13px;border:1px solid rgba(245,216,0,.15);}
.res-stat-l{font-size:.8rem;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;}
.res-stat-v{font-family:'Fredoka',sans-serif;font-size:1.9rem;color:var(--gelb-h);}
.name-input{width:100%;max-width:320px;background:rgba(46,28,0,.9);border:2px solid rgba(245,216,0,.3);border-radius:12px;padding:13px 17px;color:var(--txt);font-family:'Quicksand',sans-serif;font-size:1rem;margin:18px auto;display:block;text-align:center;}
.name-input:focus{outline:none;border-color:var(--gelb-h);box-shadow:0 0 14px rgba(245,216,0,.25);}
.lb-wrap{background:rgba(46,28,0,.6);border-radius:13px;padding:22px;margin-top:22px;border:1px solid rgba(245,216,0,.15);}
.lb-title{font-family:'Fredoka',sans-serif;font-size:1.3rem;color:var(--gelb-h);margin-bottom:15px;text-align:center;}
.lb-row{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;padding:10px;background:rgba(46,28,0,.4);border-radius:9px;margin-bottom:7px;align-items:center;border:1px solid rgba(245,216,0,.1);}
.lb-rank{font-size:1.1rem;font-weight:700;text-align:center;}
.lb-name{font-weight:600;}
.lb-score{color:var(--gelb-h);font-weight:700;}
.lb-time{color:var(--txt2);font-size:.85rem;}
.medal-1{color:#FFD700;}
.medal-2{color:#C0C0C0;}
.medal-3{color:#CD7F32;}

/* CONFETTI */
.conf{position:fixed;pointer-events:none;z-index:3000;}

@media(max-width:700px){
  h1{font-size:2rem;}
  .q-text{font-size:1.25rem;}
  .mode-btn{padding:13px 16px;}
  .res-stats{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div class="parts" id="parts"></div>
<button class="back-btn" id="backBtn" onclick="goMenu()">← Menü</button>

<div class="wrap">
<header>
  <h1>🍋 Passiv Champion</h1>
  <p class="sub">Das Passiv auf Deutsch trainieren – Präsens, Präteritum, Perfekt</p>
</header>

<!-- START SCREEN -->
<div id="startScr" class="scr on">
  <div class="menu-card">
    <div class="sec-title"><span>🔆 Passiv Gegenwart</span><span class="sec-line"></span></div>
    <div class="mode-btns">
      <button class="mode-btn" onclick="startGame('praesens')">
        <span class="mode-icon">🔨</span>
        Passiv Präsens &amp; Modalverb
        <div class="mode-desc">Passiv Präsens bilden – mit und ohne Modalverb (14 Fragen)</div>
      </button>
      <button class="mode-btn" onclick="startGame('verbote')">
        <span class="mode-icon">🚫</span>
        Verbote &amp; Regeln
        <div class="mode-desc">Verbotsschilder im Passiv formulieren (8 Fragen)</div>
      </button>
      <button class="mode-btn" onclick="startGame('aktivpassiv')">
        <span class="mode-icon">🔄</span>
        Aktiv ↔ Passiv Präsens
        <div class="mode-desc">Zwischen Aktiv und Passiv umschreiben (8 Fragen)</div>
      </button>
    </div>
  </div>
  <div class="menu-card">
    <div class="sec-title"><span>📜 Passiv Vergangenheit</span><span class="sec-line"></span></div>
    <div class="mode-btns">
      <button class="mode-btn" onclick="startGame('praet_a')">
        <span class="mode-icon">📜</span>
        Passiv Präteritum<span class="mode-badge ab">A</span>
        <div class="mode-desc">wurde / wurden + Partizip II – Teil A (8 Fragen)</div>
      </button>
      <button class="mode-btn" onclick="startGame('praet_b')">
        <span class="mode-icon">📜</span>
        Passiv Präteritum<span class="mode-badge ab">B</span>
        <div class="mode-desc">wurde / wurden + Partizip II – Teil B (8 Fragen)</div>
      </button>
      <button class="mode-btn" onclick="startGame('praet_modal_a')">
        <span class="mode-icon">⚙️</span>
        Passiv Prät. + Modalverb<span class="mode-badge ab">A</span>
        <div class="mode-desc">musste/mussten/durfte + PP + werden – Teil A (5 Fragen)</div>
      </button>
      <button class="mode-btn" onclick="startGame('praet_modal_b')">
        <span class="mode-icon">⚙️</span>
        Passiv Prät. + Modalverb<span class="mode-badge ab">B</span>
        <div class="mode-desc">sollte/konnte/wollte + PP + werden – Teil B (5 Fragen)</div>
      </button>
    </div>
  </div>
  <div class="menu-card">
    <div class="sec-title"><span>⭐ Passiv Perfekt &amp; Gemischt</span><span class="sec-line"></span></div>
    <div class="mode-btns">
      <button class="mode-btn" onclick="startGame('perfekt_a')">
        <span class="mode-icon">⭐</span>
        Passiv Perfekt<span class="mode-badge ab">A</span>
        <div class="mode-desc">sein + PP + worden (nicht geworden!) – Teil A (6 Fragen)</div>
      </button>
      <button class="mode-btn" onclick="startGame('perfekt_b')">
        <span class="mode-icon">⭐</span>
        Passiv Perfekt<span class="mode-badge ab">B</span>
        <div class="mode-desc">sein + PP + worden – Teil B (6 Fragen)</div>
      </button>
      <button class="mode-btn" onclick="startGame('musste_a')">
        <span class="mode-icon">✅</span>
        Was musste gemacht werden?<span class="mode-badge ab">A</span>
        <div class="mode-desc">Start-up gründen: Aufgaben im Passiv Prät. + Modalverb (8 Fragen)</div>
      </button>
      <button class="mode-btn" onclick="startGame('musste_b')">
        <span class="mode-icon">✅</span>
        Was musste gemacht werden?<span class="mode-badge ab">B</span>
        <div class="mode-desc">Veranstaltung organisieren: Passiv Prät. + Modalverb (8 Fragen)</div>
      </button>
    </div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScr" class="scr">
  <div class="g-header">
    <div class="stats">
      <div class="stat"><div class="stat-l">Punkte</div><div class="stat-v" id="score">0</div></div>
      <div class="stat"><div class="stat-l">Serie</div><div class="stat-v" id="streak">0 <span class="fire" id="fire" style="display:none">🔥</span></div></div>
      <div class="stat"><div class="stat-l">Leben</div><div class="stat-v" id="lives">❤️❤️❤️</div></div>
    </div>
    <div class="mode-tag" id="modeTag"></div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0"></div></div>
  <div class="prog-txt" id="progTxt"></div>

  <div class="q-card">
    <div class="q-num" id="qNum"></div>
    <div class="q-text" id="qText"></div>
    <div class="q-hint" id="qHint"></div>
  </div>

  <div class="opts" id="opts">
    <button class="opt-btn" id="oA" onclick="answer('a')"><span class="opt-lbl">A</span><span id="tA"></span></button>
    <button class="opt-btn" id="oB" onclick="answer('b')"><span class="opt-lbl">B</span><span id="tB"></span></button>
    <button class="opt-btn" id="oC" onclick="answer('c')"><span class="opt-lbl">C</span><span id="tC"></span></button>
  </div>

  <div class="ctrls">
    <button class="ctrl-btn" onclick="showHint()">💡 Tipp</button>
    <button class="ctrl-btn next" id="nextBtn" style="display:none" onclick="nextQ()">Weiter →</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScr" class="scr">
  <div class="res-card">
    <div class="res-title" id="resTitle"></div>
    <div class="res-stats">
      <div class="res-stat"><div class="res-stat-l">Punkte</div><div class="res-stat-v" id="resPts"></div></div>
      <div class="res-stat"><div class="res-stat-l">Richtig</div><div class="res-stat-v" id="resRight"></div></div>
      <div class="res-stat"><div class="res-stat-l">Genauigkeit</div><div class="res-stat-v" id="resAcc"></div></div>
      <div class="res-stat"><div class="res-stat-l">Zeit</div><div class="res-stat-v" id="resTime"></div></div>
    </div>
    <input class="name-input" id="nameInput" type="text" placeholder="Dein Name für die Bestenliste…" maxlength="24">
    <div class="ctrls" style="margin-top:4px;">
      <button class="ctrl-btn prim" onclick="saveLB()">🏆 Eintragen</button>
      <button class="ctrl-btn next" onclick="restartMode()">↺ Nochmal</button>
      <button class="ctrl-btn" onclick="goMenu()">← Menü</button>
    </div>
    <div class="lb-wrap" id="lbWrap" style="display:none">
      <div class="lb-title">🏆 Bestenliste</div>
      <div id="lbList"></div>
    </div>
  </div>
</div>

</div><!-- /wrap -->

<script>
// ============================================================
// ALLE FRAGEN
// ============================================================
const MODES = {
praesens:{title:"Passiv Präsens & Modalverb",icon:"🔨",qs:[
{p:"Man transportiert das Gepäck zum Terminal.",a:"Das Gepäck wird zum Terminal transportiert.",b:"Das Gepäck werden zum Terminal transportiert.",c:"Das Gepäck wird zum Terminal transportieren.",k:"a",t:"Singular → <em>wird</em> + Partizip II"},
{p:"Man serviert das Frühstück ab 7 Uhr.",a:"Das Frühstück werden ab 7 Uhr serviert.",b:"Das Frühstück wird ab 7 Uhr serviert.",c:"Das Frühstück wird ab 7 Uhr servieren.",k:"b",t:"<em>wird</em> (Sg.) + Partizip II am Satzende"},
{p:"Man bestellt die Waren online.",a:"Die Waren werden online bestellt.",b:"Die Waren wird online bestellt.",c:"Die Waren werden online bestellen.",k:"a",t:"Plural → <em>werden</em> + Partizip II"},
{p:"Man kontrolliert die Tickets am Eingang.",a:"Die Tickets wird am Eingang kontrolliert.",b:"Die Tickets werden am Eingang kontrollieren.",c:"Die Tickets werden am Eingang kontrolliert.",k:"c",t:"Plural <em>Tickets</em> → <em>werden</em>"},
{p:"Man schickt den Brief per Express.",a:"Der Brief werden per Express geschickt.",b:"Der Brief wird per Express schicken.",c:"Der Brief wird per Express geschickt.",k:"c",t:"<em>schicken</em> → PP: <em>geschickt</em>"},
{p:"Man druckt die Fotos sofort aus.",a:"Die Fotos werden sofort ausgedruckt.",b:"Die Fotos wird sofort ausgedruckt.",c:"Die Fotos werden sofort ausdrucken.",k:"a",t:"Trennbares Verb: PP = <em>ausgedruckt</em>"},

let curMode='',qs=[],qi=0,score=0,streak=0,lives=3,right=0,startT=0,answered=false,lastMode='';

function startGame(m){
  curMode=m; lastMode=m;
  const md=MODES[m];
  qs=[...md.qs].sort(()=>Math.random()-.5);
  qi=0;score=0;streak=0;lives=3;right=0;answered=false;
  startT=Date.now();
  document.getElementById('backBtn').classList.add('show');
  document.getElementById('modeTag').innerHTML=md.icon+' '+md.title;
  showScr('gameScr');
  renderQ();
}

function renderQ(){
  if(qi>=qs.length||lives<=0){endGame();return;}
  const q=qs[qi];
  answered=false;
  document.getElementById('qNum').textContent='Frage '+(qi+1)+' von '+qs.length;
  document.getElementById('qText').innerHTML=q.p;
  document.getElementById('tA').innerHTML=q.a;
  document.getElementById('tB').innerHTML=q.b;
  document.getElementById('tC').innerHTML=q.c;
  document.getElementById('qHint').className='q-hint';
  document.getElementById('qHint').innerHTML='💡 '+q.t;
  document.getElementById('nextBtn').style.display='none';
  ['oA','oB','oC'].forEach(id=>{
    const el=document.getElementById(id);
    el.className='opt-btn'; el.disabled=false;
  });
  const pct=(qi/qs.length)*100;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progTxt').textContent='Fortschritt: '+qi+' / '+qs.length;
  updateStats();
}

function answer(choice){
  if(answered)return;
  answered=true;
  const q=qs[qi];
  const btnMap={a:'oA',b:'oB',c:'oC'};
  const el=document.getElementById(btnMap[choice]);
  ['oA','oB','oC'].forEach(id=>document.getElementById(id).disabled=true);

  if(choice===q.k){
    el.classList.add('ok');
    streak++; right++;
    const pts=streak>=3?20:10;
    score+=pts;
    showPopup(streak>=3?'+'+pts+' 🔥':'+'+pts, el, streak>=3);
    if(streak===3||streak===5||streak===10) showMilestone(streak);
  } else {
    el.classList.add('wrong');
    document.getElementById(btnMap[q.k]).classList.add('ok');
    streak=0; lives--;
    showPopup('✘'+(lives>0?' '+lives+'❤️ übrig':''), el, false);
    document.getElementById('qHint').classList.add('on');
  }
  document.getElementById('nextBtn').style.display='block';
  updateStats();
  if(lives<=0){setTimeout(endGame,1200);return;}
}

function showHint(){document.getElementById('qHint').classList.toggle('on');}

function nextQ(){qi++;renderQ();}

function updateStats(){
  document.getElementById('score').textContent=score;
  const s=streak;
  document.getElementById('streak').innerHTML=s+(s>=3?' <span class="fire">🔥</span>':'');
  const h='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
  document.getElementById('lives').textContent=h;
}

function showPopup(txt,el,bonus){
  const p=document.createElement('div');
  p.className='pp'+(bonus?' bonus':'');
  p.textContent=txt;
  const r=el.getBoundingClientRect();
  p.style.left=r.left+r.width/2-30+'px';
  p.style.top=r.top+window.scrollY-20+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1000);
}

function showMilestone(n){
  const msgs={3:'Starke Serie! 🔥',5:'Unaufhaltbar! ⚡',10:'Passiv-Meister! 🏆'};
  const div=document.createElement('div');
  div.className='milestone';
  div.innerHTML=`<div class="milestone-inner"><div class="milestone-n">${n}🔥</div><div class="milestone-t">${msgs[n]||'Super!'}</div></div>`;
  document.body.appendChild(div);
  setTimeout(()=>div.remove(),1800);
}

function endGame(){
  const t=Math.round((Date.now()-startT)/1000);
  const acc=qs.length>0?Math.round((right/qs.length)*100):0;
  const emojis=acc>=90?'🏆':acc>=70?'⭐':acc>=50?'🌻':'💪';
  document.getElementById('resTitle').textContent=emojis+' Ergebnis!';
  document.getElementById('resPts').textContent=score;
  document.getElementById('resRight').textContent=right+' / '+qs.length;
  document.getElementById('resAcc').textContent=acc+'%';
  const m=Math.floor(t/60),s=t%60;
  document.getElementById('resTime').textContent=(m>0?m+'m ':'')+s+'s';
  showScr('resultScr');
  if(acc>=90)confetti();
}

function restartMode(){startGame(lastMode);}

function goMenu(){
  showScr('startScr');
  document.getElementById('backBtn').classList.remove('show');
}

function showScr(id){
  ['startScr','gameScr','resultScr'].forEach(s=>{
    document.getElementById(s).className='scr'+(s===id?' on':'');
  });
}

// ============================================================
// LEADERBOARD (localStorage)
// ============================================================
function saveLB(){
  const name=document.getElementById('nameInput').value.trim()||'Anonym';
  const key='passivChampion_'+curMode;
  let lb=JSON.parse(localStorage.getItem(key)||'[]');
  const t=document.getElementById('resTime').textContent;
  lb.push({name,score,acc:parseInt(document.getElementById('resAcc').textContent),time:t,date:new Date().toLocaleDateString('de')});
  lb.sort((a,b)=>b.score-a.score);
  lb=lb.slice(0,10);
  localStorage.setItem(key,JSON.stringify(lb));
  renderLB(lb);
  document.getElementById('lbWrap').style.display='block';
}

function renderLB(lb){
  const medals=['🥇','🥈','🥉'];
  document.getElementById('lbList').innerHTML=lb.map((e,i)=>`
    <div class="lb-row">
      <div class="lb-rank">${medals[i]||'#'+(i+1)}</div>
      <div class="lb-name">${e.name}</div>
      <div class="lb-score">${e.score} Pkt.</div>
      <div class="lb-time">${e.acc}% · ${e.time}</div>
    </div>`).join('');
}

// ============================================================
// CONFETTI
// ============================================================
function confetti(){
  const cols=['#F5D800','#C8005A','#FF7040','#50C060','#40A0FF','#FFEC60','#FF40A0'];
  for(let i=0;i<80;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='conf';
      c.style.cssText=`left:${Math.random()*100}vw;top:-10px;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation:confFall ${1.5+Math.random()}s ease-in forwards;`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3000);
    },i*30);
  }
}
const confStyle=document.createElement('style');
confStyle.textContent='@keyframes confFall{to{transform:translateY(105vh) rotate(720deg);opacity:0;}}';
document.head.appendChild(confStyle);

// ============================================================
// PARTICLE BACKGROUND
// ============================================================
const pWrap=document.getElementById('parts');
for(let i=0;i<6;i++){
  const r=document.createElement('div');r.className='rip';
  r.style.cssText=`width:${100+i*120}px;height:${100+i*120}px;left:${10+i*14}%;top:${15+i*12}%;animation-delay:${i*1.5}s;`;
  pWrap.appendChild(r);
}
for(let i=0;i<4;i++){
  const s=document.createElement('div');s.className='shim';
  s.style.cssText=`top:${20+i*20}%;animation-delay:${i*2}s;animation-duration:${7+i}s;`;
  pWrap.appendChild(s);
}
for(let i=0;i<20;i++){
  const st=document.createElement('div');st.className='star';
  st.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;`;
  pWrap.appendChild(st);
}
</script>
