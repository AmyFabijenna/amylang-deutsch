<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEUTSCH-STAR ⭐</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2a1205;
            --primary-light: #3d1a08;
            --accent: #ff6b35;
            --accent-glow: #ffb347;
            --indefinite: #ff4da6;
            --indefinite-glow: #ff80c0;
            --success: #75c743;
            --error: #e85d75;
            --warning: #ff9f1c;
            --bg-dark: #1a0800;
            --bg-card: #2d1005;
            --text: #fff8f0;
            --text-muted: #c88060;
            --gold: #ffd700;
            --possessive: #8b2500;
            --possessive-glow: #ff7040;
            --relative: #7a1f00;
            --relative-glow: #ff6030;
            --comma: #9b3d00;
            --comma-glow: #ff8050;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(160deg, #1a0800 0%, #2d1005 40%, #3d1808 70%, #1a0800 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        .ripples { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 150, 50, 0.2);
            animation: rippleOut 9s ease-out infinite;
        }
        @keyframes rippleOut {
            0% { transform: scale(0.2); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        .shimmer {
            position: absolute;
            width: 200px; height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,180,80,0.5), transparent);
            animation: shimmerFlow 7s ease-in-out infinite;
        }
        @keyframes shimmerFlow {
            0% { transform: translateX(-200px) translateY(0) rotate(-8deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(110vw) translateY(40px) rotate(-8deg); opacity: 0; }
        }
        .star {
            position: absolute;
            width: 6px; height: 6px;
            background: rgba(255, 180, 80, 0.6);
            border-radius: 50%;
            animation: twinkle 4s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.6); }
        }

        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; padding-top: 10px; }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ff6b35 0%, #ffb347 20%, #ffd700 40%, #ff69b4 60%, #ff6b35 80%, #ffb347 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 4s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes shimmerText { to { background-position: 200% center; } }
        .subtitle { color: var(--text-muted); font-size: 1.05rem; }

        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .menu-card {
            background: linear-gradient(135deg, rgba(45,16,5,0.97) 0%, rgba(35,10,3,0.97) 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,150,50,0.2);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,180,80,0.1);
        }
        .mode-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; margin-bottom: 20px; color: #ffd700; }
        .mode-buttons { display: flex; flex-direction: column; gap: 12px; }
        .mode-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 1px solid rgba(255,150,50,0.2);
            border-radius: 15px;
            padding: 18px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
        }
        .mode-btn:hover {
            transform: translateX(8px);
            box-shadow: 0 4px 20px rgba(255,150,50,0.35);
            border-color: #ffb347;
            background: linear-gradient(135deg, var(--primary-light) 0%, #5c2800 100%);
        }
        .mode-btn .mode-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
        .mode-btn .mode-desc { font-size: 0.83rem; color: var(--text-muted); margin-top: 4px; font-weight: 400; }
        .mode-badge { display: inline-block; background: linear-gradient(135deg, #9e1a6e, #e84aad); color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; margin-left: 8px; }
        .mode-badge.new-badge { background: linear-gradient(135deg, #5a7a1a, #75c743); }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
        .stats-bar { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-item { background: rgba(45,16,5,0.6); padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(255,150,50,0.2); text-align: center; min-width: 90px; }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: #ffd700; }
        .streak-fire { display: inline-block; animation: flame 0.5s ease infinite alternate; }
        @keyframes flame { from { transform: scale(1); } to { transform: scale(1.2); } }

        .progress-bar { background: rgba(61,16,45,0.8); border-radius: 10px; height: 18px; overflow: hidden; margin-bottom: 25px; border: 1px solid rgba(255,150,50,0.15); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b35, #ffb347, #ffd700); transition: width 0.5s ease; box-shadow: 0 0 10px rgba(255,180,50,0.6); }
        .progress-text { text-align: center; margin-top: 6px; color: var(--text-muted); font-size: 0.88rem; }

        .mode-indicator { background: linear-gradient(135deg, #ff6b35, #ffb347); color: #2a1205; padding: 8px 20px; border-radius: 20px; font-weight: 700; font-size: 0.88rem; }
        .mode-indicator.preposition { background: linear-gradient(135deg, #e05a20, #ff8c42); }
        .mode-indicator.definite { background: linear-gradient(135deg, #ff4500, #ff8c00); }
        .mode-indicator.indefinite { background: linear-gradient(135deg, #ff1493, #ff69b4); }
        .mode-indicator.negation { background: linear-gradient(135deg, #cc3300, #ff5500); }
        .mode-indicator.possessive { background: linear-gradient(135deg, #8b4500, #cc6600); }
        .mode-indicator.relative { background: linear-gradient(135deg, #7a3000, #bb5500); }
        .mode-indicator.comma { background: linear-gradient(135deg, #9b3d00, #dd6600); }

        .sentence-box {
            background: linear-gradient(135deg, rgba(61,16,45,0.95), rgba(37,8,28,0.98));
            border-radius: 20px;
            padding: 38px 30px;
            margin-bottom: 28px;
            border: 1px solid rgba(255,150,50,0.25);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 60px rgba(255,180,50,0.08);
            text-align: center;
        }
        .sentence { font-family: 'Fredoka', sans-serif; font-size: 1.75rem; line-height: 2.6; margin-bottom: 10px; }
        .word { display: inline-block; margin: 0 4px; }
        .article-slot {
            display: inline-block;
            min-width: 90px;
            padding: 7px 14px;
            background: rgba(58,10,38,0.9);
            border: 2px solid rgba(255,150,50,0.35);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            color: var(--text-muted);
        }
        .article-slot:hover { border-color: #ffb347; transform: scale(1.05); }
        .article-slot.selected { background: rgba(255,180,50,0.15); border-color: #ffd700; color: #ffd700; }
        .article-slot.correct {
            background: linear-gradient(135deg, rgba(117,199,67,0.3), rgba(117,199,67,0.1));
            border-color: var(--success); color: var(--success);
            animation: pulseSuccess 0.6s ease;
        }
        .article-slot.wrong {
            background: linear-gradient(135deg, rgba(232,93,117,0.3), rgba(232,93,117,0.1));
            border-color: var(--error); color: var(--error);
            animation: shake 0.5s ease;
        }
        @keyframes pulseSuccess { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .hint-box {
            display: none;
            background: rgba(255,150,50,0.1);
            border: 1px solid rgba(255,150,50,0.3);
            border-radius: 12px;
            padding: 14px 20px;
            margin-top: 18px;
            color: var(--text);
            font-size: 0.95rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid rgba(255,150,50,0.25);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255,150,50,0.35);
            border-color: #ffb347;
            background: linear-gradient(135deg, var(--primary-light) 0%, #5c2800 100%);
        }
        .option-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .control-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .control-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid rgba(255,150,50,0.25);
            border-radius: 12px;
            padding: 12px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,150,50,0.2);
            border-color: #ffb347;
        }
        .control-btn.primary {
            background: linear-gradient(135deg, #ff6b35 0%, #ffb347 100%);
            border-color: #ffd700;
            color: #2a1205;
            font-weight: 700;
        }
        .control-btn.primary:hover {
            background: linear-gradient(135deg, #ffb347 0%, #ffd700 100%);
            box-shadow: 0 6px 25px rgba(255,180,50,0.5);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: none;
            background: linear-gradient(135deg, rgba(45,16,5,0.97) 0%, rgba(35,10,3,0.97) 100%);
            border: 1px solid rgba(255,150,50,0.25);
            border-radius: 12px;
            padding: 10px 18px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: linear-gradient(135deg, var(--primary-light) 0%, #5c2800 100%);
            box-shadow: 0 4px 15px rgba(255,150,50,0.2);
        }

        .result-card {
            background: linear-gradient(135deg, rgba(45,16,5,0.97) 0%, rgba(35,10,3,0.97) 100%);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,150,50,0.2);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            text-align: center;
        }
        .result-title { font-family: 'Fredoka', sans-serif; font-size: 2rem; margin-bottom: 25px; color: #ffd700; }
        .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px; margin-bottom: 28px; }
        .result-stat { background: rgba(58,10,38,0.6); padding: 18px; border-radius: 14px; border: 1px solid rgba(255,150,50,0.15); }
        .result-stat-label { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .result-stat-value { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: #ffd700; }
        .player-name-input {
            width: 100%;
            max-width: 350px;
            background: rgba(10,10,24,0.9);
            border: 2px solid rgba(255,150,50,0.25);
            border-radius: 12px;
            padding: 14px 18px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            margin: 20px auto;
            display: block;
            text-align: center;
        }
        .player-name-input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255,180,50,0.3);
        }

        .leaderboard-container { background: rgba(58,10,38,0.6); border-radius: 14px; padding: 25px; margin-top: 25px; border: 1px solid rgba(255,150,50,0.15); }
        .leaderboard-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: #ffd700; margin-bottom: 18px; text-align: center; }
        .leaderboard-entry {
            display: grid;
            grid-template-columns: 50px 1fr auto auto;
            gap: 12px;
            padding: 12px;
            background: rgba(45,16,5,0.3);
            border-radius: 10px;
            margin-bottom: 8px;
            align-items: center;
            border: 1px solid rgba(255,150,50,0.12);
        }
        .leaderboard-rank { font-size: 1.2rem; font-weight: 700; text-align: center; }
        .leaderboard-name { font-weight: 600; color: var(--text); }
        .leaderboard-score { color: #ffd700; font-weight: 700; }
        .leaderboard-time { color: var(--text-muted); font-size: 0.88rem; }

        .points-popup {
            position: fixed;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--success);
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .points-popup.streak-bonus { color: var(--gold); font-size: 2.2rem; }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }

        .milestone-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(31,6,20,0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }
        .milestone-content {
            text-align: center;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes scaleIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .milestone-number { font-family: 'Fredoka', sans-serif; font-size: 6rem; color: #ffd700; margin-bottom: 15px; filter: drop-shadow(0 0 20px rgba(255,180,50,0.7)); }
        .milestone-text { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--text); }

        .confetti { position: fixed; pointer-events: none; z-index: 3000; }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .sentence { font-size: 1.4rem; line-height: 2.2; }
            .article-slot { min-width: 70px; padding: 6px 10px; font-size: 0.9rem; }
            .mode-btn { padding: 14px 18px; }
            .result-stats { grid-template-columns: 1fr; }
        }

        /* ── Hover-Nomen ── */
        .noun-hover {
            display: inline-block;
            position: relative;
            cursor: help;
            border-bottom: 2px dotted rgba(255,180,50,0.5);
            transition: border-color 0.2s;
        }
        .noun-hover:hover { border-bottom-color: #ffd700; }
        .noun-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #3d1808, #5c2800);
            border: 1px solid rgba(255,180,80,0.6);
            border-radius: 9px;
            padding: 5px 14px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #ffd700;
            white-space: nowrap;
            z-index: 200;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .noun-tooltip::after {
            content: '';
            position: absolute;
            top: 100%; left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(255,180,80,0.6);
        }
        .noun-hover:hover .noun-tooltip { display: block; }

    </style>
</head>
<body>
    <div class="ripples" id="ripples"></div>
    <button class="back-btn" id="backBtn" onclick="goToMenu()">← Zurück zum Menü</button>

    <div class="container">
        <header>
            <h1>🌟 DEUTSCH-STAR 🌟</h1>
            <p class="subtitle">Lerne deutsche Artikel und Fälle – mit Spaß, Tieren und tollen Beispielen!</p>
        </header>

        <div id="startScreen" class="screen active">
            <div class="menu-card">
                <h2 class="mode-title">🎯 Wähle deinen Trainingsmodus</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="startGame('preposition')">
                        <span class="mode-icon">📍</span>
                        Präpositionen (mit, in, an, auf, ...)
                        <div class="mode-desc">Wähle den richtigen Artikel nach der Präposition</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('definite')">
                        <span class="mode-icon">🔷</span>
                        Bestimmte Artikel (der, die, das)
                        <div class="mode-desc">Finde den richtigen bestimmten Artikel im passenden Fall</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('indefinite')">
                        <span class="mode-icon">◇</span>
                        Unbestimmte Artikel (ein, eine, ein)
                        <div class="mode-desc">Übe unbestimmte Artikel in allen Fällen</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('negation')">
                        <span class="mode-icon">⊘</span>
                        Verneinung (kein, keine, nicht)
                        <div class="mode-desc">Lerne wann „kein" und wann „nicht" verwendet wird</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('possessive')">
                        <span class="mode-icon">👤</span>
                        Possessivpronomen (mein, dein, sein, ...)
                        <div class="mode-desc">Possessivartikel in allen Fällen meistern</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('relative')">
                        <span class="mode-icon">🔗</span>
                        Relativpronomen (der, die, das, ...)
                        <div class="mode-desc">Relativsätze mit den richtigen Pronomen bilden</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('comma')">
                        <span class="mode-icon">📝</span>
                        Beistriche <span class="mode-badge new-badge">NEU</span>
                        <div class="mode-desc">Setze Beistriche richtig bei Nebensätzen, Aufzählungen und Infinitivgruppen</div>
                    </button>
                </div>
            </div>

            <div class="menu-card">
                <h2 class="mode-title">🏆 Bestenliste</h2>
                <div id="menuLeaderboard"></div>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="mode-indicator" id="modeIndicator">Modus</div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-label">Punkte</div>
                        <div class="stat-value" id="points">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Serie</div>
                        <div class="stat-value" id="streak">0</div>
                    </div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0 Sätze gelöst</div>

            <div class="sentence-box">
                <div class="sentence" id="sentence"></div>
                <div class="hint-box" id="hintBox">
                    <span id="hintText"></span>
                </div>
            </div>

            <div class="options-grid" id="optionsGrid"></div>

            <div class="control-buttons">
                <button class="control-btn" onclick="skipSentence()">⏭️ Überspringen</button>
                <button class="control-btn primary" onclick="endGame()">🏁 Beenden</button>
            </div>
        </div>

        <div id="resultScreen" class="screen">
            <div class="result-card">
                <h2 class="result-title">🎉 Geschafft!</h2>
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-label">Punkte</div>
                        <div class="result-stat-value" id="finalPoints">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Zeit</div>
                        <div class="result-stat-value" id="finalTime">0:00</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Beste Serie</div>
                        <div class="result-stat-value" id="bestStreak">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-label">Genauigkeit</div>
                        <div class="result-stat-value" id="accuracy">0%</div>
                    </div>
                </div>

                <input type="text" class="player-name-input" id="playerName" placeholder="Dein Name..." maxlength="20">

                <div class="control-buttons">

            { text: "Er ging weg[,] ohne sich zu verabschieden – das war nicht nett.", slots: [{comma: true}] },
            { text: "Wir üben täglich[,] um das Stück spielen zu können.", slots: [{comma: true}] },
            // als/wie Vergleiche – KEIN Beistrich
            { text: "Sie rennt schneller[_] als ihr Bruder.", slots: [{comma: false}] },
            { text: "Das war leichter[_] als ich dachte.", slots: [{comma: false}] },
            { text: "Er ist größer[_] als alle anderen in der Klasse.", slots: [{comma: false}] },
            // denn – MIT Beistrich
            { text: "Wir blieben drinnen[,] denn draußen war es eisig kalt.", slots: [{comma: true}] },
            { text: "Ich mag Montage[,] denn dann sehe ich alle Freunde wieder.", slots: [{comma: true}] },
            // gleiches Subjekt – KEIN Beistrich
            { text: "Er aß[_] und trank seinen Kakao in Ruhe.", slots: [{comma: false}] },
            { text: "Sie stand auf[_] und räumte ihr Zimmer auf.", slots: [{comma: false}] },
            // neues Subjekt nach und – MIT Beistrich
            { text: "Er aß sein Brot[,] und sein Hund schaute hoffnungsvoll zu.", slots: [{comma: true}] },
            { text: "Das Kind spielte[,] und die Eltern tranken Tee daneben.", slots: [{comma: true}] },
            // sowohl...als auch – KEIN Beistrich
            { text: "Sowohl Hund[_] als auch Katze wollen das Leckerli haben.", slots: [{comma: false}] },
            { text: "Weder Lisa[_] noch Tom wusste die Antwort auf die Frage.", slots: [{comma: false}] },
            // komplexere Sätze
            { text: "Als wir ankamen[,] war der Spielplatz schon voll[_] und alle Schaukeln besetzt.", slots: [{comma: true}, {comma: false}] },
            { text: "Wenn der Unterricht zu Ende ist[,] freue ich mich auf die Pause.", slots: [{comma: true}] },
            { text: "Das Tier[,] das wir beobachten[,] ist ein Igel[,] der Beeren sucht.", slots: [{comma: true}, {comma: true}, {comma: true}] }
        ]
    };

    // ==================== OPTIONS ====================
    const optionsData = {
        preposition: {
            art: ['dem', 'der', 'den', 'das', 'die', 'einen', 'einem', 'einer', 'eine', 'ein', 'keinen', 'keinem', 'keiner', 'keine', 'kein', 'meinen', 'meiner', '_']
        },
        definite: {
            art: ['der', 'die', 'das', 'den', 'dem', 'des']
        },
        indefinite: {
            art: ['ein', 'eine', 'einen', 'einem', 'einer', 'eines', '_']
        },
        negation: {
            art: ['kein', 'keine', 'keinen', 'keinem', 'keiner', 'nicht']
        },
        possessive: {
            art: ['mein', 'dein', 'sein', 'ihr', 'unser', 'euer',
                  'meinen', 'deinen', 'seinen', 'ihren', 'unseren', 'euren',
                  'meinem', 'deinem', 'seinem', 'ihrem', 'unserem', 'eurem',
                  'meiner', 'deiner', 'seiner', 'ihrer', 'unserer', 'eurer',
                  'meine', 'deine', 'seine', 'ihre', 'unsere', 'eure',
                  'meines', 'deines', 'seines', 'ihres', 'unseres', 'eures']
        },
        relative: {
            art: ['der', 'die', 'das', 'den', 'dem', 'denen', 'dessen', 'deren']
        },
        comma: {
            comma: [true, false]
        }
    };

    // ==================== GAME STATE ====================
    let gameState = {
        mode: null,
        points: 0,
        streak: 0,
        bestStreak: 0,
        correctAnswers: 0,
        totalAttempts: 0,
        startTime: null,
        timerInterval: null,
        allSentences: [],
        remainingSentences: [],
        solvedSentences: [],
        currentSentence: null,
        basePointsPerSlot: 10
    };

    function init() {
        createBackground();
        updateMenuLeaderboard();
        showScreen('startScreen');
    }

    function createBackground() {
        const ripples = document.getElementById('ripples');
        for (let i = 0; i < 8; i++) {
            const r = document.createElement('div');
            r.className = 'ripple';
            r.style.width = r.style.height = (Math.random() * 300 + 200) + 'px';
            r.style.left = Math.random() * 100 + '%';
            r.style.top = Math.random() * 100 + '%';
            r.style.animationDelay = (Math.random() * 8) + 's';
            ripples.appendChild(r);
        }
        for (let i = 0; i < 6; i++) {
            const s = document.createElement('div');
            s.className = 'shimmer';
            s.style.top = (Math.random() * 100) + '%';
            s.style.animationDelay = (Math.random() * 7) + 's';
            ripples.appendChild(s);
        }
        for (let i = 0; i < 25; i++) {
            const st = document.createElement('div');
            st.className = 'star';
            st.style.left = Math.random() * 100 + '%';
            st.style.top = Math.random() * 100 + '%';
            st.style.animationDelay = (Math.random() * 4) + 's';
            ripples.appendChild(st);
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startGame(mode) {
        gameState.mode = mode;
        gameState.points = 0;
        gameState.streak = 0;
        gameState.bestStreak = 0;
        gameState.correctAnswers = 0;
        gameState.totalAttempts = 0;
        gameState.startTime = Date.now();
        gameState.allSentences = [...sentenceData[mode]];
        gameState.remainingSentences = [...gameState.allSentences];
        gameState.solvedSentences = [];

        const modeNames = {
            preposition: 'Präpositionen',
            definite: 'Bestimmte Artikel',
            indefinite: 'Unbestimmte Artikel',
            negation: 'Verneinung',
            possessive: 'Possessivpronomen',
            relative: 'Relativpronomen',
            comma: 'Beistriche'
        };

        const ind = document.getElementById('modeIndicator');
        ind.textContent = modeNames[mode];
        ind.className = 'mode-indicator ' + mode;

        updateStats();
        updateProgress();
        loadNextSentence();
        showScreen('gameScreen');
        document.getElementById('backBtn').style.display = 'block';
    }

    function loadNextSentence() {
        if (gameState.remainingSentences.length === 0) { endGame(); return; }
        const idx = Math.floor(Math.random() * gameState.remainingSentences.length);
        gameState.currentSentence = gameState.remainingSentences[idx];
        document.getElementById('hintBox').style.display = 'none';
        renderSentence();
        renderOptions();
        // Auto-select first slot
        const firstSlot = document.querySelector('.article-slot');
        if (firstSlot) selectSlot(firstSlot);
    }

    function renderSentence() {
        const s = gameState.currentSentence;
        const container = document.getElementById('sentence');
        container.innerHTML = '';
        let text = s.text;
        let slotIndex = 0;
        // Matches [slot] for gaps and N{art|word} for hoverable nouns
        const regex = /\[(.*?)\]|N\{([^|]+)\|([^}]+)\}/g;
        let lastIndex = 0;
        let match;
        while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
                const word = document.createElement('span');
                word.className = 'word';
                word.textContent = text.substring(lastIndex, match.index);
                container.appendChild(word);
            }
            if (match[0].charAt(0) === '[') {
                // Lücken-Slot
                const slot = document.createElement('span');
                slot.className = 'article-slot';
                slot.dataset.slotIndex = slotIndex;
                if (gameState.mode === 'comma') {
                    slot.textContent = '?';
                    slot.style.minWidth = '50px';
                } else {
                    slot.textContent = '___';
                }
                slot.onclick = () => selectSlot(slot);
                container.appendChild(slot);
                slotIndex++;
            } else {
                // Hover-Nomen: N{nominativArt|Wort}
                const wrap = document.createElement('span');
                wrap.className = 'noun-hover';
                wrap.textContent = match[3];
                const tip = document.createElement('span');
                tip.className = 'noun-tooltip';
                tip.textContent = match[2] + ' ' + match[3];
                wrap.appendChild(tip);
                container.appendChild(wrap);
            }
            lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) {
            const word = document.createElement('span');
            word.className = 'word';
            word.textContent = text.substring(lastIndex);
            container.appendChild(word);
        }
    }

    function renderOptions() {
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        if (gameState.mode === 'comma') {
            [{ label: '✓ Beistrich setzen', value: true }, { label: '✗ Kein Beistrich', value: false }].forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = o.label;
                btn.onclick = () => fillSlot(o.value);
                grid.appendChild(btn);
            });
        } else if (gameState.mode === 'preposition') {
            const definiteForms = ['der', 'die', 'das', 'dem', 'den', 'des'];
            const indefiniteForms = ['ein', 'eine', 'einen', 'einem', 'einer', 'eines'];
            const keinForms = ['kein', 'keine', 'keinen', 'keinem', 'keiner', 'keines'];
            let slotIdx = 0;
            if (selectedSlot) slotIdx = parseInt(selectedSlot.dataset.slotIndex);
            const correctArt = (gameState.currentSentence.slots[slotIdx]?.art || '').toLowerCase();
            let options;
            if (definiteForms.includes(correctArt)) {
                options = [...definiteForms];
            } else if (indefiniteForms.includes(correctArt)) {
                options = [...indefiniteForms];
            } else if (keinForms.includes(correctArt)) {
                options = [...keinForms];
            } else if (correctArt.startsWith('mein')) {
                options = ['mein', 'meine', 'meinen', 'meinem', 'meiner', 'meines'];
            } else if (correctArt.startsWith('dein')) {
                options = ['dein', 'deine', 'deinen', 'deinem', 'deiner', 'deines'];
            } else if (correctArt.startsWith('sein')) {
                options = ['sein', 'seine', 'seinen', 'seinem', 'seiner', 'seines'];
            } else if (correctArt.startsWith('ihr')) {
                options = ['ihr', 'ihre', 'ihren', 'ihrem', 'ihrer', 'ihres'];
            } else if (correctArt.startsWith('unser')) {
                options = ['unser', 'unsere', 'unseren', 'unserem', 'unserer', 'unseres'];
            } else if (correctArt.startsWith('euer') || correctArt.startsWith('eur')) {
                options = ['euer', 'eure', 'euren', 'eurem', 'eurer', 'eures'];
            } else {
                options = [...definiteForms, ...indefiniteForms];
            }
            options.push('_');
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt === '_' ? '(kein Artikel)' : opt;
                btn.onclick = () => fillSlot(opt);
                grid.appendChild(btn);
            });
        } else if (gameState.mode === 'possessive') {
            let correctBase = null;
            let targetSlotIdx = 0;
            if (selectedSlot) {
                targetSlotIdx = parseInt(selectedSlot.dataset.slotIndex);
            } else {
                const firstEmpty = document.querySelector('.article-slot:not(.correct):not(.wrong)');
                targetSlotIdx = firstEmpty ? parseInt(firstEmpty.dataset.slotIndex) : 0;
            }
            const targetArt = gameState.currentSentence.slots[targetSlotIdx]?.art || '';
            const lower = targetArt.toLowerCase();
            if (lower.startsWith('mein')) correctBase = 'mein';
            else if (lower.startsWith('dein')) correctBase = 'dein';
            else if (lower.startsWith('sein')) correctBase = 'sein';
            else if (lower.startsWith('ihr')) correctBase = 'ihr';
            else if (lower.startsWith('unser')) correctBase = 'unser';
            else if (lower.startsWith('euer') || lower.startsWith('eur')) correctBase = 'euer';

            const allForms = [];
            if (correctBase === 'mein') allForms.push('mein','meine','meinen','meinem','meiner','meines');
            else if (correctBase === 'dein') allForms.push('dein','deine','deinen','deinem','deiner','deines');
            else if (correctBase === 'sein') allForms.push('sein','seine','seinen','seinem','seiner','seines');
            else if (correctBase === 'ihr') allForms.push('ihr','ihre','ihren','ihrem','ihrer','ihres');
            else if (correctBase === 'unser') allForms.push('unser','unsere','unseren','unserem','unserer','unseres');
            else if (correctBase === 'euer') allForms.push('euer','eure','euren','eurem','eurer','eures');

            allForms.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => fillSlot(opt);
                grid.appendChild(btn);
            });
        } else {
            const opts = optionsData[gameState.mode];
            const allOpts = [];
            Object.keys(opts).forEach(k => opts[k].forEach(v => { if (!allOpts.includes(v)) allOpts.push(v); }));
            allOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt === '_' ? '(kein Artikel)' : opt;
                btn.onclick = () => fillSlot(opt);
                grid.appendChild(btn);
            });
        }
    }

    let selectedSlot = null;

    function selectSlot(slot) {
        if (slot.classList.contains('correct') || slot.classList.contains('wrong')) return;
        document.querySelectorAll('.article-slot').forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
        selectedSlot = slot;
        if (gameState.mode === 'possessive' || gameState.mode === 'preposition') {
            renderOptions();
        }
    }

    function fillSlot(value) {
        if (!selectedSlot) {
            const firstEmpty = document.querySelector('.article-slot:not(.correct):not(.wrong)');
            if (firstEmpty) selectSlot(firstEmpty); else return;
        }
        const slotIndex = parseInt(selectedSlot.dataset.slotIndex);
        const s = gameState.currentSentence;
        const slotData = s.slots[slotIndex];
        let correct = null;
        if (gameState.mode === 'comma') {
            correct = slotData.comma;
            selectedSlot.textContent = value ? ',' : '—';
        } else if (gameState.mode === 'preposition') {
            correct = slotData.art;
            selectedSlot.textContent = value === '_' ? '∅' : value;
        } else {
            correct = slotData.art;
            selectedSlot.textContent = value === '_' ? '∅' : value;
        }
        gameState.totalAttempts++;
        const isCorrect = gameState.mode === 'comma'
            ? value === correct
            : value.toLowerCase() === correct.toLowerCase();

        if (isCorrect) {
            selectedSlot.classList.add('correct');
            selectedSlot.classList.remove('selected');
            gameState.correctAnswers++;
            gameState.streak++;
            if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak;
            let points = gameState.basePointsPerSlot;
            if (gameState.streak >= 20) points *= 5;
            else if (gameState.streak >= 15) points *= 4;
            else if (gameState.streak >= 10) points *= 3;
            else if (gameState.streak >= 5) points *= 2;
            gameState.points += points;
            updateStats();
            sounds.correct();
            showPointsPopup(points, gameState.streak >= 5);
            const allCorrect = Array.from(document.querySelectorAll('.article-slot')).every(sl => sl.classList.contains('correct'));
            if (allCorrect) {
                setTimeout(() => {
                    gameState.solvedSentences.push(gameState.remainingSentences.splice(gameState.remainingSentences.indexOf(gameState.currentSentence), 1)[0]);
                    updateProgress();
                    if (gameState.solvedSentences.length % 10 === 0 && gameState.solvedSentences.length > 0) showMilestone(gameState.solvedSentences.length);
                    loadNextSentence();
                }, 800);
            }
            // Auto-select next empty slot
            const nextEmpty = document.querySelector('.article-slot:not(.correct):not(.wrong)');
            if (nextEmpty) {
                selectSlot(nextEmpty);
            } else {
                selectedSlot = null;
            }
        } else {
            selectedSlot.classList.add('wrong');
            gameState.streak = 0;
            updateStats();
            sounds.wrong();
            document.getElementById('hintBox').style.display = 'block';
            if (gameState.mode === 'comma') {
                document.getElementById('hintText').textContent = correct ? 'Richtig wäre: Beistrich setzen (,)' : 'Richtig wäre: Kein Beistrich';
            } else {
                document.getElementById('hintText').textContent = `Richtig wäre: „${correct === '_' ? '(kein Artikel)' : correct.toLowerCase()}"`;
            }
            setTimeout(() => {
                selectedSlot.classList.remove('wrong', 'selected');
                selectedSlot.textContent = gameState.mode === 'comma' ? '?' : '___';
                selectedSlot = null;
            }, 500);
        }
    }

    function skipSentence() {
        gameState.streak = 0;
        updateStats();
        const s = gameState.remainingSentences.shift();
        gameState.remainingSentences.push(s);
        loadNextSentence();
    }

    function updateStats() {
        document.getElementById('points').textContent = gameState.points;
        const el = document.getElementById('streak');
        el.innerHTML = gameState.streak > 2 ? `<span class="streak-fire">🔥</span>${gameState.streak}` : gameState.streak;
    }

    function updateProgress() {
        const total = gameState.solvedSentences.length + gameState.remainingSentences.length;
        const solved = gameState.solvedSentences.length;
        const pct = total > 0 ? (solved / total) * 100 : 0;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = `${solved} / ${total} Sätze gelöst`;
    }

    function showPointsPopup(pts, isStreak) {
        const popup = document.createElement('div');
        popup.className = 'points-popup' + (isStreak ? ' streak-bonus' : '');
        popup.textContent = isStreak ? `+${pts} 🔥 Combo!` : `+${pts}`;
        popup.style.left = (Math.random() * 60 + 20) + '%';
        popup.style.top = '40%';
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 1000);
    }

    function showMilestone(n) {
        const overlay = document.createElement('div');
        overlay.className = 'milestone-overlay';
        overlay.innerHTML = `<div class="milestone-content"><div class="milestone-number">${n}</div><div class="milestone-text">🎉 Wow, ${n} Sätze!</div></div>`;
        document.body.appendChild(overlay);
        sounds.milestone();
        createConfetti();
        setTimeout(() => overlay.remove(), 2500);
    }

    function createConfetti() {
        const colors = ['#ff6b35','#ffb347','#ffd700','#ff69b4','#ff1493','#ffcc00','#ff8c00'];
        for (let i = 0; i < 100; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-10px';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            const sz = (Math.random() * 10 + 5) + 'px';
            c.style.width = c.style.height = sz;
            document.body.appendChild(c);
            const anim = c.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                { transform: `translateY(100vh) rotate(${Math.random()*720}deg)`, opacity: 0 }
            ], { duration: Math.random() * 2000 + 2000, easing: 'ease-out' });
            anim.onfinish = () => c.remove();
        }
    }

    function endGame() {
        clearInterval(gameState.timerInterval);
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        document.getElementById('finalPoints').textContent = gameState.points;
        document.getElementById('finalTime').textContent = `${Math.floor(elapsed/60)}:${(elapsed%60).toString().padStart(2,'0')}`;
        document.getElementById('bestStreak').textContent = gameState.bestStreak;
        document.getElementById('accuracy').textContent = gameState.totalAttempts > 0
            ? Math.round((gameState.correctAnswers / gameState.totalAttempts) * 100) + '%' : '0%';
        showScreen('resultScreen');
        document.getElementById('backBtn').style.display = 'none';
        updateResultLeaderboard();
        sounds.milestone();
        createConfetti();
    }

    function loadLeaderboard() {
        try { return JSON.parse(localStorage.getItem('deutschStarLeaderboard') || '[]'); } catch(e) { return []; }
    }
    function saveLeaderboard(b) {
        try { localStorage.setItem('deutschStarLeaderboard', JSON.stringify(b)); } catch(e) {}
    }

    function saveScore() {
        const name = document.getElementById('playerName').value.trim() || 'Anonym';
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        const modeNames = { preposition:'Präpositionen', definite:'Bestimmte Artikel', indefinite:'Unbestimmte Artikel', negation:'Verneinung', possessive:'Possessivpronomen', relative:'Relativpronomen', comma:'Beistriche' };
        const entry = { name, points: gameState.points, time: elapsed, mode: modeNames[gameState.mode], date: new Date().toLocaleDateString('de-DE') };
        const board = loadLeaderboard();
        board.push(entry);
        board.sort((a,b) => b.points - a.points);
        saveLeaderboard(board.slice(0, 10));
        updateResultLeaderboard();
        updateMenuLeaderboard();
        document.getElementById('playerName').disabled = true;
        event.target.disabled = true;
        event.target.textContent = '✓ Gespeichert!';
    }

    function formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

    function renderBoard(container, entries, limit) {
        if (entries.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted);text-align:center;">Noch keine Einträge. Sei die Erste!</p>';
            return;
        }
        container.innerHTML = entries.slice(0, limit).map((e,i) =>
            `<div class="leaderboard-entry">
                <span class="leaderboard-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'}${'</span>'}
                <span class="leaderboard-name">${e.name}</span>
                <span class="leaderboard-score">${e.points} Pkt</span>
                <span class="leaderboard-time">${formatTime(e.time)}</span>
            </div>`
        ).join('');
    }

    function updateMenuLeaderboard() { renderBoard(document.getElementById('menuLeaderboard'), loadLeaderboard(), 5); }
    function updateResultLeaderboard() {
        const c = document.getElementById('resultLeaderboard');
        c.innerHTML = '<h3 class="leaderboard-title">🏅 Bestenliste</h3>';
        const inner = document.createElement('div');
        renderBoard(inner, loadLeaderboard(), 5);
        c.appendChild(inner);
    }

    function playAgain() {
        document.getElementById('playerName').disabled = false;
        document.getElementById('playerName').value = '';
        const btn = document.querySelector('#resultScreen .control-btn.primary');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
        startGame(gameState.mode);
    }

    function goToMenu() {
        clearInterval(gameState.timerInterval);
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('playerName').disabled = false;
        document.getElementById('playerName').value = '';
        const btn = document.querySelector('#resultScreen .control-btn.primary');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
        showScreen('startScreen');
        updateMenuLeaderboard();
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
