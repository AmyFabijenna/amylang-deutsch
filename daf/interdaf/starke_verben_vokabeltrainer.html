<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starke Verben Vokabeltrainer 🐝</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFD700 0%, #FFC107 30%, #FFB300 60%, #FFA000 100%);
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            color: #5D4E00;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            color: #7D6600;
            font-size: 1.1em;
            font-weight: 600;
        }

        .controls {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(93, 78, 0, 0.3);
            border-radius: 25px;
            color: #5D4E00;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            font-family: 'Fredoka', sans-serif;
        }

        .mode-btn:hover, .mode-btn.active {
            background: rgba(93, 78, 0, 0.85);
            color: #FFD700;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .language-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(93, 78, 0, 0.3);
            border-radius: 20px;
            color: #5D4E00;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #FF8F00;
            color: white;
            border-color: #FF8F00;
            transform: scale(1.05);
        }

        .direction-selector {
            text-align: center;
            margin-bottom: 20px;
        }

        .direction-label {
            display: block;
            color: #5D4E00;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.05em;
        }

        .direction-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(93, 78, 0, 0.4);
            border-radius: 25px;
            color: #5D4E00;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            font-size: 1em;
        }

        .direction-btn:hover, .direction-btn.active {
            background: #FF6F00;
            color: white;
            border-color: #FF6F00;
            transform: scale(1.05);
        }

        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .search-input {
            padding: 12px 20px;
            width: 100%;
            max-width: 500px;
            border: 2px solid rgba(93, 78, 0, 0.3);
            border-radius: 25px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.6);
            color: #5D4E00;
            font-family: 'Quicksand', sans-serif;
        }

        .search-input:focus {
            outline: none;
            border-color: #FF8F00;
            box-shadow: 0 0 15px rgba(255, 143, 0, 0.3);
        }

        .search-input::placeholder {
            color: #9D8E00;
        }

        /* Flashcard Mode */
        .flashcard-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .flashcard {
            background: white;
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            backface-visibility: hidden;
            position: absolute;
            width: 100%;
            text-align: center;
        }

        .flashcard-back {
            transform: rotateY(180deg);
        }

        .flashcard-word {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5em;
            font-weight: bold;
            color: #5D4E00;
            margin-bottom: 20px;
        }

        .flashcard-translation {
            font-size: 1.6em;
            color: #FF8F00;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .flashcard-forms {
            margin-top: 20px;
            text-align: left;
            display: inline-block;
        }

        .flashcard-form {
            margin: 8px 0;
            font-size: 1.1em;
            color: #5D4E00;
        }

        .form-label-small {
            font-weight: 600;
            color: #9D8E00;
            display: inline-block;
            min-width: 140px;
        }

        .flashcard-controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-button {
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 1em;
            font-family: 'Fredoka', sans-serif;
        }

        .prev-btn {
            background: #FFA726;
            color: white;
        }

        .prev-btn:hover {
            background: #FF9800;
            transform: translateX(-3px);
        }

        .next-btn {
            background: #66BB6A;
            color: white;
        }

        .next-btn:hover {
            background: #4CAF50;
            transform: translateX(3px);
        }

        .shuffle-btn {
            background: #42A5F5;
            color: white;
        }

        .shuffle-btn:hover {
            background: #2196F3;
            transform: scale(1.05);
        }

        /* List Mode */
        .vocab-list {
            display: grid;
            gap: 15px;
        }

        .vocab-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .vocab-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .vocab-german {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.5em;
            color: #5D4E00;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .vocab-translation {
            font-size: 1.2em;
            color: #FF8F00;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .vocab-forms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .vocab-form {
            font-size: 0.95em;
            color: #5D4E00;
            background: rgba(255, 215, 0, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .vocab-form-label {
            font-weight: 600;
            color: #9D8E00;
            display: inline-block;
            min-width: 110px;
        }

        /* Quiz Mode */
        .quiz-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .quiz-score {
            text-align: center;
            font-size: 1.3em;
            color: #5D4E00;
            font-weight: bold;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-radius: 10px;
        }

        .quiz-question {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .quiz-word {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2em;
            font-weight: bold;
            color: #5D4E00;
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-options {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .quiz-option {
            padding: 20px;
            background: #FFF9E6;
            border: 3px solid #FFD700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.2em;
            text-align: center;
            font-weight: 500;
            color: #5D4E00;
        }

        .quiz-option:hover {
            background: #FFE082;
            border-color: #FFA000;
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: #4CAF50 !important;
            color: white !important;
            border-color: #4CAF50 !important;
            transform: scale(1.02);
        }

        .quiz-option.incorrect {
            background: #f44336 !important;
            color: white !important;
            border-color: #f44336 !important;
            transform: scale(1.02);
        }

        .quiz-option.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .progress-indicator {
            text-align: center;
            color: #5D4E00;
            font-size: 1.1em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .flashcard-word {
                font-size: 1.8em;
            }

            .flashcard-translation {
                font-size: 1.3em;
            }

            .quiz-word {
                font-size: 1.6em;
            }

            .mode-btn, .lang-btn {
                font-size: 0.9em;
                padding: 8px 16px;
            }

            .vocab-forms {
                grid-template-columns: 1fr;
            }
        }

        /* Honeycomb decoration */
        .honeycomb {
            position: fixed;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255, 215, 0, 0.15);
            clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        .honeycomb:nth-child(2) {
            top: auto;
            bottom: -50px;
            left: -50px;
            right: auto;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
    </style>
</head>

            renderContent();

            const text = document.getElementById('directionText');
            if (currentDirection === 'de-to-foreign') {

                text.textContent = `${langFlags[currentLang]} Fremdsprache → 🇩🇪 Deutsch`;

            if (!search) {
                filteredVocab = [...vocabData];
            } else {
                filteredVocab = vocabData.filter(v => 
                    v.de.toLowerCase().includes(search) ||
                    v.en.toLowerCase().includes(search) ||
                    v.hu.toLowerCase().includes(search) ||
                    v.it.toLowerCase().includes(search)
                );

            currentIndex = 0;
            renderContent();
        }

            } else if (currentMode === 'quiz') {
                renderQuiz(container);
            }

                container.innerHTML = '<p style="text-align:center; color:#5D4E00;">Keine Verben gefunden.</p>';
                return;
            }

            const vocab = filteredVocab[currentIndex];
            const translation = vocab[currentLang];

            container.innerHTML = `
                <div class="flashcard-container">
                    <div class="flashcard" id="flashcard" onclick="flipCard()">
                        <div class="flashcard-front">
                            <div class="flashcard-word">${currentDirection === 'de-to-foreign' ? vocab.de : translation}</div>

                        </div>
                        <div class="flashcard-back">

                            ${currentDirection === 'foreign-to-de' ? `

            currentIndex = (currentIndex + 1) % filteredVocab.length;
            renderContent();

            currentIndex = (currentIndex - 1 + filteredVocab.length) % filteredVocab.length;

            filteredVocab.sort(() => Math.random() - 0.5);

            const html = filteredVocab.map(vocab => `

            container.innerHTML = `<div class="vocab-list">${html}</div>`;
        }

        function renderQuiz(container) {
            if (quizVocab.length === 0) {
                startQuiz();

            if (currentQuizIndex >= quizVocab.length) {
                showQuizResults(container);
                return;

            const vocab = quizVocab[currentQuizIndex];
            const options = generateQuizOptions(vocab);

            const question = currentDirection === 'de-to-foreign' ? vocab.de : vocab[currentLang];
            
            container.innerHTML = `
                <div class="quiz-container">
                    <div class="progress-indicator">Frage ${currentQuizIndex + 1} / ${quizVocab.length}</div>

            quizVocab = [...filteredVocab].sort(() => Math.random() - 0.5).slice(0, Math.min(10, filteredVocab.length));

            quizScore = 0;
            quizTotal = 0;
        }

        function generateQuizOptions(correctVocab) {
            const correctAnswer = currentDirection === 'de-to-foreign' ? correctVocab[currentLang] : correctVocab.de;
            const wrongOptions = vocabData
                .filter(v => v !== correctVocab)
                .map(v => currentDirection === 'de-to-foreign' ? v[currentLang] : v.de)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3);
            
            const options = [correctAnswer, ...wrongOptions].sort(() => Math.random() - 0.5);
            return options;
        }

        function checkQuizAnswer(selected, correct, optionIndex) {
            quizTotal++;
            const options = document.querySelectorAll('.quiz-option');
            
            options.forEach(opt => opt.classList.add('disabled'));

            if (selected === correct) {
                quizScore++;
                options[optionIndex].classList.add('correct');
            } else {
                options[optionIndex].classList.add('incorrect');
                options.forEach((opt, i) => {
                    if (opt.textContent.trim() === correct) {
                        opt.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentQuizIndex++;
                renderContent();
            }, 1500);
        }

                <div class="quiz-container">
                    <div class="quiz-question" style="text-align:center; padding:50px 30px;">
                        <h2 style="font-family: 'Fredoka', sans-serif; color: #5D4E00; font-size: 2.5em; margin-bottom:20px;">
                            Quiz beendet! 🎉
                        </h2>
                        <div class="quiz-score" style="font-size: 2em; margin:30px 0;">
                            ${quizScore} / ${quizTotal} Punkte (${percentage}%)
                        </div>
                        <div class="flashcard-controls">
                            <button class="control-button next-btn" onclick="restartQuiz()">Nochmal spielen</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function restartQuiz() {
            startQuiz();
            renderContent();
        }

        // Initialize
        renderContent();
    </script>
</body>
</html>
