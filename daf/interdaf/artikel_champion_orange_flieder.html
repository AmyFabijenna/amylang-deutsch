<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel & Fälle Champion 🌼</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e0a2e;
            --primary-light: #2d1040;
            --accent: #c97a2e;
            --accent-glow: #f5a84a;
            --lavender: #9b6bbf;
            --lavender-glow: #c49bdf;
            --gold: #f0c040;
            --gold-dark: #c8930a;
            --success: #6dbf5a;
            --error: #e05c5c;
            --bg-dark: #120720;
            --bg-card: #2a1040;
            --text: #fdf4e3;
            --text-muted: #d4b8f0;
            --orange-dim: #3d1a00;
            --flieder: #7a3fa8;
            --flieder-glow: #b070e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(ellipse at 20% 20%, #2d0a40 0%, #120720 40%, #1a0a10 70%, #0e0520 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        /* ── BACKGROUND PARTICLES ── */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.18;
            animation: orbFloat 14s ease-in-out infinite;
        }
        .orb1 { width: 400px; height: 400px; background: #c97a2e; top: -10%; left: -5%; animation-delay: 0s; }
        .orb2 { width: 300px; height: 300px; background: #9b6bbf; top: 60%; right: -5%; animation-delay: -5s; }
        .orb3 { width: 250px; height: 250px; background: #f0c040; bottom: 10%; left: 30%; animation-delay: -9s; }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px,-20px) scale(1.08); }
            66% { transform: translate(-20px,30px) scale(0.94); }
        }
        .dust {
            position: absolute;
            border-radius: 50%;
            animation: dustFloat linear infinite;
        }
        @keyframes dustFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-20px) rotate(360deg); opacity: 0; }
        }
        .shimmer-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,122,46,0.4), rgba(240,192,64,0.6), rgba(155,107,191,0.4), transparent);
            animation: shimmerPass 9s ease-in-out infinite;
            opacity: 0;
        }
        @keyframes shimmerPass {
            0% { width: 0; left: -10%; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { width: 120%; left: 100%; opacity: 0; }
        }

        /* ── LAYOUT ── */
        .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 32px; padding-top: 14px; }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.6rem;
            background: linear-gradient(135deg, #f5a84a 0%, #f0c040 35%, #c49bdf 65%, #f5a84a 100%);
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShimmer 5s linear infinite;
            margin-bottom: 10px;
            text-shadow: none;
            letter-spacing: 0.5px;
        }
        @keyframes titleShimmer { to { background-position: 250% center; } }
        .subtitle { color: var(--text-muted); font-size: 1rem; }

        /* ── SCREENS ── */
        .screen { display: none; animation: screenIn 0.45s cubic-bezier(0.22,1,0.36,1); }
        .screen.active { display: block; }
        @keyframes screenIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ── MENU CARD ── */
        .menu-card {
            background: linear-gradient(135deg, rgba(42,16,64,0.96) 0%, rgba(30,10,46,0.98) 100%);
            border-radius: 22px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(155,107,191,0.3);
            box-shadow: 0 8px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06), 0 0 80px rgba(155,107,191,0.06);
        }
        .mode-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--lavender-glow);
        }
        .mode-buttons { display: flex; flex-direction: column; gap: 11px; }
        .mode-btn {
            background: linear-gradient(135deg, rgba(30,10,46,0.9) 0%, rgba(42,16,64,0.9) 100%);
            border: 1px solid rgba(201,122,46,0.25);
            border-radius: 16px;
            padding: 17px 24px 17px 20px;
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.22,1,0.36,1);
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .mode-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--accent), var(--gold));
            border-radius: 4px 0 0 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .mode-btn:hover {
            transform: translateX(7px);
            border-color: var(--accent-glow);
            box-shadow: 0 4px 24px rgba(201,122,46,0.35), inset 0 0 30px rgba(201,122,46,0.06);
            background: linear-gradient(135deg, rgba(61,26,0,0.8) 0%, rgba(50,16,72,0.9) 100%);
        }
        .mode-btn:hover::before { opacity: 1; }
        .mode-btn .mode-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
        .mode-btn .mode-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
        .mode-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--flieder), var(--lavender-glow));
            color: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
            margin-left: 8px;
            vertical-align: middle;
        }
        .mode-badge.new-badge { background: linear-gradient(135deg, #3a7a1a, #6dbf5a); }

        /* ── GAME HEADER ── */
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
        .stats-bar { display: flex; gap: 14px; flex-wrap: wrap; }
        .stat-item {
            background: rgba(42,16,64,0.85);
            padding: 10px 18px;
            border-radius: 14px;
            border: 1px solid rgba(201,122,46,0.2);
            text-align: center;
            min-width: 90px;
        }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.45rem; color: var(--accent-glow); }
        .streak-fire { display: inline-block; animation: fireFlicker 0.45s ease infinite alternate; }
        @keyframes fireFlicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.25) rotate(3deg); } }

        /* ── PROGRESS ── */
        .progress-bar {
            background: rgba(42,16,64,0.7);
            border-radius: 12px; height: 16px; overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(155,107,191,0.2);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--flieder), var(--accent), var(--gold));
            background-size: 200% 100%;
            transition: width 0.55s cubic-bezier(0.22,1,0.36,1);
            animation: progressGlow 3s linear infinite;
        }
        @keyframes progressGlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .progress-text { text-align: center; margin-top: 6px; color: var(--text-muted); font-size: 0.87rem; }

        /* ── MODE INDICATOR ── */
        .mode-indicator {
            padding: 8px 20px; border-radius: 22px;
            font-weight: 800; font-size: 0.87rem;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            color: #1e0a2e;
        }
        .mode-indicator.preposition  { background: linear-gradient(135deg, #8a3d00, var(--accent)); color: #fdf4e3; }
        .mode-indicator.definite     { background: linear-gradient(135deg, var(--flieder), var(--lavender-glow)); color: #fff; }
        .mode-indicator.indefinite   { background: linear-gradient(135deg, #5a2080, #c49bdf); color: #fff; }
        .mode-indicator.negation     { background: linear-gradient(135deg, #7a1a1a, var(--error)); color: #fff; }
        .mode-indicator.possessive   { background: linear-gradient(135deg, var(--accent), var(--gold)); color: #1e0a2e; }
        .mode-indicator.relative     { background: linear-gradient(135deg, #4a2080, #9b6bbf); color: #fff; }
        .mode-indicator.comma        { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #1e0a2e; }

        /* ── SENTENCE BOX ── */
        .sentence-box {
            background: linear-gradient(135deg, rgba(42,16,64,0.97), rgba(30,10,46,0.99));
            border-radius: 22px;
            padding: 38px 30px 32px;
            margin-bottom: 26px;
            border: 1px solid rgba(201,122,46,0.22);
            box-shadow: 0 8px 48px rgba(0,0,0,0.45), 0 0 80px rgba(201,122,46,0.05);
            text-align: center;
        }
        .sentence { font-family: 'Fredoka', sans-serif; font-size: 1.75rem; line-height: 2.8; margin-bottom: 8px; }
        .word { display: inline-block; margin: 0 3px; }
        .article-slot {
            display: inline-block;
            min-width: 88px;
            padding: 6px 14px;
            background: rgba(30,10,46,0.9);
            border: 2px solid rgba(201,122,46,0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 700;
            color: rgba(212,184,240,0.6);
            font-family: 'Nunito', sans-serif;
            font-size: 0.92rem;
        }
        .article-slot:hover { border-color: var(--accent-glow); transform: scale(1.06); }
        .article-slot.selected {
            background: rgba(201,122,46,0.15);
            border-color: var(--accent-glow);
            color: var(--accent-glow);
            box-shadow: 0 0 14px rgba(201,122,46,0.3);
        }
        .article-slot.correct {
            background: linear-gradient(135deg, rgba(109,191,90,0.25), rgba(109,191,90,0.1));
            border-color: var(--success); color: var(--success);
            animation: correctPulse 0.55s ease;
        }
        .article-slot.wrong {
            background: linear-gradient(135deg, rgba(224,92,92,0.25), rgba(224,92,92,0.1));
            border-color: var(--error); color: var(--error);
            animation: wrongShake 0.45s ease;
        }
        @keyframes correctPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
        @keyframes wrongShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-9px); } 75% { transform: translateX(9px); } }

        .hint-box {
            display: none;
            background: rgba(201,122,46,0.1);
            border: 1px solid rgba(201,122,46,0.35);
            border-radius: 12px;
            padding: 13px 20px;
            margin-top: 18px;
            color: var(--text);
            font-size: 0.95rem;
        }

        /* ── OPTIONS ── */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 11px;
            margin-bottom: 24px;
        }
        .option-btn {
            background: linear-gradient(135deg, rgba(30,10,46,0.9), rgba(42,16,64,0.9));
            border: 1.5px solid rgba(155,107,191,0.25);
            border-radius: 14px;
            padding: 13px 18px;
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.22,1,0.36,1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            border-color: var(--lavender-glow);
            box-shadow: 0 6px 22px rgba(155,107,191,0.35);
            background: linear-gradient(135deg, rgba(74,32,128,0.7), rgba(50,16,72,0.9));
            color: var(--lavender-glow);
        }
        .option-btn:disabled { opacity: 0.38; cursor: not-allowed; }

        /* ── CONTROL BUTTONS ── */
        .control-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .control-btn {
            background: linear-gradient(135deg, rgba(30,10,46,0.9), rgba(42,16,64,0.9));
            border: 1.5px solid rgba(201,122,46,0.28);
            border-radius: 14px;
            padding: 11px 24px;
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.22s ease;
        }
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 18px rgba(201,122,46,0.3);
            border-color: var(--accent-glow);
        }
        .control-btn.primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 100%);
            border-color: var(--gold);
            color: #1e0a2e;
            font-weight: 800;
        }
        .control-btn.primary:hover {
            box-shadow: 0 6px 28px rgba(240,192,64,0.45);
            transform: translateY(-3px);
        }

        /* ── BACK BTN ── */
        .back-btn {
            position: fixed; top: 18px; left: 18px; z-index: 100; display: none;
            background: rgba(42,16,64,0.95);
            border: 1px solid rgba(155,107,191,0.35);
            border-radius: 12px; padding: 10px 18px;
            color: var(--text);
            font-family: 'Nunito', sans-serif; font-size: 0.92rem; font-weight: 700;
            cursor: pointer; transition: all 0.22s;
        }
        .back-btn:hover {
            background: rgba(74,32,128,0.7);
            box-shadow: 0 4px 16px rgba(155,107,191,0.3);
        }

        /* ── RESULT CARD ── */
        .result-card {
            background: linear-gradient(135deg, rgba(42,16,64,0.96), rgba(30,10,46,0.99));
            border-radius: 22px; padding: 36px; margin-bottom: 20px;
            border: 1px solid rgba(201,122,46,0.25);
            box-shadow: 0 8px 48px rgba(0,0,0,0.5);
            text-align: center;
        }
        .result-title {
            font-family: 'Fredoka', sans-serif; font-size: 2rem; margin-bottom: 26px;
            background: linear-gradient(135deg, var(--accent-glow), var(--gold), var(--lavender-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 16px; margin-bottom: 26px; }
        .result-stat {
            background: rgba(30,10,46,0.7);
            padding: 18px; border-radius: 16px;
            border: 1px solid rgba(240,192,64,0.18);
        }
        .result-stat-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .result-stat-value { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--gold); }
        .player-name-input {
            width: 100%; max-width: 340px;
            background: rgba(30,10,46,0.9);
            border: 2px solid rgba(201,122,46,0.3);
            border-radius: 14px; padding: 13px 18px;
            color: var(--text);
            font-family: 'Nunito', sans-serif; font-size: 1.02rem;
            margin: 18px auto; display: block; text-align: center;
        }
        .player-name-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 18px rgba(240,192,64,0.25); }

        /* ── LEADERBOARD ── */
        .leaderboard-container {
            background: rgba(30,10,46,0.65);
            border-radius: 16px; padding: 24px; margin-top: 24px;
            border: 1px solid rgba(155,107,191,0.2);
        }
        .leaderboard-title {
            font-family: 'Fredoka', sans-serif; font-size: 1.35rem;
            color: var(--gold); margin-bottom: 16px; text-align: center;
        }
        .leaderboard-entry {
            display: grid; grid-template-columns: 48px 1fr auto auto; gap: 12px;
            padding: 11px 14px;
            background: rgba(42,16,64,0.5);
            border-radius: 11px; margin-bottom: 8px;
            align-items: center;
            border: 1px solid rgba(201,122,46,0.12);
        }
        .leaderboard-rank { font-size: 1.15rem; font-weight: 800; text-align: center; }
        .leaderboard-name { font-weight: 700; color: var(--text); }
        .leaderboard-score { color: var(--gold); font-weight: 800; }
        .leaderboard-time { color: var(--text-muted); font-size: 0.87rem; }

        /* ── POPUPS & OVERLAYS ── */
        .points-popup {
            position: fixed;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.9rem; font-weight: 700;
            color: var(--success);
            pointer-events: none; z-index: 1000;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .points-popup.streak-bonus { color: var(--gold); font-size: 2.3rem; }
        @keyframes floatUp {
            0%   { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-90px) scale(1.2); opacity: 0; }
        }
        .milestone-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18,7,32,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; animation: screenIn 0.3s ease;
        }
        .milestone-content { text-align: center; animation: milestoneIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes milestoneIn { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .milestone-number {
            font-family: 'Fredoka', sans-serif; font-size: 7rem;
            background: linear-gradient(135deg, var(--accent-glow), var(--gold), var(--lavender-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .milestone-text { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--text); }
        .confetti { position: fixed; pointer-events: none; z-index: 3000; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .sentence { font-size: 1.4rem; line-height: 2.3; }
            .article-slot { min-width: 68px; padding: 5px 10px; font-size: 0.85rem; }
            .result-stats { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <button class="back-btn" id="backBtn" onclick="goToMenu()">← Zurück zum Menü</button>

    <div class="container">
        <header>
            <h1>🌼 Freundschaft & Sommer Champion</h1>
            <p class="subtitle">Trainiere deutsche Artikel, Fälle und Satzzeichen – mit Sommer und Freundschaft!</p>
        </header>

        <div id="startScreen" class="screen active">
            <div class="menu-card">
                <h2 class="mode-title">🎯 Wähle deinen Trainingsmodus</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="startGame('preposition')">
                        <span class="mode-icon">📍</span>
                        Präpositionen (mit, in, an, auf, ...)
                        <div class="mode-desc">Wähle den richtigen Artikel nach der Präposition</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('definite')">
                        <span class="mode-icon">🔷</span>
                        Bestimmte Artikel (der, die, das)
                        <div class="mode-desc">Finde den richtigen bestimmten Artikel im passenden Fall</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('indefinite')">
                        <span class="mode-icon">◇</span>
                        Unbestimmte Artikel (ein, eine, ein)
                        <div class="mode-desc">Übe unbestimmte Artikel in allen Fällen</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('negation')">
                        <span class="mode-icon">⊘</span>
                        Verneinung (kein, keine, nicht)
                        <div class="mode-desc">Lerne wann „kein" und wann „nicht" verwendet wird</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('possessive')">
                        <span class="mode-icon">👤</span>
                        Possessivpronomen (mein, dein, sein, ...)
                        <div class="mode-desc">Possessivartikel in allen Fällen meistern</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('relative')">
                        <span class="mode-icon">🔗</span>
                        Relativpronomen (der, die, das, ...)
                        <div class="mode-desc">Relativsätze mit den richtigen Pronomen bilden</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('comma')">
                        <span class="mode-icon">📝</span>
                        Beistriche <span class="mode-badge new-badge">NEU</span>
                        <div class="mode-desc">Setze Beistriche richtig bei Nebensätzen, Aufzählungen und Infinitivgruppen</div>
                    </button>
                </div>
            </div>
            <div class="menu-card">
                <h2 class="mode-title">🏆 Bestenliste</h2>
                <div id="menuLeaderboard"></div>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="mode-indicator" id="modeIndicator">Modus</div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-label">Punkte</div>
                        <div class="stat-value" id="points">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Serie</div>
                        <div class="stat-value" id="streak">0</div>
                    </div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>

            { text: "Ich bin glücklich[,] weil meine beste Freundin neben mir sitzt.", slots: [{comma: true}] },
            { text: "Sie schreibt[,] damit ihre Freunde wissen, dass sie sicher angekommen ist.", slots: [{comma: true}] },

            { text: "Hey Leute[,] wir treffen uns morgen um zehn am Badesee!", slots: [{comma: true}] },
            { text: "Komm her[,] Clara[,] das Wasser ist herrlich warm heute!", slots: [{comma: true}, {comma: true}] },
            { text: "Wir wollten zelten[,] aber das Gewitter hat unsere Pläne geändert.", slots: [{comma: true}] },
            { text: "Er kommt nicht heute[,] sondern erst morgen zum Ferienlager.", slots: [{comma: true}] },
            { text: "Obwohl wir müde waren[,] blieben wir bis zum Morgengrauen am Lagerfeuer.", slots: [{comma: true}] },
            { text: "Bevor wir schwimmen gehen[,] schmieren wir alle Sonnencreme auf[,] denn die Sonne brennt.", slots: [{comma: true}, {comma: true}] },
            { text: "Als wir ankamen[,] war der Strand schon voll[_] und alle Liegestühle besetzt.", slots: [{comma: true}, {comma: false}] },
            { text: "Der Sommer[,] den wir zusammen verbracht haben[,] war laut[,] bunt[_] und wunderschön.", slots: [{comma: true}, {comma: true}, {comma: true}, {comma: false}] },
            { text: "Wenn das Lagerfeuer brennt[,] rücken alle zusammen[,] und die Geschichten werden besser.", slots: [{comma: true}, {comma: true}] },
            { text: "Ich glaube[,] dass Freundschaft[,] die in den Ferien entsteht[,] besonders stark ist.", slots: [{comma: true}, {comma: true}, {comma: true}] }

    };

    const optionsData = {
        preposition: { art: ['dem','der','den','das','die','einen','einem','einer','eine','ein','keinen','keinem','keiner','keine','kein','meinen','meiner','_'] },
        definite: { art: ['der','die','das','den','dem','des'] },
        indefinite: { art: ['ein','eine','einen','einem','einer','eines','_'] },
        negation: { art: ['kein','keine','keinen','keinem','keiner','nicht'] },
        possessive: { art: ['mein','dein','sein','ihr','unser','euer','meinen','deinen','seinen','ihren','unseren','euren','meinem','deinem','seinem','ihrem','unserem','eurem','meiner','deiner','seiner','ihrer','unserer','eurer','meine','deine','seine','ihre','unsere','eure','meines','deines','seines','ihres','unseres','eures'] },
        relative: { art: ['der','die','das','den','dem','denen','dessen','deren'] },
        comma: { comma: [true, false] }
    };

    let gameState = { mode:null, points:0, streak:0, bestStreak:0, correctAnswers:0, totalAttempts:0, startTime:null, timerInterval:null, allSentences:[], remainingSentences:[], solvedSentences:[], currentSentence:null, basePointsPerSlot:10 };

    function init() { createParticles(); updateMenuLeaderboard(); showScreen('startScreen'); }

    function createParticles() {
        const container = document.getElementById('particles');
        const dustColors = ['rgba(201,122,46,0.7)','rgba(155,107,191,0.7)','rgba(240,192,64,0.7)','rgba(245,168,74,0.6)','rgba(196,155,223,0.6)'];
        for (let i = 0; i < 30; i++) {
            const d = document.createElement('div');
            d.className = 'dust';
            const sz = Math.random() * 4 + 2;
            d.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;background:${dustColors[Math.floor(Math.random()*dustColors.length)]};animation-duration:${Math.random()*18+12}s;animation-delay:${Math.random()*15}s;`;
            container.appendChild(d);
        }
        for (let i = 0; i < 5; i++) {
            const sl = document.createElement('div');
            sl.className = 'shimmer-line';
            sl.style.cssText = `top:${Math.random()*100}%;animation-delay:${i*2.2}s;animation-duration:${Math.random()*5+7}s;`;
            container.appendChild(sl);
        }
    }

    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function startGame(mode) {
        gameState = { mode, points:0, streak:0, bestStreak:0, correctAnswers:0, totalAttempts:0, startTime:Date.now(), allSentences:[...sentenceData[mode]], remainingSentences:[...sentenceData[mode]], solvedSentences:[], currentSentence:null, basePointsPerSlot:10 };
        const modeNames = { preposition:'Präpositionen', definite:'Bestimmte Artikel', indefinite:'Unbestimmte Artikel', negation:'Verneinung', possessive:'Possessivpronomen', relative:'Relativpronomen', comma:'Beistriche' };
        const ind = document.getElementById('modeIndicator');
        ind.textContent = modeNames[mode]; ind.className = 'mode-indicator ' + mode;
        updateStats(); updateProgress(); loadNextSentence();
        showScreen('gameScreen'); document.getElementById('backBtn').style.display = 'block';
    }

    function loadNextSentence() {
        if (gameState.remainingSentences.length === 0) { endGame(); return; }
        const idx = Math.floor(Math.random() * gameState.remainingSentences.length);
        gameState.currentSentence = gameState.remainingSentences[idx];
        document.getElementById('hintBox').style.display = 'none';
        renderSentence(); renderOptions();
        const firstSlot = document.querySelector('.article-slot');
        if (firstSlot) selectSlot(firstSlot);
    }

    function renderSentence() {
        const s = gameState.currentSentence;
        const container = document.getElementById('sentence');
        container.innerHTML = '';
        let text = s.text, slotIndex = 0;
        const regex = /\[(.*?)\]/g;
        let lastIndex = 0, match;
        while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) { const w = document.createElement('span'); w.className='word'; w.textContent=text.substring(lastIndex,match.index); container.appendChild(w); }
            const slot = document.createElement('span');
            slot.className='article-slot'; slot.dataset.slotIndex=slotIndex;
            slot.textContent = gameState.mode==='comma' ? '?' : '___';
            if (gameState.mode==='comma') slot.style.minWidth='50px';
            slot.onclick = () => selectSlot(slot);
            container.appendChild(slot);
            slotIndex++; lastIndex=regex.lastIndex;
        }
        if (lastIndex < text.length) { const w=document.createElement('span'); w.className='word'; w.textContent=text.substring(lastIndex); container.appendChild(w); }
    }

    function renderOptions() {
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        if (gameState.mode==='comma') {
            [{label:'✓ Beistrich setzen',value:true},{label:'✗ Kein Beistrich',value:false}].forEach(o => {
                const btn=document.createElement('button'); btn.className='option-btn'; btn.textContent=o.label; btn.onclick=()=>fillSlot(o.value); grid.appendChild(btn);
            });
        } else if (gameState.mode==='preposition') {
            const dF=['der','die','das','dem','den','des'], iF=['ein','eine','einen','einem','einer','eines'], kF=['kein','keine','keinen','keinem','keiner','keines'];
            const slotIdx = selectedSlot ? parseInt(selectedSlot.dataset.slotIndex) : 0;
            const ca = (gameState.currentSentence.slots[slotIdx]?.art||'').toLowerCase();
            let options;
            if (dF.includes(ca)) options=[...dF]; else if (iF.includes(ca)) options=[...iF]; else if (kF.includes(ca)) options=[...kF];
            else { const prefixes=[['mein','meine','meinen','meinem','meiner','meines'],['dein','deine','deinen','deinem','deiner','deines'],['sein','seine','seinen','seinem','seiner','seines'],['ihr','ihre','ihren','ihrem','ihrer','ihres'],['unser','unsere','unseren','unserem','unserer','unseres'],['euer','eure','euren','eurem','eurer','eures']]; options=prefixes.find(p=>ca.startsWith(p[0].substring(0,3)))||[...dF,...iF]; }
            options.push('_');
            options.forEach(opt => { const btn=document.createElement('button'); btn.className='option-btn'; btn.textContent=opt==='_'?'(kein Artikel)':opt; btn.onclick=()=>fillSlot(opt); grid.appendChild(btn); });
        } else if (gameState.mode==='possessive') {
            const ti=selectedSlot?parseInt(selectedSlot.dataset.slotIndex):0;
            const ta=(gameState.currentSentence.slots[ti]?.art||'').toLowerCase();
            const sets=[['mein','meine','meinen','meinem','meiner','meines'],['dein','deine','deinen','deinem','deiner','deines'],['sein','seine','seinen','seinem','seiner','seines'],['ihr','ihre','ihren','ihrem','ihrer','ihres'],['unser','unsere','unseren','unserem','unserer','unseres'],['euer','eure','euren','eurem','eurer','eures']];
            const forms=sets.find(s=>ta.startsWith(s[0].substring(0,3)))||sets[0];
            forms.forEach(opt => { const btn=document.createElement('button'); btn.className='option-btn'; btn.textContent=opt; btn.onclick=()=>fillSlot(opt); grid.appendChild(btn); });
        } else {
            const opts=optionsData[gameState.mode];
            Object.keys(opts).forEach(k=>opts[k].forEach(v=>{ const btn=document.createElement('button'); btn.className='option-btn'; btn.textContent=v==='_'?'(kein Artikel)':v===true?'✓ Beistrich setzen':v===false?'✗ Kein Beistrich':v; btn.onclick=()=>fillSlot(v); grid.appendChild(btn); }));
        }
    }

    let selectedSlot = null;
    function selectSlot(slot) {
        if (slot.classList.contains('correct')||slot.classList.contains('wrong')) return;
        document.querySelectorAll('.article-slot').forEach(s=>s.classList.remove('selected'));
        slot.classList.add('selected'); selectedSlot=slot;
        if (gameState.mode==='possessive'||gameState.mode==='preposition') renderOptions();
    }

    function fillSlot(value) {
        if (!selectedSlot) { const fe=document.querySelector('.article-slot:not(.correct):not(.wrong)'); if (fe) selectSlot(fe); else return; }
        const slotIndex=parseInt(selectedSlot.dataset.slotIndex);
        const slotData=gameState.currentSentence.slots[slotIndex];
        let correct;
        if (gameState.mode==='comma') { correct=slotData.comma; selectedSlot.textContent=value?',':'—'; }
        else { correct=slotData.art; selectedSlot.textContent=value==='_'?'∅':value; }
        gameState.totalAttempts++;
        const isCorrect = gameState.mode==='comma' ? value===correct : value.toLowerCase()===correct.toLowerCase();
        if (isCorrect) {
            selectedSlot.classList.add('correct'); selectedSlot.classList.remove('selected');
            gameState.correctAnswers++; gameState.streak++;
            if (gameState.streak>gameState.bestStreak) gameState.bestStreak=gameState.streak;
            let pts=gameState.basePointsPerSlot;
            if (gameState.streak>=20) pts*=5; else if (gameState.streak>=15) pts*=4; else if (gameState.streak>=10) pts*=3; else if (gameState.streak>=5) pts*=2;
            gameState.points+=pts; updateStats(); sounds.correct(); showPointsPopup(pts,gameState.streak>=5);
            const allCorrect=Array.from(document.querySelectorAll('.article-slot')).every(sl=>sl.classList.contains('correct'));
            if (allCorrect) { setTimeout(()=>{ gameState.solvedSentences.push(gameState.remainingSentences.splice(gameState.remainingSentences.indexOf(gameState.currentSentence),1)[0]); updateProgress(); if (gameState.solvedSentences.length%10===0&&gameState.solvedSentences.length>0) showMilestone(gameState.solvedSentences.length); loadNextSentence(); },800); }
            const nextEmpty=document.querySelector('.article-slot:not(.correct):not(.wrong)');
            if (nextEmpty) selectSlot(nextEmpty); else selectedSlot=null;
        } else {
            selectedSlot.classList.add('wrong'); gameState.streak=0; updateStats(); sounds.wrong();
            document.getElementById('hintBox').style.display='block';
            document.getElementById('hintText').textContent = gameState.mode==='comma' ? (correct?'Richtig wäre: Beistrich setzen (,)':'Richtig wäre: Kein Beistrich') : `Richtig wäre: „${correct==='_'?'(kein Artikel)':correct.toLowerCase()}"`;
            setTimeout(()=>{ selectedSlot.classList.remove('wrong','selected'); selectedSlot.textContent=gameState.mode==='comma'?'?':'___'; selectedSlot=null; },500);
        }
    }

    function skipSentence() { gameState.streak=0; updateStats(); const s=gameState.remainingSentences.shift(); gameState.remainingSentences.push(s); loadNextSentence(); }
    function updateStats() { document.getElementById('points').textContent=gameState.points; const el=document.getElementById('streak'); el.innerHTML=gameState.streak>2?`<span class="streak-fire">🔥</span>${gameState.streak}`:gameState.streak; }
    function updateProgress() { const tot=gameState.solvedSentences.length+gameState.remainingSentences.length, sol=gameState.solvedSentences.length; document.getElementById('progressFill').style.width=(tot>0?(sol/tot)*100:0)+'%'; document.getElementById('progressText').textContent=`${sol} / ${tot} Sätze gelöst`; }

    function showPointsPopup(pts,isStreak) {
        const p=document.createElement('div'); p.className='points-popup'+(isStreak?' streak-bonus':'');
        p.textContent=isStreak?`+${pts} 🔥 Combo!`:`+${pts}`;
        p.style.left=(Math.random()*60+20)+'%'; p.style.top='40%';
        document.body.appendChild(p); setTimeout(()=>p.remove(),1000);
    }

    function showMilestone(n) {
        const o=document.createElement('div'); o.className='milestone-overlay';
        o.innerHTML=`<div class="milestone-content"><div class="milestone-number">${n}</div><div class="milestone-text">✨ Wow, ${n} Sätze!</div></div>`;
        document.body.appendChild(o); sounds.milestone(); createConfetti(); setTimeout(()=>o.remove(),2500);
    }

    function createConfetti() {
        const cols=['#f5a84a','#f0c040','#c49bdf','#9b6bbf','#6dbf5a','#e05c5c','#c97a2e'];
        for (let i=0;i<100;i++) {
            const c=document.createElement('div'); c.className='confetti';
            c.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>0.5?'50%':'3px'};`;
            const sz=(Math.random()*10+5)+'px'; c.style.width=c.style.height=sz;
            document.body.appendChild(c);
            const anim=c.animate([{transform:'translateY(0) rotate(0deg)',opacity:1},{transform:`translateY(100vh) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:Math.random()*2000+2000,easing:'ease-out'});
            anim.onfinish=()=>c.remove();
        }
    }

    function endGame() {
        const elapsed=Math.floor((Date.now()-gameState.startTime)/1000);
        document.getElementById('finalPoints').textContent=gameState.points;
        document.getElementById('finalTime').textContent=`${Math.floor(elapsed/60)}:${(elapsed%60).toString().padStart(2,'0')}`;
        document.getElementById('bestStreak').textContent=gameState.bestStreak;
        document.getElementById('accuracy').textContent=gameState.totalAttempts>0?Math.round((gameState.correctAnswers/gameState.totalAttempts)*100)+'%':'0%';
        showScreen('resultScreen'); document.getElementById('backBtn').style.display='none';
        updateResultLeaderboard(); sounds.milestone(); createConfetti();
    }

    function loadLeaderboard() { try { return JSON.parse(localStorage.getItem('artikelChampionOrangeFliederLeaderboard')||'[]'); } catch(e) { return []; } }
    function saveLeaderboard(b) { try { localStorage.setItem('artikelChampionOrangeFliederLeaderboard',JSON.stringify(b)); } catch(e) {} }

    function saveScore() {
        const name=document.getElementById('playerName').value.trim()||'Anonym';
        const elapsed=Math.floor((Date.now()-gameState.startTime)/1000);
        const modeNames={preposition:'Präpositionen',definite:'Bestimmte Artikel',indefinite:'Unbestimmte Artikel',negation:'Verneinung',possessive:'Possessivpronomen',relative:'Relativpronomen',comma:'Beistriche'};
        const entry={name,points:gameState.points,time:elapsed,mode:modeNames[gameState.mode],date:new Date().toLocaleDateString('de-DE')};
        const board=loadLeaderboard(); board.push(entry); board.sort((a,b)=>b.points-a.points); saveLeaderboard(board.slice(0,10));
        updateResultLeaderboard(); updateMenuLeaderboard();
        document.getElementById('playerName').disabled=true;
        event.target.disabled=true; event.target.textContent='✓ Gespeichert!';
    }

    function formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

    function renderBoard(container, entries, limit) {
        if (entries.length===0) { container.innerHTML='<p style="color:var(--text-muted);text-align:center;">Noch keine Einträge. Sei die Erste!</p>'; return; }
        container.innerHTML=entries.slice(0,limit).map((e,i)=>`<div class="leaderboard-entry"><span class="leaderboard-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'}</span><span class="leaderboard-name">${e.name}</span><span class="leaderboard-score">${e.points} Pkt</span><span class="leaderboard-time">${formatTime(e.time)}</span></div>`).join('');
    }

    function updateMenuLeaderboard() { renderBoard(document.getElementById('menuLeaderboard'),loadLeaderboard(),5); }
    function updateResultLeaderboard() { const c=document.getElementById('resultLeaderboard'); c.innerHTML='<h3 class="leaderboard-title">🏅 Bestenliste</h3>'; const inner=document.createElement('div'); renderBoard(inner,loadLeaderboard(),5); c.appendChild(inner); }

    function playAgain() {
        document.getElementById('playerName').disabled=false; document.getElementById('playerName').value='';
        const btn=document.querySelector('#resultScreen .control-btn.primary'); if (btn) { btn.disabled=false; btn.textContent='💾 Speichern'; }
        startGame(gameState.mode);
    }

    function goToMenu() {
        document.getElementById('backBtn').style.display='none';
        document.getElementById('playerName').disabled=false; document.getElementById('playerName').value='';
        const btn=document.querySelector('#resultScreen .control-btn.primary'); if (btn) { btn.disabled=false; btn.textContent='💾 Speichern'; }
        showScreen('startScreen'); updateMenuLeaderboard();
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
