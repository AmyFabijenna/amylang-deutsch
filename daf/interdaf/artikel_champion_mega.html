<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA-CHAMPION 🏆</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d0d1a;
            --primary-light: #1a1a2e;
            --accent: #8ab4f8;
            --accent-glow: #c8d8ff;
            --silver: #c0c8d8;
            --silver-bright: #e8edf8;
            --silver-dark: #7a8899;
            --success: #6ee7b7;
            --error: #f87171;
            --warning: #fbbf24;
            --bg-dark: #080810;
            --bg-card: #121228;
            --text: #f0f4ff;
            --text-muted: #8a9bbf;
            --gold: #ffd700;
            --shimmer1: #a0b8e0;
            --shimmer2: #d4e0f8;
            --shimmer3: #8090b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(160deg, #080810 0%, #0f0f22 40%, #0a0a1c 70%, #080810 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        /* Silver shimmer background */
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .silver-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200,216,255,0.6) 0%, transparent 70%);
            animation: particleDrift 12s ease-in-out infinite;
        }
        @keyframes particleDrift {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-40px) scale(1.3); opacity: 0.7; }
        }
        .shimmer-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(200,216,255,0.5), rgba(232,237,248,0.8), rgba(200,216,255,0.5), transparent);
            animation: shimmerPass 8s ease-in-out infinite;
        }
        @keyframes shimmerPass {
            0% { transform: translateX(-100%) rotate(-5deg); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateX(110vw) rotate(-5deg); opacity: 0; }
        }
        .star-dot {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(200,216,255,0.8);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 1; transform: scale(2); }
        }

        .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; padding-top: 10px; }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #8090b8 0%, #c0c8d8 20%, #e8edf8 40%, #f0f4ff 50%, #e8edf8 60%, #c0c8d8 80%, #8090b8 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: silverShimmer 4s linear infinite;
            margin-bottom: 10px;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(200,216,255,0.4));
        }
        @keyframes silverShimmer { to { background-position: 200% center; } }
        .subtitle { color: var(--text-muted); font-size: 1.05rem; }

        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .menu-card {
            background: linear-gradient(135deg, rgba(18,18,40,0.97) 0%, rgba(10,10,28,0.97) 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(200,216,255,0.2);
            box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 40px rgba(200,216,255,0.05), inset 0 1px 0 rgba(200,216,255,0.1);
        }
        .mode-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; margin-bottom: 20px; color: var(--silver-bright); }
        .mode-buttons { display: flex; flex-direction: column; gap: 12px; }
        .mode-btn {
            background: linear-gradient(135deg, var(--primary-light) 0%, #14142a 100%);
            border: 1px solid rgba(200,216,255,0.2);
            border-radius: 15px;
            padding: 18px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
        }
        .mode-btn:hover {
            transform: translateX(8px);
            box-shadow: 0 4px 20px rgba(200,216,255,0.2);
            border-color: var(--silver);
            background: linear-gradient(135deg, #1a1a38 0%, #202040 100%);
        }
        .mode-btn .mode-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
        .mode-btn .mode-desc { font-size: 0.83rem; color: var(--text-muted); margin-top: 4px; font-weight: 400; }
        .mode-badge { display: inline-block; background: linear-gradient(135deg, #4a5080, var(--accent)); color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; margin-left: 8px; }
        .mode-badge.new-badge { background: linear-gradient(135deg, #2a6040, #6ee7b7); color: #080810; }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
        .stats-bar { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-item { background: var(--bg-card); padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(200,216,255,0.15); text-align: center; min-width: 90px; }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--silver-bright); }
        .streak-fire { display: inline-block; animation: flame 0.5s ease infinite alternate; }
        @keyframes flame { from { transform: scale(1); } to { transform: scale(1.2); } }

        .progress-bar { background: rgba(18,18,40,0.8); border-radius: 10px; height: 18px; overflow: hidden; margin-bottom: 25px; border: 1px solid rgba(200,216,255,0.15); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--shimmer3), var(--silver), var(--silver-bright)); transition: width 0.5s ease; box-shadow: 0 0 10px rgba(200,216,255,0.4); }
        .progress-text { text-align: center; margin-top: 6px; color: var(--text-muted); font-size: 0.88rem; }

        .mode-indicator { background: linear-gradient(135deg, #3a4060, var(--accent)); color: #f0f4ff; padding: 8px 20px; border-radius: 20px; font-weight: 700; font-size: 0.88rem; }

        .sentence-box {
            background: linear-gradient(135deg, rgba(18,18,40,0.97), rgba(10,10,24,0.99));
            border-radius: 20px;
            padding: 38px 30px;
            margin-bottom: 28px;
            border: 1px solid rgba(200,216,255,0.2);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 60px rgba(200,216,255,0.05);
            text-align: center;
        }
        .sentence { font-family: 'Fredoka', sans-serif; font-size: 1.75rem; line-height: 2.8; margin-bottom: 10px; }
        .word { display: inline-block; margin: 0 4px; }

        /* Hoverable noun */
        .noun-hover {
            display: inline-block;
            margin: 0 2px;
            cursor: help;
            position: relative;
            color: var(--silver-bright);
            border-bottom: 2px dotted rgba(200,216,255,0.4);
            transition: border-color 0.2s ease;
        }
        .noun-hover:hover { border-bottom-color: var(--silver-bright); }
        .noun-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1a1a38, #252548);
            border: 1px solid rgba(200,216,255,0.4);
            border-radius: 10px;
            padding: 6px 14px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--silver-bright);
            white-space: nowrap;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 0 10px rgba(200,216,255,0.15);
            pointer-events: none;
        }
        .noun-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(200,216,255,0.4);
        }
        .noun-hover:hover .noun-tooltip { display: block; }

        .article-slot {
            display: inline-block;
            min-width: 90px;
            padding: 7px 14px;
            background: rgba(18,18,40,0.9);
            border: 2px solid rgba(200,216,255,0.25);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            color: var(--text-muted);
            margin: 0 4px;
        }
        .article-slot:hover { border-color: var(--silver); transform: scale(1.05); }
        .article-slot.selected { background: rgba(200,216,255,0.12); border-color: var(--silver-bright); color: var(--silver-bright); }
        .article-slot.correct {
            background: linear-gradient(135deg, rgba(110,231,183,0.25), rgba(110,231,183,0.1));
            border-color: var(--success); color: var(--success);
            animation: pulseSuccess 0.6s ease;
        }
        .article-slot.wrong {
            background: linear-gradient(135deg, rgba(248,113,113,0.25), rgba(248,113,113,0.1));
            border-color: var(--error); color: var(--error);
            animation: shake 0.5s ease;
        }
        @keyframes pulseSuccess { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .hint-box {
            display: none;
            background: rgba(200,216,255,0.08);
            border: 1px solid rgba(200,216,255,0.25);
            border-radius: 12px;
            padding: 14px 20px;
            margin-top: 18px;
            color: var(--text);
            font-size: 0.95rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: linear-gradient(135deg, var(--primary-light) 0%, #14142a 100%);
            border: 2px solid rgba(200,216,255,0.2);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(200,216,255,0.2);
            border-color: var(--silver);
            background: linear-gradient(135deg, #1a1a38, #202048);
        }
        .option-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .control-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .control-btn {
            background: linear-gradient(135deg, var(--primary-light) 0%, #14142a 100%);
            border: 2px solid rgba(200,216,255,0.2);
            border-radius: 12px;
            padding: 12px 25px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(200,216,255,0.15); border-color: var(--silver); }
        .control-btn.primary {
            background: linear-gradient(135deg, #3a4060 0%, var(--accent) 100%);
            border-color: var(--silver);
            color: #f0f4ff;
            font-weight: 700;
        }
        .control-btn.primary:hover { background: linear-gradient(135deg, var(--accent), var(--silver-bright)); box-shadow: 0 6px 25px rgba(200,216,255,0.3); }

        .back-btn {
            position: fixed; top: 20px; left: 20px; z-index: 100; display: none;
            background: linear-gradient(135deg, rgba(18,18,40,0.97), rgba(10,10,28,0.97));
            border: 1px solid rgba(200,216,255,0.25); border-radius: 12px;
            padding: 10px 18px; color: var(--text);
            font-family: 'Quicksand', sans-serif; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
        }
        .back-btn:hover { border-color: var(--silver); box-shadow: 0 4px 15px rgba(200,216,255,0.15); }

        .result-card {
            background: linear-gradient(135deg, rgba(18,18,40,0.97), rgba(10,10,28,0.97));
            border-radius: 20px; padding: 35px; margin-bottom: 20px;
            border: 1px solid rgba(200,216,255,0.2);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        .result-title { font-family: 'Fredoka', sans-serif; font-size: 2rem; margin-bottom: 25px; color: var(--silver-bright); }
        .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px; margin-bottom: 28px; }
        .result-stat { background: rgba(18,18,40,0.6); padding: 18px; border-radius: 14px; border: 1px solid rgba(200,216,255,0.15); }
        .result-stat-label { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .result-stat-value { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--silver-bright); }
        .player-name-input {
            width: 100%; max-width: 350px;
            background: rgba(18,18,40,0.9); border: 2px solid rgba(200,216,255,0.2);
            border-radius: 12px; padding: 14px 18px; color: var(--text);
            font-family: 'Quicksand', sans-serif; font-size: 1.05rem;
            margin: 20px auto; display: block; text-align: center;
        }
        .player-name-input:focus { outline: none; border-color: var(--silver); box-shadow: 0 0 15px rgba(200,216,255,0.15); }

        .leaderboard-container { background: rgba(18,18,40,0.6); border-radius: 14px; padding: 25px; margin-top: 25px; border: 1px solid rgba(200,216,255,0.15); }
        .leaderboard-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--silver-bright); margin-bottom: 18px; text-align: center; }
        .leaderboard-entry {
            display: grid; grid-template-columns: 50px 1fr auto auto;
            gap: 12px; padding: 12px;
            background: rgba(18,18,40,0.4); border-radius: 10px;
            margin-bottom: 8px; align-items: center;
            border: 1px solid rgba(200,216,255,0.1);
        }
        .leaderboard-rank { font-size: 1.2rem; font-weight: 700; text-align: center; }
        .leaderboard-name { font-weight: 600; color: var(--text); }
        .leaderboard-score { color: var(--silver-bright); font-weight: 700; }
        .leaderboard-time { color: var(--text-muted); font-size: 0.88rem; }

        .points-popup {
            position: fixed; font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem; font-weight: 700; color: var(--success);
            pointer-events: none; z-index: 1000;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .points-popup.streak-bonus { color: var(--gold); font-size: 2.2rem; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-80px) scale(1.2); opacity: 0; } }

        .milestone-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8,8,16,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; animation: fadeIn 0.3s ease;
        }
        .milestone-content { text-align: center; animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes scaleIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .milestone-number { font-family: 'Fredoka', sans-serif; font-size: 6rem; color: var(--silver-bright); margin-bottom: 15px; filter: drop-shadow(0 0 30px rgba(200,216,255,0.6)); }
        .milestone-text { font-family: 'Fredoka', sans-serif; font-size: 2rem; color: var(--text); }

        .confetti { position: fixed; pointer-events: none; z-index: 3000; }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .sentence { font-size: 1.4rem; line-height: 2.4; }
            .article-slot { min-width: 70px; padding: 6px 10px; font-size: 0.9rem; }
            .mode-btn { padding: 14px 18px; }
            .result-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>
    <button class="back-btn" id="backBtn" onclick="goToMenu()">← Zurück zum Menü</button>

    <div class="container">
        <header>
            <h1>✨ MEGA-CHAMPION ✨</h1>
            <p class="subtitle">Deutsch meistern – Alltag, Humor, Grammaik auf höchstem Niveau</p>
        </header>

        <div id="startScreen" class="screen active">
            <div class="menu-card">
                <h2 class="mode-title">🎯 Wähle deinen Trainingsmodus</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="startGame('preposition')">
                        <span class="mode-icon">📍</span>
                        Präpositionen (mit, in, an, auf, ...)
                        <div class="mode-desc">Wähle den richtigen Artikel nach der Präposition</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('definite')">
                        <span class="mode-icon">🔷</span>
                        Bestimmte Artikel (der, die, das)
                        <div class="mode-desc">Finde den richtigen bestimmten Artikel im passenden Fall</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('indefinite')">
                        <span class="mode-icon">◇</span>
                        Unbestimmte Artikel (ein, eine, ein)
                        <div class="mode-desc">Übe unbestimmte Artikel in allen Fällen</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('negation')">
                        <span class="mode-icon">⊘</span>
                        Verneinung (kein, keine, nicht)
                        <div class="mode-desc">Lerne wann „kein" und wann „nicht" verwendet wird</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('possessive')">
                        <span class="mode-icon">👤</span>
                        Possessivpronomen (mein, dein, sein, ...)
                        <div class="mode-desc">Possessivartikel in allen Fällen meistern</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('relative')">
                        <span class="mode-icon">🔗</span>
                        Relativpronomen (der, die, das, ...)
                        <div class="mode-desc">Relativsätze mit den richtigen Pronomen bilden</div>
                    </button>
                    <button class="mode-btn" onclick="startGame('comma')">
                        <span class="mode-icon">📝</span>
                        Beistriche <span class="mode-badge new-badge">NEU</span>
                        <div class="mode-desc">Setze Beistriche richtig bei Nebensätzen, Aufzählungen und Infinitivgruppen</div>
                    </button>
                </div>
            </div>
            <div class="menu-card">
                <h2 class="mode-title">🏆 Bestenliste</h2>
                <div id="menuLeaderboard"></div>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="mode-indicator" id="modeIndicator">Modus</div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-label">Punkte</div>
                        <div class="stat-value" id="points">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Serie</div>
                        <div class="stat-value" id="streak">0</div>
                    </div>
                </div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <div class="progress-text" id="progressText">0 / 0 Sätze gelöst</div>
            <div class="sentence-box">
                <div class="sentence" id="sentence"></div>
                <div class="hint-box" id="hintBox"><span id="hintText"></span></div>
            </div>
            <div class="options-grid" id="optionsGrid"></div>
            <div class="control-buttons">
                <button class="control-btn" onclick="skipSentence()">⏭️ Überspringen</button>
                <button class="control-btn primary" onclick="endGame()">🏁 Beenden</button>
            </div>
        </div>

        <div id="resultScreen" class="screen">
            <div class="result-card">
                <h2 class="result-title">🎉 Geschafft!</h2>
                <div class="result-stats">
                    <div class="result-stat"><div class="result-stat-label">Punkte</div><div class="result-stat-value" id="finalPoints">0</div></div>
                    <div class="result-stat"><div class="result-stat-label">Zeit</div><div class="result-stat-value" id="finalTime">0:00</div></div>
                    <div class="result-stat"><div class="result-stat-label">Beste Serie</div><div class="result-stat-value" id="bestStreak">0</div></div>
                    <div class="result-stat"><div class="result-stat-label">Genauigkeit</div><div class="result-stat-value" id="accuracy">0%</div></div>
                </div>
                <input type="text" class="player-name-input" id="playerName" placeholder="Dein Name..." maxlength="20">
                <div class="control-buttons">
                    <button class="control-btn primary" onclick="saveScore()">💾 Speichern</button>
                    <button class="control-btn" onclick="playAgain()">🔄 Nochmal spielen</button>
                    <button class="control-btn" onclick="goToMenu()">🏠 Zurück zum Menü</button>
                </div>
                <div id="resultLeaderboard" class="leaderboard-container"></div>
            </div>
        </div>
    </div>

<script>
// ==================== SOUNDS ====================
const sounds = {
    correct: () => { try { const ctx=new(window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.value=0.13; o.start(); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.15); setTimeout(()=>ctx.close(),200); } catch(e){} },

// ==================== OPTIONS ====================
const optionsData = {
    preposition: { art:['dem','der','den','das','die','einen','einem','einer','eine','ein','_'] },
    definite: { art:['der','die','das','den','dem','des'] },
    indefinite: { art:['ein','eine','einen','einem','einer','eines','_'] },
    negation: { art:['kein','keine','keinen','keinem','keiner','nicht'] },
    possessive: { art:['mein','dein','sein','ihr','unser','euer','meinen','deinen','seinen','ihren','unseren','euren','meinem','deinem','seinem','ihrem','unserem','eurem','meiner','deiner','seiner','ihrer','unserer','eurer','meine','deine','seine','ihre','unsere','eure','meines','deines','seines','ihres','unseres','eures'] },
    relative: { art:['der','die','das','den','dem','denen','dessen','deren'] },
    comma: { comma:[true,false] }
};

// ==================== GAME STATE ====================
let gameState = {
    mode:null, points:0, streak:0, bestStreak:0,
    correctAnswers:0, totalAttempts:0, startTime:null, timerInterval:null,
    allSentences:[], remainingSentences:[], solvedSentences:[],
    currentSentence:null, basePointsPerSlot:10
};

// ==================== INIT ====================
function init() { createBackground(); updateMenuLeaderboard(); showScreen('startScreen'); }

function createBackground() {
    const bg = document.getElementById('bgLayer');
    for (let i=0;i<60;i++) {
        const s=document.createElement('div'); s.className='star-dot';
        s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
        s.style.animationDelay=(Math.random()*4)+'s'; s.style.animationDuration=(Math.random()*3+2)+'s';
        bg.appendChild(s);
    }
    for (let i=0;i<8;i++) {
        const p=document.createElement('div'); p.className='silver-particle';
        const sz=(Math.random()*80+20)+'px'; p.style.width=p.style.height=sz;
        p.style.left=Math.random()*100+'%'; p.style.top=Math.random()*100+'%';
        p.style.animationDelay=(Math.random()*8)+'s'; p.style.animationDuration=(Math.random()*6+8)+'s';
        bg.appendChild(p);
    }
    for (let i=0;i<5;i++) {
        const l=document.createElement('div'); l.className='shimmer-line';
        l.style.width=(Math.random()*200+150)+'px'; l.style.top=Math.random()*100+'%';
        l.style.animationDelay=(Math.random()*8)+'s'; l.style.animationDuration=(Math.random()*4+6)+'s';
        bg.appendChild(l);
    }
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function startGame(mode) {
    gameState.mode=mode; gameState.points=0; gameState.streak=0; gameState.bestStreak=0;
    gameState.correctAnswers=0; gameState.totalAttempts=0; gameState.startTime=Date.now();
    gameState.allSentences=[...sentenceData[mode]];
    gameState.remainingSentences=[...gameState.allSentences];
    gameState.solvedSentences=[];
    const modeNames={preposition:'Präpositionen',definite:'Bestimmte Artikel',indefinite:'Unbestimmte Artikel',negation:'Verneinung',possessive:'Possessivpronomen',relative:'Relativpronomen',comma:'Beistriche'};
    const ind=document.getElementById('modeIndicator');
    ind.textContent=modeNames[mode]; ind.className='mode-indicator '+mode;
    updateStats(); updateProgress(); loadNextSentence();
    showScreen('gameScreen'); document.getElementById('backBtn').style.display='block';
}

// ==================== SENTENCE RENDERING ====================
// Text format: plain text with [slot] for gaps, N{art|Nomen} for hoverable nouns
function parseSentenceText(rawText, mode) {
    // Returns array of {type:'text'|'slot'|'noun', content, nominativArt, nomenText}
    const parts=[];
    // Combined regex for slots [x] and nouns N{art|text}
    const regex=/\[([^\]]*)\]|N\{([^|]+)\|([^}]+)\}/g;
    let last=0, slotIdx=0, match;
    while((match=regex.exec(rawText))!==null) {
        if(match.index>last) parts.push({type:'text',content:rawText.substring(last,match.index)});
        if(match[0].startsWith('[')){
            parts.push({type:'slot',slotIndex:slotIdx, mode});
            slotIdx++;
        } else {
            // N{nominativArt|Nomentext}
            parts.push({type:'noun',nominativArt:match[2],nomenText:match[3]});
        }
        last=regex.lastIndex;
    }
    if(last<rawText.length) parts.push({type:'text',content:rawText.substring(last)});
    return parts;
}

function renderSentence() {
    const s=gameState.currentSentence;
    const container=document.getElementById('sentence');
    container.innerHTML='';
    const parts=parseSentenceText(s.text, gameState.mode);
    parts.forEach(p=>{
        if(p.type==='text'){
            const sp=document.createElement('span'); sp.className='word'; sp.textContent=p.content; container.appendChild(sp);
        } else if(p.type==='slot'){
            const slot=document.createElement('span');
            slot.className='article-slot'; slot.dataset.slotIndex=p.slotIndex;
            if(gameState.mode==='comma'){slot.textContent='?';slot.style.minWidth='50px';}
            else slot.textContent='___';
            slot.onclick=()=>selectSlot(slot);
            container.appendChild(slot);
        } else if(p.type==='noun'){
            const wrap=document.createElement('span'); wrap.className='noun-hover';
            wrap.textContent=p.nomenText;
            const tip=document.createElement('span'); tip.className='noun-tooltip';
            tip.textContent=p.nominativArt+' '+p.nomenText.replace(/[\|\-]/g,'').trim();
            wrap.appendChild(tip); container.appendChild(wrap);
        }
    });
}

// ==================== OPTIONS RENDERING ====================
function renderOptions() {
    const grid=document.getElementById('optionsGrid');
    grid.innerHTML='';
    if(gameState.mode==='comma'){
        [{label:'✓ Beistrich setzen',value:true},{label:'✗ Kein Beistrich',value:false}].forEach(o=>{
            const btn=document.createElement('button'); btn.className='option-btn';
            btn.textContent=o.label; btn.onclick=()=>fillSlot(o.value); grid.appendChild(btn);
        });
    } else if(gameState.mode==='preposition'){
        const def=['der','die','das','dem','den','des'];
        const ind=['ein','eine','einen','einem','einer','eines'];
        const kein=['kein','keine','keinen','keinem','keiner','keines'];
        let slotIdx=selectedSlot?parseInt(selectedSlot.dataset.slotIndex):0;
        const correctArt=(gameState.currentSentence.slots[slotIdx]?.art||'').toLowerCase();
        let options;
        if(def.includes(correctArt)) options=[...def];
        else if(ind.includes(correctArt)) options=[...ind];
        else if(kein.includes(correctArt)) options=[...kein];
        else if(correctArt.startsWith('mein')) options=['mein','meine','meinen','meinem','meiner','meines'];
        else if(correctArt.startsWith('dein')) options=['dein','deine','deinen','deinem','deiner','deines'];
        else if(correctArt.startsWith('sein')) options=['sein','seine','seinen','seinem','seiner','seines'];
        else if(correctArt.startsWith('ihr')) options=['ihr','ihre','ihren','ihrem','ihrer','ihres'];
        else if(correctArt.startsWith('unser')) options=['unser','unsere','unseren','unserem','unserer','unseres'];
        else if(correctArt.startsWith('euer')||correctArt.startsWith('eur')) options=['euer','eure','euren','eurem','eurer','eures'];
        else options=[...def,...ind];
        options.push('_');
        options.forEach(opt=>{const btn=document.createElement('button');btn.className='option-btn';btn.textContent=opt==='_'?'(kein Artikel)':opt;btn.onclick=()=>fillSlot(opt);grid.appendChild(btn);});
    } else if(gameState.mode==='possessive'){
        let slotIdx=selectedSlot?parseInt(selectedSlot.dataset.slotIndex):0;
        const targetArt=(gameState.currentSentence.slots[slotIdx]?.art||'').toLowerCase();
        const formSets={mein:['mein','meine','meinen','meinem','meiner','meines'],dein:['dein','deine','deinen','deinem','deiner','deines'],sein:['sein','seine','seinen','seinem','seiner','seines'],ihr:['ihr','ihre','ihren','ihrem','ihrer','ihres'],unser:['unser','unsere','unseren','unserem','unserer','unseres'],euer:['euer','eure','euren','eurem','eurer','eures']};
        let base='mein';
        if(targetArt.startsWith('mein'))base='mein';
        else if(targetArt.startsWith('dein'))base='dein';
        else if(targetArt.startsWith('sein'))base='sein';
        else if(targetArt.startsWith('ihr'))base='ihr';
        else if(targetArt.startsWith('unser'))base='unser';
        else if(targetArt.startsWith('euer')||targetArt.startsWith('eur'))base='euer';
        formSets[base].forEach(opt=>{const btn=document.createElement('button');btn.className='option-btn';btn.textContent=opt;btn.onclick=()=>fillSlot(opt);grid.appendChild(btn);});
    } else {
        const opts=optionsData[gameState.mode];
        const allOpts=[];
        Object.keys(opts).forEach(k=>opts[k].forEach(v=>{if(!allOpts.includes(v))allOpts.push(v);}));
        allOpts.forEach(opt=>{const btn=document.createElement('button');btn.className='option-btn';btn.textContent=opt==='_'?'(kein Artikel)':opt;btn.onclick=()=>fillSlot(opt);grid.appendChild(btn);});
    }
}

// ==================== SLOT INTERACTION ====================
let selectedSlot=null;

function selectSlot(slot){
    if(slot.classList.contains('correct')||slot.classList.contains('wrong'))return;
    document.querySelectorAll('.article-slot').forEach(s=>s.classList.remove('selected'));
    slot.classList.add('selected'); selectedSlot=slot;
    if(gameState.mode==='possessive'||gameState.mode==='preposition') renderOptions();
}

function fillSlot(value){
    if(!selectedSlot){
        const fe=document.querySelector('.article-slot:not(.correct):not(.wrong)');
        if(fe)selectSlot(fe); else return;
    }
    const slotIndex=parseInt(selectedSlot.dataset.slotIndex);
    const slotData=gameState.currentSentence.slots[slotIndex];
    let correct=null;
    if(gameState.mode==='comma'){correct=slotData.comma;selectedSlot.textContent=value?',':'—';}
    else{correct=slotData.art;selectedSlot.textContent=value==='_'?'∅':value;}
    gameState.totalAttempts++;
    const isCorrect=gameState.mode==='comma'?value===correct:value.toLowerCase()===correct.toLowerCase();
    if(isCorrect){
        selectedSlot.classList.add('correct'); selectedSlot.classList.remove('selected');
        gameState.correctAnswers++; gameState.streak++;
        if(gameState.streak>gameState.bestStreak)gameState.bestStreak=gameState.streak;
        let pts=gameState.basePointsPerSlot;
        if(gameState.streak>=20)pts*=5;else if(gameState.streak>=15)pts*=4;else if(gameState.streak>=10)pts*=3;else if(gameState.streak>=5)pts*=2;
        gameState.points+=pts; updateStats(); sounds.correct(); showPointsPopup(pts,gameState.streak>=5);
        const allCorrect=Array.from(document.querySelectorAll('.article-slot')).every(sl=>sl.classList.contains('correct'));
        if(allCorrect){setTimeout(()=>{
            gameState.solvedSentences.push(gameState.remainingSentences.splice(gameState.remainingSentences.indexOf(gameState.currentSentence),1)[0]);
            updateProgress();
            if(gameState.solvedSentences.length%10===0&&gameState.solvedSentences.length>0)showMilestone(gameState.solvedSentences.length);
            loadNextSentence();
        },800);}
        const nextEmpty=document.querySelector('.article-slot:not(.correct):not(.wrong)');
        if(nextEmpty)selectSlot(nextEmpty);else selectedSlot=null;
    } else {
        selectedSlot.classList.add('wrong'); gameState.streak=0; updateStats(); sounds.wrong();
        document.getElementById('hintBox').style.display='block';
        if(gameState.mode==='comma'){
            document.getElementById('hintText').textContent=correct?'Richtig wäre: Beistrich setzen (,)':'Richtig wäre: Kein Beistrich';
        } else {
            document.getElementById('hintText').textContent=`Richtig wäre: „${correct==='_'?'(kein Artikel)':correct.toLowerCase()}"`;
        }
        setTimeout(()=>{
            selectedSlot.classList.remove('wrong','selected');
            selectedSlot.textContent=gameState.mode==='comma'?'?':'___';
            selectedSlot=null;
        },500);
    }
}

function loadNextSentence(){
    if(gameState.remainingSentences.length===0){endGame();return;}
    const idx=Math.floor(Math.random()*gameState.remainingSentences.length);
    gameState.currentSentence=gameState.remainingSentences[idx];
    document.getElementById('hintBox').style.display='none';
    renderSentence(); renderOptions();
    const firstSlot=document.querySelector('.article-slot');
    if(firstSlot)selectSlot(firstSlot);
}

function skipSentence(){
    gameState.streak=0; updateStats();
    const s=gameState.remainingSentences.shift();
    gameState.remainingSentences.push(s);
    loadNextSentence();
}

function updateStats(){
    document.getElementById('points').textContent=gameState.points;
    const el=document.getElementById('streak');
    el.innerHTML=gameState.streak>2?`<span class="streak-fire">🔥</span>${gameState.streak}`:gameState.streak;
}

function updateProgress(){
    const total=gameState.solvedSentences.length+gameState.remainingSentences.length;
    const solved=gameState.solvedSentences.length;
    const pct=total>0?(solved/total)*100:0;
    document.getElementById('progressFill').style.width=pct+'%';
    document.getElementById('progressText').textContent=`${solved} / ${total} Sätze gelöst`;
}

function showPointsPopup(pts,isStreak){
    const popup=document.createElement('div');
    popup.className='points-popup'+(isStreak?' streak-bonus':'');
    popup.textContent=isStreak?`+${pts} 🔥 Combo!`:`+${pts}`;
    popup.style.left=(Math.random()*60+20)+'%'; popup.style.top='40%';
    document.body.appendChild(popup); setTimeout(()=>popup.remove(),1000);
}

function showMilestone(n){
    const overlay=document.createElement('div'); overlay.className='milestone-overlay';
    overlay.innerHTML=`<div class="milestone-content"><div class="milestone-number">${n}</div><div class="milestone-text">✨ Wow, ${n} Sätze!</div></div>`;
    document.body.appendChild(overlay); sounds.milestone(); createConfetti();
    setTimeout(()=>overlay.remove(),2500);
}

function createConfetti(){
    const colors=['#c0c8d8','#e8edf8','#8ab4f8','#ffd700','#6ee7b7','#f87171','#a0b8e0'];
    for(let i=0;i<100;i++){
        const c=document.createElement('div'); c.className='confetti';
        c.style.left=Math.random()*100+'vw'; c.style.top='-10px';
        c.style.background=colors[Math.floor(Math.random()*colors.length)];
        c.style.borderRadius=Math.random()>0.5?'50%':'0';
        const sz=(Math.random()*10+5)+'px'; c.style.width=c.style.height=sz;
        document.body.appendChild(c);
        const anim=c.animate([{transform:'translateY(0) rotate(0deg)',opacity:1},{transform:`translateY(100vh) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:Math.random()*2000+2000,easing:'ease-out'});
        anim.onfinish=()=>c.remove();
    }
}

function endGame(){
    clearInterval(gameState.timerInterval);
    const elapsed=Math.floor((Date.now()-gameState.startTime)/1000);
    document.getElementById('finalPoints').textContent=gameState.points;
    document.getElementById('finalTime').textContent=`${Math.floor(elapsed/60)}:${(elapsed%60).toString().padStart(2,'0')}`;
    document.getElementById('bestStreak').textContent=gameState.bestStreak;
    document.getElementById('accuracy').textContent=gameState.totalAttempts>0?Math.round((gameState.correctAnswers/gameState.totalAttempts)*100)+'%':'0%';
    showScreen('resultScreen'); document.getElementById('backBtn').style.display='none';
    updateResultLeaderboard(); sounds.milestone(); createConfetti();
}

function loadLeaderboard(){try{return JSON.parse(localStorage.getItem('megaChampionLeaderboard')||'[]');}catch(e){return[];}}
function saveLeaderboard(b){try{localStorage.setItem('megaChampionLeaderboard',JSON.stringify(b));}catch(e){}}

function saveScore(){
    const name=document.getElementById('playerName').value.trim()||'Anonym';
    const elapsed=Math.floor((Date.now()-gameState.startTime)/1000);
    const modeNames={preposition:'Präpositionen',definite:'Bestimmte Artikel',indefinite:'Unbestimmte Artikel',negation:'Verneinung',possessive:'Possessivpronomen',relative:'Relativpronomen',comma:'Beistriche'};
    const entry={name,points:gameState.points,time:elapsed,mode:modeNames[gameState.mode],date:new Date().toLocaleDateString('de-DE')};
    const board=loadLeaderboard(); board.push(entry); board.sort((a,b)=>b.points-a.points);
    saveLeaderboard(board.slice(0,10)); updateResultLeaderboard(); updateMenuLeaderboard();
    document.getElementById('playerName').disabled=true;
    event.target.disabled=true; event.target.textContent='✓ Gespeichert!';
}

function formatTime(s){return`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;}

function renderBoard(container,entries,limit){
    if(entries.length===0){container.innerHTML='<p style="color:var(--text-muted);text-align:center;">Noch keine Einträge. Sei die Erste!</p>';return;}
    container.innerHTML=entries.slice(0,limit).map((e,i)=>
        `<div class="leaderboard-entry"><span class="leaderboard-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'}</span><span class="leaderboard-name">${e.name}</span><span class="leaderboard-score">${e.points} Pkt</span><span class="leaderboard-time">${formatTime(e.time)}</span></div>`
    ).join('');
}

function updateMenuLeaderboard(){renderBoard(document.getElementById('menuLeaderboard'),loadLeaderboard(),5);}
function updateResultLeaderboard(){
    const c=document.getElementById('resultLeaderboard');
    c.innerHTML='<h3 class="leaderboard-title">🏅 Bestenliste</h3>';
    const inner=document.createElement('div'); renderBoard(inner,loadLeaderboard(),5); c.appendChild(inner);
}

function playAgain(){
    document.getElementById('playerName').disabled=false; document.getElementById('playerName').value='';
    const btn=document.querySelector('#resultScreen .control-btn.primary');
    if(btn){btn.disabled=false;btn.textContent='💾 Speichern';}
    startGame(gameState.mode);
}

function goToMenu(){
    clearInterval(gameState.timerInterval); document.getElementById('backBtn').style.display='none';
    document.getElementById('playerName').disabled=false; document.getElementById('playerName').value='';
    const btn=document.querySelector('#resultScreen .control-btn.primary');
    if(btn){btn.disabled=false;btn.textContent='💾 Speichern';}
    showScreen('startScreen'); updateMenuLeaderboard();
}

document.addEventListener('DOMContentLoaded',init);
</script>
