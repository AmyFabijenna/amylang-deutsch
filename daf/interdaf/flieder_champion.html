    // Aber für Prädikat: Wenn es mehrere P-Teile gibt, müssen alle nacheinander in der Reihenfolge des Satzes abgearbeitet werden.
    // Wir bauen eine Sequenz von erwarteten Typen auf, die genau der Reihenfolge der Parts im Satz entspricht, aber
    // gruppiert nach der statischen Reihenfolge P → S → O2 → ... WICHTIG: Die statische Reihenfolge gibt nur vor,
    // dass zuerst alle P-Teile (in der Reihenfolge des Satzes), dann alle S-Teile (ein S besteht meist aus einem Teil),
    // dann O2 etc. – aber wenn ein Satz mehrere O4 hat, müssen die auch in der Satzreihenfolge abgearbeitet werden.
    // Vereinfachung: Wir legen die erwartete Reihenfolge fest als die Liste der Typen in der Reihenfolge des Satzes.
    // Aber die statische Vorgabe (P zuerst, dann S, ...) muss eingehalten werden: Der Spieler darf kein O4 anklicken,
    // bevor das Prädikat fertig ist. Also bauen wir eine Sequenz, die aus der Reihenfolge der Parts im Satz besteht,
    // aber wir prüfen vor jedem Klick, ob der Typ des angeklickten Parts mit dem aktuell erwarteten Typ übereinstimmt,
    // wobei der aktuell erwartete Typ aus der statischen Sequenz kommt, aber innerhalb eines Typs werden mehrere Parts
    // in der Satzreihenfolge akzeptiert.
    
    // Erstelle eine Liste der erwarteten Typen in der statischen Reihenfolge, wobei jeder Typ so oft vorkommt,
    // wie er im Satz vorkommt (in der Reihenfolge des Satzes).
    let expectedSequence = [];
    let remainingParts = [...parts];
    for (let targetType of orderSequence) {
        // Sammle alle Parts des aktuellen Zieltyps in der Reihenfolge des Satzes
        let indices = [];
        for (let i = 0; i < remainingParts.length; i++) {
            if (remainingParts[i].type === targetType) {
                indices.push(i);
            }
        }
        // Füge den Typ so oft hinzu, wie es Parts gibt
        for (let i = 0; i < indices.length; i++) {
            expectedSequence.push(targetType);
        }
        // Entferne diese Parts nicht, aber wir merken uns die Reihenfolge.
    }
    // Aber das ist zu kompliziert. Einfacher: expectedSequence ist einfach die Liste der Typen in der Reihenfolge,
    // wie sie im Satz vorkommen (weil der Spieler die Satzglieder in der Reihenfolge des Satzes anklicken soll,
    // aber unter der Einschränkung, dass zuerst alle P-Teile, dann alle S-Teile usw. kommen müssen.
    // Da im Satz die P-Teile normalerweise auch zuerst kommen (z.B. "hat ... erklärt"), ist das in Ordnung.
    // Wir setzen expectedSequence = parts.map(p => p.type);
    let expectedSequenceSimple = parts.map(p => p.type);
    gameState.analysisExpectedSequence = expectedSequenceSimple;
    gameState.analysisCurrentExpectedIndex = 0;
    
    // Farbige Darstellung
    let sentenceDiv = document.createElement('div');
    sentenceDiv.className = 'sentence-glider';
    let colors = ['#cfa3ff', '#ffd966', '#b87cff', '#f5b042', '#a37fd9', '#ffbf69', '#9f7ad3', '#f7c56e', '#e6ccff', '#ffe0a3', '#c2a5e0'];
    parts.forEach((part, idx) => {
        let span = document.createElement('span');
        span.className = 'glider-part';
        span.innerText = part.text;
        span.style.backgroundColor = colors[idx % colors.length];
        span.style.border = '1px solid #9b7bcf';
        span.dataset.idx = idx;
        span.dataset.type = part.type;
        span.onclick = () => handleAnalysisClickNew(idx);
        sentenceDiv.appendChild(span);
        sentenceDiv.appendChild(document.createTextNode(' '));
        gameState.analysisParts[idx].element = span;
    });
    container.appendChild(sentenceDiv);
    
    // Anzeige der erwarteten Reihenfolge (statisch, gruppiert)
    let presentTypes = [...new Set(parts.map(p => p.type))];
    let expectedOrderStatic = orderSequence.filter(t => presentTypes.includes(t));
    let orderDiv = document.createElement('div');
    orderDiv.className = 'analysis-order-bar';
    orderDiv.innerHTML = `<span>🎯 Reihenfolge (statisch):</span> ${expectedOrderStatic.map(t => `<span id="orderBadge-${t}">${t}</span>`).join(' → ')}`;
    let oldOrder = document.querySelector('.analysis-order-bar');
    if (oldOrder) oldOrder.remove();
    document.querySelector('.sentence-box').prepend(orderDiv);
    highlightCurrentTargetStatic(expectedOrderStatic);
};

function highlightCurrentTargetStatic(expectedOrderStatic) {
    // Hebe den aktuell erwarteten Typ in der statischen Leiste hervor
    // Der aktuell erwartete Typ ist der erste in expectedOrderStatic, dessen Parts noch nicht alle korrekt sind.
    // Wir berechnen, welcher Typ als nächstes dran ist, indem wir schauen, welcher Typ in der Sequenz als nächstes kommt.
    if (!gameState.analysisParts) return;
    let completedTypes = new Set();
    let currentTypeIndex = 0;
    for (let i = 0; i < expectedOrderStatic.length; i++) {
        let t = expectedOrderStatic[i];
        let allOfTypeCompleted = gameState.analysisParts.filter(p => p.type === t).every(p => p.correct);
        if (!allOfTypeCompleted) {
            currentTypeIndex = i;
            break;
        }
    }
    let targetType = expectedOrderStatic[currentTypeIndex];
    document.querySelectorAll('.analysis-order-bar span').forEach(span => span.classList.remove('current-target'));
    let targetSpan = Array.from(document.querySelectorAll('.analysis-order-bar span')).find(span => span.innerText === targetType);
    if (targetSpan) targetSpan.classList.add('current-target');
}

// Neue handleAnalysisClick-Funktion
window.handleAnalysisClickNew = function(partIdx) {
    let part = gameState.analysisParts[partIdx];
    if (part.correct) return;
    
    // Bestimme, welcher Typ gerade erwartet wird (der erste Typ in der statischen Reihenfolge, dessen Parts noch nicht alle korrekt sind)
    let presentTypes = [...new Set(gameState.analysisParts.map(p => p.type))];
    let expectedOrderStatic = orderSequence.filter(t => presentTypes.includes(t));
    let currentExpectedType = null;
    for (let t of expectedOrderStatic) {
        let allOfTypeCompleted = gameState.analysisParts.filter(p => p.type === t).every(p => p.correct);
        if (!allOfTypeCompleted) {
            currentExpectedType = t;
            break;
        }
    }
    if (!currentExpectedType) return; // alles fertig
    
    if (part.type !== currentExpectedType) {
        // Falsches Satzglied
        part.element.classList.add('wrong');
        playWrong();
        setTimeout(() => part.element.classList.remove('wrong'), 2500);
        gameState.streak = 0;
        updateStats();
        return;
    }
    
    // Richtig
    part.element.classList.add('correct');
    part.correct = true;
    gameState.correctAnswers++;
    gameState.totalAttempts++;
    gameState.streak++;
    if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak;
    let pts = 10 + (gameState.streak >= 5 ? 10 : 0);
    gameState.points += pts;
    updateStats();
    playCorrect();
    pointsPopup(pts, gameState.streak >= 5);
    
    // Prüfen, ob alle Parts des aktuellen Typs fertig sind
    let allCurrentTypeCompleted = gameState.analysisParts.filter(p => p.type === currentExpectedType).every(p => p.correct);
    if (allCurrentTypeCompleted) {
        // Weiter zum nächsten Typ
        highlightCurrentTargetStatic(expectedOrderStatic);
    }
    
    // Prüfen, ob alle Parts fertig sind
    let allDone = gameState.analysisParts.every(p => p.correct);
    if (allDone) {
        gameState.solvedCount++;
        let idxRem = gameState.remainingSentences.indexOf(gameState.currentSentence);
        if (idxRem !== -1) gameState.remainingSentences.splice(idxRem, 1);
        updateProgress();
        setTimeout(() => loadNextSentence(), 700);
    }
};

function updateStats() {
    document.getElementById('points').innerText = gameState.points;

function updateProgress() {

function pointsPopup(pts, bonus) {

function playCorrect() {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
    setTimeout(() => ctx.close(), 250);
}
function playWrong() {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 240; o.type = 'sawtooth'; g.gain.value = 0.08;
    o.start(); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
    setTimeout(() => ctx.close(), 280);
}

function startGame(mode) {

function renderNormal() {
    let s = gameState.currentSentence;
    let container = document.getElementById('sentence');
    container.innerHTML = '';
    let text = s.text;
    let slotIdx = 0;
    let regex = /\[(.*?)\]|N\{([^|]+)\|([^}]+)\}/g;
    let lastIndex = 0, match;
    while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
            let wordSpan = document.createElement('span');
            wordSpan.className = 'word';
            wordSpan.innerText = text.slice(lastIndex, match.index);
            container.appendChild(wordSpan);
        }
        if (match[0].startsWith('[')) {
            let slotSpan = document.createElement('span');
            slotSpan.className = 'article-slot';
            slotSpan.dataset.slotIndex = slotIdx++;
            slotSpan.innerText = '___';
            slotSpan.onclick = () => selectSlot(slotSpan);
            container.appendChild(slotSpan);
        } else {
            // Noun with hover
            let wrap = document.createElement('span');
            wrap.className = 'noun-hover';
            wrap.innerText = match[3];
            let tip = document.createElement('span');
            tip.className = 'noun-tooltip';
            tip.innerText = match[2] + ' ' + match[3];
            wrap.appendChild(tip);
            container.appendChild(wrap);
        }
        lastIndex = regex.lastIndex;
    }
    if (lastIndex < text.length) {
        let wordSpan = document.createElement('span');
        wordSpan.className = 'word';
        wordSpan.innerText = text.slice(lastIndex);
        container.appendChild(wordSpan);
    }
    renderOptionsNormal();
}

        btnTrue.innerText = 'Beistrich setzen (,)';
        btnTrue.onclick = () => fillSlot(true);

        return;
    }
    let slotIdx = selectedSlot ? parseInt(selectedSlot.dataset.slotIndex) : 0;
    let correctArt = gameState.currentSentence.slots[slotIdx]?.art || '';
    let options = [];
    if (gameState.mode === 'preposition') {
        if (correctArt === '_') options = ['_'];
        else if (['der', 'die', 'das', 'den', 'dem', 'des'].includes(correctArt)) options = ['der', 'die', 'das', 'den', 'dem', 'des'];
        else if (['ein', 'eine', 'einen', 'einem', 'einer', 'eines'].includes(correctArt)) options = ['ein', 'eine', 'einen', 'einem', 'einer', 'eines'];
        else if (correctArt.startsWith('kein')) options = ['kein', 'keine', 'keinen', 'keinem', 'keiner', 'keines'];
        else if (correctArt.startsWith('mein') || correctArt.startsWith('dein') || correctArt.startsWith('sein') || correctArt.startsWith('ihr') || correctArt.startsWith('unser') || correctArt.startsWith('euer')) {
            let base = correctArt.substring(0, 4);
            if (base === 'mein') options = ['mein', 'meine', 'meinen', 'meinem', 'meiner', 'meines'];
            else if (base === 'dein') options = ['dein', 'deine', 'deinen', 'deinem', 'deiner', 'deines'];
            else if (base === 'sein') options = ['sein', 'seine', 'seinen', 'seinem', 'seiner', 'seines'];
            else if (base === 'ihr') options = ['ihr', 'ihre', 'ihren', 'ihrem', 'ihrer', 'ihres'];
            else if (base === 'unse') options = ['unser', 'unsere', 'unseren', 'unserem', 'unserer', 'unseres'];
            else if (base === 'euer') options = ['euer', 'eure', 'euren', 'eurem', 'eurer', 'eures'];
            else options = ['mein', 'meine', 'meinen', 'meinem', 'meiner'];
        } else options = ['der', 'die', 'das', 'den', 'dem', 'des'];
    } else if (gameState.mode === 'definite') options = ['der', 'die', 'das', 'den', 'dem', 'des'];
    else if (gameState.mode === 'indefinite') options = ['ein', 'eine', 'einen', 'einem', 'einer', 'eines', '_'];
    else if (gameState.mode === 'negation') options = ['kein', 'keine', 'keinen', 'keinem', 'keiner', 'nicht'];
    // Negation: exakt diese 6 Formen – nie Artikel, Pronomen oder andere Wortarten
    else if (gameState.mode === 'possessive') {
        let base = gameState.currentSentence.slots[slotIdx]?.base || 'mein';
        if (base === 'mein') options = ['mein', 'meine', 'meinen', 'meinem', 'meiner', 'meines'];
        else if (base === 'dein') options = ['dein', 'deine', 'deinen', 'deinem', 'deiner', 'deines'];
        else if (base === 'sein') options = ['sein', 'seine', 'seinen', 'seinem', 'seiner', 'seines'];
        else if (base === 'ihr') options = ['ihr', 'ihre', 'ihren', 'ihrem', 'ihrer', 'ihres'];
        else if (base === 'unser') options = ['unser', 'unsere', 'unseren', 'unserem', 'unserer', 'unseres'];
        else if (base === 'euer') options = ['euer', 'eure', 'euren', 'eurem', 'eurer', 'eures'];
        else options = ['mein', 'meine', 'meinen', 'meinem', 'meiner'];
    } else if (gameState.mode === 'relative') options = ['der', 'die', 'das', 'den', 'dem', 'denen', 'dessen', 'deren'];

    options.forEach(opt => {

function fillSlot(val) {
    if (!selectedSlot) return;
    let idx = parseInt(selectedSlot.dataset.slotIndex);
    let correct = gameState.currentSentence.slots[idx].art;
    if (gameState.mode === 'comma') correct = gameState.currentSentence.slots[idx].comma;
    let isCorrect = (gameState.mode === 'comma') ? (val === correct) : (val.toLowerCase() === correct.toLowerCase());
    gameState.totalAttempts++;
    if (isCorrect) {
        selectedSlot.classList.add('correct');
        selectedSlot.classList.remove('selected');
        if (gameState.mode === 'comma') {
            selectedSlot.innerText = correct ? ',' : '—';
        } else {
            selectedSlot.innerText = (val === '_' ? '∅' : val);
        }
        gameState.correctAnswers++;
        gameState.streak++;
        if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak;
        let pts = 10 + (gameState.streak >= 5 ? 10 : 0) + (gameState.streak >= 10 ? 15 : 0);
        gameState.points += pts;
        updateStats();
        playCorrect();
        pointsPopup(pts, gameState.streak >= 5);
        let allCorrect = [...document.querySelectorAll('.article-slot')].every(s => s.classList.contains('correct'));
        if (allCorrect) {
            setTimeout(() => {
                gameState.solvedCount++;
                let idxRem = gameState.remainingSentences.indexOf(gameState.currentSentence);
                if (idxRem !== -1) gameState.remainingSentences.splice(idxRem, 1);
                updateProgress();
                loadNextSentence();
            }, 600);
        } else {
            let nextSlot = document.querySelector('.article-slot:not(.correct)');
            if (nextSlot) selectSlot(nextSlot);
            else selectedSlot = null;
        }
    } else {
        selectedSlot.classList.add('wrong');
        gameState.streak = 0;
        updateStats();
        playWrong();
        setTimeout(() => {
            if (selectedSlot) selectedSlot.classList.remove('wrong');
        }, 800);
    }
}

function selectSlot(slot) {
    if (slot.classList.contains('correct')) return;
    document.querySelectorAll('.article-slot').forEach(s => s.classList.remove('selected'));
    slot.classList.add('selected');
    selectedSlot = slot;
    renderOptionsNormal();
}

        updateProgress();
        setTimeout(() => loadNextSentence(), 700);
    } else {
        highlightCurrentTarget();
    }
}

function skipSentence() {
    gameState.streak = 0;
    updateStats();
    if (gameState.remainingSentences.length) {
        let first = gameState.remainingSentences.shift();
        gameState.remainingSentences.push(first);
    }
    loadNextSentence();
}

function endGame() {
    let elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
    document.getElementById('finalPoints').innerText = gameState.points;
    document.getElementById('finalTime').innerText = `${Math.floor(elapsed / 60)}:${(elapsed % 60).toString().padStart(2, '0')}`;
    document.getElementById('bestStreak').innerText = gameState.bestStreak;
    let accuracy = gameState.totalAttempts > 0 ? Math.round((gameState.correctAnswers / gameState.totalAttempts) * 100) : 0;
    document.getElementById('accuracy').innerText = accuracy + '%';
    showScreen('resultScreen');
    document.getElementById('backBtn').style.display = 'none';
    updateResultLeaderboard();
}

function goToMenu() {
    document.getElementById('backBtn').style.display = 'none';
    showScreen('startScreen');
    updateMenuLeaderboard();
}

function playAgain() {
    startGame(gameState.mode);
}

function saveScore() {
    let name = document.getElementById('playerName').value.trim() || 'Anonym';
    let elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
    let entry = { name, points: gameState.points, time: elapsed, mode: gameState.mode, date: new Date().toLocaleDateString() };
    let board = JSON.parse(localStorage.getItem('fliederBoard') || '[]');
    board.push(entry);
    board.sort((a, b) => b.points - a.points);
    localStorage.setItem('fliederBoard', JSON.stringify(board.slice(0, 10)));
    updateResultLeaderboard();
    updateMenuLeaderboard();
    alert('Gespeichert!');
}

function updateMenuLeaderboard() {
    let board = JSON.parse(localStorage.getItem('fliederBoard') || '[]');
    let div = document.getElementById('menuLeaderboard');
    if (!board.length) {
        div.innerHTML = '<p>✨ Noch keine Einträge</p>';
        return;
    }
    div.innerHTML = board.slice(0, 5).map((e, i) => `<div style="padding:4px">${i + 1}. ${e.name} – ${e.points} Pkt</div>`).join('');
}

function updateResultLeaderboard() {
    let board = JSON.parse(localStorage.getItem('fliederBoard') || '[]');
    let div = document.getElementById('resultLeaderboard');
    div.innerHTML = '<div class="mode-title">🏆 TOP 10</div>' + board.slice(0, 10).map((e, i) => `<div>${i + 1}. ${e.name} (${e.points})</div>`).join('');
}

function buildMenu() {
    let modes = [
        { id: "preposition", label: "📍 Präpositionen (knifflig)", icon: "📍" },
        { id: "definite", label: "🔷 Bestimmte Artikel (alle Fälle)", icon: "🔷" },
        { id: "indefinite", label: "◇ Unbestimmte Artikel + Nullartikel", icon: "◇" },
        { id: "negation", label: "⊘ Verneinung (kein/nicht)", icon: "⊘" },
        { id: "possessive", label: "👤 Possessivpronomen (C2)", icon: "👤" },
        { id: "relative", label: "🔗 Relativpronomen (Genitiv)", icon: "🔗" },
        { id: "comma", label: "📝 Beistriche – komplex", icon: "📝" },
        { id: "sentenceAnalysis", label: "🧩 Satzglieder analysieren (100 Sätze)", icon: "🧩" }
    ];
    let container = document.getElementById('modeList');
    container.innerHTML = '';
    modes.forEach(m => {
        let btn = document.createElement('button');
        btn.className = 'mode-btn';
        btn.innerHTML = `<span>${m.icon} ${m.label}</span><span style="font-size:1.2rem;">→</span>`;
        btn.onclick = () => startGame(m.id);
        container.appendChild(btn);
    });
}

// Alles initialisieren
buildMenu();
updateMenuLeaderboard();
showScreen('startScreen');


</script>
</body>
</html>
