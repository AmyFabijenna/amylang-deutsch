<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjektivdeklination Meister 🎯</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a1a2e; --primary-light: #2d2d4a; --accent: #4a9eff; --accent-glow: #7ab8ff; --definite: #4a9eff; --indefinite: #f5c842; --possessive: #9c27b0; --negation: #e53e3e; --nullartikel: #38a169; --mixed: #ed8936; --success: #4ecdc4; --error: #ff6b6b; --bg-dark: #0f0f1a; --bg-card: #1a1a2e; --text: #ffffff; --text-muted: #a0a0c0; --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(135deg, var(--bg-dark) 0%, #1a0a2e 50%, var(--bg-dark) 100%); min-height: 100vh; color: var(--text); overflow-x: hidden; }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: #a0a0c0; border-radius: 50%; animation: twinkle 2s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 2.5rem; background: linear-gradient(135deg, var(--accent-glow), #ce93d8, #ffe066); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; }
        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .menu-card { background: var(--bg-card); border-radius: 20px; padding: 30px; margin-bottom: 20px; border: 2px solid var(--primary-light); box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .mode-title { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; margin-bottom: 20px; color: var(--accent-glow); }
        .mode-buttons { display: flex; flex-direction: column; gap: 12px; }
        .mode-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); border: 2px solid var(--accent); border-radius: 15px; padding: 18px 25px; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-align: left; position: relative; }
        .mode-btn:hover { transform: translateX(10px); box-shadow: 0 5px 20px rgba(74,158,255,0.3); }
        .mode-btn .mode-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
        .mode-btn .mode-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; font-weight: 400; }
        .mode-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; margin-left: 10px; }
        .mode-btn.definite { border-color: var(--definite); } .mode-btn.definite .mode-badge { background: var(--definite); color: white; }
        .mode-btn.indefinite { border-color: var(--indefinite); } .mode-btn.indefinite .mode-badge { background: var(--indefinite); color: #1a1a2e; }
        .mode-btn.possessive { border-color: var(--possessive); } .mode-btn.possessive .mode-badge { background: var(--possessive); color: white; }
        .mode-btn.negation { border-color: var(--negation); } .mode-btn.negation .mode-badge { background: var(--negation); color: white; }
        .mode-btn.nullartikel { border-color: var(--nullartikel); } .mode-btn.nullartikel .mode-badge { background: var(--nullartikel); color: white; }
        .mode-btn.mixed { border-color: var(--mixed); } .mode-btn.mixed .mode-badge { background: var(--mixed); color: white; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .stats-bar { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-item { background: var(--bg-card); padding: 10px 18px; border-radius: 12px; border: 1px solid var(--primary-light); text-align: center; min-width: 90px; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; color: var(--accent-glow); }
        .streak-fire { display: inline-block; animation: flame 0.5s ease infinite alternate; }
        @keyframes flame { from { transform: scale(1); } to { transform: scale(1.2); } }
        .progress-bar { background: var(--bg-card); border-radius: 10px; height: 18px; overflow: hidden; margin-bottom: 15px; border: 1px solid var(--primary-light); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #ce93d8); transition: width 0.5s ease; }
        .progress-text { text-align: center; margin-bottom: 20px; color: var(--text-muted); font-size: 0.85rem; }
        .case-hint { background: linear-gradient(135deg, rgba(74,158,255,0.15), rgba(156,39,176,0.1)); border: 1px solid rgba(74,158,255,0.3); border-radius: 12px; padding: 12px 18px; margin-bottom: 20px; font-size: 1rem; color: var(--accent-glow); text-align: center; }
        .case-hint .article-label { display: inline-block; padding: 4px 12px; border-radius: 10px; font-weight: 700; margin-left: 8px; font-size: 0.9rem; text-transform: uppercase; }
        .case-hint .article-label.definite { background: var(--definite); color: white; }
        .case-hint .article-label.indefinite { background: var(--indefinite); color: #1a1a2e; }
        .case-hint .article-label.possessive { background: var(--possessive); color: white; }
        .case-hint .article-label.negation { background: var(--negation); color: white; }
        .case-hint .article-label.nullartikel { background: var(--nullartikel); color: white; }
        .sentence-card { background: var(--bg-card); border-radius: 25px; padding: 35px 30px; margin-bottom: 25px; border: 3px solid var(--primary-light); box-shadow: 0 15px 50px rgba(0,0,0,0.4); text-align: center; min-height: 100px; }
        .sentence { font-size: 1.5rem; line-height: 2.2; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
        .word { display: inline-block; }
        .slot-group { display: inline-flex; align-items: center; gap: 3px; background: rgba(74,158,255,0.1); padding: 6px 10px; border-radius: 12px; margin: 0 4px; }
        .article-slot, .ending-slot { display: inline-flex; align-items: center; justify-content: center; min-width: 75px; height: 44px; background: var(--primary); border: 2px dashed var(--accent); border-radius: 10px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; color: var(--text-muted); padding: 0 10px; font-size: 1rem; }
        .ending-slot { min-width: 55px; border-color: var(--possessive); }
        .article-slot:hover { border-color: var(--accent-glow); box-shadow: 0 0 15px rgba(74,158,255,0.3); }
        .ending-slot:hover { border-color: #ce93d8; box-shadow: 0 0 15px rgba(156,39,176,0.3); }
        .article-slot.selected { border-style: solid; border-color: var(--accent); box-shadow: 0 0 20px rgba(74,158,255,0.5); animation: pulse 1s ease infinite; }
        .ending-slot.selected { border-style: solid; border-color: var(--possessive); box-shadow: 0 0 20px rgba(156,39,176,0.5); animation: pulse 1s ease infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .article-slot.correct, .ending-slot.correct { border-style: solid; color: white; animation: correctBounce 0.5s ease; background: var(--success); border-color: #3db8ad; }
        @keyframes correctBounce { 0% { transform: scale(0.8); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .article-slot.wrong, .ending-slot.wrong { animation: wrongShake 0.5s ease; background: var(--error); border-color: var(--error); }
        @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        .adjective-stem { font-weight: 700; color: #ce93d8; font-size: 1.1em; }
        .buttons-section { margin-bottom: 20px; }
        .buttons-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: center; }
        .article-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 500px; margin: 0 auto; }
        .ending-grid { display: flex; gap: 10px; justify-content: center; max-width: 400px; margin: 0 auto; }
        .article-btn, .ending-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); border: 2px solid var(--primary-light); border-radius: 12px; padding: 12px 20px; color: var(--text); font-family: 'Fredoka', sans-serif; font-size: 1.1rem; cursor: pointer; transition: all 0.2s ease; min-width: 70px; }
        .article-btn:hover, .ending-btn:hover { transform: translateY(-3px); }
        .article-btn { border-color: var(--accent); }
        .article-btn:hover { box-shadow: 0 5px 20px rgba(74,158,255,0.4); background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%); }
        .ending-btn { border-color: var(--possessive); }
        .ending-btn:hover { box-shadow: 0 5px 20px rgba(156,39,176,0.4); background: linear-gradient(135deg, var(--primary-light) 0%, var(--possessive) 100%); }
        .control-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .control-btn { background: var(--bg-card); border: 2px solid var(--primary-light); border-radius: 12px; padding: 10px 20px; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .control-btn:hover { border-color: var(--accent); background: var(--primary); }
        .control-btn.primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-glow) 100%); border-color: var(--accent-glow); color: white; }
        .control-btn.primary:hover { box-shadow: 0 5px 20px rgba(74,158,255,0.5); }
        .points-popup { position: fixed; font-family: 'Fredoka', sans-serif; font-size: 1.5rem; color: var(--success); pointer-events: none; z-index: 1000; animation: floatUp 1s ease forwards; }
        .points-popup.streak-bonus { color: var(--gold); font-size: 1.8rem; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
        .milestone-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(74,158,255,0.95); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .milestone-content { text-align: center; }
        .milestone-number { font-family: 'Fredoka', sans-serif; font-size: 5rem; color: white; text-shadow: 0 0 30px rgba(255,255,255,0.5); }
        .milestone-text { font-size: 1.8rem; color: white; margin-top: 10px; }
        .confetti { position: fixed; z-index: 9999; pointer-events: none; }
        .result-card { background: var(--bg-card); border-radius: 25px; padding: 35px; text-align: center; border: 3px solid var(--accent); box-shadow: 0 15px 50px rgba(74,158,255,0.3); }
        .result-title { font-family: 'Fredoka', sans-serif; font-size: 2.2rem; color: var(--accent-glow); margin-bottom: 25px; }
        .result-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        .result-stat { background: var(--primary); padding: 18px; border-radius: 15px; }
        .result-stat-value { font-family: 'Fredoka', sans-serif; font-size: 2.2rem; color: var(--accent-glow); }
        .result-stat-label { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; }
        .name-input { background: var(--primary); border: 2px solid var(--primary-light); border-radius: 10px; padding: 12px 18px; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: 1rem; width: 100%; max-width: 280px; margin-bottom: 12px; text-align: center; }
        .name-input:focus { outline: none; border-color: var(--accent); }
        .leaderboard { margin-top: 25px; background: var(--primary); border-radius: 15px; padding: 18px; }
        .leaderboard-title { font-family: 'Fredoka', sans-serif; color: var(--accent-glow); margin-bottom: 12px; }
        .leaderboard-entry { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid var(--primary-light); font-size: 0.9rem; }
        .leaderboard-entry:last-child { border-bottom: none; }
        .leaderboard-rank { font-size: 1.1rem; width: 35px; }
        .leaderboard-name { flex: 1; font-weight: 600; }
        .leaderboard-score { color: var(--accent-glow); font-weight: 700; margin-right: 12px; }
        .leaderboard-time { color: var(--text-muted); font-size: 0.85rem; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: var(--bg-card); border: 2px solid var(--primary-light); border-radius: 50%; width: 45px; height: 45px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 100; font-size: 1.3rem; color: var(--text); }
        .back-btn:hover { border-color: var(--accent); }
        .sound-btn { position: fixed; top: 20px; right: 20px; background: var(--bg-card); border: 2px solid var(--primary-light); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; font-size: 1.3rem; }
        .sound-btn:hover { border-color: var(--accent); }
        .sound-btn.muted { opacity: 0.5; }
        @media (max-width: 600px) { h1 { font-size: 1.8rem; } .sentence { font-size: 1.2rem; } .article-btn, .ending-btn { padding: 10px 15px; font-size: 1rem; min-width: 60px; } }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <button class="back-btn" id="backBtn" onclick="goToMenu()">←</button>
    <button class="sound-btn" id="soundBtn">🔊</button>
    <div class="container">
        <header><h1>🎯 Adjektivdeklination Meister</h1><p class="subtitle">Artikel + Adjektivendung richtig deklinieren!</p></header>
        <div class="screen active" id="startScreen">
            <div class="menu-card">
                <h2 class="mode-title">🎮 Wähle einen Übungsmodus</h2>
                <div class="mode-buttons">
                    <button class="mode-btn definite" onclick="startGame('definite')">📘 Bestimmte Artikel<span class="mode-badge">60 Sätze</span><div class="mode-desc">der/die/das + schwache Adjektivdeklination</div><span class="mode-icon">📚</span></button>
                    <button class="mode-btn indefinite" onclick="startGame('indefinite')">📙 Unbestimmte Artikel<span class="mode-badge">60 Sätze</span><div class="mode-desc">ein/eine + gemischte Adjektivdeklination</div><span class="mode-icon">✨</span></button>
                    <button class="mode-btn possessive" onclick="startGame('possessive')">💜 Possessivpronomen<span class="mode-badge">60 Sätze</span><div class="mode-desc">mein/dein/sein/ihr... + gemischte Deklination</div><span class="mode-icon">👑</span></button>
                    <button class="mode-btn negation" onclick="startGame('negation')">🚫 Negationsartikel<span class="mode-badge">40 Sätze</span><div class="mode-desc">kein/keine + gemischte Deklination</div><span class="mode-icon">❌</span></button>
                    <button class="mode-btn nullartikel" onclick="startGame('nullartikel')">🌿 Nullartikel<span class="mode-badge">40 Sätze</span><div class="mode-desc">Ohne Artikel + starke Adjektivdeklination</div><span class="mode-icon">🔮</span></button>
                    <button class="mode-btn mixed" onclick="startGame('mixed')">🎲 GEMISCHT<span class="mode-badge">260 Sätze</span><div class="mode-desc">Alle Artikeltypen durcheinander</div><span class="mode-icon">🌪️</span></button>
                </div>
            </div>
            <div class="menu-card"><h2 class="mode-title">🏅 Bestenliste</h2><div id="menuLeaderboard"><p style="color:var(--text-muted);text-align:center;">Noch keine Einträge</p></div></div>
        </div>
        <div class="screen" id="gameScreen">
            <div class="game-header">
                <div class="stats-bar">
                    <div class="stat-item"><div class="stat-label">Punkte</div><div class="stat-value" id="points">0</div></div>
                    <div class="stat-item"><div class="stat-label">Serie</div><div class="stat-value" id="streak">0</div></div>
                    <div class="stat-item"><div class="stat-label">Zeit</div><div class="stat-value" id="timer">0:00</div></div>
                </div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">0 / 60 Sätze</div>
            <div class="case-hint" id="caseHint"></div>
            <div class="sentence-card"><div class="sentence" id="sentence"></div></div>
            <div class="buttons-section"><div class="buttons-label">Artikel wählen:</div><div class="article-grid" id="articleGrid"></div></div>
            <div class="buttons-section"><div class="buttons-label">Endung wählen:</div><div class="ending-grid" id="endingGrid"></div></div>
            <div class="control-buttons"><button class="control-btn" onclick="skipSentence()">⏭️ Überspringen</button></div>
        </div>
        <div class="screen" id="resultScreen">
            <div class="result-card">
                <h2 class="result-title">🎉 Geschafft!</h2>
                <div class="result-stats">
                    <div class="result-stat"><div class="result-stat-value" id="finalPoints">0</div><div class="result-stat-label">Punkte</div></div>
                    <div class="result-stat"><div class="result-stat-value" id="finalTime">0:00</div><div class="result-stat-label">Zeit</div></div>
                    <div class="result-stat"><div class="result-stat-value" id="bestStreak">0</div><div class="result-stat-label">Beste Serie</div></div>
                    <div class="result-stat"><div class="result-stat-value" id="accuracy">0%</div><div class="result-stat-label">Genauigkeit</div></div>
                </div>
                <input type="text" class="name-input" id="playerName" placeholder="Dein Name" maxlength="20">
                <button class="control-btn primary" onclick="saveScore()">💾 Speichern</button>
                <div class="leaderboard" id="resultLeaderboard"></div>
                <div style="margin-top:25px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                    <button class="control-btn primary" onclick="playAgain()">🔄 Nochmal</button>
                    <button class="control-btn" onclick="goToMenu()">🏠 Menü</button>
                </div>
            </div>
        </div>
    </div>
<script>

    genitiv: { m: 'es', f: 'er', n: 'es', p: 'er' }
};
const adjEndings = {
    weak: { nominativ: { m: 'e', f: 'e', n: 'e', p: 'en' }, akkusativ: { m: 'en', f: 'e', n: 'e', p: 'en' }, dativ: { m: 'en', f: 'en', n: 'en', p: 'en' }, genitiv: { m: 'en', f: 'en', n: 'en', p: 'en' } },
    mixed: { nominativ: { m: 'er', f: 'e', n: 'es', p: 'en' }, akkusativ: { m: 'en', f: 'e', n: 'es', p: 'en' }, dativ: { m: 'en', f: 'en', n: 'en', p: 'en' }, genitiv: { m: 'en', f: 'en', n: 'en', p: 'en' } },
    strong: { nominativ: { m: 'er', f: 'e', n: 'es', p: 'e' }, akkusativ: { m: 'en', f: 'e', n: 'es', p: 'e' }, dativ: { m: 'em', f: 'er', n: 'em', p: 'en' }, genitiv: { m: 'en', f: 'er', n: 'en', p: 'er' } }
};

function getCorrectArticle(articleType, baseArticle, gender, caseType) {
    if (articleType === 'def') return definiteArticles[caseType][gender];
    if (articleType === 'indef') return indefiniteArticles[caseType][gender];
    if (articleType === 'neg') return negationArticles[caseType][gender];
    if (articleType === 'null') return '—';
    if (articleType === 'poss') {
        const ending = possessiveEndings[caseType][gender];
        if (baseArticle === 'euer' && ending !== '') return 'eur' + ending;
        return baseArticle + ending;
    }
    return '?';
}
function getCorrectEnding(articleType, gender, caseType) {
    if (articleType === 'def') return adjEndings.weak[caseType][gender];
    if (articleType === 'null') return adjEndings.strong[caseType][gender];
    return adjEndings.mixed[caseType][gender];
}
function getArticleOptions(articleType, baseArticle, gender) {
    if (articleType === 'def') {
        return ['der', 'die', 'das', 'den', 'dem', 'des'];
    }
    if (articleType === 'indef') {
        return ['ein', 'eine', 'einen', 'einem', 'einer', 'eines'];
    }
    if (articleType === 'neg') {
        return ['kein', 'keine', 'keinen', 'keinem', 'keiner', 'keines'];
    }
    if (articleType === 'null') {
        return ['—'];
    }
    if (articleType === 'poss') {
        const base = baseArticle === 'euer' ? 'eur' : baseArticle;
        const opts = [baseArticle];
        ['e', 'en', 'em', 'er', 'es'].forEach(e => {
            const form = base + e;
            if (!opts.includes(form)) opts.push(form);
        });
        return opts.sort((a,b) => a.length - b.length);
    }
    return [];
}
function getArticleTypeLabel(articleType, baseArticle) {
    if (articleType === 'def') return { text: 'bestimmt', class: 'definite' };
    if (articleType === 'indef') return { text: 'unbestimmt', class: 'indefinite' };
    if (articleType === 'neg') return { text: 'Negation: KEIN', class: 'negation' };
    if (articleType === 'null') return { text: 'ohne Artikel', class: 'nullartikel' };
    if (articleType === 'poss') return { text: 'Possessiv: ' + baseArticle.toUpperCase(), class: 'possessive' };
    return { text: '', class: '' };
}

let gameState = { mode: null, currentSentence: null, solvedSentences: [], remainingSentences: [], selectedSlot: null, slotType: null, points: 0, streak: 0, bestStreak: 0, startTime: null, timerInterval: null, correctAnswers: 0, totalAttempts: 0, soundEnabled: true, articleCorrect: false, endingCorrect: false };

function playSound(type) {
    if (!gameState.soundEnabled) return;
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'correct') { osc.frequency.value = 523; gain.gain.value = 0.3; osc.start(); setTimeout(() => { osc.frequency.value = 659; setTimeout(() => osc.stop(), 100); }, 100); }
        else if (type === 'wrong') { osc.frequency.value = 200; gain.gain.value = 0.3; osc.start(); setTimeout(() => osc.stop(), 200); }
        else if (type === 'select') { osc.frequency.value = 440; gain.gain.value = 0.1; osc.start(); setTimeout(() => osc.stop(), 50); }
        else if (type === 'milestone') { osc.frequency.value = 523; gain.gain.value = 0.3; osc.start(); setTimeout(() => { osc.frequency.value = 659; setTimeout(() => { osc.frequency.value = 784; setTimeout(() => osc.stop(), 150); }, 150); }, 150); }
    } catch (e) {}
}
function init() { createStars(); updateMenuLeaderboard(); document.getElementById('soundBtn').addEventListener('click', toggleSound); }
function createStars() { const c = document.getElementById('stars'); for (let i = 0; i < 80; i++) { const s = document.createElement('div'); s.className = 'star'; s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'; s.style.width = Math.random() * 3 + 1 + 'px'; s.style.height = s.style.width; s.style.animationDelay = Math.random() * 2 + 's'; c.appendChild(s); } }
function toggleSound() { gameState.soundEnabled = !gameState.soundEnabled; document.getElementById('soundBtn').textContent = gameState.soundEnabled ? '🔊' : '🔇'; document.getElementById('soundBtn').classList.toggle('muted', !gameState.soundEnabled); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function startGame(mode) {
    let pool = [];
    if (mode === 'definite') pool = [...definiteSentences];
    else if (mode === 'indefinite') pool = [...indefiniteSentences];
    else if (mode === 'possessive') pool = [...possessiveSentences];
    else if (mode === 'negation') pool = [...negationSentences];
    else if (mode === 'nullartikel') pool = [...nullartikelSentences];
    else if (mode === 'mixed') pool = [...definiteSentences, ...indefiniteSentences, ...possessiveSentences, ...negationSentences, ...nullartikelSentences];
    gameState = { mode, currentSentence: null, solvedSentences: [], remainingSentences: pool.sort(() => Math.random() - 0.5), selectedSlot: null, slotType: null, points: 0, streak: 0, bestStreak: 0, startTime: Date.now(), timerInterval: null, correctAnswers: 0, totalAttempts: 0, soundEnabled: gameState.soundEnabled, articleCorrect: false, endingCorrect: false };
    showScreen('gameScreen'); document.getElementById('backBtn').style.display = 'flex';
    gameState.timerInterval = setInterval(updateTimer, 1000);
    loadNextSentence(); updateStats(); updateProgress();
}
function updateTimer() { const e = Math.floor((Date.now() - gameState.startTime) / 1000); document.getElementById('timer').textContent = `${Math.floor(e / 60)}:${(e % 60).toString().padStart(2, '0')}`; }
function loadNextSentence() {
    if (gameState.remainingSentences.length === 0) { endGame(); return; }
    gameState.currentSentence = gameState.remainingSentences[0];
    gameState.selectedSlot = null; gameState.slotType = null; gameState.articleCorrect = false; gameState.endingCorrect = false;
    const [before, articleType, baseArticle, adjective, noun, after, gender, caseType] = gameState.currentSentence;
    const correctArticle = getCorrectArticle(articleType, baseArticle, gender, caseType);
    const correctEnding = getCorrectEnding(articleType, gender, caseType);
    const caseNames = { nominativ: 'NOMINATIV (wer/was?)', akkusativ: 'AKKUSATIV (wen/was?)', dativ: 'DATIV (wem?)', genitiv: 'GENITIV (wessen?)' };
    const label = getArticleTypeLabel(articleType, baseArticle);
    document.getElementById('caseHint').innerHTML = `${caseNames[caseType]} <span class="article-label ${label.class}">${label.text}</span>`;
    // Sentence display
    const articleSlotHTML = articleType === 'null' 
        ? `<span class="article-slot correct" style="min-width:40px;">—</span>` 
        : `<span class="article-slot" data-answer="${correctArticle}" onclick="selectSlot(this,'article')">?</span>`;
    document.getElementById('sentence').innerHTML = `${before ? `<span class="word">${before}</span>` : ''}<span class="slot-group">${articleSlotHTML}<span class="adjective-stem">${adjective}</span><span class="ending-slot" data-answer="${correctEnding}" onclick="selectSlot(this,'ending')">?</span></span><span class="word">${noun}</span>${after ? `<span class="word">${after}</span>` : ''}`;
    // Setup buttons - NUR die relevanten Formen!
    const articleOpts = getArticleOptions(articleType, baseArticle, gender);
    const articleGrid = document.getElementById('articleGrid');
    if (articleType === 'null') {
        articleGrid.innerHTML = '<div style="color:var(--text-muted);padding:10px;">Kein Artikel nötig</div>';
        gameState.articleCorrect = true;
    } else {
        articleGrid.innerHTML = articleOpts.map(a => `<button class="article-btn" onclick="selectArticle('${a}')">${a}</button>`).join('');
    }
    document.getElementById('endingGrid').innerHTML = ['-e', '-en', '-er', '-es', '-em'].map(e => `<button class="ending-btn" onclick="selectEnding('${e.slice(1)}')">${e}</button>`).join('');
    // Auto-select first slot
    setTimeout(() => {
        if (articleType === 'null') {
            const endingSlot = document.querySelector('.ending-slot');
            if (endingSlot) selectSlot(endingSlot, 'ending');
        } else {
            const articleSlot = document.querySelector('.article-slot:not(.correct)');
            if (articleSlot) selectSlot(articleSlot, 'article');
        }
    }, 100);
}
function selectSlot(slot, type) {
    if (slot.classList.contains('correct')) return;
    playSound('select');
    document.querySelectorAll('.article-slot, .ending-slot').forEach(s => s.classList.remove('selected'));
    slot.classList.add('selected');
    gameState.selectedSlot = slot;
    gameState.slotType = type;
}
function selectArticle(art) {
    if (gameState.slotType !== 'article' || !gameState.selectedSlot) {
        const slot = document.querySelector('.article-slot:not(.correct)');
        if (slot) { selectSlot(slot, 'article'); selectArticle(art); }
        return;
    }
    const slot = gameState.selectedSlot;
    const correct = slot.dataset.answer;
    gameState.totalAttempts++;
    if (art === correct) {
        playSound('correct'); slot.textContent = art; slot.classList.remove('selected'); slot.classList.add('correct'); gameState.articleCorrect = true;
        const endingSlot = document.querySelector('.ending-slot:not(.correct)');
        if (endingSlot) setTimeout(() => selectSlot(endingSlot, 'ending'), 200);
        checkBothCorrect();
    } else {
        playSound('wrong'); slot.classList.add('wrong'); gameState.streak = 0; updateStats();
        setTimeout(() => slot.classList.remove('wrong'), 500);
    }
}
function selectEnding(end) {
    if (gameState.slotType !== 'ending' || !gameState.selectedSlot) {
        const slot = document.querySelector('.ending-slot:not(.correct)');
        if (slot) { selectSlot(slot, 'ending'); selectEnding(end); }
        return;
    }
    const slot = gameState.selectedSlot;
    const correct = slot.dataset.answer;
    gameState.totalAttempts++;
    if (end === correct) {
        playSound('correct'); slot.textContent = '-' + end; slot.classList.remove('selected'); slot.classList.add('correct'); gameState.endingCorrect = true;
        checkBothCorrect();
    } else {
        playSound('wrong'); slot.classList.add('wrong'); gameState.streak = 0; updateStats();
        setTimeout(() => slot.classList.remove('wrong'), 500);
    }
}
function checkBothCorrect() {
    if (gameState.articleCorrect && gameState.endingCorrect) {
        gameState.streak++; if (gameState.streak > gameState.bestStreak) gameState.bestStreak = gameState.streak; gameState.correctAnswers++;
        let pts = 10; if (gameState.streak >= 3) pts += Math.min(gameState.streak * 2, 20);
        gameState.points += pts;
        const slot = document.querySelector('.ending-slot.correct');
        showPointsPopup(slot, pts, gameState.streak >= 3); updateStats();
        gameState.solvedSentences.push(gameState.remainingSentences.shift()); updateProgress();
        setTimeout(() => { if (gameState.solvedSentences.length % 10 === 0 && gameState.solvedSentences.length > 0) showMilestone(gameState.solvedSentences.length); else loadNextSentence(); }, 600);
    }
}
function showPointsPopup(el, pts, bonus) { const p = document.createElement('div'); p.className = 'points-popup' + (bonus ? ' streak-bonus' : ''); p.textContent = '+' + pts; const r = el.getBoundingClientRect(); p.style.left = r.left + r.width / 2 + 'px'; p.style.top = r.top + 'px'; document.body.appendChild(p); setTimeout(() => p.remove(), 1000); }
function updateStats() { document.getElementById('points').textContent = gameState.points; document.getElementById('streak').innerHTML = gameState.streak + (gameState.streak >= 3 ? ' <span class="streak-fire">🔥</span>' : ''); }
function updateProgress() { const t = gameState.solvedSentences.length + gameState.remainingSentences.length; document.getElementById('progressFill').style.width = (gameState.solvedSentences.length / t * 100) + '%'; document.getElementById('progressText').textContent = `${gameState.solvedSentences.length} / ${t} Sätze`; }
function skipSentence() { gameState.remainingSentences.push(gameState.remainingSentences.shift()); gameState.streak = 0; updateStats(); loadNextSentence(); }
function showMilestone(c) { playSound('milestone'); createConfetti(); const o = document.createElement('div'); o.className = 'milestone-overlay'; o.innerHTML = `<div class="milestone-content"><div class="milestone-number">${c}</div><div class="milestone-text">Sätze geschafft! 🎉</div></div>`; document.body.appendChild(o); setTimeout(() => { o.remove(); loadNextSentence(); }, 2500); }
function createConfetti() { const cols = ['#4a9eff', '#9c27b0', '#f5c842', '#4ecdc4', '#ff6b6b', '#38a169']; for (let i = 0; i < 80; i++) { const c = document.createElement('div'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px'; c.style.background = cols[Math.floor(Math.random() * cols.length)]; c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0'; c.style.width = (Math.random() * 10 + 5) + 'px'; c.style.height = c.style.width; document.body.appendChild(c); const a = c.animate([{ transform: 'translateY(0) rotate(0deg)', opacity: 1 }, { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }], { duration: Math.random() * 2000 + 2000 }); a.onfinish = () => c.remove(); } }
function endGame() { clearInterval(gameState.timerInterval); const e = Math.floor((Date.now() - gameState.startTime) / 1000); document.getElementById('finalPoints').textContent = gameState.points; document.getElementById('finalTime').textContent = `${Math.floor(e / 60)}:${(e % 60).toString().padStart(2, '0')}`; document.getElementById('bestStreak').textContent = gameState.bestStreak; const acc = gameState.totalAttempts > 0 ? Math.round((gameState.correctAnswers * 2 / gameState.totalAttempts) * 100) : 0; document.getElementById('accuracy').textContent = Math.min(acc, 100) + '%'; showScreen('resultScreen'); document.getElementById('backBtn').style.display = 'none'; updateResultLeaderboard(); playSound('milestone'); createConfetti(); }
function loadLeaderboard() { const s = localStorage.getItem('adjDeklinationMeisterV2'); return s ? JSON.parse(s) : []; }
function saveLeaderboard(l) { localStorage.setItem('adjDeklinationMeisterV2', JSON.stringify(l)); }
function saveScore() { const n = document.getElementById('playerName').value.trim() || 'Anonym'; const e = Math.floor((Date.now() - gameState.startTime) / 1000); const modes = { definite: 'Bestimmt', indefinite: 'Unbestimmt', possessive: 'Possessiv', negation: 'Negation', nullartikel: 'Nullartikel', mixed: 'Gemischt' }; const entry = { name: n, points: gameState.points, time: e, mode: modes[gameState.mode], date: new Date().toLocaleDateString('de-DE') }; const l = loadLeaderboard(); l.push(entry); l.sort((a, b) => b.points - a.points); saveLeaderboard(l.slice(0, 10)); updateResultLeaderboard(); updateMenuLeaderboard(); document.getElementById('playerName').disabled = true; event.target.disabled = true; event.target.textContent = '✓ Gespeichert!'; }
function formatTime(s) { return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`; }
function updateMenuLeaderboard() { const c = document.getElementById('menuLeaderboard'); const l = loadLeaderboard(); if (l.length === 0) { c.innerHTML = '<p style="color:var(--text-muted);text-align:center;">Noch keine Einträge</p>'; return; } c.innerHTML = l.slice(0, 5).map((e, i) => `<div class="leaderboard-entry"><span class="leaderboard-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.'}</span><span class="leaderboard-name">${e.name}</span><span class="leaderboard-score">${e.points} Pkt</span><span class="leaderboard-time">${formatTime(e.time)}</span></div>`).join(''); }
function updateResultLeaderboard() { const c = document.getElementById('resultLeaderboard'); const l = loadLeaderboard(); c.innerHTML = `<h3 class="leaderboard-title">🏅 Bestenliste</h3>${l.slice(0, 5).map((e, i) => `<div class="leaderboard-entry"><span class="leaderboard-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.'}</span><span class="leaderboard-name">${e.name}</span><span class="leaderboard-score">${e.points} Pkt</span><span class="leaderboard-time">${formatTime(e.time)}</span></div>`).join('')}`; }
function playAgain() { document.getElementById('playerName').disabled = false; document.getElementById('playerName').value = ''; const b = document.querySelector('#resultScreen .control-btn.primary'); if (b) { b.disabled = false; b.textContent = '💾 Speichern'; } startGame(gameState.mode); }
function goToMenu() { clearInterval(gameState.timerInterval); document.getElementById('backBtn').style.display = 'none'; document.getElementById('playerName').disabled = false; document.getElementById('playerName').value = ''; const b = document.querySelector('#resultScreen .control-btn.primary'); if (b) { b.disabled = false; b.textContent = '💾 Speichern'; } showScreen('startScreen'); updateMenuLeaderboard(); }
document.addEventListener('DOMContentLoaded', init);
</script>
