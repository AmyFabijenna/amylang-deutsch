        function searchVerbs() {
            const input = document.getElementById('searchBox').value.toLowerCase();
            const table = document.getElementById('verbsTable');
            const rows = table.getElementsByTagName('tr');
            
            for (let i = 1; i < rows.length; i++) {
                const firstCell = rows[i].getElementsByTagName('td')[0];
                if (firstCell) {
                    const txtValue = firstCell.textContent || firstCell.innerText;
                    if (txtValue.toLowerCase().indexOf(input) > -1) {
                        rows[i].style.display = '';
                    } else {
                        rows[i].style.display = 'none';
                    }
                }
            }
        }
        
        function showTab(tabName) {
            const contents = document.getElementsByClassName('content');
            const tabs = document.getElementsByClassName('tab');
            
            for (let i = 0; i < contents.length; i++) {
                contents[i].classList.remove('active');
            }
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'exercises') {
                startExercise();
            }
        }

            event.target.classList.add('active');
            score = 0;
            totalQuestions = 0;
            updateScore();
            startExercise();
        }

            } else if (currentExerciseType === 'flashcards') {

        function updateScore() {

        function generateMultipleChoice() {
            const availableVerbs = getVerbsForDifficulty();
            const verb = availableVerbs[Math.floor(Math.random() * availableVerbs.length)];
            
            const forms = ['pres', 'presPast', 'perf'];
            const formNames = ['Präsens', 'Präteritum', 'Perfekt'];
            const randomForm = Math.floor(Math.random() * forms.length);
            const formKey = forms[randomForm];
            const formName = formNames[randomForm];
            
            const correctAnswer = verb[formKey];
            const wrongAnswers = [];
            
            while (wrongAnswers.length < 3) {
                const randomVerb = availableVerbs[Math.floor(Math.random() * availableVerbs.length)];
                const wrongAnswer = randomVerb[formKey];
                if (wrongAnswer !== correctAnswer && !wrongAnswers.includes(wrongAnswer)) {
                    wrongAnswers.push(wrongAnswer);
                }
            }
            
            const allAnswers = [correctAnswer, ...wrongAnswers].sort(() => Math.random() - 0.5);
            
            currentQuestion = {
                verb: verb,
                correctAnswer: correctAnswer,
                formKey: formKey
            };
            
            const content = document.getElementById('exerciseContent');
            content.innerHTML = `
                <div class="question-card">
                    <div class="question-text">
                        Wie lautet das <strong>${formName}</strong> von "<strong>${verb.de}</strong>"?<br>
                        <small style="opacity: 0.8;">(${verb.en} / ${verb.hu})</small>
                    </div>
                    <div class="answer-options">
                        ${allAnswers.map(answer => `
                            <button class="answer-btn" onclick="checkMultipleChoice('${answer.replace(/'/g, "\\'")}')">
                                ${answer}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback"></div>
                </div>
            `;
        }

        function checkMultipleChoice(answer) {
            totalQuestions++;
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.answer-btn');
            
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent.trim() === currentQuestion.correctAnswer) {
                    btn.classList.add('correct');
                }
                if (btn.textContent.trim() === answer && answer !== currentQuestion.correctAnswer) {
                    btn.classList.add('incorrect');
                }
            });
            
            if (answer === currentQuestion.correctAnswer) {
                score++;
                feedback.innerHTML = '<div class="feedback correct">✓ Richtig! Sehr gut!</div>';
            } else {
                feedback.innerHTML = `<div class="feedback incorrect">✗ Falsch. Die richtige Antwort ist: <strong>${currentQuestion.correctAnswer}</strong></div>`;
            }
            
            updateScore();
            
            setTimeout(() => {
                generateMultipleChoice();
            }, 2000);
        }

                {key: 'pres', name: 'Präsens', lang: 'de'},
                {key: 'presPast', name: 'Präteritum', lang: 'de'},
                {key: 'perf', name: 'Perfekt', lang: 'de'},
                {key: 'presEn', name: 'Present', lang: 'en'},
                {key: 'pastEn', name: 'Past', lang: 'en'},
                {key: 'perfEn', name: 'Perfect', lang: 'en'},
                {key: 'presHu', name: 'Jelen', lang: 'hu'},
                {key: 'pastHu', name: 'Múlt', lang: 'hu'},
                {key: 'perfHu', name: 'Befejezett', lang: 'hu'}
            ];
            
            const randomForm = forms[Math.floor(Math.random() * forms.length)];
            const correctAnswer = verb[randomForm.key];
            
            currentQuestion = {
                verb: verb,
                correctAnswer: correctAnswer.toLowerCase().trim(),
                formKey: randomForm.key
            };
            
            const langNames = {de: 'Deutsch', en: 'English', hu: 'Magyar'};
            
            const content = document.getElementById('exerciseContent');
            content.innerHTML = `
                <div class="question-card">
                    <div class="question-text">
                        Ergänze das <strong>${randomForm.name}</strong> (${langNames[randomForm.lang]}) von:<br>
                        <strong>${verb.de}</strong> (${verb.en} / ${verb.hu})
                    </div>
                    <input type="text" class="input-answer" id="fillBlankInput" placeholder="Deine Antwort..." onkeypress="if(event.key==='Enter') checkFillBlank()">
                    <button class="btn" onclick="checkFillBlank()">Überprüfen</button>
                    <div id="feedback"></div>
                </div>
            `;
            
            document.getElementById('fillBlankInput').focus();
        }

        function checkFillBlank() {
            const userAnswer = document.getElementById('fillBlankInput').value.toLowerCase().trim();
            const feedback = document.getElementById('feedback');
            totalQuestions++;
            
            const correctAnswers = currentQuestion.correctAnswer.split('/').map(a => a.trim().toLowerCase());
            
            if (correctAnswers.some(ans => userAnswer === ans)) {
                score++;
                feedback.innerHTML = '<div class="feedback correct">✓ Richtig! Ausgezeichnet!</div>';
            } else {
                feedback.innerHTML = `<div class="feedback incorrect">✗ Falsch. Die richtige Antwort ist: <strong>${currentQuestion.verb[currentQuestion.formKey]}</strong></div>`;
            }
            
            updateScore();
            
            setTimeout(() => {
                generateFillBlank();
            }, 2500);
        }
        
        function generateMatching() {
            const availableVerbs = getVerbsForDifficulty();
            const selectedVerbs = [];
            
            const numPairs = Math.min(5, availableVerbs.length);
            
            while (selectedVerbs.length < numPairs) {
                const verb = availableVerbs[Math.floor(Math.random() * availableVerbs.length)];
                if (!selectedVerbs.includes(verb)) {
                    selectedVerbs.push(verb);
                }
            }
            
            const leftSide = selectedVerbs.map(v => ({text: v.de, id: v.de}));
            const rightSide = selectedVerbs.map(v => ({text: v.perf, id: v.de})).sort(() => Math.random() - 0.5);
            
            let selectedLeft = null;
            let matches = [];
            
            const content = document.getElementById('exerciseContent');
            content.innerHTML = `
                <div class="question-card">
                    <div class="question-text">
                        Ordne die Infinitive den richtigen Perfekt-Formen zu:
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                        <div id="leftColumn"></div>
                        <div id="rightColumn"></div>
                    </div>
                    <div id="feedback" style="margin-top: 20px;"></div>
                    <button class="btn" onclick="checkMatching()" style="margin-top: 20px;">Überprüfen</button>
                </div>
            `;
            
            const leftCol = document.getElementById('leftColumn');
            const rightCol = document.getElementById('rightColumn');
            
            leftSide.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = item.text;
                btn.onclick = () => selectLeft(item.id, btn);
                btn.dataset.id = item.id;
                leftCol.appendChild(btn);
            });
            
            rightSide.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = item.text;
                btn.onclick = () => selectRight(item.id, btn);
                btn.dataset.id = item.id;
                rightCol.appendChild(btn);
            });
            
            window.matchingData = {
                matches: [],
                selectedLeft: null,
                selectedLeftBtn: null,
                selectedVerbs: selectedVerbs
            };
        }

        function selectLeft(id, btn) {
            if (window.matchingData.selectedLeftBtn) {
                window.matchingData.selectedLeftBtn.style.background = 'rgba(255, 255, 255, 0.1)';
            }
            window.matchingData.selectedLeft = id;
            window.matchingData.selectedLeftBtn = btn;
            btn.style.background = 'rgba(255, 215, 0, 0.4)';
        }
        
        function selectRight(id, btn) {
            if (!window.matchingData.selectedLeft) {
                return;
            }
            
            const existingMatch = window.matchingData.matches.find(m => 
                m.left === window.matchingData.selectedLeft || m.right === id
            );
            
            if (existingMatch) {
                return;
            }
            
            window.matchingData.matches.push({
                left: window.matchingData.selectedLeft,
                right: id
            });
            
            window.matchingData.selectedLeftBtn.style.background = 'rgba(0, 255, 0, 0.2)';
            btn.style.background = 'rgba(0, 255, 0, 0.2)';
            window.matchingData.selectedLeftBtn.disabled = true;
            btn.disabled = true;
            
            window.matchingData.selectedLeft = null;
            window.matchingData.selectedLeftBtn = null;
        }
        
        function checkMatching() {
            const data = window.matchingData;
            
            if (data.matches.length !== data.selectedVerbs.length) {
                document.getElementById('feedback').innerHTML = 
                    '<div class="feedback incorrect">Bitte ordne alle Paare zu!</div>';
                return;
            }
            
            let correct = 0;
            data.matches.forEach(match => {
                if (match.left === match.right) {
                    correct++;
                }
            });
            
            totalQuestions++;
            const feedback = document.getElementById('feedback');
            
            if (correct === data.selectedVerbs.length) {
                score++;
                feedback.innerHTML = '<div class="feedback correct">✓ Perfekt! Alle Zuordnungen sind richtig!</div>';
            } else {
                feedback.innerHTML = `<div class="feedback incorrect">✗ ${correct} von ${data.selectedVerbs.length} richtig. Versuche es nochmal!</div>`;
            }
            
            updateScore();
            
            setTimeout(() => {
                generateMatching();
            }, 3000);
        }

        function generateFlashcards() {
            const availableVerbs = getVerbsForDifficulty();
            currentFlashcardIndex = 0;
            showingAnswer = false;
            
            window.flashcardVerbs = availableVerbs.sort(() => Math.random() - 0.5);
            
            showFlashcard();
        }
        
        function showFlashcard() {
            const verbs = window.flashcardVerbs;
            
            if (currentFlashcardIndex >= verbs.length) {
                currentFlashcardIndex = 0;
            }
            
            const verb = verbs[currentFlashcardIndex];
            const content = document.getElementById('exerciseContent');
            
            if (!showingAnswer) {
                content.innerHTML = `
                    <div class="question-card">
                        <div class="question-text" style="margin-bottom: 30px;">
                            Karteikarte ${currentFlashcardIndex + 1} von ${verbs.length}
                        </div>
                        <div class="flashcard" onclick="flipFlashcard()">
                            <div class="flashcard-content">
                                ${verb.de}
                            </div>
                            <div class="flashcard-hint">
                                ${verb.en} / ${verb.hu}<br><br>
                                🔄 Klicken zum Umdrehen
                            </div>
                        </div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="question-card">
                        <div class="question-text" style="margin-bottom: 30px;">
                            Karteikarte ${currentFlashcardIndex + 1} von ${verbs.length}
                        </div>
                        <div class="flashcard" onclick="flipFlashcard()">
                            <div class="flashcard-content" style="font-size: 1.2em;">
                                <strong>Präsens:</strong> ${verb.pres} (${verb.presEn} / ${verb.presHu})<br><br>
                                <strong>Präteritum:</strong> ${verb.presPast} (${verb.pastEn} / ${verb.pastHu})<br><br>
                                <strong>Perfekt:</strong> ${verb.perf} (${verb.perfEn} / ${verb.perfHu})
                            </div>
                            <div class="flashcard-hint">
                                🔄 Klicken zum Umdrehen
                            </div>
                        </div>
                        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                            <button class="btn" onclick="prevFlashcard()">← Vorherige</button>
                            <button class="btn" onclick="nextFlashcard()">Nächste →</button>
                        </div>
                    </div>
                `;
            }
        }
        
        function flipFlashcard() {
            showingAnswer = !showingAnswer;
            showFlashcard();
        }
        
        function nextFlashcard() {
            currentFlashcardIndex++;
            if (currentFlashcardIndex >= window.flashcardVerbs.length) {
                currentFlashcardIndex = 0;
            }
            showingAnswer = false;
            showFlashcard();
        }
        
        function prevFlashcard() {
            currentFlashcardIndex--;
            if (currentFlashcardIndex < 0) {
                currentFlashcardIndex = window.flashcardVerbs.length - 1;
            }
            showingAnswer = false;
            showFlashcard();
        }

        // Initialisierung
        window.onload = function() {
            initTable();
            startExercise();
        };
    </script>
</body>
</html>
