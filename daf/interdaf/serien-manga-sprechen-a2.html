.count{color:var(--soft);font-size:15px}
.flip{perspective:1000px;height:250px;cursor:pointer;margin:10px 0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}

@media(max-width:600px){header h1{font-size:26px;padding-right:0}.pts{position:static;display:inline-block;margin-bottom:8px}.card{padding:18px 16px}}
</style>
</head>

const ptsEl=document.getElementById("pts"); const showP=()=>ptsEl.textContent="✦ "+PTS+" Punkte"; showP();
function addP(n=1){PTS+=n;try{localStorage.setItem("serienA2pts",PTS)}catch(e){};showP()}
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const back=`<button class="back" onclick="home()">← Zur Übersicht</button>`;
const esc=s=>s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const MODES=[
["Wörter",[["🃏","Wortkarten","Die wichtigsten Wörter: Karte antippen, Erklärung und Beispiel lesen.","Schritt 1","cards"],
["❓","Was ist das?","Lies die Erklärung und finde das passende Wort.","Schritt 2","what"],
["🧩","Wort-Detektiv","Lange Wörter zerlegen und die Bedeutung selbst finden.","Schritt 3","komp"]]],
["Geschichten",[["📺","Zwei Serien und ein Manga","Kurze Texte, die wichtigsten Figuren, Wörter und Fragen zum Sprechen.","Schritt 4","films"],
["🔍","Welche Geschichte ist das?","Lies den Hinweis: Serie oder Manga – welche Geschichte ist es?","Schritt 5","fw"]]],
["Sätze",[["📖","Lückentexte","Kurze Texte über Serien und Manga: Welches Wort passt?","Schritt 6","gaps"],
["🔎","Sätze verstehen","Was bedeutet der Satz? Mit Tipps zur Grammatik.","Schritt 7","sv"],
["🧱","Sätze bauen","Wörter in die richtige Reihenfolge bringen.","Schritt 8","sb"]]],
["Sprechen",[["💬","So sprichst du darüber","Satzanfänge zum Vorstellen, Beschreiben, Erzählen und für deine Meinung.","Schritt 9","rm"],
["🎲","Sprechspiele","Würfel, Duell, Wer bin ich?, Tabu und große Fragen.","Schritt 10","games"],
["🏁","Abschluss-Mission","Alles gemischt – zeig, was du kannst!","Finale","final"]]]
];
function home(){
 app.innerHTML=MODES.map(g=>`<div class="sec-h">${g[0]}</div><div class="grid">${g[1].map(m=>`<button class="mode" onclick="go('${m[4]}')"><div class="ic">${m[0]}</div><h3>${m[1]}</h3><p>${m[2]}</p><span class="tag">${m[3]}</span></button>`).join("")}</div>`).join("");scrollTo(0,0)}
const NEXT={what:"komp",komp:"films",fw:"gaps",sv:"sb",sb:"rm"};
function done(s,t,m){const p=t?s/t:0;
 app.innerHTML=`<div class="card center">${back}<div class="big">${p>=.9?"🌟":p>=.7?"📺":"💪"}</div><h2>${p>=.9?"Hervorragend!":p>=.7?"Sehr gut!":"Gut gemacht – üb ruhig noch einmal!"}</h2><p>${s} von ${t} richtig.</p>
 <div class="row" style="justify-content:center"><button class="btn sec" onclick="go('${m}')">Nochmal</button>${NEXT[m]?`<button class="btn gold" onclick="go('${NEXT[m]}')">Weiter zum nächsten Schritt →</button>`:""}</div></div>`}

/* ---- Wortkarten ---- */
let cg="Alle",ci=0,cl=W;
function cards(){cl=W.filter(w=>cg==="Alle"||w[2]===cg);if(ci>=cl.length)ci=0;
 const w=cl[ci];
 app.innerHTML=`<div class="card">${back}<h2>🃏 Wortkarten</h2><div class="chips">${GROUPS.map((g,k)=>`<button class="chip ${g===cg?"sel":""}" onclick="cg=GROUPS[${k}];ci=0;cards()">${g}</button>`).join("")}</div>
 <div class="flip" id="fl" onclick="this.classList.toggle('on')"><div class="in"><div class="face front"><div class="w">${w[0]}</div><div class="pl">${w[1]}</div><div class="pl" style="margin-top:18px;font-size:14px">antippen zum Umdrehen</div></div>
 <div class="face backf"><div class="d">${w[3]}</div><div class="s">${w[4]}</div></div></div></div>
 <div class="row"><button class="btn sec" onclick="ci=(ci-1+cl.length)%cl.length;cards()">← Zurück</button><span class="count">${ci+1} / ${cl.length}</span><button class="btn" onclick="ci=(ci+1)%cl.length;cards()">Weiter →</button></div></div>`}

/* ---- Multiple Choice ---- */
let mc;
function runMC(title,items,mode){mc={title,items,mode,i:0,s:0};drawMC()}
function drawMC(){
 if(mc.i>=mc.items.length)return done(mc.s,mc.items.length,mc.mode);
 const it=mc.items[mc.i]; const ord=shuffle(it.o.map((t,k)=>({t,k})));
 app.innerHTML=`<div class="card">${back}<h2>${mc.title}</h2><div class="bar"><i style="width:${mc.i/mc.items.length*100}%"></i></div>
 ${it.pre||""}${it.tip?`<button class="hintbtn" id="hb">💡 Tipp anzeigen</button>`:""}
 <div class="q">${it.q}</div><div class="opts">${ord.map(o=>`<button class="opt" data-k="${o.k}" onclick="pickMC(this)">${o.t}</button>`).join("")}</div><div id="fb"></div>
 <div class="row"><span class="count">${mc.i+1} / ${mc.items.length}</span><button class="btn" id="nx" disabled onclick="mc.i++;drawMC()">Weiter →</button></div></div>`;
 if(it.tip)document.getElementById("hb").onclick=function(){this.outerHTML=`<div class="hint">💡 ${it.tip}</div>`}}
function pickMC(el){const it=mc.items[mc.i];const r=el.dataset.k==="0";
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.k==="0")b.classList.add("ok")});
 if(r){mc.s++;addP()}else el.classList.add("bad");
 document.getElementById("fb").innerHTML=`<div class="ex ${r?"":"badx"}">${r?"✔ Richtig! ":"✘ Nicht ganz. Richtig ist: <b>"+it.o[0]+"</b>. "}${it.ex}</div>`;
 document.getElementById("nx").disabled=false}

/* ---- Was ist das? ---- */
function whatItems(n){
 return shuffle(W).slice(0,n).map(w=>{
  const same=shuffle(W.filter(x=>x!==w&&x[2]===w[2]));
  return {q:`„${w[3]}“ – welches Wort ist das?`,o:[w[0],...same.slice(0,3).map(x=>x[0])],ex:`Beispiel: <i>${w[4]}</i>`};
 })}
function what(){runMC("❓ Was ist das?",whatItems(15),"what")}

/* ---- Wort-Detektiv ---- */
const kompItems=()=>shuffle(KOMP).map(k=>({pre:`<div class="split"><span class="a">${k[0]}</span>+<span class="b">${k[1]}</span></div><p class="center count">Tipp: Das <b>letzte</b> Wort sagt dir, <b>was</b> es ist.</p>`,q:k[2],o:k[3],ex:k[4]}));
function komp(){runMC("🧩 Wort-Detektiv",kompItems(),"komp")}

/* ---- Welche Geschichte? ---- */
const ft=id=>F.find(f=>f.id===id).t;
const fwItems=()=>shuffle(FW).map(h=>({pre:`<div class="quote">${h[0]}</div>`,q:"Welche Geschichte ist das?",o:[ft(h[1]),...F.filter(f=>f.id!==h[1]).map(f=>f.t)],ex:h[2]}));
function fw(){runMC("🔍 Welche Geschichte ist das?",fwItems(),"fw")}

/* ---- Sätze verstehen ---- */
const svItems=()=>shuffle(SV).map(s=>({pre:`<div class="quote">${s[0]}</div>`,q:s[1],o:s[2],ex:s[3],tip:s[4]}));
function sv(){runMC("🔎 Sätze verstehen",svItems(),"sv")}

/* ---- Zwei Serien und ein Manga ---- */
let fi=0;
function films(){const f=F[fi];
 const txt=f.x.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,(m,a,b)=>`<button class="gl" data-e="${esc(b)}" data-w="${esc(a)}" onclick="gl(this)">${a}</button>`);
 app.innerHTML=`<div class="card">${back}<h2>📺 Zwei Serien und ein Manga</h2>
 <div class="chips">${F.map((x,i)=>`<button class="chip ${i===fi?"sel":""}" onclick="fi=${i};films()">${x.ic} ${x.t}</button>`).join("")}</div>
 <div class="film"><h2>${f.ic} ${f.t}</h2><div class="gen">${f.g}</div></div>
 <h4>📖 Worum geht es?</h4><p class="count">Tipp: Die <span class="gl" style="cursor:default">markierten Wörter</span> kannst du antippen.</p>
 <div class="txt">${txt}</div><div id="glb"></div>
 <h4>👥 Wer ist wer?</h4><div class="fig">${f.y.map(p=>`<div><b>${p[0]}</b>${p[1]}</div>`).join("")}</div>
 <h4>✅ Richtig oder falsch?</h4>${f.rf.map((r,j)=>`<div class="rf"><div>${r[0]}</div><div class="opts row"><button class="opt" onclick="rf(this,${j},1)">richtig</button><button class="opt" onclick="rf(this,${j},0)">falsch</button></div><div id="rf${j}"></div></div>`).join("")}
 <h4>🗂️ Wichtige Wörter</h4><div class="wl">${f.w.map(w=>`<div><b>${w[0]}</b><span>${w[1]}</span></div>`).join("")}</div>
 <h4>💬 Fragen zum Sprechen</h4><ul class="ql">${f.q.map(q=>`<li><div class="qq">${q[0]}</div><button class="help" onclick="this.outerHTML='<div class=hb>'+this.dataset.h+'</div>'" data-h="${esc(q[1])}">✏️ Satzhilfe</button></li>`).join("")}</ul>
 <div class="row"><button class="btn sec" onclick="fi=(fi+F.length-1)%F.length;films()">← Zurück</button><span class="count">${fi+1} / ${F.length}</span><button class="btn" onclick="fi=(fi+1)%F.length;films()">Weiter →</button></div></div>`;scrollTo(0,0)}
function gl(b){document.getElementById("glb").innerHTML=`<div class="hint">💡 <b>${b.dataset.w}</b>: ${b.dataset.e}</div>`}
function rf(el,j,v){const r=F[fi].rf[j];const ok=r[1]===v;const box=el.parentNode;
 box.querySelectorAll(".opt").forEach(b=>b.disabled=true);
 const right=box.querySelectorAll(".opt")[r[1]?0:1];right.classList.add("ok");if(!ok)el.classList.add("bad");else addP();
 document.getElementById("rf"+j).innerHTML=`<div class="ex ${ok?"":"badx"}">${ok?"✔ Richtig! ":"✘ Nicht ganz. "}${r[2]}</div>`}

/* ---- Lückentexte ---- */
let lt;
function gaps(){app.innerHTML=`<div class="card">${back}<h2>📖 Lückentexte</h2><p>Wähle einen Text. Die Lücken kommen der Reihe nach.</p>
 <div class="grid">${LT.map((s,i)=>`<button class="mode" onclick="startLT(${i})"><h3>${s.t}</h3><p>${(s.x.match(/\{/g)||[]).length} Lücken</p></button>`).join("")}</div></div>`}
function startLT(i){const s=LT[i];const gp=[];let k=0;
 const html=s.x.replace(/\{([^}]+)\}/g,(m,c)=>{const o=c.split("|");gp.push({o,ex:s.ex[k]});return `<span class="gap" id="g${k++}">( ${k} )</span>`});
 lt={i,gp,cur:0,s:0};
 app.innerHTML=`<div class="card">${back}<h2>${s.t}</h2><div class="bar"><i id="ltbar"></i></div><div class="story">${html}</div><div id="ltq" style="margin-top:14px"></div>
 <div class="row"><span class="count" id="ltc"></span><button class="btn" id="nx" disabled onclick="nextLT()">Weiter →</button></div></div>`;showLT()}
function showLT(){const g=lt.gp[lt.cur];document.querySelectorAll(".gap").forEach(x=>x.classList.remove("cur"));document.getElementById("g"+lt.cur).classList.add("cur");
 document.getElementById("ltbar").style.width=lt.cur/lt.gp.length*100+"%";document.getElementById("ltc").textContent=`Lücke ${lt.cur+1} / ${lt.gp.length}`;
 document.getElementById("ltq").innerHTML=`<div class="opts row">${shuffle(g.o.map((t,k)=>({t,k}))).map(o=>`<button class="opt" data-k="${o.k}" onclick="pickLT(this)">${o.t}</button>`).join("")}</div><div id="fb"></div>`;
 document.getElementById("nx").disabled=true}
function pickLT(el){const g=lt.gp[lt.cur];const r=el.dataset.k==="0";
 document.querySelectorAll("#ltq .opt").forEach(b=>{b.disabled=true;if(b.dataset.k==="0")b.classList.add("ok")});
 if(r){lt.s++;addP()}else el.classList.add("bad");
 const gEl=document.getElementById("g"+lt.cur);gEl.textContent=g.o[0];gEl.classList.remove("cur");gEl.classList.add(r?"done":"wrong");
 document.getElementById("fb").innerHTML=`<div class="ex ${r?"":"badx"}">${r?"✔ Richtig! ":"✘ Hier passt <b>"+g.o[0]+"</b>. "}${g.ex}</div>`;
 document.getElementById("nx").disabled=false}
function nextLT(){lt.cur++;if(lt.cur>=lt.gp.length){app.innerHTML=`<div class="card center">${back}<div class="big">📖</div><h2>Text fertig!</h2><p>${lt.s} von ${lt.gp.length} Lücken richtig.</p>
 <div class="row" style="justify-content:center"><button class="btn sec" onclick="startLT(${lt.i})">Nochmal</button>${lt.i<LT.length-1?`<button class="btn gold" onclick="startLT(${lt.i+1})">Nächster Text →</button>`:`<button class="btn gold" onclick="go('sv')">Weiter: Sätze verstehen →</button>`}</div></div>`;return}showLT()}

/* ---- Sätze bauen ---- */
let sb;
function sbStart(){sb={list:shuffle(SB),i:0,s:0};drawSB()}
function drawSB(){if(sb.i>=sb.list.length)return done(sb.s,sb.list.length,"sb");
 const it=sb.list[sb.i];sb.cur={it,placed:[],pool:shuffle(it[1].map((t,k)=>({t,k}))),checked:false};renderSB()}
function renderSB(){const c=sb.cur,it=c.it;
 app.innerHTML=`<div class="card">${back}<h2>🧱 Sätze bauen</h2><div class="bar"><i style="width:${sb.i/sb.list.length*100}%"></i></div>
 <p>Tippe die Bausteine in der richtigen Reihenfolge an. Antippen im Satz = Baustein wieder entfernen.</p>
 <div class="build"><span class="fixed">${it[0]}</span>${c.placed.map((p,j)=>`<button class="placed" ${c.checked?"disabled":""} onclick="unplace(${j})">${p.t}</button>`).join("")}<span class="fixed">${it[2]}</span></div>
 <div class="chips">${c.pool.map((p,j)=>`<button class="word ${c.placed.includes(p)?"used":""}" ${c.placed.includes(p)||c.checked?"disabled":""} onclick="place(${j})">${p.t}</button>`).join("")}</div>
 <div id="fb"></div><div class="row"><span class="count">${sb.i+1} / ${sb.list.length}</span>
 ${c.checked?`<button class="btn" onclick="sb.i++;drawSB()">Weiter →</button>`:`<button class="btn" ${c.placed.length<it[1].length?"disabled":""} onclick="checkSB()">Prüfen ✓</button>`}</div></div>`;
 if(c.checked)document.getElementById("fb").innerHTML=c.fb}
function place(j){sb.cur.placed.push(sb.cur.pool[j]);renderSB()}
function unplace(j){sb.cur.placed.splice(j,1);renderSB()}
function checkSB(){const c=sb.cur,it=c.it;const ans=c.placed.map(p=>p.t).join(" ");const r=it[3].includes(ans);
 if(r){sb.s++;addP()}c.checked=true;
 c.fb=`<div class="ex ${r?"":"badx"}">${r?"✔ Perfekt gebaut! ":`✘ Noch nicht ganz. Richtig: <b>${it[0]} ${it[3][0]}${it[2]}</b> `}${it[4]}${it[3].length>1?`<br><span class="count">Auch richtig: ${it[0]} ${it[3][1]}${it[2]}</span>`:""}</div>`;renderSB()}

/* ---- Redemittel ---- */
function rm(){app.innerHTML=`<div class="card">${back}<h2>💬 So sprichst du über Serien und Manga</h2>
 ${RM.map(r=>`<div class="rm"><h3>${r[0]}</h3><ul>${r[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
 <div class="row"><span></span><button class="btn gold" onclick="go('games')">Weiter: Sprechspiele →</button></div></div>`}

/* ---- Sprechspiele ---- */
let gm="wuerfel";
const GM=[["wuerfel","🎲 Würfel"],["duell","⚔️ Duell"],["wer","🎭 Wer bin ich?"],["tabu","🚫 Tabu"],["big","💭 Große Fragen"]];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ALLFIG=F.flatMap(f=>f.y.map(p=>[p[0],f.t,f.ic]));
function games(){let inner="",info="";
 if(gm==="wuerfel"){const f=pick(F);info="Würfle eine Geschichte und eine Aufgabe. Antworte in ganzen Sätzen.";
  inner=`<div class="gs">${f.ic}</div><div class="gt">${f.t}</div><div class="gs">${pick(TASKS)}</div>`}
 if(gm==="duell"){const [a,b]=shuffle(F);const qs=shuffle(DUELL).slice(0,3);info="Zwei Geschichten treten gegeneinander an. Vergleiche: <i>… ist spannender als …</i> · <i>… ist nicht so traurig wie …</i>";
  inner=`<div class="gt">${a.ic} ${a.t}</div><div class="vs">gegen</div><div class="gt">${b.ic} ${b.t}</div><div class="gs" style="margin-top:12px">${qs.join("<br>")}<br><b>Und: Wer gewinnt?</b></div>`}
 if(gm==="wer"){const p=pick(ALLFIG);info="Beschreib diese Figur. Sag nicht den Namen! Dein Gegenüber rät: Wer ist das? Hilfe: <i>Sie / Er ist … · Sie / Er kann … · Sie / Er möchte …</i>";
  inner=`<div class="gs">${p[2]} ${p[1]}</div><div class="gt">${p[0]}</div>`}
 if(gm==="tabu"){const t=pick(TABU);info="Erkläre das Wort. Die durchgestrichenen Wörter darfst du nicht sagen!";
  inner=`<div class="gt">${t[0]}</div><div>${t[1].map(x=>`<span class="forb">${x}</span>`).join("")}</div>`}
 if(gm==="big"){info="Eine große Frage zum Diskutieren. Sag deine Meinung und begründe sie mit <i>weil</i>.";
  inner=`<div class="gt" style="font-size:23px">${pick(BIG)}</div>`}
 app.innerHTML=`<div class="card">${back}<h2>🎲 Sprechspiele</h2><div class="chips">${GM.map(g=>`<button class="chip ${g[0]===gm?"sel":""}" onclick="gm='${g[0]}';games()">${g[1]}</button>`).join("")}</div>
 <p>${info}</p><div class="game">${inner}</div><div class="row"><span></span><button class="btn gold" onclick="games()">🔄 Neue Karte</button></div></div>`}

/* ---- Abschluss ---- */
function final(){
 const ltItems=[];LT.forEach(s=>{const all=[...s.x.matchAll(/\{([^}]+)\}/g)];
  all.forEach((m,idx)=>{let n=0;const ctx=s.x.replace(/\{([^}]+)\}/g,(mm,cc)=>n++===idx?"____":cc.split("|")[0]);
   const sent=ctx.split(/(?<=[.!?])\s/).find(z=>z.includes("____"));
   ltItems.push({pre:`<div class="quote" style="font-size:18px">${sent}</div>`,q:"Welches Wort passt in die Lücke?",o:m[1].split("|"),ex:s.ex[idx]})})});
 const items=shuffle([...whatItems(5),...shuffle(kompItems()).slice(0,3),...shuffle(fwItems()).slice(0,4),...shuffle(ltItems).slice(0,4),...shuffle(svItems()).slice(0,4)]);
 runMC("🏁 Abschluss-Mission",items,"final")}
function go(m){({cards,what,komp,films,fw,gaps,sv,sb:sbStart,rm,games,final})[m]();scrollTo(0,0)}
home();

</script>
</body>
</html>
