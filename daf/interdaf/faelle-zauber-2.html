<style>

table.t th{color:var(--soft);font-weight:500;font-size:15px}
table.t td:first-child,table.t th:first-child{text-align:left}

.dot{width:12px;height:12px;border-radius:50%;background:#DDD7CC}.dot.on{background:var(--petrol)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pick .opt.sel{border-color:var(--navy);background:#E7E9EF}
.baskets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.basket{font-family:inherit;border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px;font-size:16px;font-weight:600;cursor:pointer;color:var(--ink)}
.basket small{display:block;font-weight:400;color:var(--soft);font-size:14px;margin-top:2px}
.basket.ok{border-color:var(--ok);background:var(--dat-l)}.basket.bad{border-color:var(--bad);background:var(--bad-l)}
.verbcard{font-size:30px;font-weight:700;text-align:center;padding:22px;border-radius:18px;background:linear-gradient(135deg,#F2EEE5,#E9EEF5);color:var(--navy)}
.tok{display:inline-block;border:2px solid transparent;border-radius:10px;padding:0 6px;cursor:pointer;font-weight:600;background:#EFEBE3}
.tok:hover{border-color:var(--petrol)}

.tok.ok{background:var(--dat-l);color:var(--ok);border-color:var(--ok)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lvl{font-family:inherit;border:none;border-radius:18px;padding:14px;cursor:pointer;background:#fff;box-shadow:0 2px 10px rgba(34,50,79,.08);font-size:15px;color:var(--ink)}

@media(max-width:600px){body{font-size:17px}.sentence{font-size:20px}header h1{font-size:24px}.stars{float:none;display:inline-block;margin-bottom:8px}}

<script>
/* ================== DATEN ================== */
// g: m/f/n · di: Dativ mit „ein“ klingt natürlich · ai:false = Akkusativ nicht mit ein/kein · pd:false = Possessiv im Dativ unpassend
const ITEMS=[

 {s:"Der Zauberer",v:"gibt",d:["Lehrling","m"],a:["Zauberstab","m"],p:"sein",di:1},
 {s:"Der Papa",v:"kauft",d:["Sohn","m"],a:["Trikot","n"],p:"sein"},
 {s:"Die Schwester",v:"leiht",d:["Bruder","m"],a:["Taschenlampe","f"],p:"ihr"},

 {s:"Der Schiedsrichter",v:"zeigt",d:["Spieler","m"],a:["Karte","f"],p:"sein",di:1},
 {s:"Die Ärztin",v:"gibt",d:["Mädchen","n"],a:["Pflaster","n"],p:"ihr",di:1,pd:0},
 {s:"Die Forscherin",v:"zeigt",d:["Klasse","f"],a:["Dinoknochen","m"],p:"ihr",di:1},
 {s:"Der Briefträger",v:"bringt",d:["Nachbarin","f"],a:["Paket","n"],p:"sein",di:1},
 {s:"Wir",v:"geben",d:["Katze","f"],a:["Futter","n"],p:"unser",ai:0},
 {s:"Der Trainer",v:"erklärt",d:["Mannschaft","f"],a:["Spielplan","m"],p:"sein"},
 {s:"Du",v:"bringst",d:["Opa","m"],a:["Zeitung","f"],p:"dein"},
 {s:"Der König",v:"schenkt",d:["Ritter","m"],a:["Pferd","n"],p:"sein",di:1},
 {s:"Die Lehrerin",v:"zeigt",d:["Kind","n"],a:["Bild","n"],p:"ihr",di:1,pd:0},
 {s:"Ich",v:"gebe",d:["Pferd","n"],a:["Apfel","m"],p:"mein",di:1},
 {s:"Der Roboter",v:"bringt",d:["Mann","m"],a:["Werkzeug","n"],p:"sein",di:1,pd:0},
 {s:"Die Pilotin",v:"erklärt",d:["Mädchen","n"],a:["Flugzeug","n"],p:"ihr",di:1,pd:0},
 {s:"Der Onkel",v:"leiht",d:["Cousin","m"],a:["Helm","m"],p:"sein"}
];
const COMMON=new Set(["Ball","Hund","Katze","Oma","Opa","Mama","Baby","Apfel","Pferd","Kind","Bild","Brief","Bruder","Freund","Fahrrad","Heft","Mann","Sohn","Tante","Zeitung","Mädchen","Flasche","Schwert","Suppe","Rakete","Flugzeug","Klasse","Paket","Helm"]);
const VERBS=[
 ["sehen","A","Ich sehe den Drachen."],["finden","A","Er findet den Schatz."],["suchen","A","Wir suchen den Ball."],["besuchen","A","Ich besuche den Opa."],["anrufen","A","Sie ruft den Trainer an."],["fragen","A","Ich frage den Lehrer."],["lieben","A","Er liebt seinen Hund."],["essen","A","Der Drache isst den Kuchen."],
 ["helfen","D","Ich helfe dem Freund."],["danken","D","Wir danken der Oma."],["gefallen","D","Das Spiel gefällt dem Kind."],["gehören","D","Der Ball gehört dem Torwart."],["gratulieren","D","Ich gratuliere der Mannschaft."],["folgen","D","Der Hund folgt dem Ritter."],["zuhören","D","Wir hören der Lehrerin zu."],["vertrauen","D","Der König vertraut dem Ritter."],
 ["geben","DA","Ich gebe dem Hund den Knochen."],["schenken","DA","Er schenkt der Oma ein Bild."],["bringen","DA","Sie bringt dem Gast die Suppe."],["schicken","DA","Wir schicken dem Opa einen Brief."],["leihen","DA","Ich leihe dem Freund mein Skateboard."],["reichen","DA","Er reicht dem Kapitän das Fernrohr."],["zurückgeben","DA","Ich gebe dem Bruder die Lampe zurück."],["wegnehmen","DA","Der Pirat nimmt dem Kapitän die Karte weg."],["erklären","DA","Die Trainerin erklärt der Mannschaft den Plan."],["zeigen","DA","Der Pirat zeigt dem Kind den Schatz."]
];
const ART={der:{m:"der",f:"die",n:"das"}};
const DEF={D:{m:"dem",f:"der",n:"dem"},A:{m:"den",f:"die",n:"das"}};
function endFor(c,g,fam){ // fam: der | ein
  if(c==="D") return g==="f"?"er":"em";
  if(g==="m") return "en"; if(g==="f") return "e";
  return fam==="der"?"es":"";
}
const DEF_OPTS=["dem","den","der","die","das"];
const IND_OPTS=["einem","einen","einer","eine","ein"];
const END_OPTS=["em","en","er","e","es",""];
const showEnd=e=>e===""?"ohne Endung":"-"+e;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const lowerSubj=s=>/^(Ich|Du|Wir)$/.test(s)?s.toLowerCase():s.charAt(0).toLowerCase()+s.slice(1);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ======= Lücken bauen ======= */
// type: def | indef | der | ein
function makeGap(item,c,type){
  const [noun,g]=c==="D"?item.d:item.a;
  let fam,stem,kind;
  if(type==="def"){fam="der";stem="d";kind="def"}
  else if(type==="indef"){
    const ok=c==="D"?item.di:item.ai!==0;
    if(!ok){fam="der";stem="d";kind="def"} else {fam="ein";stem="ein";kind="indef"}
  }
  else if(type==="der"){fam="der";kind="stem";stem=(c==="D"&&item.di)?rnd(["dies","dies","jed"]):"dies"}
  else if(type==="welch"){fam="der";kind="stem";stem="welch"}
  else { // ein-Familie
    kind="stem";fam="ein";
    if(c==="D") stem=item.pd===0?"ein":(item.di?rnd([item.p,item.p,"kein"]):item.p);
    else if(item.pd===0) stem=rnd(["kein","ein"]);
    else stem=item.ai===0?item.p:rnd([item.p,item.p,"kein","ein"]);
  }
  const e=endFor(c,g,fam);
  const answer=kind==="def"?DEF[c][g]:(kind==="indef"?"ein"+e:e);
  return {c,g,noun,fam,stem,kind,answer,full:kind==="def"?DEF[c][g]:stem+e};
}
function optionsFor(gap){
  if(gap.kind==="def") return DEF_OPTS;
  if(gap.kind==="indef") return IND_OPTS;
  return END_OPTS;
}
function optLabel(gap,o){return gap.kind==="stem"?showEnd(o):o}

function explain(gap){return caseText(gap)+" "+explainForm(gap)}
function caseText(gap){
  return gap.c==="D"
    ? `<b>Wem?</b> ${cap(ART.der[gap.g])} ${gap.noun} bekommt etwas → <span class="dat">Dativ</span>.`
    : `<b>Was?</b> ${cap(ART.der[gap.g])} ${gap.noun} wird weitergegeben → <span class="akk">Akkusativ</span>.`;
}
function explainForm(gap){
  let form;
  const d=DEF[gap.c][gap.g];
  if(gap.kind==="def"){
    form=d===ART.der[gap.g]?`${cap(d)} bleibt im Akkusativ gleich: <b>${d} ${gap.noun}</b>. Nur <b>der</b> ändert sich zu <b>den</b>.`:`${cap(ART.der[gap.g])} ${gap.noun} wird im ${gap.c==="D"?"Dativ":"Akkusativ"} zu <b>${d} ${gap.noun}</b>.`;
  }else{
    const e=endFor(gap.c,gap.g,gap.fam);
    const pre=d.endsWith(e)&&e?d.slice(0,d.length-e.length):"d", dEnd=d.endsWith(e)&&e?e:d.slice(1);
    if(gap.fam==="ein"&&gap.c==="A"&&gap.g==="n"){
      form=`<b>Kleine Falle:</b> das ${gap.noun} → <b>${gap.stem} ${gap.noun}</b>. Die ein-Familie (ein, kein, mein, sein …) hat bei das-Wörtern im Akkusativ <b>keine Endung</b>.`;
    }else if(gap.fam==="der"&&gap.c==="A"&&gap.g==="n"){
      form=`d<span class="e">as</span> → <b>${gap.stem}<span class="e">es</span> ${gap.noun}</b>. Bei das-Wörtern hängt die der-Familie <b>-es</b> an.`;
    }else{
      form=`Gleiche Endung wie beim Artikel: ${pre}<span class="e">${dEnd}</span> → <b>${gap.stem}<span class="e">${e}</span> ${gap.noun}</b>.`;
    }
  }
  return form;
}
function render(item,gaps,question){
  // gaps[0]=Dativ-Lücke, gaps[1]=Akk-Lücke ; question: null | "D" | "A"
  const G=i=>`<span class="gap ${gaps[i].c}" id="gap${i}">${gaps[i].kind==="stem"?gaps[i].stem+"<span class='qq'>__</span>":"___"}</span>`;
  const chip=(g,noun,hide)=>hide?"":`<span class="chip">${ART.der[g]} ${noun}</span>`;
  const hD=gaps.hideD, hA=gaps.hideA;
  if(!question){
    return `${item.s} ${item.v} ${G(0)} ${item.d[0]}${chip(item.d[1],item.d[0],hD)} ${G(1)} ${item.a[0]}${chip(item.a[1],item.a[0],hA)}.`;
  }
  const subj=lowerSubj(item.s);
  if(question==="D"){ // Welchem ... ?
    let t=`${G(0)} ${item.d[0]}${chip(item.d[1],item.d[0],hD)} ${item.v} ${subj} ${G(1)} ${item.a[0]}${chip(item.a[1],item.a[0],hA)}?`;
    return t.replace(/^<span class="gap D" id="gap0">welch/,'<span class="gap D" id="gap0">Welch');
  }
  return `${G(1)} ${item.a[0]}${chip(item.a[1],item.a[0],hA)} ${item.v} ${subj} ${G(0)} ${item.d[0]}${chip(item.d[1],item.d[0],hD)}?`.replace(/^<span class="gap A" id="gap1">welch/,'<span class="gap A" id="gap1">Welch');
}

/* ================== STATE / UI ================== */
let STARS=0;
try{STARS=+localStorage.getItem("fz2stars")||0}catch(e){}
let UNLOCK=1;
try{UNLOCK=+localStorage.getItem("fz2lvl")||1}catch(e){}

document.getElementById("starBox").textContent="⭐ "+STARS;
const app=document.getElementById("app");
const backBtn=`<button class="back" onclick="home()">← Zur Übersicht</button>`;

const MODES=[
 ["📖","Das Zauberbuch","Schritt für Schritt: Verben, die zwei Fälle wollen – und der Endungs-Trick.","Zuerst lesen","book"],
 ["🧺","Verben-Ernte 2","Drei Körbe: nur Akkusativ, nur Dativ – oder beides?","Aufwärmen","harvest"],
 ["🎯","Wem? Was?","Finde im Satz den Dativ und den Akkusativ.","Stufe 1","roles"],
 ["🛡️","Artikel-Schmiede: der, die, das","dem oder den? der oder die? Mit bestimmten Artikeln.","Stufe 2","def"],

 ["🕵️","Fehler-Jagd","In jedem Satz versteckt sich genau ein Fehler. Finde ihn!","Profi","errors"],

function home(){
  app.innerHTML=`<div class="card"><h2>Willkommen zurück, Zauberlehrling!</h2>
  <p>Du kannst schon Verben mit <span class="akk">Akkusativ</span> und mit <span class="dat">Dativ</span> ernten. Jetzt kommen die starken Verben, die <b>beide Fälle</b> auf einmal wollen. Fang am besten mit dem Zauberbuch an und arbeite dich dann von oben nach unten durch.</p>
  <div class="merk"><span class="nom">Der Nominativ</span> gibt <span class="dat">dem Dativ</span> <span class="akk">einen Akkusativ</span>.</div></div>
  <div class="grid">${MODES.map(m=>`<button class="mode" onclick="go('${m[4]}')"><div class="ic">${m[0]}</div><h3>${m[1]}</h3><p>${m[2]}</p><span class="tag">${m[3]}</span></button>`).join("")}</div>`;

/* ================== LÜCKEN-QUIZ ================== */
let gq;
const GQ_TITLE={def:"🛡️ Artikel-Schmiede: der, die, das",indef:"🚀 Artikel-Schmiede: ein, eine",mix:"⚔️ Gemischtes Duell",family:"🐉 Familien-Werkstatt"};
function gapQuiz(mode,opts={}){
  gq={mode,list:shuffle(ITEMS).slice(0,opts.n||12),i:0,score:0,total:0,tower:opts.tower||null,cfg:opts.cfg||null};
  drawGap();
}
function buildQuestion(it,mode,cfg){
  let tD,tA,q=null;
  if(cfg){ tD=rnd(cfg.types); tA=rnd(cfg.types); if(cfg.q&&Math.random()<.35){q=rnd(["D","A"])} }
  else if(mode==="def"){tD=tA="def"}
  else if(mode==="indef"){tD="indef";tA="indef"}
  else if(mode==="mix"){tD=rnd(["def","indef"]);tA=rnd(["def","indef"])}
  else if(mode==="family"){const f=rnd(["der","ein"]);tD=rnd([f,"der","ein"]);tA=rnd(["der","ein"]);if(Math.random()<.3)q=rnd(["D","A"])}
  if(q==="D")tD="welch"; if(q==="A")tA="welch";
  let gaps=[makeGap(it,"D",tD),makeGap(it,"A",tA)];
  for(let k=0;k<8&&gaps[0].stem==="kein"&&gaps[1].stem==="kein";k++) gaps[1]=makeGap(it,"A",tA);
  if(gaps[0].stem==="kein"&&gaps[1].stem==="kein") gaps[1]=makeGap(it,"A","def");
  if(cfg&&cfg.hide){gaps.hideD=COMMON.has(it.d[0]);gaps.hideA=COMMON.has(it.a[0])}
  return {gaps,q};
}
function drawGap(){
  if(gq.i>=gq.list.length) return gq.tower?towerDone():finish(gq.score,gq.total,gq.mode);
  const it=gq.list[gq.i]; const {gaps,q}=buildQuestion(it,gq.mode,gq.cfg); gq.cur={it,gaps,q,done:0};
  const title=gq.tower?`🏰 Champion-Turm · Stockwerk ${gq.tower}`:GQ_TITLE[gq.mode];
  const order=q==="A"?[1,0]:[0,1];
  app.innerHTML=`<div class="card">${backBtn}<h2>${title}</h2><div class="bar"><i style="width:${gq.i/gq.list.length*100}%"></i></div>
  <p class="sentence">${render(it,gaps,q)}</p>
  ${order.map(k=>{const g=gaps[k];return `<div class="slot"><div class="lab">${g.c==="D"?'<span class="dat">Wem? · Dativ</span>':'<span class="akk">Was? · Akkusativ</span>'} – ${g.kind==="stem"?`Welche Endung bekommt <b>${g.stem==="welch"&&k===order[0]&&q?"Welch":g.stem}…</b>?`:"Welcher Artikel passt?"}</div>
   <div class="opts" id="o${k}">${optionsFor(g).map(o=>`<button class="opt" data-v="${o}" onclick="pickGap(${k},this)">${optLabel(g,o)}</button>`).join("")}</div><div id="e${k}"></div></div>`}).join("")}
  <div class="row"><span class="count">${gq.i+1} / ${gq.list.length}</span><button class="btn" id="nx" disabled onclick="gq.i++;drawGap()">Weiter →</button></div></div>`;
}
function pickGap(k,el){
  const {it,gaps,q}=gq.cur; const g=gaps[k]; const v=el.dataset.v;
  document.querySelectorAll(`#o${k} .opt`).forEach(b=>{b.disabled=true;if(b.dataset.v===g.answer)b.classList.add("ok")});
  const right=v===g.answer; gq.total++; if(right){gq.score++;addStar()}else el.classList.add("bad");
  const gapEl=document.getElementById("gap"+k);
  let shown=g.full; if(q&&g.stem==="welch")shown=cap(shown);
  gapEl.innerHTML=shown; gapEl.classList.add(right?"done-ok":"done-bad"); if(!right){gapEl.classList.remove("done-bad");gapEl.classList.add("done-ok")}
  document.getElementById("e"+k).innerHTML=`<div class="ex ${right?"":"badx"}">${right?"✔ Richtig! ":`✘ Du hast „${optLabel(g,v)}“ gewählt. Richtig ist „${g.full}“. `}${explain(g,it)}</div>`;
  if(++gq.cur.done===2) document.getElementById("nx").disabled=false;
}

/* ================== ENDUNGS-DETEKTIV ================== */
let ed;
function ending(){
  const nouns=[["Ritter","m"],["Ball","m"],["Kapitän","m"],["Prinzessin","f"],["Rakete","f"],["Schatzkarte","f"],["Pferd","n"],["Schwert","n"],["Fahrrad","n"]];
  const stems=[["dies","der"],["jed","der"],["welch","der"],["kein","ein"],["mein","ein"],["sein","ein"],["ihr","ein"],["unser","ein"],["ein","ein"]];
  const list=[];
  for(let i=0;i<14;i++){const [n,g]=rnd(nouns),[st,fam]=rnd(stems),c=rnd(["D","A"]);list.push({n,g,st,fam,c})}
  ed={list,i:0,score:0};drawEnding();
}
function drawEnding(){
  if(ed.i>=ed.list.length) return finish(ed.score,ed.list.length,"ending");
  const x=ed.list[ed.i]; const d=DEF[x.c][x.g];
  app.innerHTML=`<div class="card">${backBtn}<h2>🔍 Endungs-Detektiv</h2><div class="bar"><i style="width:${ed.i/ed.list.length*100}%"></i></div>
  <p>Schau dir den Artikel an und finde die passende Endung.</p>
  <p class="sentence">${x.c==="D"?'<span class="dat">Dativ · Wem?</span>':'<span class="akk">Akkusativ · Was?</span>'}&nbsp;&nbsp; <b>${d}</b> ${x.n} &nbsp;→&nbsp; <span class="gap ${x.c}" id="g">${x.st}__</span> ${x.n}</p>
  <div class="opts" id="oo">${END_OPTS.map(o=>`<button class="opt" data-v="${o}" onclick="pickEnd(this)">${showEnd(o)}</button>`).join("")}</div><div id="fb"></div>
  <div class="row"><span class="count">${ed.i+1} / ${ed.list.length}</span><button class="btn" id="nx" disabled onclick="ed.i++;drawEnding()">Weiter →</button></div></div>`;
}
function pickEnd(el){
  const x=ed.list[ed.i]; const ans=endFor(x.c,x.g,x.fam); const gap={c:x.c,g:x.g,noun:x.n,fam:x.fam,stem:x.st,kind:"stem"};
  document.querySelectorAll("#oo .opt").forEach(b=>{b.disabled=true;if(b.dataset.v===ans)b.classList.add("ok")});
  const right=el.dataset.v===ans; if(right){ed.score++;addStar()}else el.classList.add("bad");
  const g=document.getElementById("g");g.innerHTML=x.st+ans;g.classList.add("done-ok");
  const fam=x.fam==="der"?"der-Familie (dieser, jeder, welcher)":"ein-Familie (ein, kein, mein, sein, ihr, unser)";
  document.getElementById("fb").innerHTML=`<div class="ex ${right?"":"badx"}">${right?"✔ Stark! ":"✘ Fast! "}<b>${x.st}</b> gehört zur ${fam}. ${explainForm(gap)}</div>`;
  document.getElementById("nx").disabled=false;
}

/* ================== FEHLER-JAGD ================== */
let er;
function errors(){er={list:shuffle(ITEMS).slice(0,10),i:0,score:0};drawErr()}
function drawErr(){
  if(er.i>=er.list.length) return finish(er.score,er.list.length*2,"errors");
  const it=er.list[er.i];
  const tD=rnd(["def","indef","der","ein"]),tA=rnd(["def","indef","der","ein"]);
  const gaps=[makeGap(it,"D",tD),makeGap(it,"A",tA)];
  const bad=Math.random()<.5?0:1; const g=gaps[bad];
  const other=g.c==="D"?"A":"D";
  let wrong;
  if(g.kind==="def") wrong=DEF[other][g.g];
  else wrong=(g.kind==="indef"?"ein":g.stem)+endFor(other,g.g,g.fam);
  if(wrong===g.full){wrong=g.kind==="def"?(g.g==="f"?"den":"der"):(g.kind==="indef"?"ein":g.stem)+(g.c==="D"?"en":"em")}
  const words=[gaps[0].full,gaps[1].full]; words[bad]=wrong;
  er.cur={it,gaps,bad,wrong,step:1};
  const chip=(n,gg)=>`<span class="chip">${ART.der[gg]} ${n}</span>`;
  app.innerHTML=`<div class="card">${backBtn}<h2>🕵️ Fehler-Jagd</h2><div class="bar"><i style="width:${er.i/er.list.length*100}%"></i></div>
  <p>Genau <b>ein</b> Wort ist falsch. Tippe es an!</p>
  <p class="sentence">${it.s} ${it.v} <span class="tok" id="t0" onclick="pickTok(0)">${words[0]}</span> ${it.d[0]}${chip(it.d[0],it.d[1])} <span class="tok" id="t1" onclick="pickTok(1)">${words[1]}</span> ${it.a[0]}${chip(it.a[0],it.a[1])}.</p>
  <div id="fix"></div><div id="fb"></div>
  <div class="row"><span class="count">${er.i+1} / ${er.list.length}</span><button class="btn" id="nx" disabled onclick="er.i++;drawErr()">Weiter →</button></div></div>`;
}
function pickTok(k){
  const c=er.cur; if(c.step!==1)return; c.step=2;
  const right=k===c.bad; if(right){er.score++;addStar()}
  document.getElementById("t"+c.bad).classList.add("bad");
  if(!right)document.getElementById("t"+k).classList.add("ok");
  const g=c.gaps[c.bad];
  const opts=shuffle([...new Set([g.full,c.wrong,...(g.kind==="def"?DEF_OPTS:g.kind==="indef"?IND_OPTS:END_OPTS.map(e=>g.stem+e))])]).slice(0,5);
  if(!opts.includes(g.full))opts[0]=g.full;
  document.getElementById("fix").innerHTML=`<div class="ex ${right?"":"badx"}">${right?"✔ Gefunden! ":"✘ Das war richtig – der Fehler steckt im anderen Wort. "}Und wie heißt es richtig?</div>
  <div class="opts" id="fo" style="margin-top:10px">${opts.map(o=>`<button class="opt" data-v="${o}" onclick="pickFix(this)">${o}</button>`).join("")}</div>`;
}
function pickFix(el){
  const c=er.cur,g=c.gaps[c.bad];
  document.querySelectorAll("#fo .opt").forEach(b=>{b.disabled=true;if(b.dataset.v===g.full)b.classList.add("ok")});
  const right=el.dataset.v===g.full; if(right){er.score++;addStar()}else el.classList.add("bad");
  const t=document.getElementById("t"+c.bad);t.textContent=g.full;t.classList.remove("bad");t.classList.add("ok");
  document.getElementById("fb").innerHTML=`<div class="ex">„${c.wrong}“ wäre der ${g.c==="D"?"Akkusativ":"Dativ"}. Hier brauchen wir den ${g.c==="D"?'<span class="dat">Dativ</span>':'<span class="akk">Akkusativ</span>'}: ${explain(g,c.it)}</div>`;
  document.getElementById("nx").disabled=false;
}

const LEVELS=[
 {name:"Stockwerk 1",sub:"der, die, das",types:["def"]},
 {name:"Stockwerk 2",sub:"ein, eine + bestimmt",types:["def","indef"]},
 {name:"Stockwerk 3",sub:"dieser, jeder, welcher",types:["def","der"],q:1},
 {name:"Stockwerk 4",sub:"mein, sein, ihr, kein",types:["indef","ein"]},
 {name:"Stockwerk 5",sub:"Alles gemischt, ohne Hilfe",types:["def","indef","der","ein"],q:1,hide:1}
];
function tower(){
  app.innerHTML=`<div class="card">${backBtn}<h2>🏰 Champion-Turm</h2>
  <p>Jedes Stockwerk hat 8 Sätze. Mit mindestens <b>13 von 16</b> richtigen Lücken öffnet sich die nächste Tür. Ganz oben fehlen bei bekannten Wörtern die Hilfe-Kärtchen – da zeigst du, was du wirklich kannst!</p>
  <div class="levels">${LEVELS.map((l,i)=>`<button class="lvl ${i+1>UNLOCK?"lock":""}" ${i+1>UNLOCK?"disabled":""} onclick="startLevel(${i+1})"><b>${i+1>UNLOCK?"🔒":"🚪"} ${l.name}</b>${l.sub}</button>`).join("")}</div></div>`;
}
function startLevel(n){gapQuiz("tower",{n:8,tower:n,cfg:LEVELS[n-1]})}
function towerDone(){
  const n=gq.tower, pass=gq.score>=13;
  if(pass&&n>=UNLOCK&&n<5){UNLOCK=n+1;try{localStorage.setItem("fz2lvl",UNLOCK)}catch(e){}}
  if(pass)addStar(5);
  const top=pass&&n===5;
  app.innerHTML=`<div class="card center">${backBtn}<div class="big">${top?"🏆":pass?"🚪✨":"💪"}</div>
  <h2>${top?"Du bist Fällezauber-Champion!":pass?"Tür geöffnet!":"Fast geschafft!"}</h2>
  <p>${gq.score} von 16 Lücken richtig.</p>
  <p>${top?"Du beherrschst Dativ und Akkusativ mit allen Familien. Großartig!":pass?`Stockwerk ${n+1} wartet auf dich. Bonus: +5 ⭐`:"Du brauchst 13 richtige. Lies dir die Erklärungen noch einmal durch und probier es gleich nochmal!"}</p>
  <div class="row" style="justify-content:center"><button class="btn sec" onclick="startLevel(${n})">Nochmal</button>${pass&&n<5?`<button class="btn gold" onclick="startLevel(${n+1})">Stockwerk ${n+1} →</button>`:""}<button class="btn" onclick="tower()">Zum Turm</button></div></div>`;
}

/* ================== ERGEBNIS ================== */
const NEXT={harvest:"roles",roles:"def",def:"indef",indef:"mix",mix:"ending",ending:"family",family:"errors",errors:"tower"};
function finish(s,t,mode){
  const p=t?s/t:0;
  app.innerHTML=`<div class="card center">${backBtn}<div class="big">${p>=.9?"🌟":p>=.7?"⭐":"💪"}</div>
  <h2>${p>=.9?"Meisterhaft!":p>=.7?"Sehr gut gemacht!":"Weiter üben, du schaffst das!"}</h2>
  <p>${s} von ${t} richtig.</p>
  <div class="row" style="justify-content:center"><button class="btn sec" onclick="go('${mode}')">Nochmal</button>${NEXT[mode]?`<button class="btn gold" onclick="go('${NEXT[mode]}')">Nächste Stufe →</button>`:""}</div></div>`;
}
home();
</script>
</body>
</html>
